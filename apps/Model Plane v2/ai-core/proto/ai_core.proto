syntax = "proto3";

package ai_core.v2;

option py_generic_services = false;

// ── ChatService ─────────────────────────────────────────────────────────────

message ChatMessage {
  string role    = 1;  // system | user | assistant | tool
  string content = 2;
  string name    = 3;
}

message ChatRequest {
  string              request_id   = 1;
  string              org_id       = 2;
  string              session_id   = 3;
  repeated ChatMessage messages    = 4;
  string              model        = 5;
  string              provider     = 6;
  float               temperature  = 7;
  int32               max_tokens   = 8;
  bool                stream       = 9;
}

message ChatResponse {
  string request_id = 1;
  string content    = 2;
  string model_used = 3;
  string stop_reason = 4;
  int32  input_tokens  = 5;
  int32  output_tokens = 6;
}

message ChatChunk {
  string request_id = 1;
  string delta      = 2;
  bool   done       = 3;
  string model_used = 4;
}

message EmbeddingRequest {
  string request_id = 1;
  string org_id     = 2;
  string text       = 3;
  string model      = 4;
  string provider   = 5;
}

message EmbeddingResponse {
  string request_id = 1;
  repeated float vector = 2;
  string model_used     = 3;
}

message ModelInfo {
  string id       = 1;
  string provider = 2;
  string modality = 3;
  bool   streaming = 4;
}

message ListModelsRequest {
  string modality = 1;
  string provider = 2;
}

message ListModelsResponse {
  repeated ModelInfo models = 1;
}

service ChatService {
  rpc ChatCompletion      (ChatRequest)       returns (ChatResponse);
  rpc ChatCompletionStream(ChatRequest)       returns (stream ChatChunk);
  rpc CreateEmbedding     (EmbeddingRequest)  returns (EmbeddingResponse);
  rpc ListModels          (ListModelsRequest) returns (ListModelsResponse);
}

// ── SpeechService ────────────────────────────────────────────────────────────

message TTSRequest {
  string request_id = 1;
  string org_id     = 2;
  string text       = 3;
  string voice      = 4;
  string provider   = 5;
  string language   = 6;
}

message TTSResponse {
  string request_id  = 1;
  bytes  audio_bytes = 2;
  string model_used  = 3;
}

message TranscribeRequest {
  string request_id  = 1;
  string org_id      = 2;
  bytes  audio_bytes = 3;
  string mimetype    = 4;
  string provider    = 5;
  string language    = 6;
}

message TranscribeResponse {
  string request_id = 1;
  string text       = 2;
  float  confidence = 3;
  string language   = 4;
  string model_used = 5;
}

message TranscribeChunk {
  string request_id = 1;
  string partial    = 2;
  bool   is_final   = 3;
}

message DetectLanguageRequest {
  string request_id  = 1;
  string org_id      = 2;
  bytes  audio_bytes = 3;
  string mimetype    = 4;
}

message DetectLanguageResponse {
  string request_id = 1;
  string language   = 2;
  float  confidence = 3;
}

message VoiceInfo {
  string id       = 1;
  string name     = 2;
  string language = 3;
  string gender   = 4;
  string provider = 5;
}

message ListVoicesRequest {
  string provider = 1;
  string language = 2;
}

message ListVoicesResponse {
  repeated VoiceInfo voices = 1;
}

service SpeechService {
  rpc TextToSpeech     (TTSRequest)            returns (TTSResponse);
  rpc Transcribe       (TranscribeRequest)     returns (TranscribeResponse);
  rpc TranscribeStream (TranscribeRequest)     returns (stream TranscribeChunk);
  rpc DetectLanguage   (DetectLanguageRequest) returns (DetectLanguageResponse);
  rpc ListVoices       (ListVoicesRequest)     returns (ListVoicesResponse);
}

// ── ImageService ─────────────────────────────────────────────────────────────

message ImageGenerateRequest {
  string request_id = 1;
  string org_id     = 2;
  string prompt     = 3;
  string model      = 4;
  string provider   = 5;
}

message ImageGenerateResponse {
  string request_id = 1;
  string content    = 2;
  string model_used = 3;
  string provider   = 4;
}

message ImageAnalyzeRequest {
  string request_id     = 1;
  string org_id         = 2;
  string url            = 3;
  bytes  image_bytes    = 4;
  string prompt         = 5;
  string model          = 6;
  string provider       = 7;
}

message ImageAnalyzeResponse {
  string request_id = 1;
  string description = 2;
  string model_used  = 3;
}

message OCRRequest {
  string request_id  = 1;
  string org_id      = 2;
  string url         = 3;
  bytes  image_bytes = 4;
  string provider    = 5;
}

message OCRResponse {
  string request_id = 1;
  string text       = 2;
  string model_used = 3;
}

service ImageService {
  rpc GenerateImage (ImageGenerateRequest) returns (ImageGenerateResponse);
  rpc AnalyzeImage  (ImageAnalyzeRequest)  returns (ImageAnalyzeResponse);
  rpc ExtractText   (OCRRequest)           returns (OCRResponse);
}

// ── TranslationService ───────────────────────────────────────────────────────

message TranslateRequest {
  string request_id     = 1;
  string org_id         = 2;
  string text           = 3;
  string source_language = 4;
  string target_language = 5;
}

message TranslateResponse {
  string request_id        = 1;
  string translated_text   = 2;
  string model_used        = 3;
  string detected_language = 4;  // auto-detected source language (empty when source was explicit)
  float  confidence        = 5;  // detection confidence [0.0–1.0]
}

// ── Batch translate ───────────────────────────────────────────────────────────

message BatchTranslateItem {
  string text = 1;
}

message TranslationItem {
  string original_text     = 1;
  string translated_text   = 2;
  string detected_language = 3;
}

message BatchTranslateRequest {
  string request_id               = 1;
  string org_id                   = 2;
  repeated BatchTranslateItem items = 3;
  string source_language          = 4;
  string target_language          = 5;
}

message BatchTranslateResponse {
  string request_id                   = 1;
  repeated TranslationItem translations = 2;
  string model_used                   = 3;
}

// ── Language detection ────────────────────────────────────────────────────────

message DetectTextLanguageRequest {
  string request_id = 1;
  string org_id     = 2;
  string text       = 3;
}

// Rich multi-candidate detection result for text (translation service)
message LanguageDetection {
  string language   = 1;
  float  confidence = 2;
}

message DetectTextLanguageResponse {
  string                    request_id = 1;
  repeated LanguageDetection detections = 2;
}

// ── Supported languages ───────────────────────────────────────────────────────

message SupportedLanguage {
  string code        = 1;
  string name        = 2;
  string native_name = 3;
}

message ListLanguagesResponse {
  repeated SupportedLanguage languages = 1;
}

message Empty {}

service TranslationService {
  rpc Translate       (TranslateRequest)           returns (TranslateResponse);
  rpc BatchTranslate  (BatchTranslateRequest)      returns (BatchTranslateResponse);
  rpc DetectLanguage  (DetectTextLanguageRequest)  returns (DetectTextLanguageResponse);
  rpc ListLanguages   (Empty)                      returns (ListLanguagesResponse);
}

// ── DocumentService ──────────────────────────────────────────────────────────

message DocumentRequest {
  string request_id     = 1;
  string org_id         = 2;
  string url            = 3;
  bytes  content_bytes  = 4;
  string model          = 5;
}

message DocumentAnalysisResponse {
  string request_id    = 1;
  string model         = 2;
  string status        = 3;
  string fields_json   = 4;  // JSON-encoded map
  string tables_json   = 5;  // JSON-encoded list
  repeated string paragraphs = 6;
}

service DocumentService {
  rpc AnalyzeDocument (DocumentRequest) returns (DocumentAnalysisResponse);
  rpc ExtractLayout   (DocumentRequest) returns (DocumentAnalysisResponse);
  rpc ExtractForm     (DocumentRequest) returns (DocumentAnalysisResponse);
  rpc ParseReceipt    (DocumentRequest) returns (DocumentAnalysisResponse);
  rpc ParseInvoice    (DocumentRequest) returns (DocumentAnalysisResponse);
}
