[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reasoning-runtime"
version = "0.1.0"
description = "Shared LLM provider runtime for Model Plane v2 services"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings>=2.5.0,<3.0",
    "redis>=5.0.0,<6.0",
    "httpx>=0.27.0,<1.0",
    "openai>=1.50.0,<2.0",
    "anthropic[beta]>=0.50.0,<1.0",
    "google-genai>=1.0.0,<2.0",
    "cohere>=5.10.0,<6.0",
    "mistralai>=1.2.0,<2.0",
    "boto3>=1.35.0,<2.0",
    "starlette>=0.38.0,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["reasoning_runtime"]
