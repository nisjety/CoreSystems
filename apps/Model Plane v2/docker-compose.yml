# ============================================================================
# ⛔ DEPRECATED — DO NOT USE ⛔
# ----------------------------------------------------------------------------
# Model Plane v2 is decommissioned as of 2026-05-21. The canonical Model Plane
# lives at apps/Model Plane/ (Go + Rust, gRPC, native structured_output_schema).
# See ./MODEL_PLANE_V2_ARCHITECTURE.md for the migration map.
#
# `docker compose up` here will still work for archival reproducibility but
# nothing in production should depend on it. New tooling MUST land in v1.
# ============================================================================
name: model-plane-v2-DEAD

services:
  # ==========================================================================
  # INFRA — own stack (mirrors Model Plane v1 pattern)
  # ==========================================================================

  postgres:
    image: postgres:16-alpine
    container_name: reasoning-v2-postgres
    restart: unless-stopped
    networks:
      - reasoning-net
    environment:
      POSTGRES_USER: reasoning_user
      POSTGRES_PASSWORD: reasoning_secure_password_2026
      POSTGRES_DB: model_plane_v2_db
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    ports:
      - "55433:5432"
    volumes:
      - reasoning-v2-postgres-data:/var/lib/postgresql/data
      - ./init-v2-database.sql:/docker-entrypoint-initdb.d/001-init-databases.sql:ro
    shm_size: "128mb"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "effective_cache_size=256MB"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "log_min_messages=warning"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reasoning_user -d model_plane_v2_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: reasoning-v2-redis
    restart: unless-stopped
    networks:
      - reasoning-net
    ports:
      - "6390:6379"
    volumes:
      - reasoning-v2-redis-data:/data
    command: >
      redis-server
      --requirepass reasoning_redis_password_2026
      --appendonly yes
      --maxmemory 96mb
      --maxmemory-policy allkeys-lru
      --tcp-backlog 128
      --hz 10
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "reasoning_redis_password_2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    container_name: model-plane-nats
    restart: unless-stopped
    networks:
      - reasoning-net
    ports:
      - "4227:4222"
      - "8227:8222"
    command: ["--js", "--sd", "/data", "-m", "8222"]
    volumes:
      - model-plane-nats-data:/data
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8222/varz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: reasoning-v2-minio
    restart: unless-stopped
    networks:
      - reasoning-net
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - reasoning-v2-minio-data:/data
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # agent-core v2 — parallel to v1 agent-core on port 8001
  # ==========================================================================
  agent-core-v2:
    build:
      context: ./agent-core
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./shared/reasoning_runtime
    container_name: agent-core-v2
    restart: unless-stopped
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 15s
    networks:
      reasoning-net:
        aliases:
          - agent-core-v2
      inter-plane-bus:
        aliases:
          - agent-core-v2
    ports:
      - "8102:8002"
    environment:
      SERVICE_NAME: agent-core-v2
      ENVIRONMENT: production
      DEBUG: "false"
      HOST: "0.0.0.0"
      PORT: "8002"
      GRPC_PORT: "50053"

      # Postgres — shared reasoning-postgres, separate DB
      POSTGRES_HOST: reasoning-v2-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: agent_core_v2_db
      POSTGRES_USER: reasoning_user
      POSTGRES_PASSWORD: reasoning_secure_password_2026

      # Redis — shared reasoning-redis, DB 2
      REDIS_URL: redis://:reasoning_redis_password_2026@reasoning-v2-redis:6379/2

      # NATS cross-plane (velion-nats)
      NATS_URL: nats://velion-nats:4222
      NATS_TOKEN: ""

      # NATS local (reasoning-nats) — intra-plane only
      NATS_LOCAL_URL: nats://model-plane-nats:4222

      # NATS control-plane — for publishing usage.{org}.llm to billing-core
      # velion-nats is on inter-plane-bus; billing-core subscribes there
      CONTROL_PLANE_NATS_URL: nats://velion-nats:4222
      CONTROL_PLANE_NATS_TOKEN: ""

      # v2 service URLs (replace v1 AI-Core)
      CAPABILITY_CORE_URL: http://capability-core-v2:8004
      LLM_WORKER_URL: http://llm-worker:8005
      LLM_TIMEOUT: "120"
      TOOL_EXECUTION_API_KEY: ${TOOL_EXECUTION_API_KEY:-}

      # Data Plane URLs (replaces documents-worker)
      DATA_PLANE_RETRIEVAL_URL: http://data-retrieval-service:8004
      DATA_PLANE_DOCUMENTS_URL: http://data-documents-service:8001

      # LLM keys
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}

      # Agent runtime
      PLANNER_MODEL: claude-haiku-4-5
      PLANNER_PROVIDER: anthropic
      MAX_RUN_ACTIONS: "10"
      WORKER_COUNT: "2"
      LEASE_TTL_SECONDS: "300"

      # Internal auth
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}

      # Data Plane internal auth key (separate from MP v2's own INTERNAL_API_KEY)
      DATA_PLANE_INTERNAL_KEY: ${DATA_PLANE_INTERNAL_KEY:-}

      # Control Plane — auth-core (JWT validation) and org-core (RBAC, quotas)
      AUTH_CORE_URL: http://auth-core:3011
      ORG_CORE_URL: http://org-core:8080

      # OpenTelemetry (optional — set to Jaeger/OTEL collector endpoint)
      OTEL_EXPORTER_ENDPOINT: ${OTEL_EXPORTER_ENDPOINT:-}

      # Temporal (Phase 1 — durable workflows)
      TEMPORAL_HOST: temporal-server:7233
      TEMPORAL_NAMESPACE: velion
      TEMPORAL_TASK_QUEUE: agent-core

      # Letta (Phase 5 — long-term memory)
      LETTA_API_URL: http://letta-server:8283
      LETTA_ENABLED: "${LETTA_ENABLED:-false}"

      # Self-improvement (Phases A–D)
      TRAJECTORY_RECORDING_ENABLED: "true"
      ORG_INSIGHTS_INTERVAL_MINUTES: "30"
      ATROPOS_EXPORT_ENABLED: "true"
      OBJECT_STORAGE_ENDPOINT: "${OBJECT_STORAGE_ENDPOINT:-http://minio:9000}"
      OBJECT_STORAGE_ACCESS_KEY: "${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}"
      OBJECT_STORAGE_SECRET_KEY: "${OBJECT_STORAGE_SECRET_KEY:-minioadmin}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      minio:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==========================================================================
  # execution-core — runner lifecycle, workspace & artifact management
  # ==========================================================================
  execution-core-v2:
    build:
      context: ./execution-core
      dockerfile: Dockerfile
    container_name: execution-core-v2
    restart: unless-stopped
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 15s
    networks:
      reasoning-net:
        aliases:
          - execution-core-v2
      inter-plane-bus:
        aliases:
          - execution-core-v2
    ports:
      - "8103:8003"
    environment:
      SERVICE_NAME: execution-core
      ENVIRONMENT: production
      DEBUG: "false"
      HOST: "0.0.0.0"
      PORT: "8003"

      # Postgres — shared reasoning-postgres, separate DB
      POSTGRES_HOST: reasoning-v2-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: execution_core_db
      POSTGRES_USER: reasoning_user
      POSTGRES_PASSWORD: reasoning_secure_password_2026

      # Redis — shared reasoning-redis, DB 3
      REDIS_URL: redis://:reasoning_redis_password_2026@reasoning-v2-redis:6379/3

      # NATS cross-plane (velion-nats)
      NATS_URL: nats://velion-nats:4222
      NATS_TOKEN: ""

      # NATS local (reasoning-nats) — intra-plane only
      NATS_LOCAL_URL: nats://model-plane-nats:4222

      # Object storage (minio)
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      OBJECT_STORAGE_BUCKET: velion-artifacts
      OBJECT_STORAGE_REGION: us-east-1

      # Runner config
      RUNNER_HEARTBEAT_INTERVAL: "30"
      RUNNER_LEASE_TTL: "300"
      MAX_CONCURRENT_RUNNERS: "10"
      WORKSPACE_BASE_PATH: /tmp/workspaces

      # Internal auth
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')"]
      interval: 60s
      timeout: 10s
      retries: 3
  # ==========================================================================
  # capability-core — tool catalog, MCP registry, plugins, model routing
  # ==========================================================================
  capability-core-v2:
    build:
      context: ./capability-core
      dockerfile: Dockerfile
    container_name: capability-core-v2
    restart: unless-stopped
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 15s
    networks:
      reasoning-net:
        aliases:
          - capability-core-v2
      inter-plane-bus:
        aliases:
          - capability-core-v2
    ports:
      - "8104:8004"
    environment:
      SERVICE_NAME: capability-core
      ENVIRONMENT: production
      SERVICE_VERSION: "0.1.0"
      DEBUG: "false"
      HOST: "0.0.0.0"
      PORT: "8004"

      # Postgres — shared reasoning-postgres, separate DB
      POSTGRES_HOST: reasoning-v2-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: capability_core_db
      POSTGRES_USER: reasoning_user
      POSTGRES_PASSWORD: reasoning_secure_password_2026

      # Redis — shared reasoning-redis, DB 4
      REDIS_URL: redis://:reasoning_redis_password_2026@reasoning-v2-redis:6379/4

      # NATS local (reasoning-nats) — intra-plane only
      NATS_URL: nats://model-plane-nats:4222
      NATS_TOKEN: ""

      # NATS cross-plane (velion-nats)
      NATS_LOCAL_URL: nats://velion-nats:4222

      # Internal auth
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # --------------------------------------------------------------------------
  # cost-core-v2 — cost ledger & analytics (extracted V7/V9)  (port 8106:8006)
  # --------------------------------------------------------------------------
  cost-core-v2:
    build:
      context: ./cost-core
      dockerfile: Dockerfile
    container_name: cost-core-v2
    restart: unless-stopped
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 15s
    networks:
      reasoning-net:
        aliases:
          - cost-core-v2
      inter-plane-bus:
        aliases:
          - cost-core-v2
    ports:
      - "8106:8006"
    environment:
      SERVICE_NAME: cost-core
      ENVIRONMENT: production
      DEBUG: "false"
      HOST: "0.0.0.0"
      PORT: "8006"
      POSTGRES_HOST: reasoning-v2-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: cost_core_v2_db
      POSTGRES_USER: reasoning_user
      POSTGRES_PASSWORD: reasoning_secure_password_2026
      REDIS_URL: redis://:reasoning_redis_password_2026@reasoning-v2-redis:6379/4
      NATS_URL: nats://velion-nats:4222
      NATS_LOCAL_URL: nats://model-plane-nats:4222
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/health')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # --------------------------------------------------------------------------
  # llm-worker — stateless LLM executor  (port 8105:8005)
  # --------------------------------------------------------------------------
  llm-worker:
    build:
      context: ./llm-worker
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./shared/reasoning_runtime
    container_name: llm-worker
    restart: unless-stopped
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 15s
    networks:
      reasoning-net:
        aliases:
          - llm-worker
      inter-plane-bus:
        aliases:
          - llm-worker
    ports:
      - "8105:8005"
    environment:
      SERVICE_NAME: llm-worker
      ENVIRONMENT: production
      DEBUG: "false"

      # Provider API keys
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}

      # Azure OpenAI
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2025-01-01-preview}

      # Ollama
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

      # Redis — shared reasoning-redis, DB 5 (rate limiting)
      REDIS_URL: redis://:reasoning_redis_password_2026@reasoning-v2-redis:6379/5

      # NATS (velion-nats)
      NATS_URL: nats://velion-nats:4222
      NATS_TOKEN: ""

      # Object storage (MinIO)
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-minioadmin}
      OBJECT_STORAGE_BUCKET: velion-completions

      # Rate limits
      RATE_LIMIT_RPM: "60"
      RATE_LIMIT_TPM: "100000"
      RESULT_STORE_THRESHOLD_BYTES: "4096"

      # Internal auth
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 192M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # --------------------------------------------------------------------------
  # ai-core — public gateway / 10-layer pipeline  (port 8101:8001)
  # --------------------------------------------------------------------------
  ai-core:
    build:
      context: ./ai-core
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./shared/reasoning_runtime
    container_name: ai-core
    restart: unless-stopped
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 15s
    networks:
      reasoning-net:
        aliases:
          - ai-core
      inter-plane-bus:
        aliases:
          - ai-core
    ports:
      - "8101:8001"
      - "50061:50051"   # gRPC (50061 external to avoid conflict with data-documents-service)
    environment:
      SERVICE_NAME: ai-core
      ENVIRONMENT: production
      DEBUG: "false"

      # Provider API keys
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}

      # Azure OpenAI
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2025-01-01-preview}

      # Azure Speech
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}

      # Azure Translator
      AZURE_TRANSLATOR_KEY: ${AZURE_TRANSLATOR_KEY:-}
      AZURE_TRANSLATOR_REGION: ${AZURE_TRANSLATOR_REGION:-}

      # Ollama
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

      # Redis — shared reasoning-redis, DB 6
      REDIS_URL: redis://:reasoning_redis_password_2026@reasoning-v2-redis:6379/6

      # NATS (velion-nats)
      NATS_URL: nats://velion-nats:4222
      NATS_TOKEN: ""

      # Object storage (MinIO)
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-minioadmin}
      OBJECT_STORAGE_BUCKET: velion-completions

      # Rate limits
      RATE_LIMIT_RPM: "120"
      RATE_LIMIT_TPM: "200000"
      RESULT_STORE_THRESHOLD_BYTES: "4096"

      # Content safety
      CONTENT_SAFETY_ENABLED: "true"

      # Intent classification
      INTENT_LLM_ENABLED: ${INTENT_LLM_ENABLED:-false}

      # Agent-core delegation
      AGENT_CORE_URL: http://agent-core-v2:8002
      AGENT_CORE_TIMEOUT: "120"

      # Internal auth
      INTERNAL_API_KEY: 11604143a90303a16869372de84b493a8742d45c51e4142554640f3d0266965f

      # Azure Document Intelligence (Tier 1 — structured documents)
      AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT: ${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT:-https://core-ai-rg.cognitiveservices.azure.com}
      AZURE_DOCUMENT_INTELLIGENCE_KEY: ${AZURE_DOCUMENT_INTELLIGENCE_KEY:-}

      # Mistral Document AI (Tier 2 — Azure AI Foundry Serverless)
      MISTRAL_DOCUMENT_AI_ENDPOINT: ${MISTRAL_DOCUMENT_AI_ENDPOINT:-}
      MISTRAL_DOCUMENT_AI_KEY: ${MISTRAL_DOCUMENT_AI_KEY:-}

      # Video generation (Sora via Azure OpenAI)
      AZURE_OPENAI_VIDEO_DEPLOYMENT: ${AZURE_OPENAI_VIDEO_DEPLOYMENT:-sora-turbo}
      AZURE_OPENAI_VIDEO_API_VERSION: ${AZURE_OPENAI_VIDEO_API_VERSION:-2025-01-01-preview}

      # Realtime conversation
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-4o-realtime-preview-2025-01-09}
      AZURE_OPENAI_REALTIME_DEPLOYMENT: ${AZURE_OPENAI_REALTIME_DEPLOYMENT:-}

      # Azure AI Language (text analytics)
      AZURE_AI_LANGUAGE_ENDPOINT: ${AZURE_AI_LANGUAGE_ENDPOINT:-https://core-ai-rg.cognitiveservices.azure.com}
      AZURE_AI_LANGUAGE_KEY: ${AZURE_AI_LANGUAGE_KEY:-}
      AZURE_AI_LANGUAGE_API_VERSION: ${AZURE_AI_LANGUAGE_API_VERSION:-2024-11-15-preview}

      # Azure AI Content Understanding (multimodal)
      AZURE_CONTENT_UNDERSTANDING_ENDPOINT: ${AZURE_CONTENT_UNDERSTANDING_ENDPOINT:-}
      AZURE_CONTENT_UNDERSTANDING_KEY: ${AZURE_CONTENT_UNDERSTANDING_KEY:-}
      AZURE_CONTENT_UNDERSTANDING_API_VERSION: ${AZURE_CONTENT_UNDERSTANDING_API_VERSION:-2025-05-01-preview}

      # gRPC port (also exposed as container port 50051)
      GRPC_PORT: "50051"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 192M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # --------------------------------------------------------------------------
  # documents-worker — REMOVED: replaced by Data Plane v1 services
  #   retrieval-service (data-net + inter-plane-bus, port 8004)
  #   documents-service (data-net + inter-plane-bus, port 8001)
  # --------------------------------------------------------------------------

  # ==========================================================================
  # Temporal — self-hosted durable workflow engine (Phase 1)
  # ==========================================================================
  temporal-postgres:
    image: postgres:16-alpine
    container_name: temporal-postgres
    restart: unless-stopped
    networks:
      reasoning-net:
        aliases:
          - temporal-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal_secure_password_2026
      POSTGRES_DB: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  temporal-server:
    image: temporalio/auto-setup:latest
    container_name: temporal-server
    restart: unless-stopped
    networks:
      reasoning-net:
        aliases:
          - temporal-server
    # Intentionally not exposed on host port 7233 because Ingestion Plane's
    # Temporal service already occupies that port. Model Plane v2 reaches this
    # service over the shared Docker network via the temporal-server alias.
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal_secure_password_2026
      POSTGRES_SEEDS: temporal-postgres
      # Default namespace will be created by auto-setup
    depends_on:
      temporal-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal-server:7233", "cluster", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  temporal-ui:
    image: temporalio/ui:latest
    container_name: temporal-ui
    restart: unless-stopped
    networks:
      reasoning-net:
    ports:
      - "8233:8080"
    environment:
      TEMPORAL_ADDRESS: temporal-server:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:3000"
    depends_on:
      - temporal-server
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  # ==========================================================================
  # Letta — self-hosted memory-first agent server (Phase 5)
  # ==========================================================================
  letta-postgres:
    image: pgvector/pgvector:pg16
    container_name: letta-postgres
    restart: unless-stopped
    networks:
      reasoning-net:
        aliases:
          - letta-postgres
    environment:
      POSTGRES_USER: letta
      POSTGRES_PASSWORD: letta_secure_password_2026
      POSTGRES_DB: letta
    volumes:
      - letta-postgres-data:/var/lib/postgresql/data
      - ./init-letta-database.sql:/docker-entrypoint-initdb.d/001-init-letta-database.sql:ro
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U letta"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  letta-server:
    image: letta/letta:latest
    container_name: letta-server
    restart: unless-stopped
    networks:
      reasoning-net:
        aliases:
          - letta-server
    ports:
      - "8283:8283"
    environment:
      LETTA_PG_URI: "postgresql://letta:letta_secure_password_2026@letta-postgres:5432/letta"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      letta-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8283/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s


# ==========================================================================
# External networks shared across planes.
# - reasoning-net maps onto the existing ingestion-net because local override
#   flows and Temporal dependencies reuse Ingestion Plane connectivity.
# - inter-plane-bus is the shared cross-plane application network.
# - Cross-plane traffic uses inter-plane-bus; no service joins another plane's
#   private Docker network.
# ==========================================================================
networks:
  reasoning-net:
    name: ingestion-net
    external: true

  inter-plane-bus:
    name: inter-plane-bus
    external: true

# ==========================================================================
# Named volumes
# ==========================================================================
volumes:
  temporal-postgres-data:
  letta-postgres-data:
  reasoning-v2-postgres-data:
  reasoning-v2-redis-data:
  model-plane-nats-data:
  reasoning-v2-minio-data:
