server_name: "isolated-control-shared"
port: 4222
http_port: 8222

jetstream {
  store_dir: "/data"
  max_memory_store: 32MB
  max_file_store: 128MB
}

authorization {
  timeout: 2
  users: [
    {
      user: "control-admin"
      password: $CONTROL_NATS_ADMIN_PASSWORD
      permissions: {
        publish: ">"
        subscribe: ">"
      }
    }
    {
      user: "documents-api-gdpr"
      password: $DOCUMENTS_GDPR_NATS_PASSWORD
      permissions: {
        publish: {
          allow: [
            "verevon.gdpr.ownership.transferred",
            "verevon.gdpr.erasure.dlq.documents-api",
            "$JS.ACK.AQENCIA_CONTROLPLANE.documents-api-gdpr-erasure-v1.>",
            "$JS.API.CONSUMER.INFO.AQENCIA_CONTROLPLANE.documents-api-gdpr-erasure-v1"
          ]
        }
        subscribe: {
          allow: [
            "_VEREVON.CONTROL.SHARED.DELIVER.data.documents-api.gdpr-erasure",
            "_INBOX.DOCUMENTS_GDPR.>"
          ]
        }
      }
    }
  ]
}
