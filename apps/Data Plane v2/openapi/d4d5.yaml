openapi: 3.1.0
info:
  title: Data Plane v2 — D4/D5 Knowledge Surface
  version: 2.3.0
  description: |
    Knowledge surface served by the Data Plane v2 stack. Routes are split
    across four upstreams; the table below tracks which service owns each
    path. Verevon and other consumers should bind against this OpenAPI rather
    than the underlying protobuf — the protos are the wire contract for the
    Model Plane (gRPC); this YAML is the contract for HTTP clients.

    Service map (container DNS on `coresystem-local`):
      - retrieval-engine: http://retrieval-engine:8004
      - documents-api:    http://documents-api:8010
      - wiki-store:       http://wiki-store:8011
      - data-orchestrator:http://data-orchestrator:8012
      - data-quality:     http://data-quality:8013
      - graph-index:      http://graph-index:9203   (admin)
  contact:
    name: Data Plane v2 owners
servers:
  - url: http://retrieval-engine:8004
    description: Retrieval engine (Rust)
  - url: http://documents-api:8010
    description: Documents API (Go)
  - url: http://wiki-store:8011
    description: Wiki store (Go)
  - url: http://data-orchestrator:8012
    description: Data orchestrator (Go)
  - url: http://data-quality:8013
    description: Data quality (Go)
  - url: http://graph-index:9203
    description: Graph index (Rust)

# ─── Security ──────────────────────────────────────────────────────────────
security:
  - ApiKeyAuth: []
  - BearerAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: |
        Shared `INTERNAL_API_KEY` for service-to-service calls. Used by
        Model Plane and Quarry. Will be deprecated in favour of BearerAuth
        once Wave 3 (Control Plane wiring) ships.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        RS256 JWT issued by `auth-service` (Better Auth). Claims must
        include `org_id` matching the `X-Org-ID` header. Wave 3 will fail
        the request if they do not match.

  parameters:
    OrgIdHeader:
      name: X-Org-ID
      in: header
      required: true
      schema: { type: string, maxLength: 128, pattern: '^[A-Za-z0-9_\-]+$' }
      description: |
        Org scope for the request. Wave 3 will reject any request where
        this header does not match the `org_id` claim in the JWT.
    TraceId:
      name: trace_id
      in: path
      required: true
      schema: { type: string }

  schemas:
    # ─── Common ─────────────────────────────────────────────────────────
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    # ─── Retrieval ──────────────────────────────────────────────────────
    RetrievalFilters:
      type: object
      properties:
        document_types:  { type: array, items: { type: string } }
        departments:     { type: array, items: { type: string } }
        languages:       { type: array, items: { type: string } }
        document_ids:    { type: array, items: { type: string }, maxItems: 1000 }
        sources:         { type: array, items: { type: string } }
        region:          { type: string, nullable: true }
        workspaces:      { type: array, items: { type: string } }
        collections:     { type: array, items: { type: string } }
        acl_tags:        { type: array, items: { type: string } }

    ModeMixWeights:
      type: object
      description: |
        Per-query blend weights (D4+D5 spec §7). Unset weights inherit
        config defaults; the resolver renormalizes the sum to 1.0 before
        scoring. Recorded in `retrieval_runs.mode_mix`.
      properties:
        w_dense: { type: number, format: float, minimum: 0, maximum: 1 }
        w_bm25:  { type: number, format: float, minimum: 0, maximum: 1 }
        w_graph: { type: number, format: float, minimum: 0, maximum: 1 }
        w_wiki:  { type: number, format: float, minimum: 0, maximum: 1 }
        rerank:
          type: boolean
          default: true
          description: |
            `false` skips the cross-encoder rerank for this request: no
            provider call is made, the fused order is served and the
            reranker-score confidence gate does not run. Absent means `true`.
            A restrictive `zdr_mode` or a strict `sovereign_required` skips the
            rerank whatever this says.

    RetrievalRequest:
      type: object
      required: [org_id, query]
      description: |
        Wire contract `retrieve-v1`. The request body, the response body and the
        accepted `zdr_mode` values are pinned by sha256-pinned goldens in
        `services/retrieval-engine-rs/tests/fixtures/contracts/retrieve-v1/`
        (checked by `tests/retrieve_contract.rs`). Non-user callers (Quarry's
        vector leg, `principal_type=service`) vendor that directory byte for
        byte. Unknown JSON keys are ignored, not rejected: a field that is not
        listed here does nothing.
      properties:
        org_id:                 { type: string, maxLength: 128 }
        query:                  { type: string, maxLength: 8192 }
        top_k:                  { type: integer, minimum: 1, maximum: 1000 }
        top_n:                  { type: integer, minimum: 1, maximum: 100 }
        filters:                { $ref: '#/components/schemas/RetrievalFilters' }
        user_id:
          type: string
          nullable: true
          readOnly: true
          description: |
            Never read from the body. The viewer is set by the auth layer from
            the verified principal; a service principal has none.
        query_expansion:        { type: string, nullable: true }
        reranker_model:         { type: string, nullable: true }
        zdr_mode:
          type: string
          enum: [disabled, reject, ephemeral]
          default: disabled
          description: |
            Zero-data-retention posture of this retrieval. The match is EXACT
            and lowercase: any other spelling (`off`, `on`, `Disabled`, an empty
            string, ...) fails body deserialization with HTTP 422 before the
            pipeline runs, and there is no alias. Absent means `disabled`.
            `disabled` - no restriction.
            `reject` - no retaining egress (no query embedding or rerank
            through a retaining provider), documents classified `restricted`
            are filtered out, the retrieval result cache is not used, the
            trace is persisted.
            `ephemeral` - no retaining egress, the retrieval result cache is
            not used, no trace is persisted; documents classified `restricted`
            are NOT filtered out (only `reject` does that).
            A signed `zdr` claim only ever tightens this (to `ephemeral`; an
            explicit `reject` stays `reject`); it can never be relaxed by the body.
            The signed claim is the caller's REGISTERED retention posture, not the
            organisation's: a service principal registered as `persistent` is
            signed `zdr:false`, so for that caller the engine enforces exactly what
            the body says and knows nothing of the org's own ZDR setting (only a
            `tenant` registration carries the org setting into the claim). A
            caller that serves a zero-retention organisation must itself send
            `reject` or `ephemeral`, never `disabled`.
            Caution: the configured direct embedding backends (Cohere Embed v4,
            Azure OpenAI) refuse any restrictive posture and fail closed, so a
            request that is both restrictive and dense-routed is answered with an
            HTTP 5xx, not with a lexical-only result. Send `mode_mix.w_dense: 0`
            to ask for the lexical arm alone, or do not call.
        sovereign_required:
          type: boolean
          description: |
            Sovereign-infrastructure requirement. ABSENT MEANS STRICT (`true`)
            inside the engine. Azure-hosted providers (the Cohere Embed v4 query
            embedding, Cohere rerank) can never satisfy it, so with the Cohere
            Embed v4 backend deployed today a strict, dense-routed request
            fails closed like a restrictive `zdr_mode` (HTTP 5xx). A caller
            that wants the dense arm must send `false` explicitly. A signed
            `sovereign=true` claim wins over a body `false`.
        context_budget_tokens:  { type: integer, minimum: 1 }
        context_format:         { type: string, enum: [json, markdown, text] }
        mode_mix:               { $ref: '#/components/schemas/ModeMixWeights' }

    ScoredCandidate:
      type: object
      required: [knowledge_id, document_id, text, final_score]
      description: |
        Exactly these keys are serialized. There is NO `score` and NO `url`:
        the order of `candidates` is the rank, and a hit's page address comes
        from the matching entry of `sources` (join on `document_id`).
      properties:
        knowledge_id: { type: string }
        document_id:  { type: string }
        text:         { type: string }
        dense_score:  { type: number, format: float }
        sparse_score: { type: number, format: float }
        rerank_score: { type: number, format: float }
        final_score:  { type: number, format: float }
        chunk_index:  { type: integer }

    SourceRef:
      type: object
      required: [document_id, title]
      description: |
        One citation. HTTP only: the gRPC `Source` message (retrieval_v2.proto)
        is an older shape and deliberately has no `url`, so HTTP and gRPC
        responses differ by this additive field.
      properties:
        document_id: { type: string }
        title:       { type: string }
        source:      { type: string }
        type:        { type: string }
        url:
          type: string
          format: uri
          maxLength: 2048
          description: |
            Additive. Where the document can be opened. Present ONLY for
            documents whose `source` is `quarry` (a crawled page, from its
            `metadata.url`) and only when that value is a plain `http(s)` URL
            with a host, without credentials, whitespace or control characters.
            Omitted (never `null`) for every other source, for wiki pages and
            for a Quarry document without a usable URL; connector metadata (for
            example SharePoint web URLs) is never exposed through it.

    ContextFact:
      type: object
      properties:
        knowledge_id:     { type: string }
        document_id:      { type: string }
        text:             { type: string }
        score:            { type: number, format: float }
        source_title:     { type: string }
        source_type:      { type: string }
        estimated_tokens: { type: integer }

    ContextPack:
      type: object
      properties:
        facts:         { type: array, items: { $ref: '#/components/schemas/ContextFact' } }
        total_tokens:  { type: integer }
        budget_tokens: { type: integer }
        format:        { type: string }

    RetrievalResponse:
      type: object
      required: [candidates, sources, query, org_id, trace_id, zdr_mode]
      description: |
        Wire contract `retrieve-v1` (see `RetrievalRequest`). Additive changes
        only: a consumer reads the keys it needs and tolerates new ones.
      properties:
        candidates:           { type: array, items: { $ref: '#/components/schemas/ScoredCandidate' } }
        sources:              { type: array, items: { $ref: '#/components/schemas/SourceRef' } }
        query:                { type: string }
        org_id:               { type: string }
        trace_id:             { type: string }
        index_version:        { type: string }
        zdr_mode:             { type: string }
        low_confidence:       { type: boolean }
        context_pack:         { $ref: '#/components/schemas/ContextPack' }
        suggested_next_tools: { type: array, items: { type: string } }

    # ─── Documents ──────────────────────────────────────────────────────
    Document:
      type: object
      required: [document_id, org_id, source, type, title, content, status]
      properties:
        document_id:        { type: string }
        org_id:             { type: string }
        source:             { type: string }
        type:               { type: string }
        title:              { type: string }
        content:            { type: string }
        status:             { type: string, enum: [pending, indexed, failed] }
        metadata:           { type: object, additionalProperties: true }
        zdr_classification: { type: string, enum: [internal, public, sensitive, restricted, ''] }
        idempotency_key:    { type: string, nullable: true }
        created_at:         { type: string, format: date-time }
        updated_at:         { type: string, format: date-time }
        deleted_at:         { type: string, format: date-time, nullable: true }

    CreateDocumentRequest:
      type: object
      required: [source, type, title, content]
      properties:
        source:             { type: string, maxLength: 256 }
        type:               { type: string, maxLength: 64 }
        title:              { type: string, maxLength: 1024 }
        content:            { type: string, maxLength: 5242880 }    # 5 MiB
        metadata:           { type: object, additionalProperties: true }
        zdr_classification: { type: string, enum: [internal, public, sensitive, restricted, ''] }
        idempotency_key:    { type: string, maxLength: 256 }

    BulkIngestRequest:
      type: object
      required: [documents]
      properties:
        documents:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/CreateDocumentRequest' }

    BulkIngestResponse:
      type: object
      properties:
        accepted:          { type: integer }
        rejected:          { type: integer }
        reused:            { type: integer }
        document_ids:      { type: array, items: { type: string } }
        rejection_reasons: { type: array, items: { type: string } }

    # ─── Wiki ───────────────────────────────────────────────────────────
    WikiPage:
      type: object
      properties:
        page_id:            { type: string }
        org_id:             { type: string }
        workspace_id:       { type: string, nullable: true }
        title:              { type: string }
        path:               { type: string }
        current_version_id: { type: string, nullable: true }
        page_status:        { type: string, enum: [draft, published, deprecated] }
        backlinks:          { type: array, items: { type: object } }
        created_at:         { type: string, format: date-time }
        updated_at:         { type: string, format: date-time }

    WikiPageVersion:
      type: object
      properties:
        version_id:        { type: string }
        page_id:           { type: string }
        content:           { type: string, nullable: true }
        source_refs:       { type: array, items: { type: object } }
        proposed_by_agent: { type: string, nullable: true }
        proposed_by_user:  { type: string, nullable: true }
        approved_by:       { type: string, nullable: true }
        edit_reason:       { type: string, nullable: true }

    WikiDiff:
      type: object
      properties:
        page_id:         { type: string }
        from_version_id: { type: string }
        to_version_id:   { type: string }
        hunks:
          type: array
          items:
            type: object
            properties:
              op:    { type: string, enum: [add, remove, equal] }
              lines: { type: array, items: { type: string } }
        added_lines:     { type: integer }
        removed_lines:   { type: integer }
        unchanged_lines: { type: integer }

    MaintenanceSweepRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [kind]
            properties:
              page_id: { type: string }
              kind:    { type: string, enum: [orphan_wiki, stale_wiki, weak_citation, contradiction, stale, orphan] }
              actor:   { type: string }
              details: { type: object, additionalProperties: true }

    # ─── Graph (D4+D5 spec §3.1) ────────────────────────────────────────
    GraphSnapshot:
      type: object
      description: |
        Spec §3.1: `GET /v1/graphs/{org_id}` returns the full graph subset
        for an org as flat node + edge arrays. Implemented as a thin
        aggregator over `/v1/graph/entities` + `/v1/graph/relationships`.
      properties:
        org_id: { type: string }
        nodes:
          type: array
          items:
            type: object
            properties:
              entity_id:   { type: string }
              entity_type: { type: string }
              entity_text: { type: string }
              confidence:  { type: number, format: float }
              community_id: { type: string, nullable: true }
        edges:
          type: array
          items:
            type: object
            properties:
              rel_id:          { type: string }
              entity_a_id:     { type: string }
              entity_b_id:     { type: string }
              relation_type:   { type: string }
              confidence:      { type: number, format: float }
              provenance:      { type: string, enum: [extracted, inferred, ambiguous] }
        node_count: { type: integer }
        edge_count: { type: integer }

    # ─── Contextual retrieval: processing policy, coverage, gates (data-quality-go, CR-T11) ───
    ProcessingPolicyRequest:
      type: object
      description: |
        Replaces the WHOLE policy of the caller's organization. The three switches are required:
        an omitted field must never lift a hold by accident. All switches at their defaults
        (`inherit`, `inherit`, `inherit`, no pin, no budget figure) is a reset: the row is removed,
        because a row exists only because an operator set something. Unknown fields are refused.
      required: [contextual_retrieval, graph_extraction, budget_mode]
      properties:
        contextual_retrieval:
          type: string
          enum: [inherit, on, off]
          description: |
            `off` stops context generation for the organization: zero provider calls, its units get
            the status `skipped_policy`, contexts they already have stay. `on` and `inherit` generate;
            `on` does NOT override the global kill switch (`CONTEXTUAL_RETRIEVAL_ENABLED=false`).
            Requires `reason` when `off`.
        graph_extraction:
          type: string
          enum: [inherit, on, off]
          description: |
            NOT ENFORCED YET: graph-index reads it from CR-T12. Until then only `inherit` is accepted
            (400 otherwise), because a stored `off` that nothing honours would be a silent no-op.
            Requires `reason` when `off`.
        context_prompt_version:
          type: string
          nullable: true
          enum: [ctx-v1, ctx-v2]
          description: The organization's prompt version (the canary of a prompt rollout). `null` keeps the service default.
        budget_mode:
          type: string
          enum: [inherit, alert_only, throttle, stop]
          description: |
            NOT ENFORCED YET: the budget gate is CR-T9b. Until then only `inherit` is accepted (400
            otherwise), because a stored value that nothing reads would be a silent no-op.
            `alert_only` will be the system default (exceeding a budget alerts and does not stop
            work); `stop` withholds work and will require `reason`.
        monthly_budget_usd:
          type: number
          nullable: true
          minimum: 0
          maximum: 1000000000
          description: NOT ENFORCED YET (CR-T9b). Until then only `null` is accepted.
        reason:
          type: string
          nullable: true
          maxLength: 500
          description: Plain text on one line. Required when a feature is `off` or `budget_mode` is `stop`. Stored and audited.

    ProcessingPolicyView:
      type: object
      properties:
        contextual_retrieval:    { type: string, enum: [inherit, on, off] }
        graph_extraction:        { type: string, enum: [inherit, on, off] }
        context_prompt_version:  { type: string, nullable: true }
        budget_mode:             { type: string, enum: [inherit, alert_only, throttle, stop] }
        monthly_budget_usd:      { type: number, nullable: true }
        reason:                  { type: string, nullable: true }
        source:                  { type: string, enum: [policy, default], description: '`default` means the organization has no row (the system default, which is on).' }
        updated_by:              { type: string, nullable: true, description: The operator service principal that last changed it; null for the default. }
        updated_at:              { type: string, format: date-time, nullable: true }

    ProcessingPolicyResponse:
      type: object
      properties:
        org_id:    { type: string }
        policy:    { $ref: '#/components/schemas/ProcessingPolicyView' }
        effective:
          type: object
          properties:
            contextual_retrieval: { type: string, enum: ['on', 'off'] }
            graph_extraction:     { type: string, enum: ['on', 'off', deployment_default] }
        note:      { type: string }
        action:    { type: string, enum: [set, reset], description: PUT only. }
        previous:  { $ref: '#/components/schemas/ProcessingPolicyView', description: PUT only; what the change replaced. }

    ContextCoverageCounts:
      type: object
      description: |
        One row of `v_context_coverage`. Every count is over ELIGIBLE units (embedding done, document
        not deleted, classification internal, public or sensitive: the population the keyword index
        also uses). The statuses partition `eligible`.
      properties:
        eligible:         { type: integer }
        ready:            { type: integer }
        legacy:           { type: integer, description: A context of unknown provenance; eligible but not ready until the verification pass runs. }
        pending:          { type: integer }
        skipped_zdr:      { type: integer }
        skipped_policy:   { type: integer }
        skipped_budget:   { type: integer }
        failed_transient: { type: integer }
        failed_permanent: { type: integer }
        status_unknown:   { type: integer }
        vector_incoherent: { type: integer, description: '`ready` units whose vector was not built from the stored context.' }
        ready_unverified: { type: integer, description: '`ready` units with no recorded vector hash.' }
        excluded_by_classification: { type: integer, description: "Units of restricted documents: never sent to a provider, so out of scope." }

    ContextCoverageResponse:
      type: object
      properties:
        org_id: { type: string }
        counts: { $ref: '#/components/schemas/ContextCoverageCounts' }
        policy:
          type: object
          properties:
            contextual_retrieval: { type: string, enum: [inherit, on, off] }
            source:               { type: string, enum: [policy, default] }
        evaluation:
          type: object
          description: The judgement the `contextual_coverage_ok` release gate makes of the counts.
          properties:
            status:            { type: string, enum: [passed, failed, skipped_policy] }
            ready_trusted:     { type: integer, description: 'ready minus ready_unverified minus vector_incoherent.' }
            denominator:       { type: integer, description: eligible minus skipped_zdr. }
            coverage_percent:  { type: number, nullable: true }
            threshold_percent: { type: number, description: CONTEXT_COVERAGE_THRESHOLD_PERCENT (default 99). }
            message:           { type: string }

# ─── Paths ─────────────────────────────────────────────────────────────────
paths:
  # ── Retrieval ─────────────────────────────────────────────────────────
  /v1/retrieve:
    post:
      summary: Hybrid retrieve (D5 headline)
      tags: [retrieval]
      parameters: [{ $ref: '#/components/parameters/OrgIdHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetrievalRequest' }
      responses:
        '200':
          description: Retrieval result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetrievalResponse' }
        '400': { description: bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: unauthorized }
        '422': { description: 'body is not a valid RetrievalRequest, for example an unknown zdr_mode such as "off" (rejected by the JSON extractor, the pipeline never runs)' }

  /v1/retrieve/hybrid:
    post:
      summary: Alias for /v1/retrieve
      tags: [retrieval]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RetrievalRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RetrievalResponse' } } } }

  /v1/retrieve/graph:
    post:
      summary: Graph expansion retrieve (D5-3)
      tags: [retrieval]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_id, query]
              properties:
                org_id:              { type: string }
                query:               { type: string }
                max_entities:        { type: integer, default: 10 }
                include_communities: { type: boolean, default: false }
      responses: { '200': { description: OK } }

  /v1/retrieve/wiki:
    post:
      summary: Wiki retrieve (D5-4)
      tags: [retrieval]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_id, query]
              properties:
                org_id: { type: string }
                query:  { type: string }
                limit:  { type: integer, default: 10 }
      responses: { '200': { description: OK } }

  /v1/retrieve/contradictions:
    post:
      summary: Contradiction retrieve (D5-6)
      tags: [retrieval]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_id]
              properties:
                org_id: { type: string }
                query:  { type: string, nullable: true }
                limit:  { type: integer, default: 20 }
      responses: { '200': { description: OK } }

  /v1/retrieve/pack:
    post:
      summary: Standalone context packing (D7)
      tags: [retrieval]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object } } } } }

  /v1/retrieve/sources: { post: { summary: Source lookup, tags: [retrieval], responses: { '200': { description: OK } } } }
  /v1/retrieve/freshness: { post: { summary: Freshness scoring, tags: [retrieval], responses: { '200': { description: OK } } } }
  /v1/retrieve/timeline: { post: { summary: Temporal retrieval / replay, tags: [retrieval], responses: { '200': { description: OK } } } }
  /v1/retrieve/chunks: { post: { summary: Exact chunk lookup, tags: [retrieval], responses: { '200': { description: OK } } } }
  /v1/retrieve/compare: { post: { summary: Compare entities or documents, tags: [retrieval], responses: { '200': { description: OK } } } }
  /v1/retrieval/{trace_id}:
    get:
      summary: Retrieval audit trace
      tags: [retrieval]
      parameters: [{ $ref: '#/components/parameters/TraceId' }]
      responses: { '200': { description: OK } }

  /v1/knowledge/search:
    post:
      summary: App Shell global search wrapper (D5-7)
      tags: [retrieval]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RetrievalResponse' } } } } }
  /v1/knowledge/graph:   { post: { summary: graph (App Shell), tags: [retrieval], responses: { '200': { description: OK } } } }
  /v1/knowledge/wiki:    { post: { summary: wiki (App Shell), tags: [retrieval], responses: { '200': { description: OK } } } }
  /v1/knowledge/sources: { post: { summary: sources (App Shell), tags: [retrieval], responses: { '200': { description: OK } } } }
  /v1/knowledge/freshness: { post: { summary: freshness (App Shell), tags: [retrieval], responses: { '200': { description: OK } } } }

  /v1/index/versions:
    get:
      summary: List index versions
      tags: [retrieval]
      responses: { '200': { description: OK } }

  /v1/admin/cleanup/orphans:
    post:
      summary: Orphan Qdrant vector cleanup
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_id]
              properties:
                org_id:  { type: string }
                dry_run: { type: boolean, default: false }
      responses: { '200': { description: OK } }

  # ── Documents (Go service :8010) ──────────────────────────────────────
  /v1/documents:
    get:
      summary: List documents
      tags: [documents]
      parameters:
        - { $ref: '#/components/parameters/OrgIdHeader' }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: type, in: query, schema: { type: string } }
      responses: { '200': { description: OK } }
    post:
      summary: Create document (idempotent on `idempotency_key`)
      tags: [documents]
      parameters: [{ $ref: '#/components/parameters/OrgIdHeader' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateDocumentRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Document' } } } }
        '200': { description: Reused (idempotency hit), content: { application/json: { schema: { $ref: '#/components/schemas/Document' } } } }

  /v1/documents/bulk:
    post:
      summary: Bulk ingest (≤500 docs)
      tags: [documents]
      parameters: [{ $ref: '#/components/parameters/OrgIdHeader' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BulkIngestRequest' } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BulkIngestResponse' } } } } }

  /v1/documents/{documentID}:
    get:
      summary: Get document
      tags: [documents]
      parameters:
        - { $ref: '#/components/parameters/OrgIdHeader' }
        - { name: documentID, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Document' } } } } }
    delete:
      summary: Soft delete document
      tags: [documents]
      parameters:
        - { $ref: '#/components/parameters/OrgIdHeader' }
        - { name: documentID, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: Deleted } }

  # ── Wiki (Go service :8011) ───────────────────────────────────────────
  /v1/wiki/pages:
    post:
      summary: Create wiki page
      tags: [wiki]
      parameters: [{ $ref: '#/components/parameters/OrgIdHeader' }]
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/WikiPage' } } } } }

  /v1/wiki/pages/{pageID}:
    get:
      summary: Get wiki page + current version
      tags: [wiki]
      parameters:
        - { $ref: '#/components/parameters/OrgIdHeader' }
        - { name: pageID, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: OK } }

  /v1/wiki/pages/{pageID}/versions:
    get:
      summary: List versions
      tags: [wiki]
      responses: { '200': { description: OK } }
    post:
      summary: Create new version
      tags: [wiki]
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/WikiPageVersion' } } } } }

  /v1/wiki/pages/{pageID}/diff:
    get:
      summary: Diff two versions (LCS line-diff)
      tags: [wiki]
      parameters:
        - { name: pageID, in: path, required: true, schema: { type: string } }
        - { name: from_version_id, in: query, required: true, schema: { type: string } }
        - { name: to_version_id, in: query, required: true, schema: { type: string } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WikiDiff' } } } } }

  /v1/wiki/pages/{pageID}/backlinks:
    get: { summary: Get backlinks, tags: [wiki], responses: { '200': { description: OK } } }
  /v1/wiki/pages/{pageID}/proposals:
    post: { summary: Submit proposal, tags: [wiki], responses: { '201': { description: Created } } }
  /v1/wiki/proposals/review:
    post: { summary: Review/accept proposal, tags: [wiki], responses: { '200': { description: OK } } }
  /v1/wiki/pages/{pageID}/source-logs:
    post: { summary: Create source log, tags: [wiki], responses: { '201': { description: Created } } }
    get:  { summary: List source logs, tags: [wiki], responses: { '200': { description: OK } } }
  /v1/wiki/pages/{pageID}/maintenance-logs:
    post: { summary: Create maintenance log, tags: [wiki], responses: { '201': { description: Created } } }
    get:  { summary: List maintenance logs, tags: [wiki], responses: { '200': { description: OK } } }

  /v1/wiki/maintenance/sweep:
    post:
      summary: Batch ingest of lint findings (D5-6 + spec §3.4)
      tags: [wiki]
      parameters: [{ $ref: '#/components/parameters/OrgIdHeader' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceSweepRequest' } } }
      responses: { '200': { description: OK } }

  # ── Graph (Rust service :9203 admin port) ─────────────────────────────
  /v1/graphs/{org_id}:
    get:
      summary: Spec §3.1 — aggregate graph snapshot
      description: |
        Returns a flat `{nodes:[], edges:[]}` snapshot for one org. Thin
        aggregator over `/v1/graph/entities` + `/v1/graph/relationships`.
        For most clients this is the simplest entry into the graph; for
        anything beyond ~5k nodes use the paginated `/v1/graph/*` endpoints.
      tags: [graph]
      parameters:
        - { name: org_id, in: path, required: true, schema: { type: string } }
        - { name: limit_nodes, in: query, schema: { type: integer, default: 5000 } }
        - { name: limit_edges, in: query, schema: { type: integer, default: 20000 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GraphSnapshot' }
        '413': { description: Snapshot would exceed limits; use paginated endpoints }

  /v1/graph/entities:
    get: { summary: List entities, tags: [graph], responses: { '200': { description: OK } } }
  /v1/graph/entities/{entity_id}:
    get: { summary: Get entity, tags: [graph], responses: { '200': { description: OK } } }
  /v1/graph/relationships/{entity_id}:
    get: { summary: Get relationships for entity, tags: [graph], responses: { '200': { description: OK } } }
  /v1/graph/claims:
    get: { summary: List claims, tags: [graph], responses: { '200': { description: OK } } }
  /v1/graph/contradictions:
    get: { summary: Detect contradictions, tags: [graph], responses: { '200': { description: OK } } }
  /v1/graph/expand:
    post: { summary: Expand subgraph around query, tags: [graph], responses: { '200': { description: OK } } }

  # ── Orchestrator / Quality ────────────────────────────────────────────
  /v1/jobs:
    post:
      summary: Create job (reindex / graph_build / wiki_refresh)
      tags: [orchestrator]
      responses: { '200': { description: OK } }

  /v1/evals/retrieval: { post: { summary: Run retrieval eval, tags: [quality], responses: { '200': { description: OK } } } }
  /v1/evals/retrieval/{evalID}: { get: { summary: Get eval result, tags: [quality], responses: { '200': { description: OK } } } }
  /v1/evals/compare: { post: { summary: A/B compare two strategies, tags: [quality], responses: { '200': { description: OK } } } }
  /v1/evals/results:
    post:
      summary: Record the summary of a retrieval-quality run measured outside the service (operator-only)
      tags: [quality]
      description: |
        CR-T14. The retrieval-quality harness (`scripts/eval-gate.py --records-out`, sent by
        `python3 scripts/eval-service.py record`) stores one summary per gated cell, and one per promotion
        verdict, in `quality_eval_runs`, under the strategy `harness:<cell>`, so that a regression is
        a query: `SELECT ... FROM quality_eval_runs WHERE strategy LIKE 'harness:%'`. Read one back
        with `GET /v1/evals/retrieval/{evalID}`.

        Requires scope `data:quality:admin` AND a verified service principal (an organization's own
        admin is refused with 403 `operator_only`: history that a promotion decision reads is not a
        customer setting). The organization is the verified token's; a body that names one is refused.
        The `Idempotency-Key` header is required (8 to 120 characters). A replay with the same key and
        content answers 200 with the stored run; the same key with other content answers 409
        `idempotency_conflict`: history is immutable. The body is the wire contract
        `harness-record-v1` (a summary of at most 64 KiB, never the per-query rows), pinned by
        `testdata/harness-record-v1/` here and `scripts/tests/fixtures/harness-record-v1/` on the
        producer side.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [strategy, corpus, scorecard], additionalProperties: false } } }
      responses:
        '201': { description: Recorded }
        '200': { description: A replay of a record that is already stored }
        '400': { description: "Not a valid record (`invalid_record`, with the problems) or a missing or malformed `Idempotency-Key` (`invalid_idempotency_key`)" }
        '403': { description: "Missing scope, or not an operator service principal (`operator_only`)" }
        '409': { description: "The key is bound to a different record (`idempotency_conflict`)" }
        '413': { description: "More than 64 KiB (`record_too_large`)" }
        '503': { description: "The results store is not configured (`results_store_unavailable`)" }
  /v1/quality/trust: { post: { summary: Score trust, tags: [quality], responses: { '200': { description: OK } } } }
  /v1/quality/gates:
    get:
      summary: Release gates check
      tags: [quality]
      description: |
        Scope `data:quality:admin`; the organization is the verified token's. 200 when every gate
        passes, 412 when any does not. A gate that can be unable to judge carries `status`:
        `passed`, `failed`, `skipped_policy` (passed because an operator policy switched the feature
        off for the organization, said out loud) or `unavailable` (the evidence could not be read:
        never a pass, so the report fails).

        `contextual_coverage_ok`: the share of eligible units that have a verified context is at
        least `CONTEXT_COVERAGE_THRESHOLD_PERCENT` (default 99). `legacy` units count as eligible but
        not ready until the verification pass runs; `skipped_zdr` units leave the denominator; an
        organization whose policy is `off` passes with status `skipped_policy`.

        `sparse_index_in_sync`: the keyword index holds exactly the eligible units, each with its
        context where Postgres has one. It reads the parity endpoint of quickwit-adapter-rs
        (`SPARSE_INDEX_PARITY_URL`, contract `index-parity-v1`, CR-T9a); until that endpoint exists
        and is configured the gate is `unavailable`.
      responses:
        '200': { description: Every gate passed }
        '412': { description: At least one gate failed or was unavailable }
  /v1/quality/context-coverage:
    get:
      summary: Contextual-retrieval coverage of the caller's organization
      tags: [quality]
      description: |
        Scope `data:quality:admin`; the organization is the verified token's (there is no org
        parameter). Backed by `v_context_coverage`. `503 coverage_unavailable` when the
        context-provenance migration is not applied to the database.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ContextCoverageResponse' } } } }
        '503': { description: The coverage view does not exist in this database }
  /v1/quality/lint:  { get: { summary: Knowledge lint (orphan/stale/weak-citation), tags: [quality], responses: { '200': { description: OK } } } }
  /v1/cost/summary:  { get: { summary: Cost ledger summary, tags: [quality], responses: { '200': { description: OK } } } }
  /v1/admin/orgs/{org}/processing-policy:
    parameters:
      - { name: org, in: path, required: true, schema: { type: string, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:\-]*$' } }
    get:
      summary: Read the organization's processing policy
      tags: [admin, quality]
      description: |
        Scope `data:quality:admin`. `{org}` must equal the verified token's organization (403
        `tenant_mismatch` otherwise); a token of one organization cannot read another's policy. An
        organization with no row reads as the system default (`source: default`, which is on).
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProcessingPolicyResponse' } } } }
        '400': { description: "The organization id is not valid (`invalid_org`)" }
        '403': { description: "Missing scope, or `{org}` is not the token's organization (`tenant_mismatch`)" }
        '503': { description: "The policy table is not migrated (`policy_store_unavailable`)" }
    put:
      summary: Replace the organization's processing policy (operator-only, audited)
      tags: [admin, quality]
      description: |
        An OPERATOR control, not a customer setting. Requires scope `data:quality:admin` AND a verified
        service principal: an organization's own owner or admin also carries the scope in an
        interactive token and is refused (403 `operator_only`). `{org}` must equal the token's
        organization (403 `tenant_mismatch` otherwise: a cross-organization write is refused). The
        change and its audit row (`admin_audit_log`, action `org_processing_policy.set` or `.reset`)
        are one transaction. `off` and `budget_mode: stop` require a `reason`. The embedding engine
        applies the change within 30 seconds (its policy cache); contexts a unit already has stay.
        Whether `off` may be used on customer organizations is an open owner decision
        (OD-PER-ORG-OFF): until it is ruled it is for evaluation baseline organizations and incidents.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProcessingPolicyRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProcessingPolicyResponse' } } } }
        '400': { description: "Invalid organization id or body (`invalid_org`, `invalid_request`)" }
        '403': { description: "Missing scope, not an operator service principal (`operator_only`), or another organization (`tenant_mismatch`)" }
        '503': { description: "The policy table is not migrated (`policy_store_unavailable`)" }

tags:
  - { name: retrieval, description: Retrieval endpoints (Rust, port 8004) }
  - { name: documents, description: Document CRUD (Go, port 8010) }
  - { name: wiki, description: Wiki pages + maintenance (Go, port 8011) }
  - { name: graph, description: Knowledge graph (Rust, port 9203) }
  - { name: orchestrator, description: Job control (Go, port 8012) }
  - { name: quality, description: Evals + gates + lint + cost (Go, port 8013) }
  - { name: admin, description: Operator-only — orphan cleanup, etc. }
