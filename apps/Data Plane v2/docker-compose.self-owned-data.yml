name: data-plane-v2-self-owned

x-runtime-defaults: &runtime-defaults
  restart: unless-stopped
  init: true
  stop_grace_period: 60s
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"

services:
  opensanctions-elasticsearch:
    <<: *runtime-defaults
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    profiles: ["self-owned-risk"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${OPENSANCTIONS_ES_JAVA_OPTS:--Xms2g -Xmx2g}
    expose:
      - "9200"
    volumes:
      - dpv2_opensanctions_elasticsearch:/usr/share/elasticsearch/data
    networks:
      - dpv2-net
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 60s

  opensanctions-yente:
    <<: *runtime-defaults
    image: ghcr.io/opensanctions/yente:5.4.0
    profiles: ["self-owned-risk"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      YENTE_INDEX_URL: ${YENTE_INDEX_URL:-http://opensanctions-elasticsearch:9200}
      YENTE_AUTO_REINDEX: ${YENTE_AUTO_REINDEX:-false}
      # Required (fail-fast) when the self-owned-risk profile is selected — no
      # empty default, so an unauthenticated OpenSanctions updater can't start.
      YENTE_UPDATE_TOKEN: ${YENTE_UPDATE_TOKEN:?set YENTE_UPDATE_TOKEN when selecting the self-owned-risk profile}
    expose:
      - "8000"
    networks:
      - dpv2-net
      - inter-plane-bus
    depends_on:
      opensanctions-elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()\""]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 60s

  nominatim:
    <<: *runtime-defaults
    image: mediagis/nominatim:5.3
    profiles: ["self-owned-geo"]
    environment:
      PBF_URL: ${NOMINATIM_PBF_URL:-https://download.geofabrik.de/europe/monaco-latest.osm.pbf}
      REPLICATION_URL: ${NOMINATIM_REPLICATION_URL:-}
      IMPORT_WIKIPEDIA: ${NOMINATIM_IMPORT_WIKIPEDIA:-false}
      # Required (fail-fast) when the self-owned-geo profile is selected — no
      # empty default, so Nominatim can't start with a blank DB password.
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:?set NOMINATIM_PASSWORD when selecting the self-owned-geo profile}
    expose:
      - "8080"
    volumes:
      - dpv2_nominatim:/var/lib/postgresql/16/main
    shm_size: "1gb"
    networks:
      - dpv2-net
      - inter-plane-bus
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4.0"
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://127.0.0.1:8080/search?q=Monaco&format=json' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s

networks:
  dpv2-net:
    external: true
    name: ${DPV2_NETWORK_NAME:-dpv2-net}
  inter-plane-bus:
    external: true
    name: ${INTER_PLANE_BUS_NETWORK:-inter-plane-bus}

volumes:
  dpv2_opensanctions_elasticsearch:
  dpv2_nominatim:
