syntax = "proto3";

package dataplane.knowledge.v2;

option go_package = "github.com/triodelab/dataplane/gen/go/knowledge/v2";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

message KnowledgeUnit {
  string knowledge_id    = 1;
  string document_id     = 2;
  string org_id          = 3;
  int32  chunk_index     = 4;
  string text            = 5;
  string embedding_status = 6;
  string content_hash    = 7;   // blake3 hash for stable chunk ID + dedup
  string chunk_version   = 8;   // version tracking for chunk lineage
  optional string parent_chunk_id = 9;  // lineage: replaced this chunk
  google.protobuf.Struct metadata = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message CheckPermissionsRequest {
  string org_id      = 1;
  string document_id = 2;
  string user_id     = 3;
}

message CheckPermissionsResponse {
  bool   allowed = 1;
  string reason  = 2;
}

message GetKnowledgeUnitsRequest {
  string document_id = 1;
  string org_id      = 2;
}

message GetKnowledgeUnitsResponse {
  repeated KnowledgeUnit units = 1;
}

service KnowledgeService {
  rpc CheckPermissions(CheckPermissionsRequest) returns (CheckPermissionsResponse);
  rpc GetKnowledgeUnits(GetKnowledgeUnitsRequest) returns (GetKnowledgeUnitsResponse);
}
