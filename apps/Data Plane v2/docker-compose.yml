name: ${DATA_PLANE_COMPOSE_PROJECT:-data-plane-v2}

x-build-metadata: &build-metadata
  SOURCE_REVISION: ${SOURCE_REVISION:?SOURCE_REVISION build arg required for image provenance}
  BUILD_DATE: ${BUILD_DATE:?BUILD_DATE build arg required for image provenance}

x-hardened-runtime: &hardened-runtime
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"

x-infra-observability: &infra-observability
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"

services:
  # ─────────────────────────────────────────────────────────────
  # INFRA
  # ─────────────────────────────────────────────────────────────

  postgres:
    <<: *infra-observability
    image: postgres:16.14-alpine3.24
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dataplane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-dataplane}
    expose:
      - "5432"
    ports:
      # Loopback-only operational access for backup/restore and the local
      # migrator CLI. Cross-plane traffic still uses the private network.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5442}:5432"
    networks:
      - dpv2-net
    volumes:
      - dpv2_postgres:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    shm_size: "128mb"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "effective_cache_size=256MB"
      - "-c"
      - "max_connections=100"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dataplane}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot deploy-time migrator (B3). Runs the versioned `migrator up` against
  # Postgres BEFORE any data service starts serving — so `make up` (docker
  # compose up -d) auto-applies pending migrations instead of leaving them to a
  # manual `make migrate-up` (the root cause of the missing operating_maps 500s).
  # Idempotent (skips already-applied versions via schema_migrations) and
  # run-once (exits after applying; dependents gate on
  # service_completed_successfully, mirroring minio-init → quickwit).
  migrate:
    <<: *hardened-runtime
    build:
      context: ./tools/migrator
      dockerfile: Dockerfile
      args: *build-metadata
    image: dpv2-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dataplane}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-dataplane}?sslmode=disable
    volumes:
      # Bind-mount the migrations read-only so adding a migration needs no image
      # rebuild; the migrator resolves ./infra/postgres/migrations from WORKDIR.
      - ./infra/postgres/migrations:/app/infra/postgres/migrations:ro
    networks:
      - dpv2-net
    depends_on:
      postgres:
        condition: service_healthy

  dragonfly:
    <<: *infra-observability
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.37.0
    restart: unless-stopped
    init: true
    expose:
      - "6379"
    networks:
      - dpv2-net
    volumes:
      - dpv2_dragonfly:/data
    command: ["--requirepass=${DATAPLANE_DRAGONFLY_PASSWORD:?DATAPLANE_DRAGONFLY_PASSWORD is required}", "--cache_mode=true", "--maxmemory=256mb", "--proactor_threads=1", "--dir=/data"]
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${DATAPLANE_DRAGONFLY_PASSWORD:?DATAPLANE_DRAGONFLY_PASSWORD is required}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    <<: *infra-observability
    image: qdrant/qdrant:v1.17.0
    restart: unless-stopped
    init: true
    expose:
      - "6333"
      - "6334"
    ports:
      # Qdrant snapshots are downloaded/uploaded by the host-side backup tools.
      - "127.0.0.1:${QDRANT_HTTP_HOST_PORT:-6345}:6333"
    networks:
      - dpv2-net
    volumes:
      - dpv2_qdrant:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      # qdrant image ships bash but no curl/wget; verify the HTTP API port
      # (6333) is actually accepting connections rather than always passing.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 10

  # Neo4j graph read-model (GraphRAG). Rebuildable, org-scoped mirror of the
  # canonical Postgres graph, used only for native multi-hop Cypher traversal.
  # ON by default in the composed stack (NEO4J_ENABLED); the core graph-index
  # service does NOT depend on it (it degrades to the Postgres BFS fallback),
  # so a Neo4j outage never takes down extraction/query.
  neo4j:
    <<: *infra-observability
    image: neo4j:5.26-community
    restart: unless-stopped
    init: true
    expose:
      - "7687"
      - "7474"
    ports:
      # Loopback-only Bolt + HTTP browser for local inspection; cross-plane
      # traffic uses the private network.
      - "127.0.0.1:${NEO4J_BOLT_HOST_PORT:-7688}:7687"
      - "127.0.0.1:${NEO4J_HTTP_HOST_PORT:-7475}:7474"
    networks:
      - dpv2-net
    volumes:
      - dpv2_neo4j:/data
    environment:
      # Auth is ALWAYS on. The password is deployment-owned; the app fails
      # closed when NEO4J_ENABLED=true and no password is supplied.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-dataplane}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-256m}
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    healthcheck:
      # neo4j image ships bash; verify the Bolt port (7687) accepts connections
      # — the readiness signal the graph-index client connects on.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/7687' || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 15

  nats:
    <<: *infra-observability
    image: nats:2.12.12-alpine3.22@sha256:2ca98656a279b2d88cfdf2b8c3f0d5d7f3941ae9dc2ab12ebaa92d83e0f4ccdb
    restart: unless-stopped
    command: ["-js", "-m", "8222", "-sd", "/data", "--auth", "${DATAPLANE_NATS_TOKEN:?DATAPLANE_NATS_TOKEN is required}"]
    expose:
      - "4222"
    networks:
      dpv2-net:
        aliases:
          - data-nats
    volumes:
      - dpv2_nats:/data
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    <<: *infra-observability
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    init: true
    command: ["server", "/data", "--console-address", ":9001"]
    expose:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    networks:
      - dpv2-net
      # Private by default: Ingestion never holds Data Plane object-store ROOT
      # credentials. The visual-RAG CAS producer authenticates with the scoped
      # `CAS_INGESTION_*` user minio-init provisions (dataplane-cas bucket
      # only), and reaches this service via the cross-plane overlay's
      # `dataplane-minio` alias — see docker-compose.cross-plane.yml.
    volumes:
      - dpv2_minio:/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    # When CAS_INGESTION_ACCESS_KEY/SECRET_KEY are both set, provision the
    # scoped credential contract the visual-RAG CAS producer (quarry-edge's
    # PageRenderer) authenticates with: a dedicated MinIO user whose inline
    # policy grants object read/write on the `dataplane-cas` bucket ONLY.
    # This is the "scoped contract" the minio service comment requires —
    # Ingestion still never sees MINIO_ROOT_* credentials, and the scoped
    # key cannot touch `quickwit` or any other bucket. Unset → skipped, and
    # the producer stays disabled exactly as before.
    command:
      - >
        mc alias set dpv2 http://minio:9000 "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}" "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}" &&
        mc mb --ignore-existing "dpv2/quickwit" &&
        mc mb --ignore-existing "dpv2/dataplane-cas" &&
        if [ -n "${CAS_INGESTION_ACCESS_KEY:-}" ] && [ -n "${CAS_INGESTION_SECRET_KEY:-}" ]; then
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject"],"Resource":["arn:aws:s3:::dataplane-cas/*"]},{"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation"],"Resource":["arn:aws:s3:::dataplane-cas"]}]}' > /tmp/cas-ingestion-rw.json &&
        mc admin user add dpv2 "${CAS_INGESTION_ACCESS_KEY}" "${CAS_INGESTION_SECRET_KEY}" &&
        mc admin policy create dpv2 cas-ingestion-rw /tmp/cas-ingestion-rw.json &&
        { mc admin policy attach dpv2 cas-ingestion-rw --user "${CAS_INGESTION_ACCESS_KEY}" || true; }
        ; fi
    networks:
      - dpv2-net
    depends_on:
      minio:
        condition: service_healthy

  quickwit:
    <<: *infra-observability
    image: quickwit/quickwit:0.8.1
    restart: unless-stopped
    init: true
    command: ["run", "--config=/quickwit/config/quickwit.yaml"]
    expose:
      - "7280"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      QW_LISTEN_ADDRESS: 0.0.0.0
      RUST_LOG: quickwit=info
    networks:
      - dpv2-net
    volumes:
      - ./infra/quickwit/quickwit.yaml:/quickwit/config/quickwit.yaml:ro
      - ./infra/quickwit/dataplane-corpus-index.yaml:/quickwit/config/dataplane-corpus-index.yaml:ro
      - dpv2_quickwit_cache:/quickwit/qwdata
    depends_on:
      minio-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:7280/api/v1/cluster?format=json >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10

  # Keyword retrieval arm's backing store — typo-tolerant, exact-ID/code
  # lookup that Postgres BM25 / Quickwit don't serve well (see
  # `docs/retrieval-quality-and-durability-plan-2026-08-05.md`'s execution
  # record for this arm). `meilisearch-adapter` keeps this index converged
  # with the knowledge-unit corpus; `retrieval-engine`'s `search/keyword.rs`
  # queries it org-scoped via a filter on `org_id` (the sole isolation
  # boundary — see that module's docs).
  meilisearch:
    <<: *infra-observability
    image: getmeili/meilisearch:v1.12.5
    restart: unless-stopped
    init: true
    environment:
      # No checked-in default: an admin/master key must be explicitly
      # provisioned, exactly like POSTGRES_PASSWORD/DATAPLANE_NATS_TOKEN
      # above. `production` mode additionally refuses to start without one.
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:?MEILISEARCH_MASTER_KEY is required}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    expose:
      - "7700"
    ports:
      # Loopback-only operational access for local verification/debugging,
      # same posture as Postgres/Qdrant/Neo4j above.
      - "127.0.0.1:${MEILISEARCH_HTTP_HOST_PORT:-7701}:7700"
    networks:
      - dpv2-net
    volumes:
      - dpv2_meilisearch:/meili_data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:7700/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 10

  # ─────────────────────────────────────────────────────────────
  # RUST SERVICES
  # ─────────────────────────────────────────────────────────────

  retrieval-engine:
    <<: *hardened-runtime
    build:
      context: .
      dockerfile: services/retrieval-engine-rs/Dockerfile
      args: *build-metadata
      additional_contexts:
        model-plane-proto: "../Model Plane/proto"
    restart: unless-stopped
    init: true
    expose:
      - "8004"
      - "50052"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-dataplane}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-dataplane}
      QDRANT_URL: http://qdrant:6334
      DRAGONFLY_URL: redis://:${DATAPLANE_DRAGONFLY_PASSWORD:?DATAPLANE_DRAGONFLY_PASSWORD is required}@dragonfly:6379
      NATS_URL: nats://data-nats:4222
      DATAPLANE_NATS_TOKEN: ${DATAPLANE_NATS_TOKEN:?DATAPLANE_NATS_TOKEN is required}
      HTTP_PORT: "8004"
      GRPC_PORT: "50052"
      # Semantic response cache (CAG read path; vector tier for the Model Plane
      # gateway). ON by default — the scope-key fail-closed gate still governs
      # cross-principal sharing.
      SEMANTIC_CACHE_ENABLED: ${SEMANTIC_CACHE_ENABLED:-true}
      # Smart hybrid — query-adaptive mode-mix (request > agent > smart > static).
      SMART_HYBRID_ENABLED: ${SMART_HYBRID_ENABLED:-true}
      # D-B (2026-08-08, sovereign-rag-phased-plan.md Phase 3b): query-side
      # dense embedding must use the SAME provider+dimension+collection as
      # the indexing side (embedding-engine, above) or retrieval breaks —
      # Cohere Embed v4, direct (not routed through the Model Plane; mirrors
      # the visual query embedder in embed/visual.rs). Same ZDR caveat as
      # the prior model_plane/azure_openai choices: this path fails closed
      # on restricted content until an EU/ZDR-compliant provider exists.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-cohere}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-dataplane_knowledge_embedv4}
      MODEL_PLANE_AI_CORE_GRPC_URL: ${MODEL_PLANE_AI_CORE_GRPC_URL:-http://inference-core:9092}
      MODEL_PLANE_EMBEDDING_PROVIDER: ${MODEL_PLANE_EMBEDDING_PROVIDER:-azure_openai}
      MODEL_PLANE_EMBEDDING_TIMEOUT_MS: ${MODEL_PLANE_EMBEDDING_TIMEOUT_MS:-30000}
      # Reuse the retrieval service's deployment credential only at Auth Core
      # to mint an org-bound aud=inference-core bearer with exact
      # inference:invoke scope. The bearer—not this shared credential—is sent
      # to inference-core. Missing/invalid issuance fails before gRPC.
      MODEL_PLANE_INFERENCE_TOKEN_URL: ${MODEL_PLANE_INFERENCE_TOKEN_URL:-http://auth-core:3011/api/inference-core/internal-token}
      MODEL_PLANE_INFERENCE_TOKEN_ISSUER: ${AUTH_CORE_ISSUER:-http://auth-core:3011/api/convex-auth}
      MODEL_PLANE_INFERENCE_SERVICE_ID: ${CONTROL_POLICY_SERVICE_ID:-retrieval-engine}
      MODEL_PLANE_INFERENCE_SERVICE_API_KEY: ${CONTROL_POLICY_SERVICE_API_KEY:-}
      # Retention posture auth-core mints for this principal's inference-core
      # audience. Must equal its retentionByAudience entry in
      # PLANE_SERVICE_PRINCIPALS_JSON, or every mint fails closed.
      MODEL_PLANE_INFERENCE_RETENTION_POSTURE: ${RETRIEVAL_ENGINE_INFERENCE_RETENTION_POSTURE:-persistent}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-text-embedding-3-large}
      # Cohere Embed v4 Matryoshka width, now sent on the wire (not just used
      # to size the Qdrant collection). ONLY 256/512/1024/1536 are valid
      # truncation points; anything else refuses to boot. Both engines read this
      # SAME variable and must agree — a query embedded at a different width
      # than the corpus was indexed at fails every search, so change it only
      # together with a re-embed into a fresh collection.
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      # Visual RAG — Cohere Embed v4 query embedder + fused visual arm. ON by
      # default (W_VISUAL 0.05); the arm no-op-skips when the Embed v4 endpoint
      # is unset, so text-only deployments are unaffected. The query embedder
      # reuses the core-ai-rg key (deployed model `embed-v-4-0`).
      COHERE_EMBED_V4_ENDPOINT: ${COHERE_EMBED_V4_ENDPOINT:-}
      COHERE_EMBED_V4_API_KEY: ${COHERE_API_KEY:-}
      COHERE_EMBED_V4_DEPLOYMENT: ${COHERE_EMBED_V4_DEPLOYMENT:-embed-v-4-0}
      COHERE_EMBED_V4_API_VERSION: ${COHERE_EMBED_V4_API_VERSION:-2024-05-01-preview}
      QDRANT_VISUAL_COLLECTION: ${QDRANT_VISUAL_COLLECTION:-dataplane_page_images}
      VISUAL_EMBEDDING_DIMENSION: ${VISUAL_EMBEDDING_DIMENSION:-1536}
      W_VISUAL: ${W_VISUAL:-0.05}
      # ColQwen visual reranker (services/colqwen-reranker). ON by default but a
      # no-op until COLQWEN_ENDPOINT_URL points at the GPU server (local MPS for
      # verification, Hetzner/Azure for prod — e.g. http://host.docker.internal:8090).
      VISUAL_RERANK_ENABLED: ${VISUAL_RERANK_ENABLED:-true}
      COLQWEN_ENDPOINT_URL: ${COLQWEN_ENDPOINT_URL:-}
      # 20 is only reachable on a fast GPU. Measured on an RTX A1000: ~10 s per
      # page against the client's 30 s timeout, so anything above 3 times out and
      # degrades to Embed-v4 order on every request — silently, by design.
      VISUAL_RERANK_TOP_K: ${VISUAL_RERANK_TOP_K:-20}
      # Audio/video arms (services/media-embedder: LAION-CLAP + LanguageBind).
      # Dark until set, like the visual arm. There is no cloud fallback for these
      # two modalities — see the media-embedder service comment below.
      MEDIA_EMBEDDER_ENDPOINT: ${MEDIA_EMBEDDER_ENDPOINT:-}
      # Whether the endpoint above actually runs on sovereign infrastructure.
      # Defaults false (non-sovereign) — see `Config::media_embedder_sovereign`'s
      # doc comment: self-hosted does not imply sovereign, and no production
      # topology is established yet. A sovereign_required query zero-weights
      # the audio/video arms until this is explicitly flipped for a verified
      # deployment. Query-time-only: embedding-engine's indexing-side media
      # embedder below has no equivalent knob, by design.
      MEDIA_EMBEDDER_SOVEREIGN: ${MEDIA_EMBEDDER_SOVEREIGN:-false}
      QDRANT_AUDIO_COLLECTION: ${QDRANT_AUDIO_COLLECTION:-dataplane_audio_segments}
      AUDIO_EMBEDDING_DIMENSION: ${AUDIO_EMBEDDING_DIMENSION:-512}
      # Tower-suffixed on purpose. Each tower produces a DIFFERENT space, so
      # reusing one collection across towers would silently mix incomparable
      # vectors — sometimes at the same width, never with shared meaning. The
      # original `dataplane_video_segments` had 0 points (the LanguageBind arm
      # never started), so nothing is orphaned by the naming.
      QDRANT_VIDEO_COLLECTION: ${QDRANT_VIDEO_COLLECTION:-dataplane_video_segments_siglip2}
      # SigLIP 2 base/patch16-224 = 768 (the default tower). Must equal what
      # media-embedder's /healthz reports as `dim`, or every video upsert fails
      # on vector size. X-CLIP base-patch32 would be 512.
      VIDEO_EMBEDDING_DIMENSION: ${VIDEO_EMBEDDING_DIMENSION:-768}
      # Joint text-vs-image scoring: ColQwen scores mapped onto the fused score
      # range so page images interleave with text by relevance (false = legacy
      # band-preserving order).
      JOINT_MULTIMODAL_RERANK: ${JOINT_MULTIMODAL_RERANK:-true}
      # Deep multi-hop graph arm — graph-index's /v1/graph/traverse (Neo4j
      # read-model, server-side Postgres fallback). The caller's verified
      # bearer is forwarded; graph-index re-verifies + org-pins it itself.
      GRAPH_INDEX_URL: ${GRAPH_INDEX_URL:-http://graph-index:9203}
      GRAPH_REMOTE_TIMEOUT_MS: ${GRAPH_REMOTE_TIMEOUT_MS:-800}
      GRAPH_REMOTE_MAX_HOPS: ${GRAPH_REMOTE_MAX_HOPS:-3}
      # Text cross-encoder rerank endpoint. Empty = public Cohere (api.cohere.ai,
      # Bearer). Set to an Azure AI Foundry Cohere rerank URL to use the in-EU
      # deployment; both api-key and Bearer are accepted there.
      #
      # COHERE_URL is accepted as a fallback because that is the name the .env has
      # always used while the code reads RERANK_ENDPOINT. The two never met, so the
      # Azure key was sent to the public Cohere default URL and every query 401'd
      # -- silently, because rerank failure is non-fatal by design.
      RERANK_ENDPOINT: ${RERANK_ENDPOINT:-${COHERE_URL:-}}
      RERANK_USE_API_KEY: ${RERANK_USE_API_KEY:-false}
      # Must name a deployment that actually exists on the endpoint above, or the
      # call 404s and degrades just as silently. Live deployments on core-ai-rg:
      # Cohere-rerank-v4.0-pro and Cohere-rerank-v4.0-fast. v4.0 is multilingual;
      # the previous rerank-english-v3.0 would have been wrong for Norwegian even
      # if it had existed.
      RERANKER_MODEL: ${RERANKER_MODEL:-Cohere-rerank-v4.0-pro}
      HYBRID_ENABLED: "true"
      SPARSE_SEARCH_BACKEND: ${SPARSE_SEARCH_BACKEND:-postgres}
      QUICKWIT_URL: ${QUICKWIT_URL:-http://quickwit:7280}
      QUICKWIT_INDEX_ID: ${QUICKWIT_INDEX_ID:-dataplane-corpus}
      QUICKWIT_SEARCH_TIMEOUT_MS: ${QUICKWIT_SEARCH_TIMEOUT_MS:-1500}
      # Keyword arm (Meilisearch). Empty MEILISEARCH_API_KEY disables the arm
      # (search/keyword.rs::MeilisearchQueryClient::from_config -> None) —
      # fails closed to "arm off", never to an unauthenticated request.
      MEILISEARCH_URL: ${MEILISEARCH_URL:-http://meilisearch:7700}
      MEILISEARCH_API_KEY: ${MEILISEARCH_MASTER_KEY:?MEILISEARCH_MASTER_KEY is required}
      MEILISEARCH_INDEX_UID: ${MEILISEARCH_INDEX_UID:-dataplane-knowledge}
      W_KEYWORD: ${W_KEYWORD:-0.05}
      # Sparse/BM25 fusion weight. Pinned here rather than left to the Rust
      # default (0.2) so the value is visible and tunable without a rebuild —
      # this is a measured setting, not an assumed one.
      #
      # Measured 2026-08-26, 87 hand-authored judged queries, both eval orgs,
      # all six arms live, sweeping ONLY this weight:
      #
      #   w_bm25   0.0     0.1     0.2     0.3     0.4
      #   recall  .8736   .8851   .8736   .8736   .8621   <- flat, all CIs overlap
      #   nDCG    .7397   .7257   .6899   .6942   .6894   <- monotone decline
      #
      # recall@10 is saturated and statistically indistinguishable across the
      # whole range; nDCG@10 falls ~5 points from 0.0 to 0.4, monotonically in
      # BOTH orgs independently. Reading: on natural-language questions the
      # lexical arm surfaces documents the dense arm already found, ranked
      # worse — raising this weight buys no recall and costs ordering.
      #
      # 0.1 rather than 0.0, deliberately: the 87-query set is natural-language
      # questions and under-represents exact-term and Norwegian-morphology
      # lookups, which is precisely where BM25 earns its keep (and where the
      # dense arm is weakest). 0.1 keeps the arm alive for those queries while
      # giving back most of the measured nDCG. Re-measure with `scripts/eval-*`
      # before moving it again — especially once keyword-style queries are in
      # the golden set.
      W_BM25: ${W_BM25:-0.1}
      # Retrieve-wide / rerank-narrow: how many fused candidates go to the
      # cross-encoder per query. The six-arm fused list runs 150+ deep; sending
      # all of it sharded each query into ~5 concurrent Cohere calls, which
      # against the Foundry S0 per-second quota meant 93/94 queries silently
      # degrading to fused order (rerank failure is non-fatal by design, so the
      # only symptom was rerank_score: 0.0 everywhere). At 50, each query is
      # exactly one provider call and one comparable scoring pass.
      RERANK_TOP_K: ${RERANK_TOP_K:-50}
      # Membership authorization is always strict. Retrieval uses its registered
      # service credential only to mint an org-bound, short-lived
      # aud=control-policy bearer, then calls the versioned decision endpoint.
      # Per-user ownership: resolve viewer grants from user-core's resource_grants
      # facade (reached over inter-plane-bus). HTTP/facade port is 3012, NOT 8080.
      USER_CORE_HTTP_URL: ${USER_CORE_HTTP_URL:-http://user-core:3012}
      USER_CORE_SERVICE_TOKEN: ${USER_CORE_RETRIEVAL_TOKEN:-}
      # Org-axis membership and per-user ownership are both enforced. Only an
      # explicitly gated insecure development posture can select the no-op:
      # setting CONTROL_PLANE_ENFORCEMENT=off ALSO requires
      # ALLOW_INSECURE_DEV_DEFAULTS=1 (main.rs refuses otherwise) and the
      # service logs the downgrade at startup. Interpolated rather than
      # hardcoded so a LOCAL DEV stack can run without a membership authority
      # — e.g. service-principal callers, which can never be Better Auth
      # members — while every real deployment keeps the strict default.
      CONTROL_PLANE_ENFORCEMENT: ${CONTROL_PLANE_ENFORCEMENT:-strict}
      ALLOW_INSECURE_DEV_DEFAULTS: ${ALLOW_INSECURE_DEV_DEFAULTS:-0}
      CONTROL_POLICY_TOKEN_URL: ${CONTROL_POLICY_TOKEN_URL:-http://auth-core:3011/api/control-policy/internal-token}
      CONTROL_PLANE_DECISION_URL: ${CONTROL_PLANE_DECISION_URL:-http://auth-core:3011/api/v1/internal/authorization/data-plane/decision}
      CONTROL_POLICY_SERVICE_ID: ${CONTROL_POLICY_SERVICE_ID:-retrieval-engine}
      CONTROL_POLICY_SERVICE_API_KEY: ${CONTROL_POLICY_SERVICE_API_KEY:-}
      # Verified-JWT path: when the gateway forwards a Bearer token minted by
      # auth-core (POST /api/data-plane/internal-token | GET /api/data-plane/token,
      # aud=data-plane), the HTTP middleware + gRPC interceptor verify it against
      # this PUBLIC key and bind the viewer from the signed `sub` (preferred over
      # the forwarded x-user-id header). The key file is auth-core's PUBLIC key,
      # mounted read-only (public material, gitignored). AUDIENCE pins data-plane
      # so a token leaked to another plane can't authenticate here. ISSUER matches
      # auth-core's stamped `iss`. Missing verification material fails closed;
      # caller-supplied API keys and identity headers are never an identity.
      JWT_PUBLIC_KEY_FILE: /app/keys/convex-auth.pub
      JWT_REQUIRED_AUDIENCE: ${JWT_REQUIRED_AUDIENCE:-data-plane}
      JWT_REQUIRED_ISSUER: ${JWT_REQUIRED_ISSUER:-http://auth-core:3011/api/convex-auth}
      ENABLE_SIGNED_EVENT_CONSUMERS: ${ENABLE_SIGNED_EVENT_CONSUMERS:-1}
      DOCUMENTS_EVENT_PUBLIC_KEY_PATH: /run/event-keys/documents-events.pub
      RETRIEVAL_EVENT_PRIVATE_KEY_PATH: /run/event-keys/retrieval-events.pem
      EVENT_AUTH_AUDIENCE: dataplane-events
      # Tower middleware tuning (v2.1)
      GRPC_TIMEOUT_SECS: ${GRPC_TIMEOUT_SECS:-30}
      GRPC_MAX_CONCURRENT: ${GRPC_MAX_CONCURRENT:-256}
      # Postgres pool tuning (v2.2)
      PG_MAX_CONNECTIONS: ${PG_MAX_CONNECTIONS:-20}
      PG_MIN_CONNECTIONS: ${PG_MIN_CONNECTIONS:-2}
      PG_ACQUIRE_TIMEOUT_SECS: ${PG_ACQUIRE_TIMEOUT_SECS:-5}
      # Optional OTel collector
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Log target is the bin/crate name `retrieval_engine` (package is
      # `retrieval-engine-rs`); the old `retrieval_engine_rs=info` matched nothing.
      RUST_LOG: ${RUST_LOG:-warn,retrieval_engine=info,tower_http=info}
      # Cross-plane GDPR organization-erasure purge consumer — a SECOND,
      # narrowly-scoped connection to control-shared-nats (identity
      # "retrieval-engine-gdpr"), kept entirely separate from NATS_URL/
      # DATAPLANE_NATS_TOKEN above (the Data-Plane-local broker this
      # service's cache invalidator + cost-ledger publisher use — that
      # broker does not host AQENCIA_CONTROLPLANE). Deliberately distinct env
      # var names from NATS_SHARED_URL/SHARED_NATS_URL already in play for
      # other services/fallbacks — see src/gdpr/consumer.rs's module doc.
      # Empty URL leaves the consumer disabled (logged, non-fatal) rather
      # than hot-looping doomed connection attempts.
      RETRIEVAL_ENGINE_GDPR_NATS_URL: ${RETRIEVAL_ENGINE_GDPR_NATS_URL:-}
      RETRIEVAL_ENGINE_GDPR_NATS_USER: ${RETRIEVAL_ENGINE_GDPR_NATS_USER:-retrieval-engine-gdpr}
      RETRIEVAL_ENGINE_GDPR_NATS_PASSWORD: ${RETRIEVAL_ENGINE_GDPR_NATS_PASSWORD:-}
    volumes:
      # auth-core's PUBLIC JWT key (read-only) for verified-JWT viewer binding.
      - "${AUTH_CORE_PUBLIC_KEY_PATH:-../Control Plane/auth-core/keys/convex-auth.pub}:/app/keys/convex-auth.pub:ro"
      - ${DOCUMENTS_EVENT_VERIFYING_PUBLIC_KEY_PATH:-.secrets/event-keys/documents-events.pub}:/run/event-keys/documents-events.pub:ro
      - ${RETRIEVAL_EVENT_SIGNING_PRIVATE_KEY_PATH:-.secrets/event-keys/retrieval-events.pem}:/run/event-keys/retrieval-events.pem:ro
    networks:
      dpv2-net:
      inter-plane-bus:
        aliases:
          - dpv2-retrieval-engine
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      nats:
        condition: service_healthy
      quickwit:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8004/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  index-engine:
    <<: *hardened-runtime
    build:
      context: .
      dockerfile: services/index-engine-rs/Dockerfile
      args: *build-metadata
    restart: unless-stopped
    init: true
    expose:
      - "9201"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dataplane}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-dataplane}
      NATS_URL: nats://data-nats:4222
      DATAPLANE_NATS_TOKEN: ${DATAPLANE_NATS_TOKEN:?DATAPLANE_NATS_TOKEN is required}
      ADMIN_PORT: "9201"
      # Failed-embedding reconciler (src/reconcile.rs). These were code-only
      # defaults; they are surfaced because this loop is now the RECOVERY PATH
      # for expired event envelopes, not just a rare-failure sweeper.
      #
      # A signed envelope lives 120s but rides a 7-day durable queue, so any
      # embedding backlog longer than two minutes expires messages in place.
      # embedding-engine marks those units `failed` (it used to drop them
      # silently, losing 1,044 of 1,164 chunks on one 95-document ingest) and
      # this loop re-emits them under a fresh envelope.
      #
      # BATCH is therefore a throughput knob with a ceiling: it must stay small
      # enough that a tick's worth of chunks embeds inside the 120s envelope
      # life, or the re-drive expires too. 25/tick is the conservative default;
      # the code clamps to 500.
      EMBEDDING_RECONCILE_ENABLED: ${EMBEDDING_RECONCILE_ENABLED:-1}
      EMBEDDING_RECONCILE_BATCH: ${EMBEDDING_RECONCILE_BATCH:-25}
      EMBEDDING_RECONCILE_INTERVAL_SECS: ${EMBEDDING_RECONCILE_INTERVAL_SECS:-60}
      EMBEDDING_RECONCILE_COOLDOWN_SECS: ${EMBEDDING_RECONCILE_COOLDOWN_SECS:-300}
      EMBEDDING_RECONCILE_MAX_ATTEMPTS: ${EMBEDDING_RECONCILE_MAX_ATTEMPTS:-5}
      CHUNK_SIZE: "512"
      CHUNK_OVERLAP: "64"
      BATCH_SIZE: "10"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      RUST_LOG: ${RUST_LOG:-warn,index_engine=info}
      ENABLE_SIGNED_EVENT_CONSUMERS: ${ENABLE_SIGNED_EVENT_CONSUMERS:-1}
      DOCUMENTS_EVENT_PUBLIC_KEY_PATH: /run/event-keys/documents-events.pub
      INDEX_EVENT_PRIVATE_KEY_PATH: /run/event-keys/index-events.pem
      EVENT_AUTH_AUDIENCE: dataplane-events
      # Cross-plane GDPR organization-erasure consumer (knowledge_units +
      # index_deletion_outbox). Dedicated shared-broker identity, distinct
      # from this service's own NATS_URL/DATAPLANE_NATS_TOKEN connection to
      # data-nats above. Left empty, the consumer disables itself instead of
      # looping doomed connection attempts against data-nats (see
      # src/gdpr_nats.rs).
      NATS_SHARED_URL: ${NATS_SHARED_URL:-}
      NATS_SHARED_USER: ${INDEX_ENGINE_GDPR_NATS_USER:-index-engine-gdpr}
      NATS_SHARED_PASSWORD: ${INDEX_ENGINE_GDPR_NATS_PASSWORD:-}
    volumes:
      - ${DOCUMENTS_EVENT_VERIFYING_PUBLIC_KEY_PATH:-.secrets/event-keys/documents-events.pub}:/run/event-keys/documents-events.pub:ro
      - ${INDEX_EVENT_SIGNING_PRIVATE_KEY_PATH:-.secrets/event-keys/index-events.pem}:/run/event-keys/index-events.pem:ro
    networks:
      dpv2-net:
      inter-plane-bus:
        aliases:
          - dpv2-index-engine
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9201/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  embedding-engine:
    <<: *hardened-runtime
    build:
      context: .
      dockerfile: services/embedding-engine-rs/Dockerfile
      args: *build-metadata
      additional_contexts:
        model-plane-proto: "../Model Plane/proto"
    restart: unless-stopped
    init: true
    expose:
      - "9202"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dataplane}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-dataplane}
      QDRANT_URL: http://qdrant:6334
      NATS_URL: nats://data-nats:4222
      DATAPLANE_NATS_TOKEN: ${DATAPLANE_NATS_TOKEN:?DATAPLANE_NATS_TOKEN is required}
      ADMIN_PORT: "9202"
      BATCH_SIZE: "32"
      # D-B (2026-08-08, sovereign-rag-phased-plan.md Phase 3b): dense text
      # migrated to Cohere Embed v4 — the real corpus is confirmed
      # Norwegian-first and text-embedding-3-large is English-tuned. New
      # collection name (not a resize): Embed v4's 1536-dim output is not
      # compatible with the old 3072-dim `dataplane_knowledge` collection, so
      # this points at a fresh collection re-embedded via
      # `reembed-switch` rather than colliding with the old one.
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-dataplane_knowledge_embedv4}
      # Cohere Embed v4 Matryoshka width, now sent on the wire (not just used
      # to size the Qdrant collection). ONLY 256/512/1024/1536 are valid
      # truncation points; anything else refuses to boot. Both engines read this
      # SAME variable and must agree — a query embedded at a different width
      # than the corpus was indexed at fails every search, so change it only
      # together with a re-embed into a fresh collection.
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      # Direct Cohere Embed v4 (Azure AI Foundry), not routed through the
      # Model Plane — mirrors how the visual arm already calls Embed v4
      # directly below. ZDR content fails closed on this path (Embed v4 here
      # is a retaining provider); an EU/ZDR-compliant path remains a Phase-4+
      # prerequisite, same caveat the prior azure_openai/model_plane choices
      # already carried.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-cohere}
      MODEL_PLANE_AI_CORE_GRPC_URL: ${MODEL_PLANE_AI_CORE_GRPC_URL:-http://inference-core:9092}
      MODEL_PLANE_EMBEDDING_PROVIDER: ${MODEL_PLANE_EMBEDDING_PROVIDER:-azure_openai}
      MODEL_PLANE_EMBEDDING_TIMEOUT_MS: ${MODEL_PLANE_EMBEDDING_TIMEOUT_MS:-30000}
      # Background embedding calls mint an org-bound, aud=inference-core
      # service bearer through Auth Core. A shared x-api-key is never accepted
      # by inference-core and is intentionally not wired here.
      MODEL_PLANE_INFERENCE_TOKEN_URL: ${MODEL_PLANE_INFERENCE_TOKEN_URL:-http://auth-core:3011/api/inference-core/internal-token}
      MODEL_PLANE_INFERENCE_TOKEN_ISSUER: ${AUTH_CORE_ISSUER:-http://auth-core:3011/api/convex-auth}
      MODEL_PLANE_INFERENCE_SERVICE_ID: ${MODEL_PLANE_EMBEDDING_INFERENCE_SERVICE_ID:-embedding-engine}
      MODEL_PLANE_INFERENCE_SERVICE_API_KEY: ${MODEL_PLANE_EMBEDDING_INFERENCE_SERVICE_API_KEY:-}
      # persistent | zdr | tenant: the posture this client asserts on its token.
      # persistent and zdr must equal this principal's retentionByAudience entry
      # for inference-core in the principal registry. tenant accepts either: the
      # token's zdr is the ORGANIZATION's own setting, resolved by Auth Core at the
      # mint (60 s lifetime, no token when the posture cannot be resolved). Ship
      # the client, set this to tenant, then change the registry; never the other
      # way round. An unknown value stops the service at startup, and
      # `make cross-plane-env` checks it. (graph-index has its own variable.)
      MODEL_PLANE_INFERENCE_RETENTION_POSTURE: ${MODEL_PLANE_EMBEDDING_INFERENCE_RETENTION_POSTURE:-persistent}
      # Contextual Retrieval (Anthropic, 2024) — prepend LLM-generated
      # situating context to each chunk BEFORE embedding, so a chunk whose
      # subject only appears elsewhere in the document is still findable.
      # Reported to cut retrieval failures ~35% for contextual embeddings alone.
      #
      # ON by default, and kept on (owner ruling of 2026-10-03). The cost is bounded and
      # metered, not avoided: contexts are generated inline within a time box (CONTEXT_INLINE_*)
      # and otherwise by the reconciler, within its caps and behind its circuit breaker
      # (CONTEXT_RECONCILER_*), and every provider call is a usage event once the ledger is on
      # (USAGE_EMIT_ENABLED). Every variable below has a default, so a deployment whose
      # environment says nothing about them generates contexts: the git-ignored .env is no
      # longer what keeps the feature on. Each one is documented in .env.example.
      #
      # CONTEXTUAL_RETRIEVAL_ENABLED=false is the INCIDENT KILL SWITCH, for the case in which
      # content must stop going to the provider (a confirmed posture failure, a provider
      # incident, a legal instruction), never for load or cost. The service refuses to start
      # with it off unless CONTEXT_RETRIEVAL_KILL_SWITCH_REASON says why (8 to 240 characters,
      # one line); the reason is logged at startup and reported by /readyz. It takes the model
      # away and removes nothing: stored contexts stay, and the reconciler's repairs go on.
      # An empty value of the switch is the default (on), never off.
      #
      # Restricted (ZDR) documents are never contextualized — their text must
      # not reach a model provider — and any failure falls back to embedding the
      # raw chunk, so an inference outage degrades quality without failing an
      # ingest. The embedded text changes; the stored/displayed chunk does not
      # (the context is stored alone, in knowledge_units.chunk_context).
      CONTEXTUAL_RETRIEVAL_ENABLED: ${CONTEXTUAL_RETRIEVAL_ENABLED:-true}
      CONTEXT_RETRIEVAL_KILL_SWITCH_REASON: ${CONTEXT_RETRIEVAL_KILL_SWITCH_REASON:-}
      # The model is the Azure deployment inference-core serves, always named: the shared
      # gpt-4o-mini deployment by default. A dedicated background deployment alias (an operator
      # action on inference-core's catalog) is another value of this one variable; until it
      # exists the caps, the retry-after and the circuit breaker below are what protect chat's
      # share of the shared deployment. A small fast model is the right fit: the task is one or
      # two situating sentences, not reasoning.
      CONTEXTUAL_RETRIEVAL_MODEL: ${CONTEXTUAL_RETRIEVAL_MODEL:-gpt-4o-mini}
      # The route is pinned and so is the residency floor: an empty value takes these, never
      # "any provider" or "no floor" (the floor is only as good as inference-core's
      # AZURE_OPENAI_REGION). The prompt is ctx-v1, the one every stored context came from;
      # ctx-v2 ships only through the evaluation gate. A document up to WINDOW_CHARS is read
      # whole, a longer one in overlapping sections.
      CONTEXTUAL_RETRIEVAL_PROVIDER_HINT: ${CONTEXTUAL_RETRIEVAL_PROVIDER_HINT:-azure-openai}
      CONTEXTUAL_RETRIEVAL_MIN_RESIDENCY: ${CONTEXTUAL_RETRIEVAL_MIN_RESIDENCY:-eu}
      CONTEXTUAL_RETRIEVAL_PROMPT_VERSION: ${CONTEXTUAL_RETRIEVAL_PROMPT_VERSION:-ctx-v1}
      CONTEXTUAL_RETRIEVAL_WINDOW_CHARS: ${CONTEXTUAL_RETRIEVAL_WINDOW_CHARS:-32000}
      # Prompt-side cap on document text (~48k chars ≈ 12k tokens). Stops one
      # oversized upload from exceeding the context window or costing hundreds
      # of times a normal document.
      CONTEXTUAL_RETRIEVAL_MAX_DOCUMENT_CHARS: ${CONTEXTUAL_RETRIEVAL_MAX_DOCUMENT_CHARS:-48000}
      CONTEXTUAL_RETRIEVAL_MAX_TOKENS: ${CONTEXTUAL_RETRIEVAL_MAX_TOKENS:-128}
      CONTEXTUAL_RETRIEVAL_TIMEOUT_MS: ${CONTEXTUAL_RETRIEVAL_TIMEOUT_MS:-30000}
      # Chunks of one document contextualized concurrently. Bounded so a single
      # large document cannot crowd out every other tenant's embedding traffic.
      CONTEXTUAL_RETRIEVAL_CONCURRENCY: ${CONTEXTUAL_RETRIEVAL_CONCURRENCY:-4}
      # Retries per chunk on a transient inference status. A provider rate limit
      # otherwise costs coverage silently: the chunk embeds raw, the ingest
      # reports success, and nothing records that context is missing. Measured
      # on the eval corpus before this existed: 864/1164 chunks (74%)
      # contextualized, the shortfall entirely ResourceExhausted from Azure's
      # per-minute quota. 4 attempts x doubling from 2s spans ~30s, matching the
      # Retry-After this deployment returns.
      CONTEXTUAL_RETRIEVAL_RETRY_ATTEMPTS: ${CONTEXTUAL_RETRIEVAL_RETRY_ATTEMPTS:-4}
      CONTEXTUAL_RETRIEVAL_RETRY_BASE_MS: ${CONTEXTUAL_RETRIEVAL_RETRY_BASE_MS:-2000}
      # How much of one batch's time may go to generating contexts inline, in milliseconds: a
      # chunk not finished by then is embedded raw, left pending, and filled by the reconciler
      # (0 makes all generation asynchronous). At most 30000, half of the 60 s ack wait of the
      # consumer, because a batch that runs past it is redelivered and its contexts are paid for
      # twice. A document's share never exceeds the batch's, and DOCUMENT_CONCURRENCY documents
      # of one batch run at once, so the most provider calls one batch has in flight is that
      # times CONTEXTUAL_RETRIEVAL_CONCURRENCY. Raise them with the dedicated deployment alias,
      # not before.
      CONTEXT_INLINE_BUDGET_MS: ${CONTEXT_INLINE_BUDGET_MS:-20000}
      CONTEXT_INLINE_DOCUMENT_BUDGET_MS: ${CONTEXT_INLINE_DOCUMENT_BUDGET_MS:-8000}
      CONTEXT_INLINE_DOCUMENT_CONCURRENCY: ${CONTEXT_INLINE_DOCUMENT_CONCURRENCY:-2}
      # Caption-to-text for video — the ONLY way motion and ordering become
      # retrievable. No video embedding tower distinguishes a video from its own
      # reverse: measured cos 1.000000 locally for SigLIP 2 and X-CLIP, and on
      # the published RTime-Binary benchmark CLIP/UMT/InternVideo2-1B all score
      # ~50% (chance). So instead a vision model describes each segment's
      # time-ordered filmstrip in prose, and that prose is indexed as TEXT,
      # where word order is something the arms actually model. See
      # docs/core-research/video-temporal-retrieval-gap-2026-08-25.md.
      #
      # OFF by default for two reasons: one vision call per video segment is a
      # real per-tenant cost, and this is the ONLY path in the media arm that
      # EGRESSES content. Restricted (ZDR) documents are refused before a frame
      # is extracted, reading the classification from the documents row rather
      # than the event, and failing closed if it cannot be read.
      #
      # Captions land as knowledge_units rows, so they reach BOTH text arms:
      # BM25 immediately (content_tsv is generated) and the dense text arm via
      # an upsert into QDRANT_COLLECTION. Failure is always partial-at-worst —
      # the segment keeps its own vector and simply has no caption.
      VIDEO_CAPTION_ENABLED: ${VIDEO_CAPTION_ENABLED:-false}
      # Required when enabled — no default, so the vision model (and its cost)
      # is always an explicit choice. Needs a model that accepts images.
      VIDEO_CAPTION_MODEL: ${VIDEO_CAPTION_MODEL:-}
      VIDEO_CAPTION_PROVIDER_HINT: ${VIDEO_CAPTION_PROVIDER_HINT:-}
      # The prompt asks for two to four sentences; 256 leaves room for that
      # without inviting an essay that dilutes the retrieval signal.
      VIDEO_CAPTION_MAX_TOKENS: ${VIDEO_CAPTION_MAX_TOKENS:-256}
      VIDEO_CAPTION_TIMEOUT_MS: ${VIDEO_CAPTION_TIMEOUT_MS:-60000}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-text-embedding-3-large}
      # Phase-2 visual RAG — Cohere Embed v4 (multimodal) page-image embeddings.
      # Same core-ai-rg Foundry resource + key as Cohere rerank; the DEPLOYED
      # model is `embed-v-4-0` (NOT the code default `Cohere-embed-4`). Setting the
      # endpoint activates the page-image consumer (embeds pages → visual collection).
      COHERE_EMBED_V4_ENDPOINT: ${COHERE_EMBED_V4_ENDPOINT:-}
      COHERE_EMBED_V4_API_KEY: ${COHERE_API_KEY:-}
      COHERE_EMBED_V4_DEPLOYMENT: ${COHERE_EMBED_V4_DEPLOYMENT:-embed-v-4-0}
      COHERE_EMBED_V4_API_VERSION: ${COHERE_EMBED_V4_API_VERSION:-2024-05-01-preview}
      QDRANT_VISUAL_COLLECTION: ${QDRANT_VISUAL_COLLECTION:-dataplane_page_images}
      VISUAL_EMBEDDING_DIMENSION: ${VISUAL_EMBEDDING_DIMENSION:-1536}
      # Audio/video arms (services/media-embedder). Dark until the endpoint is
      # set. Dimensions must match the towers: CLAP 512, LanguageBind 768 —
      # Qdrant fixes vector size per collection, so a tower swap means a new
      # collection rather than a resize.
      MEDIA_EMBEDDER_ENDPOINT: ${MEDIA_EMBEDDER_ENDPOINT:-}
      QDRANT_AUDIO_COLLECTION: ${QDRANT_AUDIO_COLLECTION:-dataplane_audio_segments}
      AUDIO_EMBEDDING_DIMENSION: ${AUDIO_EMBEDDING_DIMENSION:-512}
      # Tower-suffixed on purpose. Each tower produces a DIFFERENT space, so
      # reusing one collection across towers would silently mix incomparable
      # vectors — sometimes at the same width, never with shared meaning. The
      # original `dataplane_video_segments` had 0 points (the LanguageBind arm
      # never started), so nothing is orphaned by the naming.
      QDRANT_VIDEO_COLLECTION: ${QDRANT_VIDEO_COLLECTION:-dataplane_video_segments_siglip2}
      # SigLIP 2 base/patch16-224 = 768 (the default tower). Must equal what
      # media-embedder's /healthz reports as `dim`, or every video upsert fails
      # on vector size. X-CLIP base-patch32 would be 512.
      VIDEO_EMBEDDING_DIMENSION: ${VIDEO_EMBEDDING_DIMENSION:-768}
      # Admits the page-image consumer alongside the signed text consumers
      # (the quarry-edge producer does not sign envelopes yet). Default OFF;
      # see main.rs for the narrow trust delta this gate accepts.
      ALLOW_UNSIGNED_PAGE_IMAGE_EVENTS: ${ALLOW_UNSIGNED_PAGE_IMAGE_EVENTS:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # NOTE: the log target is the BIN/crate name `embedding_engine` (package is
      # `embedding-engine-rs`). The old `embedding_engine_rs=info` matched nothing →
      # silent empty logs. (Code default in main.rs has the same wrong name — fix on
      # next rebuild; this compose value overrides it at runtime.)
      RUST_LOG: ${RUST_LOG:-warn,embedding_engine=info,inference_client_rs=info}
      ENABLE_SIGNED_EVENT_CONSUMERS: ${ENABLE_SIGNED_EVENT_CONSUMERS:-1}
      INDEX_EVENT_PUBLIC_KEY_PATH: /run/event-keys/index-events.pub
      WIKI_EVENT_PUBLIC_KEY_PATH: /run/event-keys/wiki-events.pub
      EMBEDDING_EVENT_PRIVATE_KEY_PATH: /run/event-keys/embedding-events.pem
      # The usage ledger (CR-T10): record every paid provider call (contextual retrieval,
      # embedding) as a signed version 2 event on the durable DATAPLANE_COST stream. OFF until
      # data-orchestrator runs the consumer that reads the stream (consumers and verifiers ship
      # before producers: the old consumer logs an event it cannot read as invalid and drops it).
      # Turned on, the service refuses to start unless signed events are enabled and the stream
      # can be created or verified. 1 or true turns it on. Off, the version 1 cost event is
      # published as before.
      USAGE_EMIT_ENABLED: ${USAGE_EMIT_ENABLED:-0}
      # The context reconciler (CR-T9a): the DB-truth loop that fills the units that have no
      # context, verifies the legacy ones (re-embeds the stored context, no model is asked),
      # re-embeds a vector that is not the one its stored context makes, rechecks the units skipped
      # for zero retention once an hour, and announces a document only when a context was written
      # for it. OFF until the live proof (runbook 5.2): `0` first, `1` with the caps below after.
      # Turned on, the service refuses to start unless signed events are enabled, and every value
      # below is checked at startup (one out of range names its variable). The pause file is the
      # kill switch that needs no restart: `docker exec <container> touch <file>`.
      CONTEXT_RECONCILER_ENABLED: ${CONTEXT_RECONCILER_ENABLED:-0}
      CONTEXT_RECONCILER_INTERVAL_SECS: ${CONTEXT_RECONCILER_INTERVAL_SECS:-30}
      # The most units one pass leases in all, and for one organization (the rest wait their turn).
      CONTEXT_RECONCILER_UNITS_PER_PASS: ${CONTEXT_RECONCILER_UNITS_PER_PASS:-32}
      CONTEXT_RECONCILER_ORG_UNITS_PER_PASS: ${CONTEXT_RECONCILER_ORG_UNITS_PER_PASS:-16}
      # Documents worked at once, in all and for one organization, and chunks of one document
      # contextualized at once. The most provider calls in flight is the first times the third (4).
      CONTEXT_RECONCILER_CONCURRENCY: ${CONTEXT_RECONCILER_CONCURRENCY:-2}
      CONTEXT_RECONCILER_ORG_CONCURRENCY: ${CONTEXT_RECONCILER_ORG_CONCURRENCY:-1}
      CONTEXT_RECONCILER_CHUNK_CONCURRENCY: ${CONTEXT_RECONCILER_CHUNK_CONCURRENCY:-2}
      CONTEXT_RECONCILER_LEASE_SECS: ${CONTEXT_RECONCILER_LEASE_SECS:-300}
      CONTEXT_RECONCILER_BUDGET_MS: ${CONTEXT_RECONCILER_BUDGET_MS:-30000}
      CONTEXT_RECONCILER_DOCUMENT_BUDGET_MS: ${CONTEXT_RECONCILER_DOCUMENT_BUDGET_MS:-25000}
      # A retryable failure that fails this often becomes failed_permanent, with an alert.
      CONTEXT_RECONCILER_MAX_ATTEMPTS: ${CONTEXT_RECONCILER_MAX_ATTEMPTS:-8}
      # The circuit breaker: this many passes in a row in which the provider failed everything
      # pause the reconciler for the pause, and a refused credential does at once.
      CONTEXT_RECONCILER_BREAKER_FAILURES: ${CONTEXT_RECONCILER_BREAKER_FAILURES:-3}
      CONTEXT_RECONCILER_BREAKER_PAUSE_SECS: ${CONTEXT_RECONCILER_BREAKER_PAUSE_SECS:-300}
      CONTEXT_RECONCILER_PAUSE_FILE: ${CONTEXT_RECONCILER_PAUSE_FILE:-/tmp/context-reconciler.pause}
      CONTEXT_RECONCILER_ZDR_RECHECK_SECS: ${CONTEXT_RECONCILER_ZDR_RECHECK_SECS:-3600}
      CONTEXT_RECONCILER_SWEEP_SECS: ${CONTEXT_RECONCILER_SWEEP_SECS:-300}
      # Regenerate the contexts of a document that changed after they were made (a chunk whose
      # inputs did not change costs nothing). OFF: an edited document costs a call per chunk.
      CONTEXT_RECONCILER_STALE_ENABLED: ${CONTEXT_RECONCILER_STALE_ENABLED:-0}
      CONTEXT_RECONCILER_STALE_DOCUMENTS: ${CONTEXT_RECONCILER_STALE_DOCUMENTS:-8}
      # A prompt refresh: regenerate the contexts made with another prompt version than the one in
      # force. OFF, and always capped: with the flag on the service refuses to start unless the cap
      # is above zero. The cap is per process (a restart grants it again).
      CONTEXT_REFRESH_ON_PROMPT_CHANGE: ${CONTEXT_REFRESH_ON_PROMPT_CHANGE:-0}
      CONTEXT_REFRESH_MAX_UNITS: ${CONTEXT_REFRESH_MAX_UNITS:-0}
      # The background LLM budget gate (CR-T9b, owner default D-E): the same four variables, with
      # the same defaults, that graph-index reads, so one setting in the git-ignored .env holds
      # for both. Configurable per organization (org_processing_policy) and here for every
      # organization that sets none; ALERT-ONLY by default (over a figure it logs, counts
      # ctx_budget_exceeded_total on /metrics and keeps working), `throttle` works one chunk at a
      # time, `stop` marks the units skipped_budget and asks no model until the budget allows it.
      # NO figure and NO prices are built in (the owner supplies them): blank means none, and with
      # no figure the gate reads nothing. The spend is the month's `llm` tokens in cost_events
      # priced with the two prices below, which go together or not at all. Boot checks: an
      # unknown mode, a bad number, one price without the other, and a throttle or stop with a
      # figure and no prices or with USAGE_EMIT_ENABLED off (a limit that could never fire) all
      # stop the service naming the variable.
      BACKGROUND_BUDGET_MODE: ${BACKGROUND_BUDGET_MODE:-alert_only}
      BACKGROUND_BUDGET_MONTHLY_USD: ${BACKGROUND_BUDGET_MONTHLY_USD:-}
      BACKGROUND_PRICE_INPUT_USD_PER_MTOK: ${BACKGROUND_PRICE_INPUT_USD_PER_MTOK:-}
      BACKGROUND_PRICE_OUTPUT_USD_PER_MTOK: ${BACKGROUND_PRICE_OUTPUT_USD_PER_MTOK:-}
      # Verifies dataplane.documents.deleted for the per-document erasure
      # consumer (document_erasure_consumer.rs). Same key file already
      # mounted into quickwit-adapter/retrieval-engine/graph-index for the
      # same producer/subject.
      DOCUMENTS_EVENT_PUBLIC_KEY_PATH: /run/event-keys/documents-events.pub
      EVENT_AUTH_AUDIENCE: dataplane-events
      # GDPR/DSAR erasure completeness for the visual arm's MinIO CAS objects
      # (raw page binaries + rendered PNGs) — see cas_store.rs. Unset bucket
      # disables CAS erasure only; the Qdrant-vector purge this crate already
      # does still runs. Root credentials, not the CAS_INGESTION_* scoped
      # writer key minio-init provisions for Ingestion Plane: that key grants
      # only Get/Put (never Delete — see minio-init's inline policy above),
      # and this service lives inside Data Plane v2's own trust boundary
      # (matching the `quickwit` service's identical use of MINIO_ROOT_* below
      # in this file), not the cross-plane one that credential exists for.
      CAS_BUCKET: ${CAS_BUCKET:-dataplane-cas}
      CAS_ENDPOINT_URL: ${CAS_ENDPOINT_URL:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # Cross-plane GDPR organization-erasure purge consumer — a SECOND,
      # narrowly-scoped connection to control-shared-nats (identity
      # "embedding-engine-gdpr"), kept entirely separate from NATS_URL/
      # DATAPLANE_NATS_TOKEN above (the Data-Plane-local broker this
      # service's embedding/wiki/page-image consumers use — that broker does
      # not host AQENCIA_CONTROLPLANE). Deliberately distinct env var names
      # from NATS_SHARED_URL/SHARED_NATS_URL already in play for other
      # services/fallbacks — see src/gdpr_nats.rs's module doc. Empty URL
      # leaves the consumer disabled (logged, non-fatal) rather than
      # hot-looping doomed connection attempts.
      EMBEDDING_ENGINE_GDPR_NATS_URL: ${EMBEDDING_ENGINE_GDPR_NATS_URL:-}
      EMBEDDING_ENGINE_GDPR_NATS_USER: ${EMBEDDING_ENGINE_GDPR_NATS_USER:-embedding-engine-gdpr}
      EMBEDDING_ENGINE_GDPR_NATS_PASSWORD: ${EMBEDDING_ENGINE_GDPR_NATS_PASSWORD:-}
    volumes:
      - ${INDEX_EVENT_VERIFYING_PUBLIC_KEY_PATH:-.secrets/event-keys/index-events.pub}:/run/event-keys/index-events.pub:ro
      - ${WIKI_EVENT_VERIFYING_PUBLIC_KEY_PATH:-.secrets/event-keys/wiki-events.pub}:/run/event-keys/wiki-events.pub:ro
      - ${EMBEDDING_EVENT_SIGNING_PRIVATE_KEY_PATH:-.secrets/event-keys/embedding-events.pem}:/run/event-keys/embedding-events.pem:ro
      - ${DOCUMENTS_EVENT_VERIFYING_PUBLIC_KEY_PATH:-.secrets/event-keys/documents-events.pub}:/run/event-keys/documents-events.pub:ro
    networks:
      dpv2-net:
      inter-plane-bus:
        aliases:
          - dpv2-embedding-engine
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9202/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  graph-index:
    <<: *hardened-runtime
    build:
      context: .
      dockerfile: services/graph-index-rs/Dockerfile
      args: *build-metadata
      additional_contexts:
        model-plane-proto: "../Model Plane/proto"
    restart: unless-stopped
    init: true
    expose:
      - "9203"
      - "50053"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-dataplane}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-dataplane}
      NATS_URL: nats://data-nats:4222
      DATAPLANE_NATS_TOKEN: ${DATAPLANE_NATS_TOKEN:?DATAPLANE_NATS_TOKEN is required}
      ADMIN_PORT: "9203"
      # Graph entity/relationship extraction routes through the Model Plane
      # (gRPC → inference-core Infer) and NOWHERE ELSE. The direct-Azure backend
      # (GRAPH_EXTRACTION_PROVIDER=azure_openai, the Azure key and endpoint) is
      # deleted: flipping that one variable bypassed the Auth Core service token,
      # the organization's retention posture, metering and the typed errors, and
      # selecting it is now a startup error. This block therefore holds no Azure
      # key and no Azure endpoint, and tests/scripts/graph-index-no-azure-contract-test.sh
      # fails when one comes back.
      MODEL_PLANE_AI_CORE_GRPC_URL: ${MODEL_PLANE_AI_CORE_GRPC_URL:-http://inference-core:9092}
      MODEL_PLANE_EXTRACTION_MODEL: ${MODEL_PLANE_EXTRACTION_MODEL:-gpt-4o-mini}
      MODEL_PLANE_EXTRACTION_PROVIDER: ${MODEL_PLANE_EXTRACTION_PROVIDER:-azure_openai}
      MODEL_PLANE_EXTRACTION_TIMEOUT_MS: ${MODEL_PLANE_EXTRACTION_TIMEOUT_MS:-60000}
      # Database-truth reconciler for extraction the event path could not
      # deliver. Graph extraction is one inference call PER CHUNK (~30s/document),
      # so a backlog outlives the 120s signed-envelope TTL and every document
      # behind the head of the queue is dropped and acked — measured 12 announced,
      # 2 extracted, 10 discarded. This loop re-extracts them by reading Postgres,
      # so nothing can expire. ON by default: a config-gated fix ships inert on a
      # deployment whose .env was never updated, and the blast radius is bounded
      # by the batch size below (extraction is idempotent on content-derived ids).
      #
      # Interval is deliberately slower than index-engine's 60s and the batch much
      # smaller: one tick can run for minutes, so polling faster only stacks ticks.
      # What was done to each chunk is a row (graph_extraction_state, migration
      # 20261003150000): a chunk that extracts cleanly to zero entities is `empty`
      # and stays so across restarts (it cost 63 inference calls/tick on the eval
      # corpus, ~18k/day, while only the process remembered it), a chunk that keeps
      # failing waits 5 minutes to 6 hours between attempts and is given up on at the
      # cap below, and the migration must be applied before this image starts (the
      # service checks and refuses to boot otherwise).
      GRAPH_RECONCILE_ENABLED: ${GRAPH_RECONCILE_ENABLED:-1}
      GRAPH_RECONCILE_INTERVAL_SECS: ${GRAPH_RECONCILE_INTERVAL_SECS:-300}
      GRAPH_RECONCILE_BATCH: ${GRAPH_RECONCILE_BATCH:-5}
      # The poison cap: attempts after which a chunk is failed_permanent and
      # dead-lettered (dataplane.dlq.graph-index) until an operator requeues it.
      # 1 to 50; anything else stops the service at startup.
      GRAPH_EXTRACTION_MAX_ATTEMPTS: ${GRAPH_EXTRACTION_MAX_ATTEMPTS:-6}
      # The background LLM budget (owner default D-E): configurable per
      # organization (org_processing_policy) and here for every organization that
      # sets none; ALERT-ONLY by default, `stop` only when an operator says so, and
      # no figure built in. Spend is read from cost_events and priced with the two
      # figures below, which have no default (blank: the spend in dollars cannot be
      # measured, and a budget that applies is alerted, not enforced). The prices go
      # together or not at all, and `stop` with a figure needs them: boot checks.
      BACKGROUND_BUDGET_MODE: ${BACKGROUND_BUDGET_MODE:-alert_only}
      BACKGROUND_BUDGET_MONTHLY_USD: ${BACKGROUND_BUDGET_MONTHLY_USD:-}
      BACKGROUND_PRICE_INPUT_USD_PER_MTOK: ${BACKGROUND_PRICE_INPUT_USD_PER_MTOK:-}
      BACKGROUND_PRICE_OUTPUT_USD_PER_MTOK: ${BACKGROUND_PRICE_OUTPUT_USD_PER_MTOK:-}
      # GraphRAG community summaries (one paid call each): OFF unless turned on, and
      # then under the same gate as extraction (policy, retention posture, budget).
      COMMUNITY_SUMMARY_ENABLED: ${COMMUNITY_SUMMARY_ENABLED:-0}
      COMMUNITY_SUMMARY_MAX_PER_RUN: ${COMMUNITY_SUMMARY_MAX_PER_RUN:-5}
      # Auth Core audited service-principal hop to inference-core. The
      # credential is deployment-owned; never fall back to a shared x-api-key.
      MODEL_PLANE_INFERENCE_TOKEN_URL: ${MODEL_PLANE_INFERENCE_TOKEN_URL:-http://auth-core:3011/api/inference-core/internal-token}
      MODEL_PLANE_INFERENCE_TOKEN_ISSUER: ${AUTH_CORE_ISSUER:-http://auth-core:3011/api/convex-auth}
      MODEL_PLANE_INFERENCE_SERVICE_ID: ${MODEL_PLANE_INFERENCE_SERVICE_ID:-graph-index}
      MODEL_PLANE_INFERENCE_SERVICE_API_KEY: ${MODEL_PLANE_INFERENCE_SERVICE_API_KEY:-}
      # persistent | zdr | tenant: the posture this client asserts on its token.
      # persistent and zdr must equal this principal's retentionByAudience entry
      # for inference-core in the principal registry. tenant accepts either: the
      # token's zdr is the ORGANIZATION's own setting, resolved by Auth Core at the
      # mint (60 s lifetime, no token when the posture cannot be resolved). Ship
      # the client, set this to tenant, then change the registry; never the other
      # way round. An unknown value stops the service at startup, and
      # `make cross-plane-env` checks it. (embedding-engine has its own variable.)
      MODEL_PLANE_INFERENCE_RETENTION_POSTURE: ${MODEL_PLANE_INFERENCE_RETENTION_POSTURE:-persistent}
      JWT_PUBLIC_KEY_FILE: /app/keys/convex-auth.pub
      JWT_REQUIRED_AUDIENCE: ${DATA_PLANE_AUTH_AUDIENCE:-data-plane}
      JWT_REQUIRED_ISSUER: ${AUTH_CORE_ISSUER:-http://auth-core:3011/api/convex-auth}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      RUST_LOG: ${RUST_LOG:-warn,graph_index=info,inference_client_rs=info}
      ENABLE_SIGNED_EVENT_CONSUMERS: ${ENABLE_SIGNED_EVENT_CONSUMERS:-1}
      EMBEDDING_EVENT_PUBLIC_KEY_PATH: /run/event-keys/embedding-events.pub
      INDEX_EVENT_PUBLIC_KEY_PATH: /run/event-keys/index-events.pub
      EVENT_AUTH_AUDIENCE: dataplane-events
      # graph-index's own usage-event signing key (CR-T10): issuer service:graph-index-rs, key id
      # graph-events-v1, scope events:graph:publish (the cost subject and nothing else). The
      # public half is mounted into data-orchestrator. Provisioned by hand through the Makefile
      # list; production keys live at an absolute path from the secret manager, never under
      # .secrets/event-keys. Read only when USAGE_EMIT_ENABLED is on; with it on graph-index
      # records one event per paid call (feature graph-extraction for a chunk,
      # graph-community-summary for a community), exact tokens, no document or user.
      GRAPH_EVENT_PRIVATE_KEY_PATH: /run/event-keys/graph-events.pem
      USAGE_EMIT_ENABLED: ${USAGE_EMIT_ENABLED:-0}
      # Neo4j graph read-model. ON by default in the composed stack; the
      # dual-write + multi-hop traverse path mirrors the canonical Postgres
      # graph. Startup fails closed if enabled without a password. graph-index
      # intentionally has no `depends_on: neo4j` — it connects with a boot
      # retry and degrades to the Postgres graph path if Neo4j is unavailable.
      NEO4J_ENABLED: ${NEO4J_ENABLED:-true}
      NEO4J_URL: ${NEO4J_URL:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-dataplane}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      # Boot connect retry (3s apart) must outlast a Neo4j cold start so the
      # default-ON mirror doesn't silently lose the startup race. 30 ≈ 90s.
      NEO4J_BOOT_ATTEMPTS: ${NEO4J_BOOT_ATTEMPTS:-30}
      GRAPH_MAX_HOPS: ${GRAPH_MAX_HOPS:-3}
      GRAPH_TRAVERSE_MAX_ENTITIES: ${GRAPH_TRAVERSE_MAX_ENTITIES:-100}
      # Cross-plane GDPR organization-erasure purge consumer — a SECOND,
      # narrowly-scoped connection to control-shared-nats (identity
      # "graph-index-gdpr"), kept entirely separate from NATS_URL/
      # DATAPLANE_NATS_TOKEN above (the Data-Plane-local broker this
      # service's graph-extraction/cleanup consumers use — that broker does
      # not host AQENCIA_CONTROLPLANE). Deliberately distinct env var names
      # from NATS_SHARED_URL/SHARED_NATS_URL already in play for other
      # services/fallbacks — see src/gdpr_nats.rs's module doc. Empty URL
      # leaves the consumer disabled (logged, non-fatal) rather than
      # hot-looping doomed connection attempts.
      GRAPH_INDEX_GDPR_NATS_URL: ${GRAPH_INDEX_GDPR_NATS_URL:-}
      GRAPH_INDEX_GDPR_NATS_USER: ${GRAPH_INDEX_GDPR_NATS_USER:-graph-index-gdpr}
      GRAPH_INDEX_GDPR_NATS_PASSWORD: ${GRAPH_INDEX_GDPR_NATS_PASSWORD:-}
    volumes:
      # A public verification key is local configuration, not a live Auth Core
      # dependency. This lets graph-index bind while Auth Core is offline; each
      # protected request still fails closed until a valid bearer is available.
      - "${AUTH_CORE_PUBLIC_KEY_PATH:-../Control Plane/auth-core/keys/convex-auth.pub}:/app/keys/convex-auth.pub:ro"
      - ${EMBEDDING_EVENT_VERIFYING_PUBLIC_KEY_PATH:-.secrets/event-keys/embedding-events.pub}:/run/event-keys/embedding-events.pub:ro
      - ${INDEX_EVENT_VERIFYING_PUBLIC_KEY_PATH:-.secrets/event-keys/index-events.pub}:/run/event-keys/index-events.pub:ro
      - ${GRAPH_EVENT_SIGNING_PRIVATE_KEY_PATH:-.secrets/event-keys/graph-events.pem}:/run/event-keys/graph-events.pem:ro
    networks:
      dpv2-net:
      inter-plane-bus:
        aliases:
          - dpv2-graph-index
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9203/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  quickwit-adapter:
    <<: *hardened-runtime
    build:
      context: .
      dockerfile: services/quickwit-adapter-rs/Dockerfile
      args: *build-metadata
    restart: unless-stopped
    init: true
    expose:
      - "9204"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dataplane}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-dataplane}
      NATS_URL: nats://data-nats:4222
      DATAPLANE_NATS_TOKEN: ${DATAPLANE_NATS_TOKEN:?DATAPLANE_NATS_TOKEN is required}
      # Dedicated shared-broker identity for the cross-plane GDPR
      # organization-erasure consumer only (see src/gdpr_nats.rs). This is
      # NOT the plane-local NATS_URL/DATAPLANE_NATS_TOKEN pair above and must
      # never be repointed at data-nats — AQENCIA_CONTROLPLANE only exists on
      # control-shared-nats. Left empty (e.g. standalone/isolated posture),
      # the consumer logs a warning and stays disabled rather than
      # hot-looping doomed connection attempts.
      NATS_SHARED_URL: ${NATS_SHARED_URL:-}
      NATS_SHARED_USER: ${QUICKWIT_ADAPTER_GDPR_NATS_USER:-quickwit-adapter-gdpr}
      NATS_SHARED_PASSWORD: ${QUICKWIT_ADAPTER_GDPR_NATS_PASSWORD:-}
      QUICKWIT_URL: ${QUICKWIT_URL:-http://quickwit:7280}
      QUICKWIT_INDEX_ID: ${QUICKWIT_INDEX_ID:-dataplane-corpus}
      QUICKWIT_INDEX_CONFIG_PATH: /app/infra/quickwit/dataplane-corpus-index.yaml
      ADMIN_PORT: ${QUICKWIT_ADAPTER_ADMIN_PORT:-9204}
      BATCH_SIZE: ${QUICKWIT_ADAPTER_BATCH_SIZE:-500}
      REBUILD_ON_START: ${QUICKWIT_ADAPTER_REBUILD_ON_START:-false}
      AUTH_PUBLIC_KEY_FILE: /app/keys/convex-auth.pub
      AUTH_AUDIENCE: ${DATA_PLANE_AUTH_AUDIENCE:-data-plane}
      AUTH_ISSUER: ${AUTH_CORE_ISSUER:-http://auth-core:3011/api/convex-auth}
      ENABLE_SIGNED_EVENT_CONSUMERS: ${ENABLE_SIGNED_EVENT_CONSUMERS:-1}
      DOCUMENTS_EVENT_PUBLIC_KEY_PATH: /run/event-keys/documents-events.pub
      INDEX_EVENT_PUBLIC_KEY_PATH: /run/event-keys/index-events.pub
      EMBEDDING_EVENT_PUBLIC_KEY_PATH: /run/event-keys/embedding-events.pub
      WIKI_EVENT_PUBLIC_KEY_PATH: /run/event-keys/wiki-events.pub
      EVENT_AUTH_AUDIENCE: dataplane-events
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      RUST_LOG: ${RUST_LOG:-warn,quickwit_adapter=info}
    volumes:
      - "${AUTH_CORE_PUBLIC_KEY_PATH:-../Control Plane/auth-core/keys/convex-auth.pub}:/app/keys/convex-auth.pub:ro"
      - ${DOCUMENTS_EVENT_VERIFYING_PUBLIC_KEY_PATH:-.secrets/event-keys/documents-events.pub}:/run/event-keys/documents-events.pub:ro
      - ${INDEX_EVENT_VERIFYING_PUBLIC_KEY_PATH:-.secrets/event-keys/index-events.pub}:/run/event-keys/index-events.pub:ro
      - ${EMBEDDING_EVENT_VERIFYING_PUBLIC_KEY_PATH:-.secrets/event-keys/embedding-events.pub}:/run/event-keys/embedding-events.pub:ro
      - ${WIKI_EVENT_VERIFYING_PUBLIC_KEY_PATH:-.secrets/event-keys/wiki-events.pub}:/run/event-keys/wiki-events.pub:ro
    networks:
      dpv2-net:
      inter-plane-bus:
        aliases:
          - dpv2-quickwit-adapter
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      quickwit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9204/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  # Keyword arm's write side: keeps the Meilisearch `dataplane-knowledge`
  # index converged with `knowledge_units`/`documents` off the same
  # created/indexed/deleted lifecycle events `quickwit-adapter` reads —
  # mirrors that service's live-update consumer shape (durable JetStream
  # pull consumers, DLQ on exhaustion), deliberately without its admin
  # rebuild-from-scratch HTTP surface (no admin JWT verifier needed here; see
  # `services/meilisearch-adapter-rs/src/stream.rs`'s module docs for the
  # full scope reasoning).
  meilisearch-adapter:
    <<: *hardened-runtime
    build:
      context: .
      dockerfile: services/meilisearch-adapter-rs/Dockerfile
      args: *build-metadata
    restart: unless-stopped
    init: true
    expose:
      - "9205"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dataplane}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-dataplane}
      NATS_URL: nats://data-nats:4222
      DATAPLANE_NATS_TOKEN: ${DATAPLANE_NATS_TOKEN:?DATAPLANE_NATS_TOKEN is required}
      MEILISEARCH_URL: ${MEILISEARCH_URL:-http://meilisearch:7700}
      MEILISEARCH_API_KEY: ${MEILISEARCH_MASTER_KEY:?MEILISEARCH_MASTER_KEY is required}
      MEILISEARCH_INDEX_UID: ${MEILISEARCH_INDEX_UID:-dataplane-knowledge}
      ADMIN_PORT: ${MEILISEARCH_ADAPTER_ADMIN_PORT:-9205}
      ENABLE_SIGNED_EVENT_CONSUMERS: ${ENABLE_SIGNED_EVENT_CONSUMERS:-1}
      DOCUMENTS_EVENT_PUBLIC_KEY_PATH: /run/event-keys/documents-events.pub
      INDEX_EVENT_PUBLIC_KEY_PATH: /run/event-keys/index-events.pub
      EMBEDDING_EVENT_PUBLIC_KEY_PATH: /run/event-keys/embedding-events.pub
      EVENT_AUTH_AUDIENCE: dataplane-events
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      RUST_LOG: ${RUST_LOG:-warn,meilisearch_adapter_rs=info}
    volumes:
      - ${DOCUMENTS_EVENT_VERIFYING_PUBLIC_KEY_PATH:-.secrets/event-keys/documents-events.pub}:/run/event-keys/documents-events.pub:ro
      - ${INDEX_EVENT_VERIFYING_PUBLIC_KEY_PATH:-.secrets/event-keys/index-events.pub}:/run/event-keys/index-events.pub:ro
      - ${EMBEDDING_EVENT_VERIFYING_PUBLIC_KEY_PATH:-.secrets/event-keys/embedding-events.pub}:/run/event-keys/embedding-events.pub:ro
    networks:
      dpv2-net:
      inter-plane-bus:
        aliases:
          - dpv2-meilisearch-adapter
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9205/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # GO SERVICES
  # ─────────────────────────────────────────────────────────────

  documents-api:
    <<: *hardened-runtime
    build:
      context: services/documents-api-go
      dockerfile: Dockerfile
      # The go.mod `replace` points at ../../shared/go, which is outside this
      # service's context. Pass it as a named context rather than widening to
      # the repo root: .dockerignore deliberately excludes these Go trees so
      # the root-context Rust builds stay lean.
      additional_contexts:
        shared-go: "shared/go"
      args: *build-metadata
    # This optional local secret file is provisioned from the Application Plane's
    # dedicated publish-only identity. It contains only the three bridge values,
    # never the broader Application Plane secret store. Missing file = standalone
    # Data Plane with the mirror safely disabled.
    env_file:
      - path: ${KNOWLEDGE_OBSERVABILITY_ENV_FILE:-.secrets/knowledge-observability.env}
        required: false
    restart: unless-stopped
    init: true
    expose:
      - "8010"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-dataplane}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-dataplane}
      NATS_URL: nats://data-nats:4222
      DATAPLANE_NATS_TOKEN: ${DATAPLANE_NATS_TOKEN:?DATAPLANE_NATS_TOKEN is required}
      # GDPR durable delivery crosses into Control Plane. Empty values are
      # allowed only so the explicit standalone overlay can boot; production
      # keeps GDPR_DURABLE_CONSUMER_REQUIRED=1 and the service config rejects
      # missing scoped broker credentials.
      NATS_SHARED_URL: ${NATS_SHARED_URL:-}
      NATS_SHARED_USER: ${DOCUMENTS_GDPR_NATS_USER:-documents-api-gdpr}
      NATS_SHARED_PASSWORD: ${DOCUMENTS_GDPR_NATS_PASSWORD:-}
      GDPR_DURABLE_CONSUMER_REQUIRED: ${GDPR_DURABLE_CONSUMER_REQUIRED:-1}
      USER_CORE_SERVICE_TOKEN: ${USER_CORE_DOCUMENTS_TOKEN:-}
      USER_CORE_GRANTS_REQUIRED: ${USER_CORE_GRANTS_REQUIRED:-1}
      # Per-user ownership: filter-at-source needs the viewer's granted doc-set
      # from user-core's resource_grants facade. HTTP/facade port is 3012, NOT 8080.
      USER_CORE_URL: ${USER_CORE_URL:-http://user-core:3012}
      HTTP_PORT: "8010"
      # Auth is enforced by default; tenant and user identity come only from the
      # verified Control Plane token. JWKS unavailability fails closed.
      AUTHCTX_ENFORCE: "1"
      JWT_PUBLIC_KEY_FILE: ""
      AUTH_CORE_JWKS_URL: ${AUTH_CORE_JWKS_URL:-http://auth-core:3011/api/convex-auth/jwks}
      # JWT issuer is a stable identity string, not the in-cluster JWKS host.
      # Auth Core's plane-token issuer is configured as localhost for this local
      # stack, while verification keys remain reachable through auth-core below.
      AUTH_CORE_ISSUER: ${AUTH_CORE_ISSUER:-http://localhost:3011/api/convex-auth}
      EVENT_SIGNING_PRIVATE_KEY_PATH: /run/event-keys/documents-events.pem
      EVENT_SIGNING_KEY_ID: documents-events-v1
      EVENT_AUTH_AUDIENCE: dataplane-events
    volumes:
      - ${DOCUMENTS_EVENT_SIGNING_PRIVATE_KEY_PATH:-.secrets/event-keys/documents-events.pem}:/run/event-keys/documents-events.pem:ro
    networks:
      dpv2-net:
      inter-plane-bus:
        aliases:
          - dpv2-documents-api
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8010/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  wiki-store:
    <<: *hardened-runtime
    build:
      context: .
      dockerfile: services/wiki-store-go/Dockerfile
      args: *build-metadata
    restart: unless-stopped
    init: true
    expose:
      - "8011"
      - "50054"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dataplane}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-dataplane}
      HTTP_PORT: "8011"
      # §16.3.8 — without NATS_URL the wiki publisher is nil, so CreatePage/
      # CreateVersion never emit `dataplane.wiki.version.published` → the
      # embedding-engine wiki subscriber never embeds wiki content → wiki pages
      # never reach the RAG corpus (w_wiki contributes nothing). Wire it.
      NATS_URL: nats://data-nats:4222
      DATAPLANE_NATS_TOKEN: ${DATAPLANE_NATS_TOKEN:?DATAPLANE_NATS_TOKEN is required}
      WIKI_EVENT_PRIVATE_KEY_PATH: /run/event-keys/wiki-events.pem
      DATA_PLANE_AUTH_AUDIENCE: ${DATA_PLANE_AUTH_AUDIENCE:-data-plane}
      AUTH_CORE_ISSUER: ${AUTH_CORE_ISSUER:-http://auth-core:3011/api/convex-auth}
      AUTH_CORE_JWKS_URL: ${AUTH_CORE_JWKS_URL:-http://auth-core:3011/api/convex-auth/jwks}
      JWT_PUBLIC_KEY_FILE: ""
      # GDPR cross-plane org-erasure purge consumer — a SECOND, narrowly-scoped
      # connection to control-shared-nats (identity "wiki-store-gdpr"), kept
      # entirely separate from NATS_URL/DATAPLANE_NATS_TOKEN above (the
      # Data-Plane-local broker the wiki-event publisher uses). Deliberately
      # distinct env var names — see config.go's field doc.
      WIKISTORE_GDPR_SHARED_NATS_URL: nats://control-shared-nats:4222
      WIKISTORE_GDPR_SHARED_NATS_USER: wiki-store-gdpr
      WIKISTORE_GDPR_SHARED_NATS_PASSWORD: ${WIKI_STORE_GDPR_NATS_PASSWORD:?WIKI_STORE_GDPR_NATS_PASSWORD is required}
    volumes:
      - ${WIKI_EVENT_SIGNING_PRIVATE_KEY_PATH:-.secrets/event-keys/wiki-events.pem}:/run/event-keys/wiki-events.pem:ro
    networks:
      dpv2-net:
      inter-plane-bus:
        aliases:
          - dpv2-wiki-store
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8011/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  data-orchestrator:
    <<: *hardened-runtime
    build:
      context: services/data-orchestrator-go
      dockerfile: Dockerfile
      # The go.mod `replace` points at ../../shared/go, which is outside this
      # service's context. Pass it as a named context rather than widening to
      # the repo root: .dockerignore deliberately excludes these Go trees so
      # the root-context Rust builds stay lean.
      additional_contexts:
        shared-go: "shared/go"
      args: *build-metadata
    restart: unless-stopped
    init: true
    expose:
      - "8012"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dataplane}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-dataplane}
      NATS_URL: nats://data-nats:4222
      DATAPLANE_NATS_TOKEN: ${DATAPLANE_NATS_TOKEN:?DATAPLANE_NATS_TOKEN is required}
      HTTP_PORT: "8012"
      DATA_PLANE_AUTH_AUDIENCE: ${DATA_PLANE_AUTH_AUDIENCE:-data-plane}
      AUTH_CORE_ISSUER: ${AUTH_CORE_ISSUER:-http://auth-core:3011/api/convex-auth}
      AUTH_CORE_JWKS_URL: ${AUTH_CORE_JWKS_URL:-http://auth-core:3011/api/convex-auth/jwks}
      JWT_PUBLIC_KEY_FILE: ""
      SIGNED_COST_EVENTS_ENABLED: ${SIGNED_COST_EVENTS_ENABLED:-1}
      EMBEDDING_EVENT_PUBLIC_KEY_PATH: /run/event-keys/embedding-events.pub
      RETRIEVAL_EVENT_PUBLIC_KEY_PATH: /run/event-keys/retrieval-events.pub
      # graph-index's usage events (CR-T10). Required with the other two: a registry
      # without it would refuse graph-index's spend as invalid, silently, for ever.
      GRAPH_EVENT_PUBLIC_KEY_PATH: /run/event-keys/graph-events.pub
      # The usage forwarder (CR-T10): posts every version 2 usage row to cost-core. DARK:
      # off unless USAGE_FORWARDER_ENABLED=1, and it must stay off until cost-core accepts the
      # `feature` and `units` fields (CR-T4), has priced the models the Data Plane meters
      # and the data-orchestrator principal exists in the registry. Turned on, the service
      # refuses to start without a service credential (checked at boot). It posts one
      # bearer per organization, minted by Auth Core for the audience cost-core with the one
      # scope cost:write; the credential below goes to Auth Core and to nobody else. The
      # contextual retrieval runbook has the order of enablement.
      USAGE_FORWARDER_ENABLED: ${USAGE_FORWARDER_ENABLED:-0}
      COST_CORE_URL: ${USAGE_FORWARDER_COST_CORE_URL:-http://cost-core:8089}
      COST_CORE_TOKEN_URL: ${USAGE_FORWARDER_TOKEN_URL:-http://auth-core:3011/api/cost-core/internal-token}
      DATA_ORCHESTRATOR_COST_SERVICE_ID: ${DATA_ORCHESTRATOR_COST_SERVICE_ID:-data-orchestrator}
      DATA_ORCHESTRATOR_COST_SERVICE_API_KEY: ${DATA_ORCHESTRATOR_COST_SERVICE_API_KEY:-}
      USAGE_FORWARDER_BATCH: ${USAGE_FORWARDER_BATCH:-50}
      USAGE_FORWARDER_INTERVAL_SECS: ${USAGE_FORWARDER_INTERVAL_SECS:-15}
      # GDPR org-erasure durable delivery crosses into Control Plane's shared
      # broker. Empty values are allowed only so an explicit standalone
      # overlay can boot; production keeps GDPR_ORG_PURGE_CONSUMER_REQUIRED=1
      # and the service config rejects missing scoped broker credentials.
      # Deliberately a SEPARATE identity from NATS_URL/DATAPLANE_NATS_TOKEN
      # above (the plane-local broker) — see internal/gdpr's package doc.
      NATS_SHARED_URL: ${NATS_SHARED_URL:-}
      NATS_SHARED_USER: ${DATA_ORCHESTRATOR_GDPR_NATS_USER:-data-orchestrator-gdpr}
      NATS_SHARED_PASSWORD: ${DATA_ORCHESTRATOR_GDPR_NATS_PASSWORD:-}
      GDPR_ORG_PURGE_CONSUMER_REQUIRED: ${GDPR_ORG_PURGE_CONSUMER_REQUIRED:-1}
    volumes:
      - ${EMBEDDING_EVENT_VERIFYING_PUBLIC_KEY_PATH:-.secrets/event-keys/embedding-events.pub}:/run/event-keys/embedding-events.pub:ro
      - ${RETRIEVAL_EVENT_VERIFYING_PUBLIC_KEY_PATH:-.secrets/event-keys/retrieval-events.pub}:/run/event-keys/retrieval-events.pub:ro
      - ${GRAPH_EVENT_VERIFYING_PUBLIC_KEY_PATH:-.secrets/event-keys/graph-events.pub}:/run/event-keys/graph-events.pub:ro
    networks:
      - dpv2-net
      - inter-plane-bus
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8012/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  data-quality:
    <<: *hardened-runtime
    build:
      context: services/data-quality-go
      dockerfile: Dockerfile
      # The go.mod `replace` points at ../../shared/go, which is outside this
      # service's context. Pass it as a named context rather than widening to
      # the repo root: .dockerignore deliberately excludes these Go trees so
      # the root-context Rust builds stay lean.
      additional_contexts:
        shared-go: "shared/go"
      args: *build-metadata
    restart: unless-stopped
    init: true
    expose:
      - "8013"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dataplane}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-dataplane}
      HTTP_PORT: "8013"
      DATA_PLANE_AUTH_AUDIENCE: ${DATA_PLANE_AUTH_AUDIENCE:-data-plane}
      AUTH_CORE_ISSUER: ${AUTH_CORE_ISSUER:-http://auth-core:3011/api/convex-auth}
      AUTH_CORE_JWKS_URL: ${AUTH_CORE_JWKS_URL:-http://auth-core:3011/api/convex-auth/jwks}
      JWT_PUBLIC_KEY_FILE: ""
      # GDPR org-erasure durable delivery crosses into Control Plane on the
      # shared cross-plane broker. Empty values are allowed only so the
      # explicit standalone overlay can boot; production keeps
      # GDPR_DURABLE_CONSUMER_REQUIRED=1 and the service config rejects
      # missing scoped broker credentials. Identity is dedicated to this
      # service (data-quality-gdpr), distinct from every other service's own
      # shared-broker identity.
      NATS_SHARED_URL: ${NATS_SHARED_URL:-}
      NATS_SHARED_USER: ${DATA_QUALITY_GDPR_NATS_USER:-data-quality-gdpr}
      NATS_SHARED_PASSWORD: ${DATA_QUALITY_GDPR_NATS_PASSWORD:-}
      GDPR_DURABLE_CONSUMER_REQUIRED: ${GDPR_DURABLE_CONSUMER_REQUIRED:-1}
    networks:
      - dpv2-net
      - inter-plane-bus
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8013/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Audio + video embedding sidecar (LAION-CLAP / SigLIP 2). NOT behind the gpu
  # profile: the audit picked CLAP precisely because the audio arm is CPU-viable,
  # and the video tower became CPU-viable too when LanguageBind was replaced by
  # SigLIP 2 frame sampling. Neither arm needs a GPU now.
  #
  # The VIDEO_EXTRAS build arg is GONE. It existed only to install LanguageBind's
  # undeclared, partly-unmaintained import chain (decord, av, pytorchvideo,
  # opencv, timm, ftfy — ~2 GB) so the package could import at all. Turning video
  # on is now ONE switch, MEDIA_VIDEO_ENABLED, which pays for model weights
  # rather than for wheels and VRAM. See services/media-embedder/app.py's module
  # docstring for why LanguageBind was dropped.
  #
  # Self-hosted is not a preference here: Azure ships no audio-similarity
  # embedding model at all, and its video analyzer is extraction/description
  # rather than a dense embedder, so there is no cloud arm to fall back to. See
  # docs/core-research/embedding-modality-and-rag-audit-2026-08-19.md §3.
  media-embedder:
    build:
      context: ./services/media-embedder
      dockerfile: Dockerfile
      args: *build-metadata
    restart: unless-stopped
    init: true
    expose:
      - "8095"
    environment:
      MEDIA_AUDIO_MODEL: ${MEDIA_AUDIO_MODEL:-laion/clap-htsat-unfused}
      # Which video tower loads is INFERRED from this id — there is deliberately
      # no separate backend switch, because two knobs could disagree and the
      # symptom would be a silently wrong embedding space rather than an error.
      #
      #   google/siglip2-base-patch16-224 -> frame pooling (DEFAULT). 768-dim.
      #     Strong per-frame image encoder, cheap, CPU-viable.
      #   microsoft/xclip-base-patch32    -> video-pretrained dual encoder. 512-dim.
      #     EXPERIMENTAL. Its video-caption pretraining may help on real footage,
      #     but it is NOT a temporal upgrade: measured on an exact frame
      #     reversal, its video embedding is identical to 6 decimal places
      #     (cos=1.000000), the same as plain mean pooling. It also needs a
      #     workaround for a transformers 4.57 bug in `get_video_features`.
      #     Neither tower can retrieve motion or direction — see app.py.
      #
      # Changing this changes the SPACE and the width, so move
      # QDRANT_VIDEO_COLLECTION and VIDEO_EMBEDDING_DIMENSION with it.
      MEDIA_VIDEO_MODEL: ${MEDIA_VIDEO_MODEL:-google/siglip2-base-patch16-224}
      # Opt-in only to avoid downloading and holding ~1 GB of weights in a
      # deployment with no video corpus. No longer implies a GPU or extra wheels.
      MEDIA_VIDEO_ENABLED: ${MEDIA_VIDEO_ENABLED:-false}
      # Frames sampled per video, spread evenly across its duration.
      #
      # IGNORED on the X-CLIP backend: its frame count is fixed by the
      # checkpoint (8 for base-patch32), so the service reads that off the
      # config and logs when it overrides this. Only the SigLIP 2 pooling
      # backend treats it as a real knob, where more frames buy broader
      # coverage at linear cost — but never temporal understanding.
      MEDIA_VIDEO_FRAMES: ${MEDIA_VIDEO_FRAMES:-8}
      # Normally unset: the width is read off the checkpoint config, which is the
      # value that actually has to match the Qdrant collection. Set it only for a
      # checkpoint whose config does not expose the field.
      MEDIA_VIDEO_DIM: ${MEDIA_VIDEO_DIM:-}
      # Filmstrip layout for caption-to-text (POST /filmstrip/video). Frames are
      # tiled in reading order and stamped with timestamps so a vision model
      # reads them as one sequence rather than unrelated pictures. This endpoint
      # needs ffmpeg + Pillow ONLY, never the video tower's weights, so a
      # deployment can caption video with MEDIA_VIDEO_ENABLED=false.
      MEDIA_FILMSTRIP_COLS: ${MEDIA_FILMSTRIP_COLS:-4}
      MEDIA_FILMSTRIP_CELL: ${MEDIA_FILMSTRIP_CELL:-224}
      MEDIA_FILMSTRIP_QUALITY: ${MEDIA_FILMSTRIP_QUALITY:-85}
      MEDIA_AUDIO_MAX_SECONDS: ${MEDIA_AUDIO_MAX_SECONDS:-60}
      MEDIA_URL_REWRITE: ${MEDIA_URL_REWRITE:-}
      HF_HOME: /cache/huggingface
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - dpv2_media_hf:/cache/huggingface
    networks:
      - dpv2-net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8095/healthz',timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 240s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # GPU INFERENCE (optional — only starts if profile "gpu" is selected)
  # ─────────────────────────────────────────────────────────────

  # ColQwen2.5 visual reranker. Behind a profile because it needs an NVIDIA GPU
  # and a ~7 GB model download; the retrieval-engine degrades to Embed-v4 order
  # when COLQWEN_ENDPOINT_URL is empty, so the default stack stays GPU-free.
  #
  #   docker compose --profile gpu up -d colqwen-reranker
  #
  # Sizing, measured on an RTX A1000 (6 GB): bf16 weights are 7.11 GiB and do NOT
  # fit — set COLQWEN_QUANT=nf4 (3.39 GiB, fully resident). Throughput is ~10 s
  # per page, so VISUAL_RERANK_TOP_K must stay at or below 3 to return inside the
  # client's 30 s timeout; the 20 default silently degrades every request. A
  # 16 GB+ card can drop the quantization and raise the top-K.
  colqwen-reranker:
    build:
      context: ./services/colqwen-reranker
      dockerfile: Dockerfile
      args: *build-metadata
    profiles: ["gpu"]
    restart: unless-stopped
    init: true
    expose:
      - "8090"
    environment:
      COLQWEN_MODEL: ${COLQWEN_MODEL:-vidore/colqwen2.5-v0.2}
      # nf4 keeps the vision tower + projection head in bf16; see app.py.
      COLQWEN_QUANT: ${COLQWEN_QUANT:-nf4}
      # sdpa, not eager: eager materializes the ViT attention matrix in fp32
      # (~8.3 GiB for 4 A4 pages) and OOMs regardless of weight precision.
      COLQWEN_ATTN_IMPL: ${COLQWEN_ATTN_IMPL:-sdpa}
      COLQWEN_IMAGE_BATCH: ${COLQWEN_IMAGE_BATCH:-2}
      HF_HOME: /cache/huggingface
    volumes:
      - dpv2_colqwen_hf:/cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - dpv2-net
    healthcheck:
      # start_period covers the model load (~30 s warm, minutes on a cold cache).
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8090/healthz',timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 600s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # OBSERVABILITY (optional — only starts if profile "obs" is selected)
  # ─────────────────────────────────────────────────────────────

  prometheus:
    <<: *infra-observability
    image: prom/prometheus:v2.55.0
    profiles: ["obs"]
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - dpv2-net
      - inter-plane-bus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - dpv2_prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    deploy:
      resources:
        limits:
          memory: 512M

  grafana:
    <<: *infra-observability
    image: grafana/grafana:11.3.0
    profiles: ["obs"]
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - dpv2-net
      - inter-plane-bus
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - dpv2_grafana:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  dpv2-net:
    name: ${DPV2_NETWORK_NAME:-dpv2-net}
    driver: bridge
  inter-plane-bus:
    # Local-only default. The explicit docker-compose.cross-plane.yml overlay
    # replaces this with the pre-provisioned Control/Model shared network.
    # Services therefore bind independently and can be attached later without
    # creating or guessing a shared production network.
    #
    # CAUTION — this default is a private bridge, so `control-shared-nats` (a
    # Control Plane container on the REAL inter-plane-bus) does not resolve from
    # it. `documents-api`, `data-quality` and `data-orchestrator` treat their
    # scoped GDPR NATS connection as FATAL and will crash-loop; the other six
    # services log a retrying ERROR and run with GDPR erasure silently dead.
    # Bringing the stack up base-only (`make up` / plain `docker compose up -d`)
    # therefore looks fine at the compose layer and is broken at the plane layer.
    # For a connected stack always apply the overlay:
    #   docker compose -f docker-compose.yml -f docker-compose.cross-plane.yml up -d
    # (`make cross-plane-up` does this, plus a credential/key-path preflight.)
    name: ${DPV2_CROSS_PLANE_NETWORK:-dpv2-cross-plane}
    driver: bridge

volumes:
  # Hugging Face cache for the optional GPU profile — keeps the ~7 GB ColQwen2.5
  # download off the container layer and across recreates.
  dpv2_colqwen_hf:
  # CLAP is ~0.6 GB; LanguageBind adds a few more when the video tower is on.
  dpv2_media_hf:
  dpv2_postgres:
  dpv2_dragonfly:
  dpv2_qdrant:
  dpv2_neo4j:
  dpv2_nats:
  dpv2_minio:
  dpv2_quickwit_cache:
  dpv2_meilisearch:
  dpv2_prometheus:
  dpv2_grafana:

secrets:
  # Environment-backed Compose secret: not evaluated until Grafana's optional
  # profile is actually created, so the default stack remains independent.
  grafana_admin_password:
    environment: GRAFANA_ADMIN_PASSWORD
