name: ${DATA_PLANE_COMPOSE_PROJECT:-data-plane-v2}

x-build-metadata: &build-metadata
  SOURCE_REVISION: ${SOURCE_REVISION:-unverified}
  BUILD_DATE: ${BUILD_DATE:-unknown}

x-hardened-runtime: &hardened-runtime
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"

x-infra-observability: &infra-observability
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"

services:
  # ─────────────────────────────────────────────────────────────
  # INFRA
  # ─────────────────────────────────────────────────────────────

  postgres:
    <<: *infra-observability
    image: postgres:16.14-alpine3.24
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dataplane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-dataplane}
    expose:
      - "5432"
    ports:
      # Loopback-only operational access for backup/restore and the local
      # migrator CLI. Cross-plane traffic still uses the private network.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5442}:5432"
    networks:
      - dpv2-net
    volumes:
      - dpv2_postgres:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    shm_size: "128mb"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "effective_cache_size=256MB"
      - "-c"
      - "max_connections=100"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dataplane}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot deploy-time migrator (B3). Runs the versioned `migrator up` against
  # Postgres BEFORE any data service starts serving — so `make up` (docker
  # compose up -d) auto-applies pending migrations instead of leaving them to a
  # manual `make migrate-up` (the root cause of the missing operating_maps 500s).
  # Idempotent (skips already-applied versions via schema_migrations) and
  # run-once (exits after applying; dependents gate on
  # service_completed_successfully, mirroring minio-init → quickwit).
  migrate:
    <<: *hardened-runtime
    build:
      context: ./tools/migrator
      dockerfile: Dockerfile
      args: *build-metadata
    image: dpv2-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dataplane}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-dataplane}?sslmode=disable
    volumes:
      # Bind-mount the migrations read-only so adding a migration needs no image
      # rebuild; the migrator resolves ./infra/postgres/migrations from WORKDIR.
      - ./infra/postgres/migrations:/app/infra/postgres/migrations:ro
    networks:
      - dpv2-net
    depends_on:
      postgres:
        condition: service_healthy

  dragonfly:
    <<: *infra-observability
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.37.0
    restart: unless-stopped
    init: true
    expose:
      - "6379"
    networks:
      - dpv2-net
    volumes:
      - dpv2_dragonfly:/data
    command: ["--requirepass=${DATAPLANE_DRAGONFLY_PASSWORD:?DATAPLANE_DRAGONFLY_PASSWORD is required}", "--cache_mode=true", "--maxmemory=256mb", "--proactor_threads=1", "--dir=/data"]
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${DATAPLANE_DRAGONFLY_PASSWORD:?DATAPLANE_DRAGONFLY_PASSWORD is required}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    <<: *infra-observability
    image: qdrant/qdrant:v1.17.0
    restart: unless-stopped
    init: true
    expose:
      - "6333"
      - "6334"
    ports:
      # Qdrant snapshots are downloaded/uploaded by the host-side backup tools.
      - "127.0.0.1:${QDRANT_HTTP_HOST_PORT:-6345}:6333"
    networks:
      - dpv2-net
    volumes:
      - dpv2_qdrant:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      # qdrant image ships bash but no curl/wget; verify the HTTP API port
      # (6333) is actually accepting connections rather than always passing.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 10

  nats:
    <<: *infra-observability
    image: nats:2.12.12-alpine3.22@sha256:2ca98656a279b2d88cfdf2b8c3f0d5d7f3941ae9dc2ab12ebaa92d83e0f4ccdb
    restart: unless-stopped
    command: ["-js", "-m", "8222", "-sd", "/data", "--auth", "${DATAPLANE_NATS_TOKEN:?DATAPLANE_NATS_TOKEN is required}"]
    expose:
      - "4222"
    networks:
      dpv2-net:
        aliases:
          - data-nats
    volumes:
      - dpv2_nats:/data
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    <<: *infra-observability
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    init: true
    command: ["server", "/data", "--console-address", ":9001"]
    expose:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    networks:
      - dpv2-net
      # Deliberately private: Ingestion must persist through a Data Plane API,
      # never by holding Data Plane object-store root credentials. The visual
      # CAS producer remains disabled until that scoped contract exists.
    volumes:
      - dpv2_minio:/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set dpv2 http://minio:9000 "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}" "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}" &&
        mc mb --ignore-existing "dpv2/quickwit" &&
        mc mb --ignore-existing "dpv2/dataplane-cas"
    networks:
      - dpv2-net
    depends_on:
      minio:
        condition: service_healthy

  quickwit:
    <<: *infra-observability
    image: quickwit/quickwit:0.8.1
    restart: unless-stopped
    init: true
    command: ["run", "--config=/quickwit/config/quickwit.yaml"]
    expose:
      - "7280"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      QW_LISTEN_ADDRESS: 0.0.0.0
      RUST_LOG: quickwit=info
    networks:
      - dpv2-net
    volumes:
      - ./infra/quickwit/quickwit.yaml:/quickwit/config/quickwit.yaml:ro
      - ./infra/quickwit/dataplane-corpus-index.yaml:/quickwit/config/dataplane-corpus-index.yaml:ro
      - dpv2_quickwit_cache:/quickwit/qwdata
    depends_on:
      minio-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:7280/api/v1/cluster?format=json >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10

  # ─────────────────────────────────────────────────────────────
  # RUST SERVICES
  # ─────────────────────────────────────────────────────────────

  retrieval-engine:
    <<: *hardened-runtime
    build:
      context: .
      dockerfile: services/retrieval-engine-rs/Dockerfile
      args: *build-metadata
      additional_contexts:
        model-plane-proto: "../Model Plane/proto"
    restart: unless-stopped
    init: true
    expose:
      - "8004"
      - "50052"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dataplane}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-dataplane}
      QDRANT_URL: http://qdrant:6334
      DRAGONFLY_URL: redis://:${DATAPLANE_DRAGONFLY_PASSWORD:?DATAPLANE_DRAGONFLY_PASSWORD is required}@dragonfly:6379
      NATS_URL: nats://data-nats:4222
      DATAPLANE_NATS_TOKEN: ${DATAPLANE_NATS_TOKEN:?DATAPLANE_NATS_TOKEN is required}
      HTTP_PORT: "8004"
      GRPC_PORT: "50052"
      # Semantic response cache (vector tier for the Model Plane gateway). Opt-in:
      # SEMANTIC_CACHE_ENABLED=true serves /v1/cache/semantic/* via this service's
      # embeddings + Qdrant. Off by default.
      SEMANTIC_CACHE_ENABLED: ${SEMANTIC_CACHE_ENABLED:-false}
      # Query embedding routes through the Model Plane (gRPC → inference-core),
      # NOT direct Azure: no-independent-embeddings-outside-Model-Plane, and the
      # direct-Azure path fails closed on ZDR/restricted content (it is a
      # retaining provider), so it cannot embed restricted docs at all.
      # NOTE: a prior gRPC-hop error (dpv2→inference-core returning a status with
      # no server log) drove an azure_openai fallback here; that hop MUST be
      # re-smoke-tested live (one embedding round-trip returning a 3072-dim
      # vector) after this flip. Operators can override EMBEDDING_PROVIDER=
      # azure_openai if the hop regresses (same text-embedding-3-large@3072, so
      # vectors stay index-compatible either way).
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-model_plane}
      MODEL_PLANE_AI_CORE_GRPC_URL: ${MODEL_PLANE_AI_CORE_GRPC_URL:-http://inference-core:9092}
      MODEL_PLANE_EMBEDDING_PROVIDER: ${MODEL_PLANE_EMBEDDING_PROVIDER:-azure_openai}
      MODEL_PLANE_EMBEDDING_TIMEOUT_MS: ${MODEL_PLANE_EMBEDDING_TIMEOUT_MS:-30000}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-text-embedding-3-large}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-3072}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      # Phase-2 visual RAG — Cohere Embed v4 query embedder + fused visual arm.
      # `W_VISUAL` > 0 activates the page-image arm in the RRF fusion (was 0/shadow);
      # the query embedder reuses the core-ai-rg key (deployed model `embed-v-4-0`).
      COHERE_EMBED_V4_ENDPOINT: ${COHERE_EMBED_V4_ENDPOINT:-}
      COHERE_EMBED_V4_API_KEY: ${COHERE_API_KEY:-}
      COHERE_EMBED_V4_DEPLOYMENT: ${COHERE_EMBED_V4_DEPLOYMENT:-embed-v-4-0}
      COHERE_EMBED_V4_API_VERSION: ${COHERE_EMBED_V4_API_VERSION:-2024-05-01-preview}
      QDRANT_VISUAL_COLLECTION: ${QDRANT_VISUAL_COLLECTION:-dataplane_page_images}
      VISUAL_EMBEDDING_DIMENSION: ${VISUAL_EMBEDDING_DIMENSION:-1536}
      W_VISUAL: ${W_VISUAL:-0}
      # ColQwen visual reranker (services/colqwen-reranker). OFF by default — the
      # model runs as a separate GPU server (local MPS for verification,
      # Hetzner/Azure for prod). Flip VISUAL_RERANK_ENABLED=true and point
      # COLQWEN_ENDPOINT_URL at it (e.g. http://host.docker.internal:8090 locally).
      VISUAL_RERANK_ENABLED: ${VISUAL_RERANK_ENABLED:-false}
      COLQWEN_ENDPOINT_URL: ${COLQWEN_ENDPOINT_URL:-}
      VISUAL_RERANK_TOP_K: ${VISUAL_RERANK_TOP_K:-20}
      # Text cross-encoder rerank endpoint. Empty = public Cohere (api.cohere.ai,
      # Bearer). Set to an Azure AI Foundry serverless Cohere rerank URL +
      # RERANK_USE_API_KEY=true to use the in-EU deployment.
      RERANK_ENDPOINT: ${RERANK_ENDPOINT:-}
      RERANK_USE_API_KEY: ${RERANK_USE_API_KEY:-false}
      HYBRID_ENABLED: "true"
      SPARSE_SEARCH_BACKEND: ${SPARSE_SEARCH_BACKEND:-postgres}
      QUICKWIT_URL: ${QUICKWIT_URL:-http://quickwit:7280}
      QUICKWIT_INDEX_ID: ${QUICKWIT_INDEX_ID:-dataplane-corpus}
      QUICKWIT_SEARCH_TIMEOUT_MS: ${QUICKWIT_SEARCH_TIMEOUT_MS:-1500}
      # Membership authorization is always strict. Retrieval uses its registered
      # service credential only to mint an org-bound, short-lived
      # aud=control-policy bearer, then calls the versioned decision endpoint.
      # Per-user ownership: resolve viewer grants from user-core's resource_grants
      # facade (reached over inter-plane-bus). HTTP/facade port is 3012, NOT 8080.
      USER_CORE_HTTP_URL: ${USER_CORE_HTTP_URL:-http://user-core:3012}
      USER_CORE_SERVICE_TOKEN: ${USER_CORE_RETRIEVAL_TOKEN:?USER_CORE_RETRIEVAL_TOKEN is required}
      # Org-axis membership and per-user ownership are both enforced. Only an
      # explicitly gated insecure development posture can select the no-op.
      CONTROL_PLANE_ENFORCEMENT: strict
      CONTROL_POLICY_TOKEN_URL: ${CONTROL_POLICY_TOKEN_URL:-http://auth-core:3011/api/control-policy/internal-token}
      CONTROL_PLANE_DECISION_URL: ${CONTROL_PLANE_DECISION_URL:-http://auth-core:3011/api/v1/internal/authorization/data-plane/decision}
      CONTROL_POLICY_SERVICE_ID: ${CONTROL_POLICY_SERVICE_ID:-retrieval-engine}
      CONTROL_POLICY_SERVICE_API_KEY: ${CONTROL_POLICY_SERVICE_API_KEY:?CONTROL_POLICY_SERVICE_API_KEY is required}
      # Verified-JWT path: when the gateway forwards a Bearer token minted by
      # auth-core (POST /api/data-plane/internal-token | GET /api/data-plane/token,
      # aud=data-plane), the HTTP middleware + gRPC interceptor verify it against
      # this PUBLIC key and bind the viewer from the signed `sub` (preferred over
      # the forwarded x-user-id header). The key file is auth-core's PUBLIC key,
      # mounted read-only (public material, gitignored). AUDIENCE pins data-plane
      # so a token leaked to another plane can't authenticate here. ISSUER matches
      # auth-core's stamped `iss`. Missing verification material fails closed;
      # caller-supplied API keys and identity headers are never an identity.
      JWT_PUBLIC_KEY_FILE: /app/keys/convex-auth.pub
      JWT_REQUIRED_AUDIENCE: ${JWT_REQUIRED_AUDIENCE:-data-plane}
      JWT_REQUIRED_ISSUER: ${JWT_REQUIRED_ISSUER:-http://localhost:3011/api/convex-auth}
      # Tower middleware tuning (v2.1)
      GRPC_TIMEOUT_SECS: ${GRPC_TIMEOUT_SECS:-30}
      GRPC_MAX_CONCURRENT: ${GRPC_MAX_CONCURRENT:-256}
      # Postgres pool tuning (v2.2)
      PG_MAX_CONNECTIONS: ${PG_MAX_CONNECTIONS:-20}
      PG_MIN_CONNECTIONS: ${PG_MIN_CONNECTIONS:-2}
      PG_ACQUIRE_TIMEOUT_SECS: ${PG_ACQUIRE_TIMEOUT_SECS:-5}
      # Optional OTel collector
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Log target is the bin/crate name `retrieval_engine` (package is
      # `retrieval-engine-rs`); the old `retrieval_engine_rs=info` matched nothing.
      RUST_LOG: ${RUST_LOG:-warn,retrieval_engine=info,tower_http=info}
    volumes:
      # auth-core's PUBLIC JWT key (read-only) for verified-JWT viewer binding.
      - ../Control Plane/auth-core/keys/convex-auth.pub:/app/keys/convex-auth.pub:ro
    networks:
      dpv2-net:
      inter-plane-bus:
        aliases:
          - dpv2-retrieval-engine
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      nats:
        condition: service_healthy
      quickwit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8004/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  index-engine:
    <<: *hardened-runtime
    build:
      context: .
      dockerfile: services/index-engine-rs/Dockerfile
      args: *build-metadata
    restart: unless-stopped
    init: true
    expose:
      - "9201"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dataplane}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-dataplane}
      NATS_URL: nats://data-nats:4222
      DATAPLANE_NATS_TOKEN: ${DATAPLANE_NATS_TOKEN:?DATAPLANE_NATS_TOKEN is required}
      ADMIN_PORT: "9201"
      CHUNK_SIZE: "512"
      CHUNK_OVERLAP: "64"
      BATCH_SIZE: "10"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      RUST_LOG: ${RUST_LOG:-warn,index_engine=info}
      ENABLE_SIGNED_EVENT_CONSUMERS: "1"
      DOCUMENTS_EVENT_PUBLIC_KEY_PATH: /run/event-keys/documents-events.pub
      INDEX_EVENT_PRIVATE_KEY_PATH: /run/event-keys/index-events.pem
      EVENT_AUTH_AUDIENCE: dataplane-events
    volumes:
      - ${DOCUMENTS_EVENT_VERIFYING_PUBLIC_KEY_PATH:?DOCUMENTS_EVENT_VERIFYING_PUBLIC_KEY_PATH is required}:/run/event-keys/documents-events.pub:ro
      - ${INDEX_EVENT_SIGNING_PRIVATE_KEY_PATH:?INDEX_EVENT_SIGNING_PRIVATE_KEY_PATH is required}:/run/event-keys/index-events.pem:ro
    networks:
      dpv2-net:
      inter-plane-bus:
        aliases:
          - dpv2-index-engine
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9201/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  embedding-engine:
    <<: *hardened-runtime
    build:
      context: .
      dockerfile: services/embedding-engine-rs/Dockerfile
      args: *build-metadata
      additional_contexts:
        model-plane-proto: "../Model Plane/proto"
    restart: unless-stopped
    init: true
    expose:
      - "9202"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dataplane}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-dataplane}
      QDRANT_URL: http://qdrant:6334
      NATS_URL: nats://data-nats:4222
      DATAPLANE_NATS_TOKEN: ${DATAPLANE_NATS_TOKEN:?DATAPLANE_NATS_TOKEN is required}
      ADMIN_PORT: "9202"
      BATCH_SIZE: "32"
      QDRANT_COLLECTION: "dataplane_knowledge"
      EMBEDDING_DIMENSION: "3072"
      # Index-time embedding routes through the Model Plane (gRPC → inference-core),
      # matching retrieval-engine. Required so restricted (ZDR) documents have a
      # compliant embedding path — the direct-Azure backend fails closed on ZDR.
      # NOTE: a prior gRPC-hop stall (DATAPLANE_KNOWLEDGE stream stuck) drove the
      # azure_openai fallback; re-smoke-test the hop live after this flip.
      # Override EMBEDDING_PROVIDER=azure_openai if it regresses (same
      # text-embedding-3-large@3072 → query/index vectors stay compatible).
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-model_plane}
      MODEL_PLANE_AI_CORE_GRPC_URL: ${MODEL_PLANE_AI_CORE_GRPC_URL:-http://inference-core:9092}
      MODEL_PLANE_EMBEDDING_PROVIDER: ${MODEL_PLANE_EMBEDDING_PROVIDER:-azure_openai}
      MODEL_PLANE_EMBEDDING_TIMEOUT_MS: ${MODEL_PLANE_EMBEDDING_TIMEOUT_MS:-30000}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-text-embedding-3-large}
      # Phase-2 visual RAG — Cohere Embed v4 (multimodal) page-image embeddings.
      # Same core-ai-rg Foundry resource + key as Cohere rerank; the DEPLOYED
      # model is `embed-v-4-0` (NOT the code default `Cohere-embed-4`). Setting the
      # endpoint activates the page-image consumer (embeds pages → visual collection).
      COHERE_EMBED_V4_ENDPOINT: ${COHERE_EMBED_V4_ENDPOINT:-}
      COHERE_EMBED_V4_API_KEY: ${COHERE_API_KEY:-}
      COHERE_EMBED_V4_DEPLOYMENT: ${COHERE_EMBED_V4_DEPLOYMENT:-embed-v-4-0}
      COHERE_EMBED_V4_API_VERSION: ${COHERE_EMBED_V4_API_VERSION:-2024-05-01-preview}
      QDRANT_VISUAL_COLLECTION: ${QDRANT_VISUAL_COLLECTION:-dataplane_page_images}
      VISUAL_EMBEDDING_DIMENSION: ${VISUAL_EMBEDDING_DIMENSION:-1536}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # NOTE: the log target is the BIN/crate name `embedding_engine` (package is
      # `embedding-engine-rs`). The old `embedding_engine_rs=info` matched nothing →
      # silent empty logs. (Code default in main.rs has the same wrong name — fix on
      # next rebuild; this compose value overrides it at runtime.)
      RUST_LOG: ${RUST_LOG:-warn,embedding_engine=info}
      ENABLE_SIGNED_EVENT_CONSUMERS: "1"
      INDEX_EVENT_PUBLIC_KEY_PATH: /run/event-keys/index-events.pub
      WIKI_EVENT_PUBLIC_KEY_PATH: /run/event-keys/wiki-events.pub
      EMBEDDING_EVENT_PRIVATE_KEY_PATH: /run/event-keys/embedding-events.pem
      EVENT_AUTH_AUDIENCE: dataplane-events
    volumes:
      - ${INDEX_EVENT_VERIFYING_PUBLIC_KEY_PATH:?INDEX_EVENT_VERIFYING_PUBLIC_KEY_PATH is required}:/run/event-keys/index-events.pub:ro
      - ${WIKI_EVENT_VERIFYING_PUBLIC_KEY_PATH:?WIKI_EVENT_VERIFYING_PUBLIC_KEY_PATH is required}:/run/event-keys/wiki-events.pub:ro
      - ${EMBEDDING_EVENT_SIGNING_PRIVATE_KEY_PATH:?EMBEDDING_EVENT_SIGNING_PRIVATE_KEY_PATH is required}:/run/event-keys/embedding-events.pem:ro
    networks:
      dpv2-net:
      inter-plane-bus:
        aliases:
          - dpv2-embedding-engine
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9202/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  graph-index:
    <<: *hardened-runtime
    build:
      context: .
      dockerfile: services/graph-index-rs/Dockerfile
      args: *build-metadata
      additional_contexts:
        model-plane-proto: "../Model Plane/proto"
    restart: unless-stopped
    init: true
    expose:
      - "9203"
      - "50053"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dataplane}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-dataplane}
      NATS_URL: nats://data-nats:4222
      DATAPLANE_NATS_TOKEN: ${DATAPLANE_NATS_TOKEN:?DATAPLANE_NATS_TOKEN is required}
      ADMIN_PORT: "9203"
      # Graph entity/relationship extraction routes through the Model Plane
      # (gRPC → inference-core Infer), NOT direct Azure — no independent LLM
      # calls outside the Model Plane. Override GRAPH_EXTRACTION_PROVIDER=
      # azure_openai (and set the AZURE_* vars) to fall back to the direct path.
      GRAPH_EXTRACTION_PROVIDER: ${GRAPH_EXTRACTION_PROVIDER:-model_plane}
      MODEL_PLANE_AI_CORE_GRPC_URL: ${MODEL_PLANE_AI_CORE_GRPC_URL:-http://inference-core:9092}
      MODEL_PLANE_EXTRACTION_MODEL: ${MODEL_PLANE_EXTRACTION_MODEL:-gpt-4o-mini}
      MODEL_PLANE_EXTRACTION_PROVIDER: ${MODEL_PLANE_EXTRACTION_PROVIDER:-azure_openai}
      MODEL_PLANE_EXTRACTION_TIMEOUT_MS: ${MODEL_PLANE_EXTRACTION_TIMEOUT_MS:-60000}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      JWT_JWKS_URL: ${AUTH_CORE_JWKS_URL:-http://auth-core:3011/api/convex-auth/jwks}
      JWT_REQUIRED_AUDIENCE: ${DATA_PLANE_AUTH_AUDIENCE:-data-plane}
      JWT_REQUIRED_ISSUER: ${AUTH_CORE_ISSUER:-http://localhost:3011/api/convex-auth}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_EXTRACTION_DEPLOYMENT: ${AZURE_OPENAI_EXTRACTION_DEPLOYMENT:-gpt-4o}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      RUST_LOG: ${RUST_LOG:-warn,graph_index=info}
      ENABLE_SIGNED_EVENT_CONSUMERS: "1"
      EMBEDDING_EVENT_PUBLIC_KEY_PATH: /run/event-keys/embedding-events.pub
      INDEX_EVENT_PUBLIC_KEY_PATH: /run/event-keys/index-events.pub
      EVENT_AUTH_AUDIENCE: dataplane-events
    volumes:
      - ${EMBEDDING_EVENT_VERIFYING_PUBLIC_KEY_PATH:?EMBEDDING_EVENT_VERIFYING_PUBLIC_KEY_PATH is required}:/run/event-keys/embedding-events.pub:ro
      - ${INDEX_EVENT_VERIFYING_PUBLIC_KEY_PATH:?INDEX_EVENT_VERIFYING_PUBLIC_KEY_PATH is required}:/run/event-keys/index-events.pub:ro
    networks:
      dpv2-net:
      inter-plane-bus:
        aliases:
          - dpv2-graph-index
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9203/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  quickwit-adapter:
    <<: *hardened-runtime
    build:
      context: .
      dockerfile: services/quickwit-adapter-rs/Dockerfile
      args: *build-metadata
    restart: unless-stopped
    init: true
    expose:
      - "9204"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dataplane}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-dataplane}
      NATS_URL: nats://data-nats:4222
      DATAPLANE_NATS_TOKEN: ${DATAPLANE_NATS_TOKEN:?DATAPLANE_NATS_TOKEN is required}
      QUICKWIT_URL: ${QUICKWIT_URL:-http://quickwit:7280}
      QUICKWIT_INDEX_ID: ${QUICKWIT_INDEX_ID:-dataplane-corpus}
      QUICKWIT_INDEX_CONFIG_PATH: /app/infra/quickwit/dataplane-corpus-index.yaml
      ADMIN_PORT: ${QUICKWIT_ADAPTER_ADMIN_PORT:-9204}
      BATCH_SIZE: ${QUICKWIT_ADAPTER_BATCH_SIZE:-500}
      REBUILD_ON_START: ${QUICKWIT_ADAPTER_REBUILD_ON_START:-false}
      AUTH_PUBLIC_KEY_FILE: /app/keys/convex-auth.pub
      AUTH_AUDIENCE: ${DATA_PLANE_AUTH_AUDIENCE:-data-plane}
      AUTH_ISSUER: ${AUTH_CORE_ISSUER:-http://localhost:3011/api/convex-auth}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      RUST_LOG: ${RUST_LOG:-warn,quickwit_adapter=info}
    volumes:
      - ../Control Plane/auth-core/keys/convex-auth.pub:/app/keys/convex-auth.pub:ro
    networks:
      dpv2-net:
      inter-plane-bus:
        aliases:
          - dpv2-quickwit-adapter
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      quickwit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9204/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # GO SERVICES
  # ─────────────────────────────────────────────────────────────

  documents-api:
    <<: *hardened-runtime
    build:
      context: services/documents-api-go
      dockerfile: Dockerfile
      args: *build-metadata
    restart: unless-stopped
    init: true
    expose:
      - "8010"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dataplane}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-dataplane}
      NATS_URL: nats://data-nats:4222
      DATAPLANE_NATS_TOKEN: ${DATAPLANE_NATS_TOKEN:?DATAPLANE_NATS_TOKEN is required}
      NATS_SHARED_URL: ${NATS_SHARED_URL:-}
      VELION_NATS_TOKEN: ${VELION_NATS_TOKEN:-}
      USER_CORE_SERVICE_TOKEN: ${USER_CORE_DOCUMENTS_TOKEN:?USER_CORE_DOCUMENTS_TOKEN is required}
      # Per-user ownership: filter-at-source needs the viewer's granted doc-set
      # from user-core's resource_grants facade. HTTP/facade port is 3012, NOT 8080.
      USER_CORE_URL: ${USER_CORE_URL:-http://user-core:3012}
      HTTP_PORT: "8010"
      # Auth is enforced by default; tenant and user identity come only from the
      # verified Control Plane token. JWKS unavailability fails closed.
      AUTHCTX_ENFORCE: "1"
      JWT_PUBLIC_KEY_FILE: ""
      AUTH_CORE_JWKS_URL: ${AUTH_CORE_JWKS_URL:-http://auth-core:3011/api/convex-auth/jwks}
      AUTH_CORE_ISSUER: ${AUTH_CORE_ISSUER:-http://localhost:3011/api/convex-auth}
      EVENT_SIGNING_PRIVATE_KEY_PATH: /run/event-keys/documents-events.pem
      EVENT_SIGNING_KEY_ID: documents-events-v1
      EVENT_AUTH_AUDIENCE: dataplane-events
    volumes:
      - ${DOCUMENTS_EVENT_SIGNING_PRIVATE_KEY_PATH:?DOCUMENTS_EVENT_SIGNING_PRIVATE_KEY_PATH is required}:/run/event-keys/documents-events.pem:ro
    networks:
      dpv2-net:
      inter-plane-bus:
        aliases:
          - dpv2-documents-api
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8010/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  wiki-store:
    <<: *hardened-runtime
    build:
      context: .
      dockerfile: services/wiki-store-go/Dockerfile
      args: *build-metadata
    restart: unless-stopped
    init: true
    expose:
      - "8011"
      - "50054"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dataplane}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-dataplane}
      HTTP_PORT: "8011"
      # §16.3.8 — without NATS_URL the wiki publisher is nil, so CreatePage/
      # CreateVersion never emit `dataplane.wiki.version.published` → the
      # embedding-engine wiki subscriber never embeds wiki content → wiki pages
      # never reach the RAG corpus (w_wiki contributes nothing). Wire it.
      NATS_URL: nats://data-nats:4222
      DATAPLANE_NATS_TOKEN: ${DATAPLANE_NATS_TOKEN:?DATAPLANE_NATS_TOKEN is required}
      WIKI_EVENT_PRIVATE_KEY_PATH: /run/event-keys/wiki-events.pem
      DATA_PLANE_AUTH_AUDIENCE: ${DATA_PLANE_AUTH_AUDIENCE:-data-plane}
      AUTH_CORE_ISSUER: ${AUTH_CORE_ISSUER:-http://localhost:3011/api/convex-auth}
      AUTH_CORE_JWKS_URL: ${AUTH_CORE_JWKS_URL:-http://auth-core:3011/api/convex-auth/jwks}
      JWT_PUBLIC_KEY_FILE: ""
    volumes:
      - ${WIKI_EVENT_SIGNING_PRIVATE_KEY_PATH:?WIKI_EVENT_SIGNING_PRIVATE_KEY_PATH is required}:/run/event-keys/wiki-events.pem:ro
    networks:
      dpv2-net:
      inter-plane-bus:
        aliases:
          - dpv2-wiki-store
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8011/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  data-orchestrator:
    <<: *hardened-runtime
    build:
      context: services/data-orchestrator-go
      dockerfile: Dockerfile
      args: *build-metadata
    restart: unless-stopped
    init: true
    expose:
      - "8012"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dataplane}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-dataplane}
      NATS_URL: nats://data-nats:4222
      DATAPLANE_NATS_TOKEN: ${DATAPLANE_NATS_TOKEN:?DATAPLANE_NATS_TOKEN is required}
      HTTP_PORT: "8012"
      DATA_PLANE_AUTH_AUDIENCE: ${DATA_PLANE_AUTH_AUDIENCE:-data-plane}
      AUTH_CORE_ISSUER: ${AUTH_CORE_ISSUER:-http://localhost:3011/api/convex-auth}
      AUTH_CORE_JWKS_URL: ${AUTH_CORE_JWKS_URL:-http://auth-core:3011/api/convex-auth/jwks}
      JWT_PUBLIC_KEY_FILE: ""
    networks:
      - dpv2-net
      - inter-plane-bus
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8012/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  data-quality:
    <<: *hardened-runtime
    build:
      context: services/data-quality-go
      dockerfile: Dockerfile
      args: *build-metadata
    restart: unless-stopped
    init: true
    expose:
      - "8013"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dataplane}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-dataplane}
      HTTP_PORT: "8013"
      DATA_PLANE_AUTH_AUDIENCE: ${DATA_PLANE_AUTH_AUDIENCE:-data-plane}
      AUTH_CORE_ISSUER: ${AUTH_CORE_ISSUER:-http://localhost:3011/api/convex-auth}
      AUTH_CORE_JWKS_URL: ${AUTH_CORE_JWKS_URL:-http://auth-core:3011/api/convex-auth/jwks}
      JWT_PUBLIC_KEY_FILE: ""
    networks:
      - dpv2-net
      - inter-plane-bus
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8013/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # OBSERVABILITY (optional — only starts if profile "obs" is selected)
  # ─────────────────────────────────────────────────────────────

  prometheus:
    <<: *infra-observability
    image: prom/prometheus:v2.55.0
    profiles: ["obs"]
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - dpv2-net
      - inter-plane-bus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - dpv2_prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    deploy:
      resources:
        limits:
          memory: 512M

  grafana:
    <<: *infra-observability
    image: grafana/grafana:11.3.0
    profiles: ["obs"]
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - dpv2-net
      - inter-plane-bus
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - dpv2_grafana:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  dpv2-net:
    name: ${DPV2_NETWORK_NAME:-dpv2-net}
    driver: bridge
  inter-plane-bus:
    external: true
    name: ${INTER_PLANE_BUS_NETWORK:-inter-plane-bus}

volumes:
  dpv2_postgres:
  dpv2_dragonfly:
  dpv2_qdrant:
  dpv2_nats:
  dpv2_minio:
  dpv2_quickwit_cache:
  dpv2_prometheus:
  dpv2_grafana:

secrets:
  # Environment-backed Compose secret: not evaluated until Grafana's optional
  # profile is actually created, so the default stack remains independent.
  grafana_admin_password:
    environment: GRAFANA_ADMIN_PASSWORD
