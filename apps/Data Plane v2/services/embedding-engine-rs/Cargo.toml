[package]
name = "embedding-engine-rs"
version.workspace = true
edition.workspace = true

[[bin]]
name = "embedding-engine"
path = "src/main.rs"

[[bin]]
name = "backfill-reannounce"
path = "src/bin/backfill_reannounce.rs"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sqlx.workspace = true
qdrant-client.workspace = true
reqwest.workspace = true
jsonwebtoken.workspace = true
chrono.workspace = true
axum.workspace = true
tonic.workspace = true
prost.workspace = true
tower-http.workspace = true
envy = "0.4"
async-nats.workspace = true
nats-connection-rs = { path = "../nats-connection-rs" }
futures = "0.3"
event-envelope-rs = { path = "../event-envelope-rs" }
pg-org-scope-rs = { path = "../pg-org-scope-rs" }
base64 = "0.22"
# Visual RAG: downscale + recompress rendered page images to fit Embed v4's
# per-request token budget. PNG decode + JPEG encode only (lean feature set).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# GDPR/DSAR erasure completeness: delete page-image binaries from the MinIO
# CAS bucket alongside their Qdrant vectors. Matches the version pin and
# feature set already used by Ingestion Plane's `CasStore`
# (quarry-runtime/src/cas_store.rs), which this module's delete path mirrors.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }

[build-dependencies]
tonic-build.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
rand = "0.8"
rsa = { version = "0.9", features = ["pem"] }
