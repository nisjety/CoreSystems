version: 0.7
index_id: dataplane-corpus
index_uri: s3://quickwit/indexes/dataplane-corpus
doc_mapping:
  mode: lenient
  field_mappings:
    - name: timestamp
      type: datetime
      input_formats:
        - rfc3339
      fast_precision: seconds
      fast: true
    - name: rebuild_batch_id
      type: text
      tokenizer: raw
      fast:
        normalizer: lowercase
    - name: entity_type
      type: text
      tokenizer: raw
      fast:
        normalizer: lowercase
    - name: org_id
      type: text
      tokenizer: raw
      fast:
        normalizer: lowercase
    - name: document_id
      type: text
      tokenizer: raw
      fast:
        normalizer: lowercase
    - name: knowledge_id
      type: text
      tokenizer: raw
      fast:
        normalizer: lowercase
    - name: source_object_id
      type: text
      tokenizer: raw
      fast:
        normalizer: lowercase
    - name: chunk_index
      type: i64
      fast: true
    - name: source
      type: text
      tokenizer: default
      record: position
    - name: title
      type: text
      tokenizer: default
      record: position
      fieldnorms: true
    - name: body
      type: text
      tokenizer: default
      record: position
      fieldnorms: true
    # Contextual Retrieval (Anthropic, 2024) — the LLM-generated sentences
    # situating a chunk inside its document, written by embedding-engine-rs.
    #
    # A SEPARATE field from `body`, never merged into it, for two reasons:
    #   * `body` is what retrieval-engine-rs returns as the candidate's text
    #     (search/sparse.rs reads `body`), and a citation must show the
    #     document's own words, not a model's preamble about them.
    #   * BM25 sums across fields. Indexing "context + chunk" here while `body`
    #     already holds the chunk would score the chunk's own terms twice and
    #     silently re-weight every lexical result.
    #
    # This mirrors the Postgres fallback exactly, where content_tsv carries
    # `text` at weight A and `chunk_context` at weight B — so the primary sparse
    # backend and its fallback agree on structure, not just on tokenizer.
    - name: context_body
      type: text
      tokenizer: default
      record: position
      fieldnorms: true
    - name: site_id
      type: text
      tokenizer: raw
      fast:
        normalizer: lowercase
    - name: drive_id
      type: text
      tokenizer: raw
      fast:
        normalizer: lowercase
    - name: item_id
      type: text
      tokenizer: raw
      fast:
        normalizer: lowercase
    - name: path
      type: text
      tokenizer: default
      record: position
    - name: mime_type
      type: text
      tokenizer: raw
      fast:
        normalizer: lowercase
    - name: modified_at
      type: datetime
      input_formats:
        - rfc3339
      fast_precision: seconds
      fast: true
    - name: quickxor_hash
      type: text
      tokenizer: raw
      fast:
        normalizer: lowercase
    - name: sha1_hash
      type: text
      tokenizer: raw
      fast:
        normalizer: lowercase
    - name: content_hash
      type: text
      tokenizer: raw
      fast:
        normalizer: lowercase
    - name: acl_tags
      type: array<text>
      tokenizer: raw
    - name: metadata
      type: json
      tokenizer: default
  tag_fields:
    - org_id
    - entity_type
    - mime_type
  timestamp_field: timestamp
  index_field_presence: true
indexing_settings:
  commit_timeout_secs: 30
search_settings:
  default_search_fields:
    - title
    - body
    # Contextual Retrieval's lexical half: an unqualified query term now also
    # matches a chunk's situating context, which is what makes a chunk findable
    # by the entity or date it only mentions implicitly. Listed AFTER body so
    # the ordering reflects intent, though Quickwit sums field scores rather
    # than preferring by position.
    - context_body
    - source
    - path
