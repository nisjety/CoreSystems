openapi: 3.1.0
info:
  title: CoreSystem Learning Plane
  version: 0.2.0
  description: >-
    L01 school, course and formative attempt records. Completion events are
    learner-reported and do not establish independently verified mastery.
    This contract does not represent a pilot-ready teaching, speech or device-control system.
servers:
  - url: http://127.0.0.1:3196
security:
  - controlSession: []
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: getLiveness
      security: []
      responses:
        '200':
          description: Process is alive; does not establish school/course readiness.
  /readyz:
    get:
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: Control membership authority and Learning storage are reachable.
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/learning/status:
    get:
      operationId: getLearningStatus
      security: []
      responses:
        '200':
          description: Content-free capability state; ready remains false until guided teaching is available.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/LearningStatus'
  /api/v1/learning/me:
    get:
      operationId: getLearningPrincipal
      summary: Return the Control session and active organization verified by Learning Core.
      responses:
        '200':
          description: Verified current user and active organization.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/SchoolContext'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/learning/classes:
    get:
      operationId: listLearningClasses
      summary: List classes where the current user has active class membership.
      responses:
        '200':
          description: Classes visible to the verified user.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LearningClass' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: createLearningClass
      summary: Create a class. Control owners/admins only; creator becomes its first teacher.
      parameters: [{ $ref: '#/components/parameters/LearningRequest' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 120 } }, additionalProperties: false }
      responses:
        '201': { $ref: '#/components/responses/ClassCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/learning/classes/{classID}/members:
    parameters: [{ $ref: '#/components/parameters/ClassID' }]
    get:
      operationId: listClassMembers
      summary: List active members. Active class teachers only.
      responses:
        '200': { $ref: '#/components/responses/ClassMembers' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: addClassMember
      summary: Add a verified Control member to a class. Teachers may add learners; school admins may add either role.
      parameters: [{ $ref: '#/components/parameters/LearningRequest' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, role]
              properties:
                userId: { type: string, minLength: 1, maxLength: 128 }
                role: { type: string, enum: [teacher, student] }
              additionalProperties: false
      responses:
        '200': { $ref: '#/components/responses/MemberAdded' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Active class membership has a conflicting role. }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/learning/classes/{classID}/members/{userID}:
    parameters:
      - { $ref: '#/components/parameters/ClassID' }
      - name: userID
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: removeClassMember
      summary: Deactivate a class member. A class must retain at least one teacher.
      parameters: [{ $ref: '#/components/parameters/LearningRequest' }]
      responses:
        '200': { $ref: '#/components/responses/MemberRemoved' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Cannot remove the last active teacher. }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/learning/classes/{classID}/courses:
    parameters: [{ $ref: '#/components/parameters/ClassID' }]
    get:
      operationId: listClassCourses
      summary: List teacher-visible revisions or published assigned revisions for a learner.
      responses:
        '200':
          description: Course revisions visible to this class member.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CourseRevision' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createClassCourse
      summary: Create a constrained course draft. Active class teachers only.
      parameters: [{ $ref: '#/components/parameters/LearningRequest' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseInput' }
      responses:
        '201': { $ref: '#/components/responses/CourseCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/learning/classes/{classID}/courses/{courseID}/revisions:
    parameters:
      - { $ref: '#/components/parameters/ClassID' }
      - { $ref: '#/components/parameters/CourseID' }
    post:
      operationId: createCourseRevision
      summary: Create the next course revision after all drafts are resolved.
      parameters: [{ $ref: '#/components/parameters/LearningRequest' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseInput' }
      responses:
        '201': { $ref: '#/components/responses/CourseCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A draft revision already exists. }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/learning/classes/{classID}/courses/{courseID}/revisions/{revision}/publish:
    parameters:
      - { $ref: '#/components/parameters/ClassID' }
      - { $ref: '#/components/parameters/CourseID' }
      - name: revision
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      operationId: publishCourseRevision
      summary: Publish and lock one draft revision.
      parameters: [{ $ref: '#/components/parameters/LearningRequest' }]
      responses:
        '200': { $ref: '#/components/responses/CoursePublished' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Revision is not a draft. }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/learning/classes/{classID}/assignments:
    parameters: [{ $ref: '#/components/parameters/ClassID' }]
    get:
      operationId: listClassAssignments
      summary: List assignments visible to an active teacher or learner in this class.
      responses:
        '200':
          description: Assignments pinned to published course revisions.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Assignment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: assignPublishedCourse
      summary: Assign one published revision to the whole class. Active teachers only.
      parameters: [{ $ref: '#/components/parameters/LearningRequest' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courseId, revision]
              properties:
                courseId: { type: string, minLength: 1 }
                revision: { type: integer, minimum: 1 }
                dueAt: { type: [string, 'null'], format: date-time }
              additionalProperties: false
      responses:
        '201': { $ref: '#/components/responses/AssignmentCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/learning/classes/{classID}/assignments/{assignmentID}/attempts:
    parameters:
      - { $ref: '#/components/parameters/ClassID' }
      - { $ref: '#/components/parameters/AssignmentID' }
    get:
      operationId: listOwnLearningAttempts
      summary: List the signed-in learner's attempts for this class assignment.
      responses:
        '200': { $ref: '#/components/responses/Attempts' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: startLearningAttempt
      summary: Start an attempt as an active student in the assigned class.
      parameters:
        - { $ref: '#/components/parameters/LearningRequest' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [guide, demonstrate, practice] }
              additionalProperties: false
      responses:
        '201': { $ref: '#/components/responses/AttemptCreated' }
        '200': { $ref: '#/components/responses/AttemptCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Idempotency key was reused with different request data. }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/learning/classes/{classID}/assignments/{assignmentID}/progress:
    parameters:
      - { $ref: '#/components/parameters/ClassID' }
      - { $ref: '#/components/parameters/AssignmentID' }
    get:
      operationId: listAssignmentProgress
      summary: List active learners' attempt summaries for a class teacher.
      description: Self-reported completion counts are not evidence of independently verified mastery.
      responses:
        '200': { $ref: '#/components/responses/AttemptProgress' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/learning/classes/{classID}/attempts/{attemptID}/events:
    parameters:
      - { $ref: '#/components/parameters/ClassID' }
      - { $ref: '#/components/parameters/AttemptID' }
    get:
      operationId: listOwnAttemptEvents
      summary: List events for the signed-in learner's own attempt.
      responses:
        '200': { $ref: '#/components/responses/AttemptEvents' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: recordAttemptEvent
      summary: Append one learner-reported step or attempt event.
      description: Event bodies contain no screen, audio or free-form student content; requests are idempotent.
      parameters:
        - { $ref: '#/components/parameters/LearningRequest' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttemptEventInput' }
      responses:
        '201': { $ref: '#/components/responses/AttemptEventCreated' }
        '200': { $ref: '#/components/responses/AttemptEventCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Attempt is finished or idempotency key was reused with different data. }
        '429': { description: Attempt event limit reached. }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  securitySchemes:
    controlSession:
      type: apiKey
      in: header
      name: Cookie
      description: Current Control Auth session cookie forwarded by the same-origin BFF.
    bearerAuth:
      type: http
      scheme: bearer
      description: Optional Control-issued bearer session for non-browser clients.
  parameters:
    LearningRequest:
      name: X-Learning-Request
      in: header
      required: true
      description: Same-origin browser write marker; this is not authentication or authorization.
      schema: { const: dashboard-v1 }
    ClassID:
      name: classID
      in: path
      required: true
      schema: { type: string }
    CourseID:
      name: courseID
      in: path
      required: true
      schema: { type: string }
    AssignmentID:
      name: assignmentID
      in: path
      required: true
      schema: { type: string }
    AttemptID:
      name: attemptID
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Random per-operation key; the API stores a SHA-256 digest rather than the raw key.
      schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
  schemas:
    LearningStatus:
      type: object
      required: [service, phase, ready, processingProfile, capabilities]
      properties:
        service: { const: learning-core }
        phase: { type: string, enum: [foundation, school-access-and-courses] }
        ready: { const: false }
        processingProfile: { const: strict-self-hosted }
        capabilities:
          type: array
          items:
            type: object
            required: [key, state]
            properties:
              key: { type: string, enum: [school-identity, course-persistence, learner-progress, self-hosted-speech, tutor-runtime, teacher-assistance] }
              state: { type: string, enum: [connected, not-connected] }
    SchoolContext:
      type: object
      required: [user, organization]
      properties:
        user:
          type: object
          required: [id]
          properties: { id: { type: string } }
        organization:
          type: object
          required: [id, role]
          properties:
            id: { type: string }
            role: { type: string, enum: [owner, admin, member, viewer] }
    LearningClass:
      type: object
      required: [id, name, role, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, enum: [teacher, student] }
        createdAt: { type: string, format: date-time }
    ClassMember:
      type: object
      required: [userId, role, addedAt]
      properties:
        userId: { type: string }
        role: { type: string, enum: [teacher, student] }
        addedAt: { type: string, format: date-time }
    CourseInput:
      type: object
      required: [title, description, content]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        content: { $ref: '#/components/schemas/LessonDefinition' }
      additionalProperties: false
    LessonDefinition:
      type: object
      required: [version, application, objectives, steps]
      properties:
        version: { const: 1 }
        application: { type: string, minLength: 1, maxLength: 120 }
        objectives:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 300 }
        steps:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [id, instruction, expectedResult]
            properties:
              id: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,79}$' }
              instruction: { type: string, minLength: 1, maxLength: 2000 }
              expectedResult: { type: string, minLength: 1, maxLength: 2000 }
            additionalProperties: false
      additionalProperties: false
    CourseRevision:
      type: object
      required: [id, classId, revision, title, description, content, state, createdAt]
      properties:
        id: { type: string }
        classId: { type: string }
        revision: { type: integer, minimum: 1 }
        title: { type: string }
        description: { type: string }
        content: { $ref: '#/components/schemas/LessonDefinition' }
        state: { type: string, enum: [draft, published] }
        createdAt: { type: string, format: date-time }
        publishedAt: { type: [string, 'null'], format: date-time }
    Assignment:
      type: object
      required: [id, classId, courseId, revision, title, createdAt]
      properties:
        id: { type: string }
        classId: { type: string }
        courseId: { type: string }
        revision: { type: integer, minimum: 1 }
        title: { type: string }
        dueAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    LearningAttempt:
      type: object
      required: [id, classId, assignmentId, mode, status, startedAt]
      properties:
        id: { type: string }
        classId: { type: string }
        assignmentId: { type: string }
        mode: { type: string, enum: [guide, demonstrate, practice] }
        status: { type: string, enum: [in_progress, finished, abandoned] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    AttemptEventInput:
      type: object
      oneOf:
        - type: object
          required: [type, stepId]
          properties:
            type: { type: string, enum: [step_started, assistance_used, learner_reported_complete, blocked] }
            stepId: { type: string, minLength: 1, maxLength: 80 }
          additionalProperties: false
        - type: object
          required: [type]
          properties:
            type: { type: string, enum: [attempt_finished, attempt_abandoned] }
          additionalProperties: false
    AttemptEvent:
      type: object
      required: [id, sequence, type, occurredAt]
      properties:
        id: { type: string }
        sequence: { type: integer, minimum: 1 }
        type: { type: string, enum: [step_started, assistance_used, learner_reported_complete, blocked, attempt_finished, attempt_abandoned] }
        stepId: { type: [string, 'null'] }
        occurredAt: { type: string, format: date-time }
    AttemptProgress:
      type: object
      required: [attemptId, learnerId, mode, status, startedAt, totalSteps, selfReportedCompleteSteps]
      properties:
        attemptId: { type: string }
        learnerId: { type: string }
        mode: { type: string, enum: [guide, demonstrate, practice] }
        status: { type: string, enum: [in_progress, finished, abandoned] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        totalSteps: { type: integer, minimum: 1, maximum: 100 }
        selfReportedCompleteSteps: { type: integer, minimum: 0, maximum: 100 }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
  responses:
    BadRequest:
      description: Invalid request or unsupported lesson definition.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Current Control session is missing or expired.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: School membership or class role does not permit the operation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Class, course or verified school member was not found in this scope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServiceUnavailable:
      description: Control authority or Learning storage is unavailable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ClassCreated:
      description: Class created; the caller is its first teacher.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties: { data: { $ref: '#/components/schemas/LearningClass' } }
    ClassMembers:
      description: Active roster returned only to an active class teacher.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items: { $ref: '#/components/schemas/ClassMember' }
    MemberAdded:
      description: Verified school account is active in the class.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [userId, role, status]
                properties:
                  userId: { type: string }
                  role: { type: string, enum: [teacher, student] }
                  status: { const: active }
    MemberRemoved:
      description: Membership is deactivated.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [removed]
                properties: { removed: { const: true } }
    CourseCreated:
      description: A constrained draft revision was created.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties: { data: { $ref: '#/components/schemas/CourseRevision' } }
    CoursePublished:
      description: Draft revision is published and immutable.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties: { data: { $ref: '#/components/schemas/CourseRevision' } }
    AssignmentCreated:
      description: Assignment created or existing class/revision assignment returned idempotently.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties: { data: { $ref: '#/components/schemas/Assignment' } }
    AttemptCreated:
      description: Attempt created or returned idempotently for the same request key.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties: { data: { $ref: '#/components/schemas/LearningAttempt' } }
    Attempts:
      description: Attempts belonging only to the authenticated learner.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items: { $ref: '#/components/schemas/LearningAttempt' }
    AttemptEvents:
      description: Ordered events belonging only to the authenticated learner's attempt.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items: { $ref: '#/components/schemas/AttemptEvent' }
    AttemptEventCreated:
      description: Event appended or returned idempotently for the same request key.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties: { data: { $ref: '#/components/schemas/AttemptEvent' } }
    AttemptProgress:
      description: Teacher-only attempt summaries. Completion counters are explicitly self-reported.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items: { $ref: '#/components/schemas/AttemptProgress' }
