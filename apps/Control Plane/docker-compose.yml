name: control-plane

services:
  # ==============================================
  # INFRASTRUCTURE (KUN controlplane-net)
  # ==============================================

  controlplane-postgres:
    image: postgres:15-alpine
    container_name: controlplane-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-controlplane}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - controlplane-net
    shm_size: "128mb"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "effective_cache_size=256MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "log_min_messages=warning"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Viktig: pg_isready uten -d kan default-e til db=bruker. Her er det OK, men vi kan være eksplisitte.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-controlplane}"]
      interval: 10s
      timeout: 5s
      retries: 5

  controlplane-dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.37.0
    container_name: controlplane-dragonfly
    restart: unless-stopped
    command: >
      --requirepass=${DRAGONFLY_PASSWORD:-change-me-dragonfly-password}
      --cache_mode=true
      --maxmemory=256mb
      --proactor_threads=1
      --dir=/data
    ports:
      - "6380:6379"
    volumes:
      - dragonfly-data:/data
    networks:
      - controlplane-net
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${DRAGONFLY_PASSWORD:-change-me-dragonfly-password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  controlplane-nats:
    image: nats:2.10-alpine
    container_name: controlplane-nats
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "4223:4222"
      - "8223:8222"
    volumes:
      - nats-data:/data
      - ./nats.conf:/etc/nats/nats.conf:ro
    networks:
      - controlplane-net
      - inter-plane-bus  # exposed so shared cross-plane services can reach it by container name
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
        reservations:
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==============================================
  # CONTROL PLANE APPS (controlplane-net + inter-plane-bus)
  # ==============================================

  auth-core:
    build:
      context: ./auth-core
      dockerfile: Dockerfile
    container_name: auth-service
    init: true
    restart: unless-stopped
    env_file:
      - ./auth-core/.env.docker
    environment:
      VELION_NATS_URL: ${VELION_NATS_URL}
      VELION_NATS_TOKEN: ${VELION_NATS_TOKEN}
      # Better Auth CSRF/origin trust for velionv3 via the Rust gateway (:3185)
      # plus SPA dev/Docker origins. auth.ts unions this with the built-in list
      # (incl velionv2 :3000) — additive, does not displace existing trust.
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:3185,http://127.0.0.1:3185,http://localhost:3186,http://127.0.0.1:3186,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5199,http://127.0.0.1:5199}
      DISPOSABLE_EMAIL_BLOCKLIST_ENABLED: ${DISPOSABLE_EMAIL_BLOCKLIST_ENABLED:-true}
      DISPOSABLE_EMAIL_DOMAINS_FILE: ${DISPOSABLE_EMAIL_DOMAINS_FILE:-/app/config/security/disposable-email-domains.txt}
    volumes:
      - ./config/security/disposable-email-domains.txt:/app/config/security/disposable-email-domains.txt:ro
    ports:
      - "3011:3011"
      - "50011:50011"
    networks:
      - controlplane-net
      - inter-plane-bus
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      controlplane-postgres:
        condition: service_healthy
      controlplane-dragonfly:
        condition: service_healthy
      controlplane-nats:
        condition: service_healthy
    stop_signal: SIGTERM
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3011/api/auth/get-session"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 45s

  user-core:
    build:
      context: ./user-core
      dockerfile: Dockerfile
    container_name: user-service
    init: true
    restart: unless-stopped 
    env_file:
      - ./user-core/.env.docker
    environment:
      GOMAXPROCS: "1"
      PPROF_ENABLED: "true"
      VELION_NATS_URL: ${VELION_NATS_URL}
      VELION_NATS_TOKEN: ${VELION_NATS_TOKEN}
      # G26: silence gin's debug-mode banner + enable release-mode perf paths.
      GIN_MODE: release
    ports:
      - "3012:3012"
      - "50012:50012"
      - "6060:6060"
    networks:
      - controlplane-net
      - inter-plane-bus
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      controlplane-postgres:
        condition: service_healthy
      controlplane-dragonfly:
        condition: service_healthy
      controlplane-nats:
        condition: service_healthy
      auth-core:
        condition: service_healthy
    stop_signal: SIGTERM
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 50012 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  org-core:
    build:
      context: ./org-core
      dockerfile: Dockerfile
    container_name: org-core-service
    init: true
    restart: unless-stopped
    env_file:
      - ./org-core/.env.docker
    environment:
      GOMAXPROCS: "1"
      PPROF_ENABLED: "true"
      VELION_NATS_URL: ${VELION_NATS_URL}
      VELION_NATS_TOKEN: ${VELION_NATS_TOKEN}
      # G26: silence gin's debug-mode banner + enable release-mode perf paths.
      GIN_MODE: release
    ports:
      - "18080:8080"   # HTTP — host 18080 avoids collision with Model Plane model-gateway (host 8080)
      - "19090:9090"   # gRPC — host 19090 avoids collision with Model Plane model-gateway gRPC (host 9090)
      - "19091:9091"   # gRPC — host 19091 avoids collision with Model Plane session-core gRPC (host 9091)
      - "6061:6061"
    networks:
      - controlplane-net
      - inter-plane-bus
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      controlplane-postgres:
        condition: service_healthy
      controlplane-dragonfly:
        condition: service_healthy
      controlplane-nats:
        condition: service_healthy
      auth-core:
        condition: service_started
      user-core:
        condition: service_started
    stop_signal: SIGTERM
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  billing-core:
    build:
      context: ./billing-core
      dockerfile: Dockerfile
    container_name: billing-core-service
    init: true
    restart: unless-stopped
    env_file:
      - ./billing-core/.env.docker
    environment:
      GOMAXPROCS: "1"
      PPROF_ENABLED: "true"
      VELION_NATS_URL: ${VELION_NATS_URL}
      VELION_NATS_TOKEN: ${VELION_NATS_TOKEN}
      # G26: silence gin's debug-mode banner + enable release-mode perf paths.
      GIN_MODE: release
    ports:
      - "3014:3014"
      - "50013:50013"
      - "6062:6062"
    networks:
      - controlplane-net
      - inter-plane-bus
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      controlplane-postgres:
        condition: service_healthy
      controlplane-dragonfly:
        condition: service_healthy
      controlplane-nats:
        condition: service_healthy
    stop_signal: SIGTERM
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3014/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==============================================
  # SESSION-CORE (session harness for Model Plane v1/v2)
  # ==============================================

  session-core:
    build:
      context: ./session-core
      dockerfile: Dockerfile
    container_name: session-core-service
    init: true
    restart: unless-stopped
    env_file:
      - ./session-core/.env.docker
    environment:
      GOMAXPROCS: "1"
      VELION_NATS_URL: ${VELION_NATS_URL}
      VELION_NATS_TOKEN: ${VELION_NATS_TOKEN}
      DB_USER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      DATABASE_USER: ${DB_USER}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      NATS_TOKEN: ${NATS_TOKEN}
      NATS_SHARED_URL: ${VELION_NATS_URL}
      NATS_SHARED_TOKEN: ${VELION_NATS_TOKEN}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET is required}
      # Canary ramp: set to 0-100 to route that % of tenants to Model Plane v2
      MODEL_PLANE_V2_ROLLOUT_PCT: ${MODEL_PLANE_V2_ROLLOUT_PCT:-0}
      # Convex sync: mirrors session/message state into convex-core (Application Plane)
      # for reactive frontend subscriptions. Leave CONVEX_URL empty to disable.
      CONVEX_URL: ${CONVEX_URL:-http://convex-backend:3211}
      CONVEX_SERVICE_KEY: ${CONVEX_SERVICE_KEY:-}
      ORG_CORE_URL: http://org-core:8080
    ports:
      - "3017:3017"
      - "50017:50017"
    networks:
      - controlplane-net
      - inter-plane-bus
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      controlplane-postgres:
        condition: service_healthy
      controlplane-dragonfly:
        condition: service_healthy
      controlplane-nats:
        condition: service_healthy
    stop_signal: SIGTERM
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3017/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==============================================
  # AUDIT-CORE (Phase A · A1.6 — append-only audit + usage log)
  # ==============================================
  # Subscribes to `velion.audit.v1.>` and `velion.usage.v1.>` on the
  # shared bus and persists to controlplane-postgres. Reads via
  # /v1/{audit,usage,usage/summary} are org-scoped by query param;
  # internal-api-key required (replaced by auth-core JWT once Wave 3
  # enforce mode lands).
  audit-core:
    build:
      context: ./audit-core
      dockerfile: Dockerfile
    container_name: audit-core-service
    init: true
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@controlplane-postgres:5432/${DB_NAME:-controlplane}?sslmode=disable
      NATS_URL: nats://velion-nats:4222
      NATS_TOKEN: ${VELION_NATS_TOKEN:-}
      HTTP_PORT: "8187"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-super-secret-internal-api-key}
    ports:
      # Native HTTP port 8187 (host and container). Kept clear of Model
      # Plane's browser-broker so the two never collide on the host.
      - "8187:8187"
    networks:
      - controlplane-net
      - inter-plane-bus
    depends_on:
      controlplane-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8187/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==============================================
  # LAGO (Holdes i CP plane: KUN controlplane-net)
  # ==============================================

  lago-db:
    image: getlago/postgres-partman:15.0-alpine
    container_name: lago-db
    restart: unless-stopped
    env_file:
      - ./lago.env
    volumes:
      - lago_postgres_data:/data/postgres
    ports:
      - "5434:5432"
    networks:
      - controlplane-net
    shm_size: "64mb"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lago -d lago"]
      interval: 10s
      timeout: 5s
      retries: 5

  lago-dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.37.0
    container_name: lago-dragonfly
    restart: unless-stopped
    command: >
      --cache_mode=true
      --maxmemory=256mb
      --proactor_threads=1
      --dir=/data
    volumes:
      - lago_dragonfly_data:/data
    ports:
      - "6381:6379"
    networks:
      - controlplane-net
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.25"
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  lago-pdf:
    image: getlago/lago-gotenberg:7.8.2
    platform: linux/amd64
    container_name: lago-pdf
    restart: unless-stopped
    networks:
      - controlplane-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  lago-migrate:
    image: getlago/api:v1.42.0
    container_name: lago-migrate
    restart: "no"
    env_file:
      - ./lago.env
    command: ["./scripts/migrate.sh"]
    depends_on:
      lago-db:
        condition: service_healthy
    networks:
      - controlplane-net

  lago-api:
    image: getlago/api:v1.42.0
    container_name: lago-api
    restart: unless-stopped
    env_file:
      - ./lago.env
    command: ["./scripts/start.api.sh"]
    ports:
      - "3016:3000"
    volumes:
      - lago_storage_data:/app/storage
    depends_on:
      lago-migrate:
        condition: service_completed_successfully
      lago-db:
        condition: service_healthy
      lago-dragonfly:
        condition: service_healthy
    networks:
      - controlplane-net
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
        reservations:
          memory: 192M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      start_period: 45s
      timeout: 15s
      retries: 5

  lago-worker:
    image: getlago/api:v1.42.0
    container_name: lago-worker
    restart: unless-stopped
    env_file:
      - ./lago.env
    command: ["./scripts/start.worker.sh"]
    volumes:
      - lago_storage_data:/app/storage
    depends_on:
      lago-migrate:
        condition: service_completed_successfully
      lago-db:
        condition: service_healthy
      lago-dragonfly:
        condition: service_healthy
    networks:
      - controlplane-net
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
        reservations:
          memory: 192M

  lago-clock:
    image: getlago/api:v1.42.0
    container_name: lago-clock
    restart: unless-stopped
    env_file:
      - ./lago.env
    command: ["./scripts/start.clock.sh"]
    depends_on:
      lago-migrate:
        condition: service_completed_successfully
      lago-db:
        condition: service_healthy
      lago-dragonfly:
        condition: service_healthy
    networks:
      - controlplane-net
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.25"
        reservations:
          memory: 128M

  lago-front:
    image: getlago/front:v1.42.0
    container_name: lago-front
    restart: unless-stopped
    env_file:
      - ./lago.env
    ports:
      - "3015:80"
    depends_on:
      lago-api:
        condition: service_healthy
    networks:
      - controlplane-net
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

networks:
  # Privat nettverk kun for Control Plane
  controlplane-net:
    name: controlplane-net
    driver: bridge

  # Felles prosjekt-nettverk (må eksistere)
  inter-plane-bus:
    external: true
    name: inter-plane-bus
    labels:
      com.docker.compose.network: "inter-plane-bus"
      com.docker.compose.project: "triodelab"

volumes:
  postgres-data:
    driver: local
  dragonfly-data:
    driver: local
  nats-data:
    driver: local

  lago_postgres_data:
    driver: local
  lago_dragonfly_data:
    driver: local
  lago_storage_data:
    driver: local
