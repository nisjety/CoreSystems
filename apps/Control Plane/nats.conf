# NATS Server Configuration — Control Plane
jetstream: true
http: "127.0.0.1:8222"
max_payload: 1MB
store_dir: /data/jetstream

# One runtime identity per service. Data subjects are authority-bounded; the
# JetStream API and inbox subjects remain transport-only capabilities required
# for stream convergence, PubAck, request/reply, and durable consumers.
authorization {
  users: [
    {
      user: "auth-core-control"
      password: $AUTH_NATS_PASSWORD
      permissions: {
        publish: [
          "auth.>", "user.>", "organization.>",
          "verevon.audit.v2.control.auth-core.>",
          "_INBOX.USER_CONTROL.>", "_INBOX.SESSION_CONTROL.>"
        ]
        subscribe: [
          "service.authenticate", "session.validate", "health.check",
          "_INBOX.AUTH_CONTROL.>"
        ]
      }
    }
    {
      user: "user-core-control"
      password: $USER_NATS_PASSWORD
      permissions: {
        publish: ["service.authenticate", "user.>", "verevon.audit.v2.control.user-core.>"]
        subscribe: ["auth.>", "organization.member.>", "_INBOX.USER_CONTROL.>"]
      }
    }
    {
      user: "org-core-control"
      password: $ORG_NATS_PASSWORD
      permissions: {
        publish: ["user.>", "session.created", "session.ended", "organization.>", "verevon.audit.v2.control.org-core.>"]
        subscribe: ["auth.>", "_INBOX.ORG_CONTROL.>"]
      }
    }
    {
      user: "billing-core-control"
      password: $BILLING_NATS_PASSWORD
      permissions: {
        publish: [
          "billing.>",
          "$JS.API.CONSUMER.INFO.CONTROL_PLANE_EVENTS.billing-core-organization-plan-changed",
          "$JS.ACK.CONTROL_PLANE_EVENTS.billing-core-organization-plan-changed.>"
        ]
        subscribe: [
          "organization.>",
          "usage.>",
          "_INBOX.BILLING_CONTROL.>",
          "_VEREVON.CONTROL.DELIVER.billing.organization-plan-changed billing-core-organization-plan-changed"
        ]
      }
    }
    {
      user: "session-core-control"
      password: $SESSION_NATS_PASSWORD
      permissions: {
        publish: ["session.validate", "_INBOX.SESSION_CONTROL.>"]
        subscribe: "_INBOX.SESSION_CONTROL.>"
      }
    }
    {
      user: "audit-core-control"
      password: $AUDIT_CONTROL_NATS_PASSWORD
      permissions: {
        publish: [
          "$JS.API.CONSUMER.INFO.VEREVON_CONTROL_OBSERVABILITY.audit-core-control-v3-audit",
          "$JS.API.CONSUMER.INFO.VEREVON_CONTROL_OBSERVABILITY.audit-core-control-v3-usage",
          "$JS.ACK.VEREVON_CONTROL_OBSERVABILITY.audit-core-control-v3-audit.>",
          "$JS.ACK.VEREVON_CONTROL_OBSERVABILITY.audit-core-control-v3-usage.>",
          "verevon.dlq.audit-core.audit",
          "verevon.dlq.audit-core.usage"
        ]
        subscribe: [
          "_INBOX.AUDIT_CONTROL.>",
          "_VEREVON.AUDIT.DELIVER.control.audit-v2 audit-core-control-v3-audit",
          "_VEREVON.AUDIT.DELIVER.control.usage-v2 audit-core-control-v3-usage"
        ]
      }
    }
    {
      user: "observability-provisioner-control"
      password: $CONTROL_NATS_PROVISIONER_PASSWORD
      permissions: {
        publish: ["$JS.API.STREAM.>", "$JS.API.CONSUMER.>"]
        subscribe: "_INBOX.PROVISIONER_CONTROL.>"
      }
    }
  ]
}
logtime: true
