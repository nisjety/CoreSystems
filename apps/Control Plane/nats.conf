# NATS Server Configuration — Control Plane
# https://docs.nats.io/running-a-nats-service/configuration

# JetStream enabled
jetstream: true

# HTTP monitoring port
http_port: 8222

# Max message payload (1MB)
max_payload: 1MB

# Store dir for JetStream (mapped to volume)
store_dir: /data/jetstream

# Token authentication. Compose injects this required value; keeping the token
# out of this tracked file prevents development credentials becoming defaults.
authorization {
  token: $NATS_TOKEN
}

# Logging
logtime: true
