# Control-Plane Prometheus scrape configuration (Phase 6 B13).
#
# Prometheus runs on controlplane-net (to reach the cores by container name) and
# inter-plane-bus (to reach the Frontend-Plane gateway). Each Go core exposes a
# promhttp /metrics server on container port 9091 (org-core's proven pattern);
# the gateway exposes /metrics on its main port 3185.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    plane: control

# Alert rules. Evaluated here, shown in the Prometheus UI; no Alertmanager or
# pager is wired yet (build plan WS01 decision D1), so an alert is visible only
# to someone looking. Mounted read-only from ./observability/rules.
rule_files:
  - /etc/prometheus/rules/*.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: org-core
    static_configs:
      - targets: ['org-core-service:9091']
        labels: { service: org-core }

  - job_name: billing-core
    static_configs:
      - targets: ['billing-core-service:9091']
        labels: { service: billing-core }

  - job_name: user-core
    static_configs:
      - targets: ['user-service:9091']
        labels: { service: user-core }

  - job_name: session-core
    static_configs:
      - targets: ['session-core-service:9091']
        labels: { service: session-core }

  - job_name: audit-core
    static_configs:
      - targets: ['audit-core-service:9091']
        labels: { service: audit-core }

  # SIEM exporter (WS06-S8). Only runs under the compose profile `siem`; the
  # target reads as down on a stack without it, and no rule alerts on `up`.
  - job_name: audit-siem-exporter
    static_configs:
      - targets: ['audit-siem-exporter:9091']
        labels: { service: audit-siem-exporter }

  # Model Plane services, reached on inter-plane-bus by their plane-unique
  # aliases (the bare name `session-core` is also a Control Plane service).
  # model-session-core serves /metrics on its health port 8081 (audit outbox
  # gauges); model-gateway serves /metrics on its main port.
  - job_name: model-session-core
    metrics_path: /metrics
    static_configs:
      - targets: ['model-session-core:8081']
        labels: { service: session-core, plane: model }

  - job_name: model-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['model-gateway:8080']
        labels: { service: model-gateway, plane: model }

  # inference-core serves /metrics on its health port 8082 (ZDR attestation review-by gauge).
  - job_name: model-inference-core
    metrics_path: /metrics
    static_configs:
      - targets: ['model-plane-inference-core-1:8082']
        labels: { service: inference-core, plane: model }

  - job_name: verevon-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['verevon-gateway-rs:3185']
        labels: { service: gateway, plane: frontend }

  # Quarry edge (Ingestion Plane, WS6.I / U48, R-13 PR 2). The edge serves /metrics
  # on a SEPARATE internal listener (:9092, exposed on the compose networks, never
  # published) and only when QUARRY_EDGE_METRICS_ENABLED=1, which defaults to 0:
  # until the owner flips it the target reads as down and no quarry_* series exist
  # (rules/quarry.rules.yml is built to stay quiet in that state). When it is on, the
  # listener requires a bearer token equal to QUARRY_EDGE_METRICS_TOKEN (>= 32 chars
  # in production). That value is read here from a mounted FILE, never inlined:
  #   * the file is mounted at /etc/prometheus/secrets/quarry_metrics_token (compose:
  #     QUARRY_METRICS_TOKEN_FILE; the default is an empty tracked placeholder, because
  #     Prometheus refuses its whole configuration when a credentials file is missing);
  #   * scripts/run-control-plane.sh mints QUARRY_EDGE_METRICS_TOKEN once into the
  #     persisted secrets store and writes the file; MIRROR the same value into
  #     Ingestion's .env.generated-secrets before turning the flag on.
  # The edge sits on inter-plane-bus, which Prometheus joins, as container `quarry-edge`.
  - job_name: quarry-edge
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/quarry_metrics_token
    static_configs:
      - targets: ['quarry-edge:9092']
        labels: { service: quarry-edge, plane: ingestion }
