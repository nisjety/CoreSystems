# Control-Plane Prometheus scrape configuration (Phase 6 B13).
#
# Prometheus runs on controlplane-net (to reach the cores by container name) and
# inter-plane-bus (to reach the Frontend-Plane gateway). Each Go core exposes a
# promhttp /metrics server on container port 9091 (org-core's proven pattern);
# the gateway exposes /metrics on its main port 3185.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    plane: control

# Alert rules. Evaluated here, shown in the Prometheus UI; no Alertmanager or
# pager is wired yet (build plan WS01 decision D1), so an alert is visible only
# to someone looking. Mounted read-only from ./observability/rules.
rule_files:
  - /etc/prometheus/rules/*.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: org-core
    static_configs:
      - targets: ['org-core-service:9091']
        labels: { service: org-core }

  - job_name: billing-core
    static_configs:
      - targets: ['billing-core-service:9091']
        labels: { service: billing-core }

  - job_name: user-core
    static_configs:
      - targets: ['user-service:9091']
        labels: { service: user-core }

  - job_name: session-core
    static_configs:
      - targets: ['session-core-service:9091']
        labels: { service: session-core }

  - job_name: audit-core
    static_configs:
      - targets: ['audit-core-service:9091']
        labels: { service: audit-core }

  # SIEM exporter (WS06-S8). Only runs under the compose profile `siem`; the
  # target reads as down on a stack without it, and no rule alerts on `up`.
  - job_name: audit-siem-exporter
    static_configs:
      - targets: ['audit-siem-exporter:9091']
        labels: { service: audit-siem-exporter }

  # Model Plane services, reached on inter-plane-bus by their plane-unique
  # aliases (the bare name `session-core` is also a Control Plane service).
  # model-session-core serves /metrics on its health port 8081 (audit outbox
  # gauges); model-gateway serves /metrics on its main port.
  - job_name: model-session-core
    metrics_path: /metrics
    static_configs:
      - targets: ['model-session-core:8081']
        labels: { service: session-core, plane: model }

  - job_name: model-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['model-gateway:8080']
        labels: { service: model-gateway, plane: model }

  - job_name: verevon-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['verevon-gateway-rs:3185']
        labels: { service: gateway, plane: frontend }
