jetstream: true
http: "127.0.0.1:8222"
max_payload: 1MB
store_dir: /data/jetstream

# Scoped migration broker for Control-produced cross-plane events. A durable
# compatibility bridge forwards these subjects to the legacy token-only Verevon
# broker while non-Control consumers are migrated independently.
authorization {
  users: [
    {
      user: "auth-core-shared"
      password: $AUTH_SHARED_NATS_PASSWORD
      permissions: {
        publish: [
          "aqencia.controlplane.user.>",
          "aqencia.controlplane.org.created",
          "aqencia.controlplane.org.member_added",
          "aqencia.controlplane.org.member_removed",
          "aqencia.controlplane.org.changed",
          "aqencia.controlplane.org.member_changed",
          "notifications.team.>"
        ]
        subscribe: "_INBOX.AUTH_SHARED.>"
      }
    }
    {
      user: "user-core-shared"
      password: $USER_SHARED_NATS_PASSWORD
      permissions: {
        publish: [
          "aqencia.controlplane.user.>",
          "aqencia.controlplane.acl.>",
          "notifications.user.>",
          "verevon.gdpr.erasure.requested"
        ]
        subscribe: "_INBOX.USER_SHARED.>"
      }
    }
    {
      user: "documents-api-gdpr"
      password: $DOCUMENTS_GDPR_NATS_PASSWORD
      permissions: {
        publish: [
          "$JS.API.CONSUMER.INFO.AQENCIA_CONTROLPLANE.documents-api-gdpr-erasure-v1",
          "$JS.ACK.AQENCIA_CONTROLPLANE.documents-api-gdpr-erasure-v1.>",
          "verevon.gdpr.erasure.dlq.documents-api",
          "verevon.gdpr.ownership.transferred",
          "$JS.API.CONSUMER.INFO.AQENCIA_CONTROLPLANE.documents-api-org-erasure",
          "$JS.ACK.AQENCIA_CONTROLPLANE.documents-api-org-erasure.>",
          "verevon.gdpr.erasure.dlq.documents-api-org-purge"
        ]
        subscribe: [
          "_INBOX.DOCUMENTS_GDPR.>",
          "_VEREVON.CONTROL.SHARED.DELIVER.data.documents-api.gdpr-erasure documents-api-gdpr-erasure-v1",
          "_VEREVON.CONTROL.SHARED.DELIVER.data.documents-api.org-erasure documents-api-org-erasure"
        ]
      }
    }
    {
      # Model Plane (Rust) session-core's GDPR erasure pull consumer. Deliberately
      # a brand-new identity, NOT a reuse of "session-core-shared" below, which
      # belongs to the unrelated Control Plane Go service (container
      # session-core-service, NATS_SHARED_USER=session-core-shared). Do not
      # consolidate these two blocks — they authenticate two different binaries.
      user: "session-core-gdpr"
      password: $SESSION_CORE_GDPR_NATS_PASSWORD
      permissions: {
        publish: [
          "$JS.API.STREAM.INFO.AQENCIA_CONTROLPLANE",
          "$JS.API.CONSUMER.INFO.AQENCIA_CONTROLPLANE.session-core-gdpr-erasure-v1",
          "$JS.API.CONSUMER.MSG.NEXT.AQENCIA_CONTROLPLANE.session-core-gdpr-erasure-v1",
          "$JS.ACK.AQENCIA_CONTROLPLANE.session-core-gdpr-erasure-v1.>"
        ]
        subscribe: "_INBOX.SESSION_CORE_GDPR.>"
      }
    }
    {
      user: "conversation-core-gdpr"
      password: $CONVERSATION_CORE_GDPR_NATS_PASSWORD
      permissions: {
        publish: [
          "$JS.API.CONSUMER.INFO.AQENCIA_CONTROLPLANE.conversation-core-org-erasure",
          "$JS.API.CONSUMER.INFO.AQENCIA_CONTROLPLANE.conversation-core-interactive-retention",
          "$JS.ACK.AQENCIA_CONTROLPLANE.conversation-core-org-erasure.>",
          "$JS.ACK.AQENCIA_CONTROLPLANE.conversation-core-interactive-retention.>"
        ]
        subscribe: [
          "_INBOX.CONVERSATION_CORE_GDPR.>",
          "_VEREVON.CONTROL.SHARED.DELIVER.application.conversation.gdpr-erasure conversation-core-org-erasure",
          "_VEREVON.CONTROL.SHARED.DELIVER.application.conversation.interactive-retention conversation-core-interactive-retention"
        ]
      }
    }
    {
      user: "quarry-control-gdpr"
      password: $QUARRY_CONTROL_GDPR_NATS_PASSWORD
      permissions: {
        publish: [
          "$JS.API.CONSUMER.INFO.AQENCIA_CONTROLPLANE.quarry-control-org-erasure",
          "$JS.ACK.AQENCIA_CONTROLPLANE.quarry-control-org-erasure.>"
        ]
        subscribe: [
          "_INBOX.QUARRY_CONTROL_GDPR.>",
          "_VEREVON.CONTROL.SHARED.DELIVER.ingestion.quarry-control.org-erasure quarry-control-org-erasure"
        ]
      }
    }
    {
      user: "notification-core-gdpr"
      password: $NOTIFICATION_CORE_GDPR_NATS_PASSWORD
      permissions: {
        publish: [
          "$JS.API.CONSUMER.INFO.AQENCIA_CONTROLPLANE.notification-core-org-deletion-pending",
          "$JS.API.CONSUMER.INFO.AQENCIA_CONTROLPLANE.notification-core-org-deletion-reminder",
          "$JS.API.CONSUMER.INFO.AQENCIA_CONTROLPLANE.notification-core-org-deletion-cancelled",
          "$JS.ACK.AQENCIA_CONTROLPLANE.notification-core-org-deletion-pending.>",
          "$JS.ACK.AQENCIA_CONTROLPLANE.notification-core-org-deletion-reminder.>",
          "$JS.ACK.AQENCIA_CONTROLPLANE.notification-core-org-deletion-cancelled.>"
        ]
        subscribe: [
          "_INBOX.NOTIFICATION_CORE_GDPR.>",
          "_VEREVON.CONTROL.SHARED.DELIVER.application.notification.org-deletion-pending notification-core-org-deletion-pending",
          "_VEREVON.CONTROL.SHARED.DELIVER.application.notification.org-deletion-reminder notification-core-org-deletion-reminder",
          "_VEREVON.CONTROL.SHARED.DELIVER.application.notification.org-deletion-cancelled notification-core-org-deletion-cancelled"
        ]
      }
    }
    {
      # Data Plane v2's index-engine-rs GDPR org-erasure pull consumer.
      user: "index-engine-gdpr"
      password: $INDEX_ENGINE_GDPR_NATS_PASSWORD
      permissions: {
        publish: [
          "$JS.API.CONSUMER.INFO.AQENCIA_CONTROLPLANE.index-engine-org-erasure",
          "$JS.API.CONSUMER.MSG.NEXT.AQENCIA_CONTROLPLANE.index-engine-org-erasure",
          "$JS.ACK.AQENCIA_CONTROLPLANE.index-engine-org-erasure.>"
        ]
        subscribe: "_INBOX.INDEX_ENGINE_GDPR.>"
      }
    }
    {
      # Data Plane v2's embedding-engine-rs GDPR org-erasure pull consumer.
      user: "embedding-engine-gdpr"
      password: $EMBEDDING_ENGINE_GDPR_NATS_PASSWORD
      permissions: {
        publish: [
          "$JS.API.CONSUMER.INFO.AQENCIA_CONTROLPLANE.embedding-engine-org-erasure",
          "$JS.API.CONSUMER.MSG.NEXT.AQENCIA_CONTROLPLANE.embedding-engine-org-erasure",
          "$JS.ACK.AQENCIA_CONTROLPLANE.embedding-engine-org-erasure.>"
        ]
        subscribe: "_INBOX.EMBEDDING_ENGINE_GDPR.>"
      }
    }
    {
      # Data Plane v2's graph-index-rs GDPR org-erasure pull consumer.
      user: "graph-index-gdpr"
      password: $GRAPH_INDEX_GDPR_NATS_PASSWORD
      permissions: {
        publish: [
          "$JS.API.CONSUMER.INFO.AQENCIA_CONTROLPLANE.graph-index-gdpr-erasure-v1",
          "$JS.API.CONSUMER.MSG.NEXT.AQENCIA_CONTROLPLANE.graph-index-gdpr-erasure-v1",
          "$JS.ACK.AQENCIA_CONTROLPLANE.graph-index-gdpr-erasure-v1.>"
        ]
        subscribe: "_INBOX.GRAPH_INDEX_GDPR.>"
      }
    }
    {
      # Data Plane v2's wiki-store-go GDPR org-erasure push/queue consumer.
      user: "wiki-store-gdpr"
      password: $WIKI_STORE_GDPR_NATS_PASSWORD
      permissions: {
        publish: [
          "$JS.API.CONSUMER.INFO.AQENCIA_CONTROLPLANE.wiki-store-org-erasure",
          "$JS.ACK.AQENCIA_CONTROLPLANE.wiki-store-org-erasure.>"
        ]
        subscribe: [
          "_INBOX.WIKI_STORE_GDPR.>",
          "_VEREVON.CONTROL.SHARED.DELIVER.data.wiki-store.org-erasure wiki-store-org-erasure"
        ]
      }
    }
    {
      # Data Plane v2's retrieval-engine-rs GDPR org-erasure pull consumer.
      user: "retrieval-engine-gdpr"
      password: $RETRIEVAL_ENGINE_GDPR_NATS_PASSWORD
      permissions: {
        publish: [
          "$JS.API.CONSUMER.INFO.AQENCIA_CONTROLPLANE.retrieval-engine-gdpr-erasure-v1",
          "$JS.API.CONSUMER.MSG.NEXT.AQENCIA_CONTROLPLANE.retrieval-engine-gdpr-erasure-v1",
          "$JS.ACK.AQENCIA_CONTROLPLANE.retrieval-engine-gdpr-erasure-v1.>"
        ]
        subscribe: "_INBOX.RETRIEVAL_ENGINE_GDPR.>"
      }
    }
    {
      # Data Plane v2's data-quality-go GDPR org-erasure push/queue consumer.
      user: "data-quality-gdpr"
      password: $DATA_QUALITY_GDPR_NATS_PASSWORD
      permissions: {
        publish: [
          "$JS.API.CONSUMER.INFO.AQENCIA_CONTROLPLANE.data-quality-org-erasure",
          "$JS.ACK.AQENCIA_CONTROLPLANE.data-quality-org-erasure.>"
        ]
        subscribe: [
          "_INBOX.DATA_QUALITY_GDPR.>",
          "_VEREVON.CONTROL.SHARED.DELIVER.data.data-quality.org-erasure data-quality-org-erasure"
        ]
      }
    }
    {
      # Data Plane v2's data-orchestrator-go GDPR org-erasure push/queue consumer.
      user: "data-orchestrator-gdpr"
      password: $DATA_ORCHESTRATOR_GDPR_NATS_PASSWORD
      permissions: {
        publish: [
          "$JS.API.CONSUMER.INFO.AQENCIA_CONTROLPLANE.data-orchestrator-org-erasure",
          "$JS.ACK.AQENCIA_CONTROLPLANE.data-orchestrator-org-erasure.>"
        ]
        subscribe: [
          "_INBOX.DATA_ORCHESTRATOR_GDPR.>",
          "_VEREVON.CONTROL.SHARED.DELIVER.data.data-orchestrator.org-erasure data-orchestrator-org-erasure"
        ]
      }
    }
    {
      # Data Plane v2's quickwit-adapter-rs GDPR org-erasure pull consumer.
      user: "quickwit-adapter-gdpr"
      password: $QUICKWIT_ADAPTER_GDPR_NATS_PASSWORD
      permissions: {
        publish: [
          "$JS.API.STREAM.INFO.AQENCIA_CONTROLPLANE",
          "$JS.API.CONSUMER.INFO.AQENCIA_CONTROLPLANE.quickwit-adapter-gdpr-erasure-v1",
          "$JS.API.CONSUMER.MSG.NEXT.AQENCIA_CONTROLPLANE.quickwit-adapter-gdpr-erasure-v1",
          "$JS.ACK.AQENCIA_CONTROLPLANE.quickwit-adapter-gdpr-erasure-v1.>"
        ]
        subscribe: "_INBOX.QUICKWIT_ADAPTER_GDPR.>"
      }
    }
    {
      # Model Plane's cost-core GDPR org-erasure push/queue consumer.
      user: "cost-core-gdpr"
      password: $COST_CORE_GDPR_NATS_PASSWORD
      permissions: {
        publish: [
          "$JS.API.CONSUMER.INFO.AQENCIA_CONTROLPLANE.cost-core-org-erasure",
          "$JS.ACK.AQENCIA_CONTROLPLANE.cost-core-org-erasure.>"
        ]
        subscribe: [
          "_INBOX.COST_CORE_GDPR.>",
          "_VEREVON.CONTROL.SHARED.DELIVER.model.cost-core.org-erasure cost-core-org-erasure"
        ]
      }
    }
    {
      user: "org-core-shared"
      password: $ORG_SHARED_NATS_PASSWORD
      permissions: {
        publish: [
          "aqencia.controlplane.org.created",
          "aqencia.controlplane.org.updated",
          "aqencia.controlplane.org.deleted",
          "aqencia.controlplane.org.member_added",
          "aqencia.controlplane.org.member_removed",
          "aqencia.controlplane.org.plan_changed",
          "aqencia.controlplane.org.interactive_retention.enabled",
          "notifications.billing.>",
          "notifications.org.>",
          "verevon.gdpr.erasure.requested",
          "verevon.org.deletion.>"
        ]
        subscribe: "_INBOX.ORG_SHARED.>"
      }
    }
    {
      user: "billing-core-shared"
      password: $BILLING_SHARED_NATS_PASSWORD
      permissions: {
        publish: ["aqencia.controlplane.billing.>", "notifications.billing.>"]
        subscribe: "_INBOX.BILLING_SHARED.>"
      }
    }
    {
      # Control Plane (Go) session-core (container session-core-service) ONLY.
      # NOT the same service as Model Plane's Rust session-core, which uses the
      # separate "session-core-gdpr" identity defined above — do not merge them.
      user: "session-core-shared"
      password: $SESSION_SHARED_NATS_PASSWORD
      permissions: {
        publish: [
          "verevon.session.>", "aqencia.reasoning.session.>",
          "verevon.agent.>", "aqencia.reasoning.run.>", "app.session.>"
        ]
        subscribe: "_INBOX.SESSION_SHARED.>"
      }
    }
    {
      user: "application-convex-control"
      password: $APPLICATION_CONVEX_CONTROL_NATS_PASSWORD
      permissions: {
        publish: [
          "$JS.API.CONSUMER.INFO.AQENCIA_CONTROLPLANE.convex-org-changed-v2",
          "$JS.API.CONSUMER.INFO.AQENCIA_CONTROLPLANE.convex-org-member-changed-v2",
          "$JS.ACK.AQENCIA_CONTROLPLANE.convex-org-changed-v2.>",
          "$JS.ACK.AQENCIA_CONTROLPLANE.convex-org-member-changed-v2.>",
          "verevon.application.dlq.convex.controlplane"
        ]
        subscribe: [
          "_INBOX.APPLICATION_CONVEX_CONTROL.>",
          "_VEREVON.CONTROL.SHARED.DELIVER.application.convex.org-changed convex-org-changed-v2",
          "_VEREVON.CONTROL.SHARED.DELIVER.application.convex.member-changed convex-org-member-changed-v2"
        ]
      }
    }
    {
      user: "control-shared-legacy-bridge"
      password: $CONTROL_SHARED_BRIDGE_PASSWORD
      permissions: {
        publish: [
          "$JS.API.CONSUMER.INFO.AQENCIA_CONTROLPLANE.control-shared-legacy-bridge",
          "$JS.ACK.AQENCIA_CONTROLPLANE.control-shared-legacy-bridge.>"
        ]
        subscribe: [
          "_INBOX.CONTROL_SHARED_BRIDGE.>",
          "_VEREVON.CONTROL.SHARED.DELIVER.legacy control-shared-legacy-bridge"
        ]
      }
    }
    {
      user: "control-shared-provisioner"
      password: $CONTROL_SHARED_NATS_PROVISIONER_PASSWORD
      permissions: {
        publish: ["$JS.API.STREAM.>", "$JS.API.CONSUMER.>"]
        subscribe: "_INBOX.PROVISIONER_SHARED.>"
      }
    }
  ]
}

logtime: true
