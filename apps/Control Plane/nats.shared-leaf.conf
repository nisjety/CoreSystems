
jetstream { domain: CONTROL_SHARED; store_dir: /data/jetstream }
leafnodes {
  remotes: [{
    url: $NATS_SHARED_LEAF_URL
    # Hub control-leaf allows only the seven public org lifecycle subjects.
    # GDPR, interactive-retention evidence, notifications and private RPC stay
    # on their existing scoped Control broker/consumer paths.
    deny_exports: ["$JS.>", "$SYS.>", "_INBOX.>", "_VEREVON.>", "verevon.gdpr.>", "verevon.audit.>", "verevon.session.>", "notifications.>", "controlplane.user.>", "controlplane.org.interactive_retention.>", "service.authenticate", "session.validate", "health.check"]
    deny_imports: ["$JS.>", "$SYS.>", "_INBOX.>", "_VEREVON.>", "verevon.gdpr.>", "verevon.audit.>", "verevon.session.>", "notifications.>", "controlplane.user.>", "controlplane.org.interactive_retention.>", "service.authenticate", "session.validate", "health.check"]
  }]
}
