# ⚠️ DEPRECATED — Data Plane v1 (Python).
# Replaced by Data Plane v2 (Rust + Go) inlined into the parent
# /Volumes/Lagring/Triodelab/CoreSystem/docker-compose.yml.
#
# Do NOT run this file alongside the parent compose — both define qdrant /
# redis / postgres-style services that would collide on host ports
# (5442 / 6345 / 6389) and on the same docker network.
#
# Boot the v2 stack from the CoreSystem root with `docker compose up -d`.
# Keep this file only for forensics / migration reference.

name: data-plane-v1-deprecated

services:
  # ─────────────────────────────────────────────────────────────
  # INFRA
  # ─────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: data-postgres
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dataplane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dataplane}
      POSTGRES_DB: ${POSTGRES_DB:-dataplane}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    expose:
      - "5432"
    networks:
      - data-net
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    shm_size: "128mb"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "effective_cache_size=256MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "log_min_messages=warning"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dataplane} -d ${POSTGRES_DB:-dataplane}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-bootstrap:
    image: postgres:16-alpine
    container_name: data-postgres-bootstrap
    restart: "no"
    init: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dataplane}
      POSTGRES_DB: ${POSTGRES_DB:-dataplane}
      PGPASSWORD: ${POSTGRES_PASSWORD:-dataplane}
    networks:
      - data-net
    volumes:
      - ./infra/postgres/init.sql:/migrations/init.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - sh
      - -ec
      - |
        until pg_isready -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"; do
          sleep 1
        done
        psql \
          -v ON_ERROR_STOP=1 \
          -h postgres \
          -U "$${POSTGRES_USER}" \
          -d "$${POSTGRES_DB}" \
          -f /migrations/init.sql

  redis:
    image: redis:7-alpine
    container_name: data-redis
    restart: unless-stopped
    init: true
    expose:
      - "6379"
    networks:
      - data-net
    volumes:
      - redis_data:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - "everysec"
      - --maxmemory
      - "96mb"
      - --maxmemory-policy
      - noeviction
      - --tcp-backlog
      - "128"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: data-qdrant
    restart: unless-stopped
    init: true
    ports:
      - "6335:6333"
      - "6336:6334"
    expose:
      - "6333"
      - "6334"
    networks:
      - data-net
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Viktig: qdrant-image mangler ofte curl/wget/bash -> enkel healthcheck
    healthcheck:
      test: ["CMD", "true"]
      interval: 10s
      timeout: 5s
      retries: 1

  # ─────────────────────────────────────────────────────────────
  # SERVICES
  # ─────────────────────────────────────────────────────────────

  documents-service:
    build:
      context: .
      dockerfile: services/documents/Dockerfile
    container_name: data-documents-service
    restart: unless-stopped
    init: true
    ports:
      - "8001:8001"
      - "50051:50051"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dataplane}:${POSTGRES_PASSWORD:-dataplane}@postgres:5432/${POSTGRES_DB:-dataplane}
      REDIS_URL: redis://redis:6379
      SERVICE_PORT: "8001"
      GRPC_PORT: "50051"
      NATS_URL: nats://nats:4222
      # Subscribe to Quarry crawl events via the shared cross-plane velion-nats JetStream
      NATS_SHARED_URL: nats://velion-nats:4222
      NATS_SHARED_TOKEN: ${VELION_NATS_TOKEN:-b0111381f6d429388a7e3e22cdc80abeb79fa8606470d3b727318b9f0d8510a7}
    env_file: ./services/documents/.env
    networks:
      - data-net
      - velion-net
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      postgres-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8001/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  knowledge-index:
    build:
      context: .
      dockerfile: services/knowledge-index/Dockerfile
    container_name: data-knowledge-index
    restart: unless-stopped
    init: true
    ports:
      - "9101:9101"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dataplane}:${POSTGRES_PASSWORD:-dataplane}@postgres:5432/${POSTGRES_DB:-dataplane}
      REDIS_URL: redis://redis:6379
      DOCUMENTS_GRPC_HOST: documents-service
      DOCUMENTS_GRPC_PORT: "50051"
      NATS_URL: nats://nats:4222
    env_file: ./services/knowledge-index/.env
    networks:
      - data-net
      - velion-net
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      postgres-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      documents-service:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/readyz', timeout=2)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  embedding-worker:
    build:
      context: .
      dockerfile: services/embedding-worker/Dockerfile
    container_name: data-embedding-worker
    restart: unless-stopped
    init: true
    ports:
      - "9102:9102"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dataplane}:${POSTGRES_PASSWORD:-dataplane}@postgres:5432/${POSTGRES_DB:-dataplane}
      REDIS_URL: redis://redis:6379
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      NATS_URL: nats://nats:4222
    env_file: ./services/embedding-worker/.env
    networks:
      - data-net
      - velion-net
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      postgres-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9102/readyz', timeout=2)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  retrieval-service:
    build:
      context: .
      dockerfile: services/retrieval/Dockerfile
    container_name: data-retrieval-service
    restart: unless-stopped
    init: true
    ports:
      - "8004:8004"
      - "50052:50052"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dataplane}:${POSTGRES_PASSWORD:-dataplane}@postgres:5432/${POSTGRES_DB:-dataplane}
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      # ── Agentic RAG ──────────────────────────────────────────────────────────
      SERVICE_PORT: "8004"
      GRPC_PORT: "50052"
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
    env_file: ./services/retrieval/.env
    networks:
      - data-net
      - velion-net
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      postgres-bootstrap:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8004/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  data-analyzer:
    build:
      context: services/data-analyzer
      dockerfile: Dockerfile
    container_name: data-analyzer
    restart: unless-stopped
    init: true
    ports:
      - "9103:9103"
    env_file: ./services/data-analyzer/.env
    environment:
      NATS_URL: nats://nats:4222
    networks:
      - data-net
      - velion-net
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9103/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # NATS — plane-level message bus (required)
  # ─────────────────────────────────────────────────────────────
  nats:
    image: nats:2-alpine
    container_name: data-nats
    restart: unless-stopped
    command: ["-m", "8222"]
    networks:
      - data-net
    volumes:
      - data-nats-data:/data
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  data-net:
    name: data-net
    driver: bridge

  velion-net:
    external: true
    name: velion-net
    labels:
      com.docker.compose.network: "velion-net"
      com.docker.compose.project: "velion"


volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  data-nats-data:
    driver: local