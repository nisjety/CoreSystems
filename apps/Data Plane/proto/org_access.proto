syntax = "proto3";

package dataplane.org_access.v1;

option go_package = "github.com/triodelab/dataplane/gen/go/org_access/v1";

// ── Messages ──────────────────────────────────────────────────────────────

message CheckOrgAccessRequest {
  string user_id = 1;
  string org_id  = 2;
}

message CheckOrgAccessResponse {
  bool   allowed  = 1;
  string role     = 2;  // "owner" | "admin" | "member" | "viewer" | custom
  string plan     = 3;  // "free" | "professional" | "enterprise"
  repeated string permissions   = 4;  // e.g. ["resources:create", "resources:read"]
  repeated string entitlements  = 5;  // e.g. ["feature.knowledge_base", "feature.sso"]
  string  org_name = 6;
  string  org_status = 7;  // "active" | "suspended" | "deleted"
}

// ── Service ───────────────────────────────────────────────────────────────

// OrgAccessService — Data Plane calls org-core to verify user membership
// and retrieve permissions, plan, and entitlements in a single RPC.
service OrgAccessService {
  rpc CheckOrgAccess(CheckOrgAccessRequest) returns (CheckOrgAccessResponse);
}
