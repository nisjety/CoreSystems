syntax = "proto3";

package dataplane.wiki.v1;

option go_package = "github.com/triodelab/dataplane/gen/go/wiki/v1";
option java_package = "com.triodelab.dataplane.wiki.v1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// ────────────────────────────────────────────────────────────────────────────
// WIKI CORE MESSAGES
// ────────────────────────────────────────────────────────────────────────────

message WikiPage {
  string page_id = 1;
  string org_id = 2;
  string workspace_id = 3;
  
  string title = 4;
  string path = 5;  // /engineering/onboarding | /policies/data-classification
  
  string current_version_id = 6;  // current_version -> WikiPageVersion.version_id
  string status = 7;  // "draft" | "published" | "deprecated"
  
  repeated string backlinks = 8;  // page_ids that reference this page
  
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  google.protobuf.Struct metadata = 11;
}

message WikiPageVersion {
  string version_id = 1;
  string page_id = 2;  // FK
  
  string content = 3;  // markdown
  repeated string source_refs = 4;  // original chunks used to synthesize this version
  
  optional string proposed_by_agent = 5;  // agent_id if created by synthesis
  optional string proposed_by_user = 6;   // user_id if created manually
  optional string approved_by = 7;  // user_id who approved synthesis
  
  string edit_reason = 8;  // "initial_synthesis" | "manual_edit" | "refresh" | "correction"
  string status = 9;  // "draft" | "approved" | "published"
  
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp published_at = 11;
  google.protobuf.Struct metadata = 12;
}

message WikiSourceLog {
  string log_id = 1;
  string page_id = 2;  // FK
  
  repeated string original_chunks = 3;  // chunk IDs or content references used as source
  string processing_model = 4;  // "claude-opus-4.5" | model used for synthesis
  string synthesis_prompt_hash = 5;  // hash of prompt used (for reproducibility)
  
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Struct metadata = 7;
}

message WikiMaintenanceLog {
  string log_id = 1;
  string page_id = 2;  // FK
  
  string issue_type = 3;  // "stale_content" | "missing_section" | "broken_reference" | "conflicting_info"
  google.protobuf.Struct details = 4;  // issue-specific metadata
  
  optional string proposed_fix = 5;  // suggested remedy
  string status = 6;  // "open" | "in_progress" | "resolved" | "ignored"
  
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp resolved_at = 8;
  google.protobuf.Struct metadata = 9;
}

// ────────────────────────────────────────────────────────────────────────────
// QUERY MESSAGES
// ────────────────────────────────────────────────────────────────────────────

message GetPageRequest {
  string page_id = 1;
  string org_id = 2;
  optional string version_id = 3;  // if not set, returns current_version
}

message GetPageResponse {
  WikiPage page = 1;
  WikiPageVersion version = 2;
}

message GetPageByPathRequest {
  string org_id = 1;
  string path = 2;
  optional string version_id = 3;
}

message GetPageByPathResponse {
  WikiPage page = 1;
  WikiPageVersion version = 2;
}

message ListPageVersionsRequest {
  string page_id = 1;
  string org_id = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ListPageVersionsResponse {
  repeated WikiPageVersion versions = 1;
  int32 total = 2;
}

message GetPageSourcesRequest {
  string page_id = 1;
  string org_id = 2;
  optional string version_id = 3;  // if not set, use current version
}

message GetPageSourcesResponse {
  WikiSourceLog source_log = 1;
}

message ListMaintenanceIssuesRequest {
  string org_id = 1;
  optional string page_id = 2;  // if set, filter to specific page
  string status = 3;  // filter: "open" | "in_progress" | "resolved" | "ignored" | empty=all
  int32 limit = 4;
  int32 offset = 5;
}

message ListMaintenanceIssuesResponse {
  repeated WikiMaintenanceLog issues = 1;
  int32 total = 2;
}

// ────────────────────────────────────────────────────────────────────────────
// CREATION & MUTATION MESSAGES
// ────────────────────────────────────────────────────────────────────────────

message CreatePageRequest {
  string org_id = 1;
  string workspace_id = 2;
  string title = 3;
  string path = 4;
  string initial_content = 5;  // markdown
}

message CreatePageResponse {
  WikiPage page = 1;
  WikiPageVersion version = 2;
}

message UpdatePageVersionRequest {
  string page_id = 1;
  string org_id = 2;
  string new_content = 3;
  string edit_reason = 4;
  optional string proposed_by_user = 5;  // user making the edit
}

message UpdatePageVersionResponse {
  WikiPageVersion new_version = 1;
}

// ────────────────────────────────────────────────────────────────────────────
// SERVICES
// ────────────────────────────────────────────────────────────────────────────

service WikiService {
  // Read operations
  rpc GetPage(GetPageRequest) returns (GetPageResponse);
  rpc GetPageByPath(GetPageByPathRequest) returns (GetPageByPathResponse);
  rpc ListPageVersions(ListPageVersionsRequest) returns (ListPageVersionsResponse);
  rpc GetPageSources(GetPageSourcesRequest) returns (GetPageSourcesResponse);
  rpc ListMaintenanceIssues(ListMaintenanceIssuesRequest) returns (ListMaintenanceIssuesResponse);
  
  // Write operations
  rpc CreatePage(CreatePageRequest) returns (CreatePageResponse);
  rpc UpdatePageVersion(UpdatePageVersionRequest) returns (UpdatePageVersionResponse);
}
