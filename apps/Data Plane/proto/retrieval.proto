syntax = "proto3";

package dataplane.retrieval.v1;

option go_package = "github.com/triodelab/dataplane/gen/go/retrieval/v1";

import "google/protobuf/struct.proto";

// ── Messages ──────────────────────────────────────────────────────────────

message RetrieveRequest {
  string org_id  = 1;
  string query   = 2;
  Filters filters = 3;
  int32   top_k  = 4;  // override default; 0 = use service default

  optional string user_id = 5;  // if set, ACL-filter results to this user's allowed documents
  optional string role    = 6;  // reserved for future role-based filtering
}

message Filters {
  repeated string document_types = 1;
  repeated string departments    = 2;
  repeated string languages      = 3;
  repeated string document_ids   = 4;  // restrict to specific documents
  string          region         = 5;
}

message Fact {
  string knowledge_id  = 1;
  string document_id   = 2;
  string text          = 3;
  float  score         = 4;
  google.protobuf.Struct metadata = 5;
}

message Source {
  string document_id = 1;
  string title       = 2;
  string source      = 3;
  string type        = 4;
}

message RetrieveResponse {
  repeated Fact   facts   = 1;
  repeated Source sources = 2;
  string          query   = 3;
  string          org_id  = 4;
}

// ── Service ───────────────────────────────────────────────────────────────

// RetrievalService — gRPC interface for AI-Core to call
// (also exposed as REST via FastAPI translation layer)
service RetrievalService {
  rpc Retrieve(RetrieveRequest) returns (RetrieveResponse);
}
