syntax = "proto3";

package dataplane.graph.v1;

option go_package = "github.com/triodelab/dataplane/gen/go/graph/v1";
option java_package = "com.triodelab.dataplane.graph.v1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// ────────────────────────────────────────────────────────────────────────────
// CORE GRAPH MESSAGES
// ────────────────────────────────────────────────────────────────────────────

message GraphEntity {
  string entity_id = 1;
  string org_id = 2;
  string type = 3;  // "person" | "organization" | "location" | "product" | "concept" | etc.
  string text = 4;  // entity text representation
  
  float confidence = 5;  // 0.0 - 1.0; from extraction model
  string provenance = 6;  // "extracted" | "inferred" | "ambiguous"
  repeated string source_refs = 7;  // [chunk_id, ...]
  
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Struct metadata = 9;  // custom attributes per entity type
}

message GraphRelationship {
  string rel_id = 1;
  string org_id = 2;
  
  string entity_a_id = 3;
  string entity_b_id = 4;
  string relation_type = 5;  // "is_part_of" | "works_for" | "located_in" | "mentions" | custom
  
  float confidence = 6;
  string provenance = 7;  // "extracted" | "inferred" | "ambiguous"
  repeated string source_refs = 8;
  
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Struct metadata = 10;
}

message GraphClaim {
  string claim_id = 1;
  string org_id = 2;
  
  string text = 3;  // natural language claim
  repeated string entity_ids = 4;  // entities referenced in claim
  
  float confidence = 5;
  string provenance = 6;  // "extracted" | "inferred"
  repeated string source_refs = 7;
  
  repeated string contradicted_by_claim_ids = 8;  // claims that contradict this one
  string status = 9;  // "active" | "disputed" | "resolved"
  
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Struct metadata = 11;
}

// ────────────────────────────────────────────────────────────────────────────
// QUERY MESSAGES
// ────────────────────────────────────────────────────────────────────────────

message GetEntityRequest {
  string entity_id = 1;
  string org_id = 2;
}

message GetEntityResponse {
  GraphEntity entity = 1;
}

message ListEntitiesByTypeRequest {
  string org_id = 1;
  string entity_type = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ListEntitiesByTypeResponse {
  repeated GraphEntity entities = 1;
  int32 total = 2;
}

message GetRelationshipsRequest {
  string org_id = 1;
  string entity_id = 2;  // find all relationships involving this entity
  string relation_type = 3;  // optional filter
}

message GetRelationshipsResponse {
  repeated GraphRelationship relationships = 1;
}

message GetClaimsRequest {
  string org_id = 1;
  string entity_id = 2;  // find claims mentioning this entity
  string status = 3;  // optional filter: "active" | "disputed" | "resolved"
}

message GetClaimsResponse {
  repeated GraphClaim claims = 1;
}

// ────────────────────────────────────────────────────────────────────────────
// GRAPH EXPANSION FOR RETRIEVAL
// ────────────────────────────────────────────────────────────────────────────

message GraphExpansionRequest {
  string org_id = 1;
  repeated string entity_ids = 2;  // entities mentioned in retrieval results
  int32 max_hops = 3;  // expand up to N relationship hops (default 2)
  int32 max_entities = 4;  // cap on total entities returned
}

message ExpandedGraph {
  repeated GraphEntity entities = 1;
  repeated GraphRelationship relationships = 2;
  repeated GraphClaim claims = 3;
}

message GraphExpansionResponse {
  ExpandedGraph graph = 1;
  int32 hops_traversed = 2;
  int32 new_entities_found = 3;
}

// ────────────────────────────────────────────────────────────────────────────
// SERVICES
// ────────────────────────────────────────────────────────────────────────────

service GraphService {
  // Entity operations
  rpc GetEntity(GetEntityRequest) returns (GetEntityResponse);
  rpc ListEntitiesByType(ListEntitiesByTypeRequest) returns (ListEntitiesByTypeResponse);
  
  // Relationship operations
  rpc GetRelationships(GetRelationshipsRequest) returns (GetRelationshipsResponse);
  
  // Claim operations
  rpc GetClaims(GetClaimsRequest) returns (GetClaimsResponse);
  
  // Graph expansion for enhanced retrieval
  rpc ExpandGraph(GraphExpansionRequest) returns (GraphExpansionResponse);
}
