syntax = "proto3";

package dataplane.documents.v1;

option go_package = "github.com/triodelab/dataplane/gen/go/documents/v1";
option java_package = "com.triodelab.dataplane.documents.v1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// ── Messages ──────────────────────────────────────────────────────────────

message Document {
  string document_id  = 1;
  string org_id       = 2;
  string source       = 3;   // "sharepoint" | "web" | "pdf" | "notion" | etc.
  string type         = 4;   // "policy" | "invoice" | "handbook" | etc.
  string title        = 5;
  string content      = 6;
  string status       = 7;   // "pending" | "processing" | "indexed" | "failed"
  google.protobuf.Struct metadata = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message GetDocumentRequest {
  string document_id = 1;
  string org_id      = 2;   // used for authorization
}

message GetDocumentResponse {
  Document document = 1;
}

message ListDocumentsRequest {
  string org_id      = 1;
  string type        = 2;   // optional filter
  string status      = 3;   // optional filter
  int32  page_size   = 4;
  string page_token  = 5;
}

message ListDocumentsResponse {
  repeated Document documents = 1;
  string next_page_token       = 2;
}

message DeleteDocumentRequest {
  string document_id = 1;
  string org_id      = 2;
}

message DeleteDocumentResponse {
  bool success = 1;
}

// ── Service ───────────────────────────────────────────────────────────────

service DocumentService {
  // Used by Knowledge Index worker to fetch full document content
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);

  // Used by Retrieval pipeline for metadata enrichment on results
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);

  // Used by Knowledge Index / Embedding Worker to update status
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);
}
