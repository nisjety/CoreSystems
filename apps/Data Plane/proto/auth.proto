syntax = "proto3";

package dataplane.auth.v1;

option go_package = "github.com/triodelab/dataplane/gen/go/auth/v1";

import "google/protobuf/timestamp.proto";

// ── Messages ──────────────────────────────────────────────────────────────

message ValidateTokenRequest {
  string token = 1;  // Bearer token from Authorization header
}

message ValidateTokenResponse {
  bool   valid       = 1;
  string user_id     = 2;
  string org_id      = 3;   // active organisation from session context
  string email       = 4;
  string name        = 5;
  string role        = 6;   // global role: "admin" | "user"
  string session_id  = 7;
  repeated string permissions = 8;  // derived from org membership
  google.protobuf.Timestamp expires_at = 9;
}

// ── Service ───────────────────────────────────────────────────────────────

// TokenValidationService — lightweight RPC for Data Plane to validate
// Bearer tokens against auth-core. Called on every authenticated request
// (with Redis caching on the Data Plane side).
service TokenValidationService {
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
}
