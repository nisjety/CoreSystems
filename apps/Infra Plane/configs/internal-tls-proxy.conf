# TLS termination for INTERNAL plane-to-plane calls on inter-plane-bus.
#
# user-core and conversation-core serve plain HTTP and have no TLS listener of
# their own. The governed agent ticket-action lane refuses plaintext to any host
# that is not an IP loopback (execution-core's ticket_tools.rs resolves the host
# as an IP address, so a Docker service name can never qualify), so those two
# services are unreachable by that lane without a terminating proxy.
#
# This is deliberately NOT the edge. traefik/nginx on coresystem-edge front
# public traffic; this listener is reachable only from inter-plane-bus and
# speaks to nothing outside it.

worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 256;
}

http {
  access_log off;

  # Client bodies here are decision requests and ticket operations, not uploads.
  client_max_body_size 1m;
  proxy_http_version 1.1;

  # Service identity and delegation travel in headers (X-Service-Id,
  # X-Service-Token). nginx forwards hyphenated headers as-is; it silently DROPS
  # underscored ones, which is why every header in this lane uses hyphens.
  proxy_pass_request_headers on;

  proxy_connect_timeout 5s;
  proxy_send_timeout    30s;
  proxy_read_timeout    30s;

  ssl_certificate     /etc/internal-tls/server.crt;
  ssl_certificate_key /etc/internal-tls/server.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:internal:1m;

  # Default server: a TLS handshake that matches no known name gets a flat
  # refusal rather than being silently routed to whichever block is first.
  server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;
    return 421;
  }

  server {
    listen 8443 ssl;
    http2 on;
    server_name user-core-tls;

    location / {
      # Host is rewritten to the upstream's own service name: the upstream never
      # needs to know it was reached through a proxy, and nothing downstream can
      # be confused by a hostname that only exists on this listener.
      proxy_set_header Host user-core;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://user-core:3012;
    }
  }

  server {
    listen 8443 ssl;
    http2 on;
    server_name conversation-core-tls;

    location / {
      proxy_set_header Host conversation-core-go;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://conversation-core-go:3160;
    }
  }
}
