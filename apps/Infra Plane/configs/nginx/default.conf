server {
    listen 8080;
    # Traefik has already matched the hostname before proxying here, so this
    # stays a catch-all rather than duplicating the Host() rules. Naming the
    # domains explicitly first documents the intended vhosts and keeps the
    # default_server behaviour for local 127.0.0.1 access.
    server_name verevon.no www.verevon.no verevon.com www.verevon.com _;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex" always;

    location / {
        try_files $uri $uri/ /index.html =404;
    }

    location ~ /\. {
        deny all;
    }
}
