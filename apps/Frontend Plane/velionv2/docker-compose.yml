name: frontend-plane-velionv2

# Frontend Plane: velion v2.
# Mirrors the velion v1 dev compose minus the unused planner / Affine env vars.
# The host source tree is bind-mounted so Next.js's file watcher picks up edits.

services:
  nats:
    image: nats:2-alpine
    container_name: velion-nats2
    command: ["-js", "-m", "8222", "-sd", "/data"]
    volumes:
      - velion-nats-data:/data
    networks:
      - inter-plane-bus
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: velionv2-frontend
    ports:
      - "3000:3000"
    env_file:
      - path: ../../Control Plane/.env
        required: false
      - path: .env
        required: false
    environment:
      CORE_ROOT_OVERRIDE: /Volumes/Lagring/Triodelab/CoreSystem
      NODE_ENV: development
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # In normal parity work we already have the shared plane services up, so
      # the v2 frontend should start immediately instead of rebuilding other
      # stacks before Next.js can serve. Set `VELION_SKIP_BOOTSTRAP=0` to force
      # the old bootstrap flow when you explicitly want it.
      VELION_SKIP_BOOTSTRAP: "${VELION_SKIP_BOOTSTRAP:-1}"
      VELION_NATS_URL: nats://velion-nats:4222
      CONTROL_PLANE_AUTH_URL: http://auth-core:3011
      AUTH_CORE_URL: http://auth-core:3011
      AUTH_CORE_PUBLIC_URL: http://localhost:3011
      USER_CORE_URL: http://user-core:3012
      ORG_CORE_URL: http://org-core:8080
      BILLING_CORE_URL: http://billing-core:3014
      SESSION_CORE_URL: http://session-core:3017
      INTEGRATION_INTERNAL_API_KEY: ${INTEGRATION_INTERNAL_API_KEY:-dev-super-secret-internal-api-key}
      INTEGRATION_CORE_URL: http://integration-api:3026
      GRAPH_INDEX_URL: http://dpv2-graph-index:9203
      DATA_PLANE_DOCUMENTS_URL: http://dpv2-documents-api:8010
      DATA_PLANE_MINIO_URL: http://minio:9000
      MODEL_PLANE_URL: http://model-gateway:8080
      MODEL_PLANE_AI_URL: http://model-gateway:8080
      NOTIFICATION_CORE_URL: http://notification-core:3140
      INFORMATION_CORE_URL: http://information-core:3190
      QUARRY_EDGE_URL: http://quarry-edge:8082
      QUARRY_CONTROL_URL: http://quarry-control:8081
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_AUTH_BASE_URL: http://localhost:3000
      # Convex (Application Plane convex-core). Server-side BFF routes reach the
      # self-hosted backend in-network via `convex-backend:3210` (shared
      # inter-plane-bus); the browser real-time client uses the host-published
      # port. CONVEX_INTERNAL_SERVICE_KEY must match the convex-core deployment
      # env (it gates the search-history mutations via assertServiceKey).
      CONVEX_API_URL: ${CONVEX_API_URL:-http://convex-backend:3210}
      CONVEX_INTERNAL_SERVICE_KEY: ${CONVEX_INTERNAL_SERVICE_KEY:-change-me-internal-service-secret}
      NEXT_PUBLIC_CONVEX_URL: ${NEXT_PUBLIC_CONVEX_URL:-http://localhost:3210}
    command:
      [
        "sh",
        "-lc",
        "set -e; if [ \"$${VELION_SKIP_BOOTSTRAP:-0}\" != \"1\" ]; then \"$${CORE_ROOT_OVERRIDE}/apps/Frontend Plane/velionv2/build-velion-services.sh\" --compose-bootstrap; fi; if [ ! -x node_modules/.bin/next ]; then mkdir -p node_modules && cp -R /opt/velionv2-deps/node_modules/. node_modules/ 2>/dev/null || true; fi; pnpm install --frozen-lockfile --prefer-offline --loglevel=error; exec pnpm dev --hostname 0.0.0.0 --port \"$${PORT:-3000}\"",
      ]
    volumes:
      - /Volumes/Lagring/Triodelab/CoreSystem:/Volumes/Lagring/Triodelab/CoreSystem
      - /var/run/docker.sock:/var/run/docker.sock
      - ./src:/app/src
      - ./public:/app/public
      # NOTE: package.json + pnpm-lock.yaml are deliberately NOT bind-mounted.
      # They are baked into the image (Dockerfile.dev) alongside the matching
      # node_modules, so they stay perfectly consistent. Single-file bind mounts
      # of these caused Docker Desktop's virtiofs layer to pin a stale inode
      # after a host rewrite (git checkout / editor atomic-rename), which fed a
      # CORRUPT package.json to tailwind/postcss (CssSyntaxError at EOF) even
      # though `docker exec cat` showed the valid file. To change dependencies,
      # rebuild the image: `docker compose -f docker-compose.yml build frontend`.
      - ./next.config.ts:/app/next.config.ts:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./next-env.d.ts:/app/next-env.d.ts
      - ./postcss.config.mjs:/app/postcss.config.mjs:ro
      - ./eslint.config.mjs:/app/eslint.config.mjs:ro
      - velionv2_node_modules:/app/node_modules
      # Persist the Next/Turbopack build cache across restarts. Previously a
      # 1 GiB tmpfs that was wiped on every restart -> every route cold-recompiled
      # (3-7s each), saturating the dev server and causing ERR_CONNECTION_RESET +
      # dropped HMR sockets. A named volume keeps the cache warm and removes the cap.
      - velionv2_next_cache:/app/.next
    networks:
      - inter-plane-bus
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --timeout=5 --tries=1 -O /dev/null http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 3600s

networks:
  inter-plane-bus:
    name: inter-plane-bus
    external: true

volumes:
  velionv2_node_modules:
  velionv2_next_cache:
  velion-nats-data:
