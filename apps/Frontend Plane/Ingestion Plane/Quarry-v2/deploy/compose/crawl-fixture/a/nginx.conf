# TEST-ONLY fixture server for the crawl e2e (WS14.S1). Mounted by
# apps/Ingestion Plane/docker-compose.crawl-fixture.yml. Never used by a
# production compose file. Access log: one line per request, with the
# millisecond time and the user agent, so the harness can count fetches.
worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    log_format fixture '$msec $remote_addr "$request" $status $body_bytes_sent "$http_user_agent"';
    access_log /dev/stdout fixture;

    include /etc/nginx/mime.types;
    default_type text/plain;
    sendfile on;
    server_tokens off;

    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;

        # This file sits in the served directory. It is not part of the site.
        location = /nginx.conf {
            return 404;
        }

        # Extensionless links (/docs/a) map to the .html files beside them.
        location / {
            try_files $uri $uri.html $uri/ =404;
        }
    }
}
