<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Secrets lab (Q10)</title></head>
<body>
<!-- Q10 fixture for WS12.S1 (see ax-password-probe.mjs). The password value is filled in by the
     probe script at run time, never stored here. -->
<label for="pw">Password</label>
<input id="pw" type="password">
<label for="pw2">New password</label>
<input id="pw2" type="password">
<label for="toggle-pw">Show password target</label>
<input id="toggle-pw" type="password" autocomplete="current-password">
<button id="toggle" type="button" onclick="const f=document.getElementById('toggle-pw'); f.type = f.type === 'password' ? 'text' : 'password';">Show</button>
<label for="cc">Card number</label>
<input id="cc" autocomplete="cc-number" value="4111111111111111">
<label for="tel">Phone</label>
<input id="tel" type="tel" value="+4799999999">
<label for="otp">Verification code</label>
<input id="otp" autocomplete="one-time-code">
<label for="plain">Visible</label>
<input id="plain" value="visible-text">
</body>
</html>
