name: frontend-plane-velionv3

# Frontend Plane: velion v3.
# This stack now owns the v3 SPA, its Rust gateway, and the shared Velion NATS
# bus used across planes. The browser talks to the same origin and nginx
# reverse-proxies `/api` to `velion-gateway-rs` over the shared inter-plane
# network.

services:
  nats:
    image: nats:2-alpine
    container_name: velion-nats
    restart: unless-stopped
    command: ["-js", "-m", "8222", "-sd", "/data"]
    networks:
      - inter-plane-bus
    volumes:
      - velion-nats-data:/data
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  gateway:
    build:
      context: ./apps/gateway
      dockerfile: Dockerfile
    container_name: velion-gateway-rs
    restart: unless-stopped
    init: true
    environment:
      PORT: 3185
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-internal-service-secret}
      AUTH_CORE_URL: ${AUTH_CORE_URL:-http://auth-core:3011}
      USER_CORE_URL: ${USER_CORE_URL:-http://user-core:3012}
      ORG_CORE_URL: ${ORG_CORE_URL:-http://org-core:8080}
      SESSION_CORE_URL: ${SESSION_CORE_URL:-http://session-core:3017}
      BILLING_CORE_URL: ${BILLING_CORE_URL:-http://billing-core:3014}
      INTEGRATION_CORE_URL: ${INTEGRATION_CORE_URL:-http://integration-api:3026}
      NOTIFICATION_CORE_URL: ${NOTIFICATION_CORE_URL:-http://notification-core:3140}
      INFORMATION_CORE_URL: ${INFORMATION_CORE_URL:-http://information-core:3190}
      CONVERSATION_CORE_URL: ${CONVERSATION_CORE_URL:-http://conversation-core-go:3160}
      SOCIAL_CORE_URL: ${SOCIAL_CORE_URL:-http://social-core:3162}
      GRAPH_INDEX_URL: ${GRAPH_INDEX_URL:-http://dpv2-graph-index:9203}
      DOCUMENTS_API_URL: ${DOCUMENTS_API_URL:-http://dpv2-documents-api:8010}
      WIKI_STORE_URL: ${WIKI_STORE_URL:-http://dpv2-wiki-store:8011}
      RETRIEVAL_ENGINE_URL: ${RETRIEVAL_ENGINE_URL:-http://dpv2-retrieval-engine:8004}
      # Knowledge-workspace diagnostics + finspo storage analytics upstreams.
      # embedding-engine, quickwit-adapter and qdrant ride inter-plane-bus; minio
      # is dpv2-net-only so MinIO health is derived from quickwit's s3:// index URIs.
      EMBEDDING_ENGINE_URL: ${EMBEDDING_ENGINE_URL:-http://dpv2-embedding-engine:9202}
      QUICKWIT_ADAPTER_URL: ${QUICKWIT_ADAPTER_URL:-http://dpv2-quickwit-adapter:9204}
      QDRANT_URL: ${QDRANT_URL:-http://dpv2-qdrant:6333}
      QUICKWIT_URL: ${QUICKWIT_URL:-http://dpv2-quickwit:7280}
      FINSPO_CORE_URL: ${FINSPO_CORE_URL:-http://finspo-api:3130}
      QUARRY_EDGE_URL: ${QUARRY_EDGE_URL:-http://quarry-edge:8082}
      QUARRY_CONTROL_URL: ${QUARRY_CONTROL_URL:-http://quarry-control:8081}
      # Result cache (web search + scrape previews, 4h TTL). dpv2-dragonfly is the
      # only Dragonfly on inter-plane-bus. Optional + degrade-safe: if unset or
      # unreachable the gateway simply runs without caching.
      GATEWAY_CACHE_REDIS_URL: ${GATEWAY_CACHE_REDIS_URL:-redis://dpv2-dragonfly:6379}
      # imports service is reachable as "imports-api" on inter-plane-bus (the
      # gateway default "imports-core" has no alias here → connection refused).
      IMPORTS_API_URL: ${IMPORTS_API_URL:-http://imports-api:3025}
      MODEL_GATEWAY_URL: ${MODEL_GATEWAY_URL:-http://model-gateway:8080}
      MODEL_PLANE_RECOMMEND_URL: ${MODEL_PLANE_RECOMMEND_URL:-http://model-gateway:8080/v1/recommend/plan}
      # Search verticals: SearXNG (videos) + autocomplete-core (typeahead). Web/images/answer
      # ride QUARRY_EDGE_URL above. Suggestions stay empty until AUTOCOMPLETE_INTERNAL_TOKEN is set.
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      AUTOCOMPLETE_CORE_URL: ${AUTOCOMPLETE_CORE_URL:-http://autocomplete-core:3219}
      AUTOCOMPLETE_INTERNAL_TOKEN: ${AUTOCOMPLETE_INTERNAL_TOKEN:-}
      # Stealth/proxy escalation for bot-walled sites (e.g. elkjop.no → 429). When a
      # basic render is blocked, scrape-preview retries through a managed scraping API
      # with residential proxies + anti-bot bypass. Unset ⇒ disabled (clear error).
      # FREE/default: SCRAPE_ENHANCED_PROVIDER=scrapfly + a Scrapfly key (1000 free credits).
      # BEST: SCRAPE_ENHANCED_PROVIDER=brightdata + Bright Data API token + SCRAPE_ENHANCED_ZONE.
      SCRAPE_ENHANCED_PROVIDER: ${SCRAPE_ENHANCED_PROVIDER:-}
      SCRAPE_ENHANCED_API_KEY: ${SCRAPE_ENHANCED_API_KEY:-}
      SCRAPE_ENHANCED_ZONE: ${SCRAPE_ENHANCED_ZONE:-}
      SCRAPE_ENHANCED_COUNTRY: ${SCRAPE_ENHANCED_COUNTRY:-no}
      ALLOW_DEV_AUTH_BYPASS: ${ALLOW_DEV_AUTH_BYPASS:-1}
      RUST_LOG: ${RUST_LOG:-info}
      VELION_ALLOWED_ORIGINS: ${VELION_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5199,http://127.0.0.1:5199,http://localhost:3186,http://127.0.0.1:3186,http://localhost:3187,http://127.0.0.1:3187}
    ports:
      - "3185:3185"
    networks:
      - inter-plane-bus
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: velionv3
    restart: unless-stopped
    init: true
    ports:
      - "${VELIONV3_HOST_PORT:-5173}:5173"
    networks:
      - inter-plane-bus
    depends_on:
      gateway:
        condition: service_started
    volumes:
      # Mount entire app directory for hot reload
      - .:/app
      # Exclude node_modules from bind mount to avoid permission issues
      - /app/node_modules
      # Exclude .next cache
      - /app/.next
      # Exclude dist build output
      - /app/dist
    environment:
      # Enable Vite HMR (Hot Module Replacement)
      VITE_HMR_HOST: localhost
      VITE_HMR_PORT: 5173
      VITE_HMR_PROTOCOL: ws
      # Server-only proxy target for Vite's /api + /health forwarding. Must be the
      # gateway's compose service name in-container (127.0.0.1 only works for
      # host-run `pnpm dev`). NOT VITE_-prefixed, so it stays out of the client
      # bundle — the browser keeps calling same-origin /api (first-party cookie).
      GATEWAY_PROXY_TARGET: ${GATEWAY_PROXY_TARGET:-http://velion-gateway-rs:3185}
      VITE_ALLOW_DEV_AUTH_BYPASS: ${VITE_ALLOW_DEV_AUTH_BYPASS:-true}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:5173 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  velion-nats-data:
    name: velion-nats-data
    driver: local

networks:
  inter-plane-bus:
    external: true
    name: inter-plane-bus
