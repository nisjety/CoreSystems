server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin BFF: reverse-proxy the gateway so the browser only ever talks
    # to this origin and Better Auth's session cookie stays first-party.
    # Docker's embedded DNS (127.0.0.11) + a variable upstream forces runtime
    # resolution so nginx survives gateway restarts (new container IP).
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── Security response headers ───────────────────────────────────────────
    # `always` so they are emitted on error responses (4xx/5xx) too. nginx does
    # NOT inherit server-level add_header into a location that defines its own
    # add_header, so the two cache locations below RE-EMIT these — keep in sync.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    # HSTS: only meaningful over HTTPS. TLS is terminated by an upstream proxy
    # (this container listens on :80), so a bare add_header here would tag plain
    # HTTP too. Guard on the forwarded scheme so it is sent only on real HTTPS.
    set $hsts "";
    if ($http_x_forwarded_proto = "https") { set $hsts "max-age=31536000; includeSubDomains"; }
    add_header Strict-Transport-Security $hsts always;
    # CSP — shipped as REPORT-ONLY first: this build could not be load-tested
    # live in-session, so Report-Only guarantees it cannot break the SPA while
    # violations are observed. The policy itself is already SPA-correct:
    #   style-src + font-src whitelist Google Fonts (global.css @import Geist),
    #   img-src allows https:/data:/blob: (favicon proxy + canvas screenshots),
    #   media-src blob: (voice-note recording), script-src 'self' (no inline JS,
    #   no eval). To ENFORCE, rename the header to `Content-Security-Policy`
    #   after confirming zero violations in the browser console / report sink.
    set $csp "default-src 'self'; connect-src 'self' https:; img-src 'self' data: https: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
    add_header Content-Security-Policy-Report-Only $csp always;
    # ────────────────────────────────────────────────────────────────────────

    location /api/ {
        set $velion_gateway http://velion-gateway-rs:3185;
        proxy_pass $velion_gateway$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
    }

    location = /health {
        set $velion_gateway_h http://velion-gateway-rs:3185;
        proxy_pass $velion_gateway_h/health;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Cache immutable hashed assets indefinitely
    location ~* \.(js|css|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-emit security headers: this location's own add_header otherwise
        # cancels inheritance of the server-level ones (keep in sync above).
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Cache images/icons for a week
    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
        # Re-emit security headers (see note above; keep in sync with server level).
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # SPA fallback — all other paths return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
