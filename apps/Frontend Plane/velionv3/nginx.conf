server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin BFF: reverse-proxy the gateway so the browser only ever talks
    # to this origin and Better Auth's session cookie stays first-party.
    # Docker's embedded DNS (127.0.0.11) + a variable upstream forces runtime
    # resolution so nginx survives gateway restarts (new container IP).
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /api/ {
        set $velion_gateway http://velion-gateway-rs:3185;
        proxy_pass $velion_gateway$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
    }

    location = /health {
        set $velion_gateway_h http://velion-gateway-rs:3185;
        proxy_pass $velion_gateway_h/health;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Cache immutable hashed assets indefinitely
    location ~* \.(js|css|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cache images/icons for a week
    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback — all other paths return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
