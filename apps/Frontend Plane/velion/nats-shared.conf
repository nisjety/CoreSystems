# =============================================================================
# verevon-nats — Verevon frontend-plane cross-plane NATS for the Aqencia project
#
# Lives in apps/frontend-plane/verevon/docker-compose.yml on verevon-net.
# All planes connect here for cross-plane events ONLY.
# Internal (intra-plane) events stay on each plane's own NATS.
#
# This broker now actively enforces token auth. Its token must match the
# VEREVON_NATS_TOKEN value configured in the Control, Application, Data,
# Ingestion, and Reasoning plane env files.
#
# Subject convention:
#   aqencia.<plane>.<entity>.<verb>
#
#   aqencia.auth.user.signed_in
#   aqencia.auth.org.created
#   aqencia.ingestion.document.crawled
#   aqencia.ingestion.m365.connected
#   aqencia.data.document.indexed
#   aqencia.data.collection.ready
#   aqencia.reasoning.insight.generated
# =============================================================================

# Listening port
port: 4222

# HTTP monitoring
http_port: 8222

# Max message payload (cross-plane events should be small — metadata only, not document content)
max_payload: 1MB

# Simple token-based auth shared by all planes
authorization {
  token: $VEREVON_NATS_TOKEN
}

# JetStream — persistent streams for reliable cross-plane delivery
jetstream {
  store_dir: /data
  max_mem_store: 256MB
  max_file_store: 2GB
}
