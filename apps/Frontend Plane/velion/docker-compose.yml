name: frontend-plane-verevon
# Frontend Plane: Verevon application
# This compose file is the current application entrypoint, not the future
# Triodelab marketing site. Verevon consumes the shared application-level NATS
# bus provisioned by the shared-infra compose.

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      HOSTNAME: "0.0.0.0"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # W4-3 / U2-5 (ui-ux-verevon-gap.md §13 + §10): dev opt-in. When set,
      # `getModelPlaneTokenFromSession` falls back to the literal `dev-bypass`
      # bearer (accepted by the gateway when MODEL_GATEWAY_AUTH_DEV_BYPASS=1)
      # for callers that don't carry a Better Auth session cookie — useful
      # for curl smokes, cron-style internal tasks, and the verevon frontend
      # in dev when the user isn't logged in yet. Production MUST leave this
      # unset so every gateway call mints a real JWT against auth-core.
      MODEL_PLANE_USE_DEV_BYPASS: "1"
    command:
      [
        "sh",
        "-lc",
        "if [ ! -x node_modules/.bin/next ]; then mkdir -p node_modules && cp -R /opt/agencia-deps/node_modules/. node_modules/ 2>/dev/null || true; fi; if [ ! -x node_modules/.bin/next ]; then pnpm install --frozen-lockfile || pnpm install; fi; pnpm dev --hostname 0.0.0.0",
      ]
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./package.json:/app/package.json:ro
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ./next.config.ts:/app/next.config.ts:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./next-env.d.ts:/app/next-env.d.ts
      - ./postcss.config.mjs:/app/postcss.config.mjs:ro
      - ./tailwind.config.ts:/app/tailwind.config.ts:ro
      - ./components.json:/app/components.json:ro
      - ./instrumentation.ts:/app/instrumentation.ts:ro
      - ./scripts:/app/scripts:ro
      - ./.env:/app/.env:ro
      - agencia_node_modules:/app/node_modules
    networks:
      - inter-plane-bus
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --timeout=5 --tries=1 -O /dev/null http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 120s

  nats:
    image: nats:2-alpine
    container_name: verevon-nats
    restart: unless-stopped
    command: ["-js", "-m", "8222", "-sd", "/data"]
    networks:
      - inter-plane-bus
    volumes:
      - verevon-nats-data:/data
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  inter-plane-bus:
    name: inter-plane-bus
    external: true

volumes:
  agencia_node_modules:
  verevon-nats-data:
    driver: local
