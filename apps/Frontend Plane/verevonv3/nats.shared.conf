# Internal cross-plane event hub. Private plane queues remain authoritative.
server_name: verevon-shared
http: "127.0.0.1:8222"
max_payload: 1MB
jetstream {
  domain: VEREVON
  store_dir: /data
  max_memory_store: 16MB
  max_file_store: 1GB
}

# The preserved development credential is a scoped client password, no longer
# a universal broker token. Never give it to a leaf or a browser.
PUBLIC_EVENTS = [
  "controlplane.org.created", "controlplane.org.updated",
  "controlplane.org.deleted", "controlplane.org.changed",
  "controlplane.org.member_added", "controlplane.org.member_removed",
  "controlplane.org.member_changed", "quarry.events.>",
  "verevon.ingestion.integration.>", "verevon.studio.events.>", "verevon.frontend.events.>"
]
PRIVATE_SUBJECTS = [
  "$JS.>", "$SYS.>", "$KV.>", "$OBJ.>", "_INBOX.>", "_VEREVON.>",
  "verevon.gdpr.>", "verevon.audit.>", "verevon.application.social.>",
  "service.authenticate", "session.validate", "health.check"
]
leafnodes {
  # Docker-internal only. Neither the client nor leaf port is host-published.
  listen: "0.0.0.0:7422"
}
authorization {
  users: [
      {
        user: "verevon-events"
        password: $VEREVON_NATS_TOKEN
        allowed_connection_types: [STANDARD]
        permissions: {
          publish: { allow: ["verevon.frontend.events.>"], deny: $PRIVATE_SUBJECTS }
          subscribe: { allow: $PUBLIC_EVENTS, deny: $PRIVATE_SUBJECTS }
        }
      }
      {
        user: "studio-leaf"
        password: $NATS_STUDIO_LEAF_PASSWORD
        allowed_connection_types: [LEAFNODE]
        permissions: {
          publish: { allow: ["verevon.studio.events.>"], deny: $PRIVATE_SUBJECTS }
          subscribe: { allow: $PUBLIC_EVENTS, deny: $PRIVATE_SUBJECTS }
        }
      }
      {
        user: "control-leaf"
        password: $NATS_CONTROL_LEAF_PASSWORD
        allowed_connection_types: [LEAFNODE]
        permissions: {
          publish: {
            allow: [
              "controlplane.org.created", "controlplane.org.updated",
              "controlplane.org.deleted", "controlplane.org.changed",
              "controlplane.org.member_added", "controlplane.org.member_removed",
              "controlplane.org.member_changed"
            ]
            deny: $PRIVATE_SUBJECTS
          }
          subscribe: { allow: $PUBLIC_EVENTS, deny: $PRIVATE_SUBJECTS }
        }
      }
      {
        user: "ingestion-leaf"
        password: $NATS_INGESTION_LEAF_PASSWORD
        allowed_connection_types: [LEAFNODE]
        permissions: {
          publish: { allow: ["quarry.events.>", "verevon.ingestion.integration.>"], deny: $PRIVATE_SUBJECTS }
          subscribe: { allow: $PUBLIC_EVENTS, deny: $PRIVATE_SUBJECTS }
        }
      }
  ]
}
