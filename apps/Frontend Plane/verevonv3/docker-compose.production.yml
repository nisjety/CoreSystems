# Production override for the canonical Verevon v3 frontend stack.
# Usage: docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --build
# Docker Compose v2.24.4+ is required for !reset.
x-build-metadata-required:
    SOURCE_REVISION: ${SOURCE_REVISION:?SOURCE_REVISION is required}
    BUILD_DATE: ${BUILD_DATE:?BUILD_DATE is required}

services:
    gateway:
        ports: !reset []
        environment:
            APP_ENV: production
            CONTROL_PLANE_ENFORCEMENT: strict
            ALLOW_DEV_AUTH_BYPASS: "0"
            ALLOW_INSECURE_DEV_DEFAULTS: "0"
            # V3-bff-4-rel2: the base compose passes these two through from the host env. Pinned on here so a
            # host value of off cannot silence the ZDR sensitive-field log filter or the per-class rate limits.
            GATEWAY_ZDR_LOG_FILTER: "on"
            GATEWAY_RATE_CLASSES: "on"
            SPACE_DENIALS_TYPED: "false"
            SPACE_POLICY_ADMIN_API: "false"
            SPACE_MEMBERSHIP_WRITER_API: "false"
            SPACE_REALTIME_STREAM: "false"
            SPACE_HUMAN_POSTS_API: "false"
            SPACE_THREAD_PANE_UI: "false"
            SPACE_SEND_IDEMPOTENCY_API: "false"
            SPACE_CONNECTIVITY_BANNER_UI: "false"
            SPACE_ROOM_DETAILS_UI: "false"
            SPACE_PEOPLE_SEARCH_API: "false"
            SPACE_DIRECTORY_RESOLVER_API: "false"
            SPACE_ROOM_ARTIFACTS_API: "false"
            SPACE_ROOM_PINS_API: "false"
            SPACE_ROOM_FILES_API: "false"
            SPACE_ROOM_FILES_UI: "false"
            AGENT_VERSION_PINNING: "false"
            SPACE_TURN_ATTACHMENTS_UI: "false"
            SPACE_MESSAGE_SEARCH_API: "false"
            SPACE_MESSAGE_SEARCH_UI: "false"
            SPACE_ENTRY_LINKS_UI: "false"
            SPACE_COMMAND_PALETTE_UI: "false"
            SPACE_THREAD_FORK_API: "false"
            SPACE_THREAD_SCOPE_RESOLVE: "false"
            SPACE_ATTENTION_API: "false"
            SPACE_ATTENTION_UI: "false"
            SPACE_STATUS_API: "false"
            SPACE_REMINDERS_API: "false"
            SPACE_MENTION_RECORDS_API: "false"
            SPACE_ADDRESSED_WAKE_API: "false"
            ORG_IDENTITY_ADMIN_API: "false"
            SCIM_EDGE_ENABLED: "false"
            SPACE_RUN_OWNER_STEER: "false"
            SPACE_SIDEBAR_API: "false"
            SPACE_DM_API: "false"
            SPACE_MESSAGE_REVISE_API: "false"
            SPACE_REACTIONS_API: "false"
            SPACE_RUN_LIVE_VIEW: "false"
            SPACE_RUN_LIVE_TEXT: "false"
            SPACE_RUN_MANAGER_STOP: "false"
            # Dev-default-on Space switches (space_flag) that the base compose declares on: off in production.
            SPACE_AGENT_WAKE_POLICY_API: "false"
            SPACE_APPROVAL_SCOPES_ENABLED: "false"
            CHAT_LOCALE_HINT: "false"
            SPACE_ROOM_ARCHIVE_API: "false"
            SPACE_TOOL_POLICY_EDITOR_ENABLED: "false"
            SPACE_COMPOSER_DRAFTS_UI: "false"
            SPACE_COMPOSER_MARKDOWN_UI: "false"
            SPACE_HUMAN_MARKDOWN_UI: "false"
            SPACE_ROOM_DIRECTORY_API: "false"
            SPACE_TIMELINE_ANCHOR_UI: "false"
            MODEL_GATEWAY_DEV_BEARER: ""
            VEREVON_PUBLIC_ORIGIN: ${VEREVON_PUBLIC_ORIGIN:?VEREVON_PUBLIC_ORIGIN is required in production}

    frontend:
        build:
            target: production
        volumes: !reset []
        ports: !override
            - "${VEREVON_BIND_ADDRESS:-127.0.0.1}:${VEREVONV3_HOST_PORT:-5173}:8080"
        environment: !reset {}
        read_only: true
        tmpfs:
            - /tmp:rw,noexec,nosuid,size=32m
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1",
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 5s
