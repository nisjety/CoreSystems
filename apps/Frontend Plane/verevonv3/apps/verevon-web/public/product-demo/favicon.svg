<svg xmlns="http://www.w3.org/2000/svg" viewBox="26 25 70 70" color="#171717" fill="currentColor">
  <!-- Verevon mark, filled, cropped tight for favicon use. The shared mark
       (VerevonMark.tsx / public/verevon-mark.svg) uses viewBox 0 0 120 120,
       leaving deliberate padding for badge/button contexts elsewhere — at
       favicon size (16-32px) that padding made the mark nearly invisible.
       Same path data, just a tighter viewBox so it fills the tab icon.
       `color` is a low-priority presentation attribute: used via <img> it
       renders brand ink (#171717); inlined into HTML any CSS `color` on it
       or an ancestor wins, so fill follows currentColor.
       Source of truth: src/components/home/sections/VerevonMark.tsx -->
