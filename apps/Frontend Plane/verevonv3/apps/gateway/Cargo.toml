[package]
name = "verevon-gateway-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
# Pinned to the same 0.49.1 the Model Plane and Data Plane v2 workspaces use, so
# the GDPR erasure pull consumer in `gdpr_nats.rs` behaves identically to its
# siblings on the same stream — notably `get_consumer_from_stream`'s
# STREAM.INFO-free bind, which the shared-broker ACLs are written against.
async-nats = "0.50.0"
async-stream = "0.3"
axum = { version = "0.7", features = ["macros", "ws"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
futures-util = "0.3"
hmac = "0.12"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.39", features = ["full"] }
tokio-tungstenite = "0.24"
tower-http = { version = "0.5", features = ["cors", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"
urlencoding = "2.1"

[dev-dependencies]
# Router-through tests: `ServiceExt::oneshot` drives the full axum router
# (middleware + route layers), `http-body-util` collects response bodies, and
# `wiremock` stands in for an upstream core so we can assert exactly which
# headers the gateway forwards. Pinned to versions compatible with axum 0.7.
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
