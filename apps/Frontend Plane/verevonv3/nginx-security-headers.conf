# Security response headers (WS07-S2). Single source of truth: Dockerfile copies
# this file to /etc/nginx/snippets/verevon-security-headers.conf and nginx.conf
# `include`s it at server level AND in every location that defines its own
# add_header (nginx does not inherit server-level add_header into a location that
# declares one). Never re-type these headers in nginx.conf.
#
# `always` so they are emitted on error responses (4xx/5xx) too.
# $verevon_hsts is a `map` in nginx.conf: empty (so the header is not emitted)
# unless the forwarded scheme is https. TLS is terminated by an upstream proxy
# (this container listens on :8080), so a bare HSTS would tag plain HTTP too.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
add_header Strict-Transport-Security $verevon_hsts always;
# CSP - ENFORCED. Reviewed against the SolidJS SPA's real resource usage:
#   style-src + font-src whitelist Google Fonts (global.css @import Geist),
#   img-src allows https:/data:/blob: (favicon proxy + canvas screenshots +
#     remote chat-media images), media-src blob: (voice-note recording),
#   script-src 'self' (Vite-built, no inline JS, no eval) + Cloudflare
#     Turnstile (auth captcha dynamically injects challenges.cloudflare.com/
#     turnstile/v0/api.js when a site key is configured) + Nexi Checkout
#     (billing loads checkout.js from {test.,}checkout.dibspayment.eu),
#   frame-src whitelists the Turnstile challenge iframe + the embedded Nexi
#     Checkout iframe ({test.,}checkout.dibspayment.eu); the 3DS challenge
#     nests INSIDE the Nexi iframe so issuer ACS origins are governed by
#     Nexi's CSP, not ours (frame-ancestors stays 'none' - nobody embeds US),
#   connect-src 'self' https: covers same-origin /api + SSE streams (chat,
#     runs, sync-job events), the Nexi payment API, and the broad https:
#     telemetry surface.
# No web workers / WASM in the SPA, so no worker-src is required. The classic
# boot watchdog (public/boot-watchdog.js) is a same-origin file, so 'self'
# covers it; there is no inline script anywhere.
add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https:; img-src 'self' data: https: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://challenges.cloudflare.com https://checkout.dibspayment.eu https://test.checkout.dibspayment.eu; frame-src https://challenges.cloudflare.com https://checkout.dibspayment.eu https://test.checkout.dibspayment.eu; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# WS07-S6 appends the Content-Security-Policy-Report-Only candidate here.
