map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $original_forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

# HSTS only on real HTTPS (TLS is terminated upstream). An empty value makes
# add_header skip the header. Used by nginx-security-headers.conf.
map $http_x_forwarded_proto $verevon_hsts {
    default "";
    https "max-age=31536000; includeSubDomains";
}

# Query strings can contain bearer-like callback material, email addresses, reset
# tokens, and other PII. Log paths only; also normalize invitation IDs embedded in
# paths so access logs cannot become a secondary credential or identifier store.
map $uri $verevon_log_uri {
    ~^/api/auth/(callback|sso/callback|sso/saml2/callback)/ $uri;
    /reset-password $uri;
    ~^/accept-invitation/ /accept-invitation/:invitationId;
    ~^/api/v1/orgs/invitations/ /api/v1/orgs/invitations/:invitationId/accept;
    default $uri;
}

log_format verevon_safe '$remote_addr [$time_local] '
                       '"$request_method $verevon_log_uri $server_protocol" '
                       '$status $body_bytes_sent "$http_user_agent"';
access_log /var/log/nginx/access.log verevon_safe;

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;

    # Same-origin BFF: reverse-proxy the gateway so the browser only ever talks
    # to this origin and Better Auth's session cookie stays first-party.
    # Docker's embedded DNS (127.0.0.11) + a variable upstream forces runtime
    # resolution so nginx survives gateway restarts (new container IP).
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Security response headers + CSP: one snippet (see nginx-security-headers.conf),
    # included here and in every location that defines its own add_header.
    include /etc/nginx/snippets/verevon-security-headers.conf;

    location /api/ {
        set $verevon_gateway http://verevon-gateway-rs:3185;
        proxy_pass $verevon_gateway$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $original_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass_request_headers on;
    }

    location = /health {
        set $verevon_gateway_h http://verevon-gateway-rs:3185;
        proxy_pass $verevon_gateway_h/health;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Build id (WS07-S2): the SPA polls /version.json to notice a newer deploy, so
    # it must never be cached and never fall through to the SPA index.html.
    location = /version.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/verevon-security-headers.conf;
        try_files /version.json =404;
    }

    # The entry document references hashed assets: always revalidate it so a
    # deploy is picked up on the next navigation. Deep links reach it through the
    # try_files fallback below, which re-enters location matching, so they get
    # this header too.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/verevon-security-headers.conf;
        try_files /index.html =404;
    }

    # Classic boot watchdog (not hashed). An exact match beats the 1-year
    # extension regex below.
    location = /boot-watchdog.js {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/verevon-security-headers.conf;
        try_files /boot-watchdog.js =404;
    }

    # Cache immutable hashed assets indefinitely
    location ~* \.(js|css|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/verevon-security-headers.conf;
        try_files $uri =404;
    }

    # Cache images/icons for a week
    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/verevon-security-headers.conf;
        try_files $uri =404;
    }

    # SPA fallback — all other paths return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
