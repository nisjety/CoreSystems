# pnpm v11 reads `overrides` (and most settings) from here, not from the
# package.json "pnpm" field, which it now ignores.
#
# Force patched versions of two DEV-only transitive advisories so the
# verevonv3-security gate (`pnpm audit --audit-level=high`) passes. Both reach
# the tree only through dev tooling, never the shipped runtime bundle:
#   - hono   >=4.12.25  (GHSA-88fw-hqm2-52qc, CORS reflects any origin)  via vite-plugin-mcp > @modelcontextprotocol/sdk
#   - undici >=7.28.0   (GHSA-vmh5-mc38-953g / -vxpw-j846-p89q / -hm92-r4w5-c3mj)  via vitest > jsdom > undici
overrides:
  hono: '>=4.12.25 <5'
  undici: '>=7.28.0 <8'
