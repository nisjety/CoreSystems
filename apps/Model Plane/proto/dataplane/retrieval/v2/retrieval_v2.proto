syntax = "proto3";

package dataplane.retrieval.v2;

option go_package = "github.com/triodelab/dataplane/gen/go/retrieval/v2";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// --- Retrieval request/response ---

message RetrieveRequest {
  string org_id  = 1;
  string query   = 2;
  Filters filters = 3;
  int32   top_k  = 4;

  optional string user_id = 5;
  optional string role    = 6;
  optional string query_expansion = 7;
  optional string reranker_model = 8;
  optional int32  top_k_before_rerank = 9;
  optional string zdr_mode = 10;
  optional int32  context_budget_tokens = 11;
  optional string context_format = 12;  // "json" | "toon"
  // §16.1.4 — `agent_retrieval_configs` lookup key. When set AND a row
  // exists for (org_id, agent_id), the row's `weights` become defaults
  // for this request. Per-request weights (not yet on this proto) still
  // win when callers eventually start sending them.
  optional string agent_id = 13;
  // Sovereignty posture, and the counterpart to `zdr_mode` above. Mirror of
  // Data Plane v2's `optional bool sovereign_required = 14` — the field number
  // is the wire contract, not a local choice, and must stay 14.
  //
  // Until DP2 added this field there was no way for a gRPC caller to declare
  // the axis at all, and DP2's orchestrator resolves
  // `req.sovereign_required.unwrap_or(true)` — a deliberate fail-closed
  // default, because absence of proof is not proof that egress is permitted.
  // So every Model Plane retrieval over gRPC resolved to
  // `sovereign_required = true`, which the configured embedding provider
  // (Cohere Embed v4, Azure-hosted) can never satisfy, and every dense query
  // failed before any retrieval happened. It surfaced as "ZDR content must
  // not egress to the Cohere Embed v4 text path" even with
  // `zdr_mode: disabled`, because DP2's embed guard is
  // `embed_zdr || sovereign_required` and its message names only the first
  // term. Check sovereignty before ZDR if that string ever reappears.
  //
  // See `model-gateway::dataplane::effective_retrieval_sovereign_required`
  // for how the Model Plane derives the value it sends.
  //
  // Additive and wire-compatible in both directions: a caller that sends
  // nothing still resolves to DP2's fail-closed default.
  optional bool sovereign_required = 14;
}

message Filters {
  repeated string document_types = 1;
  repeated string departments    = 2;
  repeated string languages      = 3;
  repeated string document_ids   = 4;
  string          region         = 5;
  repeated string sources        = 6;
  repeated string workspace_ids  = 7;
  repeated string collection_ids = 8;
}

message Candidate {
  string knowledge_id  = 1;
  string document_id   = 2;
  string text          = 3;
  float  dense_score   = 4;
  float  sparse_score  = 5;
  float  rerank_score  = 6;
  float  final_score   = 7;
  google.protobuf.Struct metadata = 8;
  int32  chunk_index   = 9;
  string chunk_version = 10;
}

message Source {
  string document_id = 1;
  string title       = 2;
  string source      = 3;
  string type        = 4;
  google.protobuf.Timestamp created_at = 5;
}

message ContextPack {
  repeated ContextFact facts = 1;
  int32 total_tokens = 2;
  int32 budget_tokens = 3;
  string format = 4;  // "json" | "toon"
}

message ContextFact {
  string knowledge_id = 1;
  string document_id = 2;
  string text = 3;
  float score = 4;
  string source_title = 5;
  string source_type = 6;
  int32 estimated_tokens = 7;
}

message RetrieveResponse {
  repeated Candidate candidates = 1;
  repeated Source sources = 2;
  string query = 3;
  string org_id = 4;
  string trace_id = 5;
  string index_version = 6;
  string zdr_mode = 7;
  bool low_confidence = 8;
  optional ContextPack context_pack = 9;
  google.protobuf.Struct retrieval_metadata = 10;
}

// --- Retrieval trace ---

message RetrievalTrace {
  string trace_id = 1;
  string org_id = 2;
  string query = 3;
  string query_embedding_model = 4;
  string index_version = 5;
  google.protobuf.Struct filters_applied = 6;
  repeated RetrievalCandidate candidates = 7;
  string reranker_name = 8;
  string zdr_mode = 9;
  google.protobuf.Timestamp created_at = 10;
  int32 dense_retrieval_time_ms = 11;
  int32 sparse_retrieval_time_ms = 12;
  int32 rerank_time_ms = 13;
  int32 total_time_ms = 14;
  int32 candidate_count_dense = 15;
  int32 candidate_count_sparse = 16;
  int32 candidate_count_after_fusion = 17;
  int32 candidate_count_after_rerank = 18;
}

message RetrievalCandidate {
  int32 rank = 1;
  string knowledge_id = 2;
  string document_id = 3;
  float dense_score = 4;
  float sparse_score = 5;
  float rerank_score = 6;
  string source_chunk_ref = 7;
}

message GetTraceRequest {
  string trace_id = 1;
  string org_id = 2;
}

message GetTraceResponse {
  RetrievalTrace trace = 1;
}

// --- Source lookup ---

message GetSourcesRequest {
  string org_id = 1;
  repeated string document_ids = 2;
}

message GetSourcesResponse {
  repeated Source sources = 1;
}

// --- Chunk lookup ---

message GetChunksRequest {
  string org_id = 1;
  repeated string knowledge_ids = 2;
  optional string document_id = 3;
}

message GetChunksResponse {
  repeated Candidate chunks = 1;
}

// --- Context pack ---

message PackContextRequest {
  string org_id = 1;
  repeated string knowledge_ids = 2;
  int32 budget_tokens = 3;
  string format = 4;  // "json" | "toon"
}

message PackContextResponse {
  ContextPack pack = 1;
}

// --- Service ---

service RetrievalService {
  rpc Retrieve(RetrieveRequest) returns (RetrieveResponse);
  // §17.3.2 — server-streaming variant. Sends a RetrievalChunk frame per
  // candidate as soon as it's ready, then one final frame with `trailer`
  // populated (metadata, trace_id, low_confidence). Clients that don't
  // need progressive results stay on `Retrieve`.
  rpc RetrieveStream(RetrieveRequest) returns (stream RetrievalChunk);
  rpc GetTrace(GetTraceRequest) returns (GetTraceResponse);
  rpc GetSources(GetSourcesRequest) returns (GetSourcesResponse);
  rpc GetChunks(GetChunksRequest) returns (GetChunksResponse);
  rpc PackContext(PackContextRequest) returns (PackContextResponse);
}

// §17.3.2 — streaming frame. `candidate` is set on per-result frames;
// `trailer` is set on the final frame (carries metadata that's only
// known once the full pipeline finishes).
message RetrievalChunk {
  oneof payload {
    Candidate candidate = 1;
    RetrievalTrailer trailer = 2;
  }
}

message RetrievalTrailer {
  string trace_id = 1;
  string index_version = 2;
  string zdr_mode = 3;
  bool   low_confidence = 4;
  int32  candidate_count = 5;
}
