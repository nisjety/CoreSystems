syntax = "proto3";

package dataplane.graph.v1;

option go_package = "github.com/triodelab/dataplane/gen/go/graph/v1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

message GraphEntity {
  string entity_id = 1;
  string org_id = 2;
  string type = 3;
  string text = 4;
  float confidence = 5;
  string provenance = 6;
  repeated string source_refs = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Struct metadata = 9;
}

message GraphRelationship {
  string rel_id = 1;
  string org_id = 2;
  string entity_a_id = 3;
  string entity_b_id = 4;
  string relation_type = 5;
  float confidence = 6;
  string provenance = 7;
  repeated string source_refs = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Struct metadata = 10;
}

message GraphClaim {
  string claim_id = 1;
  string org_id = 2;
  string text = 3;
  repeated string entity_ids = 4;
  float confidence = 5;
  string provenance = 6;
  repeated string source_refs = 7;
  repeated string contradicted_by_claim_ids = 8;
  string status = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Struct metadata = 11;
}

message GraphCommunity {
  string community_id = 1;
  string org_id = 2;
  repeated string entity_ids = 3;
  string summary = 4;
  int32 level = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Struct metadata = 7;
}

message GetEntityRequest {
  string entity_id = 1;
  string org_id = 2;
}

message GetEntityResponse {
  GraphEntity entity = 1;
}

message ListEntitiesByTypeRequest {
  string org_id = 1;
  string entity_type = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ListEntitiesByTypeResponse {
  repeated GraphEntity entities = 1;
  int32 total = 2;
}

message GetRelationshipsRequest {
  string org_id = 1;
  string entity_id = 2;
  string relation_type = 3;
}

message GetRelationshipsResponse {
  repeated GraphRelationship relationships = 1;
}

message GetClaimsRequest {
  string org_id = 1;
  string entity_id = 2;
  string status = 3;
}

message GetClaimsResponse {
  repeated GraphClaim claims = 1;
}

message GraphExpansionRequest {
  string org_id = 1;
  repeated string entity_ids = 2;
  int32 max_hops = 3;
  int32 max_entities = 4;
}

message ExpandedGraph {
  repeated GraphEntity entities = 1;
  repeated GraphRelationship relationships = 2;
  repeated GraphClaim claims = 3;
  repeated GraphCommunity communities = 4;
}

message GraphExpansionResponse {
  ExpandedGraph graph = 1;
  int32 hops_traversed = 2;
  int32 new_entities_found = 3;
}

message GetContradictionsRequest {
  string org_id = 1;
  optional string entity_id = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message GetContradictionsResponse {
  repeated GraphClaim contradictions = 1;
  int32 total = 2;
}

service GraphService {
  rpc GetEntity(GetEntityRequest) returns (GetEntityResponse);
  rpc ListEntitiesByType(ListEntitiesByTypeRequest) returns (ListEntitiesByTypeResponse);
  rpc GetRelationships(GetRelationshipsRequest) returns (GetRelationshipsResponse);
  rpc GetClaims(GetClaimsRequest) returns (GetClaimsResponse);
  rpc ExpandGraph(GraphExpansionRequest) returns (GraphExpansionResponse);
  rpc GetContradictions(GetContradictionsRequest) returns (GetContradictionsResponse);
}
