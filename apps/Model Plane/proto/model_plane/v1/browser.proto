syntax = "proto3";

package model_plane.v1;

option go_package = "github.com/triodelab/model-plane/gen/go/model_plane/v1;mpv1";

import "google/protobuf/timestamp.proto";

// BrowserBroker — trusted browser grant lifecycle.
// Owns: grant issuance, local/cloud mode switching, per-session revocation, action audit.
service BrowserBroker {
  // Request a browser grant for a session.
  rpc AcquireGrant(AcquireGrantRequest) returns (AcquireGrantResponse);

  // Revoke a browser grant.
  rpc RevokeGrant(RevokeGrantRequest) returns (RevokeGrantResponse);

  // Validate a browser grant is active and not revoked/expired.
  rpc ValidateGrant(ValidateGrantRequest) returns (ValidateGrantResponse);

  // Derive a run grant for one agent run from an active session grant. The
  // run grant is never wider than its parent: same owner and tenant, hosts
  // equal to or below the parent's, ZDR inherited, expiry capped by the
  // parent's, revoked with it. Idempotent on (parent_grant_id, session_key).
  rpc DeriveRunGrant(DeriveRunGrantRequest) returns (DeriveRunGrantResponse);

  // Extend a renewable grant ("session" or "human_browse") by one TTL, never
  // past its absolute expiry (WS8.C). User principals only: a service cannot
  // keep a person's browser session alive.
  rpc RenewGrant(RenewGrantRequest) returns (RenewGrantResponse);

  // Health check.
  rpc Health(BrowserHealthRequest) returns (BrowserHealthResponse);
}

message AcquireGrantRequest {
  // Session requesting browser access.
  string session_key = 1;

  // Preferred mode: "local" or "cloud".
  string mode = 2;

  // Tenant identifier.
  string org_id = 3;

  // Broker-owned navigation policy. An empty policy is never an unrestricted
  // browser grant: issuance rejects it. Values are normalized and persisted by
  // the broker, then returned by ValidateGrant for downstream enforcement.
  repeated string allowed_domains = 4;

  // Optional least-privilege scopes for a one-time sensitive browser action.
  // Empty means this is an ordinary run grant, never implicit approval.
  repeated string allowed_actions = 5;
  repeated string allowed_frame_ids = 6;
  repeated string allowed_dialog_ids = 7;
  repeated string allowed_artifact_ids = 8;

  // Required for a sensitive approval. It binds that one-time authority to
  // the ordinary BrowserBroker grant held by the target Quarry run.
  string parent_grant_id = 9;

  // Request a Zero Data Retention grant. The broker treats this as a floor:
  // a verified principal whose token carries zdr=true always gets a ZDR grant,
  // and a request can raise but never lower it. A ZDR grant has a "z_" id
  // prefix and is never persisted by a durable store.
  bool zdr = 10;

  // Budget claim (WS6.E, field numbers 40-44 are the budget ledger entry of R-6;
  // 45-49 are reserved for follow-ons). An upper bound a run under this grant
  // may spend, which can only tighten: a consumer takes the smaller of the
  // claim and what its own request or default gives, never the larger. Zero
  // means no bound on that dimension; all zero and an empty source means no
  // claim. budget_source is "request", "org_default" or "entitlement" and is
  // required exactly when some dimension is set.
  int64 budget_micro_usd = 40;
  // Step bound; zero means no bound.
  int32 budget_max_steps = 41;
  // Wall-clock bound in seconds; zero means no bound.
  int32 budget_max_runtime_s = 42;
  // Where the claim came from: "request", "org_default" or "entitlement".
  string budget_source = 43;
  // Stamped by the broker when the claim is stored; a request that sets it
  // is refused.
  int64 budget_minted_at_unix = 44;

  // Grant kind (WS8.C, field numbers 50-59 are the WS8 ledger entry of R-6).
  // "" is the ordinary session or sensitive-approval path; "human_browse"
  // asks for an open-web grant for a person's own browsing. Eligibility is
  // server-decided: a human_browse request needs a user principal, carries no
  // allowed_domains, and is refused when the broker's policy has it off.
  string grant_kind = 50;

  // Origin extension (E3.2-e1, OD13; field numbers 21-39 are F-t2-032's band in
  // the R-6 ledger). With grant_kind "origin_extension" the broker issues a
  // parent-bound grant that adds the hosts in allowed_domains (at most eight,
  // exact hosts, no wildcard) to what the run named by parent_grant_id may
  // reach. The person consented to them; the grant is never wider than that
  // consent and dies with its parent. Dark behind
  // BROWSER_BROKER_ORIGIN_EXTENSION_ENABLED.
  // How long the consent is meant to last: "turn", "conversation" or "always".
  // Required for an origin extension and refused for any other grant. A Zero
  // Data Retention grant takes "turn" only (a persisted consent would persist
  // host names).
  string consent_scope = 21;
  // Hosts the person denied in the same decision. Deny beats approval: an
  // approved host equal to, below or above a denied entry is dropped, and a
  // request left with no host is refused. Refused for any other grant.
  repeated string consent_denied_domains = 22;

  // fill_otp approval binding (Q3-E3.1-b1-c, ADR-2a; tags 23-24 of F-t2-032's
  // band). The mail connection the one-time code is read from: required, and
  // matching ^[A-Za-z0-9_-]{1,128}$, when allowed_actions is ["fill_otp"];
  // refused for any other grant. Stored verbatim, never logged. Dark behind
  // BROWSER_BROKER_FILL_OTP_ENABLED.
  string mail_connection_id = 23;
  // The canonical https origin (scheme https, lowercase host, optional port,
  // no path, query or fragment) the code may be typed into: required for a
  // fill_otp approval and refused for any other grant.
  string grant_origin = 24;

  // The Space the run belongs to (WS21-S8). The site policy reads the Space
  // floor from it; empty outside a Space. Tag 11 (R-6 allocates 10 to zdr).
  string space_id = 11;

  // Ask for a read-only grant (WS21-S4): the broker narrows the grant to the
  // read level and reports read_only. Until the durable store persists the
  // flag, a read-only request is refused unless the grant is Zero Data Retention.
  bool read_only = 12;

  // Requested lifetime in seconds (WS21-S4). Zero uses the broker default; the
  // broker's maximum (BROWSER_GRANT_MAX_TTL) caps it.
  int32 ttl_seconds = 13;
}

message AcquireGrantResponse {
  // Grant identifier (ULID).
  string grant_id = 1;

  // Browser endpoint (CDP URL or local ws).
  string endpoint = 2;

  // Grant expiry time.
  google.protobuf.Timestamp expires_at = 3;

  // Canonical broker-owned navigation policy for this grant.
  repeated string allowed_domains = 4;
  repeated string allowed_actions = 5;
  repeated string allowed_frame_ids = 6;
  repeated string allowed_dialog_ids = 7;
  repeated string allowed_artifact_ids = 8;
  string parent_grant_id = 9;

  // WS7.K (R-6: field 20 is the web-policy snapshot): the org web policy the
  // broker stored on this grant. Unset means the grant carries no snapshot,
  // which is no grant layer. See WebPolicy.
  WebPolicy web_policy = 20;

  // "session" or "sensitive_approval" (a "run" grant is derived from a session
  // grant, not acquired). Consumers must treat an unknown value as not valid.
  string kind = 10;

  // True when the grant is a Zero Data Retention grant (its id starts "z_").
  bool zdr = 11;

  // Budget claim (WS6.E, field numbers 40-44 are the budget ledger entry of R-6;
  // 45-49 are reserved for follow-ons). An upper bound a run under this grant
  // may spend, which can only tighten: a consumer takes the smaller of the
  // claim and what its own request or default gives, never the larger. Zero
  // means no bound on that dimension; all zero and an empty source means no
  // claim. budget_source is "request", "org_default" or "entitlement" and is
  // required exactly when some dimension is set.
  int64 budget_micro_usd = 40;
  // Step bound; zero means no bound.
  int32 budget_max_steps = 41;
  // Wall-clock bound in seconds; zero means no bound.
  int32 budget_max_runtime_s = 42;
  // Where the claim came from: "request", "org_default" or "entitlement".
  string budget_source = 43;
  // Stamped by the broker when the claim is stored; a request that sets it
  // is refused.
  int64 budget_minted_at_unix = 44;

  // Navigation policy mode (WS8.C): "allowlist" (allowed_domains is the whole
  // policy) or "open_web" (a human_browse grant: every public host except
  // denied_domains). Never an empty value from a WS8.C broker.
  string policy_mode = 50;
  // Hosts this grant may never reach. For an open_web grant: the host suffixes
  // it is fenced off (internal namespaces and metadata names). For an allowlist
  // grant: the requested hosts the site policy dropped (WS21-S4), at most nine;
  // empty when the policy is off or nothing was dropped.
  repeated string denied_domains = 51;
  // The hard backstop a renewal can never pass. Equals expires_at for a kind
  // that is not renewable.
  google.protobuf.Timestamp absolute_expires_at = 52;

  // True when the grant is read-only (WS21-S4). Quarry must refuse a mutating
  // action on it.
  bool read_only = 12;

  // 13 carried the site policy's dropped hosts on the model-plane branch before
  // the merge with WS8.C; they now ride in denied_domains (51).
  reserved 13;

  // E3.2-e1: the consent scope of an origin_extension grant ("turn",
  // "conversation" or "always"); empty for every other kind.
  string consent_scope = 21;

  // Q3-E3.1-b1-c: the mail connection a fill_otp approval is bound to; empty
  // for every other grant.
  string mail_connection_id = 23;
  // Q3-E3.1-b1-c: the canonical https origin a fill_otp approval is bound to;
  // empty for every other grant.
  string grant_origin = 24;

  // INNH-10: the API key this grant was issued for (the key id, never the
  // key). Empty for every grant not acquired by an api_key principal. 60:
  // 54-59 stay reserved for the WS8.C follow-ons.
  string key_id = 60;
}

// The org web-policy snapshot a grant carries (WS7.K). The broker derives it
// from the verified principal's `web_policy` claim, never from a request field,
// and a derived run grant may only tighten its parent's. It has the claim's
// content: the version, the issuer's revision, the capability modes, the robots
// and proxy ceilings and the domain rules. Unset means the grant carries no
// snapshot, which is no grant layer.
message WebPolicy {
  // Claim version (1).
  uint32 v = 1;

  // The issuer's policy revision; "0" when the org has no policy.
  string rev = 2;

  // Capability modes keyed by capability name. Only the entries the issuer
  // states are present.
  map<string, string> caps = 3;

  // The ceiling the org sets on robots.txt handling; empty when none is stated.
  string robots_max = 4;

  // The ceiling the org sets on proxy use; empty when none is stated.
  string proxy_max = 5;

  // Hosts the org allows; empty when the policy states no allow rule.
  repeated string domains_allow = 6;

  // Hosts the org denies.
  repeated string domains_deny = 7;
}

message RevokeGrantRequest {
  // Grant to revoke.
  string grant_id = 1;

  // Reason for revocation.
  string reason = 2;
}

message RevokeGrantResponse {
  // True if revoked successfully.
  bool revoked = 1;
}

message BrowserHealthRequest {}

message BrowserHealthResponse {
  // "ok" when service is healthy.
  string status = 1;
}

message ValidateGrantRequest {
  // Grant to validate.
  string grant_id = 1;
}

message ValidateGrantResponse {
  // Grant identifier echoed back.
  string grant_id = 1;

  // True if grant is active and unexpired.
  bool active = 2;

  // Grant expiry time.
  google.protobuf.Timestamp expires_at = 3;

  // Canonical broker-owned navigation policy. Consumers must reject an empty
  // policy and must not substitute caller-supplied domains.
  repeated string allowed_domains = 4;
  repeated string allowed_actions = 5;
  repeated string allowed_frame_ids = 6;
  repeated string allowed_dialog_ids = 7;
  repeated string allowed_artifact_ids = 8;
  string parent_grant_id = 9;

  // WS7.K (R-6: field 20 is the web-policy snapshot): the grant's org web-policy
  // snapshot as stored when the grant was issued. Unset from a broker that
  // predates it, which a consumer reads as no grant layer. See WebPolicy.
  WebPolicy web_policy = 20;

  // Same values as AcquireGrantResponse.kind.
  string kind = 10;

  // The user (or service actor) the grant was issued to. A consumer may bind a
  // run to it; it is not a credential.
  string owner_id = 11;

  // True for a Zero Data Retention grant. Consumers must not persist anything
  // about the run beyond its lifetime when this is set.
  bool zdr = 12;

  // Budget claim (WS6.E, field numbers 40-44 are the budget ledger entry of R-6;
  // 45-49 are reserved for follow-ons). An upper bound a run under this grant
  // may spend, which can only tighten: a consumer takes the smaller of the
  // claim and what its own request or default gives, never the larger. Zero
  // means no bound on that dimension; all zero and an empty source means no
  // claim. budget_source is "request", "org_default" or "entitlement" and is
  // required exactly when some dimension is set.
  int64 budget_micro_usd = 40;
  // Step bound; zero means no bound.
  int32 budget_max_steps = 41;
  // Wall-clock bound in seconds; zero means no bound.
  int32 budget_max_runtime_s = 42;
  // Where the claim came from: "request", "org_default" or "entitlement".
  string budget_source = 43;
  // Stamped by the broker when the claim is stored; a request that sets it
  // is refused.
  int64 budget_minted_at_unix = 44;

  // Same values as AcquireGrantResponse (WS8.C).
  string policy_mode = 50;
  // Hosts this grant may never reach; same meaning as AcquireGrantResponse.denied_domains.
  repeated string denied_domains = 51;
  // Hard backstop a renewal can never pass; see AcquireGrantResponse.absolute_expires_at.
  google.protobuf.Timestamp absolute_expires_at = 52;
  // The run an "attach" grant is bound to; empty for every other kind.
  string resource_id = 53;

  // The key the grant was issued under: the session key of a session grant,
  // and for a run grant the idempotency key of the one run it was derived for
  // (the same value as DeriveRunGrantRequest.session_key). A consumer can bind
  // a presented run grant to that run: a run grant must not back a different
  // run. Empty for a grant issued without one. Field 13 with the grant's base
  // fields: 54-59 stay reserved for the WS8.C follow-ons of the R-6 ledger.
  string session_key = 13;

  // True when the grant is read-only (WS21-S4). Consumers must refuse a
  // mutating action on it. Field 14: 13 is session_key.
  bool read_only = 14;

  // E3.2-e1: the consent scope of an origin_extension grant; empty for every
  // other kind. A consumer widens a run's egress policy from an
  // origin_extension grant only while it validates and its parent_grant_id is
  // the run grant it holds.
  string consent_scope = 21;

  // Q3-E3.1-b1-c: the mail connection a fill_otp approval is bound to; empty
  // for every other grant. A consumer reads the one-time code only from this
  // connection.
  string mail_connection_id = 23;
  // Q3-E3.1-b1-c: the canonical https origin a fill_otp approval is bound to;
  // empty for every other grant. A consumer types the code only into a frame
  // whose origin equals it.
  string grant_origin = 24;

  // INNH-10: the API key the grant was issued for (the key id, never the
  // key); empty for a grant not acquired by an api_key principal. A consumer
  // running a key-driven run binds the grant to the key it was started for.
  // 60: 54-59 stay reserved for the WS8.C follow-ons.
  string key_id = 60;
}

// Request to derive a run grant from an active session grant.
message DeriveRunGrantRequest {
  // The session grant the run derives from. It must be active, of kind
  // "session", owned by the caller (users) inside the caller's organization.
  string parent_grant_id = 1;

  // The run's idempotency key. A repeat with the same parent and key returns
  // the same grant; a repeat with different hosts is ALREADY_EXISTS.
  string session_key = 2;

  // Tenant identifier; must equal the verified token's organization.
  string org_id = 3;

  // Optional narrowing. Empty inherits the parent's hosts (refused when the
  // parent holds more than the broker's run-domain bound); otherwise every
  // host must equal or be a subdomain of a parent host.
  repeated string allowed_domains = 4;

  // Why the run grant is derived: "ai_run", or "attach" (WS8.C) for a child of
  // a session or human_browse grant bound to one run.
  string purpose = 5;

  // Requested lifetime in seconds; 0 uses the broker default. The expiry is
  // never later than the parent's.
  int32 ttl_seconds = 6;

  // Budget claim (WS6.E, field numbers 40-44 are the budget ledger entry of R-6;
  // 45-49 are reserved for follow-ons). An upper bound a run under this grant
  // may spend. On a derive it can only tighten the parent's claim: a consumer takes the smaller of the
  // claim and what its own request or default gives, never the larger. Zero
  // means no bound on that dimension; all zero and an empty source means no
  // claim. budget_source is "request", "org_default" or "entitlement" and is
  // required exactly when some dimension is set.
  int64 budget_micro_usd = 40;
  // Step bound; zero means no bound.
  int32 budget_max_steps = 41;
  // Wall-clock bound in seconds; zero means no bound.
  int32 budget_max_runtime_s = 42;
  // Where the claim came from: "request", "org_default" or "entitlement".
  string budget_source = 43;
  // Stamped by the broker when the claim is stored; a request that sets it
  // is refused.
  int64 budget_minted_at_unix = 44;

  // The run an "attach" grant is bound to (WS8.C); required for purpose
  // "attach", refused for "ai_run".
  string resource_id = 50;
}

// The run grant derived by DeriveRunGrant.
message DeriveRunGrantResponse {
  // Identifier of the derived run grant.
  string grant_id = 1;
  // Browser endpoint of the run grant (CDP URL or local ws).
  string endpoint = 2;
  // Expiry of the run grant; never later than the parent grant's expiry.
  google.protobuf.Timestamp expires_at = 3;
  // Canonical hosts of the run grant.
  repeated string allowed_domains = 4;
  string parent_grant_id = 5;
  // WS7.K (R-6: field 20 is the web-policy snapshot): the snapshot the run grant
  // inherited from its parent, which a derive may only tighten. Unset when the
  // parent carried none. See WebPolicy.
  WebPolicy web_policy = 20;
  // "run" for purpose ai_run, "attach" for purpose attach.
  string kind = 6;
  // Inherited from the parent; never lower than the parent's.
  bool zdr = 7;

  // Budget claim (WS6.E, field numbers 40-44 are the budget ledger entry of R-6;
  // 45-49 are reserved for follow-ons). An upper bound a run under this grant
  // may spend, which can only tighten: a consumer takes the smaller of the
  // claim and what its own request or default gives, never the larger. Zero
  // means no bound on that dimension; all zero and an empty source means no
  // claim. budget_source is "request", "org_default" or "entitlement" and is
  // required exactly when some dimension is set.
  int64 budget_micro_usd = 40;
  // Step bound; zero means no bound.
  int32 budget_max_steps = 41;
  // Wall-clock bound in seconds; zero means no bound.
  int32 budget_max_runtime_s = 42;
  // Where the claim came from: "request", "org_default" or "entitlement".
  string budget_source = 43;
  // Stamped by the broker when the claim is stored; a request that sets it
  // is refused.
  int64 budget_minted_at_unix = 44;

  // Echo of the bound run for an "attach" grant; empty for an ai_run grant.
  string resource_id = 50;
}

// Request to extend a renewable grant by one TTL.
message RenewGrantRequest {
  // The grant to extend: kind "session" or "human_browse", owned by the caller.
  string grant_id = 1;

  // Tenant identifier; must equal the verified token's organization.
  string org_id = 2;
}

// Result of RenewGrant: the new expiry and the hard backstop.
message RenewGrantResponse {
  // The new expiry: min(now + the broker TTL, absolute_expires_at).
  google.protobuf.Timestamp expires_at = 1;

  // The hard backstop; a renewal at the cap is FAILED_PRECONDITION.
  google.protobuf.Timestamp absolute_expires_at = 2;
}
