syntax = "proto3";

package model_plane.v1;

option go_package = "github.com/triodelab/model-plane/gen/go/model_plane/v1;mpv1";

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

// Canonical event envelope for all Model Plane events.
// Every event published to NATS or stored in the events table uses this shape.
message Event {
  // Globally unique event identifier (ULID).
  string event_id = 1;

  // Discriminator for the event payload type.
  EventType event_type = 2;

  // Monotonically increasing schema version for this event type.
  // Consumers MUST handle unknown versions gracefully.
  uint32 schema_version = 3;

  // Wall-clock time when the event was produced.
  google.protobuf.Timestamp ts = 4;

  // Service name that produced this event.
  string producer = 5;

  // Trace correlation — propagated from the originating request.
  string correlation_id = 6;

  // ID of the event that directly caused this event.
  string causation_id = 7;

  // Client-supplied deduplication key. Combined with producer + event_type + resource_ref
  // to form the idempotency hash: blake3(producer|event_type|resource_ref|idempotency_key).
  string idempotency_key = 8;

  // Tenant identifier.
  string org_id = 9;

  // Acting user identifier.
  string user_id = 10;

  // Canonical reference to the affected resource (e.g. "thread/{thread_id}" or "run/{run_id}").
  string resource_ref = 11;

  // Type-specific payload. Encoded as google.protobuf.Any so envelope shape is stable.
  google.protobuf.Any payload = 12;

  // Zero Data Retention mode. When true, this event must not be persisted durably.
  bool zdr = 13;

  // Run-trace envelope fields (WS10.S2). Additive: fields 1-13 are unchanged,
  // so pre-trace wire bytes still decode. Producers that do not number their
  // events leave these at their zero values. Numbered 21-25 because shrinking
  // the published `reserved 14 to 20` range is a buf breaking change
  // (RESERVED_MESSAGE_NO_DELETE); the reservation is kept as it was.

  // Per-(run_id, producer) sequence, dense from 1. 0 = not numbered.
  uint64 producer_seq = 21;

  // Agent that produced the event (browser agent, subagent, ...).
  AgentRef agent = 22;

  // What started the run this event belongs to. Never an authorization input.
  RunOrigin origin = 23;

  // Model Plane run id this event belongs to (bare ULID, no dots).
  string run_id = 24;

  // Request id of the HTTP call that caused the event, for support lookups.
  // Not an authorization, tenancy or idempotency key.
  string request_id = 25;

  // Reserved for future envelope fields.
  reserved 14 to 20;
}

// Identifies the agent that produced a trace event.
message AgentRef {
  // Agent identifier (for example "general-v1"). At most 64 chars [A-Za-z0-9_-].
  string id = 1;

  // Role of the agent within the run (for example "primary", "subagent").
  string role = 2;

  // Identifier of the parent agent, empty for the primary agent.
  string parent_id = 3;
}

// What started a run. A label for display and filtering only; admission and
// budget code must never read it as authority.
enum RunOrigin {
  // Origin not recorded.
  RUN_ORIGIN_UNSPECIFIED = 0;
  // A human in a UI (chat, space, support, agent-run console).
  RUN_ORIGIN_USER = 1;
  // Another agent or background review.
  RUN_ORIGIN_AGENT = 2;
  // A schedule, cron or routine.
  RUN_ORIGIN_SCHEDULE = 3;
  // An inbound webhook or mail task.
  RUN_ORIGIN_WEBHOOK = 4;
  // A direct service caller.
  RUN_ORIGIN_API = 5;
}

// Lifecycle event types from the plan Phase A taxonomy.
enum EventType {
  // Unknown or unspecified event type.
  EVENT_TYPE_UNSPECIFIED = 0;

  // Session lifecycle events.
  // User session started.
  EVENT_TYPE_SESSION_START = 1;
  // User session ended.
  EVENT_TYPE_SESSION_END = 2;

  // Instruction and prompt events.
  // Instructions loaded from external source.
  EVENT_TYPE_INSTRUCTIONS_LOADED = 10;
  // User submitted a prompt.
  EVENT_TYPE_USER_PROMPT_SUBMIT = 11;

  // Hook lifecycle events.
  // Pre-tool-use hook executed.
  EVENT_TYPE_PRE_TOOL_USE = 20;
  // Post-tool-use hook executed.
  EVENT_TYPE_POST_TOOL_USE = 21;
  // Post-tool-use hook failed.
  EVENT_TYPE_POST_TOOL_USE_FAILURE = 22;

  // Permission events.
  // Permission request issued.
  EVENT_TYPE_PERMISSION_REQUEST = 30;

  // Subagent lifecycle events.
  // Subagent started.
  EVENT_TYPE_SUBAGENT_START = 40;
  // Subagent stopped.
  EVENT_TYPE_SUBAGENT_STOP = 41;

  // Task lifecycle events.
  // Task created.
  EVENT_TYPE_TASK_CREATED = 50;
  // Task completed.
  EVENT_TYPE_TASK_COMPLETED = 51;

  // Compaction events.
  // Pre-compaction event.
  EVENT_TYPE_PRE_COMPACT = 60;
  // Post-compaction event.
  EVENT_TYPE_POST_COMPACT = 61;

  // Terminal events.
  // Stop/termination requested.
  EVENT_TYPE_STOP = 70;
  // Stop/termination failed.
  EVENT_TYPE_STOP_FAILURE = 71;

  // Ingress (model-gateway) events.
  // Ingress request accepted.
  EVENT_TYPE_INGRESS_ACCEPTED = 80;
  // Ingress request rejected.
  EVENT_TYPE_INGRESS_REJECTED = 81;

  // Run lifecycle events.
  // Run started execution.
  EVENT_TYPE_RUN_STARTED = 90;
  // Run completed successfully.
  EVENT_TYPE_RUN_COMPLETED = 91;
  // Run failed.
  EVENT_TYPE_RUN_FAILED = 92;
  // Run cancelled by an authorized owner; the event id is the cancellation
  // receipt exposed by the RunService cancel response.
  EVENT_TYPE_RUN_CANCELLED = 93;

  // Action lifecycle events.
  // Action started execution.
  EVENT_TYPE_ACTION_STARTED = 100;
  // Action completed.
  EVENT_TYPE_ACTION_COMPLETED = 101;

  // Checkpoint events.
  // Checkpoint saved.
  EVENT_TYPE_CHECKPOINT_SAVED = 110;
  // Checkpoint restored.
  EVENT_TYPE_CHECKPOINT_RESTORED = 111;

  // Plan and approval events (Phase 1).
  // Plan created.
  EVENT_TYPE_PLAN_CREATED = 120;
  // Approval requested.
  EVENT_TYPE_APPROVAL_REQUESTED = 121;
  // Plan transitioned to new state.
  EVENT_TYPE_PLAN_TRANSITIONED = 122;
  // Approval decision made.
  EVENT_TYPE_APPROVAL_DECIDED = 123;

  // Todo lifecycle events (Phase 1).
  // Todo created.
  EVENT_TYPE_TODO_CREATED = 124;
  // Todo transitioned to new state.
  EVENT_TYPE_TODO_TRANSITIONED = 125;

  // Subagent lifecycle events (Phase 1).
  // Subagent attached to lineage.
  EVENT_TYPE_SUBAGENT_ATTACHED = 126;
  // Subagent stopped in lineage.
  EVENT_TYPE_SUBAGENT_STOPPED = 127;

  // Run pause/resume for approval events (Phase 1).
  // Run paused awaiting approval.
  EVENT_TYPE_RUN_PAUSED_FOR_APPROVAL = 128;
  // Run resumed after approval granted.
  EVENT_TYPE_RUN_RESUMED_AFTER_APPROVAL = 129;

  // Recovery events (Phase 1).
  // Recovery attempt made.
  EVENT_TYPE_RECOVERY_ATTEMPTED = 130;

  // Browser-agent progress events. These are persisted only as the safe,
  // reference-based projection emitted by OrchestrationCore; screenshots and
  // DOM bytes remain artifacts behind their existing ownership-gated route.
  EVENT_TYPE_BROWSER_ACTION_DISPATCHED = 140;
  EVENT_TYPE_BROWSER_OBSERVATION_RECEIVED = 141;
  EVENT_TYPE_BROWSER_RUN_PAUSED = 142;
  EVENT_TYPE_BROWSER_RUN_RESUMED = 143;
  EVENT_TYPE_BROWSER_ACTION_APPROVAL_REQUIRED = 144;
  EVENT_TYPE_BROWSER_ACTION_DECIDED = 145;
  EVENT_TYPE_APPROVAL_CONTINUATION_VERIFIED = 146;

  // Run-trace events (WS10.S2). Produced by Quarry, carried on
  // mp.v1.trace.run.<run_id> and persisted by session-core. 150-159 belong
  // to the trace; 150-156 are used.
  // A browser session was opened for the run.
  EVENT_TYPE_BROWSER_SESSION_OPENED = 150;
  // A browser session closed (reason in the payload).
  EVENT_TYPE_BROWSER_SESSION_CLOSED = 151;
  // Control of the session moved between agent, user and delegate.
  EVENT_TYPE_BROWSER_CONTROL_CHANGED = 152;
  // A tab was opened, closed or activated.
  EVENT_TYPE_BROWSER_TAB_CHANGED = 153;
  // A step receipt was recorded (reference-based, no page content).
  EVENT_TYPE_BROWSER_STEP_RECEIPT_RECORDED = 154;
  // An egress decision (block or summary) was recorded.
  EVENT_TYPE_BROWSER_EGRESS_DECIDED = 155;
  // An artifact (screenshot, download) was recorded by reference.
  EVENT_TYPE_BROWSER_ARTIFACT_RECORDED = 156;

  // A delegate attached with the owner's shared cookie jar (WS8.G).
  // Allocated here so the enum is touched once.
  EVENT_TYPE_BROWSER_ATTACH_SHARED_JAR = 160;

  // Run-ledger events (EP-14 S5). 150, proposed by the design, is the trace's.
  // A run's content-free timing record (`RunTimingRecorded`, run_ledger.proto):
  // ids, milliseconds, counts and tool names. Written by session-core for a
  // persistent run only; a ZDR or waived run records none.
  EVENT_TYPE_RUN_TIMING_RECORDED = 161;

  // Reserved for future event types.
  reserved 200 to 255;
}
