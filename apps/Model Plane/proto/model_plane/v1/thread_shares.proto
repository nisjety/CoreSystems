syntax = "proto3";

package model_plane.v1;

option go_package = "github.com/triodelab/model-plane/gen/go/model_plane/v1;mpv1";

import "google/protobuf/timestamp.proto";
import "model_plane/v1/thread_export.proto";

// Thread share snapshots (Wave 3 EP-12 S14, decision D10; ADR
// docs/decisions/conversation-share-model.md, proposed).
//
// The owner of a thread takes an immutable copy of its active branch: the
// thread export (EP-12 S9) with the redacted profile, stored in session-core.
// Later turns never reach a snapshot, and reading one calls no model,
// connector or tool. Creating one follows the export's refusals: a
// zero-retention or waived caller is refused (`zdr_feature_not_supported`,
// feature `conversation_share`), and so is a thread that holds any run whose
// retention class is not `persistent` or that belongs to a Space
// (`failed_precondition` `thread_not_exportable`, the reason in the
// `x-mp-error-reason` trailer). Revoking deletes the body; a revoked snapshot
// reads as not found to everyone. A snapshot is erased with its thread and
// with the org purge.
//
// Reads are owner-only through `GetSnapshot`. A member the owner granted a view
// reads through `GetSharedSnapshot` (W4-SH-5, below); every other read is not
// found. A separate file and service (integration round B, C-B6) so that
// SessionCore and every implementation or test double of it stay
// source-compatible. Switch `SESSION_THREAD_SHARES_ENABLED`, default off; while
// it is off every RPC answers `unavailable` `thread_shares_disabled`.
//
// W4-SH-4: the owner can share a live snapshot with members of the same
// organisation. Control owns the grant: session-core writes a `view` grant on
// resource type `conversation_snapshot`, resource id the snapshot id, through
// user-core's owner-asserted grant surface, with the owner's delegated
// credential, and never stores a grant itself. The three grant RPCs need the
// separate switch `SESSION_SNAPSHOT_GRANTS_ENABLED`, default off (`unavailable`
// `snapshot_grants_disabled`), refuse a zero-retention or waived caller for
// sharing (`zdr_feature_not_supported`, feature `conversation_share`), and
// answer not found for a snapshot the caller does not own or that is revoked.
// Revoking a snapshot also removes every Control grant on it.
//
// W4-SH-5: a member Control holds a `view` grant for reads the live snapshot
// with `GetSharedSnapshot`, behind the same switch as the grant RPCs. Control
// answers that grant check for the member's own delegated credential at read
// time, and only a snapshot of the member's own organisation is read. Every
// refusal, including a Control call that fails, is `not_found`, as a missing
// snapshot is.

// EP-12 S14. One snapshot as its owner sees it, without its body.
message ThreadShareSnapshot {
  // The snapshot's id, `snap_<ulid>`; the resource id a Control grant on
  // `conversation_snapshot` names.
  string snapshot_id = 1;
  // The thread the snapshot copies.
  string thread_id = 2;
  // The thread's title when the snapshot was taken; empty when it had none.
  string title = 3;
  // When the snapshot was taken.
  google.protobuf.Timestamp created_at = 4;
  // `sha256:<hex>` of the stored body; empty once revoked.
  string body_digest = 5;
  // When the owner revoked the snapshot; unset while it is live.
  google.protobuf.Timestamp revoked_at = 6;
}

// EP-12 S14. Take a snapshot of one thread the caller owns.
message CreateSnapshotRequest {
  // The thread to copy, in the caller's own org.
  string thread_id = 1;
}

// EP-12 S14. The snapshot just taken.
message CreateSnapshotResponse {
  // The new snapshot, without its body.
  ThreadShareSnapshot snapshot = 1;
}

// EP-12 S14. List the caller's live snapshots of one thread.
message ListSnapshotsRequest {
  // The thread whose snapshots to list; another person's thread lists none.
  string thread_id = 1;
}

// EP-12 S14. The caller's live snapshots of the thread, newest first.
message ListSnapshotsResponse {
  // At most 20 snapshots, the per-thread cap; revoked ones are left out.
  repeated ThreadShareSnapshot snapshots = 1;
}

// EP-12 S14. Read one live snapshot with its body.
message GetSnapshotRequest {
  // The snapshot to read.
  string snapshot_id = 1;
}

// EP-12 S14. One snapshot and the copy it holds.
message GetSnapshotResponse {
  // The snapshot, without its body.
  ThreadShareSnapshot snapshot = 1;
  // The redacted export the snapshot froze, exactly as it was taken.
  ExportThreadResponse body = 2;
}

// EP-12 S14. Revoke one of the caller's snapshots.
message RevokeSnapshotRequest {
  // The snapshot to revoke; another person's or a revoked one is not found.
  string snapshot_id = 1;
}

// EP-12 S14. The snapshot as revoked: no digest, `revoked_at` set.
message RevokeSnapshotResponse {
  // The revoked snapshot; its body is already deleted.
  ThreadShareSnapshot snapshot = 1;
}

// W4-SH-4. One member a live snapshot is shared with, as Control lists the grant.
message SnapshotGrant {
  // The member's user id; always a member of the snapshot's organisation.
  string grantee_user_id = 1;
  // When Control recorded the grant; unset when Control's timestamp was unreadable.
  google.protobuf.Timestamp granted_at = 2;
}

// W4-SH-4. Share one of the caller's live snapshots with an organisation member.
message ShareSnapshotRequest {
  // The snapshot to share; another person's or a revoked one is not found.
  string snapshot_id = 1;
  // The member to share with. Control refuses a user who is not a member of the
  // caller's organisation. The role is always `view`.
  string grantee_user_id = 2;
}

// W4-SH-4. The grant Control recorded; sharing twice with the same member is idempotent.
message ShareSnapshotResponse {
  // The member's grant on the snapshot.
  SnapshotGrant grant = 1;
}

// W4-SH-4. Stop sharing one of the caller's live snapshots with one member.
message UnshareSnapshotRequest {
  // The snapshot to stop sharing; another person's or a revoked one is not found.
  string snapshot_id = 1;
  // The member whose grant to remove.
  string grantee_user_id = 2;
}

// W4-SH-4. Nothing to report: removing an absent grant also succeeds.
message UnshareSnapshotResponse {}

// W4-SH-4. List the members one of the caller's live snapshots is shared with.
message ListSnapshotGrantsRequest {
  // The snapshot whose grants to list; another person's or a revoked one is not found.
  string snapshot_id = 1;
}

// W4-SH-4. Every member grant Control holds on the snapshot.
message ListSnapshotGrantsResponse {
  // The grants, as Control lists them; Space subjects are left out.
  repeated SnapshotGrant grants = 1;
}

// W4-SH-5. Read one live snapshot as its owner, or as a member Control holds a `view` grant for.
message GetSharedSnapshotRequest {
  // The snapshot to read. Another organisation's, a revoked one, or one the caller neither owns
  // nor holds a grant on is not found.
  string snapshot_id = 1;
}

// W4-SH-5. The snapshot and the copy it holds, as the owner's own read gives them.
message GetSharedSnapshotResponse {
  // The snapshot, without its body.
  ThreadShareSnapshot snapshot = 1;
  // The redacted export the snapshot froze, exactly as it was taken.
  ExportThreadResponse body = 2;
}

// EP-12 S14. The snapshot store. See the file comment for every refusal.
service ThreadShareService {
  // Take an immutable, redacted snapshot of a thread the caller owns.
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);
  // List the caller's live snapshots of one thread.
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);
  // Read one live snapshot with its body, as its owner; a granted member uses GetSharedSnapshot.
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse);
  // Revoke a snapshot: its body and digest are deleted in the same statement.
  // With `SESSION_SNAPSHOT_GRANTS_ENABLED` on it also removes the snapshot's Control grants.
  rpc RevokeSnapshot(RevokeSnapshotRequest) returns (RevokeSnapshotResponse);
  // W4-SH-4. Share a live snapshot with an organisation member through a Control `view` grant.
  rpc ShareSnapshot(ShareSnapshotRequest) returns (ShareSnapshotResponse);
  // W4-SH-4. Remove one member's Control grant on a live snapshot.
  rpc UnshareSnapshot(UnshareSnapshotRequest) returns (UnshareSnapshotResponse);
  // W4-SH-4. List the members a live snapshot is shared with.
  rpc ListSnapshotGrants(ListSnapshotGrantsRequest) returns (ListSnapshotGrantsResponse);
  // W4-SH-5. Read a live snapshot as its owner, or as a member with a Control `view` grant on it.
  rpc GetSharedSnapshot(GetSharedSnapshotRequest) returns (GetSharedSnapshotResponse);
}
