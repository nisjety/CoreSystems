syntax = "proto3";

package model_plane.v1;

option go_package = "github.com/triodelab/model-plane/gen/go/model_plane/v1;mpv1";

import "google/protobuf/timestamp.proto";

// MemoryService — memory index and retrieval for session context.
// Letta-bridge owns block synchronization; session-core owns the memory index metadata.
// This service defines the retrieval interface used by context assembly.
service MemoryService {
  // Search memory entries relevant to a query.
  rpc SearchMemory(SearchMemoryRequest) returns (SearchMemoryResponse);

  // Index a new memory entry.
  rpc IndexMemory(IndexMemoryRequest) returns (IndexMemoryResponse);

  // List durable memory entries owned by a user, across every thread. Unlike
  // SearchMemory this is not thread-scoped: it backs a "what do you remember
  // about me" surface, so the caller supplies a user rather than a thread.
  rpc ListMemory(ListMemoryRequest) returns (ListMemoryResponse);

  // Delete a single memory entry by id, scoped to the owning user. Removes
  // both the durable index record and, best-effort, the underlying semantic
  // memory record.
  rpc DeleteMemory(DeleteMemoryRequest) returns (DeleteMemoryResponse);

  // Health check.
  rpc Health(MemoryHealthRequest) returns (MemoryHealthResponse);

  // The user's memory state and what it currently allows. Readable by a ZDR
  // caller (it answers reason "zdr"), which writes nothing.
  rpc GetMemoryControls(GetMemoryControlsRequest) returns (GetMemoryControlsResponse);

  // Set the user's own memory state (on, paused, off). User callers only, for
  // themselves; refused for a ZDR or waived credential.
  rpc SetMemoryControls(SetMemoryControlsRequest) returns (SetMemoryControlsResponse);

  // Erase every durable memory the caller owns, with its supersession lineage
  // and semantic copies, in one confirmed step. Org-owned memory is left alone.
  // Open to a ZDR caller too: erasure only removes, and pre-ZDR rows may exist.
  rpc ResetMemory(ResetMemoryRequest) returns (ResetMemoryResponse);
}

message SearchMemoryRequest {
  // Thread context for scoping.
  string thread_id = 1;

  // Natural language query.
  string query = 2;

  // Memory topic filter: "POLICY", "WORKSPACE", "AGENT", "USER", "MEMORY".
  repeated string topic_filter = 3;

  // Maximum results.
  uint32 limit = 4;

  // Tenant context.
  string org_id = 5;

  // Optional lower bound for updated_at.
  google.protobuf.Timestamp updated_after = 6;

  // The user this search is on behalf of, for per-user scoping.
  //
  // When set, results are limited to memories owned by this user plus those
  // owned by nobody (org/workspace/policy scope) -- the same rule session-core's
  // durable query applies (`scope = 'user' AND owner = $3`).
  //
  // Empty means no user filter, which is org-wide. That was the ONLY behaviour
  // before this field existed, and it was safe only because the single caller
  // always passed a `thread_id` and a thread has one owner. This boundary did
  // not enforce that itself: a caller omitting `thread_id` got every user's
  // personal memories in the org. Callers acting for a user should always set
  // this.
  string user_id = 7;
}

message SearchMemoryResponse {
  // Matching memory entries ordered by relevance.
  repeated MemoryEntry entries = 1;

  // True when local results are returned without verified semantic recall.
  bool degraded = 2;

  // Stable machine-readable reason, empty when semantic recall is ready.
  string degradation_reason = 3;

  // Why the caller's own memory was not used for this search, one of the
  // closed MemoryControls.reason tokens: "user_paused", "user_off",
  // "org_disabled", "policy_unavailable". Empty when it was used. A paused or
  // off user still receives org-owned entries, so an empty `entries` with this
  // set means "memory is switched off", never "nothing to recall".
  string skip_reason = 4;
}

message MemoryEntry {
  // Memory entry identifier.
  string memory_id = 1;

  // Thread that owns this entry.
  string thread_id = 2;

  // Topic: "POLICY", "WORKSPACE", "AGENT", "USER", "MEMORY".
  string topic = 3;

  // Content of the memory entry.
  string content = 4;

  // Relevance score (0.0 - 1.0).
  float score = 5;

  // When this entry was last updated.
  google.protobuf.Timestamp updated_at = 6;

  // Owning user, when known. Empty for entries that are not user-scoped
  // (e.g. org/workspace/policy facts).
  string user_id = 7;

  // How this memory came to exist, so a person reading "what do you remember
  // about me" can tell what they ASKED Verevon to remember from what Verevon
  // decided to remember on its own.
  //
  // Three-valued rather than a bool: "stated" covers both an explicit
  // save-memory tool call and a phrase the deterministic matcher recognised
  // ("husk at ..."), which are equally the user's own words; "inferred" is a
  // model's reading of a conversation; "unknown" is an older row written before
  // provenance was recorded, and must not be presented as either.
  MemoryProvenance provenance = 8;

  // Space this row was learned in, set only when the row is withheld (see
  // withheld_reason). Ids only, never content. Empty for every ordinary row.
  string origin_space_ref = 9;

  // Why this row is listed but never recalled. Closed vocabulary shared with
  // the personal-chat hidden_reason: "room_origin_unverified" is a row learned
  // in a shared room before containment existed. The owner may keep or delete
  // it; no conversation recalls it. Empty for an ordinary row.
  string withheld_reason = 10;
}

// MemoryProvenance — who decided a memory was worth keeping.
enum MemoryProvenance {
  // Not recorded. Pre-provenance rows land here; never render these as stated.
  MEMORY_PROVENANCE_UNSPECIFIED = 0;

  // The user said it, or asked for it to be saved.
  MEMORY_PROVENANCE_STATED = 1;

  // A model inferred it from a conversation. Auto-accepted, but this is the
  // class a user is most likely to want to delete.
  MEMORY_PROVENANCE_INFERRED = 2;
}

message IndexMemoryRequest {
  // Thread this memory belongs to.
  string thread_id = 1;

  // Topic classification.
  string topic = 2;

  // Content to index.
  string content = 3;

  // Tenant context.
  string org_id = 4;

  // Owning user, when this memory is user-scoped. Empty for org/workspace/
  // policy facts that have no single owner.
  string user_id = 5;

  // Caller-supplied identifier to use for this entry. Lets the caller
  // correlate the same logical memory across the durable index and the
  // semantic backend so a later DeleteMemory(memory_id) removes both. When
  // empty the backend assigns its own id.
  string memory_id = 6;

  // Who asked for this write, for the content policy (WS26-S4): "user" (the
  // person, through the app), "model_tool" (save_memory), "delegation" (a
  // subagent's outcome) or "workflow" (an orchestrator write). Empty, and any
  // other value, is read as "model_tool", so only "user" may write org-wide
  // memory.
  string origin = 7;
}

message IndexMemoryResponse {
  // Assigned memory entry identifier.
  string memory_id = 1;

  // True when local persistence succeeded but Letta synchronization did not.
  bool degraded = 2;

  // Stable machine-readable reason, empty when Letta synchronization is ready.
  string degradation_reason = 3;
}

message MemoryHealthRequest {}

message MemoryHealthResponse {
  // Legacy summary/status code. New callers should use ready + memory_status.
  string status = 1;

  // Whether the configured semantic memory path has been verified ready.
  bool ready = 2;

  // Stable machine-readable semantic memory readiness state.
  string memory_status = 3;
}

message ListMemoryRequest {
  // Tenant context.
  string org_id = 1;

  // Owning user. Required — this RPC is never callable without a target
  // user, so a caller can never enumerate an entire org's memories.
  string user_id = 2;

  // Maximum results. Server clamps to a sane upper bound.
  uint32 limit = 3;
}

message ListMemoryResponse {
  // Matching memory entries, most-recently-updated first.
  repeated MemoryEntry entries = 1;

  // True when the semantic backend could not be reached; index-owned
  // entries are still returned.
  bool degraded = 2;

  // Stable machine-readable reason, empty when nothing is degraded.
  string degradation_reason = 3;

  // Why the user's rows were left out of this list: "user_off" or
  // "org_disabled". Empty when they are listed. Paused is not a reason: a
  // paused user's rows stay visible and deletable.
  string hidden_reason = 4;
}

message DeleteMemoryRequest {
  // Tenant context.
  string org_id = 1;

  // Owning user. A caller may only delete their own memories.
  string user_id = 2;

  // Identifier of the memory entry to delete.
  string memory_id = 3;
}

message DeleteMemoryResponse {
  // True when a durable index record was found and removed.
  bool deleted = 1;

  // True when the semantic backend delete could not be confirmed. The
  // index-owned record is still removed; this only reflects the best-effort
  // downstream cleanup.
  bool degraded = 2;

  // Stable machine-readable reason, empty when nothing is degraded.
  string degradation_reason = 3;
}

// MemoryState — the user's own choice about their memory (build plan WS07 S1).
enum MemoryState {
  MEMORY_STATE_UNSPECIFIED = 0;

  // The default. Memory is used and learned from.
  MEMORY_STATE_ON = 1;

  // Rows stay visible and deletable but are not recalled, and nothing new is
  // learned. What is said while paused is never mined after a resume.
  MEMORY_STATE_PAUSED = 2;

  // As paused, and the user's rows are also hidden from the list.
  MEMORY_STATE_OFF = 3;
}

message GetMemoryControlsRequest {
  // Tenant context.
  string org_id = 1;

  // The user whose controls are read. A user caller may only read their own.
  string user_id = 2;
}

message SetMemoryControlsRequest {
  // Tenant context.
  string org_id = 1;

  // The user whose state is set. Must be the caller.
  string user_id = 2;

  // The new state. UNSPECIFIED is refused.
  MemoryState state = 3;
}

// MemoryControls — the user's state and the one decision every memory reader
// and writer in session-core takes from it. Content-free.
message MemoryControls {
  // The user's stored choice. Always reported, even when the decision below is
  // dominated by org policy or zero data retention.
  MemoryState state = 1;

  // The organization's memory policy: "allow", "disabled" or "unavailable".
  string org_memory_policy = 2;

  // The organization's learning-review policy. Empty until the org policy
  // mirror exists (build plan WS07 S4).
  string org_learning_policy = 3;

  // Whether memory is recalled for this user's turns.
  bool use_allowed = 4;

  // Whether new memory is written for this user.
  bool generation_allowed = 5;

  // Whether this user's completed runs are announced to the learning loop.
  bool learning_allowed = 6;

  // Closed token for what decided the above: "on", "user_paused", "user_off",
  // "org_disabled", "zdr", "policy_unavailable".
  string reason = 7;

  // How many of the user's rows the list hides under this decision (a count,
  // never a row). Zero unless the state is off or the org disabled memory.
  uint32 hidden_rows = 8;

  // When the state last changed; unset for a user who never set it.
  google.protobuf.Timestamp updated_at = 9;
}

message GetMemoryControlsResponse {
  MemoryControls controls = 1;
}

message SetMemoryControlsResponse {
  MemoryControls controls = 1;
}

message ResetMemoryRequest {
  // Tenant context.
  string org_id = 1;

  // The user whose memory is erased. Must be the caller.
  string user_id = 2;

  // Must be true. A reset cannot be undone, so an unset field is a refusal,
  // never a default.
  bool confirm = 3;
}

message ResetMemoryResponse {
  // How many durable rows were erased (current rows and retired ancestors).
  uint32 durable_deleted = 1;

  // Durable rows whose semantic copy could not be confirmed erased. Their reads
  // stay suppressed, because every erased id is recorded as forgotten.
  uint32 semantic_unconfirmed = 2;

  // True when semantic_unconfirmed is not zero.
  bool degraded = 3;

  // Stable machine-readable reason, empty when nothing is degraded.
  string degradation_reason = 4;
}
