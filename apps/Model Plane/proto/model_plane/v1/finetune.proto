syntax = "proto3";

package model_plane.v1;

option go_package = "github.com/triodelab/model-plane/gen/go/model_plane/v1;mpv1";

import "google/protobuf/timestamp.proto";

// FinetuneJobs — persistence + state-machine for fine-tuning lifecycle.
//
// Wave 7 v1: this lives inside session-core (alongside threads/runs/checkpoints
// in the existing Postgres schema). When the lifecycle stabilises and grows
// dataset materialisation, eval orchestration, EOL-watcher, and cost-attribution
// concerns, it extracts into a standalone `train-core` Go service per
// gap-model.md §14.9 PAR-30.
//
// Provider integration (Azure OpenAI Files + Fine-tuning Jobs APIs) lives in
// `model-gateway`. The gateway holds the Azure credentials and runs HTTP calls;
// session-core only owns the job state and emits NATS events on transitions.
service FinetuneJobs {
  // Create a job record after the caller has uploaded training data to the
  // provider (Azure file_id) and kicked off the provider-side job (Azure
  // job_id). Persistence is idempotent on job_id.
  rpc CreateJob(CreateFinetuneJobRequest) returns (FinetuneJob);

  // Fetch a single job by id, scoped by org_id.
  rpc GetJob(GetFinetuneJobRequest) returns (FinetuneJob);

  // List jobs for an org, optionally filtered by agent_id or status.
  rpc ListJobs(ListFinetuneJobsRequest) returns (ListFinetuneJobsResponse);

  // Update job status — used by the polling worker on provider transitions
  // and by the HTTP DELETE handler when a caller cancels.
  rpc UpdateJobStatus(UpdateFinetuneJobStatusRequest) returns (FinetuneJob);

  // List jobs across all orgs that are still in flight (`status` in
  // `queued` or `running`) and have a non-empty `azure_job_id`. Used by the
  // gateway's polling worker on a 60s tick. No org_id filter — the poller
  // is a privileged in-process caller, not an end-user surface.
  rpc ListActiveJobs(ListActiveFinetuneJobsRequest) returns (ListActiveFinetuneJobsResponse);

  // Sum of fine-tuning spend for an org in the current calendar month.
  // Used by the gateway's budget guard before kicking off Azure calls.
  // Returns estimated_cost_usd for in-flight rows + actual_cost_usd for
  // terminal rows so callers always reason about the conservative ceiling.
  rpc GetOrgMonthlySpend(GetOrgMonthlySpendRequest) returns (GetOrgMonthlySpendResponse);
}

// State machine: queued -> running -> (succeeded | failed | cancelled).
// `succeeded` requires a non-empty fine_tuned_model + deployment_name.
message FinetuneJob {
  string job_id = 1;
  string org_id = 2;
  string agent_id = 3;
  string base_model = 4;

  // Provider artefacts.
  string azure_file_id = 5;          // empty until upload completes
  string azure_job_id = 6;           // empty until provider responds
  string fine_tuned_model = 7;       // empty until status=succeeded
  string deployment_name = 8;        // empty until deployment provisioned

  // Lifecycle.
  string status = 9;                  // queued | running | succeeded | failed | cancelled
  string error_message = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  google.protobuf.Timestamp completed_at = 13;

  // Job inputs / accounting.
  string hyperparameters_json = 14;   // raw JSON; empty = provider defaults
  int32 training_example_count = 15;
  double estimated_cost_usd = 16;
  double actual_cost_usd = 17;
  string created_by = 18;             // user_id from JWT claims

  // Hosting SKU tier of the deployment. `developer` ($0/hr, auto-deletes in
  // 24h) on auto-deploy; `production` (paid Standard hosting) after an explicit
  // operator promote. Defaults to `developer`.
  string deployment_tier = 19;        // developer | production
}

message CreateFinetuneJobRequest {
  // Caller supplies the job_id (ULID). The gateway generates it before
  // calling the provider so the row can be persisted before the provider
  // call returns — protects against orphan provider jobs on session-core
  // restart.
  string job_id = 1;
  string org_id = 2;
  string agent_id = 3;
  string base_model = 4;
  string azure_file_id = 5;
  string azure_job_id = 6;
  string hyperparameters_json = 7;
  int32 training_example_count = 8;
  double estimated_cost_usd = 9;
  string created_by = 10;
}

message GetFinetuneJobRequest {
  string job_id = 1;
  string org_id = 2;
}

message ListFinetuneJobsRequest {
  string org_id = 1;
  string agent_id = 2;   // optional; empty = all jobs for org
  int32 limit = 3;       // default 50, max 200
  int32 offset = 4;
  string status = 5;     // optional filter
}

message ListFinetuneJobsResponse {
  repeated FinetuneJob jobs = 1;
  int32 total = 2;
}

message GetOrgMonthlySpendRequest {
  string org_id = 1;
}

message GetOrgMonthlySpendResponse {
  // Sum, in USD, of in-flight estimated_cost_usd + terminal actual_cost_usd
  // for the calling org in the current calendar month (UTC).
  double total_usd = 1;
  // Distinct count of jobs contributing to the sum — helpful for UI surfacing
  // ("3 jobs this month, $42 of $50 budget used").
  int32 job_count = 2;
}

message ListActiveFinetuneJobsRequest {
  // Soft cap on the number of rows returned per poll. The handler clamps to
  // a server-side maximum (default 500) to bound work per tick. 0 = use default.
  int32 limit = 1;
}

message ListActiveFinetuneJobsResponse {
  repeated FinetuneJob jobs = 1;
}

message UpdateFinetuneJobStatusRequest {
  string job_id = 1;
  string org_id = 2;
  string status = 3;
  string error_message = 4;
  string fine_tuned_model = 5;
  string deployment_name = 6;
  double actual_cost_usd = 7;
  // When true the server stamps completed_at = now() and persists. Set on
  // any terminal state (succeeded/failed/cancelled).
  bool set_completed = 8;
  // New deployment tier (developer | production). Empty = leave unchanged.
  // The promote route sets this alongside deployment_name when an operator
  // provisions a paid production deployment.
  string deployment_tier = 9;
}
