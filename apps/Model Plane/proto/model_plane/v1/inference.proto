syntax = "proto3";

package model_plane.v1;

option go_package = "github.com/triodelab/model-plane/gen/go/model_plane/v1;mpv1";

// InferenceCore — provider routing execution for LLMs.
// Owns: model routing, structured output, retries, fallback, token streaming, caching.
// Stateless except in-memory prompt cache.
// Does NOT own: tool loop, session authority.
service InferenceCore {
  // Unary inference — returns the complete response.
  // Optional gRPC metadata `cache-control: no-store` bypasses both reads and
  // writes of the completed-response cache. The server acknowledges it with
  // the same response metadata. It does not alter provider prefix caching,
  // authentication, routing, budget or ZDR/privacy restrictions.
  rpc Infer(InferRequest) returns (InferResponse);

  // Streaming inference — returns token-by-token chunks.
  rpc InferStream(InferRequest) returns (stream InferChunk);

  // Embedding generation — provider-facing only. Vector storage and retrieval
  // remain Data Plane responsibilities.
  rpc CreateEmbedding(CreateEmbeddingRequest) returns (CreateEmbeddingResponse);

  // Model catalogue for routing, capability discovery, and compatibility checks.
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);

  // Text-to-speech synthesis through the provider routing layer.
  rpc SynthesizeSpeech(SynthesizeSpeechRequest) returns (SynthesizeSpeechResponse);

  // Speech-to-text transcription through the provider routing layer.
  rpc TranscribeSpeech(TranscribeSpeechRequest) returns (TranscribeSpeechResponse);

  // Provider voice catalogue for TTS UI/client discovery.
  rpc ListSpeechVoices(ListSpeechVoicesRequest) returns (ListSpeechVoicesResponse);

  // Text translation through provider-backed translation services.
  rpc TranslateText(TranslateTextRequest) returns (TranslateTextResponse);

  // Batch text translation through provider-backed translation services.
  rpc BatchTranslateText(BatchTranslateTextRequest) returns (BatchTranslateTextResponse);

  // Detect the language of a text string.
  rpc DetectTextLanguage(DetectTextLanguageRequest) returns (DetectTextLanguageResponse);

  // Supported languages for provider-backed translation.
  rpc ListTranslationLanguages(ListTranslationLanguagesRequest) returns (ListTranslationLanguagesResponse);

  // Generate images through provider-backed image models.
  rpc GenerateImage(GenerateImageRequest) returns (GenerateImageResponse);

  // Analyze an image with a multimodal vision model.
  rpc AnalyzeImage(AnalyzeImageRequest) returns (AnalyzeImageResponse);

  // Extract text from an image with a vision/OCR provider.
  rpc ExtractImageText(ExtractImageTextRequest) returns (ExtractImageTextResponse);

  // Analyze a document with a provider-backed document intelligence model.
  rpc AnalyzeDocument(AnalyzeDocumentRequest) returns (AnalyzeDocumentResponse);

  // Analyze text with provider-backed language analytics.
  rpc AnalyzeLanguage(AnalyzeLanguageRequest) returns (AnalyzeLanguageResponse);

  // Create a provider-backed realtime session client secret.
  rpc CreateRealtimeSession(CreateRealtimeSessionRequest) returns (CreateRealtimeSessionResponse);

  // Create a provider-backed video generation job.
  rpc CreateVideoGenerationJob(CreateVideoGenerationJobRequest) returns (CreateVideoGenerationJobResponse);

  // Get provider-backed video generation job status.
  rpc GetVideoGenerationJob(GetVideoGenerationJobRequest) returns (GetVideoGenerationJobResponse);

  // Stream generated video content through the provider credential boundary.
  rpc StreamVideoGenerationContent(StreamVideoGenerationContentRequest) returns (stream StreamVideoGenerationContentResponse);

  // What the caller's organisation allows this caller to use (ADR-0005).
  // inference-core is the only enforcement point and the only service that
  // reads the policy, so model-gateway asks here instead of keeping a second
  // cache. The answer is about chat models; every other modality passes
  // unfiltered. Under MODEL_ENTITLEMENT_MODE=off nothing is resolved and the
  // answer says it is not enforced.
  rpc GetModelAccess(GetModelAccessRequest) returns (GetModelAccessResponse);
}

// PrivacyTier — programmatic privacy posture of a provider/deployment,
// ordered weakest→strongest so callers express a MINIMUM and enforcement is a
// plain `>=`. Mirrors Venice's per-model privacy controls: the catalogue
// discloses each model's tier, and a request requiring a tier the active
// providers cannot meet fails closed with a typed error — never a silent
// downgrade. Retention (zdr/supports_zdr) and geography (residency) are
// independent axes; the tier combines them.
enum PrivacyTier {
  // No constraint expressed. Byte-identical behavior to pre-tier requests.
  PRIVACY_TIER_UNSPECIFIED = 0;
  // No residency/ZDR commitment accepted beyond provider default.
  PRIVACY_TIER_GLOBAL = 1;
  // ML processing committed to the EU/EEA (Azure DataZone/regional EU).
  PRIVACY_TIER_EU_RESIDENT = 2;
  // EU residency plus an independently verified Zero-Data-Retention contract.
  PRIVACY_TIER_ZDR_CONTRACTUAL = 3;
  // Processed and stored in Norway on Norwegian-operated infrastructure,
  // with a verified ZDR contract.
  PRIVACY_TIER_SOVEREIGN = 4;
}

// ReasoningEffort — the canonical reasoning-effort ladder, weakest first.
//
// One ordered set of levels the caller asks for and the catalogue advertises
// (`ModelInfo.effort_levels` carries the lowercase names). inference-core
// clamps a requested level to the nearest level the serving model supports
// rather than failing, so a level is a request, not a guarantee.
enum ReasoningEffort {
  // No level requested. The legacy `thinking_budget_tokens` (if any) decides.
  REASONING_EFFORT_UNSPECIFIED = 0;
  // The least reasoning the model supports.
  REASONING_EFFORT_MINIMAL = 1;
  // A little reasoning; the fast default for quick answers.
  REASONING_EFFORT_LOW = 2;
  // Moderate reasoning.
  REASONING_EFFORT_MEDIUM = 3;
  // Deep reasoning for hard problems.
  REASONING_EFFORT_HIGH = 4;
  // Deeper than high, where the model supports it.
  REASONING_EFFORT_XHIGH = 5;
  // The most reasoning the model supports.
  REASONING_EFFORT_MAX = 6;
}

// InferPurpose — what a call is for. The closed vocabulary behind the `purpose`
// metrics label; a call names exactly one. A side task names its own purpose
// (title, follow-ups, judge) rather than the answer it accompanies. Owner: EP-13 S3.
enum InferPurpose {
  // No purpose named. Counted as `unspecified`.
  INFER_PURPOSE_UNSPECIFIED = 0;
  // The user-visible answer to a chat turn.
  INFER_PURPOSE_ANSWER = 1;
  // A model round that decides or runs a tool inside a chat turn.
  INFER_PURPOSE_TOOL_ROUND = 2;
  // A round of a governed Do run.
  INFER_PURPOSE_AGENT_ROUND = 3;
  // The sidebar title of a thread.
  INFER_PURPOSE_TITLE = 4;
  // The follow-up questions offered after an answer.
  INFER_PURPOSE_FOLLOW_UPS = 5;
  // Whether retrieved sources back an answer.
  INFER_PURPOSE_VERIFICATION_JUDGE = 6;
  // The plan of a deep research run.
  INFER_PURPOSE_RESEARCH_PLAN = 7;
  // The report of a deep research run.
  INFER_PURPOSE_RESEARCH_SYNTHESIS = 8;
  // The summary that replaces compacted thread history.
  INFER_PURPOSE_COMPACTION_SUMMARY = 9;
  // Facts extracted from a conversation for the memory store.
  INFER_PURPOSE_MEMORY_EXTRACTION = 10;
  // Whether a candidate memory duplicates or updates an existing one.
  INFER_PURPOSE_MEMORY_GROUNDING = 11;
  // The browser planner choosing the next action.
  INFER_PURPOSE_BROWSER_PLANNER = 12;
  // Screening of content for injected instructions.
  INFER_PURPOSE_SAFETY_SCREEN = 13;
  // Checking an answer or artifact against its sources or its length.
  INFER_PURPOSE_VALIDATION = 14;
  // Cleaning up a dictated transcript.
  INFER_PURPOSE_DICTATION_CLEANUP = 15;
  // One round of a scheduled run.
  INFER_PURPOSE_SCHEDULED_ROUND = 16;
}

// InferRequest — a single inference request to be routed to a provider.
message InferRequest {
  // Client-supplied request identifier for tracing.
  string request_id = 1;

  // Tenant identifier.
  string org_id = 2;

  // Requested model (e.g. "claude-sonnet-5-5", "gpt-4o").
  string model = 3;

  // Optional provider hint: "anthropic", "openai", etc.
  string provider_hint = 4;

  // Conversation messages for the inference call.
  repeated ChatMessage messages = 5;

  // Sampling temperature (0.0 - 1.0).
  float temperature = 6;

  // Maximum tokens to generate.
  int32 max_tokens = 7;

  // Optional JSON Schema for structured output conformance.
  string structured_output_schema = 8;

  // Zero Data Retention mode. When true, inference results are not cached or logged durably.
  bool zdr = 9;

  // chat-parity §2 function-calling: tool/function definitions the model may
  // call. Empty → no tools offered (plain text completion, unchanged).
  repeated ToolDefinition tools = 10;

  // Tool selection policy: "auto" (default), "none", "required", or a specific
  // tool name. Empty is treated as "auto" when `tools` is non-empty.
  string tool_choice = 11;

  // Minimum privacy tier every serving provider must satisfy. Providers below
  // the tier are skipped in every chain path; when none remains, the request
  // fails with a typed precondition naming this tier — never a silent
  // downgrade. UNSPECIFIED imposes no constraint.
  // NOTE: field numbers 12–13 are reserved by a parallel in-flight contract
  // (`min_residency`, `thinking_budget_tokens`); this lands at 14 so the two
  // streams merge without renumbering.
  PrivacyTier min_privacy_tier = 14;
  // Requested minimum residency floor for this call (e.g. "eu", "norway").
  // inference-core enforces this deny-by-default at the provider-selection
  // gate: a provider whose declared residency is weaker than this floor is
  // skipped, the same way a non-ZDR provider is skipped when `zdr` is true
  // (see provider/fallback.rs's infer_one_model/stream_one_model). Empty
  // means no floor -- any configured provider may serve the request.
  // Accepted tokens match `Residency::parse` ("global", "eu"/"eea", "norway"/
  // "no"/"sovereign"); an unrecognized token is rejected before any provider
  // is tried, rather than silently treated as "no requirement".
  string min_residency = 12;

  // Extended-thinking budget in tokens for this request. 0 (default) requests
  // no thinking and is byte-identical to the pre-existing behaviour.
  //
  // Advisory, not a guarantee: inference-core forwards it only to models that
  // actually accept a thinking parameter, because sending one to a model that
  // does not is a hard provider error, not a silent no-op. A budget set for a
  // model that cannot think is dropped and the request proceeds normally.
  int32 thinking_budget_tokens = 13;

  // Opaque, user-owned subscription connection selected in Integration Core.
  // It is meaningful only with provider_hint "openai-codex-subscription";
  // Model Plane forwards it to the broker but never receives a ChatGPT OAuth
  // access or refresh token.
  string subscription_connection_id = 15;

  // Request the subscription broker's priority service tier when available.
  // This is independent of reasoning effort and never changes the selected
  // model, provider, privacy floor or subscription connection. Other providers
  // ignore it; unsupported subscription models stay on their normal tier.
  bool prefer_priority_service_tier = 16;

  // Canonical reasoning-effort level for this request. UNSPECIFIED (default)
  // leaves the decision to the legacy `thinking_budget_tokens` (field 13),
  // which stays as an input so an older caller is byte-identical to before.
  // When both are set the level wins and the budget is ignored: the level, not
  // a token count, is what inference-core renders for each provider.
  //
  // A value this build does not know is rejected with `invalid_argument`
  // rather than treated as UNSPECIFIED, so a newer caller never has its
  // request silently weakened. Effort is a request parameter only and is never
  // persisted, so it needs no Zero Data Retention handling.
  ReasoningEffort reasoning_effort = 17;

  // Which leading messages are standing text a provider may cache across
  // turns. Absent (default) names none, and a request without it is sent to the
  // provider exactly as before. Only the Anthropic adapter reads it, and only
  // when INFERENCE_ANTHROPIC_TIERED_SYSTEM is on and the request is not Zero
  // Data Retention; every other provider and every ZDR request ignores it.
  // A plan that does not describe the request (counts past the message list, or
  // a counted message that is not a system message) is ignored, never an error:
  // it is a hint about layout, not an instruction. It carries counts only.
  PromptTierPlan prompt_tiers = 18;

  // Provider prompt-cache routing key for this conversation: the first 32 hex
  // characters of blake3 over the org and thread ids (mp-contracts
  // `prompt_tier::cache_scope_key`), with `:sub` appended for a delegated
  // subagent. Empty (default) names no scope and is sent exactly as before. It is
  // derived from identifiers only, never from message content: inference-core
  // sends it to a provider only behind INFERENCE_OPENAI_PROMPT_CACHE_KEY, and
  // never on a Zero Data Retention request.
  string cache_scope_key = 19;

  // Images that ride with the messages, by index into `messages` as sent (the
  // original list, system messages included). Empty (default) is a text-only
  // request and is sent to the provider exactly as before.
  //
  // At most 4, each within the image size cap, an allowlisted mime type, and
  // each on a `user` message; anything else is rejected with `invalid_argument`
  // before a provider is chosen. A request that carries images is served only
  // by a provider and model that accept them: where none does it fails with
  // `FAILED_PRECONDITION` and the kind `vision_unsupported`, never by dropping
  // the images. The bytes are request-scope memory only: never cached, never
  // logged, and a field of the internal request that the Debug output redacts.
  repeated InferImagePart image_parts = 20;

  // What this call is for (owner: EP-13 S3). Labels the inference metrics by
  // purpose and routes nothing. UNSPECIFIED, and any value this build does not
  // know, count as `unspecified`, so an older caller and a newer one both work.
  // It carries no content, so Zero Data Retention does not change it.
  InferPurpose purpose = 21;

  // The model the turn itself was served by (EP-13 S4). Read only when `model`
  // is `verevon-role`: the role table tries its own candidates first, then this
  // model, then the cheap fallback. Empty names none. It carries no content, so
  // Zero Data Retention does not change it.
  string role_fallback_model = 23;
}

// InferImagePart — one image attached to a message of an InferRequest. Bytes
// only: a URL is never fetched on the caller's behalf.
message InferImagePart {
  // Index of the message this image belongs to, in `InferRequest.messages` as
  // sent. Must name a `user` message.
  uint32 message_index = 1;
  // The raw image bytes (not base64).
  bytes data = 2;
  // Media type of `data`: image/png, image/jpeg, image/webp or image/gif.
  string mime_type = 3;
}

// PromptTierPlan — the Stable and Context tiers of a prompt, by message count
// from index 0 (see mp-contracts `prompt_tier`). Stable is the standing platform
// text; Context is text authored for the org, Space, persona and user.
message PromptTierPlan {
  // Leading messages in the Stable tier.
  uint32 stable_messages = 1;
  // Messages in the Context tier, directly after the Stable ones.
  uint32 context_messages = 2;
}

// ToolDefinition — a function the model may call (chat-parity §2).
message ToolDefinition {
  // Function name (e.g. "search_web").
  string name = 1;
  // Human/model-readable description of what the tool does.
  string description = 2;
  // JSON Schema (as a JSON string) describing the tool's parameters.
  string parameters_json = 3;
}

// ToolCall — a model-requested tool invocation (chat-parity §2).
message ToolCall {
  // Provider-assigned call id (echoed back with the result).
  string id = 1;
  // Name of the tool to invoke.
  string name = 2;
  // JSON-encoded arguments object.
  string arguments_json = 3;
}

// ChatMessage — a single message in the conversation.
message ChatMessage {
  // Role: "user", "assistant", "system".
  string role = 1;

  // Text content.
  string content = 2;

  // Optional participant name.
  string name = 3;
  // Provider-native context checkpoint, never visible answer text. Anthropic
  // consumes this only on assistant messages when compaction is supported and
  // enabled. Preserve original history for rollback and other providers.
  string compaction_summary = 4;
}

// InferResponse — complete inference result.
// TokenConfidence — the provider's own per-token probabilities for a
// completion, summarized.
//
// OpenAI-family chat completions return a `logprob` for every token the model
// actually emitted (request-side `logprobs: true`). That is the only signal in
// the stack that reports how sure the MODEL was, as opposed to how well-backed
// the answer was by our own evidence: "Oslo." as the capital of Norway is
// near-certain token by token, while a guessed figure is not, and both look
// identical to a heuristic reading the finished text.
//
// Summarized rather than forwarded verbatim: the per-token array is the
// answer's shape in probability space and is both large and re-identifying,
// and no consumer needs more than the aggregate. Absent (unset) whenever the
// serving provider does not report logprobs — Anthropic never does, and
// reasoning models reject the request parameter — so consumers must treat a
// missing message as "unknown", never as "low".
message TokenConfidence {
  // Number of answer tokens the summary covers. 0 means no usable logprobs
  // arrived; treat the whole message as absent.
  uint32 token_count = 1;

  // Mean natural-log probability across those tokens. `exp(mean_logprob)` is
  // the geometric-mean per-token probability: ~1.0 when every token was the
  // obvious one, falling as the model chose between real alternatives. Always
  // <= 0.
  double mean_logprob = 2;

  // The same statistic over the answer's CLAIM tokens only: those that carry
  // content and do not echo the question. "Hovedstaden i Portugal er" is
  // near-certain whatever the answer, because it restates the prompt; the one
  // token that asserts anything is "Lisboa". Averaging the two together lets
  // confident framing hide an invented claim, which is measurably what
  // happened — over the same answers, the whole-answer mean put fabrications
  // (0.63-0.78) inside the range of correct prose (0.69), while this statistic
  // put them at 0.00-0.22 against 0.60-1.00 for correct content.
  //
  // 0 / unset when the answer was entirely framing (or the provider reported
  // no usable tokens); consumers fall back to `mean_logprob`.
  uint32 claim_token_count = 3;
  double claim_mean_logprob = 4;
}

message InferResponse {
  // Echoed request identifier.
  string request_id = 1;

  // Generated content.
  string content = 2;

  // Model that actually served the request.
  string model_used = 3;

  // Why generation stopped: "end_turn", "max_tokens", "stop_sequence".
  string stop_reason = 4;

  // Token counts for usage tracking.
  int32 input_tokens = 5;
  // Number of generated tokens.
  int32 output_tokens = 6;

  // chat-parity §2: tool calls the model requested (empty for a plain answer).
  repeated ToolCall tool_calls = 7;

  // Registry id of the provider that served the request (e.g. "azure-openai").
  // Empty means unknown/not applicable. Provenance-receipt input (Phase 4):
  // lets callers stamp which deployment actually processed content.
  string provider_used = 8;

  // Residency label of the serving deployment: "global", "eu", or "norway".
  // Empty means undeclared. Disclosure only — the tier that was REQUIRED is
  // carried by the request; this reports what was actually met.
  string residency = 9;

  // The serving model's own token-level certainty, when it reports logprobs.
  // Unset means unknown — see TokenConfidence.
  TokenConfidence token_confidence = 10;

  // Prompt-cache telemetry (cache-token observability prerequisite for the
  // native-compaction migration): tokens served from the provider's prompt
  // cache, and tokens newly written to it by this request. Both are 0 when
  // the request was not cached (or the serving provider does not support
  // prompt caching) — never absent-vs-zero ambiguous, since proto3 scalars
  // have no separate "unset". `input_tokens` above already folds both legs
  // back in (see inference-core's `total_input_tokens`), so these two are
  // additive detail, not a different total.
  int32 cache_read_input_tokens = 11;
  int32 cache_creation_input_tokens = 12;
  string compaction_summary = 13;

  // Where inference-core's share of this call's wall time went. Set on every
  // successful response; unset from a server that predates the field. See
  // ProviderTiming.
  ProviderTiming provider_timing = 14;

  // What the budget did to how this call was routed (WS27-S7), when the intent
  // layer routed it under a budget posture. Absent for a pinned model or while
  // INFERENCE_ROUTE_NOTE is off.
  RouteNote route_note = 15;
}

// InferChunk — a single chunk in a streaming inference response.
message InferChunk {
  // Echoed request identifier.
  string request_id = 1;

  // Incremental content delta.
  string delta = 2;

  // True when this is the final chunk.
  bool done = 3;

  // Model that served the request (populated on final chunk).
  string model_used = 4;

  // Token counts (populated on final chunk).
  int32 input_tokens = 5;
  // Number of generated tokens on the final chunk.
  int32 output_tokens = 6;

  // Serving-provider provenance (populated on final chunk). Same semantics as
  // InferResponse.provider_used / InferResponse.residency — Phase-4 receipt
  // inputs for streamed turns. Field numbers 7–8 are reserved by a parallel
  // in-flight contract (`stop_reason`, `reasoning_delta`).
  string provider_used = 9;
  string residency = 10;
  // Why generation stopped (populated on the final chunk): "end_turn",
  // "max_tokens"/"length" (provider-dependent spelling for hitting the token
  // ceiling), "stop_sequence", or "stream_incomplete" -- inference-core's own
  // value, set ONLY when the provider connection broke or closed before any
  // proper termination signal (message_stop / finish_reason / [DONE]) arrived,
  // so a silently truncated streamed answer is never indistinguishable from a
  // normal completion. Empty on every non-final chunk.
  string stop_reason = 7;

  // Incremental extended-thinking text, when the model produced any. Carried
  // separately from `delta` so a client can render, hide, or drop the model's
  // reasoning independently of its answer -- and so reasoning can never be
  // concatenated into the answer by a client that does not know about it.
  string reasoning_delta = 8;

  // Token-level certainty for the whole streamed answer, accumulated across
  // the stream and populated ONLY on the final chunk (same rule as the token
  // counts and provenance above). Unset means unknown — see TokenConfidence.
  TokenConfidence token_confidence = 11;

  // Prompt-cache telemetry (populated on the final chunk only, same rule as
  // `input_tokens`/`output_tokens` above): tokens served from the provider's
  // prompt cache, and tokens newly written to it by this request. See
  // InferResponse.cache_read_input_tokens / cache_creation_input_tokens for
  // the full semantics — this is the streaming-path counterpart, previously
  // the actual telemetry gap (the unary `InferResponse` path already logged
  // these at the adapter, but neither path had them on the wire until now).
  int32 cache_read_input_tokens = 12;
  int32 cache_creation_input_tokens = 13;
  // Complete checkpoint on the final chunk only; never an answer delta.
  string compaction_summary = 14;

  // Where inference-core's share of this stream's wall time went, populated on
  // the final chunk only (same rule as the token counts above). Unset on every
  // non-final chunk. See ProviderTiming.
  ProviderTiming provider_timing = 15;

  // The route note of the call, on the final chunk only, as provider_timing is
  // (WS27-S7). Absent for a pinned model or while INFERENCE_ROUTE_NOTE is off.
  RouteNote route_note = 16;
}

// ProviderTiming — where inference-core's share of one Infer or InferStream
// call's wall time went. Durations and counts only: it never carries prompt
// text, content, tool arguments or tool results, so it is safe to log and to
// forward on zero-data-retention and temporary turns.
//
// Every duration is whole milliseconds (truncated) on inference-core's
// monotonic clock, measured from one of two origins; each field names its own:
//   - the handler origin: the gRPC handler's entry, before authorization;
//   - the attempt origin: the start of the provider attempt that finally
//     served the call.
// A caller's transport overhead is its own wall time for the call minus
// `handler_ms`. inference-core's own overhead is `handler_ms` minus
// `provider_ms`, `failed_attempts_ms` and `retry_wait_ms`.
message ProviderTiming {
  // From the handler origin until the response was ready (unary) or the final
  // chunk was forwarded (stream).
  uint64 handler_ms = 1;

  // From the handler origin until the first provider attempt started:
  // authorization, intent resolution, the response-cache lookup and the
  // routing gates. On a response-cache hit, until the cached response was
  // found, since no attempt starts.
  uint64 routing_ms = 2;

  // From the attempt origin until the provider's answer was complete: the
  // returned response (unary) or the final chunk (stream, so it includes
  // `accept_ms` and the whole streamed generation). 0 on a response-cache hit.
  uint64 provider_ms = 3;

  // Streams only: from the attempt origin until the provider accepted the
  // stream, which is when its response headers arrived. 0 for unary calls.
  uint64 accept_ms = 4;

  // Streams only: from the attempt origin until the first non-empty content
  // or reasoning delta. 0 when none arrived, and for unary calls.
  uint64 first_token_ms = 5;

  // Provider calls made for this request, the serving one included. 0 on a
  // response-cache hit.
  uint32 attempts = 6;

  // Summed duration of the provider attempts that failed before the serving
  // one: errors, rate limits and prompt-too-long rejections.
  uint64 failed_attempts_ms = 7;

  // Time spent honoring a provider's retry-after before walking the providers
  // a second time.
  uint64 retry_wait_ms = 8;

  // True when the response came from inference-core's completed-response
  // cache and no provider was called.
  bool response_cache_hit = 9;

  // False when the provider reported no token usage (both token counts 0),
  // which is how the Codex subscription broker reports today. The token
  // counts then mean "unknown", not "free".
  bool usage_reported = 10;

  // Durations an upstream reported about its own phases, keyed by phase name
  // (for example a subscription broker's process start). Empty when the
  // upstream reports none, which is every provider today.
  map<string, uint64> upstream_ms = 11;
}

// RouteNote — what the budget did to one Verevon-routed call (WS27-S7). Shared
// with WS11's applied-effort report. Closed tokens and booleans only: never a
// price, a count or a model name, so it is safe to log and to forward on
// zero-data-retention turns.
message RouteNote {
  // The org's budget posture when the call was routed: "healthy",
  // "constrained", "exhausted", or "unknown" when no posture could be read.
  string budget_posture = 1;

  // True when a constrained budget moved the call one tier cheaper: the same
  // policy at a healthy budget would have answered with another model.
  bool tier_shifted = 2;

  // True when an exhausted budget forced the cheap fallback model.
  bool cheap_fallback_forced = 3;

  // The effort level the budget clamped the call to, when it did. Empty when
  // the budget left the requested effort alone.
  string applied_effort = 4;

  // The role-table purpose whose entry chose the model, for a `verevon-role`
  // call (EP-13 S4): "title", "follow_ups", "verification_judge" or
  // "research_plan". Empty when no table entry chose the model, that is when the
  // turn's own model or the cheap fallback did, and for every other call.
  string role = 5;

  // Which step of the `verevon-role` resolution chose the model (EP-13 S4):
  // "table", "turn_model" or "cheap_fallback". Empty for every call that named
  // no role.
  string role_source = 6;
}

// CreateEmbeddingRequest — text to embed via a provider-owned model/deployment.
message CreateEmbeddingRequest {
  // Client-supplied request identifier for tracing.
  string request_id = 1;

  // Tenant identifier.
  string org_id = 2;

  // Text to embed.
  string text = 3;

  // Requested model/deployment (e.g. "text-embedding-3-large").
  string model = 4;

  // Optional provider hint: "openai", "azure-openai", etc.
  string provider_hint = 5;

  // Zero Data Retention; the content must not egress to a retaining provider.
  // An EU/ZDR embedding provider is a Phase-4 prerequisite — this field does
  // NOT by itself satisfy residency (both provider paths still default to
  // Azure today). It is plumbing for that future provider plus the
  // direct-Azure egress reject enforced on the Data Plane.
  bool zdr = 6;

  // Requested/required residency region for the embedding deployment (e.g.
  // "swedencentral", "westeurope"). inference-core enforces this deny-by-default:
  // a non-EU region is REJECTED before any network call unless the operator has
  // explicitly opted in via MODEL_PLANE_ALLOW_NON_EU_EMBEDDING. Empty means the
  // caller expresses no preference and the configured EU deployment is used.
  string region = 7;
}

// CreateEmbeddingResponse — generated vector and serving metadata.
message CreateEmbeddingResponse {
  // Echoed request identifier.
  string request_id = 1;

  // Embedding vector.
  repeated float vector = 2;

  // Model/deployment that served the request.
  string model_used = 3;

  // Provider that served the request.
  string provider_used = 4;
}

// ListModelsRequest — model catalogue filter.
message ListModelsRequest {
  // Optional modality: "chat", "embedding", "speech", "image", etc.
  string modality = 1;

  // Optional provider filter.
  string provider = 2;
}

// ModelInfo — provider model/deployment metadata.
message ModelInfo {
  // Model or deployment identifier.
  string id = 1;

  // Provider identifier.
  string provider = 2;

  // Modality served by the model.
  string modality = 3;

  // Whether the model supports streaming responses.
  bool streaming = 4;

  // chat-parity §2 per-model feature flags: the rich-event / capability
  // families this model supports, derived from the provider's
  // ProviderCapabilities (e.g. "reasoning", "tools", "vision", "image").
  // Lets the client gate the opt-in `features[]` per selected model.
  repeated string features = 5;

  // Strongest privacy tier this provider can honor (Venice model_spec.privacy
  // equivalent). Derived from the provider's declared residency plus its ZDR
  // attestation; UNSPECIFIED means the provider declares no posture.
  PrivacyTier privacy_tier = 6;

  // Declared residency label: "global", "eu", or "norway". Empty means the
  // provider declares no residency commitment.
  string residency = 7;

  // Reasoning-effort levels this model accepts, weakest first, as the
  // lowercase canonical names ("minimal", "low", "medium", "high", "xhigh",
  // "max"). Empty means the model has no effort control or the provider does
  // not advertise one yet; a client must offer no effort choice in that case.
  repeated string effort_levels = 8;

  // Context window of the model in tokens, lowered to the serving surface's own
  // ceiling. 0 means no sourced record names the model (EP-13 S2).
  uint32 context_window_tokens = 9;

  // Largest synchronous output in tokens this model is served at on this surface.
  // 0 means no sourced record names the model (EP-13 S2).
  uint32 max_output_tokens = 10;

  // Vendor lifecycle stage: "ga", "preview" or "deprecated". Empty means no sourced
  // record names the model (EP-13 S2).
  string lifecycle = 11;
}

// ListModelsResponse — available models in the active provider chain.
message ListModelsResponse {
  // Matching models.
  repeated ModelInfo models = 1;

  // What the caller's organisation policy did to this catalogue. Absent when
  // entitlement is off (MODEL_ENTITLEMENT_MODE=off) and for a service caller,
  // so a response without it is byte-identical to one from before the policy
  // existed.
  ModelAccessMeta access = 2;
}

// ModelAccessMeta — the entitlement facts that travel with a model catalogue.
// Carries model ids' counts and policy defaults only, never content.
message ModelAccessMeta {
  // Which layer of the policy answered: "none" (no policy, unrestricted),
  // "org" (organisation default), "role" (a role override) or
  // "member_not_found" (the caller is not an active member, so nothing is
  // allowed).
  string state = 1;

  // Whether the policy is applied to this caller. False under shadow mode: the
  // catalogue is then unfiltered and the policy only counted.
  bool enforced = 2;

  // Revision of the organisation's policy set the answer was read at. Zero
  // means no policy was ever written.
  int64 revision = 3;

  // Whether the policy limits anything: a model list, a ceiling or a minimum
  // privacy tier.
  bool restricted = 4;

  // How many chat models the policy removed from this catalogue. Zero unless
  // `enforced`.
  uint32 hidden_count = 5;

  // The model a chat surface starts with when the caller names none. Empty
  // when the policy sets none.
  string default_model = 6;

  // The effort a chat surface starts with, as a canonical effort name. Empty
  // when the policy sets none.
  string default_effort = 7;

  // The highest reasoning effort the policy allows, as a canonical effort
  // name. Empty means no ceiling.
  string max_effort = 8;
}

// SurfaceDefault — what one product surface starts with when the caller names
// nothing. Surfaces are lowercase names such as "chat".
message SurfaceDefault {
  // Model id the surface starts with. Empty means the platform default.
  string model = 1;

  // Canonical effort name the surface starts with. Empty means none.
  string effort = 2;
}

// ModelPolicyDoc — a model entitlement policy in the shape org-core stores
// (ADR-0005). It holds model ids, an effort name, a privacy tier and per-surface
// defaults, and nothing else, so it carries no content.
message ModelPolicyDoc {
  // "all" or "listed". Anything but "all" is read as "listed".
  string allow_mode = 1;

  // Models allowed in "listed" mode: exact lower-case ids or "provider:<id>"
  // selectors. There are no patterns.
  repeated string allow = 2;

  // Models denied in either mode, in the same form. A deny wins over an allow.
  repeated string deny = 3;

  // Highest reasoning effort allowed, as a canonical effort name. Empty means
  // no ceiling.
  string max_effort = 4;

  // Weakest privacy tier a request under this policy may be served at.
  // UNSPECIFIED imposes no minimum.
  PrivacyTier min_privacy_tier = 5;

  // Per-surface starting points, keyed by surface name.
  map<string, SurfaceDefault> defaults = 6;
}

// GetModelAccessRequest — ask what a caller may use.
message GetModelAccessRequest {
  // Client-supplied request identifier for tracing.
  string request_id = 1;

  // Tenant identifier. Must match the verified credential.
  string org_id = 2;

  // A model to judge. Empty asks for the policy alone.
  string model = 3;

  // Provider the model is served by, for "provider:<id>" entries. Empty lets
  // inference-core look the model up in its catalogue.
  string provider_hint = 4;

  // Surface whose defaults to return, such as "chat". Empty returns none.
  string surface = 5;

  // A policy to judge instead of the stored one: the write guard asks what an
  // admin's draft would leave. Needs a caller that can manage the policy.
  ModelPolicyDoc draft = 6;

  // Return one verdict per chat model in the catalogue. Needs a caller that can
  // manage the policy.
  bool include_catalogue = 7;
}

// GetModelAccessResponse — what the caller's organisation allows.
message GetModelAccessResponse {
  // Echo of the request identifier.
  string request_id = 1;

  // Which layer of the policy answered; see ModelAccessMeta.state.
  string state = 2;

  // Whether the policy is applied to this caller: the mode is "enforce" and the
  // caller is a user, not a service.
  bool enforced = 3;

  // Revision of the policy set the answer was read at.
  int64 revision = 4;

  // The caller's role in the organisation. Empty for a service caller or a
  // non-member.
  string role = 5;

  // Whether the policy limits anything; see ModelAccessMeta.restricted.
  bool restricted = 6;

  // Whether `model` is allowed. True when `model` is empty or nothing is
  // restricted.
  bool model_allowed = 7;

  // Why `model` is not allowed: a refusal reason name such as
  // "not_in_allow_list" or "explicitly_denied". Empty when allowed.
  string reason = 8;

  // The surface's default model, when the policy sets one.
  string default_model = 9;

  // The surface's default effort, when the policy sets one.
  string default_effort = 10;

  // Highest reasoning effort allowed. Empty means no ceiling.
  string max_effort = 11;

  // Weakest privacy tier a request may be served at.
  PrivacyTier min_privacy_tier = 12;

  // Whether the caller may change the organisation's policy.
  bool can_manage = 13;

  // One verdict per chat model, when `include_catalogue` was set.
  repeated ModelAccessEntry catalogue = 14;
}

// ModelAccessEntry — the verdict on one chat model.
message ModelAccessEntry {
  // Model id.
  string id = 1;

  // Provider that serves it.
  string provider = 2;

  // Whether the policy allows it.
  bool entitled = 3;

  // Why not, as a refusal reason name. Empty when entitled.
  string reason = 4;

  // Whether the model's deployment carries a zero-retention attestation for
  // chat. It is a fact about the deployment, not the policy: the policy decides
  // whether the caller may use the model, this says whether the model could
  // serve a zero-retention turn at all.
  bool zdr_attested = 5;
}

// SynthesizeSpeechRequest — text-to-speech request routed to a speech provider.
