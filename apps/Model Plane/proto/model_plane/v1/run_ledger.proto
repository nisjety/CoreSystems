syntax = "proto3";

package model_plane.v1;

import "model_plane/v1/inference.proto";

option go_package = "github.com/triodelab/model-plane/gen/go/model_plane/v1;mpv1";

// RunLedgerService: what a run did and what its model calls were sent (EP-14).
//
// session-core owns the store. This file starts with the request snapshot
// write (EP-14 S6); the run timing read (S5) and the request inspector read
// (S7) join this service as additive RPCs.
//
// A request snapshot records, for one model call of a persistent run, the
// system prompt, the tool catalogue, the parameters, the routed model and a
// manifest of the messages (role, source tag, length, digest, never the body).
// Only inference-core writes it, behind the provider call. A ZDR or waived run
// stores nothing: inference-core never sends one, and session-core refuses one
// with `zdr_durable_mutation_forbidden`. The writer is refused with
// FAILED_PRECONDITION unless SESSION_CORE_REQUEST_SNAPSHOTS_ENABLED is on.
service RunLedgerService {
  // Store the snapshot of one model call of a run. The system prompt and the
  // tool catalogue are stored once per run by digest; a call that repeats one
  // only references it.
  rpc RecordRequestSnapshot(RecordRequestSnapshotRequest) returns (RecordRequestSnapshotResponse);
}

// RecordRequestSnapshotRequest: one model call's snapshot (EP-14 S6).
message RecordRequestSnapshotRequest {
  // The run the call belongs to. Must be a run of `org_id`.
  string run_id = 1;
  // The call's order within the run. 0 asks session-core to number the call
  // next in its run (inference-core runs as several replicas and always sends
  // 0). A non-zero value names the number; a repeat of the same
  // (run_id, call_seq) is stored once.
  uint32 call_seq = 2;
  // What the call was for (EP-13's closed vocabulary).
  InferPurpose purpose = 3;
  // The inference request id, for joining with provider logs and metrics.
  string request_id = 4;
  // The `request-snapshot-v1` JSON (mp_contracts::request_snapshot). It holds
  // digests and the message manifest, never a message body.
  string snapshot_json = 5;
  // The system prompt text, capped; stored once per run by its digest.
  string system_text = 6;
  // The tool catalogue JSON, capped; stored once per run by its digest.
  string tools_json = 7;
  // Snapshots of this run that inference-core dropped since its last write
  // (a full queue). Added to the run's `snapshots_dropped` counter.
  uint32 dropped_before = 8;
  // The org of the verified caller of the model call. Must match the run and
  // the org of the service token.
  string org_id = 9;
  // The user of the verified caller, empty for a service caller. When set it
  // must match the run's owner.
  string user_id = 10;
  // Whether `system_text` was cut at its cap.
  bool system_truncated = 11;
  // Whether `tools_json` was cut at its cap.
  bool tools_truncated = 12;
}

// RecordRequestSnapshotResponse: what the write stored (EP-14 S6).
message RecordRequestSnapshotResponse {
  // A new snapshot row was written (false for a repeated call_seq).
  bool stored = 1;
  // The system prompt was already stored for this run.
  bool deduplicated_system = 2;
  // The tool catalogue was already stored for this run.
  bool deduplicated_tools = 3;
}
