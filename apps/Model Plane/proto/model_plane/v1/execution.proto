syntax = "proto3";

package model_plane.v1;

option go_package = "github.com/triodelab/model-plane/gen/go/model_plane/v1;mpv1";

import "model_plane/v1/runs.proto";

// ExecutionCore — runtime loop ownership for agent execution.
// Owns: tool planning/selection, permission checkpoints, tool execution,
//       artifacts, subagents, step transitions, compaction triggers.
service ExecutionCore {
  // Execute a single step within a run.
  rpc ExecuteStep(ExecuteStepRequest) returns (ExecuteStepResponse);

  // Resume a paused or checkpointed run.
  rpc ResumeRun(ResumeRunRequest) returns (ResumeRunResponse);

  // Cancel an active run.
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);

  // Pause an active run (Phase 2 B5 — user-initiated browser-run control).
  // Mirrors ResumeRun/CancelRun. A paused run's in-flight loop (e.g. the
  // browser-agent loop) polls this state and blocks between steps until
  // resumed or cancelled; it never aborts a step already in flight.
  rpc PauseRun(PauseRunRequest) returns (PauseRunResponse);

  // Drive a whole agent run to completion: plan → infer → persist → finalize.
  // MVP no-tool slice — a single InferenceCore.Infer round persisted to the
  // run's thread, with the run flipped to a terminal status. Dispatched by the
  // gateway after StartRun so a chat turn produces a durable answer instead of
  // stalling in `'queued'`.
  rpc RunAgent(RunAgentRequest) returns (RunAgentResponse);
}

// RunAgentRequest — drive one agent run from goal to terminal answer.
message RunAgentRequest {
  // Run to drive (created by session-core StartRun).
  string run_id = 1;

  // Thread the run belongs to (assistant answer is appended here).
  string thread_id = 2;

  // User goal / prompt for this turn.
  string goal = 3;

  // Tenant identifier.
  string org_id = 4;

  // Acting user identifier.
  string user_id = 5;

  // Requested model (empty / "velion-*" lets inference-core's intent layer
  // resolve a concrete model).
  string model = 6;

  // Run mode hint: "execute", etc.
  string mode = 7;

  // Maximum agent rounds (reserved for the multi-tool loop; the MVP no-tool
  // slice executes a single round).
  uint32 max_rounds = 8;

  // Zero-Data-Retention flag for this run. When true, the driver threads it
  // into every inference round and onto each tool step's GDPR audit detail so
  // no run content is retained durably. Sourced from the chat request's `zdr`
  // flag (model-gateway), OR'd with any org-level ZDR default.
  bool zdr = 9;
}

// RunAgentResponse — terminal outcome of a driven agent run.
message RunAgentResponse {
  // Terminal status: "completed" or "failed".
  string status = 1;

  // The persisted assistant answer (or graceful error sentence on failure).
  string final_output = 2;

  // Number of agent rounds actually executed.
  uint32 rounds_executed = 3;
}

// ExecuteStepRequest — request to execute one step in the agent loop.
message ExecuteStepRequest {
  // Run this step belongs to.
  string run_id = 1;

  // Step identifier (ULID).
  string step_id = 2;

  // Tool to invoke (empty for reasoning-only steps).
  string tool_name = 3;

  // Tool input as JSON string.
  string tool_input = 4;

  // Permission mode: "auto", "ask", "deny".
  string permission_mode = 5;

  // Hook context as JSON string (hooks evaluated before execution).
  string hook_context = 6;

  // Tenant identifier.
  string org_id = 7;

  // Acting user identifier (viewer). Threaded into the step so knowledge-search
  // (and any other viewer-scoped tool) filters to the caller's visible set, not
  // the whole org. Empty = org-scoped only (legacy/unauthenticated primitive).
  string user_id = 8;
}

// ExecuteStepResponse — result of a single step execution.
message ExecuteStepResponse {
  // Step identifier echoed back.
  string step_id = 1;

  // Step status: "completed", "failed", "permission_denied", "awaiting_approval".
  string status = 2;

  // Tool output (populated on success).
  string output = 3;

  // Error message (populated on failure).
  string error = 4;

  // Whether this step triggered a compaction.
  bool compaction_triggered = 5;
}

// ResumeRunRequest — resume a paused or checkpointed run.
message ResumeRunRequest {
  // Run to resume.
  string run_id = 1;

  // Optional checkpoint to resume from (empty = latest).
  string checkpoint_id = 2;

  // Tenant identifier.
  string org_id = 3;
}

// ResumeRunResponse — acknowledgement that the run has been resumed.
message ResumeRunResponse {
  // True if the run was successfully resumed.
  bool resumed = 1;

  // Current step index after resume.
  uint32 step_index = 2;
}

// PauseRunRequest — pause an active run (Phase 2 B5).
message PauseRunRequest {
  // Run to pause.
  string run_id = 1;

  // Tenant identifier.
  string org_id = 2;
}

// PauseRunResponse — acknowledgement that the run has been paused.
message PauseRunResponse {
  // True if the run was successfully paused.
  bool paused = 1;
}

