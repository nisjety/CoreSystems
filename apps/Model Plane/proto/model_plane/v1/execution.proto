syntax = "proto3";

package model_plane.v1;

option go_package = "github.com/triodelab/model-plane/gen/go/model_plane/v1;mpv1";

import "model_plane/v1/runs.proto";
import "model_plane/v1/inference.proto";

// ExecutionCore — runtime loop ownership for agent execution.
// Owns: tool planning/selection, permission checkpoints, tool execution,
//       artifacts, subagents, step transitions, compaction triggers.
service ExecutionCore {
  // Execute a single step within a run.
  rpc ExecuteStep(ExecuteStepRequest) returns (ExecuteStepResponse);

  // Resume a paused or checkpointed run.
  rpc ResumeRun(ResumeRunRequest) returns (ResumeRunResponse);

  // Cancel an active run.
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);

  // Pause an active run (Phase 2 B5 — user-initiated browser-run control).
  // Mirrors ResumeRun/CancelRun. A paused run's in-flight loop (e.g. the
  // browser-agent loop) polls this state and blocks between steps until
  // resumed or cancelled; it never aborts a step already in flight.
  rpc PauseRun(PauseRunRequest) returns (PauseRunResponse);

  // Drive a whole agent run to completion: plan → infer → persist → finalize.
  // MVP no-tool slice — a single InferenceCore.Infer round persisted to the
  // run's thread, with the run flipped to a terminal status. Dispatched by the
  // gateway after StartRun so a chat turn produces a durable answer instead of
  // stalling in `'queued'`.
  rpc RunAgent(RunAgentRequest) returns (RunAgentResponse);

  // Execute one service-owned scheduled turn. This is intentionally separate
  // from ExecuteStep: the latter is user-delegated and must never be widened
  // to make Temporal work. The lane remains disabled until Session Core's
  // current-run claim/receipt and Control's per-step decision are deployed.
  rpc ExecuteScheduledStep(ExecuteScheduledStepRequest) returns (ExecuteScheduledStepResponse);
}

// ExecuteScheduledStepRequest contains only non-secret, immutable bindings.
// The Control decision is carried as direct-hop metadata by the eventual
// implementation, never in Temporal input, events, checkpoints, or tool
// payloads. Keeping the request content-free prevents a caller from selecting
// a goal, tool, credential, or user identity at the execution boundary.
message ExecuteScheduledStepRequest {
  string run_id = 1;
  string thread_id = 2;
  string org_id = 3;
  string space_id = 4;
  string subject_id = 5;
  string schedule_id = 6;
  string fire_key = 7;
  string template_digest = 8;
  string step_id = 9;
  uint32 step_index = 10;
  string policy_digest = 11;
  string idempotency_key = 12;
  // Ephemeral direct-hop Control decision. It must never be persisted in
  // Temporal history, Session metadata, events, checkpoints, or tool output.
  string control_decision_token = 13;
}

message ExecuteScheduledStepResponse {
  string step_id = 1;
  string status = 2;
  string receipt_id = 3;
  string output = 4;
  string error = 5;
  bool unknown_outcome = 6;
  // Counts of the scheduled Do lane (WS20 S6). Zero on the single-inference lane.
  // They carry no content: the withheld effects are named only in the transcript.
  uint32 rounds_executed = 7;
  uint32 withheld_effects = 8;
  uint32 tool_calls = 9;
  uint32 input_tokens = 10;
  uint32 output_tokens = 11;
}

// RunAgentRequest — drive one agent run from goal to terminal answer.
message RunAgentRequest {
  // Run to drive (created by session-core StartRun).
  string run_id = 1;

  // Thread the run belongs to (assistant answer is appended here).
  string thread_id = 2;

  // User goal / prompt for this turn.
  string goal = 3;

  // Tenant identifier.
  string org_id = 4;

  // Acting user identifier.
  string user_id = 5;

  // Requested model (empty / "verevon-*" lets inference-core's intent layer
  // resolve a concrete model).
  string model = 6;

  // Run mode hint: "execute", etc.
  string mode = 7;

  // Maximum agent rounds (reserved for the multi-tool loop; the MVP no-tool
  // slice executes a single round).
  uint32 max_rounds = 8;

  // Zero-Data-Retention flag for this run. When true, the driver threads it
  // into every inference round and onto each tool step's GDPR audit detail so
  // no run content is retained durably. Sourced from the chat request's `zdr`
  // flag (model-gateway), OR'd with any org-level ZDR default.
  bool zdr = 9;

  // Client-supplied tool definitions for this turn (chat-parity: the same
  // ToolSpec[] the inline chat loop accepts). Merged with execution-core's
  // built-in read/action tools and the org's registered MCP tools, then
  // offered to the model AND admitted into the purpose-lock allowlist. Every
  // client tool still executes through the SAME governed execute_step path
  // (permission gate + HITL), so forwarding them cannot bypass approval; a
  // client tool that resolves to no executor returns a graceful error the
  // ReAct loop feeds back. Empty → only the server-side set is offered.
  repeated ToolDefinition tools = 10;

  // Minimum privacy tier every serving provider of EVERY inference round of
  // this run must satisfy. The gateway threads the chat request's floor here;
  // execution-core copies it onto each round's InferRequest so the governed
  // agent loop enforces the same constraint as the inline path — a tier can
  // never be lost by routing a constrained chat turn through the agent loop.
  // UNSPECIFIED imposes no constraint.
  PrivacyTier min_privacy_tier = 11;
  // When true, this run must never take a real side-effecting action,
  // regardless of `mode` -- the human asked to see what the agent WOULD do
  // before letting it act. Read-only tools (knowledge_search, yr_weather,
  // ...) still run; anything `permission::is_risky_call` classifies as
  // risky is refused outright, the same way a delegated subagent already
  // refuses one (see runtime_loop::agent's leaf/orchestrator role split).
  // Sourced from the chat request's `plan_mode` flag (model-gateway).
  // Before this field existed, the request carried NO way to express this at
  // all -- `plan_mode` was tracked only as a durable status flag
  // (session-core `run.mode` / `PlanModeStore.is_plan_mode`) for the UI to
  // query, with no code path that ever consulted it before dispatching a
  // tool. A run a human believed was "planning" could still execute a real
  // action if its `mode` happened to be `auto`.
  // Field number 13, not 11: `min_privacy_tier` took 11 on the integration
  // line before this field merged. Renumbered here rather than there because
  // this one had not shipped yet — moving a field number that is already on a
  // deployed wire is how two builds disagree about what a byte means.
  bool plan_mode = 13;

  // The rung this run is permitted to operate at, checked PER CALL by the
  // runtime loop. Unset reads as the narrowest rung, never as a grant — an
  // older caller that does not set it must not accidentally authorize
  // everything.
  //
  // Distinct from `plan_mode` and from `mode`: plan_mode is the binary "show me
  // what you would do" gate, while this is the graded authority a human granted
  // when they approved the plan. A run can be out of plan mode and still be
  // held at `WORKSPACE_WRITE`.
  AutonomyRung autonomy_rung = 12;

  // Canonical Control-registered Space this run belongs to, empty for the
  // pre-existing non-Space path — the same field, same meaning, and same
  // "presence alone grants nothing" posture as `ExecuteStepRequest.space_id`
  // (field 11 on that message). Needed because `RunAgent`'s own governed
  // multi-tool loop (`runtime_loop::agent::run_agent_with_tools`) dispatches
  // through the SAME `execute_step_inner` core `ExecuteStep` does — despite
  // this message's field 8 doc comment still describing an "MVP no-tool
  // slice" that the code has moved past. Without this field, a Space-scoped
  // agent run's own `code_interpreter` calls had no way to reach a sandbox
  // lease at all. See
  // apps/Frontend Plane/verevonv3/docs/S3_3_DURABLE_WORKSPACE_DESIGN_2026-09-11.md
  // §3.5 phase B.2.
  string space_id = 14;

  // Per-run ceiling on delegated subagents this run may start across all of
  // its rounds (chat-wave2-specs wide-research fan-out §2.1). Same "0 =
  // unspecified, use default" convention as `max_rounds` (field 8) — an older
  // caller that never sets this keeps today's behavior
  // (`subagent::DEFAULT_MAX_CHILDREN`), never a surprise widening. Resolved
  // server-side by `subagent::resolve_child_ceiling`, which also clamps
  // against an org-level ceiling (when configured) and the hard
  // `subagent::MAX_CHILDREN_CEILING` — a request can only tighten the
  // ceiling, never loosen it past what the org allows.
  uint32 max_subagents = 15;

  // Inference route this run is PINNED to. Empty (together with
  // `subscription_connection_id`) is every run that predates the field: the
  // loop resolves its model as before (`EXECUTION_AGENT_MODEL`, e.g.
  // "model-router") and names no provider. The only value execution-core
  // accepts is "openai-codex-subscription" (the canonical registry id, not an
  // alias), and only together with `subscription_connection_id` (17), an
  // explicit non-"verevon-*" `model` (6), `zdr = false`, `plan_mode = true`
  // (unless AGENTIC_SUBSCRIPTION_ALLOW_EFFECTS is also on: a subscription run is
  // read-only until plan approval is connected) and
  // AGENTIC_SUBSCRIPTION_ENABLED. When set, execution-core copies this onto
  // EVERY inference round of the run, parent and delegated subagents alike,
  // ignores `EXECUTION_AGENT_MODEL`, and stops the run (no further rounds) if
  // a round is served by any other provider or model. A half-set pair or any
  // other value is refused, never ignored: ignoring it would silently run the
  // loop on the paid default route.
  //
  // Rollout order matters. An execution-core built before this field existed
  // skips unknown fields and would run the loop on its default route, so the
  // gateway only sends it once AGENTIC_SUBSCRIPTION_ENABLED is on, and that
  // switch is turned on only after the new execution-core is running.
  string provider_hint = 16;

  // Opaque Integration Core reference to the user's ChatGPT subscription
  // connection, meaningful only with `provider_hint` (16). Identical
  // semantics to `InferRequest.subscription_connection_id`: inference-core
  // hands it to Integration Core, which validates it against the caller's
  // verified org and user scope. It carries no credential.
  string subscription_connection_id = 17;

  // The composed run context (build plan WS02). Absent = today's behaviour:
  // the loop starts from its preamble plus the goal. The gateway composes this
  // (the BFF resolves instruction text; execution-core never re-resolves it) and
  // execution-core only inserts it; under ZDR only authored instructions are
  // allowed (`mp_contracts::run_context::validate`). Old executors skip an
  // unknown field, which is today's behaviour. Field 18 is reserved for this
  // message in the build plan's proto reservation table (section 4.3).
  RunContext run_context = 18;

  // Continue a run after a pause (build plan WS03 S3): the segment that follows
  // an approval. Absent = a fresh run, exactly as before. Refused unless the
  // durable-loop switch is on, refused for zero-retention callers, and it can
  // only narrow the authority the run paused with. Field 19 is reserved for this
  // message in the build plan's proto reservation table (section 4.3).
  AgentResume resume = 19;

  // What the person attached to this turn (build plan WS08-S6): files staged
  // read-only for the run's `code_interpreter` calls and images that ride as
  // `InferRequest.image_parts` on every round. The gateway validates, decodes and
  // hashes them from the request body; the model cannot add or alter an entry.
  // Empty = today's behaviour. Request-scope memory only: never in a checkpoint,
  // an event or a log, and released when the run ends or is cancelled. A
  // zero-retention or waived run refuses a non-empty list at the boundary, and a
  // delegated subagent does not inherit it. Field 20 is reserved for this
  // message in the build plan's proto reservation table (section 4.3).
  repeated RunAttachment attachments = 20;

  // The run's reasoning level (build plan WS11 S8, DEC-36 Q1). The gateway sets it on a
  // fresh Do or Plan run from the turn's clamped effort, and execution-core sends it on
  // every inference round the run makes, delegated children included. Unspecified = no
  // reasoning, which is today's behaviour. It is a request parameter only: never stored
  // in a checkpoint, a fold, an event, the run context or runs.metadata. Execution-core
  // ignores it unless EXECUTION_CORE_RUN_EFFORT is the literal `true`. A continuation or
  // park-resume segment carries only what its own request sends. Field 21 is reserved for
  // this message in the build plan's proto reservation table (section 4.3).
  ReasoningEffort reasoning_effort = 21;

  // The most questions the run's `ask_user` tool may put to its owner (build plan WS14 S4). Zero
  // means the tool is not offered: the gateway sends zero for a zero-retention, waived, plan-mode,
  // Space-scoped or continuation run, and while AGENT_ASK_USER_ENABLED is off. Execution-core
  // offers the tool only when this is above zero and caps it at the shared question limit. Field 22
  // is reserved for this message in the build plan's proto reservation table (section 4.3).
  uint32 max_questions = 22;

  // The connected accounts the person selected for this turn (build plan WS23 S4). Absent or empty
  // selects none: no connector read is offered, and one that is attempted is refused. The gateway
  // refuses a selection under zero retention, in a Space, under a knowledge-only or web-only source
  // filter, and when an id is malformed, so a run carries one only when its turn may read connected
  // accounts. Field 23 is reserved for this message in the build plan's proto reservation table
  // (section 4.3).
  ConnectorScope connector_scope = 23;
  // The org policy this run was resolved under (build plan WS25 S3): the org's hook rules,
  // which the run's hook engine enforces on every tool call. Absent when HOOKS_DO_RUNS is off
  // or the org has no rules, so the run is exactly as it was before the field existed.
  OrgPolicyContext org_policy = 24;

  // A wide-research run started from the composer (Wave 3 EP-2 S8/S9; additive). Absent = an ordinary Do
  // run, exactly as before the field existed. The gateway sets it only while WIDE_RESEARCH_ENTRY_ENABLED
  // is on and never for a zero-retention turn; execution-core then bounds the run's delegations to
  // `item_cap` and seeds the run's goal with the items. Field 25 is reserved for this message by the
  // Wave 3 integration round A.
  WideResearchRequest wide_research = 25;
}

// WideResearchRequest is what a person asked a wide-research run to cover (Wave 3 EP-2 S8/S9). It only
// narrows the run: it can never raise the run's delegation ceiling above the platform's.
message WideResearchRequest {
  // The most items the run may fan out: the gateway sets it to the smaller of the person's ask and the
  // org's `research.max_fan_out_items` agent-policy key. Zero means the org has wide research off, and
  // execution-core refuses the run.
  uint32 item_cap = 1;
  // The person's items, one research question each, in the order they were given. Items past
  // `item_cap` are not researched; execution-core names them in the answer.
  repeated string items = 2;
  // The fan-out batch a retry belongs to (EP-2 S9). Empty for a fresh wide-research run.
  string batch_id = 3;
  // The child run whose item a one-item retry runs again (EP-2 S9). Empty for a fresh run.
  string retry_of_child_run_id = 4;
}

// OrgPolicyContext is the org's policy for one Do run (build plan WS25 S3). Its rules can only
// narrow what the run may do: execution-core enforces them, and no rule lets a call past the
// signed gate.
message OrgPolicyContext {
  // The hook rules as execution-core's hook context JSON ({"rules":[...]}); empty means none.
  string hook_context = 1;
  // The revision of the org policy the rules were read at. Zero until the policy registry (WS25 S7).
  int64 policy_revision = 2;
  // Digest of the policy document the rules came from. Empty until WS25 S7.
  string policy_digest = 3;
}

// ConnectorScope names the Integration Core connections one run may read (build plan WS23 S4).
message ConnectorScope {
  // Connection ids, each 1 to 128 ASCII letters, digits, `_` or `-`; at most eight.
  repeated string connection_ids = 1;
}

// AgentResume names the approved call a continuation segment may release, and
// carries the brief it is seeded with. It carries no credential: the resumed
// segment authenticates with fresh bearers minted for the continue request.
message AgentResume {
  // "segment" (a fresh segment seeded by a brief), "loop" (re-entry from a fold)
  // or "park" (resume of the run's current parked fold, claimed with an empty
  // pause reference). A "park" resume carries ONLY `claim_token`: approval_id,
  // step_id, tool_name, action_fingerprint and brief must be empty, and
  // segment_no is sent and ignored.
  string mode = 1;
  // The granted approval the segment consumes, exactly once.
  string approval_id = 2;
  // Optional hint: the step the approval gates. When set it must equal the
  // retained descriptor's, or the continuation is refused.
  string step_id = 3;
  // Optional hint: the tool the approval gates. Same rule.
  string tool_name = 4;
  // Optional: the digest of the exact call that was approved. When set it must
  // equal the retained descriptor's fingerprint.
  string action_fingerprint = 5;
  // A framed brief of the recorded results so far (data, not instructions).
  string brief = 6;
  // An opaque token for the consume; the same token replays safely.
  string claim_token = 7;
  // Which segment of the run this is (2 for the first continuation).
  uint32 segment_no = 8;
  // Field 9 was the approved call's arguments; they now come back from the
  // consume itself (the retained approval descriptor is the only source of the
  // approved call), so nothing the client supplies names what the segment runs.
  reserved 9;
  // The `resume` question a continuation answers (build plan WS14 S5): its `q_` id. Set only
  // together with `answer_json`, and only by the `/continue` of a run paused for that question;
  // an approval continuation leaves both empty.
  string question_id = 10;
  // The owner's answer to `question_id`, as the `user_question` answer JSON. It is data, never an
  // instruction and never a grant, and the shared contract bounds it.
  string answer_json = 11;
}

// RunContext - what the gateway hands an agent run beyond its goal.
// Fields 5 and above are reserved in the build plan for attachments and run notes.
message RunContext {
  // Composed platform, org, Space and persona instructions (finished text).
  string authored_instructions = 1;
  // Bounded prior turns of the thread (roles user and assistant only).
  repeated ChatMessage history = 2;
  // A prefetched memory block, already bounded.
  string memory_block = 3;
  // How each part was assembled, for the run record.
  RunContextStatus status = 4;
  // Fields 5 and 6 stay reserved for WS08 and WS20 (see the comment above).
  // The person's standing profile as a finished, bounded block (EP-8 S5),
  // placed by the loop in the Context tier of the root loop only. Empty unless
  // MODEL_GATEWAY_USER_PROFILE_PREFIX is on and the run's memory decision
  // allows it; never set on a ZDR, waived or Space-scoped run.
  string user_profile = 7;
  // The roles a `subagent.task` call of this run may name (EP-6 S10; owner:
  // model-gateway composes it, execution-core reads it). Built from published
  // agent definitions the caller may use, at most 8 entries. In flight only:
  // never persisted, never built for a ZDR, waived or scheduled run, and
  // ignored by execution-core with EXECUTION_CORE_SUBAGENT_ROLES off.
  repeated AgentRoleSpec agent_roles = 8;
  // The thread goal recited to the model as data (EP-7 S1; owner: session-core
  // renders it, model-gateway carries it, execution-core places it in the
  // Volatile tier of the root loop only). Finished text with a header that
  // says to read it as data, never instructions. Empty when the thread has no
  // active goal, with MODEL_GATEWAY_THREAD_GOALS_ENABLED off, and always for a
  // ZDR, waived or Space-scoped run. In flight only: never persisted. Fields 5
  // and 6 stay reserved for WS08 and WS20 (plan 4.3).
  string goal_recitation = 9;
}

// AgentRoleSpec - one published agent definition a delegated subagent may take
// on as its role (EP-6 S10). It only narrows: the child's tools are the
// parent's tools intersected with `tool_capability_ids`, never more.
message AgentRoleSpec {
  // The agent definition's stable id, the value `subagent.task`'s `role` names.
  string agent_ref = 1;
  // The published version this entry was read from (immutable, from 1).
  uint32 version = 2;
  // The published version's canonical digest ("sha256:<hex>").
  string digest = 3;
  // The agent's display name, shown to the parent model.
  string name = 4;
  // The agent's authored instructions, at most 4096 bytes.
  string instructions = 5;
  // Capability ids (WS05 registry) the role allows; the child keeps only the
  // parent's tools whose capability is listed here.
  repeated string tool_capability_ids = 6;
  // The role's autonomy cap ("read_only", "ask_first" or "auto"; empty when
  // the definition states none). A delegated child is read/analysis only
  // whatever the cap, so the cap can never widen it.
  string autonomy_cap = 7;
}

// RunAgentResponse — terminal outcome of a driven agent run.
message RunAgentResponse {
  // Outcome status: "completed" or "failed" (terminal), "awaiting_approval" or
  // "parked" (the run stays open). "parked" means the loop saved a durable park
  // fold at a round boundary and returned without finalizing: no assistant
  // message was appended, no receipt written; `park_reason` says why.
  string status = 1;

  // The persisted assistant answer (or graceful error sentence on failure).
  string final_output = 2;

  // Number of agent rounds actually executed.
  uint32 rounds_executed = 3;

  // HONESTY_CONTRACT: true when at least one knowledge_search call in this
  // run actually returned org knowledge (status "ok"), so the gateway can
  // score confidence honestly instead of assuming ungrounded. False for
  // "awaiting_approval" (run not finished) and when no knowledge_search
  // call succeeded with real results.
  bool grounded = 4;

  // True when the loop cleared tool-result payloads to stay inside the context
  // window during this run.
  //
  // Reported because compaction is LOSSY and otherwise invisible: an answer
  // built on a prompt whose earlier tool results were cleared can be worse for a
  // reason nothing in the response explains. `StepOutcome` carries the same flag
  // for the single-step surface, where it is correctly always false — one step
  // accumulates no history to compact.
  bool compaction_triggered = 5;

  // Why a run pinned to the ChatGPT subscription (`RunAgentRequest.provider_hint`
  // = "openai-codex-subscription") ended in `status` "failed", as a stable
  // code. Empty for every other outcome and for every run that is not pinned.
  // One of: "subscription_usage_limit", "subscription_reauth_required",
  // "subscription_upstream_unavailable", "subscription_bad_request",
  // "rate_limited", "prompt_too_long", or "subscription_route_unavailable"
  // (any other subscription failure, and a round that was served by another
  // provider or model than the run is pinned to). The spellings are
  // model-gateway's `subscription_failure` vocabulary and are pinned to it by a
  // contract test; the gateway words the reason for the user from this code and
  // never from `final_output`.
  //
  // When set, execution-core has NOT appended an assistant message to the
  // thread: the gateway persists the explanation it words from this code, so
  // the thread carries exactly one. A caller that does not read this field
  // sees `status` "failed" and `final_output`, as for any failed run.
  string failure_code = 6;

  // How long to wait before a retry could succeed, in whole milliseconds, when
  // the provider said. Unset when it did not (an unset value is not zero).
  // Meaningful only with `failure_code`.
  optional uint64 retry_after_ms = 7;

  // When a "subscription_usage_limit" resets: RFC 3339 UTC to whole seconds.
  // Empty when unknown. Meaningful only with `failure_code`.
  string resets_at = 8;

  // Why the run parked, as a closed token ("credential_window",
  // "provider_exhausted", "upstream_unavailable" or "reauth_required"), when
  // `status` is "parked". Empty for every other outcome. With status "parked",
  // `resets_at` carries the earliest time a resume is due (RFC 3339 UTC) and
  // `failure_code` is empty.
  string park_reason = 11;

  // Why the run's own loop guard ended it, as a closed token: "loop_detected" when
  // the Do loop's loop guard stopped this run's loop (WS25-S2). A delegated loop's
  // stop is a child result, so it never sets this field. Empty for every other
  // outcome. The run appended its fixed reply and its terminal receipt still says
  // "execution_failed"; this field alone names the stop. It is not `failure_code`,
  // which is taken by the subscription vocabulary (tag 6).
  string loop_stop_code = 10;

  // What this invocation of the run's loop spent on inference: every round of the
  // run and of the subagents it delegated to, summed. Counts and ids only, never
  // content. Unset when the executor predates the field, which is not the same as
  // a run that spent nothing (that one reports `inference_rounds` 0). A paused or
  // parked run reports the usage of the invocation that paused or parked; the
  // continuation that follows is a new invocation with its own tally.
  RunUsage usage = 9;

  // When each inference round of this invocation's own loop ran (EP-14 S5), in
  // round order. Milliseconds and counts only, never content. Empty unless
  // EXECUTION_ROUND_TIMING is on; delegated loops are not listed (their time
  // falls inside the parent round's dispatch). The gateway stores it as the
  // run's `round-timing-v1` record when the run is persistent.
  repeated RoundTiming round_timing = 12;
}

// RoundTiming - one inference round of a Do run's loop (EP-14 S5). Offsets are
// milliseconds from the start of the invocation's loop, read from one monotonic
// clock, so they never go backwards.
message RoundTiming {
  // The round's number within the invocation, from 1.
  uint32 round = 1;
  // When the round's inference call was sent.
  uint64 inference_start_ms = 2;
  // When its response (or its failure) came back.
  uint64 inference_end_ms = 3;
  // When the loop moved on from the round: its tool calls were dispatched, or
  // the loop ended. Equal to `inference_end_ms` for a round with no tool calls.
  uint64 dispatch_end_ms = 4;
  // The tool calls the round's response asked for. 0 for an answering round
  // and for a round whose inference failed.
  uint32 tool_count = 5;
}

// RunUsage - the inference a run's loop spent in one invocation.
message RunUsage {
  // Provider-reported tokens of every round, summed. `input_tokens` already folds
  // in the cache legs, exactly as `InferResponse.input_tokens` does.
  uint64 input_tokens = 1;
  // Provider-reported completion tokens of every round, summed.
  uint64 output_tokens = 2;
  // The cache legs of `input_tokens`: served from the provider's prompt cache, and
  // written to it. Zero where the provider reports none.
  uint64 cache_read_input_tokens = 3;
  // Tokens written to the provider's prompt cache (see `cache_read_input_tokens`).
  uint64 cache_creation_input_tokens = 4;
  // Rounds that returned a provider response, delegated rounds included. A round
  // that failed before a response is not counted: it spent nothing reportable.
  uint32 inference_rounds = 5;
  // The provider and model of the leg (`legs`) that served the most rounds, the
  // first in provider-then-model order on a tie, as the provider reported them.
  // Empty when no round was counted. Not a price basis: an unpinned run can be
  // served by several, and `legs` carries each one's own spend.
  string provider_used = 6;
  // The model of that leg, as the provider reported it.
  string model_used = 7;
  // The same spend split by the provider and model that served it, in provider-
  // then-model order, so concurrent delegates cannot reorder it. The legs sum to
  // the totals above. Empty from an executor that predates the field; the totals
  // are then the one leg.
  repeated RunUsageLeg legs = 8;
}

// RunUsageLeg - what one provider and model served within a run's invocation.
// A gateway prices each leg under its own model.
message RunUsageLeg {
  // As the provider reported them on the rounds; both empty for a round that
  // named neither.
  string provider_used = 1;
  // The model that served this leg's rounds, as the provider reported it.
  string model_used = 2;
  // Same meaning as the fields of `RunUsage`, over this leg's rounds only.
  uint64 input_tokens = 3;
  // Completion tokens of this leg's rounds.
  uint64 output_tokens = 4;
  // Tokens of this leg served from the provider's prompt cache.
  uint64 cache_read_input_tokens = 5;
  // Tokens of this leg written to the provider's prompt cache.
  uint64 cache_creation_input_tokens = 6;
  // Rounds of this leg that returned a provider response.
  uint32 inference_rounds = 7;
}

// ExecuteStepRequest — request to execute one step in the agent loop.
message ExecuteStepRequest {
  // Run this step belongs to.
  string run_id = 1;

  // Step identifier (ULID).
  string step_id = 2;

  // Tool to invoke (empty for reasoning-only steps).
  string tool_name = 3;

  // Tool input as JSON string.
  string tool_input = 4;

  // Permission mode: "auto", "ask", "deny".
  string permission_mode = 5;

  // Hook context as JSON string (hooks evaluated before execution).
  string hook_context = 6;

  // Tenant identifier.
  string org_id = 7;

  // Acting user identifier (viewer). Threaded into the step so knowledge-search
  // (and any other viewer-scoped tool) filters to the caller's visible set, not
  // the whole org. Empty = org-scoped only (legacy/unauthenticated primitive).
  string user_id = 8;

  // Zero-Data-Retention posture. The executor must not create durable run,
  // step, audit-content, cache, or tool-output state when true.
  bool zdr = 9;

  // Minimum privacy tier this step must respect, mirroring
  // `RunAgentRequest.min_privacy_tier` (field 11) for the direct single-step
  // surface. Read today by `knowledge_search`'s Data Plane retrieval to derive
  // a sovereignty posture when no signed claim exists — the SOVEREIGN tier is
  // the only value that means anything to that axis; every other tier defers.
  // UNSPECIFIED imposes no constraint. Field 10 was free on this message; it
  // is unrelated to `RunAgentRequest`'s 11, which is a different message.
  PrivacyTier min_privacy_tier = 10;

  // Canonical Control-registered Space this step's run belongs to, empty for
  // the pre-existing non-Space path (mirrors `ExecuteScheduledStepRequest`'s
  // own `space_id`, field 4 on that message). Threaded by the caller from
  // whatever Space context it already resolved (e.g. model-gateway's
  // `ThreadSpaceContext`) rather than looked up here — the same pattern
  // `org_id`/`user_id` above already use. Presence alone does not grant
  // sandbox capability; see
  // apps/Frontend Plane/verevonv3/docs/S3_3_DURABLE_WORKSPACE_DESIGN_2026-09-11.md
  // §3.5 phase B for the signed decision that actually does.
  string space_id = 11;

  // Files the person attached to this turn, staged read-only for the step's
  // `code_interpreter` call (WS08-S5). The caller (model-gateway) validates and
  // hashes them from the request body; the model's tool input can neither add
  // nor alter an entry. Empty = nothing staged, which is today's behaviour. A
  // zero-retention step refuses a non-empty list at the boundary.
  repeated RunAttachment attachments = 12;

  // The thread this step's run belongs to, read only to find the thread's
  // workspace (WS22-S2, DEC-23). Memory tools never receive it: the direct
  // ExecuteStep RPC still passes them an empty thread context, and a Space step
  // and a zero-retention step ignore it.
  string thread_id = 13;

  // Bundles of the skills this turn matched that have one, mounted read-only at
  // /skills/<name> for this call (WS19-S8). The gateway derives them from the turn's
  // own matches, never from the model's arguments; at most three. Field 13 is
  // ExecuteStepRequest.thread_id (WS22-S2). A zero-retention step refuses a
  // non-empty list at the boundary.
  repeated SkillMount skill_mounts = 14;
}

// RunAttachmentKind — what a staged run input is.
enum RunAttachmentKind {
  RUN_ATTACHMENT_KIND_UNSPECIFIED = 0;
  // A document or data file the sandbox program reads (xlsx, csv, pdf, ...).
  RUN_ATTACHMENT_KIND_FILE = 1;
  // An image. Reserved for the vision path (WS08-S4/S6); the sandbox refuses it.
  RUN_ATTACHMENT_KIND_IMAGE = 2;
}

// RunAttachment — one attached input, carried by value for one call. The bytes
// live in request memory only: never in session-core, events, checkpoints or
// the audit outbox, and never in a log (sha256, size and count only).
message RunAttachment {
  // Opaque id of this attachment within the turn (not a path).
  string id = 1;
  // Bare file name the sandbox sees under `attachments/`. Validated, never
  // sanitized: an unsafe name refuses the whole list.
  string name = 2;
  // MIME type the client declared.
  string mime = 3;
  // Exact length of `content`.
  uint64 size_bytes = 4;
  // Lowercase hex SHA-256 of `content`; the receiver recomputes and refuses a
  // mismatch. The scanner extension point of WS26.
  string sha256 = 5;
  // The file bytes.
  bytes content = 6;
  RunAttachmentKind kind = 7;
}

// SkillMount — one skill bundle to mount read-only for one call (WS19-S8). The
// bytes are not carried: execution-core fetches each bundle from capability-core by
// skill id and checks every digest against the manifest digest named here.
message SkillMount {
  // The org's skill whose bundle this is.
  string skill_id = 1;

  // Directory name under /skills/ inside the sandbox: lowercase ASCII letters,
  // digits, '-' and '_', at most 48 bytes. Validated, never sanitized.
  string name = 2;

  // Lowercase hex SHA-256 of the bundle manifest the gateway read. The receiver
  // refuses a bundle whose manifest digest differs.
  string manifest_sha256 = 3;
}

// ExecuteStepResponse — result of a single step execution.
message ExecuteStepResponse {
  // Step identifier echoed back.
  string step_id = 1;

  // Step status: "completed", "failed", "permission_denied", "awaiting_approval".
  string status = 2;

  // Tool output (populated on success).
  string output = 3;

  // Error message (populated on failure).
  string error = 4;

  // Whether this step triggered a compaction.
  bool compaction_triggered = 5;
}

// ResumeRunRequest — resume a paused or checkpointed run.
message ResumeRunRequest {
  // Run to resume.
  string run_id = 1;

  // Optional checkpoint to resume from (empty = latest).
  string checkpoint_id = 2;

  // Tenant identifier.
  string org_id = 3;

  // Durable granted approval authorizing an AwaitingApproval -> Running
  // transition. Empty is valid only for a user-paused run; it can never
  // resume an approval gate.
  string approval_id = 4;

  // Text the person typed for a live browser run (E3.3-f). Queued for the run
  // and read by the planner at its next step boundary, as the person's
  // unverified message: it approves nothing and widens no domain. Empty = none.
  // Refused (FAILED_PRECONDITION) when the steer switch is off; at most 2000
  // characters, at most 3 waiting per run.
  string steer_text = 5;
}

// ResumeRunResponse — acknowledgement that the run has been resumed.
message ResumeRunResponse {
  // True if the run was successfully resumed.
  bool resumed = 1;

  // Current step index after resume.
  uint32 step_index = 2;
}

// PauseRunRequest — pause an active run (Phase 2 B5).
message PauseRunRequest {
  // Run to pause.
  string run_id = 1;

  // Tenant identifier.
  string org_id = 2;

  // Same as ResumeRunRequest.steer_text: queued before the run is paused, read
  // by the planner when the run next passes a step boundary (E3.3-f).
  string steer_text = 3;
}

// PauseRunResponse — acknowledgement that the run has been paused.
message PauseRunResponse {
  // True if the run was successfully paused.
  bool paused = 1;
}
