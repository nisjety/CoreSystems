syntax = "proto3";

package model_plane.v1;

option go_package = "github.com/triodelab/model-plane/gen/go/model_plane/v1;mpv1";

// SpaceRunActions: the run-bound owner path of the Space agent self-API (build plan WS18-S3).
//
// Separate file and service, and not RunService (K4-07). A room agent acts on its own run's thread
// through a registry action (`space.thread.rename`, `space.thread.pin`, `space.thread.post_card`).
// Session Core verifies a Control `run-action-v1` decision and recomputes the payload digest from the
// typed arguments; the model supplies argument values only. Receipts and events carry ids, kinds and
// digests only. WS20-S3 adds `SpaceBrowserRead` to this file (the room browser run's count and run
// Space lookup); WS20-S4 adds its read RPCs to that service.
service SpaceRunActions {
  // Apply one registry action to the run's own thread. The caller is the run's owner (a user
  // principal). A zero-retention credential is refused with `zdr_durable_mutation_forbidden`.
  rpc ApplyRunThreadAction(ApplyRunThreadActionRequest) returns (ApplyRunThreadActionResponse);

  // Service probe for execution-core (identity `service:execution-core`, scope
  // `session:run-thread-action:probe`): reports whether the verifier and the registry schema are
  // present and whether the switch is on. Never touches content.
  rpc ProbeRunThreadActions(ProbeRunThreadActionsRequest) returns (ProbeRunThreadActionsResponse);
}

// One agent action on the run's own thread. Exactly one argument message is set, and it must be the
// one the action takes.
message ApplyRunThreadActionRequest {
  // Server-authoritative tenant scope; must equal the caller's org.
  string org_id = 1;
  // The run whose thread the action acts on. The caller must own it.
  string run_id = 2;
  // The registry action id (`space.thread.rename`, `space.thread.pin`, `space.thread.post_card`).
  string action_id = 3;
  // `{action_id}:{hex}`, the key the Control decision binds. A retry with the same key replays the
  // receipt of the first application.
  string idempotency_key = 4;
  // The Control `run-action-v1` decision for this run, action, key and digest.
  string control_decision_token = 5;

  oneof args {
    RenameThreadArgs rename = 10;
    PinThreadArgs pin = 11;
    PostCardArgs post_card = 12;
  }
}

// Arguments of `space.thread.rename`.
message RenameThreadArgs {
  // 1 to 96 characters.
  string title = 1;
}

// Arguments of `space.thread.pin`.
message PinThreadArgs {
  bool pinned = 1;
}

// Arguments of `space.thread.post_card` (the card write lands with WS18-S7).
message PostCardArgs {
  // 1 to 120 characters.
  string title = 1;
  // 1 to 2000 characters. Plain text only.
  string body = 2;
  // One of info, progress, done, blocked.
  string tone = 3;
  // At most 8 fields.
  repeated CardField fields = 4;
}

// One label and value of a card.
message CardField {
  // 1 to 40 characters.
  string label = 1;
  // 1 to 200 characters.
  string value = 2;
}

message ApplyRunThreadActionResponse {
  // The receipt that records this application (or replays it).
  string receipt_id = 1;
  RunActionOutcome outcome = 2;
  string thread_id = 3;
  // Empty until a card is written (WS18-S7).
  string message_id = 4;
}

// How an application ended. Values are prefixed: enum values share the package scope.
enum RunActionOutcome {
  RUN_ACTION_OUTCOME_UNSPECIFIED = 0;
  // The effect was written.
  RUN_ACTION_OUTCOME_APPLIED = 1;
  // The same key and digest were seen before; the stored receipt is returned and nothing is written.
  RUN_ACTION_OUTCOME_REPLAYED = 2;
  // The thread already held the requested state; a receipt records the call and nothing changed.
  RUN_ACTION_OUTCOME_NOOP = 3;
}

message ProbeRunThreadActionsRequest {}

message ProbeRunThreadActionsResponse {
  // Whether the Control decision keys are configured for this process.
  bool verifier_configured = 1;
  // Whether the golden registry loads and carries the Phase 1 rows.
  bool schema_present = 2;
  // The value of SPACE_SELF_API_SESSION_CORE as read at boot.
  bool flag_on = 3;
}

// SpaceBrowserRead: the room-scoped browser run reads that Session Core answers for model-gateway
// (build plan WS20-S3; S4 adds the timeline, list and evidence RPCs here). Each call carries the
// caller's verified user credential; the org is checked against it, and a zero-retention credential
// is refused with the typed `browser_run` refusal.
service SpaceBrowserRead {
  // The browser runs of one Space still in flight, for the per-Space cap. Counts only runs started by
  // the gateway's browser source in threads of that Space. `exclude_start_key` leaves out one run (the
  // run a keyed replay names), so a replay of an admitted start is not refused by its own run.
  rpc CountActiveRoomBrowserRuns(CountActiveRoomBrowserRunsRequest) returns (CountActiveRoomBrowserRunsResponse);

  // The Space a run belongs to, read for execution-core's three-way Space agreement. The caller must be
  // the run's owner. An empty `space_id` names a run that is not in a Space.
  rpc ResolveRunSpace(ResolveRunSpaceRequest) returns (ResolveRunSpaceResponse);

  // The room's browser runs of one Space, newest first (WS20-S4, R2). Unlike the two reads above, each
  // room read carries the caller's Control `model.thread.read` decision for this Space, which Session
  // Core verifies (signature, org, subject, window), refuses for a removed member, and bounds to the
  // decision's audience ceiling. The projection is content-free: ids, the starter's subject id, the
  // run phase, the step count and at most eight hosts. Never a goal, URL, title, rationale, selector,
  // frame or evidence byte.
  rpc ListRoomBrowserRuns(ListRoomBrowserRunsRequest) returns (ListRoomBrowserRunsResponse);

  // One page of a browser run's room timeline (WS20-S4, R3), read through the closed projection
  // allowlist. Only the event types the projector names leave the database.
  rpc ReadRoomBrowserTimeline(ReadRoomBrowserTimelineRequest) returns (ReadRoomBrowserTimelineResponse);

  // Whether an evidence id is one of the run's persisted observations (WS20-S4, R4). Returns the Quarry
  // artifact reference model-gateway fetches; Session Core never returns the bytes.
  rpc AuthorizeRoomBrowserEvidence(AuthorizeRoomBrowserEvidenceRequest) returns (AuthorizeRoomBrowserEvidenceResponse);

  // The starter's own summary of one room browser run, read for the run's result turn (WS20-S3). The caller
  // must be the run's owner. Counts, at most eight hosts and six evidence ids, and the run's start and end
  // instants. Never a URL, title, rationale, selector, decided-by subject or evidence byte.
  rpc SummarizeRoomBrowserRun(SummarizeRoomBrowserRunRequest) returns (SummarizeRoomBrowserRunResponse);
}

message CountActiveRoomBrowserRunsRequest {
  // Must be the caller's own org.
  string org_id = 1;
  // The Space whose runs are counted.
  string space_id = 2;
  // A run start key to leave out of the count (empty leaves none out).
  string exclude_start_key = 3;
}

message CountActiveRoomBrowserRunsResponse {
  // Browser runs of the Space still in flight, not counting `exclude_start_key`.
  uint32 active_runs = 1;
}

message ResolveRunSpaceRequest {
  string run_id = 1;
  // Must be the caller's own org.
  string org_id = 2;
  // Must be the caller's own user id; the run must be this user's.
  string user_id = 3;
}

message ResolveRunSpaceResponse {
  // The run's Space, or empty when the run is not in a Space.
  string space_id = 1;
}

message ListRoomBrowserRunsRequest {
  // The Space whose runs are listed. The decision below must name this Space.
  string space_id = 1;
  // Empty lists every thread of the Space; set, only that thread's runs (it must belong to the Space).
  string thread_id = 2;
  // 1 to 50; zero takes the default of 20.
  uint32 limit = 3;
  // The run id of the last run of the previous page; empty for the first page.
  string before_run_id = 4;
  // The Control `model.thread.read` decision reference and token for this Space.
  string space_read_decision_ref = 5;
  string space_read_decision_token = 6;
}

message ListRoomBrowserRunsResponse {
  repeated RoomBrowserRun runs = 1;
  // Pass as `before_run_id` for the next page; empty when the list is complete.
  string next_run_id = 2;
  // Unix seconds after which this verdict no longer holds (the decision's expiry, capped).
  int64 valid_until_unix = 3;
}

// One browser run of a Space as the room may see it. Ids, the starter's subject id, the honest phase,
// counts and hosts only.
message RoomBrowserRun {
  string run_id = 1;
  string thread_id = 2;
  // The starter: the run owner's subject id.
  string started_by_subject_id = 3;
  // The honest run phase (`queued`, `running`, `completed`, `failed`, `cancelled`).
  string phase = 4;
  int64 started_at_unix = 5;
  // Zero while the run is not finished.
  int64 finished_at_unix = 6;
  // Distinct hosts the run acted on, first seen first, at most eight. Hosts only, never a URL.
  repeated string hosts = 7;
  // The run's browser actions so far.
  uint32 step_count = 8;
}

message ReadRoomBrowserTimelineRequest {
  string space_id = 1;
  string run_id = 2;
  // The event id of the last event the caller already read; empty starts at the beginning.
  string after_event_id = 3;
  // 1 to 200; zero takes the default of 50.
  uint32 limit = 4;
  string space_read_decision_ref = 5;
  string space_read_decision_token = 6;
}

message ReadRoomBrowserTimelineResponse {
  RoomBrowserRunHeader run = 1;
  repeated RoomBrowserEvent events = 2;
  // Pass as `after_event_id` for the next page; empty when the timeline has no more events.
  string next_event_id = 3;
  // Unix seconds after which this verdict no longer holds.
  int64 valid_until_unix = 4;
}

// The run a timeline belongs to, without its hosts or counts.
message RoomBrowserRunHeader {
  string run_id = 1;
  string thread_id = 2;
  string started_by_subject_id = 3;
  string phase = 4;
  int64 started_at_unix = 5;
  int64 finished_at_unix = 6;
}

// One projected timeline row. Only the fields the projector names are set; a field that does not apply
// to the kind is empty.
message RoomBrowserEvent {
  // The events table id; the cursor the next page starts after.
  string event_id = 1;
  int64 at_unix = 2;
  // action, observation, paused, resumed, approval_required, approval_decided, handoff_requested,
  // handoff_resolved, result.
  string kind = 3;
  // The agent's action id of the step the row belongs to.
  string step = 4;
  string action_type = 5;
  // The host of the page or action target. Never a full URL.
  string host = 6;
  string status = 7;
  string risk_category = 8;
  // An observation's screenshot reference; read through AuthorizeRoomBrowserEvidence.
  string evidence_id = 9;
  string approval_id = 10;
  // approval_decided: the decision as recorded.
  string decision = 11;
  // handoff_requested: the closed hand-off kind.
  string handoff_kind = 12;
  // handoff_resolved and result: the closed outcome.
  string outcome = 13;
}

message AuthorizeRoomBrowserEvidenceRequest {
  string space_id = 1;
  string run_id = 2;
  // The evidence id the timeline named (an observation's screenshot reference).
  string evidence_id = 3;
  string space_read_decision_ref = 4;
  string space_read_decision_token = 5;
}

message AuthorizeRoomBrowserEvidenceResponse {
  // The Quarry artifact reference to fetch. It is the evidence id, once checked against the run.
  string artifact_id = 1;
}

// Arguments of the owner's summary read of one room browser run (WS20-S3).
message SummarizeRoomBrowserRunRequest {
  // The room browser run to summarize.
  string run_id = 1;
  // Must be the caller's own org.
  string org_id = 2;
  // Must be the caller's own user id; the run must be this user's.
  string user_id = 3;
}

// The owner's summary of one room browser run. Counts and ids only.
message SummarizeRoomBrowserRunResponse {
  // Browser actions the run dispatched.
  uint32 steps = 1;
  // Distinct hosts the run acted on, first seen first, at most eight. Hosts only, never a URL.
  repeated string hosts = 2;
  // Evidence ids of the run's persisted observations, first seen first, at most six.
  repeated string evidence_ids = 3;
  // Hand-offs the run requested.
  uint32 handoffs = 4;
  // Unix seconds the run was created.
  int64 started_at_unix = 5;
  // Unix seconds the run ended; zero while it has not.
  int64 finished_at_unix = 6;
}
