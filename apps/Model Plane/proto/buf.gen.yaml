version: v2
managed:
  enabled: true
plugins:
  # Rust is intentionally NOT generated here: mp-contracts/build.rs runs
  # tonic_build directly against this proto/ tree at `cargo build` time and
  # includes the output via `tonic::include_proto!` (OUT_DIR), so Rust bindings
  # are always fresh and are never checked in (see docs/phase-0/proto-contracts.md
  # §7). A prior checked-in copy under mp-contracts/src/gen went stale and was
  # removed — do not re-add a Rust plugin/out here.

  # Go — protoc-gen-go + grpc
  - remote: buf.build/protocolbuffers/go
    out: ../go/gen
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go
    out: ../go/gen
    opt:
      - paths=source_relative

  # Python — protoc-gen-python
  - remote: buf.build/protocolbuffers/python
    out: ../python/mp-events-py/src/mp_events/_gen

  # TypeScript — protoc-gen-es (message types only; transport-agnostic).
  # Output lands in verevon's lib/model-plane/gen/ so the frontend can
  # construct typed requests + decode typed responses without a separate
  # gRPC client. verevon uses Connect-RPC over HTTP for the actual wire
  # call (see lib/model-plane/reasoning.ts for the existing pattern).
  - remote: buf.build/bufbuild/es
    out: ../../Frontend Plane/verevon/src/lib/model-plane/gen
    opt:
      - target=ts
      - import_extension=js
  - remote: buf.build/bufbuild/connect-es
    out: ../../Frontend Plane/verevon/src/lib/model-plane/gen
    opt:
      - target=ts
      - import_extension=js
