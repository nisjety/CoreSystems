# NATS Server Configuration — Model Plane
jetstream: true
http: "127.0.0.1:8222"
max_payload: 1MB
store_dir: /data/jetstream

# Distinct runtime, audit, deployment-only, and explicitly unbound producer
# principals. Audit can bind and acknowledge its fixed consumers but cannot
# create/update streams/consumers. No deployed service receives a generic
# Model-plane runtime credential.
authorization {
  users: [
    {
      user: "model-gateway-runtime"
      password: $MODEL_GATEWAY_NATS_PASSWORD
      permissions: {
        publish: [
          "mp.v1.run.*.event",
          "mp.v1.stream.opened",
          "mp.v1.stream.closed",
          "mp.v1.usage.*",
          "mp.v1.ingress.accepted",
          "mp.v1.orchestration.run",
          "mp.v1.feedback.rated",
          "mp.v1.finetune.>"
        ]
        subscribe: [
          "dataplane.documents.indexed",
          "mp.v1.capability.>",
          "_INBOX.MODEL_GATEWAY_RUNTIME.>"
        ]
      }
    }
    {
      user: "session-core-runtime"
      password: $MODEL_SESSION_CORE_NATS_PASSWORD
      permissions: {
        publish: [
          # Run lifecycle projections drained from the outbox (RUN_COMPLETED ->
          # capability-core skill learning). Without this grant the server
          # rejects the publish and the drainer burns every attempt to
          # terminal_at, so the whole learning loop is inert. model-gateway and
          # orchestrator-core already hold the same grant.
          "mp.v1.run.*.event",
          "verevon.audit.v2.model.session-core.>",
          "$JS.API.STREAM.INFO.TOOLS_COMPLETIONS",
          "$JS.API.STREAM.INFO.MP_ORCHESTRATION_EVENTS",
          "$JS.API.CONSUMER.INFO.TOOLS_COMPLETIONS.session-core-tools",
          "$JS.API.CONSUMER.INFO.MP_ORCHESTRATION_EVENTS.session-core-orchestration",
          "$JS.API.CONSUMER.MSG.NEXT.TOOLS_COMPLETIONS.session-core-tools",
          "$JS.API.CONSUMER.MSG.NEXT.MP_ORCHESTRATION_EVENTS.session-core-orchestration",
          "$JS.ACK.TOOLS_COMPLETIONS.session-core-tools.>"
        ]
        subscribe: [
          "_INBOX.SESSION_CORE_RUNTIME.>"
        ]
      }
    }
    {
      user: "capability-core-runtime"
      password: $MODEL_CAPABILITY_CORE_NATS_PASSWORD
      permissions: {
        publish: [
          "mp.v1.capability.>",
          # G7 skill-learning review (sessionreview.RunConsumer) and AUTO-2
          # run-watch notify (runwatch.Notifier), both bound via a durable
          # JetStream consumer with nats.Bind + manual ack — added 2026-09-17
          # when both were found to hold only the plain "mp.v1.run.*.event"
          # subscribe below, which covers a raw core-NATS subscribe but not
          # nats.Bind (which calls $JS.API.CONSUMER.INFO internally before it
          # can subscribe) or msg.Ack()/msg.Nak() (which publish to $JS.ACK).
          # Without these two lines the bind hangs until "context deadline
          # exceeded" and the server logs "Permissions Violation for Publish
          # to $JS.API.CONSUMER.INFO..." — silently, same failure class the
          # session-core-runtime comment above already warns about. Matches
          # application-insight-model's already-working grant shape below for
          # its own two JetStream-bound consumers.
          "$JS.API.CONSUMER.INFO.MODEL_PLANE_RUN_EVENTS.capability-core-skill-review",
          "$JS.API.CONSUMER.INFO.MODEL_PLANE_RUN_EVENTS.capability-core-run-watch-notify",
          "$JS.ACK.MODEL_PLANE_RUN_EVENTS.capability-core-skill-review.>",
          "$JS.ACK.MODEL_PLANE_RUN_EVENTS.capability-core-run-watch-notify.>"
        ]
        subscribe: [
          # taskexec.RunCompletionConsumer still plain-subscribes here
          # directly (its side effect is a cheap local Postgres write, so it
          # does not need JetStream durability) — this grant stays for that,
          # independent of the two JetStream-bound consumers below.
          "mp.v1.run.*.event",
          # The actual delivery subjects for the two JetStream push consumers
          # above; the DeliverSubject a message is pushed to is NOT
          # "mp.v1.run.*.event" once a consumer has one configured (see
          # nats-provisioner's DeliverSubject values, services/
          # nats-provisioner/main.go) — a subscribe grant on the original
          # subject does not cover it.
          "_VEREVON.MODEL.DELIVER.capability.skill_review",
          "_VEREVON.MODEL.DELIVER.capability.run_watch_notify",
          "_INBOX.CAPABILITY_CORE_RUNTIME.>"
        ]
      }
    }
    {
      user: "orchestrator-core-runtime"
      password: $MODEL_ORCHESTRATOR_CORE_NATS_PASSWORD
      permissions: {
        publish: ["mp.v1.run.*.event"]
        subscribe: [
          "mp.v1.orchestration.>",
          "mp.v1.feedback.rated",
          "_INBOX.ORCHESTRATOR_CORE_RUNTIME.>"
        ]
      }
    }
    # No current in-repo service publishes tool completions. This scoped role
    # is intentionally not injected into Compose; an operator must assign it
    # only to a verified tool-completion worker before enabling that workflow.
    {
      user: "tool-completion-producer"
      password: $MODEL_TOOL_COMPLETION_NATS_PASSWORD
      permissions: {
        publish: ["tools.completions.*"]
        subscribe: ["_INBOX.TOOL_COMPLETION_PRODUCER.>"]
      }
    }
    {
      user: "cost-core-runtime"
      password: $MODEL_COST_CORE_NATS_PASSWORD
      permissions: {
        publish: []
        subscribe: [
          "mp.v1.usage.*",
          "_INBOX.COST_CORE_RUNTIME.>"
        ]
      }
    }
    {
      user: "application-convex-model"
      password: $APPLICATION_CONVEX_MODEL_NATS_PASSWORD
      permissions: {
        publish: []
        subscribe: ["mp.v1.run.*.event", "_INBOX.APPLICATION_CONVEX_MODEL.>"]
      }
    }
    {
      user: "application-insight-model"
      password: $APPLICATION_INSIGHT_MODEL_NATS_PASSWORD
      permissions: {
        publish: [
          "$JS.API.CONSUMER.INFO.MODEL_PLANE_RUN_EVENTS.insight-core-agent-run-subscriber",
          "$JS.API.CONSUMER.INFO.MP_ORCHESTRATION_EVENTS.insight-core-agent-approval-subscriber",
          "$JS.ACK.MODEL_PLANE_RUN_EVENTS.insight-core-agent-run-subscriber.>",
          "$JS.ACK.MP_ORCHESTRATION_EVENTS.insight-core-agent-approval-subscriber.>"
        ]
        subscribe: [
          "_INBOX.APPLICATION_INSIGHT_MODEL.>",
          "_VEREVON.MODEL.DELIVER.application.insight.run insight-core-agent-run-subscriber",
          "_VEREVON.MODEL.DELIVER.application.insight.approval insight-core-agent-approval-subscriber"
        ]
      }
    }
    {
      user: "audit-core-model"
      password: $AUDIT_MODEL_NATS_PASSWORD
      permissions: {
        publish: [
          "$JS.API.CONSUMER.INFO.VEREVON_CONTROL_OBSERVABILITY.audit-core-model-v3-audit",
          "$JS.API.CONSUMER.INFO.VEREVON_CONTROL_OBSERVABILITY.audit-core-model-v3-usage",
          "$JS.ACK.VEREVON_CONTROL_OBSERVABILITY.audit-core-model-v3-audit.>",
          "$JS.ACK.VEREVON_CONTROL_OBSERVABILITY.audit-core-model-v3-usage.>",
          "verevon.dlq.audit-core.audit",
          "verevon.dlq.audit-core.usage"
        ]
        subscribe: [
          "_INBOX.AUDIT_MODEL.>",
          "_VEREVON.AUDIT.DELIVER.model.audit-v2 audit-core-model-v3-audit",
          "_VEREVON.AUDIT.DELIVER.model.usage-v2 audit-core-model-v3-usage"
        ]
      }
    }
    {
      user: "observability-provisioner-model"
      password: $MODEL_NATS_PROVISIONER_PASSWORD
      permissions: {
        publish: ["$JS.API.STREAM.>", "$JS.API.CONSUMER.>"]
        subscribe: "_INBOX.PROVISIONER_MODEL.>"
      }
    }
  ]
}
logtime: true
