# NATS Server Configuration — Model Plane
jetstream: true
http: "127.0.0.1:8222"
max_payload: 1MB
store_dir: /data/jetstream

# Distinct runtime, audit, and deployment-only principals. Audit can bind and
# acknowledge its fixed consumers but cannot create/update streams/consumers.
authorization {
  users: [
    {
      user: "model-runtime"
      password: $MODEL_NATS_RUNTIME_PASSWORD
      permissions: {
        publish: [
          "mp.v1.>",
          "velion.agent.>",
          "velion.session.>",
          "aqencia.reasoning.>",
          "agents.>",
          "tools.>"
        ]
        subscribe: [
          "mp.v1.>",
          "tools.completions.*",
          "dataplane.documents.indexed",
          "_INBOX.MODEL_RUNTIME.>"
        ]
      }
    }
    {
      user: "model-gateway-runtime"
      password: $MODEL_GATEWAY_NATS_PASSWORD
      permissions: {
        publish: [
          "mp.v1.>",
          "velion.agent.>",
          "velion.session.>",
          "aqencia.reasoning.>",
          "agents.>"
        ]
        subscribe: [
          "mp.v1.>",
          "dataplane.documents.indexed",
          "_INBOX.MODEL_GATEWAY_RUNTIME.>"
        ]
      }
    }
    {
      user: "session-core-runtime"
      password: $MODEL_SESSION_CORE_NATS_PASSWORD
      permissions: {
        publish: [
          "velion.audit.v2.model.session-core.>",
          "$JS.API.STREAM.INFO.TOOLS_COMPLETIONS",
          "$JS.API.STREAM.INFO.MP_ORCHESTRATION_EVENTS",
          "$JS.API.CONSUMER.INFO.TOOLS_COMPLETIONS.session-core-tools",
          "$JS.API.CONSUMER.INFO.MP_ORCHESTRATION_EVENTS.session-core-orchestration",
          "$JS.API.CONSUMER.MSG.NEXT.TOOLS_COMPLETIONS.session-core-tools",
          "$JS.API.CONSUMER.MSG.NEXT.MP_ORCHESTRATION_EVENTS.session-core-orchestration",
          "$JS.ACK.TOOLS_COMPLETIONS.session-core-tools.>"
        ]
        subscribe: [
          "_INBOX.SESSION_CORE_RUNTIME.>"
        ]
      }
    }
    {
      user: "application-convex-model"
      password: $APPLICATION_CONVEX_MODEL_NATS_PASSWORD
      permissions: {
        publish: []
        subscribe: ["mp.v1.run.*.event", "_INBOX.APPLICATION_CONVEX_MODEL.>"]
      }
    }
    {
      user: "application-insight-model"
      password: $APPLICATION_INSIGHT_MODEL_NATS_PASSWORD
      permissions: {
        publish: [
          "$JS.API.CONSUMER.INFO.MODEL_PLANE_RUN_EVENTS.insight-core-agent-run-subscriber",
          "$JS.API.CONSUMER.INFO.MP_ORCHESTRATION_EVENTS.insight-core-agent-approval-subscriber",
          "$JS.ACK.MODEL_PLANE_RUN_EVENTS.insight-core-agent-run-subscriber.>",
          "$JS.ACK.MP_ORCHESTRATION_EVENTS.insight-core-agent-approval-subscriber.>"
        ]
        subscribe: [
          "_INBOX.APPLICATION_INSIGHT_MODEL.>",
          "_VELION.MODEL.DELIVER.application.insight.run insight-core-agent-run-subscriber",
          "_VELION.MODEL.DELIVER.application.insight.approval insight-core-agent-approval-subscriber"
        ]
      }
    }
    {
      user: "audit-core-model"
      password: $AUDIT_MODEL_NATS_PASSWORD
      permissions: {
        publish: [
          "$JS.API.CONSUMER.INFO.VELION_CONTROL_OBSERVABILITY.audit-core-model-v3-audit",
          "$JS.API.CONSUMER.INFO.VELION_CONTROL_OBSERVABILITY.audit-core-model-v3-usage",
          "$JS.ACK.VELION_CONTROL_OBSERVABILITY.audit-core-model-v3-audit.>",
          "$JS.ACK.VELION_CONTROL_OBSERVABILITY.audit-core-model-v3-usage.>",
          "velion.dlq.audit-core.audit",
          "velion.dlq.audit-core.usage"
        ]
        subscribe: [
          "_INBOX.AUDIT_MODEL.>",
          "_VELION.AUDIT.DELIVER.model.audit-v2 audit-core-model-v3-audit",
          "_VELION.AUDIT.DELIVER.model.usage-v2 audit-core-model-v3-usage"
        ]
      }
    }
    {
      user: "observability-provisioner-model"
      password: $MODEL_NATS_PROVISIONER_PASSWORD
      permissions: {
        publish: ["$JS.API.STREAM.>", "$JS.API.CONSUMER.>"]
        subscribe: "_INBOX.PROVISIONER_MODEL.>"
      }
    }
  ]
}
logtime: true
