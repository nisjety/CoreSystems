# Dev profile overrides — debug logging and relaxed limits.
#
# Legacy compatibility is intentionally disabled here as well as in the
# release compose file. Enabling it needs a separately reviewed migration
# profile with a scoped NATS principal; the default ACLs are canonical-v1 only.

services:
  model-gateway:
    environment:
      RUST_LOG: debug
      RATE_LIMIT_RPM: "1000"
      ALLOWED_MODELS: ""
      # Wave 7 — dev profile enables fine-tuning routes; production keeps off.
      FINETUNE_ENABLED: "1"
      FINETUNE_ORG_BUDGET_USD: "50"
      FINETUNE_PER_JOB_BUDGET_USD: "20"

  session-core:
    environment:
      RUST_LOG: debug
      COMPACTION_THRESHOLD: "200000"

  inference-core:
    environment:
      RUST_LOG: debug
      INFERENCE_CACHE_TTL_SECS: "60"

  execution-core:
    environment:
      RUST_LOG: debug
      # Ticket-action support (ticket_tools.rs::AgentTicketActionClient::from_env)
      # requires all four of CONTROL_PLANE_USER_CORE_URL,
      # EXECUTION_CORE_CONTROL_RUN_ACTION_TOKEN, CONVERSATION_CORE_AGENT_ACTION_URL,
      # and CONVERSATION_EXECUTION_CORE_SERVICE_TOKEN together, by design ("a
      # caller must not confuse bad wiring with a deliberate disabled state").
      # Control Plane's bootstrap auto-publishes the two token values into
      # .env.generated-secrets regardless of whether Application Plane's
      # conversation-core (which the two URL values point at) is running — so
      # a dev stack with Model Plane + Control Plane but no Application Plane
      # lands on exactly 2-of-4, the hard-error case, and execution-core
      # crash-loops. Force both tokens back to unset here so the dev profile
      # resolves to the clean 0-of-4 disabled state until the URLs are also
      # wired for this environment — not a code fix, a config fix.
      EXECUTION_CORE_CONTROL_RUN_ACTION_TOKEN: ""
      CONVERSATION_EXECUTION_CORE_SERVICE_TOKEN: ""
      # Same auto-publish issue, for the fifth, separately-gated token: alone
      # (without the four above) it is ALSO a hard error, not a smaller
      # partial-enable.
      EXECUTION_CORE_CONTROL_MODEL_ACTION_VIEW_TOKEN: ""

  orchestrator-core:
    environment:
      LOG_LEVEL: debug
      ENABLE_COMPAT_ADAPTER: "false"
      MP_COMPAT_MODE: v1_only

  capability-core:
    environment:
      LOG_LEVEL: debug

  sandbox-manager:
    environment:
      LOG_LEVEL: debug
      # The service intentionally refuses its current in-memory stores outside
      # an explicit local-development opt-in. The full-stack launcher layers
      # this override only in dev; production never receives this setting.
      SANDBOX_MANAGER_ALLOW_EPHEMERAL_DEVELOPMENT: "true"

  browser-broker:
    environment:
      LOG_LEVEL: debug

  letta-bridge:
    environment:
      LOG_LEVEL: debug

  cost-core:
    environment:
      LOG_LEVEL: debug

  bridge-core:
    environment:
      LOG_LEVEL: debug
