  agent-memory-server:
    image: ${AGENT_MEMORY_SERVER_RELEASE_IMAGE:?AGENT_MEMORY_SERVER_RELEASE_IMAGE digest is required}
    pull_policy: never
  cost-core:
    build: !reset null
    image: ${COST_CORE_RELEASE_IMAGE:?COST_CORE_RELEASE_IMAGE digest is required}
    pull_policy: never
  bridge-core:
