name: model-plane

x-build-metadata: &build-metadata
  SOURCE_REVISION: ${SOURCE_REVISION:?SOURCE_REVISION build arg required for image provenance}
  BUILD_DATE: ${BUILD_DATE:?BUILD_DATE build arg required for image provenance}

x-runtime-defaults: &runtime-defaults
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"

services:
  # --- Infrastructure ---

  postgres:
    <<: *runtime-defaults
    image: postgres:16.14-alpine3.24
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MODEL_POSTGRES_PASSWORD:?MODEL_POSTGRES_PASSWORD is required}
      POSTGRES_DB: session_core
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - mp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  nats:
    <<: *runtime-defaults
    image: nats:2.12.12-alpine3.22@sha256:2ca98656a279b2d88cfdf2b8c3f0d5d7f3941ae9dc2ab12ebaa92d83e0f4ccdb
    command: ["-js", "-m", "8222", "-sd", "/data", "--auth", "${MODEL_NATS_TOKEN:?MODEL_NATS_TOKEN is required}"]
    volumes:
      - mp-nats-data:/data
    ports:
      - "127.0.0.1:4228:4222"
      - "127.0.0.1:8228:8222"
    networks:
      default:
      inter-plane-bus:
        aliases:
          - model-nats
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    <<: *runtime-defaults
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MODEL_MINIO_ROOT_USER:?MODEL_MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MODEL_MINIO_ROOT_PASSWORD:?MODEL_MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    volumes:
      - mp-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 3

  dragonfly:
    <<: *runtime-defaults
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.37.0
    command:
      - "--cache_mode=true"
      - "--maxmemory=256mb"
      - "--proactor_threads=1"
      - "--dir=/data"
      - "--requirepass=${MODEL_DRAGONFLY_PASSWORD:?MODEL_DRAGONFLY_PASSWORD is required}"
    ports:
      - "127.0.0.1:6391:6379"
    volumes:
      - mp-dragonfly-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${MODEL_DRAGONFLY_PASSWORD:?MODEL_DRAGONFLY_PASSWORD is required}", "ping"]
      interval: 5s
      retries: 3

  temporal:
    <<: *runtime-defaults
    image: temporalio/auto-setup:1.27.2
    environment:
      DB: postgres12_pgx        # valid drivers: mysql8 / postgres12 / postgres12_pgx / cassandra
      DB_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PWD: ${MODEL_TEMPORAL_POSTGRES_PASSWORD:?MODEL_TEMPORAL_POSTGRES_PASSWORD is required}
      POSTGRES_SEEDS: temporal-postgres
    ports:
      - "127.0.0.1:7234:7233"
    depends_on:
      temporal-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address temporal:7233 | grep -q SERVING"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  temporal-postgres:
    <<: *runtime-defaults
    image: postgres:16.14-alpine3.24
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MODEL_TEMPORAL_POSTGRES_PASSWORD:?MODEL_TEMPORAL_POSTGRES_PASSWORD is required}
      POSTGRES_DB: temporal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
    volumes:
      - mp-temporal-postgres-data:/var/lib/postgresql/data

  temporal-ui:
    <<: *runtime-defaults
    image: temporalio/ui:2.30.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:8233:8080"
    depends_on:
      temporal:
        condition: service_healthy

  # OTEL collector for distributed tracing
  otel-collector:
    <<: *runtime-defaults
    image: otel/opentelemetry-collector-contrib:0.96.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
      - "127.0.0.1:8889:8889"   # Prometheus exporter

  # --- Rust services ---

  model-gateway:
    <<: *runtime-defaults
    build:
      context: ..
      dockerfile: rust/services/model-gateway/Dockerfile
      args: *build-metadata
    ports:
      - "127.0.0.1:8080:8080"   # HTTP
    environment:
      RUST_LOG: info
      # This service also joins inter-plane-bus, where the generic `nats`
      # hostname can resolve another plane's broker. Use the plane-unique alias.
      NATS_URL: nats://model-nats:4222
      NATS_AUTH_TOKEN: ${MODEL_NATS_TOKEN:?MODEL_NATS_TOKEN is required}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: model-gateway
      # Empty by default = "Velion Auto": inference-core resolves an unpinned
      # request to the configured provider's own default (per-provider), so chat
      # works with whichever provider key is set (Anthropic-only, OpenAI-only,
      # or both). Set DEFAULT_MODEL to pin a specific model org-wide.
      DEFAULT_MODEL: ${DEFAULT_MODEL:-}
      RATE_LIMIT_RPM: "100"
      # Local-dev auth bypass is defined in ../.env, but compose was not
      # forwarding it, so Velion's `dev-bypass` bearer was rejected before
      # inference. Production should leave this empty and configure JWKS.
      MODEL_GATEWAY_AUTH_DEV_BYPASS: ${MODEL_GATEWAY_AUTH_DEV_BYPASS:-}
      ALLOW_INSECURE_DEV_DEFAULTS: ${ALLOW_INSECURE_DEV_DEFAULTS:-}
      AUTH_CORE_JWKS_URL: ${AUTH_CORE_JWKS_URL:-}
      AUTH_CORE_ISSUER: ${AUTH_CORE_ISSUER:-}
      AUTH_CORE_AUDIENCE: ${AUTH_CORE_AUDIENCE:-model-gateway}
      EXECUTION_CORE_AUTH_AUDIENCE: ${EXECUTION_CORE_AUTH_AUDIENCE:-execution-core}
      AUTH_CORE_URL: ${AUTH_CORE_URL:-http://auth-core:3011}
      MODEL_GATEWAY_SERVICE_ID: ${MODEL_GATEWAY_SERVICE_ID:-model-gateway}
      MODEL_GATEWAY_SERVICE_API_KEY: ${MODEL_GATEWAY_SERVICE_API_KEY:?MODEL_GATEWAY_SERVICE_API_KEY is required}
      # Wave 7 — fine-tuning kill switch + budget guard (off by default in
      # production-style profile; dev override flips FINETUNE_ENABLED=1).
      FINETUNE_ENABLED: ${FINETUNE_ENABLED:-0}
      FINETUNE_ORG_BUDGET_USD: ${FINETUNE_ORG_BUDGET_USD:-50}
      FINETUNE_PER_JOB_BUDGET_USD: ${FINETUNE_PER_JOB_BUDGET_USD:-20}
      # Use explicit Model Plane aliases here. The gateway also joins the
      # shared inter-plane bus for Velion, where names like `session-core`
      # can resolve to Control Plane services instead.
      SESSION_CORE_ADDR: http://model-plane-session-core-1:9091
      INFERENCE_CORE_ADDR: http://model-plane-inference-core-1:9092
      # Phase 7 B5 — cost-core HTTP API. The gateway reads the price catalogue
      # (GET /api/v1/pricing) to populate the streamed Usage `cost_usd` off the
      # same source cost-core prices the durable ledger with. Unset → null cost.
      COST_CORE_URL: ${COST_CORE_URL:-http://model-plane-cost-core-1:8089}
      # orchestrator-core's gRPC (OrchestrationCoreService proxy → session-core)
      # listens on :9080; :8084 is its HTTP health port. Pointing the gateway's
      # gRPC client at :8084 yields "h2 protocol error".
      ORCHESTRATOR_CORE_ADDR: http://model-plane-orchestrator-core-1:9080
      # execution-core gRPC — used to resume a run after an approval is granted
      # (B3 approval→resume). Without this the gateway falls back to
      # localhost:9093 and the resume call fails with "tcp connect error".
      EXECUTION_CORE_ADDR: http://model-plane-execution-core-1:9093
      SANDBOX_MANAGER_ADDR: http://model-plane-sandbox-manager-1:9094
      BROWSER_BROKER_ADDR: http://model-plane-browser-broker-1:9095
      MEMORY_SERVICE_URL: http://model-plane-session-core-1:9091
      # Legacy env name retained for older gateway builds; memory authority is
      # session-core, which syncs to Letta through LETTA_MEMORY_ADDR below.
      LETTA_BRIDGE_ADDR: http://model-plane-session-core-1:9091
      CAPABILITY_CORE_ADDR: http://model-plane-capability-core-1:9097
      CAPABILITY_CORE_HTTP_URL: http://model-plane-capability-core-1:8085
      # Data Plane v2 — retrieval-engine serves Retrieval+Document+Knowledge on
      # ONE gRPC port (50052). Without this the gateway falls to localhost:50052
      # (unreachable in-container) → "tcp connect error" on RAG/upload. The
      # var name is DATAPLANE_* (state.rs::from_env), NOT the .env DATA_PLANE_*.
      # (graph/wiki gRPC clients have a separate HTTP-only architecture mismatch
      # in Data Plane v2 — tracked, not wired here.)
      DATAPLANE_RETRIEVAL_URL: ${DATAPLANE_RETRIEVAL_URL:-http://dpv2-retrieval-engine:50052}
      # graphRAG (dpv2-graph-index gRPC :50053) + LLM wiki (dpv2-wiki-store gRPC
      # :50054). Both serve gRPC on inter-plane-bus; the gateway only defaulted
      # to localhost. These make the graph_client/wiki_client REACHABLE; calling
      # them from the chat path is a separate (not-yet-wired) integration.
      DATAPLANE_GRAPH_URL: ${DATAPLANE_GRAPH_URL:-http://dpv2-graph-index:50053}
      DATAPLANE_WIKI_URL: ${DATAPLANE_WIKI_URL:-http://dpv2-wiki-store:50054}
      # retrieval-engine's ApiKeyInterceptor requires this as `x-api-key` gRPC
      # metadata (else "invalid or missing credential"). Maps the .env key.
      DATAPLANE_INTERNAL_KEY: ${DATAPLANE_INTERNAL_KEY:-${DATA_PLANE_INTERNAL_KEY:-}}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-08-01-preview}
      # Wave 11 — Speech provider (TTS via /audio/speech, STT via
      # /audio/transcriptions). Auto-detects Azure when
      # AZURE_OPENAI_ENDPOINT + AZURE_OPENAI_API_KEY are set,
      # otherwise falls back to OpenAI when OPENAI_API_KEY is set,
      # otherwise both RPCs return Unimplemented.
      #
      # Azure deployment names default to "tts" and "whisper"; override
      # to match what's actually deployed in the Azure portal.
      AZURE_OPENAI_TTS_DEPLOYMENT: ${AZURE_OPENAI_TTS_DEPLOYMENT:-tts}
      AZURE_OPENAI_STT_DEPLOYMENT: ${AZURE_OPENAI_STT_DEPLOYMENT:-whisper}
      # Per-operation Azure overrides — set when TTS or STT lives in a
      # different Azure resource than chat (e.g. gpt-4o-mini-tts in
      # eastus2 while everything else is in swedencentral). Empty / unset
      # → falls through to AZURE_OPENAI_ENDPOINT / _API_KEY / _API_VERSION.
      #
      # P0.4 residency: the eastus2 TTS resource egresses voice to the US.
      # speech.rs IGNORES the AZURE_OPENAI_TTS_* override (falling back to the
      # EU AZURE_OPENAI_ENDPOINT) unless MODEL_PLANE_ALLOW_NON_EU_TTS=true.
      # Default off so voice stays EU-resident.
      MODEL_PLANE_ALLOW_NON_EU_TTS: ${MODEL_PLANE_ALLOW_NON_EU_TTS:-false}
      AZURE_OPENAI_TTS_ENDPOINT: ${AZURE_OPENAI_TTS_ENDPOINT:-}
      AZURE_OPENAI_TTS_API_KEY: ${AZURE_OPENAI_TTS_API_KEY:-}
      AZURE_OPENAI_TTS_API_VERSION: ${AZURE_OPENAI_TTS_API_VERSION:-}
      AZURE_OPENAI_STT_ENDPOINT: ${AZURE_OPENAI_STT_ENDPOINT:-}
      AZURE_OPENAI_STT_API_KEY: ${AZURE_OPENAI_STT_API_KEY:-}
      AZURE_OPENAI_STT_API_VERSION: ${AZURE_OPENAI_STT_API_VERSION:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-tts-1}
      OPENAI_STT_MODEL: ${OPENAI_STT_MODEL:-whisper-1}
      # Wave 9 — Quarry-v2 edge for Fetch + ExtractStructured RPCs.
      # Empty / unset → both RPCs return Unimplemented (gateway still
      # serves Invoke, Health, etc.). quarry-edge lives in a separate
      # compose project (Ingestion Plane) but, like this gateway, is
      # joined to the shared external `inter-plane-bus` network — so
      # the in-network service name resolves directly (Phase 6
      # compose-wiring fix: this previously defaulted to
      # host.docker.internal, a stale carry-over from before quarry-edge
      # joined inter-plane-bus; live-verified both routes work, the
      # in-network name removes the dependency on quarry-edge's
      # host-published port staying bound to 127.0.0.1).
      QUARRY_EDGE_URL: ${QUARRY_EDGE_URL:-http://quarry-edge:8082}
      QUARRY_EDGE_TIMEOUT_SECS: ${QUARRY_EDGE_TIMEOUT_SECS:-30}
      # Local semantic-response cache (Dragonfly exact-match). Default ON,
      # pointing at the Model Plane Dragonfly; set empty to disable. If the
      # managed Redis LangCache (LANGCACHE_URL/_CACHE_ID/_API_KEY) is configured
      # it takes precedence. Exact (org+model+prompt) match only — no embeddings
      # and no cross-plane calls; the vector-similarity tier is owned by Data
      # Plane v2 and layered on separately.
      SEMANTIC_CACHE_URL: ${SEMANTIC_CACHE_URL:-redis://:${MODEL_DRAGONFLY_PASSWORD:?MODEL_DRAGONFLY_PASSWORD is required}@dragonfly:6379}
      SEMANTIC_CACHE_TTL_SECS: ${SEMANTIC_CACHE_TTL_SECS:-3600}
      # Semantic (vector) cache tier — owned by Data Plane v2 (embeddings +
      # Qdrant). With this AND SEMANTIC_CACHE_URL set (default), the gateway
      # LAYERS them: a fast Dragonfly exact-match hit first, then a DPv2
      # /v1/cache/semantic/* (HTTP) fallback that also warms the exact tier.
      # Off by default → exact-match only. DATAPLANE_INTERNAL_KEY (above)
      # authorizes the call; the HTTP base reuses the same retrieval-engine the
      # graph-grounding path already targets.
      SEMANTIC_CACHE_DATAPLANE_ENABLED: ${SEMANTIC_CACHE_DATAPLANE_ENABLED:-false}
      DATAPLANE_RETRIEVAL_HTTP_URL: ${DATAPLANE_RETRIEVAL_HTTP_URL:-http://dpv2-retrieval-engine:8004}
    networks:
      default: {}
      inter-plane-bus:
        aliases:
          - model-plane-model-gateway-1
          - model-gateway
    depends_on:
      nats:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      retries: 3

  session-core:
    <<: *runtime-defaults
    build:
      context: ..
      dockerfile: rust/services/session-core/Dockerfile
      args: *build-metadata
    ports:
      - "127.0.0.1:18081:8081"  # HTTP health — host 18081 avoids collision with Ingestion Plane quarry-control (host 8081)
      - "127.0.0.1:9091:9091"   # gRPC
    environment:
      RUST_LOG: info
      DATABASE_URL: postgresql://postgres:${MODEL_POSTGRES_PASSWORD:?MODEL_POSTGRES_PASSWORD is required}@postgres:5432/session_core
      NATS_URL: nats://nats:4222
      NATS_AUTH_TOKEN: ${MODEL_NATS_TOKEN:?MODEL_NATS_TOKEN is required}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: session-core
      AUTH_CORE_JWKS_URL: ${AUTH_CORE_JWKS_URL:?AUTH_CORE_JWKS_URL is required}
      AUTH_CORE_ISSUER: ${AUTH_CORE_ISSUER:?AUTH_CORE_ISSUER is required}
      AUTH_CORE_URL: ${AUTH_CORE_URL:-http://auth-core:3011}
      SESSION_CORE_AUTH_AUDIENCE: ${SESSION_CORE_AUTH_AUDIENCE:-session-core}
      # Dedicated short-lived service-principal credentials for the optional
      # session-core -> letta-bridge path. When LETTA_MEMORY_ADDR is non-empty,
      # session-core fails startup closed unless all three are configured.
      SESSION_CORE_SERVICE_ID: ${SESSION_CORE_SERVICE_ID:-session-core}
      SESSION_CORE_SERVICE_API_KEY: ${SESSION_CORE_SERVICE_API_KEY:-}
      CONTEXT_RECENT_MESSAGES: "20"
      COMPACTION_THRESHOLD: "80000"
      # P0.4 residency: region stamped onto every run record at StartRun.
      # Defaults to the EU region (Sweden Central).
      MODEL_PLANE_RESIDENCY: ${MODEL_PLANE_RESIDENCY:-swedencentral}
      LETTA_MEMORY_ADDR: ${LETTA_MEMORY_ADDR:-http://model-plane-letta-bridge-1:9096}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 10s
      retries: 3

  inference-core:
    <<: *runtime-defaults
    build:
      context: ..
      dockerfile: rust/services/inference-core/Dockerfile
      args: *build-metadata
    ports:
      - "127.0.0.1:18082:8082"  # HTTP health — host 18082 avoids collision with Ingestion Plane quarry-edge (host 8082)
    environment:
      RUST_LOG: info
      AUTH_CORE_JWKS_URL: ${AUTH_CORE_JWKS_URL:?AUTH_CORE_JWKS_URL is required}
      AUTH_CORE_ISSUER: ${AUTH_CORE_ISSUER:?AUTH_CORE_ISSUER is required}
      INFERENCE_CORE_AUTH_AUDIENCE: ${INFERENCE_CORE_AUTH_AUDIENCE:?INFERENCE_CORE_AUTH_AUDIENCE is required}
      NATS_URL: nats://model-nats:4222
      NATS_AUTH_TOKEN: ${MODEL_NATS_TOKEN:?MODEL_NATS_TOKEN is required}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: inference-core
      INFERENCE_PROVIDER_ORDER: ${INFERENCE_PROVIDER_ORDER:-azure,anthropic,openai}
      INFERENCE_MAX_RETRIES: ${INFERENCE_MAX_RETRIES:-3}
      INFERENCE_CACHE_TTL_SECS: ${INFERENCE_CACHE_TTL_SECS:-300}
      # Velion intent layer — turns the velion-budget/-balance/-genius modes into
      # a concrete model from request complexity + the org's cost-core budget,
      # with model-router as the cheap fallback (see provider/intent.rs). The
      # budget gate is best-effort: COST_CORE_URL points at cost-core's HTTP API;
      # org/user scope arrives via gRPC metadata (x-org-id/x-user-id) and degrades
      # to an Unknown posture when absent.
      VELION_INTENT_ENABLED: ${VELION_INTENT_ENABLED:-1}
      COST_CORE_URL: ${COST_CORE_URL:-http://model-plane-cost-core-1:8089}
      VELION_INTENT_BUDGET_USD: ${VELION_INTENT_BUDGET_USD:-50}
      # Runtime RoutingPolicy store: inference-core polls session-core's
      # RoutingPolicy gRPC for the live intent-routing policy (the Velion
      # "model router" tuning), refreshing every ROUTER_POLICY_REFRESH_SECS.
      # Unset → the chain runs on the built-in RoutingPolicy::default.
      # Both services join inter-plane-bus, where the generic `session-core`
      # hostname belongs to Control Plane. Pin the plane-unique Model alias.
      SESSION_CORE_URL: http://model-plane-session-core-1:9091
      ROUTER_POLICY_REFRESH_SECS: ${ROUTER_POLICY_REFRESH_SECS:-60}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Azure AI Foundry Claude (claude-ai project). When set, the `anthropic`
      # provider slot routes claude-* models to <endpoint>/anthropic/v1/messages
      # (native Anthropic body + x-api-key auth) instead of api.anthropic.com.
      AZURE_ANTHROPIC_ENDPOINT: ${AZURE_ANTHROPIC_ENDPOINT:-}
      AZURE_ANTHROPIC_API_KEY: ${AZURE_ANTHROPIC_API_KEY:-}
      AZURE_ANTHROPIC_DEPLOYMENTS: ${AZURE_ANTHROPIC_DEPLOYMENTS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      OPENAI_CHAT_MODELS: ${OPENAI_CHAT_MODELS:-}
      OPENAI_EMBEDDING_MODELS: ${OPENAI_EMBEDDING_MODELS:-}
      OPENAI_IMAGE_MODELS: ${OPENAI_IMAGE_MODELS:-}
      OPENAI_VISION_MODELS: ${OPENAI_VISION_MODELS:-}
      # Realtime session broker. OPENAI_REALTIME_MODEL is present in
      # ../.env for local dev; keep explicit forwarding so inference-core
      # sees it even though compose only exposes listed environment keys.
      OPENAI_REALTIME_API_BASE: ${OPENAI_REALTIME_API_BASE:-}
      OPENAI_REALTIME_WEBSOCKET_URL: ${OPENAI_REALTIME_WEBSOCKET_URL:-}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime}
      OPENAI_REALTIME_MODELS: ${OPENAI_REALTIME_MODELS:-}
      # Azure realtime broker (preferred — uses the valid Azure key via api-key
      # auth instead of the bad OpenAI key). Activates only when a realtime
      # deployment is set. URLs derive from AZURE_OPENAI_ENDPOINT unless
      # overridden to match the resource's exact preview API surface.
      AZURE_OPENAI_REALTIME_DEPLOYMENT: ${AZURE_OPENAI_REALTIME_DEPLOYMENT:-}
      AZURE_OPENAI_REALTIME_API_VERSION: ${AZURE_OPENAI_REALTIME_API_VERSION:-}
      AZURE_OPENAI_REALTIME_SESSIONS_URL: ${AZURE_OPENAI_REALTIME_SESSIONS_URL:-}
      AZURE_OPENAI_REALTIME_WEBSOCKET_URL: ${AZURE_OPENAI_REALTIME_WEBSOCKET_URL:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2025-01-01-preview}
      AZURE_OPENAI_REGION: ${AZURE_OPENAI_REGION:-}
      # Fail closed for ZDR requests unless an operator has evidence that this
      # exact deployment is covered by a provider-side ZDR contract. Region is
      # not sufficient evidence. Keep false until that contract is verified.
      AZURE_OPENAI_ZDR_CONFIRMED: ${AZURE_OPENAI_ZDR_CONFIRMED:-false}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_CHAT_DEPLOYMENTS: ${AZURE_OPENAI_CHAT_DEPLOYMENTS:-}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENTS: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENTS:-}
      AZURE_OPENAI_IMAGE_DEPLOYMENT: ${AZURE_OPENAI_IMAGE_DEPLOYMENT:-}
      AZURE_OPENAI_IMAGE_DEPLOYMENTS: ${AZURE_OPENAI_IMAGE_DEPLOYMENTS:-}
      AZURE_OPENAI_VISION_DEPLOYMENT: ${AZURE_OPENAI_VISION_DEPLOYMENT:-}
      AZURE_OPENAI_VISION_DEPLOYMENTS: ${AZURE_OPENAI_VISION_DEPLOYMENTS:-}
      AZURE_OPENAI_TRANSLATION_DEPLOYMENT: ${AZURE_OPENAI_TRANSLATION_DEPLOYMENT:-}
      AZURE_OPENAI_LANGUAGE_DEPLOYMENT: ${AZURE_OPENAI_LANGUAGE_DEPLOYMENT:-}
      # Azure OpenAI Sora/video jobs. Endpoint/key fall back to the generic
      # Azure OpenAI values in inference-core, but pass operation-specific
      # overrides and deployment names when present in ../.env.
      AZURE_OPENAI_VIDEO_ENDPOINT: ${AZURE_OPENAI_VIDEO_ENDPOINT:-}
      AZURE_OPENAI_VIDEO_API_KEY: ${AZURE_OPENAI_VIDEO_API_KEY:-}
      AZURE_OPENAI_VIDEO_API_VERSION: ${AZURE_OPENAI_VIDEO_API_VERSION:-preview}
      AZURE_OPENAI_VIDEO_MODEL: ${AZURE_OPENAI_VIDEO_MODEL:-}
      AZURE_OPENAI_VIDEO_DEPLOYMENT: ${AZURE_OPENAI_VIDEO_DEPLOYMENT:-}
      AZURE_OPENAI_VIDEO_MODELS: ${AZURE_OPENAI_VIDEO_MODELS:-}
      AZURE_TRANSLATOR_API_KEY: ${AZURE_TRANSLATOR_API_KEY:-${AZURE_TRANSLATOR_KEY:-}}
      AZURE_TRANSLATOR_KEY: ${AZURE_TRANSLATOR_KEY:-}
      AZURE_TRANSLATOR_ENDPOINT: ${AZURE_TRANSLATOR_ENDPOINT:-}
      AZURE_TRANSLATOR_REGION: ${AZURE_TRANSLATOR_REGION:-}
      AZURE_AI_LANGUAGE_ENDPOINT: ${AZURE_AI_LANGUAGE_ENDPOINT:-}
      AZURE_AI_LANGUAGE_KEY: ${AZURE_AI_LANGUAGE_KEY:-}
      AZURE_AI_LANGUAGE_API_VERSION: ${AZURE_AI_LANGUAGE_API_VERSION:-}
      AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT: ${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT:-}
      AZURE_DOCUMENT_INTELLIGENCE_KEY: ${AZURE_DOCUMENT_INTELLIGENCE_KEY:-}
      AZURE_DOCUMENT_INTELLIGENCE_API_VERSION: ${AZURE_DOCUMENT_INTELLIGENCE_API_VERSION:-}
      AZURE_SPEECH_ENDPOINT: ${AZURE_SPEECH_ENDPOINT:-}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
      AZURE_SPEECH_DEFAULT_VOICE: ${AZURE_SPEECH_DEFAULT_VOICE:-}
      DEFAULT_PROVIDER: anthropic
    # Join the shared bus so cross-plane callers can reach inference-core by
    # name. Data Plane v2's retrieval-engine embeds queries via
    # MODEL_PLANE_AI_CORE_GRPC_URL=http://inference-core:9092 — without this it
    # only sat on model-plane-network → dpv2 got DNS_FAIL → "model-plane
    # embedding failed" → RAG silently degraded to ungrounded.
    networks:
      default: {}
      inter-plane-bus:
        aliases:
          - model-plane-inference-core-1
          - inference-core
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/healthz"]
      interval: 10s
      retries: 3

  execution-core:
    <<: *runtime-defaults
    # Sandbox (Tier-2): the image ships `bubblewrap` so code execution is
    # isolated (namespaces + filesystem). bwrap needs unprivileged user
    # namespaces (clone/unshare CLONE_NEWUSER) which Docker's default seccomp
    # blocks. seccomp-bwrap.json is a SCOPED profile (allow-by-default + an
    # explicit deny-list of escape/escalation syscalls) — strictly safer than
    # `seccomp:unconfined` while permitting the clone/unshare/mount bwrap needs.
    # If the HOST disables unprivileged userns entirely, also set the host
    # sysctl `kernel.unprivileged_userns_clone=1` (host-level, not compose).
    security_opt:
      - seccomp=./seccomp-bwrap.json
    build:
      context: ..
      dockerfile: rust/services/execution-core/Dockerfile
      args: *build-metadata
    ports:
      - "127.0.0.1:18083:8083"  # HTTP health — host 18083 avoids collision with the RentNå Expo dev server (host 8083)
    environment:
      RUST_LOG: info
      # Autonomous tool-using runs route through Azure's model-router deployment,
      # which selects the best model per turn (tool-calling model selection is
      # handled by the router, cost-aware). Overridable per deployment; empty →
      # honor the caller's requested model. Plain chat is unaffected.
      EXECUTION_AGENT_MODEL: ${EXECUTION_AGENT_MODEL:-model-router}
      DATABASE_URL: postgresql://postgres:${MODEL_POSTGRES_PASSWORD:?MODEL_POSTGRES_PASSWORD is required}@postgres:5432/session_core
      NATS_URL: nats://model-nats:4222
      NATS_AUTH_TOKEN: ${MODEL_NATS_TOKEN:?MODEL_NATS_TOKEN is required}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MODEL_MINIO_ROOT_USER:?MODEL_MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MODEL_MINIO_ROOT_PASSWORD:?MODEL_MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${OBJECT_STORAGE_BUCKET:-model-plane-artifacts}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: execution-core
      SESSION_CORE_ADDR: http://model-plane-session-core-1:9091
      # Cross-plane dependencies resolve on the private inter-plane bus; no
      # host-published development ports are part of the service contract.
      # Social workspace tools (list_social_accounts / publish_social_post).
      SOCIAL_CORE_URL: ${SOCIAL_CORE_URL:-http://social-core:3162}
      INFERENCE_CORE_ADDR: http://inference-core:9092
      # model-gateway gRPC — governed loop fetches/proxies an org's registered
      # MCP tools (ListMcpTools + ProxyMcpTool). Same model-plane-network, so the
      # service name resolves; best-effort (no MCP tools offered if unreachable).
      MODEL_GATEWAY_ADDR: ${MODEL_GATEWAY_ADDR_EXEC:-http://model-gateway:9090}
      # Documented primary for the agent run driver (RunAgent) Infer round.
      INFERENCE_CORE_URL: http://inference-core:9092
      CAPABILITY_CORE_ADDR: http://capability-core:9097
      # Quarry-v2 edge (Ingestion Plane) — backs the real web_search / web_fetch
      # agentic tools and the browser-agent loop.
      QUARRY_EDGE_URL: ${QUARRY_EDGE_URL:-http://quarry-edge:8082}
      AUTH_CORE_URL: ${AUTH_CORE_URL:-http://auth-core:3011}
      # Independently verify a dedicated Execution Core user bearer before any
      # execution mutation. Data Plane credentials arrive separately through
      # x-data-plane-authorization and are never accepted as local authority.
      AUTH_CORE_JWKS_URL: ${AUTH_CORE_JWKS_URL:-http://auth-core:3011/api/convex-auth/jwks}
      AUTH_CORE_ISSUER: ${AUTH_CORE_ISSUER:-http://localhost:3011/api/convex-auth}
      EXECUTION_CORE_AUTH_AUDIENCE: ${EXECUTION_CORE_AUTH_AUDIENCE:-execution-core}
      EXECUTION_CORE_SERVICE_ID: ${EXECUTION_CORE_SERVICE_ID:-execution-core}
      EXECUTION_CORE_SERVICE_API_KEY: ${EXECUTION_CORE_SERVICE_API_KEY:?EXECUTION_CORE_SERVICE_API_KEY is required}
      # Feature-gates QuarryAgentClient::from_env() (browser_agent loop) — the
      # env var this block's QUARRY_EDGE_URL comment already promises but that
      # was never actually wired here (Phase 2, found live: run_browser_agent_loop
      # failed fast with "browser agent unavailable" until this was added).
      QUARRY_BROWSER_AGENT_ENABLED: ${QUARRY_BROWSER_AGENT_ENABLED:-1}
      # Data Plane v2 retrieval — backs the real knowledge_search agentic tool
      # (RAG over the org's ingested docs). DATAPLANE_INTERNAL_KEY is sent as
      # the x-api-key credential.
      DATAPLANE_RETRIEVAL_URL: ${DATAPLANE_RETRIEVAL_URL_EXEC:-http://retrieval-engine:50052}
      DATAPLANE_INTERNAL_KEY: ${DATAPLANE_INTERNAL_KEY:-${DATA_PLANE_INTERNAL_KEY:-}}
      # Information-core (Application Plane) — backs the real news / traffic /
      # yr_weather / track_shipment agentic tools.
      INFORMATION_CORE_URL: ${INFORMATION_CORE_URL_EXEC:-http://information-core:3190}
      # information-core gates /api/v1/* on x-internal-api-key (no-key → 401), so
      # the info tools must present the shared internal key.
      INFORMATION_CORE_INTERNAL_KEY: ${INFORMATION_CORE_INTERNAL_KEY:-${INTERNAL_API_KEY:-}}
      # shipping-core (Ingestion Plane) — backs get_shipping_quotes /
      # shipping_carriers.
      SHIPPING_CORE_URL: ${SHIPPING_CORE_URL_EXEC:-http://shipping-core:8080}
      # integration-corev2 (Ingestion Plane) — backs list_provider_actions /
      # execute_provider_action (the agent's typed bridge to every
      # OAuth-connected provider operation). The gateway gates /api/v1/* on
      # its service authentication contract.
      INTEGRATION_COREV2_URL: ${INTEGRATION_COREV2_URL_EXEC:-http://integration-api:3026}
      INTEGRATION_COREV2_INTERNAL_KEY: ${INTEGRATION_COREV2_INTERNAL_KEY:-${INTERNAL_API_KEY:-}}
      # Shipping and Integration accept short-lived Auth Core ingestion tokens.
      # execution-core mints them with this registered service principal instead
      # of forwarding a shared internal key or caller-selected tenant headers.
      INGESTION_SERVICE_ID: ${INGESTION_SERVICE_ID:-model-execution}
      INGESTION_SERVICE_API_KEY: ${MODEL_EXECUTION_SERVICE_API_KEY:?MODEL_EXECUTION_SERVICE_API_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
      session-core:
        condition: service_healthy
      inference-core:
        condition: service_healthy
    networks:
      default: {}
      inter-plane-bus: {}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/readyz"]
      interval: 10s
      retries: 3

  # --- Go services ---

  orchestrator-core:
    <<: *runtime-defaults
    build:
      context: ../go
      dockerfile: services/orchestrator-core/Dockerfile
      args: *build-metadata
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      NATS_URL: nats://nats:4222
      NATS_AUTH_TOKEN: ${MODEL_NATS_TOKEN:?MODEL_NATS_TOKEN is required}
      SESSION_CORE_ADDR: session-core:9091
      LETTA_BRIDGE_AUTH_AUDIENCE: ${LETTA_BRIDGE_AUTH_AUDIENCE:-letta-bridge}
      AUTH_CORE_ISSUER: ${AUTH_CORE_ISSUER:?AUTH_CORE_ISSUER is required}
      AUTH_CORE_JWKS_URL: ${AUTH_CORE_JWKS_URL:?AUTH_CORE_JWKS_URL is required}
      INFERENCE_CORE_ADDR: inference-core:9092
      EXECUTION_CORE_ADDR: execution-core:9093
      CAPABILITY_CORE_ADDR: capability-core:9097
      ENABLE_COMPAT_ADAPTER: "false"
    depends_on:
      temporal:
        condition: service_healthy
      nats:
        condition: service_healthy
    # alpine final image has no curl (only ca-certificates); use busybox wget.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8084/healthz"]
      interval: 10s
      retries: 3

  capability-core:
    <<: *runtime-defaults
    build:
      context: ../go
      dockerfile: services/capability-core/Dockerfile
      args: *build-metadata
    ports:
      - "127.0.0.1:8085:8085"   # HTTP health
      - "127.0.0.1:9097:9097"   # gRPC
    environment:
      DATABASE_URL: postgresql://postgres:${MODEL_POSTGRES_PASSWORD:?MODEL_POSTGRES_PASSWORD is required}@postgres:5432/session_core
      REDIS_URL: redis://:${MODEL_DRAGONFLY_PASSWORD:?MODEL_DRAGONFLY_PASSWORD is required}@dragonfly:6379
      NATS_URL: nats://nats:4222
      NATS_AUTH_TOKEN: ${MODEL_NATS_TOKEN:?MODEL_NATS_TOKEN is required}
      AUTH_CORE_JWKS_URL: ${AUTH_CORE_JWKS_URL:-http://auth-core:3011/api/convex-auth/jwks}
      AUTH_CORE_ISSUER: ${AUTH_CORE_ISSUER:-http://localhost:3011/api/convex-auth}
      CAPABILITY_CORE_AUTH_AUDIENCE: ${CAPABILITY_CORE_AUTH_AUDIENCE:-capability-core}
      APIS_GURU_OPENAPI_DIRECTORY_PATH: ${APIS_GURU_OPENAPI_DIRECTORY_PATH:-/var/lib/capability-core/openapi-directory}
    volumes:
      - mp-capability-core-data:/var/lib/capability-core
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/healthz"]
      interval: 10s
      retries: 3

  sandbox-manager:
    <<: *runtime-defaults
    build:
      context: ../go
      dockerfile: services/sandbox-manager/Dockerfile
      args: *build-metadata
    ports:
      - "127.0.0.1:8086:8086"   # HTTP health
      - "127.0.0.1:9094:9094"   # gRPC
    environment:
      AUTH_CORE_JWKS_URL: ${AUTH_CORE_JWKS_URL:?AUTH_CORE_JWKS_URL is required}
      AUTH_CORE_ISSUER: ${AUTH_CORE_ISSUER:?AUTH_CORE_ISSUER is required}
      SANDBOX_MANAGER_AUTH_AUDIENCE: ${SANDBOX_MANAGER_AUTH_AUDIENCE:-sandbox-manager}
      REDIS_URL: redis://:${MODEL_DRAGONFLY_PASSWORD:?MODEL_DRAGONFLY_PASSWORD is required}@dragonfly:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MODEL_MINIO_ROOT_USER:?MODEL_MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MODEL_MINIO_ROOT_PASSWORD:?MODEL_MINIO_ROOT_PASSWORD is required}
    depends_on:
      dragonfly:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/healthz"]
      interval: 10s
      retries: 3

  browser-broker:
    <<: *runtime-defaults
    build:
      context: ../go
      dockerfile: services/browser-broker/Dockerfile
      args: *build-metadata
    ports:
      - "127.0.0.1:8087:8087"   # HTTP health
      - "127.0.0.1:9095:9095"   # gRPC
    environment:
      AUTH_CORE_JWKS_URL: ${AUTH_CORE_JWKS_URL:?AUTH_CORE_JWKS_URL is required}
      AUTH_CORE_ISSUER: ${AUTH_CORE_ISSUER:?AUTH_CORE_ISSUER is required}
      BROWSER_BROKER_AUTH_AUDIENCE: ${BROWSER_BROKER_AUTH_AUDIENCE:-browser-broker}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/healthz"]
      interval: 10s
      retries: 3

  letta-bridge:
    <<: *runtime-defaults
    build:
      context: ../go
      dockerfile: services/letta-bridge/Dockerfile
      args: *build-metadata
    ports:
      - "127.0.0.1:8088:8088"   # HTTP health
      - "127.0.0.1:9096:9096"   # gRPC
    environment:
      AUTH_CORE_JWKS_URL: ${AUTH_CORE_JWKS_URL:?AUTH_CORE_JWKS_URL is required}
      AUTH_CORE_ISSUER: ${AUTH_CORE_ISSUER:?AUTH_CORE_ISSUER is required}
      LETTA_BRIDGE_AUTH_AUDIENCE: ${LETTA_BRIDGE_AUTH_AUDIENCE:-letta-bridge}
      LETTA_URL: ${LETTA_URL:-${LETTA_SERVER_URL:-http://localhost:8283}}
      LETTA_SERVER_URL: ${LETTA_SERVER_URL:-${LETTA_URL:-http://localhost:8283}}
      SESSION_CORE_ADDR: session-core:9091
      # Long-term agent memory → local agent-memory-server (Redis Stack vector
      # backend). Unset AGENT_MEMORY_URL to fall back to the in-memory store.
      AGENT_MEMORY_URL: ${AGENT_MEMORY_URL:-http://agent-memory-server:8000}
      AGENT_MEMORY_TOKEN: ${AGENT_MEMORY_TOKEN:-}
      # Durable Postgres memory fallback (auto-creates schema on boot).
      # Gateway/orchestrator route through session-core:9091; session-core then
      # calls this bridge with an aud=letta-bridge, org-scoped credential.
      DATABASE_URL: postgresql://postgres:${MODEL_POSTGRES_PASSWORD:?MODEL_POSTGRES_PASSWORD is required}@postgres:5432/session_core
    depends_on:
      agent-memory-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/readyz"]
      interval: 10s
      retries: 3

  # Long-term agent-memory backend: agent-memory-server (REST, LiteLLM) on a
  # dedicated local Redis Stack (RediSearch vector index). letta-bridge points
  # AGENT_MEMORY_URL here. Fully local — no Redis Cloud. Embeddings + generation
  # via OpenAI by default (set OPENAI_API_KEY); LiteLLM also supports Azure et al.
  agent-memory-redis:
    <<: *runtime-defaults
    image: redis/redis-stack-server:7.4.0-v3
    command: ["redis-stack-server", "--requirepass", "${AGENT_MEMORY_REDIS_PASSWORD:?AGENT_MEMORY_REDIS_PASSWORD is required}", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - mp-agent-memory-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${AGENT_MEMORY_REDIS_PASSWORD:?AGENT_MEMORY_REDIS_PASSWORD is required}", "ping"]
      interval: 5s
      retries: 5

  agent-memory-server:
    <<: *runtime-defaults
    image: redislabs/agent-memory-server:0.15.1
    command: ["agent-memory", "api", "--host", "0.0.0.0", "--port", "8000", "--task-backend=asyncio"]
    environment:
      REDIS_URL: redis://:${AGENT_MEMORY_REDIS_PASSWORD:?AGENT_MEMORY_REDIS_PASSWORD is required}@agent-memory-redis:6379
      PORT: "8000"
      AUTH_MODE: ${AGENT_MEMORY_AUTH_MODE:-disabled}
      DISABLE_AUTH: ${AGENT_MEMORY_DISABLE_AUTH:-true}
      # LiteLLM model + provider config, wired to the Model Plane's existing
      # provider creds (sourced from apps/Model Plane/deploy/.env). Pick one:
      #   • OpenAI: set OPENAI_API_KEY — models default to gpt-4o-mini /
      #     text-embedding-3-small below.
      #   • Azure OpenAI (what the rest of Model Plane uses): set
      #     AGENT_MEMORY_GENERATION_MODEL=azure/<chat-deployment> and
      #     AGENT_MEMORY_EMBEDDING_MODEL=azure/<embedding-deployment>; the
      #     AZURE_* creds below are mapped from the Model Plane AZURE_OPENAI_* vars.
      GENERATION_MODEL: ${AGENT_MEMORY_GENERATION_MODEL:-gpt-4o-mini}
      FAST_MODEL: ${AGENT_MEMORY_FAST_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${AGENT_MEMORY_EMBEDDING_MODEL:-text-embedding-3-small}
      # OpenAI path
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      # Azure path — LiteLLM reads AZURE_API_*; map from the Model Plane's
      # AZURE_OPENAI_* (same vars inference-core/model-gateway already consume).
      AZURE_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_API_BASE: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-08-01-preview}
      ENABLE_TOPIC_EXTRACTION: ${AGENT_MEMORY_TOPIC_EXTRACTION:-true}
      LOG_LEVEL: ${AGENT_MEMORY_LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8100:8000"   # REST (host-exposed for debugging)
    depends_on:
      agent-memory-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost',8000),3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5

  cost-core:
    <<: *runtime-defaults
    build:
      context: ../go
      dockerfile: services/cost-core/Dockerfile
      args: *build-metadata
    ports:
      - "127.0.0.1:8089:8089"   # HTTP health + API
      - "127.0.0.1:9098:9098"   # gRPC
    environment:
      LOG_LEVEL: info
      # cost-core joins the inter-plane bus (so the Velion gateway can reach its
      # HTTP API). `model-nats` is a plane-unique network alias; Postgres remains
      # private to the default Model network. This avoids generated container
      # names and prevents accidental resolution to another plane's NATS.
      NATS_URL: nats://model-nats:4222
      NATS_AUTH_TOKEN: ${MODEL_NATS_TOKEN:?MODEL_NATS_TOKEN is required}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: cost-core
      AUTH_CORE_JWKS_URL: ${AUTH_CORE_JWKS_URL:-http://auth-core:3011/api/convex-auth/jwks}
      AUTH_CORE_ISSUER: ${AUTH_CORE_ISSUER:-http://localhost:3011/api/convex-auth}
      COST_CORE_AUTH_AUDIENCE: ${COST_CORE_AUTH_AUDIENCE:-cost-core}
      # Durable cost ledger (the migration entrypoint applies 0001_cost_ledger +
      # 0002_model_pricing on boot). Shares the Model Plane Postgres / session_core DB.
      DATABASE_URL: postgresql://postgres:${MODEL_POSTGRES_PASSWORD:?MODEL_POSTGRES_PASSWORD is required}@postgres:5432/session_core
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      # Stay on the Model Plane network (postgres/nats) AND join the shared
      # inter-plane-bus so the Velion gateway's cost/usage dashboard (Phase 7
      # B5) can reach the ledger HTTP API by its alias.
      default: {}
      inter-plane-bus:
        aliases:
          - model-plane-cost-core-1
          - cost-core
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/healthz"]
      interval: 10s
      retries: 3

  bridge-core:
    <<: *runtime-defaults
    build:
      context: ../go
      dockerfile: services/bridge-core/Dockerfile
      args: *build-metadata
    ports:
      - "127.0.0.1:8091:8091"   # HTTP session API + public health
      - "127.0.0.1:9100:9100"   # standard gRPC health only
    environment:
      LOG_LEVEL: info
      NATS_URL: nats://nats:4222
      NATS_AUTH_TOKEN: ${MODEL_NATS_TOKEN:?MODEL_NATS_TOKEN is required}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: bridge-core
      SESSION_CORE_ADDR: session-core:9091
      MODEL_GATEWAY_ADDR: model-gateway:9090
      AUTH_CORE_JWKS_URL: ${AUTH_CORE_JWKS_URL:?AUTH_CORE_JWKS_URL is required}
      AUTH_CORE_ISSUER: ${AUTH_CORE_ISSUER:?AUTH_CORE_ISSUER is required}
      BRIDGE_CORE_AUTH_AUDIENCE: ${BRIDGE_CORE_AUTH_AUDIENCE:-bridge-core}
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/healthz"]
      interval: 10s
      retries: 3

volumes:
  mp-postgres-data:
  mp-nats-data:
  mp-minio-data:
  mp-temporal-postgres-data:
  mp-dragonfly-data:
  mp-agent-memory-redis-data:
  mp-capability-core-data:

networks:
  default:
    name: model-plane-network
  inter-plane-bus:
    external: true
