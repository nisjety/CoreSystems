openapi: 3.1.0
info:
  title: Model Plane API
  version: 0.1.0
  description: |
    Public HTTP API for the Model Plane runtime, served by model-gateway on :8080.
    All /v1/* endpoints require a Bearer JWT issued by auth-core.

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.modelplane.example.com
    description: Production

security:
  - bearerAuth: []

tags:
  - name: health
    description: Liveness and readiness probes (no auth)
  - name: invoke
    description: Core request/response and streaming inference
  - name: orchestration
    description: Plans, todos, approvals, lineage, and run control
  - name: ai
    description: AI modality endpoints (chat, images, speech, translate, documents, realtime)
  - name: capabilities
    description: Capability registry
  - name: tasks
    description: Task management (proxied to capability-core)
  - name: cron
    description: Scheduled jobs (proxied to capability-core)
  - name: memory
    description: Memory store (proxied to capability-core)
  - name: skills
    description: Skill registry (proxied to capability-core)
  - name: events
    description: Server-Sent Event streams

paths:
  # ===========================================================================
  # Health
  # ===========================================================================
  /healthz:
    get:
      operationId: healthz
      tags: [health]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Healthy
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /readyz:
    get:
      operationId: readyz
      tags: [health]
      summary: Readiness probe
      security: []
      responses:
        "200":
          description: Ready
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /metrics:
    get:
      operationId: metrics
      tags: [health]
      summary: Prometheus metrics
      security: []
      responses:
        "200":
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string

  # ===========================================================================
  # Invoke
  # ===========================================================================
  /v1/invoke:
    post:
      operationId: invoke
      tags: [invoke]
      summary: Synchronous inference request
      description: |
        Sends content to the configured model via inference-core and returns the
        full response. Budget is checked pre-flight against cost-core. A session
        run is created in session-core for context tracking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvokeRequest"
      responses:
        "200":
          description: Inference completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvokeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: Budget exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Upstream service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/invoke/stream:
    post:
      operationId: invokeStream
      tags: [invoke]
      summary: Streaming inference via SSE
      description: |
        Same as /v1/invoke but returns Server-Sent Events. Each event carries a
        delta chunk. The final event has `done: true`. Event type `done` signals
        end of stream.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvokeRequest"
      responses:
        "200":
          description: SSE stream of inference chunks
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SseChunk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ===========================================================================
  # Orchestration — reads
  # ===========================================================================
  /v1/orchestration/runs/{run_id}/plans:
    get:
      operationId: listPlans
      tags: [orchestration]
      summary: List plans for a run
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Plans list
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items:
                      $ref: "#/components/schemas/Plan"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/orchestration/plans/{plan_id}:
    get:
      operationId: getPlan
      tags: [orchestration]
      summary: Get a plan by ID
      parameters:
        - $ref: "#/components/parameters/PlanId"
      responses:
        "200":
          description: Plan details
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    $ref: "#/components/schemas/Plan"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/orchestration/threads/{thread_id}/todos:
    get:
      operationId: listTodos
      tags: [orchestration]
      summary: List todos for a thread
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - name: run_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Todos list
          content:
            application/json:
              schema:
                type: object
                properties:
                  todos:
                    type: array
                    items:
                      $ref: "#/components/schemas/Todo"

  /v1/orchestration/todos/{todo_id}:
    get:
      operationId: getTodo
      tags: [orchestration]
      summary: Get a todo by ID
      parameters:
        - name: todo_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Todo details
          content:
            application/json:
              schema:
                type: object
                properties:
                  todo:
                    $ref: "#/components/schemas/Todo"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/orchestration/runs/{run_id}/approvals:
    get:
      operationId: listApprovals
      tags: [orchestration]
      summary: List approvals for a run
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: step_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Approvals list
          content:
            application/json:
              schema:
                type: object
                properties:
                  approvals:
                    type: array
                    items:
                      $ref: "#/components/schemas/Approval"

  /v1/orchestration/approvals/{approval_id}:
    get:
      operationId: getApproval
      tags: [orchestration]
      summary: Get an approval by ID
      parameters:
        - name: approval_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approval details
          content:
            application/json:
              schema:
                type: object
                properties:
                  approval:
                    $ref: "#/components/schemas/Approval"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/orchestration/threads/{thread_id}/lineage:
    get:
      operationId: getSubagentLineage
      tags: [orchestration]
      summary: Get subagent lineage for a thread
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      responses:
        "200":
          description: Lineage graph
          content:
            application/json:
              schema:
                type: object
                properties:
                  lineage:
                    $ref: "#/components/schemas/SubagentLineage"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===========================================================================
  # Orchestration — mutations
  # ===========================================================================
  /v1/orchestration/plans/{plan_id}/approve:
    post:
      operationId: approvePlan
      tags: [orchestration]
      summary: Approve a plan
      parameters:
        - $ref: "#/components/parameters/PlanId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionPlanBody"
      responses:
        "200":
          description: Plan approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/orchestration/plans/{plan_id}/reject:
    post:
      operationId: rejectPlan
      tags: [orchestration]
      summary: Reject a plan
      parameters:
        - $ref: "#/components/parameters/PlanId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionPlanBody"
      responses:
        "200":
          description: Plan rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/orchestration/todos/{todo_id}/status:
    post:
      operationId: updateTodoStatus
      tags: [orchestration]
      summary: Transition a todo to a new status
      parameters:
        - name: todo_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionTodoBody"
      responses:
        "200":
          description: Todo updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  todo:
                    $ref: "#/components/schemas/Todo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/orchestration/approvals/{approval_id}/decide:
    post:
      operationId: decideApproval
      tags: [orchestration]
      summary: Approve or reject an approval request
      parameters:
        - name: approval_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideApprovalBody"
      responses:
        "200":
          description: Approval decided
          content:
            application/json:
              schema:
                type: object
                properties:
                  approval:
                    $ref: "#/components/schemas/Approval"
                  continuation_delivery:
                    type: string
                    description: One-word form of approval.continuation, present after a grant.
                    enum: [queued, running, completed, failed, not_resumable, live, awaiting_continue, unknown]
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The scope is not available (error code scope_not_enabled)

  /v1/orchestration/runs/{run_id}/cancel:
    post:
      operationId: cancelRun
      tags: [orchestration]
      summary: Request cancellation of a run
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Cancellation requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                  status:
                    type: string
                    example: cancel_requested

  /v1/orchestration/runs/{run_id}/resume:
    post:
      operationId: resumeRun
      tags: [orchestration]
      summary: Request resumption of a cancelled/paused run
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Resumption requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                  status:
                    type: string
                    example: resume_requested

  # ===========================================================================
  # Run event SSE
  # ===========================================================================
  /v1/runs/{run_id}/events:
    get:
      operationId: streamRunEvents
      tags: [events]
      summary: Stream orchestration events for a run via SSE
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: SSE stream of orchestration events
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/OrchestrationEvent"

  /v1/spaces/{space_id}/events:
    get:
      operationId: streamSpaceEvents
      tags: [events]
      summary: Stream a shared Space's change events via SSE (ids and kinds only)
      description: >
        Resumable per-Space tail of thread, post and run-state changes. Frames carry ids and
        closed words only, never content; the client refetches through the authorized read path.
        Authority is a Control decision for the audience model-plane-space-stream, sent in the
        x-space-decision-ref and x-space-decision-token headers, plus a user principal. A ZDR
        caller or decision gets connected with mode poll_only, then closing zdr_poll_only.
        The vocabulary is pinned by api/contracts/space-events.json; see docs/space-event-stream.md.
      parameters:
        - name: space_id
          in: path
          required: true
          schema:
            type: string
        - name: x-space-decision-ref
          in: header
          required: true
          schema:
            type: string
        - name: x-space-decision-token
          in: header
          required: true
          schema:
            type: string
        - name: Last-Event-ID
          in: header
          required: false
          description: "Cursor `<generation>.<seq>` of the last processed frame."
          schema:
            type: string
      responses:
        "200":
          description: SSE stream (connected, space_event, heartbeat, cursor_too_old, closing, error)
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: unauthorized
        "403":
          description: space_stream_forbidden (bad, expired or wrong-audience decision, or not a user principal)
        "503":
          description: space_stream_capacity (with Retry-After) or space_stream_unavailable

  # ===========================================================================
  # AI modalities
  # ===========================================================================
  /v1/ai/chat:
    post:
      operationId: aiChat
      tags: [ai]
      summary: Chat completion via inference-core
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatRequest"
      responses:
        "200":
          description: Chat response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/ai/embeddings:
    post:
      operationId: aiEmbeddings
      tags: [ai]
      summary: Embedding generation via inference-core
      description: Generates vectors only. Data Plane remains responsible for vector storage, indexing, and retrieval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiEmbeddingRequest"
      responses:
        "200":
          description: Embedding response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiEmbeddingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/ai/models:
    get:
      operationId: aiModels
      tags: [ai]
      summary: Active inference model catalogue
      parameters:
        - name: modality
          in: query
          required: false
          schema:
            type: string
            example: embedding
        - name: provider
          in: query
          required: false
          schema:
            type: string
            example: azure-openai
      responses:
        "200":
          description: Active model catalogue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiModelsResponse"

  /v1/ai/images:
    post:
      operationId: aiImages
      tags: [ai]
      summary: Image generation (queued)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt:
                  type: string
                model:
                  type: string
                size:
                  type: string
                  example: "1024x1024"
      responses:
        "200":
          description: Generation queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedResponse"

  /v1/ai/speech:
    post:
      operationId: aiSpeech
      tags: [ai]
      summary: Text-to-speech synthesis (queued)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                input:
                  type: string
                voice:
                  type: string
                model:
                  type: string
      responses:
        "200":
          description: Synthesis queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedResponse"

  /v1/ai/translate:
    post:
      operationId: aiTranslate
      tags: [ai]
      summary: Text translation (queued)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                source_language:
                  type: string
                target_language:
                  type: string
      responses:
        "200":
          description: Translation queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedResponse"

  /v1/ai/documents:
    post:
      operationId: aiDocuments
      tags: [ai]
      summary: Document processing (queued)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
      responses:
        "200":
          description: Processing queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedResponse"

  /v1/ai/realtime:
    post:
      operationId: aiRealtime
      tags: [ai]
      summary: Realtime session placeholder
      description: |
        Realtime sessions require WebSocket upgrade. Use /v1/invoke/stream for
        SSE streaming instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
      responses:
        "200":
          description: Not implemented — use SSE streaming
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedResponse"

  # ===========================================================================
  # Capabilities
  # ===========================================================================
  /v1/capabilities:
    get:
      operationId: listCapabilities
      tags: [capabilities]
      summary: List registered capabilities
      parameters:
        - name: kind
          in: query
          schema:
            type: string
        - name: q
          in: query
          description: Full-text search query
          schema:
            type: string
        - name: after_id
          in: query
          description: Cursor for pagination
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: Capabilities list
          content:
            application/json:
              schema:
                type: object
                properties:
                  capabilities:
                    type: array
                    items:
                      $ref: "#/components/schemas/Capability"
                  has_more:
                    type: boolean

  /v1/capabilities/{id}:
    get:
      operationId: getCapability
      tags: [capabilities]
      summary: Get a capability by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Capability details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capability"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===========================================================================
  # Tasks
  # ===========================================================================
  /v1/tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "200":
          description: Task created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /v1/tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a task by ID
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Task details
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /v1/tasks/{id}/cancel:
    post:
      operationId: cancelTask
      tags: [tasks]
      summary: Cancel a task
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Task cancelled
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  # ===========================================================================
  # Cron
  # ===========================================================================
  /v1/cron:
    get:
      operationId: listCron
      tags: [cron]
      summary: List cron jobs
      responses:
        "200":
          description: Cron list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      operationId: createCron
      tags: [cron]
      summary: Create a cron job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Cron created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /v1/cron/{id}:
    get:
      operationId: getCron
      tags: [cron]
      summary: Get a cron job by ID
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Cron details
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchCron
      tags: [cron]
      summary: Update a cron job
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Cron updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    delete:
      operationId: deleteCron
      tags: [cron]
      summary: Delete a cron job
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Cron deleted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  # ===========================================================================
  # Memory
  # ===========================================================================
  /v1/memory:
    get:
      operationId: listMemory
      tags: [memory]
      summary: List memory entries
      parameters:
        - name: scope
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Memory list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      operationId: createMemory
      tags: [memory]
      summary: Create a memory entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Memory created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /v1/memory/{id}:
    get:
      operationId: getMemory
      tags: [memory]
      summary: Get a memory entry by ID
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Memory details
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchMemory
      tags: [memory]
      summary: Update a memory entry
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Memory updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    delete:
      operationId: deleteMemory
      tags: [memory]
      summary: Delete a memory entry
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Memory deleted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

