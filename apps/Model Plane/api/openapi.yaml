openapi: 3.1.0
info:
  title: Model Plane API
  version: 0.1.0
  description: |
    Public HTTP API for the Model Plane runtime, served by model-gateway on :8080.
    All /v1/* endpoints require a Bearer JWT issued by auth-core.

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.modelplane.example.com
    description: Production

security:
  - bearerAuth: []

tags:
  - name: health
    description: Liveness and readiness probes (no auth)
  - name: invoke
    description: Core request/response and streaming inference
  - name: orchestration
    description: Plans, todos, approvals, lineage, and run control
  - name: ai
    description: AI modality endpoints (chat, images, speech, translate, documents, realtime)
  - name: capabilities
    description: Capability registry
  - name: tasks
    description: Task management (proxied to capability-core)
  - name: cron
    description: Scheduled jobs (proxied to capability-core)
  - name: memory
    description: Memory store (proxied to capability-core)
  - name: skills
    description: Skill registry (proxied to capability-core)
  - name: events
    description: Server-Sent Event streams
  - name: browser
    description: Browser grants issued by BrowserBroker
  - name: threads
    description: Thread export

paths:
  # ===========================================================================
  # Health
  # ===========================================================================
  /healthz:
    get:
      operationId: healthz
      tags: [health]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Healthy
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /readyz:
    get:
      operationId: readyz
      tags: [health]
      summary: Readiness probe
      security: []
      responses:
        "200":
          description: Ready
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /metrics:
    get:
      operationId: metrics
      tags: [health]
      summary: Prometheus metrics
      security: []
      responses:
        "200":
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string

  # ===========================================================================
  # Invoke
  # ===========================================================================
  /v1/invoke:
    post:
      operationId: invoke
      tags: [invoke]
      summary: Synchronous inference request
      description: |
        Sends content to the configured model via inference-core and returns the
        full response. Budget is checked pre-flight against cost-core. A session
        run is created in session-core for context tracking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvokeRequest"
      responses:
        "200":
          description: Inference completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvokeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: Budget exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Upstream service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/invoke/stream:
    post:
      operationId: invokeStream
      tags: [invoke]
      summary: Streaming inference via SSE
      description: |
        Same as /v1/invoke but returns Server-Sent Events. Each event carries a
        delta chunk. The final event has `done: true`. Event type `done` signals
        end of stream.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvokeRequest"
      responses:
        "200":
          description: SSE stream of inference chunks
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SseChunk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ===========================================================================
  # Orchestration — reads
  # ===========================================================================
  /v1/orchestration/runs/{run_id}/plans:
    get:
      operationId: listPlans
      tags: [orchestration]
      summary: List plans for a run
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Plans list
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items:
                      $ref: "#/components/schemas/Plan"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/orchestration/plans/{plan_id}:
    get:
      operationId: getPlan
      tags: [orchestration]
      summary: Get a plan by ID
      parameters:
        - $ref: "#/components/parameters/PlanId"
      responses:
        "200":
          description: Plan details
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    $ref: "#/components/schemas/Plan"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/orchestration/threads/{thread_id}/todos:
    get:
      operationId: listTodos
      tags: [orchestration]
      summary: List todos for a thread
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - name: run_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Todos list
          content:
            application/json:
              schema:
                type: object
                properties:
                  todos:
                    type: array
                    items:
                      $ref: "#/components/schemas/Todo"

  /v1/orchestration/todos/{todo_id}:
    get:
      operationId: getTodo
      tags: [orchestration]
      summary: Get a todo by ID
      parameters:
        - name: todo_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Todo details
          content:
            application/json:
              schema:
                type: object
                properties:
                  todo:
                    $ref: "#/components/schemas/Todo"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/orchestration/runs/{run_id}/approvals:
    get:
      operationId: listApprovals
      tags: [orchestration]
      summary: List approvals for a run
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: step_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Approvals list
          content:
            application/json:
              schema:
                type: object
                properties:
                  approvals:
                    type: array
                    items:
                      $ref: "#/components/schemas/Approval"

  /v1/orchestration/approvals/{approval_id}:
    get:
      operationId: getApproval
      tags: [orchestration]
      summary: Get an approval by ID
      parameters:
        - name: approval_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approval details
          content:
            application/json:
              schema:
                type: object
                properties:
                  approval:
                    $ref: "#/components/schemas/Approval"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/orchestration/approvals/{approval_id}/quarantine-preview:
    get:
      operationId: getQuarantinePreview
      tags: [orchestration]
      summary: Inert preview of tool output held for review (WS10-S8)
      description: >
        Plain text, at most 1 KiB, control and bidirectional characters removed. Answered only to
        the run owner while the UNTRUSTED_CONTENT approval is pending or granted and unspent;
        every other case is a 404. Show the text as text, never as markup or links.
      parameters:
        - name: approval_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  preview:
                    type: object
                    properties:
                      text:
                        type: string
                      truncated:
                        type: boolean
                      tool_key:
                        type: string
                      trust_class:
                        type: string
                      format:
                        type: string
                        enum: [plain_text]
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/orchestration/threads/{thread_id}/lineage:
    get:
      operationId: getSubagentLineage
      tags: [orchestration]
      summary: Get subagent lineage for a thread
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      responses:
        "200":
          description: Lineage graph
          content:
            application/json:
              schema:
                type: object
                properties:
                  lineage:
                    $ref: "#/components/schemas/SubagentLineage"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===========================================================================
  # Orchestration — mutations
  # ===========================================================================
  /v1/orchestration/plans/{plan_id}/approve:
    post:
      operationId: approvePlan
      tags: [orchestration]
      summary: Approve a plan
      parameters:
        - $ref: "#/components/parameters/PlanId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionPlanBody"
      responses:
        "200":
          description: Plan approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/orchestration/plans/{plan_id}/reject:
    post:
      operationId: rejectPlan
      tags: [orchestration]
      summary: Reject a plan
      parameters:
        - $ref: "#/components/parameters/PlanId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionPlanBody"
      responses:
        "200":
          description: Plan rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/orchestration/todos/{todo_id}/status:
    post:
      operationId: updateTodoStatus
      tags: [orchestration]
      summary: Transition a todo to a new status
      parameters:
        - name: todo_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionTodoBody"
      responses:
        "200":
          description: Todo updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  todo:
                    $ref: "#/components/schemas/Todo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/orchestration/approvals/{approval_id}/decide:
    post:
      operationId: decideApproval
      tags: [orchestration]
      summary: Approve or reject an approval request
      parameters:
        - name: approval_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideApprovalBody"
      responses:
        "200":
          description: Approval decided
          content:
            application/json:
              schema:
                type: object
                properties:
                  approval:
                    $ref: "#/components/schemas/Approval"
                  continuation_delivery:
                    type: string
                    description: One-word form of approval.continuation, present after a grant.
                    enum: [queued, running, completed, failed, not_resumable, live, awaiting_continue, unknown]
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The scope is not available (error code scope_not_enabled)

  /v1/orchestration/threads/{thread_id}/approval-grants:
    get:
      operationId: listApprovalGrants
      tags: [orchestration]
      summary: List the caller's standing approval grants in a thread
      description: >
        The "this thread" and "this run" grants the verified caller made in one thread, live and
        revoked. Served whether or not standing scopes are enabled, so a grant made while they
        were on stays visible. A ZDR credential holds no grant and gets an empty list. The call
        digest and the action key are never part of a grant.
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      responses:
        "200":
          description: The caller's grants in the thread
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      grants:
                        type: array
                        items:
                          $ref: "#/components/schemas/ApprovalGrant"
        "400":
          description: The thread id is empty or longer than 128 characters (error code invalid_thread_id)
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/orchestration/approval-grants/{grant_id}:
    delete:
      operationId: revokeApprovalGrant
      tags: [orchestration]
      summary: Revoke one of the caller's standing approval grants
      description: >
        Takes effect at once and only narrows what the agent may do. Served whether or not standing
        scopes are enabled. Only the grant's owner may revoke it; a ZDR credential holds no grant
        and is refused by Session Core.
      parameters:
        - name: grant_id
          in: path
          required: true
          description: Grant id, prefixed apg_ and at most 128 characters.
          schema:
            type: string
      responses:
        "200":
          description: The grant as it stands after the revocation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      grant:
                        $ref: "#/components/schemas/ApprovalGrant"
        "400":
          description: The grant id does not start with apg_ or is longer than 128 characters (error code invalid_grant_id)
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/orchestration/runs/{run_id}/cancel:
    post:
      operationId: cancelRun
      tags: [orchestration]
      summary: Request cancellation of a run
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Cancellation requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                  status:
                    type: string
                    example: cancel_requested

  /v1/orchestration/runs/{run_id}/resume:
    post:
      operationId: resumeRun
      tags: [orchestration]
      summary: Request resumption of a cancelled/paused run
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Resumption requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                  status:
                    type: string
                    example: resume_requested

  # ===========================================================================
  # Run event SSE
  # ===========================================================================
  /v1/runs/{run_id}/events:
    get:
      operationId: streamRunEvents
      tags: [events]
      summary: Stream orchestration events for a run via SSE
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: SSE stream of orchestration events
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/OrchestrationEvent"

  /v1/spaces/{space_id}/events:
    get:
      operationId: streamSpaceEvents
      tags: [events]
      summary: Stream a shared Space's change events via SSE (ids and kinds only)
      description: >
        Resumable per-Space tail of thread, post and run-state changes. Frames carry ids and
        closed words only, never content; the client refetches through the authorized read path.
        Authority is a Control decision for the audience model-plane-space-stream, sent in the
        x-space-decision-ref and x-space-decision-token headers, plus a user principal. A ZDR
        caller or decision gets connected with mode poll_only, then closing zdr_poll_only.
        The vocabulary is pinned by api/contracts/space-events.json; see docs/space-event-stream.md.
      parameters:
        - name: space_id
          in: path
          required: true
          schema:
            type: string
        - name: x-space-decision-ref
          in: header
          required: true
          schema:
            type: string
        - name: x-space-decision-token
          in: header
          required: true
          schema:
            type: string
        - name: Last-Event-ID
          in: header
          required: false
          description: "Cursor `<generation>.<seq>` of the last processed frame."
          schema:
            type: string
      responses:
        "200":
          description: SSE stream (connected, space_event, heartbeat, cursor_too_old, closing, error)
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: unauthorized
        "403":
          description: space_stream_forbidden (bad, expired or wrong-audience decision, or not a user principal)
        "503":
          description: space_stream_capacity (with Retry-After) or space_stream_unavailable

  /v1/runs/{run_id}/trace:
    get:
      operationId: getRunTrace
      tags: [events]
      summary: Page through a run's durable trace (WS10.S6)
      description: >-
        Reads Session Core's EventLog for one run, ordered by ingest sequence. Owner only:
        a run of another user or org is a 404, as is an unknown run. A Session Core that
        does not serve the trace yet answers 501 `trace_unavailable`. Needs the
        `x-session-authorization` bearer, as every Session Core read does.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 512
          description: The `meta.next_cursor` of the previous page.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
          description: Page size, clamped to 1..500.
        - name: types
          in: query
          required: false
          schema:
            type: string
          description: >-
            Comma list of EventType names without the `EVENT_TYPE_` prefix, e.g.
            `BROWSER_STEP_RECEIPT_RECORDED,RUN_COMPLETED`. An unknown name is a 400.
      responses:
        "200":
          description: One page of trace events
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      events:
                        type: array
                        items:
                          type: object
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type: string
                        nullable: true
                      has_more:
                        type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: No such run for this caller
        "501":
          description: "`trace_unavailable`: Session Core does not serve the run trace"

  # ===========================================================================
  # Thread export (Wave 3 EP-12 S10), dark behind MODEL_GATEWAY_THREAD_EXPORT
  # ===========================================================================
  /v1/threads/{thread_id}/export:
    get:
      operationId: getThreadExport
      tags: [threads]
      summary: The owner's whole-conversation export of one thread
      description: >-
        Reads one bounded copy of a thread the caller owns: the turns of its active branch, the
        text of their artifacts and a summary of each run. `format=json` answers the
        `verevon.thread-export.v1` document and `format=markdown` a readable copy. The `redacted`
        profile drops tool arguments and results, connector payloads, citation snippets, URL query
        strings and attachment names, and is the input of the replay view. Session Core refuses a
        thread that holds a run kept outside retention, or that belongs to a Space, with 412
        `thread_not_exportable` and `details.reason`. A zero-retention caller is refused with 412
        `zdr_feature_not_supported` before any read. The answer is an attachment and is never
        cached. A key principal is refused by the route policy.
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - name: format
          in: query
          required: true
          description: The rendering to return.
          schema:
            type: string
            enum: [json, markdown]
        - name: profile
          in: query
          required: true
          description: Which copy of the thread to return. There is no default.
          schema:
            type: string
            enum: [full, redacted]
      responses:
        "200":
          description: The export, as an attachment
          headers:
            Content-Disposition:
              description: >-
                An attachment named `verevon-thread-<id>.json` or `verevon-thread-<id>.md`.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                description: The `verevon.thread-export.v1` document.
            text/markdown:
              schema:
                type: string
        "400":
          description: >-
            `invalid_request`: a missing or unknown `format` or `profile` (`details.parameter` and
            `details.allowed` name it), or a request Session Core refuses as invalid.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The route policy refuses the principal (a key principal, or a service).
        "404":
          description: >-
            `thread_export_disabled` while the switch is off, or `thread_not_found` for a thread
            the caller does not own.
        "412":
          description: >-
            `thread_not_exportable` (`details.reason` is `non_persistent_run` or `space_thread`),
            or `zdr_feature_not_supported` with `feature` `conversation_export`.
        "502":
          description: "`thread_export_failed`: the copy could not be rendered, so nothing is sent."
        "503":
          description: "`thread_export_unavailable`: Session Core cannot read the thread now; retry."

  # ===========================================================================
  # Browser key grants (INNH-10 MP-3), dark behind MODEL_GATEWAY_BROWSER_KEY_GRANTS
  # ===========================================================================
  /v1/browser/key-grants:
    post:
      operationId: issueBrowserKeyGrant
      tags: [browser]
      summary: Issue an allow-list browser grant for an API key principal
      description: >-
        Accepts ONLY an `api_key` principal (an API key Auth Core exchanged for a
        short-lived token, `aud=model-gateway`, scope `browser:agent`) together with the
        same key's `aud=browser-broker` token in `x-browser-authorization` (same `sub`,
        `org_id`, `key_id`, `acting_user_id`, `zdr`). A user or service is a 403; an
        api_key principal is a 403 on every other route. Hosts and budget are
        mandatory and are checked by the broker against the key's signed ceilings; the
        lifetime only shortens; there is no kind, no mode and no renew. Unknown body
        fields are a 400. With the gateway flag off the route is a 404; with the
        broker's switch off it is a 403 `api_key_grants_disabled`. Under ZDR the
        response omits `allowed_domains`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [allowed_domains, budget]
              properties:
                allowed_domains:
                  type: array
                  minItems: 1
                  maxItems: 32
                  items:
                    type: string
                    maxLength: 253
                budget:
                  type: object
                  additionalProperties: false
                  required: [micro_usd, max_steps, max_runtime_s]
                  properties:
                    micro_usd:
                      type: integer
                      format: int64
                      minimum: 1
                    max_steps:
                      type: integer
                      format: int32
                      minimum: 1
                    max_runtime_s:
                      type: integer
                      format: int32
                      minimum: 1
                zdr:
                  type: boolean
                  description: Raises the token's posture; never lowers it.
                ttl_s:
                  type: integer
                  minimum: 30
                  maximum: 900
                  description: Only shortens the broker's key-grant TTL (default 600 s).
                session_key:
                  type: string
                  maxLength: 96
                  pattern: "^[A-Za-z0-9_.:-]+$"
      responses:
        "201":
          description: Grant issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [grant_id, expires_at, budget, key_id]
                    properties:
                      grant_id:
                        type: string
                      expires_at:
                        type: string
                        format: date-time
                      allowed_domains:
                        type: array
                        items:
                          type: string
                        description: Omitted under Zero Data Retention.
                      budget:
                        type: object
                        properties:
                          micro_usd:
                            type: integer
                            format: int64
                          max_steps:
                            type: integer
                          max_runtime_s:
                            type: integer
                      key_id:
                        type: string
        "400":
          description: "`invalid_request` (reasons invalid_body, invalid_allowed_domains, api_key_grant_budget_required, invalid_ttl, invalid_session_key, browser_host_not_grantable)"
        "401":
          description: "`browser_bearer_required`: the key's browser-broker bearer is missing"
        "403":
          description: "api_key_principal_required, api_key_grants_disabled, api_key_revoked, api_key_host_ceiling, api_key_budget_ceiling, browser_grant_forbidden"
        "404":
          description: The gateway flag is off
        "429":
          description: "`per_key_grant_cap`: too many live grants for the key or its owner"
        "502":
          description: "`browser_broker_error` (reason key_grant_mismatch when the broker stamped another key)"
        "503":
          description: "`browser_broker_unavailable`"
  /v1/browser/key-grants/{grant_id}:
    delete:
      operationId: releaseBrowserKeyGrant
      tags: [browser]
      summary: Release one of the calling API key's grants
      description: >-
        Same principal and bearer rules as the POST. 204 whether the grant was live,
        already gone or never this key's; the answer never says whether an id exists.
      parameters:
        - name: grant_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
            pattern: "^[A-Za-z0-9_-]+$"
      responses:
        "204":
          description: Released (or nothing to release)
        "400":
          description: "`invalid_request` (reason invalid_grant_id)"
        "401":
          description: "`browser_bearer_required`"
        "403":
          description: "api_key_principal_required, api_key_grants_disabled, browser_grant_forbidden"
        "404":
          description: The gateway flag is off
        "503":
          description: "`browser_broker_unavailable`"

