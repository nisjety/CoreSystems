    get:
      operationId: listSkills
      tags: [skills]
      summary: List skills
      responses:
        "200":
          description: Skills list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      operationId: createSkill
      tags: [skills]
      summary: Create a skill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Skill created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /v1/skills/{id}:
    get:
      operationId: getSkill
      tags: [skills]
