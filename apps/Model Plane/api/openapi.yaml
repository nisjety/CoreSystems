                additionalProperties: true

# =============================================================================
# Components
# =============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by auth-core. Contains org_id, user_id, scopes.

  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
    PlanId:
      name: plan_id
      in: path
      required: true
      schema:
        type: string
    ThreadId:
      name: thread_id
      in: path
      required: true
      schema:
        type: string
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    InvokeRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: User message content (max 100 KB)
          maxLength: 102400
        model:
          type: string
          description: Model identifier. Falls back to DEFAULT_MODEL env.
        session_key:
          type: string
          description: Optional session key for context continuity.
        thread_id:
          type: string
          description: Optional thread ID for conversation threading.
        structured_output_schema:
          type: string
          description: JSON Schema string for structured output.
        zdr:
          type: boolean
          default: false
          description: Zero data retention — if true, no data is persisted.
        max_cost_usd:
          type: number
          format: double
          description: Maximum cost in USD for this request.
          exclusiveMinimum: 0
        max_tokens:
          type: integer
          format: int32
          description: Maximum output tokens.
          exclusiveMinimum: 0

    InvokeResponse:
      type: object
      properties:
        request_id:
          type: string
        content:
          type: string
        model_used:
          type: string

    SseChunk:
      type: object
      description: A single chunk in the invoke/stream SSE response.
      properties:
        request_id:
          type: string
        delta:
          type: string
        done:
          type: boolean
        model_used:
          type: string
        input_tokens:
          type: integer
        output_tokens:
          type: integer

    AiChatRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        model:
          type: string
        stream:
          type: boolean
          default: false
        structured_output_schema:
          type: string

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string

    AiChatResponse:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        model_used:
          type: string
        usage:
          type: object
          properties:
            input_tokens:
              type: integer
            output_tokens:
              type: integer

    AiEmbeddingRequest:
      type: object
      required: [input, model]
      properties:
        input:
          type: string
        model:
          type: string
          example: text-embedding-3-large
        provider:
          type: string
          example: azure-openai

    AiEmbeddingResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: embedding
        model_used:
          type: string
        provider_used:
          type: string
        embedding:
          type: array
          items:
            type: number
            format: float

    AiModelsResponse:
      type: object
      properties:
        models:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              provider:
                type: string
              modality:
                type: string
              streaming:
                type: boolean

    QueuedResponse:
      type: object
      description: Acknowledgement for async/queued AI modality requests.
      properties:
        id:
          type: string
        status:
          type: string
          enum: [queued, not_implemented]
        note:
          type: string

    Plan:
      type: object
      properties:
        id:
          type: string
        run_id:
          type: string
        thread_id:
          type: string
        author:
          type: string
        state:
          $ref: "#/components/schemas/PlanState"
        summary:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/PlanStep"
        supersedes:
          type: string
          nullable: true

    PlanStep:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        operation:
          type: string
          nullable: true
        state:
          type: string
          enum:
            - UNSPECIFIED
            - PENDING
            - IN_PROGRESS
            - COMPLETED
            - FAILED
            - SKIPPED

    PlanState:
      type: string
      enum:
        - UNSPECIFIED
        - DRAFT
        - PROPOSED
        - APPROVED
        - EXECUTING
        - COMPLETED
        - FAILED
        - REJECTED
        - SUPERSEDED
        - ARCHIVED

    Todo:
      type: object
      properties:
        id:
          type: string
        thread_id:
          type: string
        run_id:
          type: string
          nullable: true
        assignee:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        state:
          $ref: "#/components/schemas/TodoState"
        priority:
          type: string
          enum: [UNSPECIFIED, LOW, MEDIUM, HIGH, CRITICAL]
        blocked_by:
          type: array
          items:
            type: string

    TodoState:
      type: string
      enum: [UNSPECIFIED, PENDING, IN_PROGRESS, BLOCKED, COMPLETED, CANCELLED]

    Approval:
      type: object
      properties:
        id:
          type: string
        run_id:
          type: string
        step_id:
          type: string
          nullable: true
        kind:
          type: string
          enum: [UNSPECIFIED, HUMAN_APPROVAL, AUTO_APPROVAL, ESCALATION]
        state:
          type: string
          enum: [UNSPECIFIED, PENDING, GRANTED, DENIED, EXPIRED, WITHDRAWN]
        requested_of:
          type: string
        decided_by:
          type: string
          nullable: true
        decision_reason:
          type: string
          nullable: true
        cause:
          nullable: true
          description: Why the approval was asked for. Null when the creator stated no cause.
          allOf:
            - $ref: "#/components/schemas/ApprovalCause"
        tool_key:
          type: string
          nullable: true
          description: Stable key of the gated tool, from the creator's validated card context.
        action_label:
          type: string
          nullable: true
          description: Short allowlisted label of the gated action. Never raw tool arguments.
        resume_class:
          type: string
          nullable: true
          enum: [action_continuation, live_poll, none]
          description: What approving does. none means approving only lets the agent retry this exact action once. Null when the creator stated none.
        continuation:
          nullable: true
          description: Where the approved action stands, derived from the delivery rows. Null until the approval is granted.
          allOf:
            - $ref: "#/components/schemas/ApprovalContinuation"

    ApprovalContinuation:
      type: object
      description: >-
        Derived, never stored and never client-stated. not_resumable means approving only lets the
        agent retry this exact action once; the run does not continue by itself.
      properties:
        state:
          type: string
          enum: [queued, running, completed, failed, not_resumable, live, awaiting_continue]
        failure_code:
          type: string
          nullable: true
        verification:
          type: string
          nullable: true
          enum: [verified_success, verified_failure, partially_verified, unknown]
        provider_receipt_id:
          type: string
          nullable: true

    ApprovalCause:
      type: object
      description: >-
        Why an approval was asked for. An allowlisted projection: the tool arguments, the
        call digest and the action key are never part of it.
      properties:
        code:
          type: string
          description: Closed cause code. A code this build does not know is reported as unclassified_gate.
          enum:
            - owner_effect_reserved
            - consent_to_disclose
            - risky_effect_under_ask
            - provider_write
            - capability_high_risk
            - capability_policy_ask
            - hook_ask
            - browser_action_risk
            - auto_posture_provider_write
            - unclassified_gate
        tool:
          type: string
          nullable: true
          description: Tool the pause is on. Null for a gate that is not a tool call.
        effect_class:
          type: string
          nullable: true
          description: Declared side-effect class of the call, when the gate read one.
        risk_category:
          type: string
          nullable: true
          description: Browser risk category the proposed action was held under.
        rule_id:
          type: string
          nullable: true
          description: Standing rule that raised the pause, when one did.
        scope_options:
          type: array
          description: Scopes the decider may grant. Only once is offered today.
          items:
            type: string
        step_up_required:
          type: boolean
          description: True when granting needs a recent re-authentication.

    SubagentLineage:
      type: object
      properties:
        thread_id:
          type: string
        max_depth:
          type: integer
        edges:
          type: array
          items:
            type: object
            properties:
              parent_run_id:
                type: string
              child_run_id:
                type: string
              role:
                type: string
                enum: [UNSPECIFIED, PLANNER, EXECUTOR, REVIEWER, CRITIC, SPECIALIST]

    OrchestrationEvent:
      type: object
      description: SSE event from /v1/runs/{run_id}/events
      properties:
        event_type:
          type: string
        data:
          type: object
          additionalProperties: true

    TransitionPlanBody:
      type: object
      required: [target_state]
      properties:
        target_state:
          $ref: "#/components/schemas/PlanState"
        reason:
          type: string
          default: ""

    TransitionTodoBody:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/TodoState"
        reason:
          type: string
          default: ""

    DecideApprovalBody:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        reason:
          type: string
          default: ""
        scope:
          type: string
          description: >-
            How far the decision reaches. Omitted means once. A standing scope is refused with
            422 scope_not_enabled until grants exist.
          enum: [once]
          default: once

    Capability:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
        version:
          type: string
        description:
          type: string
        risk_level:
          type: string
        lazy_load:
          type: boolean
        scope:
          type: string
        state:
          type: string
          enum: [available, disabled, unhealthy, approval_required, unavailable, not_configured]
          description: Fail-closed runtime availability; registry presence alone never means available.
        reason_code:
          type: string
          description: Stable machine-readable reason for the current state.
        reason:
          type: string
          description: Human-readable availability explanation.
        requires_approval:
          type: boolean
          description: Whether execution must use the governed approval path.
        execution_mode:
          type: string
          enum: [direct_read, agentic, unavailable]
        cost_class:
          type: string
          enum: [unknown, bounded, variable]
        health_checked_at:
          type: string
          format: date-time
          description: Server-recorded health-attestation time; empty when health is not attested.
        side_effect_class:
          type: string
          enum: [read, sandbox_compute, context_write, external_write, destructive, owner_effect, unclassified]
          readOnly: true
          description: >-
            Declared side-effect class of the capability, the strictest class of
            the tools it carries. The vocabulary is closed and unclassified is the
            strictest, so a value the registry has not classified reads as
            unclassified, never as a weaker class. Set only by the registry's seed
            and observation paths; no request field sets it.
        approval_floor:
          type: string
          enum: [none, ask, durable_owner]
          readOnly: true
          description: >-
            The least approval the class may be run under. owner_effect always
            carries durable_owner and unclassified always carries at least ask;
            an empty or unrecognised floor reads as durable_owner, the strictest.

    TaskInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        kind:
          type: string
        schedule:
          type: string
        payload:
          type: object
          additionalProperties: true
