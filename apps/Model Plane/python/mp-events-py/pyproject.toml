[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mp-events"
version = "0.1.0"
description = "Model Plane canonical event envelope (Python parity leg)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "blake3>=0.4",
  "protobuf>=7.35.1,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/mp_events"]
