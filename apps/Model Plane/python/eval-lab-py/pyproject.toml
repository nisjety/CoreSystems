[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eval-lab-py"
version = "0.1.0"
description = "Eval regression and replay framework for Model Plane"
readme = "README.md"
requires-python = ">=3.11"
# `mp-events` is deliberately absent. It was declared here and resolved through
# a `[tool.uv.sources]` path entry, which plain `pip install -e .` cannot read —
# so ANY pip-based install (including every CI runner) failed with
# "No matching distribution found for mp-events". Nothing under src/ or tests/
# imports it, so the dependency bought nothing and cost the harness its ability
# to be installed anywhere but uv. Re-add it (with a uv AND a pip resolvable
# form) only when something actually imports it.
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/eval_lab"]
