[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eval-lab-py"
version = "0.1.0"
description = "Eval regression and replay framework for Model Plane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "mp-events",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/eval_lab"]

[tool.uv.sources]
mp-events = { path = "../mp-events-py" }
