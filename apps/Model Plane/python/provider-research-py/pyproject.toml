[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "provider-research-py"
version = "0.1.0"
description = "Provider comparison tooling for Model Plane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "mp-events",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/provider_research"]

[tool.uv.sources]
mp-events = { path = "../mp-events-py" }
