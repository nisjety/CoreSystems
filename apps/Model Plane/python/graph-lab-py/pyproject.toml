[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graph-lab-py"
version = "0.1.0"
description = "Graph-based reasoning experiments for Model Plane (MP-07 prep)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "networkx>=3.0",
  "mp-events",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/graph_lab"]

[tool.uv.sources]
mp-events = { path = "../mp-events-py" }
