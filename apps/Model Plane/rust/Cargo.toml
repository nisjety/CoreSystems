[workspace]
resolver = "2"
members = [
    "crates/mp-contracts",
    "crates/mp-ids",
    "crates/mp-events",
    "crates/mp-telemetry",
    "crates/mp-slo",
    "crates/mp-orchestration",
    "crates/mp-eventlog",
    "crates/mp-toon",
    "crates/mp-authctx",
    "services/model-gateway",
    "services/session-core",
    "services/inference-core",
    "services/execution-core",
    "clients/bridge-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# gRPC / proto
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"

# HTTP
axum = { version = "0.7", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# IDs
ulid = "1"

# Hashing
blake3 = "1"

# Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.27"
opentelemetry = "0.26"
opentelemetry_sdk = { version = "0.26", features = ["rt-tokio"] }
opentelemetry-otlp = "0.26"

# NATS
async-nats = "0.49.1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json"] }

# Redis (cross-replica stream/event buffers)
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Concurrency
dashmap = "6"
futures = "0.3"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Auth
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
