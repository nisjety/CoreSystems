[package]
name = "execution-core"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
mp-contracts = { path = "../../crates/mp-contracts" }
mp-ids = { path = "../../crates/mp-ids" }
mp-telemetry = { path = "../../crates/mp-telemetry" }

tokio = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
tracing = { workspace = true }
# Concurrent (non-'static, borrowed) tool-call dispatch within one round --
# `futures::future::join_all` on futures that borrow `LoopContext`, same
# pattern already used in model-gateway (deep_research.rs, dataplane.rs).
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
axum = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
dashmap = { workspace = true }
regex = "1"
reqwest = { workspace = true }
jsonwebtoken = { workspace = true }
base64 = "0.22"
blake3 = { workspace = true }
tokio-stream = { version = "0.1", features = ["net"] }
ed25519-dalek = "2"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
mp-slo = { path = "../../crates/mp-slo" }
wiremock = "0.6"
rsa = { version = "0.9", features = ["pem"] }
