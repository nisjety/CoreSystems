# Studio Plane broker for Social and Leads. Provider credentials remain in each
# core's env file; the deployment-only provisioner has a separate credential.
jetstream: true
http: "127.0.0.1:8222"
max_payload: 1MB
store_dir: /data/jetstream

authorization {
  users: [
    {
      user: "studio-social"
      password: $STUDIO_SOCIAL_NATS_PASSWORD
      permissions: {
        publish: "verevon.application.social.>"
        subscribe: "_INBOX.APPLICATION_SOCIAL.>"
      }
    }
    {
      user: "studio-leads"
      password: $STUDIO_LEADS_NATS_PASSWORD
      permissions: {
        publish: "verevon.audit.v2.application.leads-core.>"
        subscribe: "_INBOX.APPLICATION_LEADS.>"
      }
    }
    {
      user: "studio-provisioner"
      password: $STUDIO_NATS_PROVISIONER_PASSWORD
      permissions: {
        publish: ["$JS.API.STREAM.>", "$JS.API.CONSUMER.>"]
        subscribe: "_INBOX.STUDIO_PROVISIONER.>"
      }
    }
  ]
}
logtime: true
