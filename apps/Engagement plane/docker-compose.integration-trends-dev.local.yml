# Explicit development fallback. No host port, account grants or provider keys.
services:
  integration-api:
    environment:
      PYTRENDS_DEV_ENABLED: 'true'
    networks: [trends-private]
    depends_on:
      pytrends-dev: {condition: service_healthy}
  pytrends-dev:
    image: studio-pytrends-dev:local
    build:
      context: ../Ingestion Plane/integration-corev2/services/pytrends-dev
    environment:
      PYTRENDS_DEV_ENABLED: '1'
    networks: [trends-private, trends-egress]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp:size=16m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 4
networks:
  trends-private:
    internal: true
  trends-egress: {}
