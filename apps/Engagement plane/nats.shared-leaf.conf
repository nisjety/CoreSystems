
# Local stream ownership is unchanged. No JetStream API traffic is federated.
jetstream { domain: STUDIO; store_dir: /data/jetstream }
leafnodes {
  remotes: [{
    url: $NATS_SHARED_LEAF_URL
    # The hub's studio-leaf principal additionally allows publish ONLY on
    # verevon.studio.events.>; raw Social drafts and Leads audit stay local.
    deny_exports: ["$JS.>", "$SYS.>", "_INBOX.>", "_VEREVON.>", "verevon.gdpr.>", "verevon.audit.>", "verevon.application.social.>", "service.authenticate", "session.validate", "health.check"]
    deny_imports: ["$JS.>", "$SYS.>", "_INBOX.>", "_VEREVON.>", "verevon.gdpr.>", "verevon.audit.>", "verevon.application.social.>", "service.authenticate", "session.validate", "health.check"]
  }]
}
