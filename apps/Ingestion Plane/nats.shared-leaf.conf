
jetstream { domain: INGESTION; store_dir: /data }
leafnodes {
  remotes: [{
    url: $NATS_SHARED_LEAF_URL
    # Hub ingestion-leaf allows only quarry.events.> and
    # verevon.ingestion.integration.>; per-run Quarry traffic remains local.
    deny_exports: ["$JS.>", "$SYS.>", "_INBOX.>", "_VEREVON.>", "verevon.gdpr.>", "verevon.audit.>", "quarry.run.>", "service.authenticate", "session.validate", "health.check"]
    deny_imports: ["$JS.>", "$SYS.>", "_INBOX.>", "_VEREVON.>", "verevon.gdpr.>", "verevon.audit.>", "quarry.run.>", "service.authenticate", "session.validate", "health.check"]
  }]
}
