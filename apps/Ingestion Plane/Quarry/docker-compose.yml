name: quarry-stack

services:
  quarry-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quarry-api
    restart: unless-stopped
    environment:
      PORT: "8090"
      CACHE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      CHANGE_TRACKING_BACKEND: redis
      CHANGE_TRACKING_TTL_HOURS: "720"
      JOB_STORE_BACKEND: postgres
      NATS_SHARED_URL: nats://nats:4222
      TEMPORAL_ENABLED: "true"
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: quarry-task-queue
      BROWSER_SERVICE_URL: http://quarry-browser:8091
      BROWSER_SERVICE_INTERNAL_API_KEY: ${BROWSER_SERVICE_INTERNAL_API_KEY:-quarry-browser-dev-key}
      AI_CORE_HTTP_BASE_URL: http://ai-core:8001
      AI_CORE_INTERNAL_API_KEY: ${AI_CORE_INTERNAL_API_KEY:-}
      QUARRY_POSTGRES_DSN: postgres://quarry:quarry@postgres:5432/quarry?sslmode=disable
      QUARRY_API_KEY: ${QUARRY_API_KEY:-dev-test-key-12345}
      AUTH_CORE_INTERNAL_API_KEY: ${AUTH_CORE_INTERNAL_API_KEY:-}
      DATAPLANE_BASE_URL: http://host.docker.internal:9401
      RETRIEVAL_BASE_URL: http://host.docker.internal:9404
      DATAPLANE_INTERNAL_API_KEY: ${DATAPLANE_INTERNAL_API_KEY:-dev-internal-key}
      USER_CORE_URL: ${USER_CORE_URL:-}
      ORG_CORE_URL: ${ORG_CORE_URL:-}
      BILLING_CORE_URL: ${BILLING_CORE_URL:-}
      CONTROL_PLANE_CACHE_SEC: ${CONTROL_PLANE_CACHE_SEC:-60}
      GITHUB_API_BASE_URL: https://api.github.com
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ENABLE_AI_EXTRACTION: "true"
      ENABLE_URL_SCANNING: "true"
      ARTIFACT_STORE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: quarry-artifacts
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_BASE_URL: http://localhost:9010
      ROD_BROWSER_BIN: /usr/bin/chromium-browser
      ROD_CHROMIUM_BIN: /usr/bin/chromium-browser
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      nats:
        condition: service_started
      minio:
        condition: service_started
      quarry-browser:
        condition: service_started
      temporal:
        condition: service_healthy
    ports:
      - "8092:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - quarry-net
      - velion-net

  quarry-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quarry-worker
    restart: unless-stopped
    command: ["/usr/local/bin/quarry-worker"]
    environment:
      TEMPORAL_ENABLED: "true"
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: quarry-task-queue
      CACHE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      CHANGE_TRACKING_BACKEND: redis
      CHANGE_TRACKING_TTL_HOURS: "720"
      JOB_STORE_BACKEND: postgres
      NATS_SHARED_URL: nats://nats:4222
      AI_CORE_HTTP_BASE_URL: http://ai-core:8001
      AI_CORE_INTERNAL_API_KEY: ${AI_CORE_INTERNAL_API_KEY:-}
      QUARRY_POSTGRES_DSN: postgres://quarry:quarry@postgres:5432/quarry?sslmode=disable
      AUTH_CORE_INTERNAL_API_KEY: ${AUTH_CORE_INTERNAL_API_KEY:-}
      DATAPLANE_BASE_URL: http://host.docker.internal:9401
      RETRIEVAL_BASE_URL: http://host.docker.internal:9404
      DATAPLANE_INTERNAL_API_KEY: ${DATAPLANE_INTERNAL_API_KEY:-dev-internal-key}
      USER_CORE_URL: ${USER_CORE_URL:-}
      ORG_CORE_URL: ${ORG_CORE_URL:-}
      BILLING_CORE_URL: ${BILLING_CORE_URL:-}
      CONTROL_PLANE_CACHE_SEC: ${CONTROL_PLANE_CACHE_SEC:-60}
      GITHUB_API_BASE_URL: https://api.github.com
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ENABLE_AI_EXTRACTION: "true"
      ARTIFACT_STORE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: quarry-artifacts
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_BASE_URL: http://localhost:9010
      ZEROLOG_LEVEL: "debug"
      ROD_BROWSER_BIN: /usr/bin/chromium-browser
      ROD_CHROMIUM_BIN: /usr/bin/chromium-browser
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      nats:
        condition: service_started
      minio:
        condition: service_started
      temporal:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - quarry-net
      - velion-net

  quarry-browser:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quarry-browser
    restart: unless-stopped
    command: ["/usr/local/bin/quarry-browser"]
    environment:
      PORT: "8091"
      BROWSER_SERVICE_PORT: "8091"
      BROWSER_SERVICE_INTERNAL_API_KEY: ${BROWSER_SERVICE_INTERNAL_API_KEY:-quarry-browser-dev-key}
      BROWSER_POOL_SIZE: "5"
      ROD_BROWSER_BIN: /usr/bin/chromium-browser
      ROD_CHROMIUM_BIN: /usr/bin/chromium-browser
    ports:
      - "8091:8091"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - quarry-net

  temporal:
    image: temporalio/auto-setup:1.27.2
    container_name: quarry-temporal
    restart: unless-stopped
    environment:
      DB: postgres12
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: quarry
      POSTGRES_PWD: quarry
      DB_PORT: 5432
      POSTGRES_DB: temporal
      VISIBILITY_DB: temporal_visibility
      SKIP_DB_CREATE: false
      SKIP_DEFAULT_NAMESPACE_CREATION: false
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "7234:7233"
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - quarry-net

  temporal-ui:
    image: temporalio/ui:2.34.0
    container_name: quarry-temporal-ui
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_UI_ENABLED: "true"
    ports:
      - "8089:8080"
    depends_on:
      temporal:
        condition: service_healthy
    networks:
      - quarry-net

  redis:
    image: redis:7.4-alpine
    container_name: quarry-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6383:6379"  # offset to avoid conflict with controlplane-redis (6380)
    volumes:
      - redis-data:/data
    networks:
      - quarry-net

  nats:
    image: nats:2.11-alpine
    container_name: quarry-nats
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    ports:
      - "4223:4222"
      - "8223:8222"
    networks:
      - quarry-net

  minio:
    image: minio/minio:latest
    container_name: quarry-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio-data:/data
    networks:
      - quarry-net

  postgres:
    image: postgres:16-alpine
    container_name: quarry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quarry
      POSTGRES_PASSWORD: quarry
      POSTGRES_DB: quarry
    ports:
      - "5436:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-temporal-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quarry -d quarry && pg_isready -U quarry -d temporal && pg_isready -U quarry -d temporal_visibility"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - quarry-net

volumes:
  redis-data:
  minio-data:
  postgres-data:

networks:
  quarry-net:
    name: quarry-net
  velion-net:
    external: true
    name: velion-net
