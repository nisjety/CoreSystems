version: "3.9"

services:
  temporal:
    image: temporalio/auto-setup:1.27.2
    container_name: quarry-temporal
    environment:
      - DB=sqlite
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sqlite.yaml
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.34.0
    container_name: quarry-temporal-ui
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_UI_ENABLED=true
    ports:
      - "8088:8080"
    depends_on:
      - temporal
