    RobotsFetchDenial:
      type: object
      description: >-
        error.details.denial of the 403 SECURITY_BLOCKED a page fetch gets when
        robots.txt refuses it (WS14.S4). The path never carries the query.
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - robots_disallowed
          - robots_unreachable
        message:
          type: string
        remedy:
          type: string
          nullable: true
        user_agent:
          type: string
          description: The product token whose group disallows the path (robots_disallowed).
        path:
          type: string
          description: The disallowed path, without the query (robots_disallowed).
        host:
          type: string
          description: The host whose robots.txt could not be fetched (robots_unreachable).
    RequestAsk:
      type: object
      description: >-
        WS7.C web-policy ask on a scrape request. It can only tighten what the
        operator baseline and the organisation's policy allow; it cannot loosen
        anything. A domain it denies is a 403 with details.reason policy_denied
        (capability domains.deny, decision_source request). An unknown capability
        in disable is a 400 with details.reason unknown_capability. Under
        QUARRY_EDGE__WEB_POLICY_ENFORCEMENT=observe the ask is only counted, never
        enforced.
      additionalProperties: false
      properties:
        disable:
          type: array
          items:
            type: string
          description: Capability keys to disable for this request (the catalogue names, for example browser.act.upload).
        robots_max:
          type: string
          enum:
          - strict
          - respect
          - ignore
          description: Lower the robots.txt ceiling for this request.
        proxy_max:
          type: string
          enum:
          - none
          - pool
          description: Lower the proxy tier ceiling for this request.
        deny_domains:
          type: array
          items:
            type: string
          description: Hosts to refuse for this request (exact host or dot-suffix match).
        allow_domains:
          type: array
          nullable: true
          items:
            type: string
          description: Hosts to allow for this request. Applies to autonomous (service) callers only.
    ScrapeRequest:
      type: object
      additionalProperties: true
      x-quarry-lenient: >-
        Keys that are not listed are ignored with an unknown_field warning
        (and Deprecation and Sunset headers) until the edge runs strict, where
        they are a 400.
      x-quarry-lenient-until: >-
        Lenient until QUARRY_EDGE__SCRAPE_STRICT_AFTER is reached (an RFC 3339
        time or a YYYY-MM-DD date, read at start). From that instant unknown keys
        are a 400. A response that carries unknown-field warnings gets
        Deprecation: true, and Sunset with the date while the variable is set.
        QUARRY_EDGE__SCRAPE_REQUEST_VALIDATION=strict makes the edge strict at
        once. No date is set in this repository: the operator sets it when the
        quarry.scrape.unknown_field log line shows that no caller still sends an
        unlisted key.
      required:
      - url
      properties:
        privacy:
          type: object
          nullable: true
          description: Privacy policy for this request (purpose, classification, third-party processing). ZDR raises it.
        render:
          type: object
          nullable: true
          description: Render hints for the browser driver (waitForSelector, waitForTimeoutMs).
          properties:
            waitForSelector:
              type: string
            waitForTimeoutMs:
              type: integer
        prefer_http3:
          type: boolean
          default: false
          description: Prefer HTTP/3 when the edge was built and configured for it.
        policy:
          $ref: '#/components/schemas/RequestAsk'
        url:
          type: string
          format: uri
          description: URL to scrape
          example: https://example.com/article
        prev_fingerprint:
          type: string
          nullable: true
          description: Previous blake3 fingerprint for change detection
        cache:
          $ref: '#/components/schemas/CachePolicy'
        zdr:
          type: boolean
          default: false
          description: Zero Data Retention mode — skip all durable writes
        signals:
          $ref: '#/components/schemas/DriverSignals'
        ingest:
          type: boolean
          default: false
          description: Forward results to Data Plane for ingestion
        org_id:
          type: string
          nullable: true
          description: Organization ID for Data Plane ingest
        formats:
          type: array
          description: >-
            What to return inline besides the artifact references. `markdown`,
            `html` (the HTML the markdown was made from, after the cleaning options),
            `rawHtml` (the document as fetched), `links` and `metadata` (the
            last two are in every response already). Naming formats makes the
            request non-default: it neither reads nor writes the page cache. Under
            ZDR the default is `["markdown"]`. `json`, `summary`, `question` and
            `highlights` are reserved and rejected with `reserved_format`.
            `screenshot` and `pdf` are captures (WS13.4b), given as a string or as an
            object `{"type": "screenshot"}` or `{"type": "pdf"}` with options (see
            CONTRACTS.md section 10). Refused with 400 `feature_disabled` at `formats`
            while QUARRY_EDGE__SCRAPE_CAPTURE is not `on`.
          items:
            oneOf:
            - type: string
              enum: [markdown, html, rawHtml, links, metadata, screenshot, pdf]
            - type: object
              required:
              - type
              properties:
                type:
                  type: string
                  enum: [screenshot, pdf]
        only_main_content:
          type: boolean
          default: true
          description: true runs the main-content heuristic (extractor readability); false keeps the whole body (clean_full). Must agree with extractor. camelCase alias onlyMainContent.
        include_tags:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 256
          description: CSS selectors; only the matching subtrees are kept, each once. Matching nothing gives empty markdown and the warning include_tags_matched_nothing. An invalid selector is a 400 invalid_selector. Alias includeTags.
        exclude_tags:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 256
          description: CSS selectors; every match and its subtree is removed before extraction. Alias excludeTags.
        remove_base64_images:
          type: boolean
          default: false
          description: Strip inline base64 images (clean_full always does). Alias removeBase64Images.
        extractor:
          type: string
          enum: [readability, clean_full, raw]
          default: readability
          description: readability (main content), clean_full (whole body without scripts and chrome) or raw (as is). Setting it against only_main_content is a 400 conflicts_with_only_main_content.
        timeout_ms:
          type: integer
          minimum: 1000
          maximum: 55000
          default: 55000
          description: Upper bound for the whole scrape; on expiry the response is a 504 TIMEOUT with details.op = scrape. Alias timeoutMs.
        max_inline_bytes:
          type: integer
          minimum: 1
          maximum: 8388608
          default: 1048576
          description: Cap for each inline field. Over it, a non-ZDR field is left out (listed in omitted), a ZDR field is cut (listed in truncated). Alias maxInlineBytes.
        actions:
          type: array
          nullable: true
          maxItems: 50
          description: >-
            Actions run in order on the page the scrape opened (WS13.5). Off by
            default: QUARRY_EDGE__SCRAPE_ACTIONS must admit the caller (`user` admits
            user tokens, dev only; `on` also admits a service principal with
            scrape:interact). Each item is an object whose `type` is one of wait
            (`milliseconds`, or `selector` with `timeoutMs`), click (`selector`), write
            (`selector` and `text`; the text is never echoed), press (`key`: a named key
            such as Enter, Tab or Escape, or one printable character), scroll (`to` top
            or bottom, or `selector`, or `direction` up or down with `pixels`), select
            (`selector` and `value`), screenshot and pdf (their options, as in formats).
            At most 50 actions; the total wait is at most 60 s and one wait at most 30 s.
            The types executeJavascript, evaluate, navigate, back, forward, clickPoint,
            mouseWheel, upload, download and dialog are refused by name (action_denied).
            A request labelled initiated_by "agent" is refused with 403
            scrape_interact_scope_required whatever the token. Not served on
            /v1/scrape/stream (400 unsupported_in_stream).
          items:
            type: object
            required:
            - type
            properties:
              type:
                type: string
                enum: [wait, click, write, press, scroll, select, screenshot, pdf]
        actions_on_error:
          type: string
          enum: [abort, continue]
          default: abort
          description: >-
            What to do when an action fails. abort stops the run and answers with the
            outcome of every action in error.details.actions; continue goes on to the
            next action. There is no retry: a replayed click or type can submit twice.
            Alias actionsOnError.
      description: >-
        Fields not listed here are unknown: ignored with an unknown_field warning
        (and Deprecation and Sunset headers) unless the edge runs strict, where they
        are a 400. skipTlsVerification, skip_tls_verification, proxy, proxyUrl,
        headers, mobile and stealth are always a 400 reserved_field. A bad value is
        a 400 with details.fields[] {path, code, message}.
    CrawlRequest:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          description: Seed URL for the crawl
        max_pages:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Maximum pages to crawl. Absent or 0 takes the default (1000; operator
            override QUARRY_CRAWL_DEFAULT_MAX_PAGES), never unlimited. A value above
            the hard ceiling (5000; QUARRY_CRAWL_HARD_MAX_PAGES) is clamped to it. The
            response reports the effective value in `limits`.
        max_depth:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Maximum link depth from the seed. Absent or 0 takes the default (5);
            clamped to the hard ceiling (10). Reported in `limits`.
        allow_subdomains:
          type: boolean
          description: >-
            WS14.S3. Follow links to subdomains of the seed host. Absent means false.
            The effective scope is echoed in `effective`.
        allow_external_links:
          type: boolean
          description: >-
            WS14.S3. Follow links to hosts unrelated to the seed host. Absent means false.
            The effective scope is echoed in `effective`.
        include_paths:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 512
          description: >-
            WS14.S6. Patterns a link must match at least one of (glob by default; `re:`
            prefixes a regular expression). At most 100 patterns across include_paths and
            exclude_paths together, 512 characters each, 8192 in total. A bad pattern is a 400
            with `details.fields[]` (path, code `invalid_pattern`). Enforced only when the
            scope mode is enforce; under observe the response carries `patterns_reported_not_enforced`.
        exclude_paths:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 512
          description: >-
            WS14.S6. Patterns that deny a link; they beat include_paths. Same caps as include_paths.
        deny_extensions:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 16
          description: WS14.S6. Extensions to deny, without the dot. Absent takes the built-in list.
        crawl_entire_domain:
          type: boolean
          default: true
          description: >-
            WS14.S6. Absent or true follows links across the whole domain. false keeps the
            crawl under the seed URL's directory (reported as `same_directory_only`).
        sitemap:
          type: string
          enum: [skip]
          description: WS14.S6. Only `skip` is accepted; any other value is a 400 `unsupported_option` (F-t2-041).
        ignore_query_parameters:
          type: boolean
          description: WS14.S6. Reserved; any value is a 400 `unsupported_option` (F-t2-041).
        scrape_options:
          type: object
          description: WS14.S6. Reserved; any value is a 400 `unsupported_option` until WS5 slice 4 (references only).
        ignore_robots_txt:
          type: boolean
          description: >-
            WS14.S6. `true` is a 403 `policy_denied` for every request until the entitlement
            (WS14.S7) is built. `false` is accepted. Service principals are refused in any case.
    BatchRequest:
      type: object
      required:
      - urls
      properties:
        urls:
          type: array
          items:
            type: string
            format: uri
          description: URLs to scrape in parallel
    CachePolicy:
      type: object
      properties:
        mode:
          type: string
          enum:
          - read_write
          - read_only
          - write_only
          - bypass
          default: read_write
        max_age_s:
          type: integer
          default: 0
          description: Custom TTL in seconds (0 = use default 3600s)
    DriverSignals:
      type: object
      properties:
        actions:
          type: array
          items:
            type: string
          default: []
          description: Actions that require a browser driver
        screenshot:
          type: boolean
          default: false
        pdf:
          type: boolean
          default: false
        prior_block_signals:
          type: integer
          default: 0
          deprecated: true
          description: >-
            Deprecated. Number of prior blocks. Under QUARRY_BLOCK_ESCALATION=legacy
            a value of 1 selects the TLS driver and 2 or more the browser; under
            honest (WS3.I) the field is accepted and ignored, because a block never
            changes the identity Quarry presents.
        profile_required:
          type: boolean
          default: false
        url_type:
          type: string
          enum:
          - json
          - plain_text
          - default
          default: default
    NormalizedOutput:
      type: object
      required:
      - run_id
      - url
      - status
      - fetched_at
      - fingerprint
      - formats
      - change
      - metadata
      - driver
      properties:
        run_id:
          type: string
          description: Typed ID with run_ prefix
        url:
          $ref: '#/components/schemas/UrlTriple'
        status:
          type: integer
          description: HTTP status code from upstream
        fetched_at:
          type: string
          format: date-time
        fingerprint:
          type: string
          description: blake3:<hex> content fingerprint
        formats:
          $ref: '#/components/schemas/OutputFormats'
        change:
          $ref: '#/components/schemas/ChangeInfo'
        metadata:
          $ref: '#/components/schemas/PageMetadata'
        driver:
          $ref: '#/components/schemas/DriverInfo'
    UrlTriple:
      type: object
      required:
      - requested
      - final_url
      properties:
        requested:
          type: string
        final_url:
          type: string
        canonical:
          type: string
          nullable: true
    OutputFormats:
      type: object
      properties:
        html:
          $ref: '#/components/schemas/FormatRef'
        markdown:
          $ref: '#/components/schemas/FormatRef'
        raw:
          $ref: '#/components/schemas/FormatRef'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        screenshot:
          $ref: '#/components/schemas/FormatRef'
        pdf:
          $ref: '#/components/schemas/FormatRef'
        extract:
          $ref: '#/components/schemas/ExtractRef'
    FormatRef:
      type: object
      required:
      - artifact_id
      - bytes
      properties:
        artifact_id:
          type: string
        bytes:
          type: integer
          format: int64
    ExtractRef:
      type: object
      required:
      - artifact_id
      properties:
        artifact_id:
          type: string
        schema_id:
          type: string
          nullable: true
    Link:
      type: object
      required:
      - href
      properties:
        href:
          type: string
        text:
          type: string
          nullable: true
        rel:
          type: string
          nullable: true
    ChangeInfo:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - new
          - changed
          - unchanged
        prev_fingerprint:
          type: string
          nullable: true
    PageMetadata:
      type: object
      properties:
        title:
          type: string
          nullable: true
        lang:
          type: string
          nullable: true
        content_type:
          type: string
          nullable: true
        content_kind:
          type: string
          description: >-
            What the body was detected to be, from its first bytes and then its
            Content-Type: html, xml, text, json, pdf, docx, xlsx, pptx, odf, epub,
            ole_compound, image, audio, video, archive, executable, rtf or binary.
            Absent when QUARRY_EDGE__DOC_ROUTING is off. A body Quarry cannot
            extract text from is refused with 415 UNSUPPORTED_MEDIA when the mode
            is skip or on (details.kind names it).
        content_kind_source:
          type: string
          enum:
          - header
          - magic
          - default
    DriverInfo:
      type: object
      required:
      - kind
      - duration_ms
      properties:
        kind:
          type: string
          enum:
          - static
          - browser
          - tls
        duration_ms:
          type: integer
          format: int64
        profile:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        session_id:
          type: string
          nullable: true
        live_view_url:
          type: string
          nullable: true
          format: uri
        recording_id:
          type: string
          nullable: true
    HandoffAck:
      type: object
      required:
      - job_id
      - accepted_at
      properties:
        job_id:
          type: string
        accepted_at:
          type: string
          format: date-time
        rejected:
          type: array
          description: >-
            WS14.S5. Set by /v1/batch only: the URLs the static check refused, in request order.
            No URL is fetched or resolved to make this decision. Absent when none was refused.
          items:
            type: object
            required:
            - url
            - code
            - message
            properties:
              url:
                type: string
              code:
                type: string
                enum: [not_crawlable, security_rejected, duplicate, max_pages_reached]
              message:
                type: string
        effective:
          type: object
          description: >-
            WS14.S3. Set by /v1/crawl only: the scope and bounds the crawl runs with.
            `scope_mode` is observe (count, drop nothing; the default) or enforce; `legacy`
            is true when the scope switch is off; `warnings` lists the widened switches.
            Never a URL.
          properties:
            scope:
              type: object
              description: The crawl scope (allow_subdomains, allow_external_links, crawl_entire_domain, include_paths, exclude_paths, deny_extensions, legacy).
            scope_mode:
              type: string
              enum: [observe, enforce]
            robots:
              type: string
              enum: [respect, ignore]
            max_pages:
              type: integer
            max_depth:
              type: integer
            legacy:
              type: boolean
            warnings:
              type: array
              items:
                type: string
        limits:
          type: object
          description: >-
            Set by /v1/crawl and /v1/batch. A crawl carries the page and depth bounds it
            will run with and why they differ from the request (`clamped_by` is
            `default` when the request was absent or zero, `hard` when it was above the
            ceiling, `entitlement` when the organization's remaining allowance was
            smaller, and empty when it was used as asked). A batch carries `urls`: how
            many URLs were asked for, accepted (the first ones, in order) and dropped.
            Counts only; never a URL. `remaining` is present only for a configured
            allowance (WS6.D-s).
          properties:
            max_pages:
              $ref: '#/components/schemas/CrawlBound'
            max_depth:
              $ref: '#/components/schemas/CrawlBound'
            urls:
              $ref: '#/components/schemas/BatchUrlsBound'
    CrawlBound:
      type: object
      required:
      - effective
      - clamped_by
      properties:
        requested:
          type: integer
          nullable: true
        effective:
          type: integer
          minimum: 1
        remaining:
          type: integer
          minimum: 1
          description: >-
            What the organization has left of its configured allowance for this bound
            (WS6.D-s). Absent when no allowance is configured; never 0 (a spent
            allowance is a 402).
        clamped_by:
          type: array
          items:
            type: string
            enum:
            - default
            - hard
            - entitlement
    BatchUrlsBound:
      type: object
      required:
      - requested
      - accepted
      - dropped
      - clamped_by
      properties:
        requested:
          type: integer
          minimum: 0
        accepted:
          type: integer
          minimum: 0
        dropped:
          type: integer
          minimum: 0
        remaining:
          type: integer
          minimum: 1
          description: Present only for a configured quarry.batch.url allowance (WS6.D-s).
        clamped_by:
          type: array
          items:
            type: string
            enum:
            - entitlement
    Envelope_NormalizedOutput:
      type: object
      required:
      - request_id
      - success
      - data
      properties:
        request_id:
          type: string
        success:
          type: boolean
          description: Always true for success envelopes
        data:
          $ref: '#/components/schemas/NormalizedOutput'
    ScrapeResponse:
      description: >-
        A NormalizedOutput plus what cannot be a stored artifact. Under Zero Data
        Retention no artifact is written, so the extracted text is returned inline
        in `markdown`; otherwise read it from formats.markdown. A PDF or DOCX
        (QUARRY_EDGE__DOC_ROUTING=on) stores its original bytes as formats.raw and
        has no formats.html.
      allOf:
      - $ref: '#/components/schemas/NormalizedOutput'
      - type: object
        properties:
          markdown:
            type: string
            description: Inline text. Present when the markdown format was asked for, and by default under ZDR (nothing is stored). Capped at max_inline_bytes.
          html:
            type: string
            description: The document as fetched, when the html format was asked for. Not available for a PDF or DOCX.
          raw_html:
            type: string
            description: The document as fetched, when the rawHtml format was asked for.
          truncated:
            type: array
            items:
              type: string
            description: Inline fields cut at max_inline_bytes (ZDR only).
          omitted:
            type: array
            items:
              type: string
            description: Inline fields left out for exceeding max_inline_bytes (not ZDR); read the matching formats.* artifact.
          effective_options:
            type: object
            description: The options the response was produced with, including ignored_fields, cache_state (hit, miss, bypass), doc_routing and strict. With actions, `actions` is a summary (count, types, total_wait_ms, capture_count, on_error), never a selector or a typed text.
          warnings:
            type: array
            items:
              type: object
              required:
              - code
              - message
              properties:
                code:
                  type: string
                  description: e.g. unknown_field, document_has_no_text_layer, document_text_truncated, format_unavailable_for_documents
                message:
                  type: string
                field:
                  type: string
                  description: The request field a warning is about (unknown_field).
          screenshot:
            type: object
            nullable: true
            description: >-
              WS13.4b. The page screenshot, inline: content_type image/png or image/jpeg,
              bytes, width, height and the base64 data in data_base64. Under ZDR only,
              since nothing is stored to point at; otherwise read formats.screenshot.
          pdf:
            type: object
            nullable: true
            description: >-
              WS13.4b. The page PDF, inline: content_type application/pdf, bytes and
              data_base64. Under ZDR only; otherwise read formats.pdf.
          captures:
            type: object
            nullable: true
            description: >-
              What the captures measured, in both modes: the screenshot's content_type,
              width, height, bytes, tiles, stitched and truncated; the PDF's bytes; and
              blocked_requests. Counts and sizes only, never a URL. Absent when the
              request captured nothing.
          scrape_id:
            type: string
            nullable: true
            description: The stored record of this scrape, for GET /v1/scrape/{id}. Absent under ZDR and when records are off.
          actions:
            type: array
            description: >-
              The outcome of each scrape action, in order (WS13.5). Absent from the body when the request had no
              actions. GET /v1/scrape/{id} returns the same entries with artifact ids only: under ZDR no record is
              written, so the bytes stay inline in the response.
            items:
              $ref: '#/components/schemas/ScrapeActionOutcome'
    ScrapeActionOutcome:
      type: object
      required: [index, type, status, duration_ms]
      properties:
        index:
          type: integer
          minimum: 0
          description: Position of the action in the request's actions array.
        type:
          type: string
          description: The action's wire type.
        status:
          type: string
          enum: [ok, failed, skipped]
        duration_ms:
          type: integer
          minimum: 0
        error:
          type: object
          description: Present when the action failed.
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
        output:
          type: object
          description: >-
            A screenshot or pdf the action captured. Stored as an artifact (artifact_id) unless the run is under
            Zero Data Retention; under ZDR the bytes come inline (data_base64) within the shared inline cap. Neither
            field is set when the capture is over that cap.
          required: [kind, content_type, bytes]
          properties:
            kind:
              type: string
              enum: [screenshot, pdf]
            content_type:
              type: string
            bytes:
              type: integer
              minimum: 0
            width:
              type: integer
              minimum: 0
            height:
              type: integer
              minimum: 0
            artifact_id:
              type: string
              description: The stored artifact. Not set under ZDR.
            data_base64:
              type: string
              description: The inline bytes under ZDR, within the shared inline cap.
    Envelope_ScrapeResponse:
      type: object
      required:
      - request_id
      - success
      - data
      properties:
        request_id:
          type: string
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/ScrapeResponse'
    Envelope_HandoffAck:
      type: object
      required:
      - request_id
      - success
      - data
      properties:
        request_id:
          type: string
        success:
          type: boolean
          description: Always true for success envelopes
        data:
          $ref: '#/components/schemas/HandoffAck'
    Envelope_Error:
      type: object
      required:
      - request_id
      - success
      - error
      properties:
        request_id:
          type: string
        success:
          type: boolean
          description: Always false for error envelopes
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
tags:
- name: search
  description: Tavily-lineage web discovery
- name: agent
  description: Governed per-action browser-agent execution and proof
- name: scrape
  description: Single-page scrape operations
- name: crawl
  description: Multi-page crawl operations
- name: batch
  description: Batch scrape operations
- name: ops
  description: Health and readiness probes
- name: resources
  description: Durable org resources — artifacts, sources, snapshots, jobs, queues, run history
- name: team
  description: Per-org usage, concurrency, queue, and activity aggregates
- name: change-tracking
  description: Versioned URL change tracking — baselines, checks, promotion, refresh
- name: schedules
  description: Cron / one-shot / change-monitor schedules
