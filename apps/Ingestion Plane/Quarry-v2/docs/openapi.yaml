openapi: "3.1.0"
info:
  title: Quarry v2 API
  version: 0.1.0
  description: Evidence engine — fetch, render, transform, fingerprint, diff.
  contact:
    name: Triodelab Engineering
    email: eng@triodelab.com
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://quarry.triodelab.com
    description: Production

paths:
  /health:
    get:
      operationId: health
      summary: Liveness probe
      tags: [ops]
      responses:
        "200":
          description: Service is alive
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /ready:
    get:
      operationId: ready
      summary: Readiness probe
      tags: [ops]
      responses:
        "200":
          description: Service is ready to accept traffic
          content:
            text/plain:
              schema:
                type: string
                example: ready

  /v1/scrape:
    post:
      operationId: scrape
      summary: Scrape a single URL
      description: |
        Fetches a URL, runs the transform pipeline (readability, markdown, links,
        metadata, fingerprint, diff), stores artifacts, and returns a normalized
        output envelope. Optionally forwards results to the Data Plane for ingestion.
      tags: [scrape]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScrapeRequest"
      responses:
        "200":
          description: Successful scrape
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_NormalizedOutput"
        "400":
          description: Invalid request (bad URL, missing fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Error"
        "403":
          description: Security blocked (SSRF, blocklist, policy)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Error"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Error"
        "502":
          description: Upstream fetch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Error"

  /v1/scrape/stream:
    post:
      operationId: scrapeStream
      summary: Scrape with SSE event stream
      description: |
        Same as /v1/scrape but returns a Server-Sent Event stream with
        per-step events (page_fetched, change_detected, artifact_written, etc.)
        followed by the final result or error.
      tags: [scrape]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScrapeRequest"
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events stream

  /v1/crawl:
    post:
      operationId: crawlHandoff
      summary: Start a crawl job
      description: |
        Hands off a crawl request to the orchestrator for BFS execution.
        Returns a job ID for tracking progress.
      tags: [crawl]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrawlRequest"
      responses:
        "200":
          description: Crawl job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_HandoffAck"
        "502":
          description: Orchestrator unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Error"

  /v1/batch:
    post:
      operationId: batchHandoff
      summary: Start a batch scrape job
      description: |
        Hands off multiple URLs to the orchestrator for parallel execution.
        Returns a job ID for tracking progress.
      tags: [batch]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchRequest"
      responses:
        "200":
          description: Batch job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_HandoffAck"
        "502":
          description: Orchestrator unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Error"

  /v1/internal/run_page:
    post:
      operationId: internalRunPage
      summary: Internal page execution (orchestrator → edge)
      description: |
        Called by orchestrator activities to execute a single page.
        Not exposed publicly in production.
      tags: [internal]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalRunPage"
      responses:
        "200":
          description: Page execution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalRunPageResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Error"

  /v1/search:
    post:
      operationId: search
      summary: SERP + own-corpus search (hybrid when Data Plane wired)
      description: |
        Provider-agnostic search across the local Tantivy corpus, SERP
        backends, and — when a Data Plane is configured — semantic vectors
        fused via RRF. Tavily-style params: topic, time_range/days,
        exact_match, chunks_per_source, include_answer, format=context,
        highlight, facets.
      tags: [search]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Ranked results (plus optional answer/context/facets)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "429":
          description: Rate limited (structured retry envelope)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitError"
        "501":
          description: No search backend configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /v1/agent/runs:
    post:
      operationId: startAgentRun
      summary: Acquire a governed browser-agent run
      description: |
        Creates a tenant-owned browser lease. BrowserBroker grants are
        revalidated at run start and before every action; non-ZDR runs receive
        a durable continuation checkpoint.
      tags: [agent]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartAgentRunRequest"
      responses:
        "200":
          description: Browser run acquired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_StartAgentRun"
        "400":
          description: Invalid constraints or persistence request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Error"
        "403":
          description: Missing or invalid BrowserBroker grant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Error"

  /v1/agent/runs/{run_id}/step:
    post:
      operationId: agentStep
      summary: Execute one governed browser action
      tags: [agent]
      parameters:
        - $ref: "#/components/parameters/AgentRunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentStepRequest"
      responses:
        "200":
          description: Observation and immutable outcome proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_BrowserObservation"
        "403":
          description: Domain, SSRF, policy, or grant denial
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Error"
        "409":
          description: Snapshot target is stale, absent, ambiguous, or changed; re-observe before acting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Error"
        "429":
          description: Step budget exhausted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Error"

  /v1/agent/runs/{run_id}/interact:
    post:
      operationId: agentInteract
      summary: Ergonomic alias for one governed browser action
      tags: [agent]
      parameters:
        - $ref: "#/components/parameters/AgentRunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentStepRequest"
      responses:
        "200":
          description: Observation and immutable outcome proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_BrowserObservation"
        "403":
          description: Domain, SSRF, policy, or grant denial
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Error"
        "409":
          description: Snapshot target is stale, absent, ambiguous, or changed; re-observe before acting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Error"

  /v1/agent/runs/{run_id}/receipts:
    get:
      operationId: listAgentReceipts
      summary: Read tenant-scoped immutable action receipts
      tags: [agent]
      parameters:
        - $ref: "#/components/parameters/AgentRunId"
      responses:
        "200":
          description: Ordered action receipt stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_StepReceipts"
        "404":
          description: Run or receipt stream not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Error"

  /v1/agent/runs/{run_id}/egress-receipts:
    get:
      operationId: listAgentEgressReceipts
      summary: Read redacted live browser egress decisions
      description: >-
        Returns bounded, driver-authored policy receipts for the live session.
        URLs contain only origin and path; query strings, headers, bodies,
        credentials, resolved IP addresses, and proxy details are omitted.
      tags: [agent]
      parameters:
        - $ref: "#/components/parameters/AgentRunId"
        - name: after_sequence
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 512, default: 100 }
      responses:
        "200":
          description: Ordered, redacted egress decisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_EgressReceipts"
        "404":
          description: Run not found or not owned by the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Error"
        "409":
          description: Requested receipt cursor is no longer continuous in the bounded proof buffer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Error"

  /v1/agent/runs/{run_id}/procedure:
    post:
      operationId: compileAgentProcedure
      summary: Compile verified receipts into a replay candidate
      tags: [agent]
      parameters:
        - $ref: "#/components/parameters/AgentRunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompileProcedureRequest"
      responses:
        "200":
          description: Deterministic procedure candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_BrowserProcedure"
        "409":
          description: Receipt stream contains unverified or incomplete effects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Error"

  /v1/agent/procedures/replay-check:
    post:
      operationId: checkAgentProcedureReplay
      summary: Compare actions with a procedure without executing effects
      tags: [agent]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayCheckRequest"
      responses:
        "200":
          description: Exact, repair-required, or refused decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_ReplayDecision"

  /v1/agent/procedures/quality-check:
    post:
      operationId: qualityCheckAgentProcedure
      summary: Evaluate deterministic procedure promotion evidence
      tags: [agent]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserProcedure"
      responses:
        "200":
          description: Quality report; does not change rollout state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_ProcedureQuality"

  /v1/agent/procedures/impact-check:
    post:
      operationId: impactCheckAgentProcedure
      summary: Identify changed sources that require procedure quarantine
      tags: [agent]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcedureImpactRequest"
      responses:
        "200":
          description: Conservative change-impact report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_ProcedureImpact"

  /v1/agent/runs/{run_id}:
    delete:
      operationId: closeAgentRun
      summary: Close a browser-agent run and release its lease
      tags: [agent]
      parameters:
        - $ref: "#/components/parameters/AgentRunId"
      responses:
        "200":
          description: Run closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_ClosedRun"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Error"

  /v1/map:
    post:
      operationId: map
      summary: Whole-site URL discovery
      description: |
        Fast site map from sitemap.xml + robots + on-page links, optionally
        relevance-ranked by `search`. Read-only, org-scoped, SSRF-guarded.
      tags: [map]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MapRequest"
      responses:
        "200":
          description: Discovered URLs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapResponse"
        "502":
          description: Origin returned no sitemap or links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /v1/extract:
    post:
      operationId: extract
      summary: Multi-URL structured extraction
      description: |
        Fetch a bounded set of URLs and return structured data per source
        (JSON-Schema-guided via Model Plane) or cleaned markdown. Per-source
        isolation — one failure never sinks the batch.
      tags: [extract]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractRequest"
      responses:
        "200":
          description: Per-source extraction results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractResponse"
        "400":
          description: No valid URLs in request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "501":
          description: Structured extraction requires a Model Plane
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

components:
  parameters:
    AgentRunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
      description: Tenant-owned Quarry run identifier
  schemas:
    StartAgentRunRequest:
      type: object
      properties:
        constraints:
          $ref: "#/components/schemas/AgentConstraints"
        profile_id: { type: string, nullable: true }
        persist_profile: { type: boolean, default: false }
        viewport:
          type: object
          nullable: true
          properties:
            width: { type: integer }
            height: { type: integer }
            device_scale_factor: { type: number }
            is_mobile: { type: boolean }
        zdr: { type: boolean, default: false }
        grant_id: { type: string, nullable: true }
        resume_run_id: { type: string, nullable: true }
        execution_tier:
          type: string
          enum: [chromium, ephemeral_evidence]
          default: chromium
          description: >-
            Experimental ephemeral_evidence forces a disposable no-profile,
            no-resume, no-durable-state run and remains gated by isolated
            egress/security proof. Its current explicit engine is Chromium
            fallback, not a claim of a production Lite renderer.
        driver_requirements:
          $ref: "#/components/schemas/BrowserDriverCapabilities"
    BrowserDriverCapabilities:
      type: object
      description: >-
        Requested or selected execution capabilities. Every true value is an
        affirmative provider claim; omitted values are not inferred. Agent
        runs always require isolated_egress and security_evidence regardless
        of optional requirements.
      properties:
        persistent_profile: { type: boolean, default: false }
        devtools_trace: { type: boolean, default: false }
        downloads_to_artifacts: { type: boolean, default: false }
        uploads_from_artifacts: { type: boolean, default: false }
        full_visual_fidelity: { type: boolean, default: false }
        isolated_egress: { type: boolean, default: false }
        security_evidence: { type: boolean, default: false }
        atomic_target_actions: { type: boolean, default: false }
    AgentConstraints:
      type: object
      required: [max_steps]
      properties:
        max_steps: { type: integer, minimum: 0 }
        allowed_domains:
          type: array
          items: { type: string }
        max_runtime_s: { type: integer, nullable: true }
        max_cost_usd: { type: number, nullable: true }
    Envelope_StartAgentRun:
      type: object
      required: [request_id, success, data]
      properties:
        request_id: { type: string }
        success: { type: boolean }
        data:
          type: object
          required: [run_id, lease_id, profile_id, driver_capabilities, execution_tier, execution_engine]
          properties:
            run_id: { type: string }
            lease_id: { type: string }
            profile_id: { type: string }
            driver_capabilities:
              $ref: "#/components/schemas/BrowserDriverCapabilities"
            execution_tier:
              type: string
              enum: [chromium, ephemeral_evidence]
            execution_engine:
              type: string
              enum: [chromium, chromium_fallback]
    AgentStepRequest:
      type: object
      required: [action]
      properties:
        action:
          $ref: "#/components/schemas/AgentAction"
        instruction: { type: string, nullable: true }
        extraction_profile:
          type: object
          nullable: true
          additionalProperties: true
    Envelope_BrowserObservation:
      type: object
      required: [request_id, success, data]
      properties:
        request_id: { type: string }
        success: { type: boolean }
        data:
          $ref: "#/components/schemas/BrowserObservation"
    BrowserObservation:
      type: object
      required: [run_id, step, url, action_outcome, observed_at]
      properties:
        run_id: { type: string }
        step: { type: integer }
        url: { type: string, format: uri }
        title: { type: string, nullable: true }
        snapshot:
          $ref: "#/components/schemas/BrowserSnapshot"
        dom_summary: { type: object, nullable: true, additionalProperties: true }
        screenshot_artifact_id: { type: string, nullable: true }
        visual_observation_artifact_id: { type: string, nullable: true }
        evidence_delta_artifact_id: { type: string, nullable: true }
        console_summary: { type: array, items: { type: object, additionalProperties: true } }
        network_summary: { type: array, items: { type: object, additionalProperties: true } }
        egress_receipts:
          type: array
          description: >-
            Redacted request-policy decisions. URLs contain origin and path only;
            query strings, headers, bodies, credentials, and resolved IPs are omitted.
          items:
            $ref: "#/components/schemas/BrowserEgressReceipt"
        dialogs:
          type: array
          description: >-
            Open JavaScript dialogs. Quarry never resolves them implicitly;
            respond_dialog requires an explicit live browser grant.
          items:
            $ref: "#/components/schemas/BrowserDialog"
        policy_denials: { type: array, items: { type: string } }
        action_outcome:
          $ref: "#/components/schemas/ActionOutcome"
        observation_delta:
          $ref: "#/components/schemas/ObservationDelta"
        challenge: { type: object, nullable: true, additionalProperties: true }
        extraction_profile: { type: object, nullable: true, additionalProperties: true }
        extraction_result: { type: object, nullable: true, additionalProperties: true }
        proof_bundle: { type: object, nullable: true, additionalProperties: true }
        target_resolution: { type: object, nullable: true, additionalProperties: true }
        telemetry:
          $ref: "#/components/schemas/BrowserTelemetry"
        observed_at: { type: string, format: date-time }
    BrowserTelemetry:
      type: object
      required:
        [startup_mode, usable_observation_latency_ms, estimated_snapshot_tokens,
         observed_action_count, challenge_observation_count, challenge_rate_per_mille]
      description: >-
        Measured browser execution facts. renderer_* values are renderer-scoped
        CDP metrics, not host-wide process usage. Missing cost/resource values
        mean no provider-authoritative meter was available.
      properties:
        startup_mode: { type: string, enum: [cold, warm, unknown] }
        startup_latency_ms: { type: integer, minimum: 0, nullable: true }
        usable_observation_latency_ms: { type: integer, minimum: 0 }
        renderer_task_cpu_ms: { type: integer, minimum: 0, nullable: true }
        renderer_js_heap_used_bytes: { type: integer, minimum: 0, nullable: true }
        estimated_snapshot_tokens: { type: integer, minimum: 0 }
        observed_action_count: { type: integer, minimum: 0 }
        challenge_observation_count: { type: integer, minimum: 0 }
        challenge_rate_per_mille: { type: integer, minimum: 0, maximum: 1000 }
        verified_action_cost_micro_usd: { type: integer, minimum: 0, nullable: true }
    BrowserEgressReceipt:
      type: object
      required: [sequence, method, url, decision, policy, timestamp_ms]
      properties:
        sequence: { type: integer, minimum: 1 }
        tab_id: { type: string, nullable: true }
        method: { type: string, example: GET }
        url: { type: string, example: "https://example.com/path" }
        decision: { type: string, enum: [allow, block] }
        policy:
          type: string
          enum:
            - url_dns_public
            - url_or_dns_blocked
            - domain_grant_blocked
            - dns_or_ssrf_blocked
            - pinned_connect_failed
            - dns_pinned_proxy
        timestamp_ms: { type: integer, minimum: 0 }
    Envelope_EgressReceipts:
      type: object
      required: [request_id, success, data]
      properties:
        request_id: { type: string }
        success: { type: boolean }
        data:
          type: object
          required: [receipts, zdr]
          properties:
            receipts:
              type: array
              items: { $ref: "#/components/schemas/BrowserEgressReceipt" }
            zdr: { type: boolean }
    BrowserDialog:
      type: object
      required: [dialog_id, kind, message, opened_at_ms]
      properties:
        dialog_id: { type: string }
        frame_id: { type: string, nullable: true }
        kind: { type: string, enum: [alert, confirm, prompt, beforeunload] }
        message: { type: string }
        default_prompt: { type: string, nullable: true }
        origin: { type: string, nullable: true }
        opened_at_ms: { type: integer, minimum: 0 }
    AgentAction:
      type: object
      required: [type]
      discriminator:
        propertyName: type
      oneOf:
        - $ref: "#/components/schemas/LegacyAgentAction"
        - $ref: "#/components/schemas/SnapshotRefAction"
        - $ref: "#/components/schemas/FrameSnapshotRefAction"
        - $ref: "#/components/schemas/SemanticTargetAction"
        - $ref: "#/components/schemas/DialogResponseAction"
        - $ref: "#/components/schemas/UploadRefAction"
        - $ref: "#/components/schemas/DownloadRefAction"
      additionalProperties: true
      description: >-
        Tagged action. Existing CSS selector actions remain supported. Snapshot
        actions (`*_ref` and `*_semantic`) must include the exact snapshot_id
        and generation from BrowserObservation.snapshot; stale, missing, or
        ambiguous targets return TARGET_REPAIR_REQUIRED (409).
    LegacyAgentAction:
      type: object
      oneOf:
        - $ref: "#/components/schemas/NavigateAction"
        - $ref: "#/components/schemas/ClickAction"
        - $ref: "#/components/schemas/ClickPointAction"
        - $ref: "#/components/schemas/TypeAction"
        - $ref: "#/components/schemas/PressAction"
        - $ref: "#/components/schemas/ScrollAction"
        - $ref: "#/components/schemas/MouseWheelAction"
        - $ref: "#/components/schemas/SelectAction"
        - $ref: "#/components/schemas/WaitAction"
        - $ref: "#/components/schemas/WaitForAction"
        - $ref: "#/components/schemas/ScreenshotAction"
        - $ref: "#/components/schemas/PdfAction"
        - $ref: "#/components/schemas/EvaluateAction"
        - $ref: "#/components/schemas/BackAction"
        - $ref: "#/components/schemas/ForwardAction"
        - $ref: "#/components/schemas/GetContentAction"
    NavigateAction:
      type: object
      required: [type, url]
      properties:
        type: { const: navigate }
        url: { type: string, format: uri }
    ClickAction:
      type: object
      required: [type, selector]
      properties:
        type: { const: click }
        selector: { type: string }
    ClickPointAction:
      type: object
      required: [type, x, y]
      properties:
        type: { const: click_point }
        x: { type: number }
        y: { type: number }
    TypeAction:
      type: object
      required: [type, selector, text]
      properties:
        type: { const: type }
        selector: { type: string }
        text: { type: string }
    PressAction:
      type: object
      required: [type, key]
      properties:
        type: { const: press }
        key: { type: string }
    ScrollAction:
      type: object
      required: [type, target]
      properties:
        type: { const: scroll }
        target: { type: string }
    MouseWheelAction:
      type: object
      required: [type, x, y, delta_x, delta_y]
      properties:
        type: { const: mouse_wheel }
        x: { type: number }
        y: { type: number }
        delta_x: { type: number }
        delta_y: { type: number }
    SelectAction:
      type: object
      required: [type, selector, value]
      properties:
        type: { const: select }
        selector: { type: string }
        value: { type: string }
    WaitAction:
      type: object
      required: [type, ms]
      properties:
        type: { const: wait }
        ms: { type: integer, minimum: 0 }
    WaitForAction:
      type: object
      required: [type, selector, timeout_ms]
      properties:
        type: { const: wait_for }
        selector: { type: string }
        timeout_ms: { type: integer, minimum: 0 }
    ScreenshotAction:
      type: object
      required: [type, full_page]
      properties:
        type: { const: screenshot }
        full_page: { type: boolean }
    PdfAction:
      type: object
      required: [type]
      properties:
        type: { const: pdf }
    EvaluateAction:
      type: object
      required: [type, script]
      properties:
        type: { const: evaluate }
        script: { type: string }
    BackAction:
      type: object
      required: [type]
      properties:
        type: { const: back }
    ForwardAction:
      type: object
      required: [type]
      properties:
        type: { const: forward }
    GetContentAction:
      type: object
      required: [type]
      properties:
        type: { const: get_content }
    SnapshotRefAction:
      type: object
      oneOf:
        - $ref: "#/components/schemas/ClickRefAction"
        - $ref: "#/components/schemas/TypeRefAction"
        - $ref: "#/components/schemas/SelectRefAction"
        - $ref: "#/components/schemas/WaitForRefAction"
    FrameSnapshotRefAction:
      type: object
      description: >-
        Child-frame action. frame_id must exactly match the observed target's
        opaque frame id; ordinary snapshot refs cannot act across a frame.
      oneOf:
        - $ref: "#/components/schemas/FrameClickRefAction"
        - $ref: "#/components/schemas/FrameTypeRefAction"
        - $ref: "#/components/schemas/FrameSelectRefAction"
        - $ref: "#/components/schemas/FrameWaitForRefAction"
        - $ref: "#/components/schemas/FrameUploadRefAction"
        - $ref: "#/components/schemas/FrameDownloadRefAction"
    SemanticTargetAction:
      type: object
      oneOf:
        - $ref: "#/components/schemas/ClickSemanticAction"
        - $ref: "#/components/schemas/TypeSemanticAction"
        - $ref: "#/components/schemas/SelectSemanticAction"
        - $ref: "#/components/schemas/WaitForSemanticAction"
    DialogResponseAction:
      type: object
      required: [type, dialog_id, accept, approval_grant_id]
      properties:
        type: { const: respond_dialog }
        dialog_id: { type: string }
        accept: { type: boolean }
        approval_grant_id:
          type: string
          description: >-
            Fresh active BrowserBroker approval grant. Quarry rejects replay
            within this live run. It must authorize only respond_dialog and
            the exact observed dialog plus its frame, when framed.
        prompt_text: { type: string, nullable: true }
    UploadRefAction:
      type: object
      required: [type, snapshot_id, generation, ref_id, artifact_id, approval_grant_id]
      properties:
        type: { const: upload_ref }
        snapshot_id: { type: string }
        generation: { type: integer, minimum: 0 }
        ref_id: { type: string, example: "@e1" }
        artifact_id:
          type: string
          description: Tenant-owned Quarry artifact identifier; host paths and URLs are not accepted.
        approval_grant_id:
          type: string
          description: >-
            Fresh single-use BrowserBroker approval authorizing only upload_ref,
            this exact artifact, and the observed target frame when framed.
    DownloadRefAction:
      type: object
      required: [type, snapshot_id, generation, ref_id, approval_grant_id]
      properties:
        type: { const: download_ref }
        snapshot_id: { type: string }
        generation: { type: integer, minimum: 0 }
        ref_id: { type: string, example: "@e1" }
        approval_grant_id:
          type: string
          description: >-
            Fresh single-use BrowserBroker approval authorizing only download_ref
            and the observed target frame when framed. Quarry stores only an
            admitted tenant-owned artifact; local download paths are never exposed.
    SnapshotTargetBase:
      type: object
      required: [snapshot_id, generation]
      properties:
        snapshot_id: { type: string }
        generation: { type: integer, minimum: 0 }
    FrameSnapshotTargetBase:
      type: object
      required: [snapshot_id, generation, frame_id]
      properties:
        snapshot_id: { type: string }
        generation: { type: integer, minimum: 0 }
        frame_id:
          type: string
          description: Opaque child-frame id from the current snapshot.
    ClickRefAction:
      allOf:
        - $ref: "#/components/schemas/SnapshotTargetBase"
        - type: object
          required: [type, ref_id]
          properties:
            type: { const: click_ref }
            ref_id: { type: string, example: "@e1" }
    TypeRefAction:
      allOf:
        - $ref: "#/components/schemas/SnapshotTargetBase"
        - type: object
          required: [type, ref_id, text]
          properties:
            type: { const: type_ref }
            ref_id: { type: string, example: "@e1" }
            text: { type: string }
    SelectRefAction:
      allOf:
        - $ref: "#/components/schemas/SnapshotTargetBase"
        - type: object
          required: [type, ref_id, value]
          properties:
            type: { const: select_ref }
            ref_id: { type: string, example: "@e1" }
            value: { type: string }
    WaitForRefAction:
      allOf:
        - $ref: "#/components/schemas/SnapshotTargetBase"
        - type: object
          required: [type, ref_id, timeout_ms]
          properties:
            type: { const: wait_for_ref }
            ref_id: { type: string, example: "@e1" }
            timeout_ms: { type: integer, minimum: 0 }
    FrameClickRefAction:
      allOf:
        - $ref: "#/components/schemas/FrameSnapshotTargetBase"
        - type: object
          required: [type, ref_id]
          properties:
            type: { const: frame_click_ref }
            ref_id: { type: string, example: "@e1" }
    FrameTypeRefAction:
      allOf:
        - $ref: "#/components/schemas/FrameSnapshotTargetBase"
        - type: object
          required: [type, ref_id, text]
          properties:
            type: { const: frame_type_ref }
            ref_id: { type: string, example: "@e1" }
            text: { type: string }
    FrameSelectRefAction:
      allOf:
        - $ref: "#/components/schemas/FrameSnapshotTargetBase"
        - type: object
          required: [type, ref_id, value]
          properties:
            type: { const: frame_select_ref }
            ref_id: { type: string, example: "@e1" }
            value: { type: string }
    FrameWaitForRefAction:
      allOf:
        - $ref: "#/components/schemas/FrameSnapshotTargetBase"
        - type: object
          required: [type, ref_id, timeout_ms]
          properties:
            type: { const: frame_wait_for_ref }
            ref_id: { type: string, example: "@e1" }
            timeout_ms: { type: integer, minimum: 1 }
    FrameUploadRefAction:
      allOf:
        - $ref: "#/components/schemas/FrameSnapshotTargetBase"
        - type: object
          required: [type, ref_id, artifact_id, approval_grant_id]
          properties:
            type: { const: frame_upload_ref }
            ref_id: { type: string, example: "@e1" }
            artifact_id:
              type: string
              description: Tenant-owned Quarry artifact identifier; host paths and URLs are not accepted.
            approval_grant_id:
              type: string
              description: Fresh single-use BrowserBroker approval for this exact child-frame upload.
    FrameDownloadRefAction:
      allOf:
        - $ref: "#/components/schemas/FrameSnapshotTargetBase"
        - type: object
          required: [type, ref_id, approval_grant_id]
          properties:
            type: { const: frame_download_ref }
            ref_id: { type: string, example: "@e1" }
            approval_grant_id:
              type: string
              description: Fresh single-use BrowserBroker approval for this exact child-frame download.
    ClickSemanticAction:
      allOf:
        - $ref: "#/components/schemas/SnapshotTargetBase"
        - type: object
          required: [type, locator]
          properties:
            type: { const: click_semantic }
            locator: { $ref: "#/components/schemas/SemanticLocator" }
    TypeSemanticAction:
      allOf:
        - $ref: "#/components/schemas/SnapshotTargetBase"
        - type: object
          required: [type, locator, text]
          properties:
            type: { const: type_semantic }
            locator: { $ref: "#/components/schemas/SemanticLocator" }
            text: { type: string }
    SelectSemanticAction:
      allOf:
        - $ref: "#/components/schemas/SnapshotTargetBase"
        - type: object
          required: [type, locator, value]
          properties:
            type: { const: select_semantic }
            locator: { $ref: "#/components/schemas/SemanticLocator" }
            value: { type: string }
    WaitForSemanticAction:
      allOf:
        - $ref: "#/components/schemas/SnapshotTargetBase"
        - type: object
          required: [type, locator, timeout_ms]
          properties:
            type: { const: wait_for_semantic }
            locator: { $ref: "#/components/schemas/SemanticLocator" }
            timeout_ms: { type: integer, minimum: 0 }
    SemanticLocator:
      type: object
      oneOf:
        - $ref: "#/components/schemas/RoleLocator"
        - $ref: "#/components/schemas/TextLocator"
        - $ref: "#/components/schemas/LabelLocator"
        - $ref: "#/components/schemas/PlaceholderLocator"
        - $ref: "#/components/schemas/TestIdLocator"
        - $ref: "#/components/schemas/NthLocator"
    RoleLocator:
      type: object
      required: [kind, role]
      properties:
        kind: { const: role }
        role: { type: string }
        name: { type: string }
        exact: { type: boolean, default: false }
    TextLocator:
      type: object
      required: [kind, text]
      properties:
        kind: { const: text }
        text: { type: string }
        exact: { type: boolean, default: false }
    LabelLocator:
      type: object
      required: [kind, label]
      properties:
        kind: { const: label }
        label: { type: string }
        exact: { type: boolean, default: false }
    PlaceholderLocator:
      type: object
      required: [kind, placeholder]
      properties:
        kind: { const: placeholder }
        placeholder: { type: string }
        exact: { type: boolean, default: false }
    TestIdLocator:
      type: object
      required: [kind, test_id]
      properties:
        kind: { const: test_id }
        test_id: { type: string }
        exact: { type: boolean, default: false }
    NthLocator:
      type: object
      required: [kind, selector, index]
      properties:
        kind: { const: nth }
        selector: { type: string, description: Tag or ARIA role from the active snapshot. }
        index: { type: integer, minimum: 0 }
    BrowserSnapshot:
      type: object
      required: [snapshot_id, generation, targets]
      properties:
        snapshot_id: { type: string }
        generation: { type: integer, minimum: 0 }
        targets:
          type: array
          items: { $ref: "#/components/schemas/SnapshotTarget" }
        accessibility:
          $ref: "#/components/schemas/AccessibilityProjection"
        frames:
          type: array
          items: { $ref: "#/components/schemas/BrowserFrame" }
    AccessibilityProjection:
      type: object
      required: [source, nodes, truncated]
      properties:
        source: { type: string, example: chromium_cdp_ax }
        truncated: { type: boolean }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/AccessibilityNode" }
    AccessibilityNode:
      type: object
      required: [node_id, ignored, child_ids]
      properties:
        node_id: { type: string }
        role: { type: string, nullable: true }
        name: { type: string, nullable: true }
        value: { type: string, nullable: true }
        ignored: { type: boolean }
        frame_id: { type: string, nullable: true }
        child_ids: { type: array, items: { type: string } }
    BrowserFrame:
      type: object
      required: [frame_id, child_frame_ids]
      properties:
        frame_id: { type: string }
        parent_frame_id: { type: string, nullable: true }
        origin:
          type: string
          nullable: true
          description: Security origin only; no frame URL or query string is exposed.
        name: { type: string, nullable: true }
        child_frame_ids: { type: array, items: { type: string } }
    SnapshotTarget:
      type: object
      required: [ref_id, tag]
      properties:
        ref_id: { type: string, example: "@e1" }
        tag: { type: string }
        text: { type: string, nullable: true }
        role: { type: string, nullable: true }
        name: { type: string, nullable: true }
        placeholder: { type: string, nullable: true }
        test_id: { type: string, nullable: true }
        frame_id:
          type: string
          nullable: true
          description: >-
            Opaque observed owner frame. A non-root target is executable only
            through the matching frame_*_ref action with this exact id.
        fingerprint:
          $ref: "#/components/schemas/ElementFingerprint"
    ElementFingerprint:
      type: object
      required: [fingerprint_id, tag, normalized_text, attributes, structural_path]
      description: >-
        Read-only observed target identity used for repair and proof. It is
        not an executable selector and must never be sent as a raw action target.
      properties:
        fingerprint_id: { type: string }
        tag: { type: string }
        normalized_text: { type: string }
        attributes:
          type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: string }
        structural_path: { type: string }
        logical_id: { type: string, nullable: true }
    ActionOutcome:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [verified, failed, unknown] }
        reason_code: { type: string, nullable: true }
        detail: { type: string, nullable: true }
    ObservationDelta:
      type: object
      required: [changed_fields, url_changed, title_changed, dom_changed, content_changed]
      properties:
        changed_fields: { type: array, items: { type: string } }
        url_changed: { type: boolean }
        title_changed: { type: boolean }
        dom_changed: { type: boolean }
        content_changed: { type: boolean }
    EvidenceDelta:
      type: object
      required: [version, step, dom, network]
      description: Bounded DOM, visual, and redacted-network evidence stored in an artifact.
      properties:
        version: { type: integer }
        step: { type: integer }
        dom:
          type: object
          required: [changed, snapshot_target_count]
          properties:
            previous_node_count: { type: integer, nullable: true }
            current_node_count: { type: integer, nullable: true }
            changed: { type: boolean }
            snapshot_target_count: { type: integer }
        network:
          type: object
          required: [added, removed, current_count]
          properties:
            added: { type: array, items: { type: string } }
            removed: { type: array, items: { type: string } }
            current_count: { type: integer }
        visual_observation_artifact_id: { type: string, nullable: true }
    Envelope_StepReceipts:
      type: object
      required: [request_id, success, data]
      properties:
        request_id: { type: string }
        success: { type: boolean }
        data:
          type: array
          items:
            $ref: "#/components/schemas/StepReceipt"
    StepReceipt:
      type: object
      required: [receipt_id, run_id, step, started_at, finished_at, action, outcome, cost_micro_usd]
      properties:
        org_id: { type: string, nullable: true }
        receipt_id: { type: string }
        run_id: { type: string }
        step: { type: integer }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        action: { type: object, additionalProperties: true }
        outcome: { type: object, additionalProperties: true }
        observation: { $ref: "#/components/schemas/BrowserObservation" }
        correction_of: { type: string, nullable: true }
        cost_micro_usd: { type: integer, format: int64 }
    CompileProcedureRequest:
      type: object
      properties:
        procedure_id: { type: string, nullable: true }
    BrowserProcedure:
      type: object
      required: [procedure_id, version, source_receipt_ids, steps]
      properties:
        procedure_id: { type: string }
        version: { type: integer }
        source_receipt_ids: { type: array, items: { type: string } }
        steps:
          type: array
          items:
            type: object
            required: [step, action, expected_outcome]
            properties:
              step: { type: integer }
              action: { type: object, additionalProperties: true }
              expected_outcome: { type: string, enum: [verified, failed, unknown] }
    Envelope_BrowserProcedure:
      type: object
      required: [request_id, success, data]
      properties:
        request_id: { type: string }
        success: { type: boolean }
        data: { $ref: "#/components/schemas/BrowserProcedure" }
    ReplayCheckRequest:
      type: object
      required: [procedure]
      properties:
        procedure: { $ref: "#/components/schemas/BrowserProcedure" }
        actions: { type: array, items: { type: object, additionalProperties: true } }
    Envelope_ReplayDecision:
      type: object
      required: [request_id, success, data]
      properties:
        request_id: { type: string }
        success: { type: boolean }
        data: { type: object, additionalProperties: true }
    ProcedureImpactRequest:
      type: object
      required: [procedure]
      properties:
        procedure: { $ref: "#/components/schemas/BrowserProcedure" }
        changed_urls: { type: array, items: { type: string, format: uri } }
    Envelope_ProcedureQuality:
      type: object
      required: [request_id, success, data]
      properties:
        request_id: { type: string }
        success: { type: boolean }
        data: { type: object, additionalProperties: true }
    Envelope_ProcedureImpact:
      type: object
      required: [request_id, success, data]
      properties:
        request_id: { type: string }
        success: { type: boolean }
        data: { type: object, additionalProperties: true }
    Envelope_ClosedRun:
      type: object
      required: [request_id, success, data]
      properties:
        request_id: { type: string }
        success: { type: boolean }
        data:
          type: object
          required: [closed]
          properties:
            closed: { type: boolean }
    SearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        limit: { type: integer, format: int32, nullable: true }
        country: { type: string, nullable: true }
        language: { type: string, nullable: true }
        safe_search: { type: boolean, default: true }
        topic: { type: string, nullable: true, description: "general | news | finance" }
        time_range: { type: string, nullable: true, description: "day | week | month | year" }
        days: { type: integer, format: int32, nullable: true }
        exact_match: { type: boolean, default: false }
        chunks_per_source: { type: integer, format: int32, nullable: true }
        include_answer: { type: boolean, default: false }
        format: { type: string, nullable: true, description: "results | context" }
        highlight: { type: boolean, default: false }
        facets: { type: boolean, default: false }
    SearchResultItem:
      type: object
      required: [url, rank, provider]
      properties:
        url: { type: string }
        title: { type: string, nullable: true }
        snippet: { type: string, nullable: true }
        rank: { type: integer, format: int32 }
        provider: { type: string }
    FacetCount:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count: { type: integer }
    SearchResponse:
      type: object
      required: [query, provider, results, count]
      properties:
        query: { type: string }
        provider: { type: string }
        results:
          type: array
          items: { $ref: "#/components/schemas/SearchResultItem" }
        count: { type: integer }
        answer: { type: string, nullable: true }
        citations:
          type: array
          nullable: true
          items: { type: object }
        context: { type: string, nullable: true }
        facets:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/FacetCount" }
    MapRequest:
      type: object
      required: [url]
      properties:
        url: { type: string }
        search: { type: string, nullable: true }
        limit: { type: integer, format: int32, nullable: true }
        include_subdomains: { type: boolean, default: false }
    MapLink:
      type: object
      required: [url]
      properties:
        url: { type: string }
        title: { type: string, nullable: true }
        score: { type: number, format: float, nullable: true }
    MapResponse:
      type: object
      required: [url, links, count, ranked]
      properties:
        url: { type: string }
        links:
          type: array
          items: { $ref: "#/components/schemas/MapLink" }
        count: { type: integer }
        ranked: { type: boolean }
    ExtractRequest:
      type: object
      required: [urls]
      properties:
        urls:
          type: array
          items: { type: string }
        schema: { type: object, nullable: true, description: "JSON Schema for structured output" }
        prompt: { type: string, nullable: true }
        max_urls: { type: integer, format: int32, nullable: true }
    ExtractItem:
      type: object
      required: [url, status]
      properties:
        url: { type: string }
        status: { type: string, description: "ok | fetched | error" }
        data: { type: object, nullable: true }
        markdown: { type: string, nullable: true }
        error: { type: string, nullable: true }
    ExtractResponse:
      type: object
      required: [results, count, requested]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/ExtractItem" }
        count: { type: integer }
        requested: { type: integer }
    ErrorBody:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string }
        hint: { type: string, nullable: true }
    RateLimitError:
      allOf:
        - $ref: "#/components/schemas/ErrorBody"
        - type: object
          properties:
            window: { type: string, nullable: true }
            retry_after_seconds: { type: integer, nullable: true }
            next_actions:
              type: array
              items: { type: string }
    ScrapeRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: URL to scrape
          example: https://example.com/article
        prev_fingerprint:
          type: string
          nullable: true
          description: Previous blake3 fingerprint for change detection
        cache:
          $ref: "#/components/schemas/CachePolicy"
        zdr:
          type: boolean
          default: false
          description: Zero Data Retention mode — skip all durable writes
        signals:
          $ref: "#/components/schemas/DriverSignals"
        ingest:
          type: boolean
          default: false
          description: Forward results to Data Plane for ingestion
        org_id:
          type: string
          nullable: true
          description: Organization ID for Data Plane ingest

    CrawlRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Seed URL for the crawl
        max_pages:
          type: integer
          nullable: true
          minimum: 1
          description: Maximum pages to crawl

    BatchRequest:
      type: object
      required: [urls]
      properties:
        urls:
          type: array
          items:
            type: string
            format: uri
          description: URLs to scrape in parallel

    InternalRunPage:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
        run_id:
          type: string
          nullable: true
        prev_fingerprint:
          type: string
          nullable: true
        cache:
          $ref: "#/components/schemas/CachePolicy"
        zdr:
          type: boolean
          default: false
        signals:
          $ref: "#/components/schemas/DriverSignals"
        ingest:
          type: boolean
          default: false
        org_id:
          type: string
          nullable: true

    CachePolicy:
      type: object
      properties:
        mode:
          type: string
          enum: [read_write, read_only, write_only, bypass]
          default: read_write
        max_age_s:
          type: integer
          default: 0
          description: Custom TTL in seconds (0 = use default 3600s)

    DriverSignals:
      type: object
      properties:
        actions:
          type: array
          items:
            type: string
          default: []
          description: Actions that require a browser driver
        screenshot:
          type: boolean
          default: false
        pdf:
          type: boolean
          default: false
        prior_block_signals:
          type: integer
          default: 0
          description: Number of prior blocks (>=2 escalates to browser)
        profile_required:
          type: boolean
          default: false
        url_type:
          type: string
          enum: [json, plain_text, default]
          default: default

    NormalizedOutput:
      type: object
      required: [run_id, url, status, fetched_at, fingerprint, formats, change, metadata, driver]
      properties:
        run_id:
          type: string
          description: "Typed ID with run_ prefix"
        url:
          $ref: "#/components/schemas/UrlTriple"
        status:
          type: integer
          description: HTTP status code from upstream
        fetched_at:
          type: string
          format: date-time
        fingerprint:
          type: string
          description: "blake3:<hex> content fingerprint"
        formats:
          $ref: "#/components/schemas/OutputFormats"
        change:
          $ref: "#/components/schemas/ChangeInfo"
        metadata:
          $ref: "#/components/schemas/PageMetadata"
        driver:
          $ref: "#/components/schemas/DriverInfo"

    UrlTriple:
      type: object
      required: [requested, final_url]
      properties:
        requested:
          type: string
        final_url:
          type: string
        canonical:
          type: string
          nullable: true

    OutputFormats:
      type: object
      properties:
        html:
          $ref: "#/components/schemas/FormatRef"
        markdown:
          $ref: "#/components/schemas/FormatRef"
        raw:
          $ref: "#/components/schemas/FormatRef"
        links:
          type: array
          items:
            $ref: "#/components/schemas/Link"
        screenshot:
          $ref: "#/components/schemas/FormatRef"
        pdf:
          $ref: "#/components/schemas/FormatRef"
        extract:
          $ref: "#/components/schemas/ExtractRef"

    FormatRef:
      type: object
      required: [artifact_id, bytes]
      properties:
        artifact_id:
          type: string
        bytes:
          type: integer
          format: int64

    ExtractRef:
      type: object
      required: [artifact_id]
      properties:
        artifact_id:
          type: string
        schema_id:
          type: string
          nullable: true

    Link:
      type: object
      required: [href]
      properties:
        href:
          type: string
        text:
          type: string
          nullable: true
        rel:
          type: string
          nullable: true

    ChangeInfo:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [new, changed, unchanged]
        prev_fingerprint:
          type: string
          nullable: true

    PageMetadata:
      type: object
      properties:
        title:
          type: string
          nullable: true
        lang:
          type: string
          nullable: true
        content_type:
          type: string
          nullable: true

    DriverInfo:
      type: object
      required: [kind, duration_ms]
      properties:
        kind:
          type: string
          enum: [static, browser, tls]
        duration_ms:
          type: integer
          format: int64
        profile:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        session_id:
          type: string
          nullable: true
        live_view_url:
          type: string
          nullable: true
          format: uri
        recording_id:
          type: string
          nullable: true

    HandoffAck:
      type: object
      required: [job_id, accepted_at]
      properties:
        job_id:
          type: string
        accepted_at:
          type: string
          format: date-time

    InternalRunPageResult:
      type: object
      required: [run_id, status, fingerprint, links]
      properties:
        run_id:
          type: string
        status:
          type: integer
        fingerprint:
          type: string
        links:
          type: array
          items:
            type: string

    Envelope_NormalizedOutput:
      type: object
      required: [request_id, success, data]
      properties:
        request_id:
          type: string
        success:
          type: boolean
          description: Always true for success envelopes
        data:
          $ref: "#/components/schemas/NormalizedOutput"

    Envelope_HandoffAck:
      type: object
      required: [request_id, success, data]
      properties:
        request_id:
          type: string
        success:
          type: boolean
          description: Always true for success envelopes
        data:
          $ref: "#/components/schemas/HandoffAck"

    Envelope_Error:
      type: object
      required: [request_id, success, error]
      properties:
        request_id:
          type: string
        success:
          type: boolean
          description: Always false for error envelopes
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

tags:
  - name: search
    description: Tavily-lineage web discovery
  - name: agent
    description: Governed per-action browser-agent execution and proof
  - name: scrape
    description: Single-page scrape operations
  - name: crawl
    description: Multi-page crawl operations
  - name: batch
    description: Batch scrape operations
  - name: internal
    description: Internal plane-to-plane endpoints
  - name: ops
    description: Health and readiness probes
