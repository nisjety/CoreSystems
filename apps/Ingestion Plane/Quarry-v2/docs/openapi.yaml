          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                properties:
                  data:
                    type: object
                    additionalProperties: true
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
                  error:
                    $ref: '#/components/schemas/ErrorDetail'
        '400':
          description: Malformed source id, missing tag or invalid tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Unknown source for this org
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/sources/{source_id}/definition:
    put:
      operationId: put_source_definition
      summary: Replace or clear a source's saved job definition
      description: >-
        Replaces config.definition of a source the caller's organization owns, or clears it with `definition: null`
        (E4.1-6). Dark: 501 while QUARRY_EDGE__SAVED_JOBS is off, null included. A definition is checked against the
        source's kind and URL with the validators of POST /v1/crawl (crawl) or POST /v1/scrape (scrape), and the
        canonical form is stored; the other keys of config are kept. The URL must pass the org web policy: a denied
        URL is a 403 with details.reason policy_denied. Clearing fetches nothing, so the policy does not apply to it.
        The answer is the updated source.
      tags:
      - resources
      security:
      - bearerAuth: []
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceDefinitionRequest'
      responses:
        '200':
          description: Updated source (control-plane wire shape)
          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                properties:
                  data:
                    type: object
                    additionalProperties: true
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
                  error:
                    $ref: '#/components/schemas/ErrorDetail'
        '400':
          description: >-
            Malformed source id; a body that names no definition (details.fields[] with code required); or a
            definition the validators refuse (details.fields[] with path, code and message, as on SavedJobDefinition)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: The source URL is denied by the org web policy (details.reason policy_denied)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Unknown source for this org
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: QUARRY_EDGE__SAVED_JOBS is off (UNSUPPORTED; the message names the switch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
