  /v1/agent/runs/{run_id}/events/stream:
    get:
      operationId: streamAgentRunEvents
      summary: Typed agent-run events as Server-Sent Events, with resume (WS10.S3)
      description: >-
        Streams the run's user-facing events (agent.started, action.started, action.completed,
        action.failed, observation.ready, agent.completed, agent.expired, agent.budget_exhausted, agent.failed) in the
        order of the run's trace. Each SSE `id:` is the event's per-run `seq` (dense, starting
        at 1 for an agent run). Resume with the `Last-Event-ID` header a reconnecting EventSource
        sends, or with `from_seq`; `from_seq` wins when both are present. The stream replays the
        run's in-memory replay ring after that seq, then tails the live channel with no gap and no
        duplicate. The ring holds `QUARRY_EDGE__TRACE_RING_EVENTS` events (default 512; 0 disables
        it) within `QUARRY_EDGE__TRACE_RING_MAX_BYTES` (default 1 MiB) and lives only as long as the
        run. A `replay_gap` event comes first when the ring no longer holds the events after the
        resume point; its fallback is the durable browser-session timeline. The stream ends with
        `event: done` and `data: run_closed` when the run closes, or `data: max_events` when
        `max_events` is reached. A slow consumer gets `event: lagged` and the stream resumes from
        the ring. Only the owner of the run may read it; any other caller gets 404.
      tags:
      - agent
      parameters:
      - $ref: '#/components/parameters/AgentRunId'
      - name: from_seq
        in: query
        required: false
        description: Replay the retained events with seq greater than this value before the live tail. Wins over Last-Event-ID.
        schema:
          type: integer
          minimum: 0
      - name: max_events
        in: query
        required: false
        description: Close the stream after this many user-facing events (0 or absent, no cap).
        schema:
          type: integer
          minimum: 0
      - name: Last-Event-ID
        in: header
        required: false
        description: The seq of the last event the client received. Used when from_seq is absent.
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: >-
            text/event-stream. Named events: agent.started, action.started, action.completed,
            action.failed, observation.ready, agent.completed, agent.expired, agent.budget_exhausted, agent.failed (data is
            the Event envelope, id is seq), replay_gap (data is {requested, oldest_retained,
            fallback}), lagged (data is {skipped}), done (data is run_closed or max_events).
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          description: Run not found, or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
  /v1/agent/runs/{run_id}:
    delete:
      operationId: closeAgentRun
      summary: Close a browser-agent run and release its lease
      tags:
      - agent
      parameters:
      - $ref: '#/components/parameters/AgentRunId'
      responses:
        '200':
          description: Run closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_ClosedRun'
        '404':
          description: Run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
  /v1/map:
    post:
      operationId: map
      summary: Whole-site URL discovery
      description: 'Fast site map from sitemap.xml + robots + on-page links, optionally

        relevance-ranked by `search`. Read-only, org-scoped, SSRF-guarded.

        '
      tags:
      - map
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MapRequest'
      responses:
        '200':
          description: Discovered URLs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapResponse'
        '502':
          description: Origin returned no sitemap or links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/audit/page:
    post:
      operationId: auditPage
      summary: Bounded public-page evidence for the audit rules
      description: >-
        Bounded public-page evidence (`bounded_page_v1`) for Marketing Core's audit rules. It reads
        `robots.txt` for the page's origin first, then the page, following redirects only inside the
        discovery scope with every hop traced into `redirects`. It runs no analysis and stores nothing, and
        calls no browser fallback, provider or ingest. The URL passes the web policy before any fetch, as
        `POST /v1/map` does, and a refusal names the layer that decided, not the URL. A 2xx source must be an
        HTML document (text/html or application/xhtml+xml), or the answer is 503 UNSUPPORTED. An upstream 404
        or 500 is evidence in `status`, not a failure. A title or description over its limit is 502
        UPSTREAM_LIMIT, never a truncated value. Link and heading text is cut at 512 characters, and the lists
        are capped at 100 and 200, with `partial` set when the source has more. The
        success body is the `AuditPage` object itself, not wrapped in the typed envelope. A service principal
        needs scrape:read (a bare 403 otherwise); a person's token passes this gate. At most eight captures run
        per process, and an excess request is 429 RATE_LIMITED without queueing. The whole capture has a 10
        second deadline, past which the answer is 504 TIMEOUT.
      tags:
      - scrape
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              additionalProperties: false
              properties:
                url:
                  type: string
                  maxLength: 4096
      responses:
        '200':
          description: The bounded evidence for the page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          description: The body is not JSON (the framework's plain-text rejection)
        '403':
          description: Refused by the web policy, not a public URL, blocked, or with an unreadable robots.txt (FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: The body does not match the schema (an unknown field, or a wrong type); the framework answers in plain text
        '429':
          description: At most eight captures are in flight, or the discovery transport is rate limited (RATE_LIMITED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '502':
          description: The evidence exceeds a field limit, or the source exceeds the bounded response limit (UPSTREAM_LIMIT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: The source is a 2xx document that is not HTML, or the bounded transport is unavailable (UNSUPPORTED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '504':
          description: The capture passed its 10 second deadline (TIMEOUT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/browser/redirect-hop:
    post:
      operationId: browserRedirectHop
      summary: One credentialless redirect hop for assistant navigation
      description: >-
        Inspects one public HTTP(S) response and answers where its redirect points, if it redirects at all.
        The probe sends no cookies, reads no storage and reads the response headers only; the URL's fragment
        is dropped. The probe pins public DNS addresses and refuses a URL that is not public or is blocked
        (403 SECURITY_BLOCKED). The web policy is checked for the URL and again for the target (403 FORBIDDEN).
        `target` is the absolute URL of a validated 301, 302, 303, 307 or 308 redirect, and null for any other
        status; a redirect without exactly one usable Location, or one that downgrades https to http, is refused
        (403 SECURITY_BLOCKED). A DNS or transport failure is answered with the probe's own code and a generic
        message that never names an internal host or address. A service principal needs browser:execute (a bare
        403 otherwise); a person's token passes this gate. At most 16 probes run per process, and an excess
        request is 429 RATE_LIMITED without queueing. The whole probe has a 4 second deadline, past which the
        answer is 504 TIMEOUT.
      tags:
      - agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              additionalProperties: false
              properties:
                url:
                  type: string
                  maxLength: 4096
      responses:
        '200':
          description: The redirect target, or null when the response is not a redirect
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/RedirectProbeResult'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '403':
          description: Blocked, not a public URL, refused by the web policy, or a redirect that is refused (SECURITY_BLOCKED or FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
        '400':
          description: The body is not JSON (the framework's plain-text rejection)
        '422':
          description: The body does not match the schema (an unknown field, or a wrong type); the framework answers in plain text
        '429':
          description: Probe capacity is busy (RATE_LIMITED); retry later
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
        '502':
          description: The public URL could not be resolved or read (DRIVER_FAILED, or the probe's own code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
        '504':
          description: The probe passed its 4 second deadline (TIMEOUT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
  /v1/extract:
    post:
      operationId: extract
      summary: Multi-URL structured extraction
      description: 'Fetch a bounded set of URLs and return structured data per source

        (JSON-Schema-guided via Model Plane) or cleaned markdown. Per-source

        isolation — one failure never sinks the batch.


        `schema` alone is schema-guided extraction. `prompt` alone asks the model for one

        free-form JSON object (`data`, status `ok`, no `schema_valid`). Both together is

        schema-guided extraction with the prompt as extra instructions. Neither returns

        cleaned markdown (status `fetched`). Under zero data retention no page text is sent

        to a model: each source answers status `error` with a `ZDR_UNAVAILABLE` message,

        and its `structured` harvest still comes back.

        '
      tags:
      - extract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractRequest'
      responses:
        '200':
          description: Per-source extraction results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractResponse'
        '400':
          description: No valid URLs in request, or a `prompt` that is empty after trimming or over 10000 characters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: >-
            A `schema` or a `prompt` was sent and the Model Plane cannot be used (never for a ZDR
            request, and never when neither field is sent). The body is `{error, code, hint,
            next_actions}` with `code` `UNSUPPORTED`; the three cases differ in `error`. (1) No
            Model Plane URL: `structured extraction needs the Model Plane, and
            QUARRY_EDGE__MODEL_PLANE_URL is not set on this deployment`. (2) A URL but no model
            credential: `structured extraction needs a granted Model Plane lane, and this
            deployment holds no model credential`. (3) The gateway refused the first model call
            (answered after one fetch and one model call, only while no source was extracted):
            `structured extraction needs a granted Model Plane lane, and the Model Plane refused
            this service`. The retry is the same request without `schema` and `prompt`
            (cleaned markdown). A deployed stack gets one of these until WS16.S1 to S3 and
            decision X-7 land; no flag unlocks it. See RUNBOOKS, "Enable structured extract and
            AI formats".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                no_model_plane_url:
                  summary: No Model Plane URL
                  value:
                    error: structured extraction needs the Model Plane, and QUARRY_EDGE__MODEL_PLANE_URL is not set on this deployment
                    code: UNSUPPORTED
                    hint: 'omit `schema` and `prompt` to receive cleaned markdown. Operators: the URL QUARRY_EDGE__MODEL_PLANE_URL is missing, and setting it alone is not enough because the model lane must also be granted; see docs/RUNBOOKS.md, "Enable structured extract and AI formats"'
                    next_actions:
                    - retry without `schema` and `prompt` to receive cleaned markdown
                    - 'operators: see docs/RUNBOOKS.md, "Enable structured extract and AI formats"'
                model_lane_refused:
                  summary: The Model Plane refused this service
                  value:
                    error: structured extraction needs a granted Model Plane lane, and the Model Plane refused this service
                    code: UNSUPPORTED
                    hint: 'omit `schema` and `prompt` to receive cleaned markdown. Operators: the model lane is not granted to this service (the gateway refused the first model call, so no further page was fetched); see docs/RUNBOOKS.md, "Enable structured extract and AI formats"'
                    next_actions:
                    - retry without `schema` and `prompt` to receive cleaned markdown
                    - 'operators: see docs/RUNBOOKS.md, "Enable structured extract and AI formats"'
