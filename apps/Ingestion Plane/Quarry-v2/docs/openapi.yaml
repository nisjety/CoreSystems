                properties:
                  data:
                    type: object
                    required:
                    - events
                    - nextSequence
                    - zdr
                    properties:
                      events:
                        type: array
                        items:
                          type: object
                      nextSequence:
                        type: integer
                        minimum: 0
                      zdr:
                        type: boolean
        '400':
          description: A filter value is outside the documented allowlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
        '404':
          description: Run not found or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
  /v1/agent/runs/{run_id}/hit-test:
    get:
      operationId: agentHitTest
      summary: Map a viewport point to the observed target under it (dark)
      description: >-
        E3.3-h. A read-only point hit test: it executes nothing, navigates nowhere, focuses or scrolls
        nothing, and writes nothing (no receipt, timeline row, artifact or cache entry). Off unless
        QUARRY_EDGE__HIT_TEST is on (default off): off, the call is refused with 403 hit_test_disabled
        before the run is looked up. `x` and `y` are CSS pixels from the viewport's top-left corner,
        rounded to whole pixels. A missing or non-finite value, or a point outside the run's viewport
        (1280 by 800 when its lease names none), is a 400. The browser's hit test finds the DOM node
        under the point and its accessibility ancestors. The answer names an observed target in `ref`
        only when one of those nodes is a target of the caller's last observation of the run; then
        `snapshotId` and `generation` name that snapshot, so the caller can tell that it is stale.
        Without a `ref`, `reason` says why: no_node (nothing under the point), no_snapshot (a node is
        there, but the run has observed no page) or not_observed (a node is there, but no observed
        target is on its ancestors). The answer carries no backend node id and no frame id. A ZDR run
        may use it: nothing is stored or logged, and `zdr` echoes the run's flag. Only the actor that
        started the run, in its organisation, may call it; anyone else gets 404.
      tags:
      - agent
      parameters:
      - $ref: '#/components/parameters/AgentRunId'
      - name: x
        in: query
        required: true
        description: The point's horizontal position, in CSS pixels from the viewport's left edge.
        schema:
          type: number
      - name: y
        in: query
        required: true
        description: The point's vertical position, in CSS pixels from the viewport's top edge.
        schema:
          type: number
      responses:
        '200':
          description: The node under the point, and the observed target it names when there is one
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/HitTestData'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '400':
          description: x or y is missing, not finite, or outside the viewport; a value that is not a number gets the framework's plain-text rejection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
        '403':
          description: The switch is off (hit_test_disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
        '404':
          description: Run not found, not started by the caller, or no longer live
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
        '501':
          description: The browser driver has no point hit test (UNSUPPORTED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
