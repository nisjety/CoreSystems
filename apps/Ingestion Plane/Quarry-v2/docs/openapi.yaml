      properties:
        profile_id:
          type: string
        name:
          type: [string, 'null']
        scope:
          type: string
        url:
          type: string
        restorable:
          type: boolean
          description: True when a cookie has not expired (a session cookie counts) or any storage is present.
        cookies_count:
          type: integer
          minimum: 0
        local_storage_count:
          type: integer
          minimum: 0
        session_storage_count:
          type: integer
          minimum: 0
        indexed_db_count:
          type: integer
          minimum: 0
        earliest_expiry:
          type: [string, 'null']
          format: date-time
          description: The nearest expiry among cookies that have not expired yet.
        cookies_expired:
          type: integer
          minimum: 0
        origins_count:
          type: integer
          minimum: 0
        has_user_agent:
          type: boolean
        has_viewport:
          type: boolean
        locale:
          type: [string, 'null']
        timezone:
          type: [string, 'null']
        owner_is_caller:
          type: boolean
    ResponseMeta:
      type: object
