        come from the verified token. Off until `QUARRY_EDGE__DOWNLOADS` and `QUARRY_EDGE__DOWNLOAD_HANDOFF` are on; a ZDR token or run is refused (403, `download_handoff_zdr_refused`) before anything is
        read. A repeat for the same artifact and digest returns the first document id with `created` false. Typed refusals (`download_handoff_*` in `details.reason`) pass through from the hand-off.
