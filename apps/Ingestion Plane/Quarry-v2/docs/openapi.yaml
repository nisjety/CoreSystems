  /v1/jobs/{job_id}:
    get:
      operationId: get_job_status
      summary: Status document of a durable job (WS15.L1)
      description: >-
        Org-scoped by the verified token. A job id of another organization, or an id
        that is not a job, answers 404. The document carries status, phase, origin,
        counts, total and total_kind, warnings and the control state. For a page-priced
        job (crawl, batch, scrape, extract) it also carries `credits`, an estimate derived
        from the fetched-page count, once the control service has `QUARRY_CONTROL__JOB_CREDITS`
        on (default off).
        To cancel, use DELETE /v1/crawl/{job_id} or DELETE /v1/batch/{job_id} (WS15.L2). Crawl and batch jobs are
        refused under zero data retention, so there is no such job to read here under ZDR.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^job_'
      responses:
        '200':
          description: The job status document.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/JobStatusView'
        '404':
          description: Not found for this organization, or not a job id.
        '408':
          description: >-
            The route deadline (60 s by default) passed before the status was read. The body is empty, with no
            error envelope. The x-request-id header is still echoed.
  /v1/crawl/ongoing:
    get:
      operationId: list_ongoing_crawls
      summary: Crawls still in flight for the organization, oldest first (WS15.L1)
      responses:
        '200':
          description: Job list items (status, origin, phase, stats) of the non-terminal crawls.
          content:
            application/json:
              schema:
                type: object
  /v1/crawl/{job_id}:
    get:
      operationId: get_crawl_status
      summary: Status document of a crawl (WS15.L1)
      description: A batch id on this path answers 404 (kind mismatch).
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^job_'
      responses:
        '200':
          description: The crawl status document.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/JobStatusView'
        '404':
          description: Not found, a foreign id, or a job of another kind.
    delete:
      operationId: cancel_crawl
      summary: Cancel a crawl (WS15.L2)
      description: An accepted crawl is cancelled at once; a running one stops within one page and the control loop period (2 s). Org-scoped; service principals are refused.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^job_'
      responses:
        '202':
          description: The request is recorded and the orchestrator has yet to apply it (control.pending is true).
          content:
            application/json:
              schema:
                type: object
        '200':
          description: The job already reflects the request (an accepted job cancelled at once).
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Not found, a foreign id, or a job of another kind.
        '409':
          description: The job ended, or the verb does not fit its state. details.reason is ended, not_running or not_controllable.
        '501':
          description: Job control is not enabled on this edge (QUARRY_EDGE__JOB_CONTROL).
  /v1/crawl/{job_id}/pause:
    post:
      operationId: pause_crawl
