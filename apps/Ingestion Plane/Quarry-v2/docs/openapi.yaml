openapi: 3.1.0
info:
  title: Quarry v2 API
  version: 0.1.0
  description: Evidence engine — fetch, render, transform, fingerprint, diff.
  contact:
    name: Triodelab Engineering
    email: eng@triodelab.com
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
- url: http://localhost:8080
  description: Local development
- url: https://quarry.triodelab.com
  description: Production
paths:
  /health:
    get:
      operationId: health
      summary: Liveness probe
      tags:
      - ops
      responses:
        '200':
          description: Service is alive
          content:
            text/plain:
              schema:
                type: string
                example: ok
  /ready:
    get:
      operationId: ready
      summary: Readiness probe
      description: >-
        Whether this edge should receive traffic. 503 while it drains for
        shutdown, while its stores are not durable, and when a local browser
        is unhealthy. The edge runs two local Chromium drivers: agent runs'
        (`browser`) and the scrape path's (`scrape_browser`); each object is
        present only when that driver runs a local browser, and a driver
        without one (a remote provider) leaves the body as
        `{"durable":true,"status":"ready"}`. A browser that was never launched
        is `idle` and ready: the first run launches it. `/health` never
        changes with any of this.
      tags:
      - ops
      responses:
        '200':
          description: Service is ready to accept traffic
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, durable]
                properties:
                  status:
                    type: string
                    enum: [ready]
                  durable:
                    type: boolean
                    enum: [true]
                  browser:
                    $ref: '#/paths/~1ready/get/responses/503/content/application~1json/schema/properties/browser'
                  scrape_browser:
                    $ref: '#/paths/~1ready/get/responses/503/content/application~1json/schema/properties/browser'
              example:
                status: ready
                durable: true
                browser:
                  state: healthy
                  max_sessions: 40
                  sessions_open: 2
                  slots:
                  - slot: 0
                    status: ready
                    generation: 1
                    sessions: 2
                    pages: 3
                    healthy: true
                    probe_failures: 0
        '503':
          description: >-
            Not ready. `status: draining` (the body has no other key) while the
            edge shuts down; `status: not_ready` with `durable: false` and the
            store's `reason` when the stores are not durable; `status:
            not_ready`, `durable: true`, `reason: browser_unhealthy` when the
            agent or the scrape browser is `unhealthy` (every launched browser
            of that driver failed two health probes in a row, or its process
            is dead), with both browser objects as in the 200 body.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [draining, not_ready]
                  durable:
                    type: boolean
                  reason:
                    type: [string, 'null']
                    description: '`browser_unhealthy`, or why the stores are not durable.'
                  browser:
                    type: object
                    description: A local browser driver's health. Counts and states only, no session data.
                    additionalProperties: false
                    required: [state, max_sessions, sessions_open, slots]
                    properties:
                      state:
                        type: string
                        enum: [idle, healthy, degraded, unhealthy]
                        description: >-
                          `idle`: never launched (ready). `healthy`: every launched
                          browser answers its probe. `degraded`: some, not all,
                          launched browsers are unhealthy or dead (ready).
                          `unhealthy`: all are (503). A driver without a local
                          browser (`not_applicable`) is left out of the body.
                      max_sessions:
                        type: integer
                        description: QUARRY_BROWSER_MAX_SESSIONS; 0 means no cap.
                      sessions_open:
                        type: integer
                      slots:
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          required: [slot, status, generation, sessions, pages, healthy, probe_failures]
                          properties:
                            slot:
                              type: integer
                            status:
                              type: string
                              enum: [starting, ready, retiring, dead]
                            generation:
                              type: integer
                              description: Launches of this slot; 0 is never launched.
                            sessions:
                              type: integer
                            pages:
                              type: integer
                            healthy:
                              type: [boolean, 'null']
                              description: The last probe's verdict; null until probed.
                            probe_failures:
                              type: integer
                  scrape_browser:
                    $ref: '#/paths/~1ready/get/responses/503/content/application~1json/schema/properties/browser'
              example:
                status: not_ready
                durable: true
                reason: browser_unhealthy
                browser:
                  state: unhealthy
                  max_sessions: 40
                  sessions_open: 2
                  slots:
                  - slot: 0
                    status: ready
                    generation: 1
                    sessions: 2
                    pages: 3
                    healthy: false
                    probe_failures: 2
  /v1/scrape:
    post:
      operationId: scrape
      summary: Scrape a single URL
      description: 'Fetches a URL, runs the transform pipeline (readability, markdown, links,

        metadata, fingerprint, diff), stores artifacts, and returns a normalized

        output envelope. Optionally forwards results to the Data Plane for ingestion.

        '
      tags:
      - scrape
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScrapeRequest'
      responses:
        '200':
          description: Successful scrape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_ScrapeResponse'
        '415':
          description: >-
            The page is a kind of file Quarry cannot extract text from (image,
            archive, spreadsheet, ...), or a PDF/DOCX that could not be read. Code
            UNSUPPORTED_MEDIA; details name the kind and, for a document that failed
            to parse, a reason (pdf_parse_failed, docx_parse_failed, too_large). Only
            returned when QUARRY_EDGE__DOC_ROUTING is skip or on.
        '400':
          description: Invalid request (bad URL, missing fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
        '403':
          description: >-
            Security blocked (SSRF, blocklist, policy), or the fetched page is itself a bot
            challenge. A challenge is code CHALLENGE_DETECTED with details.block_reason
            (captcha_widget, waf_interstitial or unexpected_bot_error; the same value is given as
            details.reason), details.recovery not_applicable and details.next other_source. It
            carries no host, URL or page text. A status alone (a bare 403, a 429, a login page) is
            never a challenge, and a page that is not a challenge scrapes as before. Classified by
            QUARRY_CHALLENGE_CLASSIFIER=v2 (the default; legacy does not classify a scrape). The
            refusal itself is switched on with QUARRY_CHALLENGE_ENFORCE=enforce; under the default
            log the page is returned as before and only counted by reason in a log line.
            An AI format (json, summary, question, highlights) asked for by a service principal
            without the extract:ai scope, or on a request labelled initiated_by "agent", is code
            FORBIDDEN with details.reason extract_ai_scope_required and details.field formats[i];
            nothing is fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
        '429':
          description: >-
            Rate limited. With actions, details.reason heavy_browser_busy means the
            browser's heavy lane is held by another action run; retry shortly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
        '501':
          description: >-
            The browser cannot do what was asked: a capture or actions on a browser that
            cannot run them, or no browser wired on the endpoint. Code UNSUPPORTED,
            details.reason browser_capability_unavailable. Also code UNSUPPORTED for an AI
            format when the endpoint has no model: details.reason model_plane_unavailable
            (QUARRY_EDGE__MODEL_PLANE_URL is unset) or model_lane_not_granted (no usable model
            credential on this deployment). Answered before the page is fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
        '504':
          description: >-
            The run hit a deadline. Without actions: code TIMEOUT with details.op scrape
            and deadline_ms. With actions (the handler bound is 115 s and the route allows
            125 s): details.reason actions_deadline. A single wait over its limit
            (wait_too_long) or a run over the wait budget (wait_budget_exhausted) fails
            that action; under actions_on_error abort the request then answers 502
            action_failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
        '502':
          description: >-
            Upstream fetch failed. With actions, an action that failed under abort answers
            DRIVER_FAILED with details.reason action_failed, details.action_index,
            details.action_type and details.actions: the outcome of each action in order
            (index, kind, status, duration_ms, and an error code and message). Page text
            and typed values are never in it. details.reason no_browser_session means the
            run held no browser session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
  /v1/scrape/{id}:
    get:
      operationId: getScrape
      summary: Read back an earlier scrape
      description: >-
        Returns the record a non-ZDR scrape stored: the normalized output and the
        effective options, without inline text. The id is the `scrape_id` of the
        scrape response. Another organization's id, or an id that is not a scrape
        record, is a 404. A caller whose organization is under ZDR is refused with
        403, even for a record written before the organization turned ZDR on. A ZDR
        scrape stores nothing and has no id.
      tags:
      - scrape
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The scrape_id from a scrape response.
      responses:
        '200':
          description: The stored scrape
          headers:
            Cache-Control:
              schema:
                type: string
              description: private, max-age=30
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_ScrapeResponse'
        '403':
          description: The caller's organization is under Zero Data Retention
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
        '404':
          description: No such scrape for this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
  /v1/scrape/stream:
    post:
      operationId: scrapeStream
      summary: Scrape with SSE event stream
      description: 'Same as /v1/scrape but returns a Server-Sent Event stream with

        per-step events (page_fetched, change_detected, artifact_written, etc.)

        followed by the final result or error. Captures, actions and the AI formats

        are not served here: the error event is BAD_REQUEST with details.reason

        unsupported_in_stream.

        '
      tags:
      - scrape
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScrapeRequest'
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events stream
  /v1/crawl:
    post:
      operationId: crawlHandoff
      summary: Start a crawl job
      description: 'Hands off a crawl request to the orchestrator for BFS execution.

        Returns a job ID for tracking progress.

        '
      tags:
      - crawl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrawlRequest'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Crawl job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_HandoffAck'
        '402':
          description: "The organization's configured crawl page (quarry.crawl.page) allowance is spent (WS6.D-s; only a source that reports an allowance produces this, the default static source never does). Body is BUDGET_EXHAUSTED with details dimension org_allowance, metric, limit_source entitlement and resumable false. No job is created."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
        '429':
          description: "Backlog full (QUARRY_JOB_ADMISSION on): the organization already has its bound of waiting jobs. Body is RATE_LIMITED with details reason org_backlog_full, limit, queued and retry_after_seconds, and a Retry-After header. Nothing is stored."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
        '502':
          description: Orchestrator unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
  /v1/batch:
    post:
      operationId: batchHandoff
      summary: Start a batch scrape job
      description: 'Hands off multiple URLs to the orchestrator for parallel execution.

        Returns a job ID for tracking progress.

        '
      tags:
      - batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: >-
            Batch job accepted. A repeated Idempotency-Key answers 200 too, with the job the first request created;
            that repeat is not billed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_HandoffAck'
        '400':
          description: "WS14.S5. Every URL of the batch was refused by the static check, so no URL can be crawled. Body is BAD_REQUEST with details.rejected (url, code, message). Nothing is created. A batch with at least one crawlable URL is a 200 with HandoffAck.rejected. W3-E3.7.2w, with QUARRY_EDGE__BATCH_PARALLEL on: a `max_parallel` (or `maxParallel`) that is not a whole number of at least 1, or both spellings together, is a BAD_REQUEST with details.fields[] (path, code, message); nothing is created."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
        '402':
          description: "The organization's configured batch URL (quarry.batch.url) allowance is spent (WS6.D-s; only a source that reports an allowance produces this, the default static source never does). Body is BUDGET_EXHAUSTED with details dimension org_allowance, metric, limit_source entitlement and resumable false. No job is created."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
        '409':
          description: >-
            A repeated Idempotency-Key that reuses the key for a different URL list or ingest flag, with
            QUARRY_EDGE__BATCH_IDEMPOTENCY on. The body is CONFLICT with details.reason idempotency_key_reused and
            details.job_id, the job the key already holds. Nothing is created and nothing is billed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
        '429':
          description: "Backlog full (QUARRY_JOB_ADMISSION on): the organization already has its bound of waiting jobs. Body is RATE_LIMITED with details reason org_backlog_full, limit, queued and retry_after_seconds, and a Retry-After header. Nothing is stored."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
        '502':
          description: Orchestrator unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
  /v1/search:
    post:
      operationId: search
      summary: SERP + own-corpus search (hybrid when Data Plane wired)
      description: 'Provider-agnostic search across the local Tantivy corpus, SERP

        backends, and — when a Data Plane is configured — semantic vectors

        fused via RRF. Tavily-style params: topic, time_range/days,

        exact_match, chunks_per_source, include_answer, format=context,

        highlight, facets.

        '
      tags:
      - search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Ranked results (plus optional answer/context/facets; score_kind and rerank when a rerank ran)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: >-
            Refused before any search runs. ZDR_REQUIRED: a service caller did not send zdr. SCORE_KIND_UNSUPPORTED:
            score_kinds names a score kind this edge does not produce. BAD_REQUEST: a scrape limit (1 to 10),
            max_chars (1 to 50000) or timeout_ms (1000 to 55000) is out of range. UNSUPPORTED_OPTION: a scrape
            formats entry other than markdown. These checks run only with QUARRY_EDGE__SEARCH_SCRAPE on; off, the
            scrape block is ignored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: Rate limited (structured retry envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '501':
          description: No search backend configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/search/images:
    post:
      operationId: searchImages
      summary: Image search through the SearXNG image vertical
      description: >-
        Focused image search. The query goes to the SearXNG the edge is configured with (QUARRY_EDGE__SEARXNG_URL),
        in its image category, and nothing else. Without that URL the route answers 501 UNSUPPORTED. A successful
        call, even one with no images, is metered as one SEARCH_QUERY unit with kind images. Zero data retention:
        the route reads no zdr field and makes no ZDR decision. The query is not cached, and the usage event carries
        the org, the user, the vertical and the result count, never the query text. Codes from SearXNG are the
        upper-cased names of the error code (DRIVERFAILED, BADREQUEST, NOTFOUND), not the underscore wire names;
        the 429 envelope carries RATE_LIMITED. A service principal is refused with a bare 403. A body that is not
        JSON, or does not match the schema, gets the framework's plain-text 400 or 422 before the handler runs.
      tags:
      - search
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageSearchRequest'
      responses:
        '200':
          description: Image hits in the provider order, with the query as sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageSearchResponse'
        '400':
          description: BAD_REQUEST when the query is empty after trimming, or BADREQUEST when SearXNG answers another 4xx
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: FORBIDDEN when SearXNG answers 401 or 403
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: The body does not match the schema (no query, or a wrong type); the framework answers in plain text
        '429':
          description: RATE_LIMITED when SearXNG answers 429, with the structured retry envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '500':
          description: INTERNAL when the SearXNG client cannot be built; NOTFOUND when SearXNG answers 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: UNSUPPORTED when no SearXNG URL is configured; the hint names QUARRY_EDGE__SEARXNG_URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '502':
          description: DRIVERFAILED when SearXNG cannot be reached, answers a 5xx, or sends a body that does not decode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/search/videos:
    post:
      operationId: searchVideos
      summary: Video search through the SearXNG video vertical
      description: >-
        Focused video search. The query goes to the SearXNG the edge is configured with (QUARRY_EDGE__SEARXNG_URL),
        in its video category, and nothing else. Without that URL the route answers 501 UNSUPPORTED. A successful
        call, even one with no videos, is metered as one SEARCH_QUERY unit with kind videos. Zero data retention:
        the route reads no zdr field and makes no ZDR decision. The query is not cached, and the usage event carries
        the org, the user, the vertical and the result count, never the query text. Codes from SearXNG are the
        upper-cased names of the error code (DRIVERFAILED, BADREQUEST, NOTFOUND), not the underscore wire names;
        the 429 envelope carries RATE_LIMITED. A service principal is refused with a bare 403. A body that is not
        JSON, or does not match the schema, gets the framework's plain-text 400 or 422 before the handler runs.
      tags:
      - search
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoSearchRequest'
      responses:
        '200':
          description: Video hits in the provider order, with the query as sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoSearchResponse'
        '400':
          description: BAD_REQUEST when the query is empty after trimming, or BADREQUEST when SearXNG answers another 4xx
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: FORBIDDEN when SearXNG answers 401 or 403
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: The body does not match the schema (no query, or a wrong type); the framework answers in plain text
        '429':
          description: RATE_LIMITED when SearXNG answers 429, with the structured retry envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '500':
          description: INTERNAL when the SearXNG client cannot be built; NOTFOUND when SearXNG answers 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: UNSUPPORTED when no SearXNG URL is configured; the hint names QUARRY_EDGE__SEARXNG_URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '502':
          description: DRIVERFAILED when SearXNG cannot be reached, answers a 5xx, or sends a body that does not decode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/search/similar:
    post:
      operationId: searchSimilar
      summary: Semantic neighbours of a passage, a page or both
      description: >-
        Find-similar, from the Data Plane vector index. Send text (a passage), url (a page, whose markdown seeds
        the search) or both. A body with neither after trimming is 400 BAD_REQUEST. The route needs the Data Plane
        vector leg: QUARRY_EDGE__VECTOR_RETRIEVAL set to true, QUARRY_EDGE__DATA_PLANE_URL, and a service identity.
        Without it the route answers 501 UNSUPPORTED. A url is checked against the web policy before anything is
        fetched, even when text is also sent; a refusal is 403 FORBIDDEN, and its message never carries the url.
        The page is fetched only when text is absent, and when that fetch yields nothing the url
        itself seeds the search. The response query is the literal string text when a passage seeded the search,
        and the url otherwise. Results come in the Data Plane's order with no score, and provider is similar. Each
        call that runs the vector leg is metered as one SEARCH_QUERY unit with kind similar. Zero data retention:
        there is no zdr field, so the posture is the token's ZDR floor alone. Under ZDR the vector leg does not run
        (no Data Plane call, no hits, no meter) and the answer is 200 with no results; a url is still fetched under
        the ZDR posture first. Codes from the vector leg are the upper-cased names of the error code (UPSTREAMBLOCKED,
        DRIVERFAILED, RATELIMITED, TIMEOUT), not the underscore wire names. A service principal is refused with a bare
        403. A body that is not JSON gets the framework's plain-text 400.
      tags:
      - search
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimilarRequest'
      responses:
        '200':
          description: The neighbours, in the Data Plane's order, with provider similar and no score
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: BAD_REQUEST when neither text nor url is non-empty after trimming
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: FORBIDDEN when the web policy refuses the url, or the token service refuses the Data Plane call
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: The body does not match the schema (a wrong type); the framework answers in plain text
        '429':
          description: RATELIMITED when the Data Plane or the token service answers 429; a plain error body, not the retry envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: INTERNAL, or an upstream code the route does not map
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: UNSUPPORTED while the vector leg is not wired; the hint names the two settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '502':
          description: UPSTREAMBLOCKED or DRIVERFAILED when the Data Plane or the token service refuses, fails or cannot be reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '504':
          description: TIMEOUT when the Data Plane or the token service misses its deadline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/search/suggest:
    post:
      operationId: searchSuggest
      summary: Spelling correction, related searches and a panel for one query
      description: >-
        Did-you-mean, related searches and a knowledge panel for one query, from the Model Plane. The route is
        degrade-safe and always answers 200: with nothing to give, the answer is an object whose related_queries is
        empty. It is off unless QUARRY_EDGE__SEARCH_SUGGEST is set to on, and boot must also find a Model Plane path
        (QUARRY_EDGE__MODEL_PLANE_URL, a service identity and a granted model-invoke row). When the switch is off, or
        boot refuses it, the route answers the same empty 200 and makes no Model Plane call; so does an empty query.
        The model's reply is read leniently: a correction equal to the query is dropped, related queries are trimmed,
        de-duplicated and capped at five, and a reply that does not parse gives no suggestions. Zero data retention is
        not honoured: the handler reads no ZDR posture and the Model Plane call carries none, so under ZDR the query
        still reaches the model whenever the route runs. The edge keeps no copy. A service principal is refused with a
        bare 403. A body that is not JSON, or does not match the schema, gets the framework's plain-text 400 or 422.
      tags:
      - search
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestRequest'
      responses:
        '200':
          description: The suggestions for the query, or the empty answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestResponse'
        '400':
          description: The body is not JSON (the framework's plain-text rejection)
        '422':
          description: The body does not match the schema (no query, or a wrong type); the framework answers in plain text
  /v1/audio:
    post:
      operationId: audio
      summary: Speech synthesis or transcription through the Model Plane
      description: >-
        One route with two shapes. A body with a string input is text to speech. A body with a string audio_url, and
        no string input, is transcription. Both are forwarded to the Model Plane, which does the work. Any other
        object is 400 BAD_REQUEST. The route is off unless QUARRY_EDGE__MODEL_AUDIO is set to on, and boot must also
        find a Model Plane path: QUARRY_EDGE__MODEL_PLANE_URL, a service identity, and a granted model-audio row in the
        cross-plane token-request manifest. Otherwise it answers 501 UNSUPPORTED, with no token mint and no Model
        Plane call. A transcription's audio_url passes the web policy before anything leaves the edge; a refused URL
        is 403 and never reaches the token service or the Model Plane. Zero data retention: the edge keeps no copy,
        the request's zdr is forwarded to the Model Plane (which owns retention for audio), and a token of a ZDR
        organisation raises it to true whatever the body says. A status the edge does not set itself is the Model
        Plane's answer, passed through with its JSON body (an empty object when that body is not JSON). A service
        principal is refused with a bare 403.
      tags:
      - audio
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/AudioSpeechRequest'
              - $ref: '#/components/schemas/AudioTranscriptionRequest'
      responses:
        '200':
          description: The Model Plane's JSON answer, unchanged
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: >-
            BAD_REQUEST when the object matches neither shape, including one whose fields have the wrong types.
            A body that is not JSON gets the framework's plain-text 400.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioUsageError'
        '403':
          description: FORBIDDEN when the web policy refuses the audio_url, with closed details that never carry the url
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioPolicyRefusal'
        '422':
          description: The body is JSON but not an object; the framework answers in plain text
        '500':
          description: INTERNAL when the HTTP client cannot be built or the service-token request manifest is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: UNSUPPORTED while the switch is off or boot refuses it; no token is minted and no Model Plane call is made
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '502':
          description: UPSTREAM_BLOCKED when the Model Plane token cannot be minted; DRIVER_FAILED when the Model Plane cannot be reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/answer:
    post:
      operationId: answer
      summary: One-call grounded answer with citations
      description: >-
        Searches, reads the top pages and synthesizes one answer through the Model
        Plane, with the sources as citations. Metered as `quarry.answer.synth`, once
        per synthesis. Off until the operator turns it on: it needs
        `QUARRY_EDGE__ANSWER_SYNTHESIS=1` (decided by the Model Plane boot gate,
        which refuses a switch that has no granted model path), a search provider
        and `QUARRY_EDGE__MODEL_PLANE_URL`, and a Model Plane that accepts the
        edge's service token. When it is not available the response names the
        reason, see `AnswerErrorBody`. The same pipeline serves `include_answer` on
        `POST /v1/search`, which reports the same reasons as `answer_status` and
        `answer_reason`. A zero data retention request (the body flag or the
        token's floor) is refused with a 403, reason `zdr_unavailable`, before the
        pipeline starts: the model hop carries no ZDR posture, so there is no
        search, no page fetch and no Model Plane call. The refusal leaves a
        metadata-only tombstone when that is switched on.
      tags:
      - search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerRequest'
      responses:
        '200':
          description: >-
            The answer. With no usable source `answer` is empty and `model` is
            empty; no model was called.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerResponse'
        '400':
          description: The query is empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerErrorBody'
        '403':
          description: >-
            Zero data retention (the body flag or the token's floor): refused
            before any work, `code` `FORBIDDEN`, `reason` `zdr_unavailable`. The
            Model Plane hop carries no ZDR posture, so nothing is searched,
            fetched or sent to a model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerErrorBody'
        '501':
          description: >-
            The answer pipeline is not wired. `reason` is the first closed gate:
            `synthesis_disabled`, `model_path_refused` (the switch is on and the
            boot gate refused it), `no_model_plane_url`, `no_search_provider` or
            `model_client_init_failed`; `hint` names the exact setting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerErrorBody'
        '502':
          description: >-
            The Model Plane failed the call (`reason` `model_plane_error`), or the
            search or page-fetch step failed (`answer_search_failed`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerErrorBody'
        '503':
          description: >-
            The pipeline is wired but the Model Plane refused the edge's service
            token (`reason` `model_plane_auth_refused`). A deployment fact, not a
            fault of the caller; the caller's own token is fine.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerErrorBody'
  /v1/answer/stream:
    post:
      operationId: answerStream
      summary: Server-sent events variant of /v1/answer
      description: >-
        Same pipeline and same request. Frames: `event: citations` (the citation
        array), `event: delta` (`{"delta": text}`, repeated), then `event: done`
        (`{"answer", "cached"}`); `event: error` (`{"message", "reason"}`) on
        failure, where `reason` is the closed code of `AnswerErrorBody`. A warm
        org-scoped answer-cache hit replays with no model call. A ZDR request is
        refused with the same JSON 403 as `/v1/answer` (reason `zdr_unavailable`),
        not a stream. When the pipeline is not wired the response is the same 501
        as `/v1/answer`, not a stream. Metered as
        `quarry.answer.synth` when an answer is produced.
      tags:
      - search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerRequest'
      responses:
        '200':
          description: SSE stream of citations, deltas and a final `done`
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: The query is empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerErrorBody'
        '403':
          description: Zero data retention; refused before the stream starts, `reason` `zdr_unavailable`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerErrorBody'
        '501':
          description: The answer pipeline is not wired; `reason` as for `/v1/answer`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerErrorBody'
  /v1/agent/runs:
    post:
      operationId: startAgentRun
      summary: Acquire a governed browser-agent run
      description: >-
        Creates a tenant-owned browser lease. BrowserBroker grants are
        revalidated at run start and before every action; non-ZDR runs receive
        a durable continuation checkpoint.
        API-key callers (INNH-10, off until `QUARRY_EDGE__API_KEY_AGENT_RUNS` is on):
        the bearer is a short-lived token of the `api_key` principal type
        (`sub` `apikey:<key_id>`, scope `browser:agent`) that Auth Core minted for the
        key; the key itself never reaches Quarry. A key run needs a `grant_id`
        in every environment, issued to that key (an allow-list session grant with
        hosts and a budget; its hosts replace `constraints.allowed_domains`),
        takes no `resume_run_id`, `profile_id` or `persist_profile`, is always an agent run,
        and may call only the routes of the key allow-list (see CONTRACTS.md, "API-key agent runs").
        The refusals are 403 with `error.details.reason` `api_key_*` and 429 `per_key_run_cap`;
        see ERROR_REASONS.md.
      tags:
      - agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAgentRunRequest'
      responses:
        '200':
          description: Browser run acquired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_StartAgentRun'
        '400':
          description: Invalid constraints or persistence request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
        '403':
          description: >-
            Missing or invalid BrowserBroker grant, or `policy_denied`: the request's
            `policy` or the operator baseline refuses a capability the run asked for
            (`error.details.reason` `policy_denied`, with `capability`,
            `decision_source` and `retryable: false`). Nothing is acquired.
            A person's `human_browse` grant (WS8.B; refused unless `QUARRY_EDGE__HUMAN_BROWSE` is on) is
            refused with 403 and the reason as the message: `human_browse_disabled`,
            `human_browse_service_refused`, `human_browse_owner_mismatch`, `human_browse_zdr_posture`
            or `human_browse_policy_unknown`. A resumed run whose stored policy mode differs is refused
            with "resumed run policy no longer matches its broker grant".
            An API-key caller (INNH-10) is refused with `error.details.reason` one of
            `api_key_agent_runs_disabled`, `api_key_scope_missing`, `api_key_route_refused`,
            `api_key_grant_required`, `api_key_grant_kind_refused`, `api_key_open_web_refused`,
            `api_key_grant_owner_mismatch`, `api_key_grant_budget_required`,
            `api_key_grant_hosts_required`, `api_key_profile_refused`, `api_key_resume_refused`
            or `api_key_budget_not_enforced`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
        '429':
          description: >-
            RATE_LIMITED. A run cap is full: `error.details.reason` is
            `global_run_cap`, `org_run_cap`, `org_interactive_run_cap`,
            `org_plan_cap` (the organization's plan bounds this class of run) or
            `per_key_run_cap` (an API key has its maximum of live runs), with
            `scope`, `limit`, `active` and `retry_after_seconds`. Retryable. See
            ERROR_REASONS.md.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
  /v1/agent/runs/{run_id}/step:
    post:
      operationId: agentStep
      summary: Execute one governed browser action
      description: >-
        For an API-key caller (INNH-10) the grant is revalidated on every step and must
        still be the key's own; a dialog reply, an upload or a download is refused with 403
        `error.details.reason` `api_key_sensitive_action_refused` before the driver or the
        broker is asked, and a run belongs to the key that started it (another caller gets 404).
      tags:
      - agent
      parameters:
      - $ref: '#/components/parameters/AgentRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentStepRequest'
      responses:
        '200':
          description: Observation and immutable outcome proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_BrowserObservation'
        '403':
          description: Domain, SSRF, policy, or grant denial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
        '409':
          description: >-
            Either the snapshot target is stale, absent, ambiguous, or changed
            (re-observe before acting), or USER_TOOK_OVER: the person using the
            browser has taken it over and this action was proposed by an agent
            (a service principal, or `initiated_by: agent`). `error.details` is
            `{control_mode: "human_takeover", control_epoch, taken_over_at}` (`taken_over_at`,
            RFC 3339, is absent for a run resumed into a takeover). Not retryable until
            control is handed back. Enforced only when
            QUARRY_EDGE__TAKEOVER_ENFORCEMENT=1; otherwise the edge logs what it
            would have refused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
        '402':
          description: >-
            BUDGET_EXHAUSTED. An agent run reached its step, attempt, runtime
            or estimated-cost bound (error.details.dimension is steps,
            attempts, runtime or cost, with limit, spent and unit). Not
            retryable: the budget does not refill, and a resumed run keeps what
            it spent. Only returned when QUARRY_EDGE__BUDGET_ENFORCEMENT=on;
            in shadow mode the same condition is only recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
        '429':
          description: Step budget exhausted (the step limit the request itself set)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
  /v1/agent/runs/{run_id}/tabs:
    get:
      operationId: listAgentTabs
      summary: List the live browser tabs of a run
      description: >-
        The driver's current tabs for the run. A tab carries no opener here; the owner
        projection (`GET .../browser-session`, see CONTRACTS.md) names who opened
        each tab as `openedBy`.
      tags:
      - agent
      parameters:
      - $ref: '#/components/parameters/AgentRunId'
      responses:
        '200':
          description: The run's tabs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AgentTabs'
        '404':
          description: Run not found or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
    post:
      operationId: openAgentTab
      summary: Open a browser tab on a run
      description: >-
        Opens a tab (optionally navigated to `url`) and records who did it. Subject
        to the same gates as a step: the run's domains, its grant, and the take-over
        rule. Who is calling comes from the token (a service principal is an agent
        whatever it sends; a person is a person unless `initiatedBy` says `agent`),
        so the hint only tightens. The recorded identity of an agent is on the
        timeline item and the owner projection; see CONTRACTS.md.
      tags:
      - agent
      parameters:
      - $ref: '#/components/parameters/AgentRunId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAgentTabRequest'
      responses:
        '200':
          description: The new tab and the run's tabs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AgentTab'
        '403':
          description: Domain (including a `url` outside the run's allowed domains), SSRF, grant or tier refusal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
        '404':
          description: Run not found, not owned by the caller, or no longer live
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
        '409':
          description: >-
            USER_TOOK_OVER: the person using the browser has taken it over and this
            call is an agent's. `error.details` is
            `{control_mode: "human_takeover", control_epoch, taken_over_at}` (`taken_over_at`,
            RFC 3339, is absent for a run resumed into a takeover). Enforced only when
            QUARRY_EDGE__TAKEOVER_ENFORCEMENT is on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
        '422':
          description: >-
            The body does not parse: both spellings of the hint in one body, or a hint
            that is neither `human` nor `agent`. The answer is the HTTP framework's
            plain-text rejection, not an error envelope.
  /v1/agent/runs/{run_id}/origin-extension:
    post:
      operationId: applyAgentOriginExtension
      summary: Apply a person's per-origin consent to a live run (dark)
      description: >-
        Q3-E3.2-e1w. Off unless QUARRY_EDGE__ORIGIN_CONSENT is on: off, the call is refused with
        403 origin_consent_disabled before any broker call. The caller is the run's owner or the
        service principal that started it. The origin-extension grant (kind origin_extension, a
        child of the run's grant, owned by the run's owner, the start host plus at most eight
        listed hosts, one extend_origin:turn, extend_origin:conversation or extend_origin:always
        action; a ZDR run takes turn only) is validated, the org's consent caps are applied, and
        any web-policy, grant or denied-list deny beats the approval; only then is the run's
        browser egress widened. The extension reaches what a page loads or is redirected through,
        and never widens the run's own navigation allow list. Quarry reads the grant again before
        every step, before a tab is opened and before an attachment starts; when it is no longer
        usable the run's own egress policy is restored and the extension is dropped. Nothing is
        persisted, and a resumed run starts from its own grant. The answer never names a host.
        Refusal reasons (in error.details.reason): origin_consent_disabled (403),
        origin_extension_api_key_run (403), origin_extension_grant_invalid,
        origin_extension_host_invalid, origin_extension_too_many_hosts,
        origin_extension_zdr_scope, org_origin_consent_disabled, org_origin_consent_scope,
        org_origin_consent_unreadable, origin_extension_denied (SECURITY_BLOCKED).
      tags:
      - agent
      parameters:
      - $ref: '#/components/parameters/AgentRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - extension_grant_id
              properties:
                extension_grant_id:
                  type: string
                  minLength: 1
                  maxLength: 256
      responses:
        '200':
          description: The extension was applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      scope:
                        type: string
                        enum:
                        - turn
                        - conversation
                        - always
                      host_count:
                        type: integer
                        description: The hosts the run may now also reach, the start host included
        '400':
          description: extension_grant_id is empty or longer than 256 characters
        '403':
          description: Origin consent is off (origin_consent_disabled) or the run is an API-key run
        '404':
          description: Run not found, not the caller's, or no longer live
        '422':
          description: The body does not parse
  /v1/agent/runs/{run_id}/attach:
    post:
      operationId: attachAgentRun
      summary: Attach an agent to a person's live run (dark; service principal only)
      description: >-
        WS8.F. Off unless QUARRY_EDGE__ATTACH is on. A service principal holding an attach
        grant (a child of the run's grant, for this run, owned by the run's owner, one to
        eight hosts) gets one agent tab, opened in the background: the person's active tab
        does not change. Refused for ZDR runs. Refusal reasons (in error.message):
        attach_disabled, attach_requires_service_principal, attach_zdr_refused,
        attach_requires_grant, attach_grant_invalid, attach_driver_unsupported (UNSUPPORTED),
        attach_exists (CONFLICT).
      tags:
      - agent
      parameters:
      - $ref: '#/components/parameters/AgentRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - grant_id
              properties:
                grant_id:
                  type: string
                start_url:
                  type: string
                constraints:
                  type: object
                  properties:
                    max_steps:
                      type: integer
                      minimum: 1
                      maximum: 200
                    max_runtime_s:
                      type: integer
                      minimum: 1
                      maximum: 3600
                    max_cost_usd:
                      type: number
      responses:
        '200':
          description: The attachment and its agent tab
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      attach_id:
                        type: string
                      tab_id:
                        type: string
                      tab_epoch:
                        type: integer
                      control_epoch:
                        type: integer
                      opened_by:
                        type: string
                        enum:
                        - agent
                      holder:
                        type: string
                        enum:
                        - agent
                      allowed_domains:
                        type: array
                        items:
                          type: string
        '400':
          description: A constraint is outside its bounds
        '403':
          description: Refused (the reason is in error.message)
        '404':
          description: Run not found
        '409':
          description: An attachment is already live on the run
  /v1/agent/runs/{run_id}/attach-current-tab:
    post:
      operationId: attachAgentCurrentTab
      summary: Attach an agent to a tab the person already has open (dark; service principal only)
      description: >-
        WS8.F, the hand-over of a tab the person already has open. Off unless QUARRY_EDGE__ATTACH is on.
        The same gates as `POST .../attach` apply: the caller is a service principal holding
        browser:execute, it holds an attach grant (a child of the run's grant, for this run, owned by the
        run's owner, one to eight hosts), and the run is not ZDR. The body must name the tab in
        `attach_tab` and must not carry `start_url` (both are a 400). The delegate gets that tab, not a new
        one, so `attached_existing_tab` is true. The tab must be the person's active tab, at
        `expected_epoch` and `expected_origin`, held by the person and with no attachment, and the grant
        must allow exactly that tab's host; otherwise the call is 409 browser_continue_tab_changed. Upload
        and download are disabled for this attachment whatever `policy` asks: browser.act.upload and
        browser.act.download are added to the ask's `disable` list. Refusal reasons (in error.message):
        attach_disabled, attach_requires_service_principal, attach_zdr_refused,
        attach_current_tab_requires_personal_browser (the run is not on the open web), attach_requires_grant,
        attach_grant_invalid, attach_driver_unsupported (UNSUPPORTED), attach_exists (CONFLICT) and
        browser_continue_tab_changed (CONFLICT).
      tags:
      - agent
      parameters:
      - $ref: '#/components/parameters/AgentRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - grant_id
              - attach_tab
              properties:
                grant_id:
                  type: string
                attach_tab:
                  type: object
                  additionalProperties: false
                  required:
                  - tab_id
                  - expected_epoch
                  - expected_origin
                  properties:
                    tab_id:
                      type: string
                    expected_epoch:
                      type: integer
                      minimum: 0
                    expected_origin:
                      type: string
                      description: >-
                        The tab's origin as the browser serialises it, for example https://example.com
                constraints:
                  type: object
                  properties:
                    max_steps:
                      type: integer
                      minimum: 1
                      maximum: 200
                    max_runtime_s:
                      type: integer
                      minimum: 1
                      maximum: 3600
                    max_cost_usd:
                      type: number
                policy:
                  $ref: '#/components/schemas/RequestAsk'
      responses:
        '200':
          description: The attachment, bound to the tab the person already has open
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      attach_id:
                        type: string
                      tab_id:
                        type: string
                      tab_epoch:
                        type: integer
                      control_epoch:
                        type: integer
                      opened_by:
                        type: string
                        enum:
                        - human
                        - agent
                        description: Who opened the tab (human for a tab the person opened)
                      holder:
                        type: string
                        enum:
                        - agent
                      allowed_domains:
                        type: array
                        items:
                          type: string
                      policy_applied:
                        type: boolean
                        description: Always true on this route
                      attached_existing_tab:
                        type: boolean
                        description: Always true on this route
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '400':
          description: attach_tab is missing, start_url is present, or a constraint is outside its bounds
        '403':
          description: Refused (the reason is in error.message); a service principal without browser:execute gets a bare 403
        '404':
          description: Run not found, in another organisation, or no longer live
        '409':
          description: An attachment is already live on the run (attach_exists), or the tab changed (browser_continue_tab_changed)
        '501':
          description: The browser driver cannot hand over a tab (attach_driver_unsupported)
  /v1/agent/runs/{run_id}/attach/{attach_id}:
    delete:
      operationId: releaseAgentAttach
      summary: End an agent attachment (the delegate ends its own; the owner stops it)
      description: >-
        Closes the agent tab and records the end on the timeline and as agent.detached.
        Does not revoke the grant.
      tags:
      - agent
      parameters:
