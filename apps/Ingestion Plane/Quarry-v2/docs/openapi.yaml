                    $ref: '#/components/schemas/ErrorDetail'
    post:
      operationId: create_source
      summary: Register an ingestion source
      description: >-
        config.definition (E4.1-6) is a saved job definition for the source. The edge checks it with the same
        validators as POST /v1/crawl (crawl) or POST /v1/scrape (scrape) before anything is stored, and control keeps
        the canonical form. A refused definition is a 400 with details.fields[]. Sending the key at all, null included,
        needs QUARRY_EDGE__SAVED_JOBS on, else 501. A repeat registration of the same URL returns the row that exists and
        does not rewrite its config: change a stored definition with PUT /v1/sources/{source_id}/definition.
      tags:
      - resources
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSourceRequest'
      responses:
        '200':
          description: Created source (control-plane wire shape)
          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                properties:
                  data:
                    type: object
                    additionalProperties: true
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
                  error:
                    $ref: '#/components/schemas/ErrorDetail'
        '400':
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: config.definition is sent while QUARRY_EDGE__SAVED_JOBS is off (UNSUPPORTED; the message names the switch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/sources/{source_id}:
    get:
      operationId: get_source
      summary: Read one ingestion source
      description: >-
        The source of the caller's organization, config included: a saved job definition sits at config.definition
        (E4.1-6). This route reads what is stored, so it is not behind QUARRY_EDGE__SAVED_JOBS. A malformed id is a
