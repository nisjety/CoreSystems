          type: string
    FacetCount:
      type: object
      required:
      - value
      - count
      properties:
        value:
          type: string
        count:
          type: integer
    SearchResponse:
      type: object
      required:
      - query
      - provider
      - results
      - count
      properties:
        query:
          type: string
        provider:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResultItem'
        count:
          type: integer
        answer:
          type: string
          nullable: true
        citations:
          type: array
          nullable: true
          items:
            type: object
        context:
          type: string
          nullable: true
        facets:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/FacetCount'
    MapRequest:
      type: object
      required:
      - url
      properties:
        url:
          type: string
        search:
          type: string
          nullable: true
        limit:
          type: integer
          format: int32
          nullable: true
        include_subdomains:
          type: boolean
          default: false
    MapLink:
      type: object
      required:
      - url
      properties:
        url:
          type: string
        title:
          type: string
          nullable: true
        score:
          type: number
          format: float
          nullable: true
    MapResponse:
      type: object
      required:
      - url
      - links
      - count
      - ranked
      properties:
        url:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/MapLink'
        count:
          type: integer
        ranked:
          type: boolean
    ExtractRequest:
      type: object
      required:
      - urls
      properties:
        urls:
          type: array
          items:
            type: string
        schema:
          type: object
          nullable: true
          description: JSON Schema for structured output
        prompt:
          type: string
          nullable: true
        max_urls:
          type: integer
          format: int32
          nullable: true
    ExtractItem:
      type: object
      required:
      - url
      - status
      properties:
        url:
          type: string
        status:
          type: string
          description: ok | fetched | error
        data:
          type: object
          nullable: true
        markdown:
          type: string
          nullable: true
        structured:
          $ref: '#/components/schemas/StructuredData'
        error:
          type: string
          nullable: true
    StructuredData:
      type: object
      description: >-
        Machine-readable facts harvested from the page's own markup — hydration
        payloads, JSON-LD, microdata and tables — alongside the prose. Present
        only when the page carried any, and independent of `status`: a
        schema-guided extraction and a markdown one read the same page. Added
        because readability strips `<script>` by design, which on a
        hydration-rendered page (Enonic, Next.js, Nuxt) discards the very
        figures the page exists to publish.
      properties:
        figures:
          type: array
          description: Labelled scalars, each with its unit and period where the page gave one.
          items:
            $ref: '#/components/schemas/StructuredKeyFigure'
        tables:
          type: array
          items:
            type: object
        microdata:
          type: array
          items:
            type: object
        blobs:
          type: array
          description: Bounded raw JSON objects kept when no narrower shape fit.
          items:
            type: object
        truncated:
          type: boolean
          description: >-
            True when a size cap was hit, i.e. the page carried more than was
            kept. A caller may treat it as a hint to escalate to a full render
            rather than trusting a partial harvest.
    StructuredKeyFigure:
      type: object
      required:
      - label
      - value
      properties:
        label:
          type: string
        value:
          type: string
          description: Kept as a string; separators carry locale meaning (e.g. "729 437").
        unit:
          type: string
        period:
          type: string
          description: >-
            The period the figure describes. A figure without one is a correct
            answer this quarter and a wrong one next.
    ExtractResponse:
      type: object
      required:
      - results
      - count
      - requested
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ExtractItem'
        count:
          type: integer
        requested:
          type: integer
    ErrorBody:
      type: object
      required:
      - error
      - code
      properties:
        error:
          type: string
        code:
          type: string
        hint:
          type: string
          nullable: true
    RateLimitError:
      allOf:
      - $ref: '#/components/schemas/ErrorBody'
      - type: object
        properties:
          window:
            type: string
            nullable: true
          retry_after_seconds:
            type: integer
            nullable: true
          next_actions:
            type: array
            items:
              type: string
    RequestAsk:
      type: object
      description: >-
        WS7.C web-policy ask on a scrape request. It can only tighten what the
        operator baseline and the organisation's policy allow; it cannot loosen
        anything. A domain it denies is a 403 with details.reason policy_denied
        (capability domains.deny, decision_source request). An unknown capability
        in disable is a 400 with details.reason unknown_capability. Under
        QUARRY_EDGE__WEB_POLICY_ENFORCEMENT=observe the ask is only counted, never
        enforced.
      additionalProperties: false
      properties:
        disable:
          type: array
          items:
            type: string
          description: Capability keys to disable for this request (the catalogue names, for example browser.act.upload).
        robots_max:
          type: string
          enum:
          - strict
          - respect
          - ignore
          description: Lower the robots.txt ceiling for this request.
        proxy_max:
          type: string
          enum:
          - none
          - pool
          description: Lower the proxy tier ceiling for this request.
        deny_domains:
          type: array
          items:
            type: string
          description: Hosts to refuse for this request (exact host or dot-suffix match).
        allow_domains:
          type: array
          nullable: true
          items:
            type: string
          description: Hosts to allow for this request. Applies to autonomous (service) callers only.
    ScrapeRequest:
      type: object
      additionalProperties: true
      x-quarry-lenient: >-
        Keys that are not listed are ignored with an unknown_field warning
        (and Deprecation and Sunset headers) until the edge runs strict, where
        they are a 400.
      x-quarry-lenient-until: >-
        Lenient until QUARRY_EDGE__SCRAPE_STRICT_AFTER is reached (an RFC 3339
        time or a YYYY-MM-DD date, read at start). From that instant unknown keys
        are a 400. A response that carries unknown-field warnings gets
        Deprecation: true, and Sunset with the date while the variable is set.
        QUARRY_EDGE__SCRAPE_REQUEST_VALIDATION=strict makes the edge strict at
        once. No date is set in this repository: the operator sets it when the
        quarry.scrape.unknown_field log line shows that no caller still sends an
        unlisted key.
      required:
      - url
      properties:
        privacy:
          type: object
          nullable: true
          description: Privacy policy for this request (purpose, classification, third-party processing). ZDR raises it.
        render:
          type: object
          nullable: true
          description: Render hints for the browser driver (waitForSelector, waitForTimeoutMs).
          properties:
            waitForSelector:
              type: string
            waitForTimeoutMs:
              type: integer
        prefer_http3:
          type: boolean
          default: false
          description: Prefer HTTP/3 when the edge was built and configured for it.
        policy:
          $ref: '#/components/schemas/RequestAsk'
        url:
          type: string
          format: uri
          description: URL to scrape
          example: https://example.com/article
        prev_fingerprint:
          type: string
          nullable: true
          description: Previous blake3 fingerprint for change detection
        cache:
          $ref: '#/components/schemas/CachePolicy'
        zdr:
          type: boolean
          default: false
          description: Zero Data Retention mode — skip all durable writes
        signals:
          $ref: '#/components/schemas/DriverSignals'
        ingest:
          type: boolean
          default: false
          description: Forward results to Data Plane for ingestion
        org_id:
          type: string
          nullable: true
          description: Organization ID for Data Plane ingest
        formats:
          type: array
          description: >-
            What to return inline besides the artifact references. `markdown`,
            `html` (the HTML the markdown was made from, after the cleaning options),
            `rawHtml` (the document as fetched), `links` and `metadata` (the
            last two are in every response already). Naming formats makes the
            request non-default: it neither reads nor writes the page cache. Under
            ZDR the default is `["markdown"]`. `json`, `screenshot`, `summary`,
            `question` and `highlights` are reserved and rejected with
            `reserved_format`.
          items:
            type: string
            enum: [markdown, html, rawHtml, links, metadata]
        only_main_content:
          type: boolean
          default: true
          description: true runs the main-content heuristic (extractor readability); false keeps the whole body (clean_full). Must agree with extractor. camelCase alias onlyMainContent.
        include_tags:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 256
          description: CSS selectors; only the matching subtrees are kept, each once. Matching nothing gives empty markdown and the warning include_tags_matched_nothing. An invalid selector is a 400 invalid_selector. Alias includeTags.
        exclude_tags:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 256
          description: CSS selectors; every match and its subtree is removed before extraction. Alias excludeTags.
        remove_base64_images:
          type: boolean
          default: false
          description: Strip inline base64 images (clean_full always does). Alias removeBase64Images.
        extractor:
          type: string
          enum: [readability, clean_full, raw]
          default: readability
          description: readability (main content), clean_full (whole body without scripts and chrome) or raw (as is). Setting it against only_main_content is a 400 conflicts_with_only_main_content.
        timeout_ms:
          type: integer
          minimum: 1000
          maximum: 55000
          default: 55000
          description: Upper bound for the whole scrape; on expiry the response is a 504 TIMEOUT with details.op = scrape. Alias timeoutMs.
        max_inline_bytes:
          type: integer
          minimum: 1
          maximum: 8388608
          default: 1048576
          description: Cap for each inline field. Over it, a non-ZDR field is left out (listed in omitted), a ZDR field is cut (listed in truncated). Alias maxInlineBytes.
      description: >-
        Fields not listed here are unknown: ignored with an unknown_field warning
        (and Deprecation and Sunset headers) unless the edge runs strict, where they
        are a 400. skipTlsVerification, skip_tls_verification, proxy, proxyUrl,
        headers, mobile and stealth are always a 400 reserved_field. A bad value is
        a 400 with details.fields[] {path, code, message}.
    CrawlRequest:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          description: Seed URL for the crawl
        max_pages:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Maximum pages to crawl. Absent or 0 takes the default (1000; operator
            override QUARRY_CRAWL_DEFAULT_MAX_PAGES), never unlimited. A value above
            the hard ceiling (5000; QUARRY_CRAWL_HARD_MAX_PAGES) is clamped to it. The
            response reports the effective value in `limits`.
        max_depth:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Maximum link depth from the seed. Absent or 0 takes the default (5);
            clamped to the hard ceiling (10). Reported in `limits`.
    BatchRequest:
      type: object
      required:
      - urls
      properties:
        urls:
          type: array
          items:
            type: string
            format: uri
          description: URLs to scrape in parallel
    InternalRunPage:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          format: uri
        run_id:
          type: string
          nullable: true
        prev_fingerprint:
          type: string
          nullable: true
        cache:
          $ref: '#/components/schemas/CachePolicy'
        zdr:
          type: boolean
          default: false
        signals:
          $ref: '#/components/schemas/DriverSignals'
        ingest:
          type: boolean
          default: false
        org_id:
          type: string
          nullable: true
        crawl:
          $ref: '#/components/schemas/CrawlContext'
    CachePolicy:
      type: object
      properties:
        mode:
          type: string
          enum:
          - read_write
          - read_only
          - write_only
          - bypass
          default: read_write
        max_age_s:
          type: integer
          default: 0
          description: Custom TTL in seconds (0 = use default 3600s)
    DriverSignals:
      type: object
      properties:
        actions:
          type: array
          items:
            type: string
          default: []
          description: Actions that require a browser driver
        screenshot:
          type: boolean
          default: false
        pdf:
          type: boolean
          default: false
        prior_block_signals:
          type: integer
          default: 0
          deprecated: true
          description: >-
            Deprecated. Number of prior blocks. Under QUARRY_BLOCK_ESCALATION=legacy
            a value of 1 selects the TLS driver and 2 or more the browser; under
            honest (WS3.I) the field is accepted and ignored, because a block never
            changes the identity Quarry presents.
        profile_required:
          type: boolean
          default: false
        url_type:
          type: string
          enum:
          - json
          - plain_text
          - default
          default: default
    NormalizedOutput:
      type: object
      required:
      - run_id
      - url
      - status
      - fetched_at
      - fingerprint
      - formats
      - change
      - metadata
      - driver
      properties:
        run_id:
          type: string
          description: Typed ID with run_ prefix
        url:
          $ref: '#/components/schemas/UrlTriple'
        status:
          type: integer
          description: HTTP status code from upstream
        fetched_at:
          type: string
          format: date-time
        fingerprint:
          type: string
          description: blake3:<hex> content fingerprint
        formats:
          $ref: '#/components/schemas/OutputFormats'
        change:
          $ref: '#/components/schemas/ChangeInfo'
        metadata:
          $ref: '#/components/schemas/PageMetadata'
        driver:
          $ref: '#/components/schemas/DriverInfo'
    UrlTriple:
      type: object
      required:
      - requested
      - final_url
      properties:
        requested:
          type: string
        final_url:
          type: string
        canonical:
          type: string
          nullable: true
    OutputFormats:
      type: object
      properties:
        html:
          $ref: '#/components/schemas/FormatRef'
        markdown:
          $ref: '#/components/schemas/FormatRef'
        raw:
          $ref: '#/components/schemas/FormatRef'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        screenshot:
          $ref: '#/components/schemas/FormatRef'
        pdf:
          $ref: '#/components/schemas/FormatRef'
        extract:
          $ref: '#/components/schemas/ExtractRef'
    FormatRef:
      type: object
      required:
      - artifact_id
      - bytes
      properties:
        artifact_id:
          type: string
        bytes:
          type: integer
          format: int64
    ExtractRef:
      type: object
      required:
      - artifact_id
      properties:
        artifact_id:
          type: string
        schema_id:
          type: string
          nullable: true
    Link:
      type: object
      required:
      - href
      properties:
        href:
          type: string
        text:
          type: string
          nullable: true
        rel:
          type: string
          nullable: true
    ChangeInfo:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - new
          - changed
          - unchanged
        prev_fingerprint:
          type: string
          nullable: true
    PageMetadata:
      type: object
      properties:
        title:
          type: string
          nullable: true
        lang:
          type: string
          nullable: true
        content_type:
          type: string
          nullable: true
        content_kind:
          type: string
          description: >-
            What the body was detected to be, from its first bytes and then its
            Content-Type: html, xml, text, json, pdf, docx, xlsx, pptx, odf, epub,
            ole_compound, image, audio, video, archive, executable, rtf or binary.
            Absent when QUARRY_EDGE__DOC_ROUTING is off. A body Quarry cannot
            extract text from is refused with 415 UNSUPPORTED_MEDIA when the mode
            is skip or on (details.kind names it).
        content_kind_source:
          type: string
          enum:
          - header
          - magic
          - default
    DriverInfo:
      type: object
      required:
      - kind
      - duration_ms
      properties:
        kind:
          type: string
          enum:
          - static
          - browser
          - tls
        duration_ms:
          type: integer
          format: int64
        profile:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        session_id:
          type: string
          nullable: true
        live_view_url:
          type: string
          nullable: true
          format: uri
        recording_id:
          type: string
          nullable: true
    HandoffAck:
      type: object
      required:
      - job_id
      - accepted_at
      properties:
        job_id:
          type: string
        accepted_at:
          type: string
          format: date-time
        limits:
          type: object
          description: >-
            Set by /v1/crawl. The page and depth bounds the crawl will run with and
            why they differ from the request (`clamped_by` is `default` when the
            request was absent or zero, `hard` when it was above the ceiling, and
            empty when it was used as asked).
          properties:
            max_pages:
              $ref: '#/components/schemas/CrawlBound'
            max_depth:
              $ref: '#/components/schemas/CrawlBound'
    CrawlBound:
      type: object
      required:
      - effective
      - clamped_by
      properties:
        requested:
          type: integer
          nullable: true
        effective:
          type: integer
          minimum: 1
        clamped_by:
          type: array
          items:
            type: string
            enum:
            - default
            - hard
    CrawlContext:
      description: >-
        WS14.S2. The crawl scope for one run_page call. Absent or null leaves the
        response unchanged. An unknown key, a bad value or an over-cap list is a 400
        whose details.fields names each path. Hosts are bare names. The seed URL is
        used only when crawl_entire_domain is false.
      type: object
      properties:
        v:
          type: integer
          enum:
          - 1
          default: 1
        kind:
          type: string
          enum:
          - crawl
          - batch
          default: crawl
          description: A batch page returns no links.
        depth:
          type: integer
          minimum: 0
          default: 0
          description: Depth of the page being run (0 for the seed).
        max_depth:
          type: integer
          minimum: 0
          default: 0
          description: Deepest link depth to follow. 0 means unlimited.
        seed_hosts:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 253
        seed_url:
          type: string
          nullable: true
          description: Absolute http or https URL. Used only when crawl_entire_domain is false.
        scope:
          $ref: '#/components/schemas/CrawlScope'
        scope_mode:
          type: string
          enum:
          - enforce
          - observe
          default: enforce
          description: observe returns every href as sent and reports what enforce would drop.
        robots:
          type: string
          enum:
          - respect
          - ignore
          default: respect
    CrawlScope:
      type: object
      additionalProperties: false
      properties:
        allow_subdomains:
          type: boolean
          default: false
        allow_external_links:
          type: boolean
          default: false
        crawl_entire_domain:
          type: boolean
          default: true
          description: When false, only links under the seed URL's directory are followed.
        include_paths:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 512
          description: Include and exclude lists together hold at most 100 patterns. re: matches the URL path with a regex, re_url: the full URL with a regex, url: the full URL, and a plain pattern with * or ? is an anchored glob. Other plain patterns are prefixes.
        exclude_paths:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 512
          description: A matching exclude beats any include.
        deny_extensions:
          type: array
          nullable: true
          maxItems: 100
          items:
            type: string
            maxLength: 16
          description: Extensions without the dot. null takes the built-in list of static assets and media.
        legacy:
          type: boolean
          default: false
          description: Set by the orchestrator for jobs accepted before scope existed.
    CrawlReport:
      description: WS14.S2. Present on a run_page response only when the request carried crawl.
      type: object
      required:
      - v
      - scope_applied
      - mode
      - links_seen
      - links_allowed
      - links_denied
      - links_unevaluated
      - denials
      - hosts_added
      properties:
        v:
          type: integer
          enum:
          - 1
        scope_applied:
          type: boolean
          description: True when the scope changed links (enforce mode).
        mode:
          type: string
          enum:
          - enforce
          - observe
        links_seen:
          type: integer
          minimum: 0
        links_allowed:
          type: integer
          minimum: 0
        links_denied:
          type: integer
          minimum: 0
        links_unevaluated:
          type: integer
          minimum: 0
          description: Hrefs past the 5000-link evaluation cap, or every href of a batch page.
        denials:
          $ref: '#/components/schemas/CrawlDenials'
        hosts_added:
          type: array
          items:
            type: string
          description: Hosts this page added to scope. Only set at depth 0.
        crawl_delay_ms:
          type: integer
          nullable: true
          minimum: 0
          description: Reserved. Set once robots peeks supply a crawl delay.
    CrawlDenials:
      type: object
      required:
      - counts
      - samples
      - robots
      properties:
        counts:
          type: object
          description: Denial count by code. Codes include out_of_scope, external_host_disabled, depth_exceeded, include_pattern_miss, exclude_pattern_hit, content_type_rejected, not_crawlable, duplicate, robots_disallowed and robots_unreachable.
          additionalProperties:
            type: integer
            minimum: 0
        samples:
          type: array
          maxItems: 20
          description: At most 3 per code and 20 per page.
          items:
            $ref: '#/components/schemas/CrawlDenialSample'
        robots:
          type: array
          maxItems: 50
          description: Robots denials, at most 50 per page. The counts keep going past that.
          items:
            $ref: '#/components/schemas/CrawlRobotsDenial'
    CrawlDenialSample:
      type: object
      required:
      - url
      - code
      - message
      - depth
      properties:
        url:
          type: string
        code:
          type: string
        message:
          type: string
        remedy:
          type: string
          nullable: true
        depth:
          type: integer
          minimum: 0
    CrawlRobotsDenial:
      type: object
      required:
      - url
      - code
      - user_agent
      - path
      properties:
        url:
          type: string
        code:
          type: string
        user_agent:
          type: string
        path:
          type: string
    InternalRunPageResult:
      type: object
      required:
      - run_id
      - status
      - fingerprint
      - links
      properties:
        run_id:
          type: string
        status:
          type: integer
        fingerprint:
          type: string
        links:
          type: array
          items:
            type: string
        crawl:
          $ref: '#/components/schemas/CrawlReport'
    Envelope_NormalizedOutput:
      type: object
      required:
      - request_id
      - success
      - data
      properties:
        request_id:
          type: string
        success:
          type: boolean
          description: Always true for success envelopes
        data:
          $ref: '#/components/schemas/NormalizedOutput'
    ScrapeResponse:
      description: >-
        A NormalizedOutput plus what cannot be a stored artifact. Under Zero Data
        Retention no artifact is written, so the extracted text is returned inline
        in `markdown`; otherwise read it from formats.markdown. A PDF or DOCX
        (QUARRY_EDGE__DOC_ROUTING=on) stores its original bytes as formats.raw and
        has no formats.html.
      allOf:
      - $ref: '#/components/schemas/NormalizedOutput'
      - type: object
        properties:
          markdown:
            type: string
            description: Inline text. Present when the markdown format was asked for, and by default under ZDR (nothing is stored). Capped at max_inline_bytes.
          html:
            type: string
            description: The document as fetched, when the html format was asked for. Not available for a PDF or DOCX.
          raw_html:
            type: string
            description: The document as fetched, when the rawHtml format was asked for.
          truncated:
            type: array
            items:
              type: string
            description: Inline fields cut at max_inline_bytes (ZDR only).
          omitted:
            type: array
            items:
              type: string
            description: Inline fields left out for exceeding max_inline_bytes (not ZDR); read the matching formats.* artifact.
          effective_options:
            type: object
            description: The options the response was produced with, including ignored_fields, cache_state (hit, miss, bypass), doc_routing and strict.
          warnings:
            type: array
            items:
              type: object
              required:
              - code
              - message
              properties:
                code:
                  type: string
                  description: e.g. unknown_field, document_has_no_text_layer, document_text_truncated, format_unavailable_for_documents
                message:
                  type: string
                field:
                  type: string
                  description: The request field a warning is about (unknown_field).
    Envelope_ScrapeResponse:
      type: object
      required:
      - request_id
      - success
      - data
      properties:
        request_id:
          type: string
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/ScrapeResponse'
    Envelope_HandoffAck:
      type: object
      required:
      - request_id
      - success
      - data
      properties:
        request_id:
          type: string
        success:
          type: boolean
          description: Always true for success envelopes
        data:
          $ref: '#/components/schemas/HandoffAck'
    Envelope_Error:
      type: object
      required:
      - request_id
      - success
      - error
      properties:
        request_id:
          type: string
        success:
          type: boolean
          description: Always false for error envelopes
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
