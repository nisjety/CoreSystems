      description: Sets the tag of a source the caller's org owns. An empty string clears it. A body that names no tag is a 400 with reason `tag_required`; a tag that fails the grammar is a 400 with reason `invalid_tag`. The answer is the updated source in control's wire shape.
      tags:
      - resources
      security:
      - bearerAuth: []
