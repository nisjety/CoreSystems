          description: The page the artifact belongs to, the hash of its URL and content fingerprint. A changed page in a later run has a different one.
    JobResultsView:
      type: object
      description: The data of GET /v1/{crawl,batch,jobs}/{job_id}/results (INNH-12)
      required:
      - kind
      - items
      properties:
        kind:
          type: string
          enum:
          - page_index
          - dataset
          description: What the rows are. `page_index` is an index of the pages fetched (URL, status, metadata, artifact ids), not their content; it is the only value produced today. `dataset` is reserved for extracted records (decision B2(a)).
        items:
          type: array
          items:
            $ref: '#/components/schemas/JobResult'
        next_seq:
          type: integer
          minimum: 0
          description: Present when more rows remain. Pass it back as `after_seq`.
        scan_capped:
          type: boolean
          description: True only for a `latest=true` read of a job with more than 20 000 fetches, whose answer covers the first 20 000.
    JobResult:
      type: object
      description: One page a job fetched. Fields after `fetched_at` are absent when the fetch event predates them or nothing was stored.
      required:
      - seq
      - url
      - status
      - fetched_at
      properties:
        seq:
          type: integer
          minimum: 0
          description: Position of the fetch in the job's event log. The cursor is the last row's seq.
        url:
          type: string
          description: The URL the job fetched (as requested; a redirect target is not recorded here).
        status:
          type: integer
          description: HTTP status of the fetch.
        content_type:
          type: string
        title:
          type: string
        fetched_at:
          type: string
          format: date-time
        word_count:
          type: integer
          minimum: 0
        driver:
          type: string
          enum:
          - static
          - tls
          - browser
        markdown_artifact_id:
          type: string
          description: The stored Markdown of the page. Read it with `GET /v1/artifacts/{id}`.
        source_artifact_id:
          type: string
          description: The stored HTML, or the original document. Read it with `GET /v1/artifacts/{id}`.
        bytes:
          type: integer
          minimum: 0
          description: Size in bytes of the stored Markdown.
    JobSummary:
      type: object
      required:
      - job_id
      - kind
      - org_id
      - status
      - created_at
      properties:
        job_id:
          type: string
          description: job_<ulid> — addresses GET /v1/jobs/:id
          not the Temporal run id: null
        kind:
          type: string
          enum:
          - crawl
          - search
          - extract
          - research
          - agent
          - batch
          - scrape
        org_id:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        run_id:
          type: string
          nullable: true
          description: Populated once dispatched; required for GET /v1/runs/:id/events
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        stats:
          description: Kind-specific counters
        origin:
          $ref: '#/components/schemas/JobRunOrigin'
        phase:
          type: string
          description: What a person reads; queued while waiting, otherwise the status.
        credits:
          $ref: '#/components/schemas/JobCredits'
    JobRunOrigin:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          description: user, agent, schedule, webhook, api, or unknown for rows written before the origin existed.
        actor:
          type: string
        ref:
          type: string
          description: The Model Plane run id, for agent origins only.
    JobCredits:
      type: object
      description: >-
        Credits a job has used, derived at read time from its fetched-page count
        (pages fetched x price_per_page). A Quarry-side estimate, not what billing-core
        invoices: a flat price per fetched page, a browser-rendered page priced like any
        other, failed and blocked pages free. Present only for page-priced kinds (crawl,
        batch, scrape, extract) and only while the control service runs with
        QUARRY_CONTROL__JOB_CREDITS on (default off); absent, never null, otherwise.
        GET /v1/team/credit-usage sums the same page_fetched events at the same price.
      required:
      - used
      - unit
      - basis
      - price_per_page
      - estimated
      - final
      properties:
        used:
          type: number
          description: Credits used so far.
        unit:
          type: string
          enum:
          - credit
        basis:
          type: string
          enum:
          - pages_fetched
        price_per_page:
          type: number
        estimated:
          type: boolean
          description: Always true.
        final:
          type: boolean
          description: False while the job can still fetch pages; true once its status is terminal.
    JobStatusView:
