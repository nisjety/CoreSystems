  /v1/sources:
    get:
      operationId: list_sources
      summary: List ingestion sources
      description: Forwarded to the control plane; durable per-org resource.
      tags:
      - resources
      security:
      - bearerAuth: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
      - name: tag
        in: query
        description: Keeps only the sources with this monitor tag (E3.5-6). The value is trimmed and lowercased first; a value that fails the tag grammar is a 400 with reason `invalid_tag`. A blank value is no filter.
        schema:
          type: string
          maxLength: 32
      responses:
        '200':
          description: Source page
          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Source'
