  /v1/agent/runs/{run_id}/tabs/{tab_id}/mark:
    post:
      operationId: markAgentTab
      summary: Nominate the delegate's attached tab for handoff (dark; the delegate only)
      description: >-
        WS8.F. The service principal that holds a live attachment on this tab, with its attach grant,
        nominates the tab. The nomination hands the tab to the person at once: its holder becomes human,
        so the delegate takes no further step on it. A successful release (`DELETE .../attach/{attach_id}`
        with the default `release`) then keeps an agent-opened tab open for the owner, if the grant still
        passes the check made at release; a borrowed tab always goes back to its owner. Both `mark` values
        are accepted and echoed, and the ledger keeps no separate deliverable state, so they have the same
        effect today. A closed run, a ZDR run, or a tab that is not this delegate's attached tab is 404. A
        grant that is no longer usable for the run is 403 attach_grant_invalid.
      tags:
      - agent
      parameters:
      - $ref: '#/components/parameters/AgentRunId'
      - $ref: '#/components/parameters/AgentTabId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - grant_id
              - mark
              properties:
                grant_id:
                  type: string
                mark:
                  type: string
                  enum:
                  - deliverable
                  - handoff
      responses:
        '200':
          description: The tab and the mark that was recorded
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    required:
                    - tab_id
                    - mark
                    properties:
                      tab_id:
                        type: string
                      mark:
                        type: string
                        enum:
                        - deliverable
                        - handoff
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '400':
          description: mark is neither deliverable nor handoff (invalid tab mark)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
        '403':
          description: The attach grant is no longer usable for this run (attach_grant_invalid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
        '404':
          description: Run not found, closed or under ZDR, or the tab is not this delegate's attached tab
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
