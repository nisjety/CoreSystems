              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/profiles:
    get:
      operationId: list_profiles
      summary: Profiles the caller may see (WS17.P0 principal and ZDR guard; WS17.P2 owner filter)
      description: A service principal is refused on every profile route. Under a ZDR posture the list stays open (wind-down).
      responses:
        '200':
          description: Profile summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileList'
        '403':
          description: A service principal.
    post:
      operationId: save_profile
      summary: Save a profile snapshot (the import write path). Needs the quarry:profiles:import scope (WS17.P0).
      description: The request body carries the snapshot (cookie values and storage). The body is never returned. Up to 4 MiB; past it the request answers 413.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [snapshot]
              properties:
                profile_id:
                  type: string
                snapshot:
                  type: object
                  description: SessionSnapshot wire shape. Input only.
      responses:
        '200':
          description: The saved profile id. An ignored save (stale or tombstoned) still answers 200.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile_id:
                    type: string
        '403':
          description: A service principal; a token without quarry:profiles:import; or a ZDR organization with QUARRY_EDGE__ZDR_REFUSE_DURABLE_RESOURCES on (error details zdr_refusal.action save).
        '413':
          description: The body is over 4 MiB.
  /v1/profiles/create:
    post:
      operationId: create_profile
      summary: Create a named, scoped profile owned by the caller (WS17.P0 guard)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                name:
                  type: string
                scope:
                  type: string
                  enum: [user_private, org_shared, run_scoped]
      responses:
        '200':
          description: The created profile summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSummary'
        '400':
          description: Bad request, or the ephemeral scope.
        '403':
          description: A service principal, or a ZDR organization with the flag on (action create).
  /v1/profiles/{profile_id}:
    get:
      operationId: get_profile
      summary: Redacted view of one profile (WS17.P0). No cookie value, no storage value, no IndexedDB value.
      parameters:
        - name: profile_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The redacted profile. Cookie values are null with value_len set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDetail'
        '403':
          description: A service principal, or a ZDR organization with the flag on (action read).
        '404':
          description: Not found, or not visible to the caller under enforce.
    patch:
      operationId: update_profile
      summary: Rename and/or rescope a profile. Owner only on an org-shared row (WS17.P2).
      parameters:
        - name: profile_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                scope:
                  type: string
                  enum: [user_private, org_shared, run_scoped]
      responses:
        '200':
          description: The updated profile summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSummary'
        '400':
          description: Bad request.
        '403':
          description: A service principal, or a ZDR organization with the flag on (action update).
        '404':
          description: Not found, or not the owner under enforce.
    delete:
      operationId: delete_profile
      summary: Erase a profile. Never refused on the ZDR side (wind-down).
      parameters:
        - name: profile_id
          in: path
          required: true
