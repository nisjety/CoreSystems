  /v1/profiles/{profile_id}/restore_probe:
    post:
      operationId: restore_probe_profile
      summary: Whether a profile can be restored at this instant. No browser is started (WS17.P0).
      parameters:
        - name: profile_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
      responses:
        '200':
          description: The restore summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileRestoreProbe'
        '403':
          description: A service principal, or a ZDR organization with the flag on (action probe).
        '404':
          description: Not found, or not visible to the caller under enforce.
  /v1/profiles/{profile_id}/clear-data:
    post:
      operationId: clear_profile_data
      summary: Remove a stored profile's cookies, web storage and IndexedDB (F-t2-068). Off unless QUARRY_EDGE__PROFILE_CLEAR_DATA is on.
      description: |
        Removes the browsing data a stored profile holds and keeps the profile, its name, scope,
        owner, user agent, viewport, locale and timezone. `dry_run` defaults to true: a call that
        does not send `dry_run: false` only counts what it would remove. The answer carries counts
        only, never a name or a value.

        A profile a live run holds is refused with 409 `profile_in_use` until that run closes,
        because its browser session would save the profile again. A ZDR organization is not
        refused (the route is a wind-down, like delete). A service principal is refused.
      parameters:
        - name: profile_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run:
                  type: boolean
                  default: true
      responses:
        '200':
          description: The counts, and whether this call removed them.
          content:
            application/json:
              schema:
                type: object
                required: [profile_id, dry_run, cleared, counts]
                properties:
                  profile_id:
                    type: string
                  dry_run:
                    type: boolean
                  cleared:
                    type: boolean
                    description: True when this call removed the data. False on a dry run, and when nothing was there.
                  counts:
                    type: object
                    required: [cookies, local_storage_entries, session_storage_entries, indexed_db_rows, origins]
                    properties:
                      cookies:
                        type: integer
                      local_storage_entries:
                        type: integer
                      session_storage_entries:
                        type: integer
                      indexed_db_rows:
                        type: integer
                      origins:
                        type: integer
        '403':
          description: A service principal.
        '404':
          description: Not found, or not visible to the caller under enforce.
        '409':
          description: A live run holds the profile (`profile_in_use`), or the profile was written during the clear (`profile_busy`; retry).
        '501':
          description: The flag is off (`profile_clear_data_disabled`).
  /v1/webhook-subscriptions:
    post:
      operationId: create_webhook_subscription
      summary: Subscribe an HTTPS endpoint to change events (INNH-5)
      description: |
        Registers a webhook for the caller's organization. Quarry sends the endpoint a signed
        `POST` for every event type named in `events`; v1 has one: `change_detected` (the stored
        event type; the `payload.subject` of the delivery stays `quarry.change.detected`).
        The delivery format, the signature and the retry rules are in `docs/CONTRACTS.md`,
        section 4.

        The response carries the HMAC `secret` (`whsec_` and 64 hex characters). It is shown
        here once and by `rotate-secret`; no read returns it again, only `secret_hint`.

        The URL must be `https`, carry no credentials or fragment, be at most 2048 characters,
        and resolve only to public addresses (a private, loopback, link-local, metadata or
        carrier-grade-NAT address is refused; every delivery is vetted again at connect time).
        An organization holds at most 10 subscriptions. Unknown body fields are a 400. The optional
        `notify_on_change` narrows which change types the subscription takes (`NotifyOnChangeFilter`).

        Off unless the edge runs with `QUARRY_EDGE__WEBHOOK_SUBSCRIPTIONS` on and control with
        `QUARRY_CONTROL__WEBHOOK_SUBSCRIPTIONS` on (501 otherwise). A Zero Data Retention
        caller gets 403 (`details.reason` is `webhook_off_process`): a subscription pushes page
        URLs off-process.
      tags:
      - webhooks
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookSubscription'
      responses:
        '201':
          description: The subscription and its secret, once.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/WebhookSubscriptionCreated'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '400':
          description: A field is invalid. `error.details.field` is `url`, `events`, `description` or `body`; `error.details.reason` is one of `url_invalid`, `url_too_long`, `url_not_https`, `url_userinfo`, `url_fragment`, `url_private_address`, `url_unresolvable`, `events_empty`, `events_unsupported`, `description_too_long`, `body_invalid`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: The token's ZDR floor is set (`error.details.reason` is `webhook_off_process`), or the caller is a service principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: The organization already has a subscription with this URL and these events (`error.details.reason` is `subscription_exists`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: The organization holds the maximum of 10 subscriptions (`error.details.reason` is `subscription_limit`, `error.details.limit` is 10).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Not enabled (QUARRY_EDGE__WEBHOOK_SUBSCRIPTIONS on the edge, QUARRY_CONTROL__WEBHOOK_SUBSCRIPTIONS on control; the message names the one that is off).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    get:
      operationId: list_webhook_subscriptions
      summary: List the organization's webhook subscriptions (INNH-5)
      description: Newest first. Never returns a secret. Each item carries the status of its latest delivery in `last_delivery`.
      tags:
      - webhooks
      security:
      - bearerAuth: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        required: false
        description: The `next_cursor` of the previous page.
        schema:
          type: string
          maxLength: 256
      responses:
        '200':
          description: One page of subscriptions.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/WebhookSubscriptionList'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '400':
          description: A bad `limit` or `cursor` (`error.details.field`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Not enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/webhook-subscriptions/{subscription_id}:
    get:
      operationId: get_webhook_subscription
      summary: Read one webhook subscription (INNH-5)
      tags:
      - webhooks
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WebhookSubscriptionId'
      responses:
        '200':
          description: The subscription. No secret.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/WebhookSubscription'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '404':
          description: Unknown id, an id of another organization (the same answer), or a malformed id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Not enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    patch:
      operationId: update_webhook_subscription
      summary: Pause, resume or change the events of a subscription (INNH-5)
      description: |
        Names at least one of `active`, `events`, `description`, `notify_on_change`. A `null`
        `notify_on_change` removes the filter. The URL is not editable: delete
        the subscription and create a new one, so every target goes through the create-time
        check. Refused for a Zero Data Retention caller (403, `webhook_off_process`), because it
        can resume pushing.
      tags:
      - webhooks
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WebhookSubscriptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookSubscription'
      responses:
        '200':
          description: The subscription after the change.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/WebhookSubscription'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '400':
          description: No field named (`reason` is `empty_patch`), an unsupported event, a description over 200 characters, a `notify_on_change` refused for `notify_types_empty`, `notify_type_unsupported` or `notify_min_delta_out_of_range`, or an unknown field (`body_invalid`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Zero Data Retention (`error.details.reason` is `webhook_off_process`), or a service principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Unknown or foreign id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Not enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    delete:
      operationId: delete_webhook_subscription
      summary: Delete a subscription and its delivery log (INNH-5)
      description: A hard delete. Pending deliveries of the subscription are dropped with it. Open to a Zero Data Retention caller (wind-down).
      tags:
      - webhooks
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WebhookSubscriptionId'
      responses:
        '204':
          description: Deleted. No body.
        '404':
          description: Unknown or foreign id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Not enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/webhook-subscriptions/{subscription_id}/rotate-secret:
    post:
      operationId: rotate_webhook_subscription_secret
      summary: Mint a new secret for a subscription (INNH-5)
      description: The old secret stops working at once; deliveries already queued are signed with the new one. The new secret is in this response only.
      tags:
      - webhooks
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WebhookSubscriptionId'
      responses:
        '200':
          description: The new secret, once.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/WebhookSecretRotated'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '404':
          description: Unknown or foreign id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Not enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/webhook-subscriptions/{subscription_id}/deliveries:
    get:
      operationId: list_webhook_deliveries
      summary: The delivery log of a subscription (INNH-5)
      description: |
        Newest first. A delivery shows its status and attempt count, never the payload or the
        raw error: `last_error` is `http_<status>`, `timeout`, `blocked_target`, `transport`,
        `inactive` or `error`. A delivery is `dlq` after five failed attempts or at once on a
        4xx other than 408 and 429. Finished deliveries are deleted after 14 days.
      tags:
      - webhooks
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WebhookSubscriptionId'
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - pending
          - in_flight
          - success
          - failed
          - dlq
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 256
      responses:
        '200':
          description: One page of deliveries.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/WebhookDeliveryList'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '400':
          description: A bad `status`, `limit` or `cursor` (`error.details.field`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Unknown or foreign subscription id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Not enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/webhook-subscriptions/{subscription_id}/deliveries/{delivery_id}/retry:
    post:
      operationId: retry_webhook_delivery
      summary: Re-queue a failed delivery (INNH-5)
      description: Only a `failed` or `dlq` delivery can be retried (409 `delivery_not_retryable` otherwise). The attempt count restarts at zero. Refused for a Zero Data Retention caller.
      tags:
      - webhooks
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WebhookSubscriptionId'
      - name: delivery_id
        in: path
        required: true
        schema:
          type: string
          pattern: '^whkd_'
      responses:
        '202':
          description: The delivery, now pending.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/WebhookDeliveryView'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '403':
          description: Zero Data Retention (`webhook_off_process`), or a service principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Unknown or foreign subscription or delivery id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: The delivery is pending, in flight or delivered (`error.details.reason` is `delivery_not_retryable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Not enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/parse:
    post:
      operationId: parse_document
      summary: Parse an uploaded PDF or DOCX to text and store nothing (INNH-11)
      description: >-
        The request body is the document's raw bytes, not a URL and not multipart (a URL is
        `POST /v1/scrape` with QUARRY_EDGE__DOC_ROUTING=on). The answer is the document's text in
        the typed envelope. Nothing is stored: no artifact, no cache entry, no index row, no durable
        event, no usage record, no ingest; the response carries `Cache-Control: no-store`, and no
        filename or text is logged. The route is idempotent and has no side effect.


        The bytes decide the kind (PDF or DOCX); `Content-Type` is only checked. It may be absent,
        `application/octet-stream`, `application/pdf` or the DOCX media type; any other type is a
        415, and a PDF or DOCX type that the bytes contradict is a 415 `content_type_mismatch`.
        The body limit is 25 MiB (QUARRY_EDGE__PARSE_MAX_BYTES lowers it). The parse runs in an
        isolated child process under memory and CPU limits with a 15 second deadline. An
        organisation may have one parse in flight (QUARRY_EDGE__PARSE_CONCURRENCY_PER_ORG); a second
        gets a 429 with `Retry-After` before its body is read.


        The text is plain (`structure: plain`): paragraphs, no headings, lists or tables. A PDF page
        with no text layer (a scan) has no text and a `document_has_no_text_layer` warning (or
        `some_pages_have_no_text_layer`); there is no OCR. No redaction is applied to the returned
        text: personal data in the document comes back as it is.


        Dark: with QUARRY_EDGE__PARSE_ROUTE off (the default) the route answers 501. A service
        principal needs the `parse:write` scope; a user token needs none.
      tags:
        - parse
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
          application/vnd.openxmlformats-officedocument.wordprocessingml.document:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: The text of the document.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseResponse'
        '400':
          description: An empty body (`details.reason` `empty_body`), or a body that could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseError'
        '401':
          description: No valid token.
        '403':
          description: A service principal without the `parse:write` scope.
        '413':
          description: The body is over the limit (`details.reason` `too_large`, `details.max_bytes`), by its declared length or by its bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseError'
        '415':
          description: >-
            Not a document the route reads. `details.reason` is `unsupported_media` (the bytes are
            not a PDF or DOCX, or the declared type is not one the route takes),
            `content_type_mismatch` (the declared type names the other document type than the
            bytes), `pdf_parse_failed` or `docx_parse_failed` (the parser could not read the file,
            or was stopped by its limits), or `too_large` (the parser's own size or inflate limit).
            `details.supported` is `[pdf, docx]`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseError'
        '429':
          description: >-
            The organisation already has a document being parsed (`org_parse_busy`), the process is
            buffering as many uploads as it will (`parse_capacity`), or the parser stayed busy
            (`parser_busy`). `Retry-After` says when to come back.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseError'
        '501':
          description: >-
            Off (`details.reason` `parse_route_disabled`, `details.env` QUARRY_EDGE__PARSE_ROUTE), or on
            while documents would be parsed inside the edge (`isolation_required`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseError'
        '504':
          description: The parse did not finish in 15 seconds (`TIMEOUT`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseError'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        A caller-chosen key for POST /v1/batch and POST /v1/crawl. At most 128 bytes after trimming. An empty,
        longer or not visible ASCII value is ignored, as if no key were sent. Keys are unique per organization
        (control migration 028). A repeated key answers 200 with the job the first request created (the same
        job_id), and that repeat is not billed again. With QUARRY_EDGE__BATCH_IDEMPOTENCY on, a batch that reuses
        a key for a different URL list or ingest flag is a 409 CONFLICT with details.reason idempotency_key_reused.
        With the flag off, or on a crawl, a reused key re-attaches to the held job whatever the body says.
      schema:
        type: string
        maxLength: 128
    WebhookSubscriptionId:
      name: subscription_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^whk_'
      description: A webhook subscription id (`whk_...`) of the caller's organization
    AgentRunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
      description: Tenant-owned Quarry run identifier
    AgentTabId:
      name: tab_id
      in: path
      required: true
      schema:
        type: string
      description: A tab id from the run's tab list
    TabInitiatedBy:
      name: initiatedBy
      in: query
      required: false
      schema:
        type: string
        enum:
        - human
        - agent
      description: >-
        Who is making the call. Can only tighten: `agent` on a person's token makes it an
        agent's, and a service principal is always an agent. `initiated_by` is accepted
        too (both in one request is an error).
    TabAiRunId:
      name: aiRunId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/AdvisoryIdentifier'
      description: ADVISORY. The AI run the caller says it acts for. Recorded, never trusted. `ai_run_id` is accepted too.
    TabAgentLabel:
      name: agentLabel
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/AdvisoryIdentifier'
      description: ADVISORY. A short label the caller gave its agent. Recorded, never trusted. `agent_label` is accepted too.
  schemas:
    ParseWarning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [document_has_no_text_layer, some_pages_have_no_text_layer, document_has_no_text, truncated_at_8mib]
          description: >-
            `document_has_no_text_layer`: no page of the PDF has text (a scan; no OCR).
            `some_pages_have_no_text_layer`: some do not, and their text is missing.
            `document_has_no_text`: a DOCX with no text. `truncated_at_8mib`: the text was cut.
        message:
          type: string
    ParseData:
      type: object
      required: [markdown, kind, bytes, structure, truncated, warnings]
      properties:
        markdown:
          type: string
          description: The text of the document. Plain paragraphs, see `structure`.
        kind:
          type: string
          enum: [pdf, docx]
          description: What the bytes were read as.
        bytes:
          type: integer
          description: The size of the uploaded document.
        structure:
          type: string
          enum: [plain]
          description: Paragraphs only. Headings, lists and tables are not marked up.
        truncated:
          type: boolean
          description: The text was cut at 8 MiB.
        pages:
          type: integer
          description: Pages of a PDF. Absent for a DOCX.
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ParseWarning'
    ParseResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/ParseData'
        meta:
          type: object
          required: [request_id]
          properties:
            request_id:
              type: string
    ParseError:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [BAD_REQUEST, UNSUPPORTED_MEDIA, RATE_LIMITED, UNSUPPORTED, TIMEOUT, INTERNAL]
            message:
              type: string
            details:
              type: object
              properties:
                reason:
                  type: string
                  description: >-
                    empty_body, body_unreadable, too_large, unsupported_media, content_type_mismatch,
                    pdf_parse_failed, docx_parse_failed, org_parse_busy, parse_capacity, parser_busy,
                    parse_route_disabled, isolation_required.
                kind:
                  type: string
                detected:
                  type: string
                  description: What the bytes were (`html`, `image`, `archive`, `binary`, `pdf`, `docx`, ...).
                declared:
                  type: string
                supported:
                  type: array
                  items:
                    type: string
                    enum: [pdf, docx]
                max_bytes:
                  type: integer
                retry_after_seconds:
                  type: integer
                env:
                  type: string
        meta:
          type: object
          properties:
            request_id:
              type: string
    ProfileSummary:
      type: object
      required: [profile_id, scope, owner_is_caller]
      properties:
        profile_id:
          type: string
        name:
          type: [string, 'null']
        scope:
          type: string
          enum: [ephemeral, user_private, org_shared, run_scoped]
        owner_is_caller:
          type: boolean
          description: True when the caller owns the profile (WS17.P2).
    ProfileList:
      type: object
      required: [profiles]
      properties:
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ProfileSummary'
    ProfileCookieView:
      type: object
      description: One cookie with every attribute except its value.
      required: [name, domain, path, secure, http_only, session, value_len, value]
      properties:
        name:
          type: string
        domain:
          type: string
        path:
          type: string
        secure:
          type: boolean
        http_only:
          type: boolean
        session:
          type: boolean
          description: True for a session cookie (no expiry).
        expires:
          type: [string, 'null']
          format: date-time
        same_site:
          type: [string, 'null']
          enum: [strict, lax, none, null]
          description: SameSite attribute. Null on a snapshot written before capture v2 (WS17.C1).
        value_len:
          type: integer
          minimum: 0
          description: Length of the stored value in bytes.
        value:
          type: [string, 'null']
          description: Always null. A cookie value is never returned.
    ProfileOriginView:
      type: object
      required: [origin, idb_databases, idb_rows]
      properties:
        origin:
          type: string
        idb_databases:
          type: array
          items:
            type: string
        idb_rows:
          type: integer
          minimum: 0
          description: Row count only. No key and no value.
        local_storage_count:
          type: integer
          minimum: 0
          description: Web storage entries of this origin (capture v2; 0 on a legacy snapshot).
        session_storage_count:
          type: integer
          minimum: 0
        truncated:
          type: boolean
          description: The capture cut this origin short (a size cap or the time budget).
    ProfileView:
      type: object
      description: The redacted snapshot (WS17.P0). Shapes and counts only, never a secret value.
      required: [cookies, local_storage_count, session_storage_count, origins, has_user_agent, has_viewport, truncated]
      properties:
        cookies:
          type: array
          items:
            $ref: '#/components/schemas/ProfileCookieView'
        local_storage_count:
          type: integer
          minimum: 0
        session_storage_count:
          type: integer
          minimum: 0
        origins:
          type: array
          description: One entry per origin with IndexedDB or (capture v2) web storage. A legacy snapshot lists IndexedDB origins only.
          items:
            $ref: '#/components/schemas/ProfileOriginView'
        locale:
          type: [string, 'null']
        timezone:
          type: [string, 'null']
        has_user_agent:
          type: boolean
        has_viewport:
          type: boolean
        truncated:
          type: boolean
          description: A capture cut at least one origin short (capture v2). False on a legacy snapshot.
    ProfileDetail:
      description: The data of GET /v1/profiles/{profile_id}. The ProfileView fields are flattened in beside these.
      allOf:
        - $ref: '#/components/schemas/ProfileView'
        - type: object
          required: [profile_id, scope, owner_is_caller]
          properties:
            profile_id:
              type: string
            name:
              type: [string, 'null']
            scope:
              type: string
            owner_is_caller:
              type: boolean
    ProfileRestoreProbe:
      type: object
