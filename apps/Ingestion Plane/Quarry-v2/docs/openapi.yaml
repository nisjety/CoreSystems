    BaselineSnapshot:
      type: object
      required:
      - baseline_id
      - org_id
      - source_url
      - fingerprint
      - captured_at
      properties:
        baseline_id:
          type: string
          description: bln_<ulid>
        org_id:
          type: string
        source_url:
          type: string
          format: uri
        fingerprint:
          type: string
          description: blake3 of canonicalized content
        artifact_id:
          type: string
          nullable: true
          description: The stored markdown of this version (INNH-4). Set on a baseline a change monitor recorded with QUARRY_EDGE__CHANGE_TEXT_DIFF on; absent on older baselines and always under Zero Data Retention.
        prev_baseline_id:
          type: string
          nullable: true
          description: Singly-linked chain pointer
        captured_at:
          type: string
          format: date-time
        run_id:
          type: string
          nullable: true
    ChangeRecord:
      type: object
      required:
      - source_url
      - org_id
      - status
      - checked_at
      properties:
        source_url:
          type: string
          format: uri
        org_id:
          type: string
        status:
          type: string
          enum:
          - new
          - unchanged
          - changed
          - unreachable
        new_baseline:
          $ref: '#/components/schemas/BaselineSnapshot'
        prev_baseline:
          $ref: '#/components/schemas/BaselineSnapshot'
        diff_id:
          type: string
          nullable: true
          description: Present only for status=changed. A monitor's change event carries it with QUARRY_EDGE__CHANGE_TEXT_DIFF on (`GET /v1/change/diff?diff_id=`).
        checked_at:
          type: string
          format: date-time
    ChangeDiffView:
      type: object
      description: The data of GET /v1/change/diff (INNH-4)
      required:
      - source_url
      - from
      - to
      - diff_id
      - available
      properties:
        source_url:
          type: string
          format: uri
        from:
          nullable: true
          description: The older version. null when the url has one baseline only.
          allOf:
          - $ref: '#/components/schemas/ChangeDiffSide'
        to:
          $ref: '#/components/schemas/ChangeDiffSide'
        diff_id:
          type: [string, 'null']
          description: The stored diff record of the pair. null when none was stored (the pair is not a change the monitor recorded, or it was recorded before text diffs); the diff is then computed for this request.
        available:
          type: boolean
          description: True when `diff` is present.
        reason:
          $ref: '#/components/schemas/ChangeDiffUnavailable'
        diff:
          $ref: '#/components/schemas/ParagraphDiff'
        markdown:
          $ref: '#/components/schemas/ChangeDiffMarkdown'
    ChangeDiffSide:
      type: object
      required:
      - baseline_id
      - fingerprint
      - captured_at
      - artifact_id
      properties:
        baseline_id:
          type: string
        fingerprint:
          type: string
          description: blake3 of the raw page bytes
        captured_at:
          type: string
          format: date-time
        artifact_id:
          type: [string, 'null']
          description: The stored markdown (`GET /v1/artifacts/{id}`). null for a baseline recorded without text.
    ChangeDiffUnavailable:
      type: string
      description: Why a diff is not available. Absent when it is.
      enum:
      - no_previous_version
      - no_previous_text
      - no_text
      - artifact_gone
    ChangeDiffMarkdown:
      type: object
      description: Only with include=markdown. Each text is cut at 1 MiB.
      required:
      - from
      - to
      - truncated
      properties:
        from:
          type: [string, 'null']
        to:
          type: [string, 'null']
        truncated:
          type: boolean
    ParagraphDiff:
      type: object
      required:
      - format
      - real_delta
      - added
      - removed
      - moved
      - unchanged
      - ops
      - truncated
      properties:
        format:
          type: string
          enum:
          - paragraph
        real_delta:
          type: boolean
          description: False when no paragraph was added or removed.
        added:
          type: integer
        removed:
          type: integer
        moved:
          type: integer
        unchanged:
          type: integer
        ops:
          type: array
          maxItems: 500
          description: Added and removed ops first, then moved ones.
          items:
            $ref: '#/components/schemas/TextDiffOp'
        truncated:
          type: boolean
          description: An op was dropped, a text was cut at 2 KB, or an input page was cut at 1 MiB. The counts are complete.
    TextDiffOp:
      type: object
      required:
      - op
      properties:
        op:
          type: string
          enum:
          - added
          - removed
          - moved
        index:
          type: integer
          description: For added, the paragraph's position in the newer text; for removed, in the older text.
        text:
          type: string
          maxLength: 2048
          description: For added and removed. Cut at 2 KB on a character boundary.
        from:
          type: integer
          description: For moved, the paragraph's position in the older text.
        to:
          type: integer
          description: For moved, its position in the newer text.
    OverlapPolicy:
      type: string
      enum:
      - cancel
      - skip
      - allow
      default: skip
    ScheduleSummary:
      type: object
      required:
      - schedule_id
      - org_id
      - name
      - kind
      - overlap_policy
      - catchup_window_s
      - pause_on_failure
      - status
      - created_at
      properties:
        timezone:
          type: string
          default: UTC
          description: IANA zone the cron is read in (WS15.S1).
        jitter_s:
          type: integer
          minimum: 0
          description: Spread of each fire in seconds (WS15.S1).
        needs_activation:
          type: boolean
          description: True for a non-monitor schedule created disabled and never toggled (WS15.S1).
        schedule_id:
          type: string
        org_id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
          - crawl
          - search
          - extract
          - research
          - agent
          - batch
          - scrape
        cron:
          type: string
          nullable: true
          description: Standard 5-field cron; absent for one-shot schedules
        schedule_at:
          type: string
          format: date-time
          nullable: true
          description: One-shot trigger time; mutually exclusive with cron
        overlap_policy:
          $ref: '#/components/schemas/OverlapPolicy'
        catchup_window_s:
          type: integer
          format: int64
        pause_on_failure:
          type: boolean
        status:
          type: string
          enum:
          - active
          - paused
          - deleted
        created_at:
          type: string
          format: date-time
        last_run_at:
          type: string
          format: date-time
          nullable: true
        next_run_at:
          type: string
          format: date-time
          nullable: true
        config:
          description: Per-kind payload the schedule was created with
        tag:
          type: string
          maxLength: 32
          description: The operator label that groups this monitor (E3.5-6). Absent when untagged.
    CreateScheduleRequest:
      type: object
      properties:
        name:
          type: string
        activate:
          type: boolean
          default: false
          description: Start the schedule when created (WS15.S1). Honoured only for a user token; a service token value is ignored. Without it the schedule is created disabled and needs_activation is true.
        timezone:
          type: string
          default: UTC
          description: IANA zone the cron is read in (WS15.S1).
        catchup_window_s:
          type: integer
          minimum: 0
          maximum: 86400
          format: int64
          default: 0
          description: Catch-up window for missed fires (WS15.S1).
        pause_on_failure:
          type: boolean
          default: false
        kind:
          type: string
          enum:
          - crawl
          - search
          - extract
          - research
          - agent
          - batch
          - scrape
          description: Optional when preset-driven (W2 change-monitor create)
        cron:
          type: string
          nullable: true
        schedule_at:
          type: string
          format: date-time
          nullable: true
        overlap_policy:
          $ref: '#/components/schemas/OverlapPolicy'
        preset:
          type: string
          nullable: true
          description: When set, this is a W2 change-monitor create; target_ref becomes required. The preset becomes the cron (hourly, daily or weekly).
        target_ref:
          type: string
          nullable: true
          description: URL to watch for change-monitor schedules
        tag:
          type: string
          maxLength: 32
          description: The operator label that groups this monitor (E3.5-6). Trimmed and lowercased; 1 to 32 characters of letters a to z, digits, dot, underscore or hyphen, starting with a letter or digit. Blank is untagged.
        config:
          type: object
          additionalProperties: true
        source_id:
          type: string
          nullable: true
          description: >-
            The id of a saved job definition (src_ and a ULID) that an executable schedule runs in place of config
            (E4.1-6). The schedule's target_ref becomes this id, and its config is built from the definition when the
            schedule is created. Only a crawl is schedulable, and a scrape with no options; a batch is refused with 400
            saved_job_not_schedulable, and a non-empty config with 400 config_conflicts_with_source_id. Answers 501 while
            QUARRY_EDGE__SAVED_JOBS is off.
    StartAgentRunRequest:
      type: object
      properties:
        constraints:
          $ref: '#/components/schemas/AgentConstraints'
        profile_id:
          type: string
          nullable: true
        persist_profile:
          type: boolean
          default: false
        viewport:
          type: object
          nullable: true
          properties:
            width:
              type: integer
            height:
              type: integer
            device_scale_factor:
              type: number
            is_mobile:
              type: boolean
        zdr:
          type: boolean
          default: false
        grant_id:
          type: string
          nullable: true
        resume_run_id:
          type: string
          nullable: true
        initiated_by:
          type: string
          nullable: true
          description: >-
            Set to "agent" for a model-driven run. A run is budgeted (steps,
            attempts, active runtime, estimated cost) when it is an agent run:
            a service principal is one whatever it sends. The hint can only
            tighten: it never turns an agent run into an interactive one.
            `initiatedBy` is accepted too.
        execution_tier:
          type: string
          enum:
          - chromium
          - ephemeral_evidence
          default: chromium
          description: Experimental ephemeral_evidence forces a disposable no-profile, no-resume, no-durable-state run and remains gated by isolated egress/security proof. Its current explicit engine is
            Chromium fallback, not a claim of a production Lite renderer.
        policy:
          description: >-
            WS7.D web policy ask. Tighten-only: `disable` names capabilities
            (browser.act.input, browser.act.interact, browser.act.upload,
            browser.act.download, browser.profile.persistent, search.paid_provider,
            and the others of the catalogue), `deny_domains` and `allow_domains`
            narrow the hosts, `robots_max` and `proxy_max` lower ceilings. It can
            never loosen the operator baseline or the ZDR floor. Resolved once at
            start; a resumed run does not carry it. Unknown keys are 400.
          allOf:
          - $ref: '#/components/schemas/RequestAsk'
        driver_requirements:
          $ref: '#/components/schemas/BrowserDriverCapabilities'
    BrowserDriverCapabilities:
      type: object
      description: Requested or selected execution capabilities. Every true value is an affirmative provider claim; omitted values are not inferred. Agent runs always require isolated_egress and security_evidence
        regardless of optional requirements.
      properties:
        persistent_profile:
          type: boolean
          default: false
        devtools_trace:
          type: boolean
          default: false
        downloads_to_artifacts:
          type: boolean
          default: false
        uploads_from_artifacts:
          type: boolean
          default: false
        full_visual_fidelity:
          type: boolean
          default: false
        isolated_egress:
          type: boolean
          default: false
        security_evidence:
          type: boolean
          default: false
        atomic_target_actions:
          type: boolean
          default: false
        trusted_input:
          type: boolean
          default: false
          description: >-
            True when the driver runs with QUARRY_BROWSER_TRUSTED_INPUT=on. A click_ref, type_ref or
            select_ref on a top-level ref is then checked (visible, enabled, still, not covered) and a click
            and a type are real browser input (event.isTrusted is true). Reported only: a requirement for it in
            driver_requirements is ignored. An older peer omits it and it reads as false.
        profile_pin:
          type: boolean
          default: false
          description: >-
            True when the driver can restore a stored browser profile read-only into a scrape pinned to it (E4.4-b,
            the scrape option is dark behind QUARRY_EDGE__SCRAPE_PROFILE_PIN). The profile is never saved back.
            Reported only: a requirement for it in driver_requirements is ignored. An older peer omits it and it
            reads as false.
    AgentConstraints:
      type: object
      required:
      - max_steps
      properties:
        max_steps:
          type: integer
          minimum: 0
        allowed_domains:
          type: array
          items:
            type: string
        max_runtime_s:
          type: integer
          nullable: true
        max_cost_usd:
          type: number
          nullable: true
    Envelope_StartAgentRun:
      type: object
      required:
      - request_id
      - success
      - data
      properties:
        request_id:
          type: string
        success:
          type: boolean
        data:
          type: object
          required:
          - run_id
          - lease_id
          - profile_id
          - driver_capabilities
          - execution_tier
          - execution_engine
          properties:
            run_id:
              type: string
            lease_id:
              type: string
            profile_id:
              type: string
            driver_capabilities:
              $ref: '#/components/schemas/BrowserDriverCapabilities'
            execution_tier:
              type: string
              enum:
              - chromium
              - ephemeral_evidence
            execution_engine:
              type: string
              enum:
              - chromium
              - chromium_fallback
            constraints:
              type: object
              description: >-
                The bounds the run runs under after defaults and ceilings.
                Present when QUARRY_EDGE__BUDGET_ENFORCEMENT is not off.
                max_* are absent for an interactive (human) run, which is
                never capped. Cost is estimated from a flat action table.
              properties:
                class:
                  type: string
                  enum:
                  - interactive
                  - agent
                enforcement:
                  type: string
                  enum:
                  - shadow
                  - 'on'
                  description: shadow records what would be refused and refuses nothing.
                max_steps:
                  type: integer
                max_runtime_s:
                  type: integer
                max_cost_usd:
                  type: number
                estimated:
                  type: boolean
            clamped:
              type: array
              description: Requested values that were replaced.
              items:
                type: object
                properties:
                  field:
                    type: string
                    enum:
                    - max_steps
                    - max_runtime_s
                    - max_cost_usd
                  requested:
                    type: number
                    nullable: true
                  effective:
                    type: number
                  by:
                    type: string
                    description: >-
                      What replaced the requested value: the agent default, the
                      ceiling, or a tighter budget claim carried by the broker grant
                      (QUARRY_EDGE__GRANT_BUDGET_CLAIM=enforce).
                    enum:
                    - default
                    - ceiling
                    - grant
    AdvisoryIdentifier:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9._:-]+$'
      description: >-
        An identifier-shaped value the caller chose. A value of any other shape is
        dropped, not rejected, so it can never carry a URL or a page title into a
        stored record.
    AgentIdentity:
      type: object
      required:
      - basis
      description: >-
        Which agent was behind an operation an agent initiated. Ids and classes only.
        Only `principalId` of a `service_principal` basis is verified (it is the
        calling token's signed service id); `aiRunId` and `label` are what the caller
        said, advisory, and never used to decide anything.
      properties:
        basis:
          type: string
          enum:
          - service_principal
          - user_session
          description: >-
            `service_principal`: the call carried a service principal's own token.
            `user_session`: it carried a person's token with an `agent` hint, so the
            token proves the person, not which agent.
        principalId:
          type: string
          description: The signed service id of the caller. Present only for `service_principal`.
        aiRunId:
          $ref: '#/components/schemas/AdvisoryIdentifier'
        label:
          $ref: '#/components/schemas/AdvisoryIdentifier'
    TabOpener:
      type: object
      required:
      - initiatedBy
      description: Who opened a tab (`openedBy` on a tab of the owner projection).
      properties:
        initiatedBy:
          type: string
          enum:
          - human
          - agent
        agent:
          $ref: '#/components/schemas/AgentIdentity'
        unattributed:
          type: boolean
          description: >-
            Present (true) when the run already held the most full opener records it
            keeps (256), so only `initiatedBy` was kept for this tab and an agent's ids
            were dropped. The tab was opened through the tab routes; which agent did it
            is not recorded. Absent on a full record.
    AgentTab:
      type: object
      required:
      - tabId
      - active
      properties:
        tabId:
          type: string
        title:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        active:
          type: boolean
    OpenAgentTabRequest:
      type: object
      properties:
        url:
          type: string
          nullable: true
          description: Navigate the new tab here; it must be inside the run's allowed domains.
        initiatedBy:
          type: string
          enum:
          - human
          - agent
          description: >-
            Who is opening the tab. Can only tighten (see `TabInitiatedBy`).
            `initiated_by` is accepted too; both in one body, or any other value, is a 422.
        aiRunId:
          $ref: '#/components/schemas/AdvisoryIdentifier'
        agentLabel:
          $ref: '#/components/schemas/AdvisoryIdentifier'
    HitTestData:
      type: object
      description: >-
        E3.3-h. The answer for one point. `hit` says whether the browser found a node under it. `ref` is set
        only when that node, or one of its accessibility ancestors, is a target of the caller's last
        observation of the run; `snapshotId` and `generation` then name that snapshot. Without a `ref`,
        `reason` says why. No backend node id and no frame id are carried.
      required:
      - hit
      - ref
      - snapshotId
      - generation
      - role
      - name
      - reason
      - zdr
      properties:
        hit:
          type: boolean
          description: Whether the browser found a node under the point
        ref:
          type: [string, 'null']
          description: The observed target's ref, for example @e1, or null
        snapshotId:
          type: [string, 'null']
          description: The observed snapshot that the ref belongs to, or null
        generation:
          type: [integer, 'null']
          minimum: 0
          description: The snapshot's generation, or null
        role:
          type: [string, 'null']
          description: The observed target's accessibility role, or null
        name:
          type: [string, 'null']
          description: The observed target's accessible name, or null
        reason:
          type: [string, 'null']
          description: >-
            Why there is no ref: no_node (nothing under the point), no_snapshot (a node is there, but the run
            has observed no page) or not_observed (a node is there, but no observed target is on its
            ancestors). Null when there is a ref.
        zdr:
          type: boolean
          description: Whether the run is under zero data retention. Nothing is stored either way.
    Envelope_AgentTabs:
      type: object
      required:
      - request_id
      - success
      - data
      properties:
        request_id:
          type: string
        success:
          type: boolean
        data:
          type: object
          required:
          - tabs
          properties:
            tabs:
              type: array
              items:
                $ref: '#/components/schemas/AgentTab'
    Envelope_AgentTab:
      type: object
      required:
      - request_id
      - success
      - data
      properties:
        request_id:
          type: string
        success:
          type: boolean
        data:
          type: object
          required:
          - tab
          - tabs
          properties:
            tab:
              $ref: '#/components/schemas/AgentTab'
            tabs:
              type: array
              items:
                $ref: '#/components/schemas/AgentTab'
    AgentStepRequest:
      type: object
      required:
      - action
      properties:
        action:
          $ref: '#/components/schemas/AgentAction'
        initiated_by:
          type: string
          nullable: true
          enum:
          - human
          - agent
          description: >-
            Who proposed the action. It can only tighten: `agent` on a person's
            token makes the call an agent's, and a service principal is always an
            agent. Receipts record the derived initiator and the control epoch, and
            for an agent which one (`agent` on the receipt). `initiatedBy` is
            accepted too; both in one body is a 422.
        aiRunId:
          $ref: '#/components/schemas/AdvisoryIdentifier'
        agentLabel:
          $ref: '#/components/schemas/AdvisoryIdentifier'
        instruction:
          type: string
          nullable: true
        extraction_profile:
          type: object
          nullable: true
          additionalProperties: true
        expect:
          $ref: '#/components/schemas/StepExpectation'
    StepExpectation:
      type: object
      description: >-
        E4.2 step 1: a postcondition the page must meet once this step ran. Quarry checks it
        against the observation it reads, never the Model's word. It holds when every condition
        in `all` holds. Unknown fields are refused. Dark: a step that carries one is refused with
        400 `unsupported_option` unless QUARRY_EDGE__STEP_EXPECT is on (default off). A ZDR run may
        send it; the verdict is returned on the observation (proof_bundle.expectation) and nothing
        is stored. A bounds violation is a 400 BAD_REQUEST whose details.field names the path of
        the refused field, never its value.
      required:
      - all
      properties:
        all:
          type: array
          description: 1 to 8 conditions.
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/ExpectCondition'
      additionalProperties: false
    ExpectCondition:
      type: object
      description: >-
        One checkable condition, tagged by kind. url_matches: `pattern` (1 to 512 bytes; `*` is the
        only metacharacter). element_present and element_absent: `locator`. text_present and
        text_absent: `text` (1 to 256 bytes) in the page text or, with `within`, in the one element
        that `within` names. A locator string is 1 to 256 bytes; a locator of kind nth is refused.
      required:
      - kind
      properties:
        kind:
          type: string
          enum: [url_matches, element_present, element_absent, text_present, text_absent]
        pattern:
          type: string
          minLength: 1
          maxLength: 512
        locator:
          $ref: '#/components/schemas/ExpectLocator'
        text:
          type: string
          minLength: 1
          maxLength: 256
        within:
          $ref: '#/components/schemas/ExpectLocator'
      additionalProperties: false
    ExpectLocator:
      type: object
      description: A semantic locator for an expectation. Kind nth is refused (order-dependent).
      oneOf:
      - $ref: '#/components/schemas/RoleLocator'
      - $ref: '#/components/schemas/TextLocator'
      - $ref: '#/components/schemas/LabelLocator'
      - $ref: '#/components/schemas/PlaceholderLocator'
      - $ref: '#/components/schemas/TestIdLocator'
    Envelope_BrowserObservation:
      type: object
      required:
      - request_id
      - success
      - data
      properties:
        request_id:
          type: string
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/BrowserObservation'
        meta:
          type: object
          description: Present on a step response of an agent-class run (WS6.B); absent for a person's session and when budgets are off.
          properties:
            budget:
              $ref: '#/components/schemas/BudgetMeta'
    BudgetMeta:
      type: object
      description: >-
        The budget ledger of an agent-class run after a step (WS6.B). Cost is estimated
        from the flat action table plus a browser-time term, never billed usage.
        Enforcement is QUARRY_EDGE__BUDGET_ENFORCEMENT (shadow by default: the bounds
        are reported and what would be refused is recorded, nothing is refused).
      required:
      - class
      - steps
      - attempts
      - elapsed_s
      - spent_usd
      - estimated
      - cost_source
      properties:
        class:
          type: string
          enum: [interactive, agent]
        steps:
          type: integer
          description: Completed steps.
        attempts:
          type: integer
          description: Attempts, completed or failed.
        max_steps:
          type: integer
          description: The step bound. Absent for an interactive run.
        max_attempts:
          type: integer
          description: The attempt bound. Absent for an interactive run.
        elapsed_s:
          type: number
          description: Active time in seconds; a human takeover does not count.
        max_runtime_s:
          type: integer
          description: The runtime bound. Absent for an interactive run.
        spent_usd:
          type: number
        max_cost_usd:
          type: number
          description: The cost bound. Absent for an interactive run.
        estimated:
          type: boolean
          enum: [true]
        cost_source:
          type: string
          enum: [flat_table, estimated, provider_billed]
          description: Where the cost of the step this response answers came from.
        exhausted:
          type: string
          enum: [steps, attempts, runtime, cost]
          description: The dimension reached, once one was.
    BrowserObservation:
      type: object
      required:
      - run_id
      - step
      - url
      - action_outcome
      - observed_at
      properties:
        run_id:
          type: string
        step:
          type: integer
        url:
          type: string
          format: uri
        title:
          type: string
          nullable: true
        snapshot:
          $ref: '#/components/schemas/BrowserSnapshot'
        dom_summary:
          type: object
          nullable: true
          additionalProperties: true
        screenshot_artifact_id:
          type: string
          nullable: true
        visual_observation_artifact_id:
          type: string
          nullable: true
        evidence_delta_artifact_id:
          type: string
          nullable: true
        console_summary:
          type: array
          items:
            type: object
            additionalProperties: true
        network_summary:
          type: array
          items:
            type: object
            additionalProperties: true
        egress_receipts:
          type: array
          description: Redacted request-policy decisions. URLs contain origin and path only; query strings, headers, bodies, credentials, and resolved IPs are omitted.
          items:
            $ref: '#/components/schemas/BrowserEgressReceipt'
        dialogs:
          type: array
          description: Open JavaScript dialogs. Quarry never resolves them implicitly; respond_dialog requires an explicit live browser grant.
          items:
            $ref: '#/components/schemas/BrowserDialog'
        policy_denials:
          type: array
          items:
            type: string
        action_outcome:
          $ref: '#/components/schemas/ActionOutcome'
        observation_delta:
          $ref: '#/components/schemas/ObservationDelta'
        challenge:
          allOf:
          - $ref: '#/components/schemas/ChallengeSignal'
          nullable: true
        extraction_profile:
          type: object
          nullable: true
          additionalProperties: true
        extraction_result:
          type: object
          nullable: true
          additionalProperties: true
        proof_bundle:
          type: object
          nullable: true
          description: Evidence manifest for this observation. redaction_rule_version names the secret-redaction rule set the observation was masked under. expectation, when the step carried an expect, is that expect and Quarry's verdict on it.
          additionalProperties: true
        target_resolution:
          type: object
          nullable: true
          additionalProperties: true
        telemetry:
          $ref: '#/components/schemas/BrowserTelemetry'
        redaction:
          allOf:
          - $ref: '#/components/schemas/RedactionStamp'
          nullable: true
          description: What the secret-redaction pass did to this observation. Counts per rule id only; no content and no lengths.
        warnings:
          type: array
          maxItems: 50
          description: Page-quality warnings for this observation, so a planner can tell a partial page read from a complete one. Omitted when there are none. Each warning is a closed code with a fixed message; none carries page text, a URL or a frame id, so they are safe under ZDR.
          items:
            $ref: '#/components/schemas/ObservationWarning'
        settle_ms:
          type: integer
          minimum: 0
          description: How long the page's DOM took to go quiet after the action this observation follows, in milliseconds. Never more than the settle bound (QUARRY_BROWSER_ACTION_SETTLE_MS). A value equal to the bound means the DOM was still changing when the bound ran out. Omitted when the settle is off or the action only read the page; mirrors telemetry.settle_ms.
        observed_at:
          type: string
          format: date-time
    ObservationWarning:
      type: object
      required:
      - code
      - message
      description: One page-quality warning on a BrowserObservation.
      properties:
        code:
          type: string
          description: The closed warning code. A reader that does not know a code still reads the message.
          enum:
          - ax_frame_timeout
          - ax_frame_unavailable
          - ax_budget_exhausted
          - ax_frame_limit
          - ax_truncated
          - ax_partial
        message:
          type: string
          description: The fixed, page-free text for the code.
    BrowserTelemetry:
      type: object
      required:
      - startup_mode
      - usable_observation_latency_ms
      - estimated_snapshot_tokens
      - observed_action_count
      - challenge_observation_count
      - challenge_rate_per_mille
      description: Measured browser execution facts. renderer_* values are renderer-scoped CDP metrics, not host-wide process usage. Missing cost/resource values mean no provider-authoritative meter was
        available.
      properties:
        startup_mode:
          type: string
          enum:
          - cold
          - warm
          - unknown
        startup_latency_ms:
          type: integer
          minimum: 0
          nullable: true
        usable_observation_latency_ms:
          type: integer
          minimum: 0
        renderer_task_cpu_ms:
          type: integer
          minimum: 0
          nullable: true
        renderer_js_heap_used_bytes:
          type: integer
          minimum: 0
          nullable: true
        estimated_snapshot_tokens:
          type: integer
          minimum: 0
        observed_action_count:
          type: integer
          minimum: 0
        challenge_observation_count:
          type: integer
          minimum: 0
        challenge_rate_per_mille:
          type: integer
          minimum: 0
          maximum: 1000
        verified_action_cost_micro_usd:
          type: integer
          minimum: 0
          nullable: true
        profile_restore:
          allOf:
          - $ref: '#/components/schemas/ProfileRestoreSummary'
          nullable: true
          description: What restoring the session's saved profile did when its first tab opened. Counts only. Absent for a session without a saved profile.
    ProfileRestoreSummary:
      type: object
      description: What restoring a saved profile into a fresh browser context did. Counts and flags only; never a cookie name, an origin, a URL or a value. The user agent is never overridden; ua_changed only records that it differs from the one the profile was captured with.
      properties:
        cookies_total:
          type: integer
          minimum: 0
          description: Cookies the snapshot held.
        cookies_applied:
          type: integer
          minimum: 0
          description: Cookies Chromium accepted into the context.
        skipped_expired:
          type: integer
          minimum: 0
        skipped_session_stale:
          type: integer
          minimum: 0
          description: Session cookies older than QUARRY_BROWSER_PROFILE_SESSION_COOKIE_MAX_AGE_S (default 604800).
        cookies_rejected:
          type: integer
          minimum: 0
          description: Cookies Chromium (or the mapping) refused.
        origins_seeded:
          type: integer
          minimum: 0
          description: Origins whose web storage and IndexedDB the page seeds on first visit.
        idb_databases:
          type: integer
          minimum: 0
        ua_changed:
          type: boolean
        snapshot_age_s:
          type: integer
          minimum: 0
          nullable: true
          description: Seconds between the snapshot's capture and the restore; absent for a legacy snapshot.
        truncated:
          type: boolean
          description: The snapshot was cut by a cap or lost values at capture.
        failed:
          type: boolean
          description: The restore did not finish; the release does not overwrite the stored profile.
    RedactionStamp:
      type: object
      description: What the secret-redaction pass did to a record. It carries counts per static rule id and no content and no lengths. Every field has a default, so a stamp written by an older build still reads.
      properties:
        rule_version:
          type: string
          description: The rule set that ran, for example qr-redact/3.
        profile:
          type: string
          enum:
          - live
          - durable
        mode:
          type: string
          enum:
          - enforce
          - shadow
          - 'off'
          description: shadow counts and returns the input unchanged; off does nothing. Both are refused at boot in production.
        values_masked:
          type: integer
          minimum: 0
        by_rule:
          type: object
          description: Masked values per rule id (field.password, shape.jwt, ...).
          additionalProperties:
            type: integer
            minimum: 0
        probe:
          type: string
          enum:
          - ok
          - partial
          - failed
          - skipped
          description: How the field-facts probe ended. partial or failed means some editable values were masked without facts.
        probe_ms:
          type: integer
          minimum: 0
        screenshot:
          type: string
          enum:
          - none
          - masked
          - withheld
          description: What happened to the screenshot of this record. masked means sensitive field rectangles were painted over; withheld means the screenshot was not stored or returned because a sensitive field could not be masked (no screenshot_artifact_id). Cross-origin iframes are not scanned (see oopif_frames).
        mask_ms:
          type: integer
          minimum: 0
          description: Milliseconds the screenshot scan and mask took, outside the capture itself. 0 when none ran.
        oopif_frames:
          type: integer
          minimum: 0
          description: Cross-origin iframes the screenshot scan could not look into. A count only; their content is not masked unless QUARRY_BROWSER_SCREENSHOT_OOPIF=mask.
        rects:
          type: integer
          minimum: 0
          description: How many rectangles were painted over in the screenshot. Counts only, no geometry.
    BrowserEgressReceipt:
      type: object
      required:
      - sequence
      - method
      - url
      - decision
      - policy
      - timestamp_ms
      properties:
        sequence:
          type: integer
          minimum: 1
        tab_id:
          type: string
          nullable: true
        method:
          type: string
          example: GET
        url:
          type: string
          example: https://example.com/path
        decision:
          type: string
          enum:
          - allow
          - block
        policy:
          type: string
          enum:
          - url_dns_public
          - url_or_dns_blocked
          - domain_grant_blocked
          - dns_or_ssrf_blocked
          - pinned_connect_failed
          - dns_pinned_proxy
        timestamp_ms:
          type: integer
          minimum: 0
    Envelope_EgressReceipts:
      type: object
      required:
      - request_id
      - success
      - data
      properties:
        request_id:
          type: string
        success:
          type: boolean
        data:
          type: object
          required:
          - receipts
          - zdr
          properties:
            receipts:
              type: array
              items:
                $ref: '#/components/schemas/BrowserEgressReceipt'
            zdr:
              type: boolean
    BrowserDialog:
      type: object
      required:
      - dialog_id
      - kind
      - message
      - opened_at_ms
      properties:
        dialog_id:
          type: string
        frame_id:
          type: string
          nullable: true
        kind:
          type: string
          enum:
          - alert
          - confirm
          - prompt
          - beforeunload
        message:
          type: string
        default_prompt:
          type: string
          nullable: true
        origin:
          type: string
          nullable: true
        opened_at_ms:
          type: integer
          minimum: 0
    AgentAction:
      type: object
      required:
      - type
      discriminator:
        propertyName: type
        mapping:
          back: '#/components/schemas/BackAction'
          click: '#/components/schemas/ClickAction'
          click_point: '#/components/schemas/ClickPointAction'
          click_ref: '#/components/schemas/ClickRefAction'
          click_semantic: '#/components/schemas/ClickSemanticAction'
          download_ref: '#/components/schemas/DownloadRefAction'
          evaluate: '#/components/schemas/EvaluateAction'
          fill_otp_ref: '#/components/schemas/FillOtpRefAction'
          forward: '#/components/schemas/ForwardAction'
          frame_click_ref: '#/components/schemas/FrameClickRefAction'
          frame_download_ref: '#/components/schemas/FrameDownloadRefAction'
          frame_select_ref: '#/components/schemas/FrameSelectRefAction'
          frame_type_ref: '#/components/schemas/FrameTypeRefAction'
          frame_upload_ref: '#/components/schemas/FrameUploadRefAction'
          frame_wait_for_ref: '#/components/schemas/FrameWaitForRefAction'
          get_content: '#/components/schemas/GetContentAction'
          mouse_wheel: '#/components/schemas/MouseWheelAction'
          navigate: '#/components/schemas/NavigateAction'
          pdf: '#/components/schemas/PdfAction'
          press: '#/components/schemas/PressAction'
          reload: '#/components/schemas/ReloadAction'
          respond_dialog: '#/components/schemas/DialogResponseAction'
          screenshot: '#/components/schemas/ScreenshotAction'
          scroll: '#/components/schemas/ScrollAction'
          select: '#/components/schemas/SelectAction'
          select_ref: '#/components/schemas/SelectRefAction'
          select_semantic: '#/components/schemas/SelectSemanticAction'
          type: '#/components/schemas/TypeAction'
          type_ref: '#/components/schemas/TypeRefAction'
          type_semantic: '#/components/schemas/TypeSemanticAction'
          upload_ref: '#/components/schemas/UploadRefAction'
          wait: '#/components/schemas/WaitAction'
          wait_for: '#/components/schemas/WaitForAction'
          wait_for_ref: '#/components/schemas/WaitForRefAction'
          wait_for_semantic: '#/components/schemas/WaitForSemanticAction'
      oneOf:
      - $ref: '#/components/schemas/BackAction'
      - $ref: '#/components/schemas/ClickAction'
      - $ref: '#/components/schemas/ClickPointAction'
      - $ref: '#/components/schemas/ClickRefAction'
      - $ref: '#/components/schemas/ClickSemanticAction'
      - $ref: '#/components/schemas/DownloadRefAction'
      - $ref: '#/components/schemas/EvaluateAction'
      - $ref: '#/components/schemas/FillOtpRefAction'
      - $ref: '#/components/schemas/ForwardAction'
      - $ref: '#/components/schemas/FrameClickRefAction'
      - $ref: '#/components/schemas/FrameDownloadRefAction'
      - $ref: '#/components/schemas/FrameSelectRefAction'
      - $ref: '#/components/schemas/FrameTypeRefAction'
      - $ref: '#/components/schemas/FrameUploadRefAction'
      - $ref: '#/components/schemas/FrameWaitForRefAction'
      - $ref: '#/components/schemas/GetContentAction'
      - $ref: '#/components/schemas/MouseWheelAction'
      - $ref: '#/components/schemas/NavigateAction'
      - $ref: '#/components/schemas/PdfAction'
      - $ref: '#/components/schemas/PressAction'
      - $ref: '#/components/schemas/ReloadAction'
      - $ref: '#/components/schemas/DialogResponseAction'
      - $ref: '#/components/schemas/ScreenshotAction'
      - $ref: '#/components/schemas/ScrollAction'
      - $ref: '#/components/schemas/SelectAction'
      - $ref: '#/components/schemas/SelectRefAction'
      - $ref: '#/components/schemas/SelectSemanticAction'
      - $ref: '#/components/schemas/TypeAction'
      - $ref: '#/components/schemas/TypeRefAction'
      - $ref: '#/components/schemas/TypeSemanticAction'
      - $ref: '#/components/schemas/UploadRefAction'
      - $ref: '#/components/schemas/WaitAction'
      - $ref: '#/components/schemas/WaitForAction'
      - $ref: '#/components/schemas/WaitForRefAction'
      - $ref: '#/components/schemas/WaitForSemanticAction'
      additionalProperties: true
      description: Tagged action. Existing CSS selector actions remain supported. Snapshot actions (`*_ref` and `*_semantic`) must include the exact snapshot_id and generation from BrowserObservation.snapshot;
        stale, missing, or ambiguous targets return TARGET_REPAIR_REQUIRED (409). With driver_capabilities.trusted_input
        true, a click_ref, type_ref or select_ref that cannot be performed as a person would also returns TARGET_REPAIR_REQUIRED (409),
        with details.reason one of target_not_attached, target_not_visible, target_disabled, target_covered
        (plus details.covered_by_tag, a tag name only), target_unstable, target_has_no_box or target_unreachable_after_scroll.
        The details never carry a selector, URL or page text.
    LegacyAgentAction:
      type: object
      oneOf:
      - $ref: '#/components/schemas/NavigateAction'
      - $ref: '#/components/schemas/ClickAction'
      - $ref: '#/components/schemas/ClickPointAction'
      - $ref: '#/components/schemas/TypeAction'
      - $ref: '#/components/schemas/PressAction'
      - $ref: '#/components/schemas/ScrollAction'
      - $ref: '#/components/schemas/MouseWheelAction'
      - $ref: '#/components/schemas/SelectAction'
      - $ref: '#/components/schemas/WaitAction'
      - $ref: '#/components/schemas/WaitForAction'
      - $ref: '#/components/schemas/ScreenshotAction'
      - $ref: '#/components/schemas/PdfAction'
      - $ref: '#/components/schemas/EvaluateAction'
      - $ref: '#/components/schemas/BackAction'
      - $ref: '#/components/schemas/ForwardAction'
      - $ref: '#/components/schemas/GetContentAction'
      discriminator:
        propertyName: type
        mapping:
          navigate: '#/components/schemas/NavigateAction'
          click: '#/components/schemas/ClickAction'
          click_point: '#/components/schemas/ClickPointAction'
          type: '#/components/schemas/TypeAction'
          press: '#/components/schemas/PressAction'
          scroll: '#/components/schemas/ScrollAction'
          mouse_wheel: '#/components/schemas/MouseWheelAction'
          select: '#/components/schemas/SelectAction'
          wait: '#/components/schemas/WaitAction'
          wait_for: '#/components/schemas/WaitForAction'
          screenshot: '#/components/schemas/ScreenshotAction'
          pdf: '#/components/schemas/PdfAction'
          evaluate: '#/components/schemas/EvaluateAction'
          back: '#/components/schemas/BackAction'
          forward: '#/components/schemas/ForwardAction'
          get_content: '#/components/schemas/GetContentAction'
    NavigateAction:
      type: object
      required:
      - type
      - url
      properties:
        type:
          type: string
          const: navigate
        url:
          type: string
          format: uri
    ClickAction:
      type: object
      required:
      - type
      - selector
      properties:
        type:
          type: string
          const: click
        selector:
          type: string
    ClickPointAction:
      type: object
      required:
      - type
      - x
      - y
      properties:
        type:
          type: string
          const: click_point
        x:
          type: number
        y:
          type: number
    TypeAction:
      type: object
      required:
      - type
      - selector
      - text
      properties:
        type:
          type: string
          const: type
        selector:
          type: string
        text:
          type: string
    PressAction:
      type: object
      required:
      - type
      - key
      properties:
        type:
          type: string
          const: press
        key:
          type: string
    ScrollAction:
      type: object
      required:
      - type
      - target
      properties:
        type:
          type: string
          const: scroll
        target:
          type: string
    MouseWheelAction:
      type: object
      required:
      - type
      - x
      - y
      - delta_x
      - delta_y
      properties:
        type:
          type: string
          const: mouse_wheel
        x:
          type: number
        y:
          type: number
        delta_x:
          type: number
        delta_y:
          type: number
    SelectAction:
      type: object
      required:
      - type
      - selector
      - value
      properties:
        type:
          type: string
          const: select
        selector:
          type: string
        value:
          type: string
    WaitAction:
      type: object
      required:
      - type
      - ms
      properties:
        type:
          type: string
          const: wait
        ms:
          type: integer
          minimum: 0
    WaitForAction:
      type: object
      required:
      - type
      - selector
      - timeout_ms
      properties:
        type:
          type: string
          const: wait_for
        selector:
          type: string
        timeout_ms:
          type: integer
          minimum: 0
    ScreenshotAction:
      type: object
      required:
      - type
      - full_page
      properties:
        type:
          type: string
          const: screenshot
        full_page:
          type: boolean
    PdfAction:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          const: pdf
    EvaluateAction:
      deprecated: true
      description: >-
        Raw page script. Refused on every agent entry point with 403 FORBIDDEN and
        details.reason raw_script_denied; the action stays in the schema only so
        existing clients still deserialize. Use typed browser actions.
      type: object
      required:
      - type
      - script
      properties:
        type:
          type: string
          const: evaluate
        script:
          type: string
    BackAction:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          const: back
    ForwardAction:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          const: forward
    GetContentAction:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          const: get_content
    ReloadAction:
      type: object
      description: Reload the current page (WS9.B). Human-only; agent surfaces never send it.
      required:
      - type
      properties:
        type:
          type: string
          const: reload
        ignore_cache:
          type: boolean
          default: false
      additionalProperties: false
    SnapshotRefAction:
      type: object
      oneOf:
      - $ref: '#/components/schemas/ClickRefAction'
      - $ref: '#/components/schemas/TypeRefAction'
      - $ref: '#/components/schemas/SelectRefAction'
      - $ref: '#/components/schemas/WaitForRefAction'
    FrameSnapshotRefAction:
      type: object
      description: Child-frame action. frame_id must exactly match the observed target's opaque frame id; ordinary snapshot refs cannot act across a frame.
      oneOf:
      - $ref: '#/components/schemas/FrameClickRefAction'
      - $ref: '#/components/schemas/FrameTypeRefAction'
      - $ref: '#/components/schemas/FrameSelectRefAction'
      - $ref: '#/components/schemas/FrameWaitForRefAction'
      - $ref: '#/components/schemas/FrameUploadRefAction'
      - $ref: '#/components/schemas/FrameDownloadRefAction'
    SemanticTargetAction:
      type: object
      oneOf:
      - $ref: '#/components/schemas/ClickSemanticAction'
      - $ref: '#/components/schemas/TypeSemanticAction'
      - $ref: '#/components/schemas/SelectSemanticAction'
      - $ref: '#/components/schemas/WaitForSemanticAction'
    DialogResponseAction:
      type: object
      required:
      - type
      - dialog_id
      - accept
      - approval_grant_id
      properties:
        type:
          type: string
          const: respond_dialog
        dialog_id:
          type: string
        accept:
          type: boolean
        approval_grant_id:
          type: string
          description: Fresh active BrowserBroker approval grant. Quarry rejects replay within this live run. It must authorize only respond_dialog and the exact observed dialog plus its frame, when framed.
        prompt_text:
          type: string
          nullable: true
    UploadRefAction:
      type: object
      required:
      - type
      - snapshot_id
      - generation
      - ref_id
      - artifact_id
      - approval_grant_id
      properties:
        type:
          type: string
          const: upload_ref
        snapshot_id:
          type: string
        generation:
          type: integer
          minimum: 0
        ref_id:
          type: string
          example: '@e1'
        artifact_id:
          type: string
          description: Tenant-owned Quarry artifact identifier; host paths and URLs are not accepted.
        approval_grant_id:
          type: string
          description: Fresh single-use BrowserBroker approval authorizing only upload_ref, this exact artifact, and the observed target frame when framed.
    DownloadRefAction:
      type: object
      required:
      - type
      - snapshot_id
      - generation
      - ref_id
      - approval_grant_id
      properties:
        type:
          type: string
          const: download_ref
        snapshot_id:
          type: string
        generation:
          type: integer
          minimum: 0
        ref_id:
          type: string
          example: '@e1'
        approval_grant_id:
          type: string
          description: Fresh single-use BrowserBroker approval authorizing only download_ref and the observed target frame when framed. Quarry stores only an admitted tenant-owned artifact; local download
            paths are never exposed.
    FillOtpRefAction:
      type: object
      description: >-
        Dark: refused 403 unless QUARRY_EDGE__FILL_OTP is on (default off). Fills a one-time code, read from the user's approved mail connection, into one exact input of the latest snapshot. The code is never on the wire in either direction: the caller names only the target and the approval. The approval is a single-use fill_otp approval grant (child of the run grant), used once per live run. Before any code is read, the page must pass these checks: https only; the target is in the top frame (a child-frame target is refused), and frame origin equals top origin and grant origin; exactly one visible required non-password input, the only visible text field on the page; no datalist, visible select, radio, listbox or QR code. The code is inserted through trusted input. A stale or absent target answers 409 TARGET_REPAIR_REQUIRED, and an API-key run is refused (api_key_sensitive_action_refused). The code is never in a receipt, event or response (receipt outcome otp_filled). This variant has no value field: a value, code or text key is ignored and never kept or echoed.
      required:
      - type
      - snapshot_id
      - generation
      - ref_id
      - approval_grant_id
      properties:
        type:
          type: string
          const: fill_otp_ref
        snapshot_id:
          type: string
        generation:
          type: integer
          minimum: 0
        ref_id:
          type: string
          example: '@e1'
        approval_grant_id:
          type: string
          description: Fresh single-use fill_otp approval grant, a child of the run grant, for this exact top-frame target. Quarry consumes it once.
    SnapshotTargetBase:
      type: object
