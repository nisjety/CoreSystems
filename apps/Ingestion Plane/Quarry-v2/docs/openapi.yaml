  /v1/crawl/{job_id}:
    get:
      operationId: get_crawl_status
      summary: Status document of a crawl (WS15.L1)
      description: A batch id on this path answers 404 (kind mismatch).
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^job_'
      responses:
        '200':
          description: The crawl status document.
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Not found, a foreign id, or a job of another kind.
    delete:
      operationId: cancel_crawl
      summary: Cancel a crawl (WS15.L2)
      description: An accepted crawl is cancelled at once; a running one stops within one page and the control loop period (2 s). Org-scoped; service principals are refused.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^job_'
      responses:
        '202':
          description: The request is recorded and the orchestrator has yet to apply it (control.pending is true).
          content:
            application/json:
              schema:
                type: object
        '200':
          description: The job already reflects the request (an accepted job cancelled at once).
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Not found, a foreign id, or a job of another kind.
        '409':
          description: The job ended, or the verb does not fit its state. details.reason is ended, not_running or not_controllable.
        '501':
          description: Job control is not enabled on this edge (QUARRY_EDGE__JOB_CONTROL).
  /v1/crawl/{job_id}/pause:
    post:
      operationId: pause_crawl
      summary: Pause a running crawl (WS15.L2)
      description: The crawl stops before its next page and reports run_paused once per pause. Requires a running job.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^job_'
      responses:
        '202':
          description: The request is recorded and the orchestrator has yet to apply it (control.pending is true).
          content:
            application/json:
              schema:
                type: object
        '200':
          description: The job already reflects the request (an accepted job cancelled at once).
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Not found, a foreign id, or a job of another kind.
        '409':
          description: The job ended, or the verb does not fit its state. details.reason is ended, not_running or not_controllable.
        '501':
          description: Job control is not enabled on this edge (QUARRY_EDGE__JOB_CONTROL).
  /v1/crawl/{job_id}/resume:
    post:
      operationId: resume_crawl
      summary: Resume a paused crawl (WS15.L2)
      description: The crawl continues with its next page and reports run_resumed. Requires a paused job.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^job_'
      responses:
        '202':
          description: The request is recorded and the orchestrator has yet to apply it (control.pending is true).
          content:
            application/json:
              schema:
                type: object
        '200':
