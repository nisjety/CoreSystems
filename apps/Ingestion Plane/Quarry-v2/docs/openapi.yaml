    CreateSourceRequest:
      type: object
      required:
      - name
      - url
      - kind
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
        kind:
          type: string
          enum:
          - crawl
          - scrape
          - search
        monitor:
          type: boolean
          default: false
          description: Also registers a recurring change_monitor schedule
        preset:
          type: string
          enum:
          - hourly
          - daily
          - weekly
          description: Required when monitor=true
        config:
          type: object
          description: >-
            The source's config. A saved job definition (E4.1-6) sits at config.definition: the edge checks it and
            stores the canonical form (see POST /v1/sources and SavedJobDefinition). Other keys are kept as sent.
          additionalProperties: true
          properties:
            definition:
              nullable: true
              description: >-
                A saved job definition, or null for none. While QUARRY_EDGE__SAVED_JOBS is off, a definition key
                (null included) is a 501.
              allOf:
              - $ref: '#/components/schemas/SavedJobDefinition'
        tag:
          type: string
          maxLength: 32
          description: The operator label that groups this source (E3.5-6). Trimmed and lowercased; 1 to 32 characters of letters a to z, digits, dot, underscore or hyphen, starting with a letter or digit. Blank is untagged. A repeat registration keeps the tag the row already has.
    SavedJobDefinition:
      type: object
      description: >-
        A saved job definition (E4.1-6), kept at a source's config.definition and used by a schedule made with
        source_id. It holds options only: the URL is the source's own, and a definition never carries a robots
        override, a webhook or a ZDR declaration. Dark behind QUARRY_EDGE__SAVED_JOBS (default off). A definition the
        validators refuse is a 400 with details.fields[] {path, code, message}; every problem found at one level is
        reported together, under paths that start with definition. The keys url, zdr, webhook and ignore_robots_txt
        (and the camelCase spellings ignoreRobotsTxt and ignoreRobots) are refused with code not_saveable. The stored
        form is the canonical one, re-serialised from what the validators accepted. At most 16 KiB of compact JSON
        (code too_long). Only version, job_kind and options are keys (code unknown_field otherwise).
      additionalProperties: false
      required:
      - version
      - job_kind
      - options
      properties:
        version:
          type: integer
          const: 1
          description: The definition version. Only 1 is accepted; any other value is a 400 with code unsupported_version.
        job_kind:
          type: string
          enum:
          - scrape
          - crawl
          description: >-
            scrape or crawl. It must equal the kind of the source (otherwise code unsupported_kind), so a search source
            takes no definition. batch is not a saved kind: a source has one URL.
        options:
          type: object
          additionalProperties: true
          description: >-
            For crawl, the POST /v1/crawl body fields other than url, checked by the crawl body parser in strict mode
            with the source URL as the seed. For scrape, the POST /v1/scrape options (snake_case or camelCase), checked
            by the scrape option reader and its default limits. An option whose feature flag is off on the live route is
            a 400 unsupported_option, as there. Errors are under definition.options.
    SourceDefinitionRequest:
      type: object
      description: >-
        The body of PUT /v1/sources/{source_id}/definition. definition replaces the source's saved job definition, and
        null clears it. The key is required: a body that names no definition is a 400 (details.fields[] code required),
        so a PUT never clears a definition by omission.
      required:
      - definition
      properties:
        definition:
          nullable: true
          description: A saved job definition (see SavedJobDefinition), or null to clear the source's definition.
          allOf:
          - $ref: '#/components/schemas/SavedJobDefinition'
    TagPatchRequest:
      type: object
      required:
      - tag
      properties:
        tag:
          type: string
          maxLength: 32
          description: The monitor tag to set, normalised as a create tag is. An empty string clears the tag.
    TeamCreditUsage:
      type: object
