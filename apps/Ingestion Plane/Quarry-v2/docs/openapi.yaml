        kind:
          type: string
          const: nth
        selector:
          type: string
          description: Tag or ARIA role from the active snapshot.
        index:
          type: integer
          minimum: 0
    BrowserSnapshot:
      type: object
      required:
      - snapshot_id
      - generation
      - targets
      properties:
        snapshot_id:
          type: string
        generation:
          type: integer
          minimum: 0
        targets:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotTarget'
        accessibility:
          $ref: '#/components/schemas/AccessibilityProjection'
        frames:
          type: array
          items:
            $ref: '#/components/schemas/BrowserFrame'
    AccessibilityProjection:
      type: object
      required:
      - source
      - nodes
      - truncated
      properties:
        source:
          type: string
          example: chromium_cdp_ax
        truncated:
          type: boolean
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/AccessibilityNode'
    AccessibilityNode:
      type: object
      required:
      - node_id
      - ignored
      - child_ids
      properties:
        node_id:
          type: string
        role:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        value:
          type: string
          nullable: true
        ignored:
          type: boolean
        frame_id:
          type: string
          nullable: true
        child_ids:
          type: array
          items:
            type: string
    BrowserFrame:
      type: object
      required:
      - frame_id
      - child_frame_ids
      properties:
        frame_id:
          type: string
        parent_frame_id:
          type: string
          nullable: true
        origin:
          type: string
          nullable: true
          description: Security origin only; no frame URL or query string is exposed.
        name:
          type: string
          nullable: true
        child_frame_ids:
          type: array
          items:
            type: string
    SnapshotTarget:
      type: object
      required:
      - ref_id
      - tag
      properties:
        ref_id:
          type: string
          example: '@e1'
        tag:
          type: string
        text:
          type: string
          nullable: true
        role:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        placeholder:
          type: string
          nullable: true
        test_id:
          type: string
          nullable: true
        frame_id:
          type: string
          nullable: true
          description: Opaque observed owner frame. A non-root target is executable only through the matching frame_*_ref action with this exact id.
        fingerprint:
          $ref: '#/components/schemas/ElementFingerprint'
    ElementFingerprint:
      type: object
      required:
      - fingerprint_id
      - tag
      - normalized_text
      - attributes
      - structural_path
      description: Read-only observed target identity used for repair and proof. It is not an executable selector and must never be sent as a raw action target.
      properties:
        fingerprint_id:
          type: string
        tag:
          type: string
        normalized_text:
          type: string
        attributes:
          type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: string
        structural_path:
          type: string
        logical_id:
          type: string
          nullable: true
    ActionOutcome:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - verified
          - failed
          - unknown
        reason_code:
          type: string
          nullable: true
        detail:
          type: string
          nullable: true
    ObservationDelta:
      type: object
      required:
      - changed_fields
      - url_changed
      - title_changed
      - dom_changed
      - content_changed
      properties:
        changed_fields:
          type: array
          items:
            type: string
        url_changed:
          type: boolean
        title_changed:
          type: boolean
        dom_changed:
          type: boolean
        content_changed:
          type: boolean
    ChallengeSignal:
      type: object
      required:
      - kind
      - confidence
      description: |
        What an observed page says about access. Advisory: Quarry never tries to get past a challenge, and
        a signal does not stop a run by itself. Only strength=strong is a verdict that a bot wall stands in
        front of the page; strength=non_signal names an ordinary access state (a login form, a consent
        banner, a paywall, a rate limit, a bare status) so it is not mistaken for one. A strong signal
        gets one recovery per host and run, a wait or a reload of the same URL; if the host still
        challenges, block_reason becomes challenge_loop, recovery becomes exhausted and, when the edge
        runs with QUARRY_CHALLENGE_ENFORCE=enforce (the default is log, which only logs what it would
        refuse), Quarry answers further navigation to that host and interaction with its page with
        403 CHALLENGE_DETECTED (details: reason, host, recovery=exhausted,
        next=user_takeover_or_other_source; host is left out under Zero Data Retention). Screenshots, reads, waits, scrolling, answering a dialog the page
        already opened, back and forward, and navigation to another host stay allowed; raw script
        (evaluate) is refused with the interaction.
      properties:
        kind:
          type: string
          enum: [captcha, waf, login, consent, rate_limit, access_denied, paywall, geo_blocked, unknown]
        confidence:
          type: number
          format: float
          description: Strong 0.85 to 0.99 (infrastructure marker 0.95 and up, two text markers 0.85 and up); weak 0.5 or less; non_signal 0.7 and up.
        evidence:
          type: array
          description: Marker ids and the status, for example cloudflare_challenge, unusual_traffic, status:403. Never page text. For a non_signal the first entry names it (bare_status, rate_limited, auth_required, consent_required, paywall, geo_blocked, server_error).
          items:
            type: string
        requires_escalation:
          type: boolean
          description: True only for a strong signal. A login page, a cookie banner or a rate limit is not a reason to hand the run to a person.
        strength:
          type: string
          enum: [strong, weak, non_signal]
          default: strong
        block_reason:
          type: string
          nullable: true
          enum: [captcha_widget, waf_interstitial, challenge_loop, unexpected_bot_error]
          description: Set on a strong signal only.
        recovery:
          type: string
          enum: [available, exhausted, not_applicable]
          default: not_applicable
