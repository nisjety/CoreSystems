          click: '#/components/schemas/ClickAction'
          click_point: '#/components/schemas/ClickPointAction'
          type: '#/components/schemas/TypeAction'
          press: '#/components/schemas/PressAction'
          scroll: '#/components/schemas/ScrollAction'
          mouse_wheel: '#/components/schemas/MouseWheelAction'
          select: '#/components/schemas/SelectAction'
          wait: '#/components/schemas/WaitAction'
          wait_for: '#/components/schemas/WaitForAction'
          screenshot: '#/components/schemas/ScreenshotAction'
          pdf: '#/components/schemas/PdfAction'
          evaluate: '#/components/schemas/EvaluateAction'
          back: '#/components/schemas/BackAction'
          forward: '#/components/schemas/ForwardAction'
          get_content: '#/components/schemas/GetContentAction'
