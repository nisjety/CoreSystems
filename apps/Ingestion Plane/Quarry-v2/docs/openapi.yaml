      - mime_type
      - byte_size
      - sha256
      - admitted_type
      - handoff_state
      properties:
        artifact_id:
          type: string
          description: The tenant-owned artifact that holds the bytes
        mime_type:
          type: string
          enum:
          - application/pdf
          - text/plain
          - text/markdown
          - text/csv
        byte_size:
          type: integer
          minimum: 0
        sha256:
          type: string
          description: SHA-256 of the stored bytes, lower-case hex
        admitted_type:
          type: string
          enum:
          - pdf
          - txt
          - md
          - csv
        handoff_state:
          type: string
          description: Whether this edge has handed the file to Data Plane since it started
          enum:
          - not_handed_off
          - handed_off
    AgentDownloadKnowledgeRequest:
      type: object
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          maxLength: 128
          description: A retry label. The dedupe is by artifact id and digest, so a retry gets the first answer with or without it.
    Envelope_AgentDownloadKnowledge:
      type: object
      required:
      - request_id
      - success
      - data
      properties:
        request_id:
          type: string
        success:
          type: boolean
        data:
          type: object
          required:
          - document_id
          - created
          properties:
            document_id:
              type: string
              description: The Data Plane document the file became
            created:
              type: boolean
              description: False when an earlier call for the same artifact and digest had already created it
    Envelope_StepReceipts:
      type: object
      required:
      - request_id
      - success
      - data
      properties:
        request_id:
          type: string
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/StepReceipt'
    StepReceipt:
      type: object
      required:
      - receipt_id
      - run_id
      - step
      - started_at
      - finished_at
      - action
      - outcome
      - cost_micro_usd
      properties:
        org_id:
          type: string
          nullable: true
        receipt_id:
          type: string
        run_id:
          type: string
        step:
          type: integer
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        action:
          type: object
          additionalProperties: true
        outcome:
          type: object
          additionalProperties: true
        observation:
          $ref: '#/components/schemas/BrowserObservation'
        correction_of:
          type: string
          nullable: true
        cost_micro_usd:
          type: integer
          format: int64
        initiated_by:
          type: string
          enum:
          - human
          - agent
          - system
          description: Who drove the step. Absent on a receipt written before initiators were recorded.
        control_epoch:
          type: integer
          format: int64
          description: The control epoch the step was admitted under. Absent on older receipts.
        agent:
          $ref: '#/components/schemas/AgentIdentity'
        redaction_rule_version:
          type: string
          nullable: true
          description: |
            The secret-redaction rule version (for example `qr-redact/3`) the stored
            action, observation and failure text were masked under. Absent on a receipt
            written before it existed or while masking was not enforcing; the receipts
            route masks such a receipt on every read, so what it returns never holds the
            raw text. Stored evidence is not rewritten.
    CompileProcedureRequest:
      type: object
      properties:
        procedure_id:
          type: string
          nullable: true
        canonical:
          type: boolean
          default: false
          description: >-
            E4.2 step 2: compile a version 2 (canonical) procedure, with semantic targets, typed-text
            slots and the postconditions Quarry verified. Dark: while QUARRY_EDGE__PROCEDURE_CANONICAL is
            off (the default) a request that sets it is refused with 400 `procedure_canonical_disabled`.
            Absent or false compiles version 1, as before.
    BrowserProcedure:
      type: object
      required:
      - procedure_id
      - version
      - source_receipt_ids
      - steps
      properties:
        procedure_id:
          type: string
        version:
          type: integer
          description: >-
            1 for a receipt-literal procedure. 2 for a canonical one (compiled with `canonical` true):
            semantic targets (`target`), typed-text slots (`slots`) and verified postconditions (`expect`).
        source_receipt_ids:
          type: array
          items:
            type: string
        steps:
          type: array
          items:
            type: object
            required:
            - step
            - action
            - expected_outcome
            properties:
              step:
                type: integer
              action:
                type: object
                additionalProperties: true
              expected_outcome:
                type: string
                enum:
                - verified
                - failed
                - unknown
              redacted_input:
                type: boolean
                default: false
                description: |
                  True when the action carries a redaction marker: what was typed or selected
                  was masked when the receipt was written, so a replay must supply it. The
                  replay check answers repair_required for such a step, never exact. In a
                  version 2 procedure a typed value is a slot the replay supplies, so the flag
                  only records the mask there; a masked step outside a slot is still never exact.
              target:
                $ref: '#/components/schemas/StepTarget'
              slot:
                type: string
                nullable: true
                description: |
                  Version 2 only: the name of the slot this step types into (`slot_<step>`).
              expect:
                $ref: '#/components/schemas/StepExpectation'
        slots:
          type: array
          description: |
            Version 2 only: the typed-input slots. The step types into each at replay and the
            value is supplied then, never stored. Absent on a version 1 procedure.
          items:
            $ref: '#/components/schemas/ProcedureSlot'
    StepTarget:
      type: object
      description: |
        Version 2 only: the element a ref or semantic step acts on. The locator is the one
        Quarry resolved the element to. The fingerprint's normalized text is never included.
      required:
      - locator
      - fingerprint_id
      - tag
      properties:
        locator:
          $ref: '#/components/schemas/SemanticLocator'
        fingerprint_id:
          type: string
        tag:
          type: string
    ProcedureSlot:
      type: object
      description: |
        Version 2 only: a named input a procedure leaves open. The step types into it at
        replay; the value is supplied then and is never stored in the procedure.
      required:
      - name
      - step
      - kind
      properties:
        name:
          type: string
          description: slot_<step>, unique within the procedure.
        step:
          type: integer
        kind:
          type: string
          enum:
          - text
          - secret
    Envelope_BrowserProcedure:
      type: object
      required:
      - request_id
      - success
      - data
      properties:
        request_id:
          type: string
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/BrowserProcedure'
    ReplayCheckRequest:
      type: object
      required:
      - procedure
      properties:
        procedure:
          $ref: '#/components/schemas/BrowserProcedure'
        actions:
          type: array
          items:
            type: object
            additionalProperties: true
        prefix:
          type: boolean
          default: false
          description: >-
            E4.2 step 2: the actions are a leading part of the procedure, so the replay may stop early.
            Only a version 2 procedure takes it; a version 1 procedure with `prefix` true is refused with
            400 `prefix_needs_v2`. Actions beyond the procedure are always a repair.
    Envelope_ReplayDecision:
      type: object
      required:
      - request_id
      - success
      - data
      properties:
        request_id:
          type: string
        success:
          type: boolean
        data:
          type: object
          additionalProperties: true
    ProcedureImpactRequest:
      type: object
      required:
      - procedure
      properties:
        procedure:
          $ref: '#/components/schemas/BrowserProcedure'
        changed_urls:
          type: array
          items:
            type: string
            format: uri
    Envelope_ProcedureQuality:
      type: object
      required:
      - request_id
      - success
      - data
      properties:
        request_id:
          type: string
        success:
          type: boolean
        data:
          type: object
          additionalProperties: true
    Envelope_ProcedureImpact:
      type: object
      required:
      - request_id
      - success
      - data
      properties:
        request_id:
          type: string
        success:
          type: boolean
        data:
          type: object
          additionalProperties: true
    Envelope_ClosedRun:
      type: object
      required:
      - request_id
      - success
      - data
      properties:
        request_id:
          type: string
        success:
          type: boolean
        data:
          type: object
          required:
          - closed
          properties:
            closed:
              type: boolean
            usage:
              description: >-
                An agent-class run's spend, as it stood when the run ended (WS6.B).
                Absent for a person's session, which has no budget.
              type: object
              properties:
                class:
                  type: string
                  enum: [interactive, agent]
                spent_usd:
                  type: number
                  description: Estimated, from the flat action table plus a browser-time term.
                steps:
                  type: integer
                attempts:
                  type: integer
                active_s:
                  type: number
                exhausted:
                  type: string
                  nullable: true
                  enum: [steps, attempts, runtime, cost, null]
    SearchRequest:
      type: object
      required:
      - query
      properties:
        query:
          type: string
        limit:
          type: integer
          format: int32
          nullable: true
        country:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
        safe_search:
          type: boolean
          default: true
        topic:
          type: string
          nullable: true
          description: general | news | finance
        time_range:
          type: string
          nullable: true
          description: day | week | month | year
        days:
          type: integer
          format: int32
          nullable: true
        exact_match:
          type: boolean
          default: false
        chunks_per_source:
          type: integer
          format: int32
          nullable: true
        include_answer:
          type: boolean
          default: false
          description: >-
            Also synthesize an answer, as `POST /v1/answer` does. Never fails the
            search: the response carries `answer_status` (and `answer_reason`) to say
            whether `answer` is a real answer. Metered as `quarry.answer.synth` once
            per synthesis, never on a cache hit. Skipped under zero data retention.
        format:
          type: string
          nullable: true
          description: results | context
        highlight:
          type: boolean
          default: false
        facets:
          type: boolean
          default: false
        zdr:
          type: boolean
          nullable: true
          description: >-
            Zero data retention for this search: the cache and the durable content events are bypassed. A user
            of a ZDR organisation runs as ZDR whatever this says. A service caller (for example quarry-edge) must
            send it: an omitted value is refused with ZDR_REQUIRED (400). A ZDR search makes no rerank call (the
            rerank status is skipped, reason zdr).
        score_kinds:
          type: array
          default: []
          description: >-
            The score kinds the caller accepts on the results. Empty (the default) means the order only: no score
            reaches the wire. cross_encoder.v1 asks for the Data Plane's cross-encoder score on a reranked result
            set, and the response then names the kind in score_kind. An unknown kind is refused with
            SCORE_KIND_UNSUPPORTED (400).
          items:
            type: string
            enum:
            - cross_encoder.v1
        scrape:
          $ref: '#/components/schemas/SearchScrapeBlock'
    SearchResultItem:
      type: object
      required:
      - url
      - rank
      - provider
      properties:
        url:
          type: string
        title:
          type: string
          nullable: true
        snippet:
          type: string
          nullable: true
        rank:
          type: integer
          format: int32
        provider:
          type: string
        score:
          type: number
          format: float
          description: >-
            The Data Plane cross-encoder's relevance score for this result. Present only when the request asked
            for cross_encoder.v1 in score_kinds and the rerank was applied. Absent otherwise.
    FacetCount:
      type: object
      required:
      - value
      - count
      properties:
        value:
          type: string
        count:
          type: integer
    SearchResponse:
      type: object
      required:
      - query
      - provider
      - results
      - count
      properties:
        query:
          type: string
        provider:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResultItem'
        count:
          type: integer
        answer:
          type: string
          nullable: true
        answer_status:
          type: string
          description: >-
            Present only when the request set `include_answer`. `ok`: `answer` is a
            synthesized answer. `no_sources`: the pipeline ran and no source had text,
            `answer` is empty and no model was called. `skipped_zdr`: zero data
            retention is on, nothing was sent to a model and `answer` is absent.
            `unavailable`: no answer, `answer_reason` says why.
          enum:
          - ok
          - no_sources
          - skipped_zdr
          - unavailable
        answer_reason:
          type: string
          description: >-
            Present only with `answer_status` `unavailable`. A closed code, never
            provider text. See `AnswerErrorBody.reason` for what each one means and
            the setting that fixes it.
          enum:
          - synthesis_disabled
          - model_path_refused
          - no_search_provider
          - no_model_plane_url
          - model_client_init_failed
          - model_plane_auth_refused
          - model_plane_rate_limited
          - model_plane_error
          - answer_search_failed
        citations:
          type: array
          nullable: true
          items:
            type: object
        context:
          type: string
          nullable: true
        facets:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/FacetCount'
        policy_downgrades:
          type: array
          description: >-
            WS7.E. Capabilities the web policy removed from this request (today
            `search.paid_provider`). The search ran without them. A downgrade is
            never a 403; a ZDR floor is not listed here.
          items:
            type: string
        score_kind:
          type: string
          nullable: true
          description: >-
            The kind of the scores on results. Present only when the request asked for that kind in score_kinds
            and the rerank was applied.
          enum:
          - cross_encoder.v1
        rerank:
          $ref: '#/components/schemas/RerankReport'
        scrape:
          $ref: '#/components/schemas/SearchScrapeReport'
    SearchScrapeBlock:
      type: object
      description: >-
        E3.7.7a. Hydrates the top results of this search through the edge's markdown fetch path, with the
        request's web policy and the security preflight applied to every URL before its fetch. Read only when
        QUARRY_EDGE__SEARCH_SCRAPE is on. Out-of-range values are refused with 400 BAD_REQUEST, not clamped.
        Hydrated text travels inline in this response only: it is never cached, never evented and never logged,
        under zero data retention too.
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
          description: How many of the top results to hydrate.
        max_chars:
          type: integer
          minimum: 1
          maximum: 50000
          default: 8000
          description: Characters of markdown kept per result. The camelCase alias maxChars is accepted.
        timeout_ms:
          type: integer
          minimum: 1000
          maximum: 55000
          default: 15000
          description: One time budget for the whole block, in milliseconds. The camelCase alias timeoutMs is accepted.
        formats:
          type: array
          description: Only markdown is supported, and it is the default. Any other entry is a 400 UNSUPPORTED_OPTION.
          items:
            type: string
            enum:
            - markdown
    SearchScrapeReport:
      type: object
      description: >-
        The scrape block's result. It is present only when the request sent a scrape block. With the flag off
        the status is disabled and nothing was fetched.
      required:
      - status
      - requested
      - hydrated
      - failed
      properties:
        status:
          type: string
          enum:
          - ok
          - disabled
        requested:
          type: integer
          minimum: 0
          description: Results the block tried to hydrate.
        hydrated:
          type: integer
          minimum: 0
          description: Results that came back with markdown.
        failed:
          type: integer
          minimum: 0
          description: Results that came back with a failure code.
        items:
          type: array
          description: One entry per result the block tried, in result order. Absent when there are none.
          items:
            $ref: '#/components/schemas/SearchScrapeItem'
    SearchScrapeItem:
      type: object
      description: >-
        One hydrated result. Status ok carries markdown, chars and truncated. Status failed carries a closed
        code, and http_status when the code is http_status. A failure never carries page text, host or provider
        text.
      required:
      - url
      - position
      - status
      properties:
        url:
          type: string
          description: The result's URL, as the search returned it.
        position:
          type: integer
          minimum: 1
          description: 1-based position in results.
        status:
          type: string
          enum:
          - ok
          - failed
        markdown:
          type: string
          description: Present when status is ok. The page as markdown, cut at max_chars.
        chars:
          type: integer
          minimum: 0
          description: Present when status is ok. Characters in markdown after the cap.
        truncated:
          type: boolean
          description: Present when status is ok. True when the page had more than max_chars characters.
        code:
          type: string
          description: >-
            Present when status is failed. policy_denied, blocked and invalid_url are refused before the fetch and
            are not billed. The others happen after it.
          enum:
          - policy_denied
          - blocked
          - invalid_url
          - deadline_exceeded
          - http_status
          - too_large
          - decode
          - extract
          - timeout
          - transport
          - empty
          - too_short
        http_status:
          type: integer
          description: Present when code is http_status. The status the origin answered with.
    RerankReport:
      type: object
      description: >-
        What the rerank step did for this search. The field is absent when no rerank step is wired in.
        applied: the Data Plane's scores ordered the head of the results. skipped: the Data Plane was not asked,
        and the reason says why (disabled, misconfigured, processor_unapproved, metering_unavailable, zdr,
        sovereign, circuit_open, input_not_tenant, input_too_small, empty_query, or unknown for a Data Plane reason
        Quarry does not name). degraded: it was asked and failed, so the results keep their input order, and the
        reason says how (refused, contract, rate_limited, provider_rate_limited, provider_error, unreachable,
        token_unavailable, timeout, no_scores). shadow: it was asked and its order was measured, but the results
        keep their order and carry no score. Only applied and rerank-not-configured outcomes are cached.
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - applied
          - skipped
          - degraded
          - shadow
          - rerank-not-configured
        reason:
          type: string
          nullable: true
          description: >-
            Why the status is skipped or degraded. For shadow it is would_apply when the Data Plane's order would have
            reordered the head, and otherwise the reason the call would have been skipped or degraded. Absent for applied.
        profile:
          type: string
          nullable: true
          description: The rerank profile that ran, or would have run (web-v1).
    ImageSearchRequest:
      type: object
      required:
      - query
      properties:
        query:
          type: string
          minLength: 1
          description: The search text. It is trimmed before the search, and empty after trimming is refused with BAD_REQUEST.
        limit:
          type: [integer, 'null']
          minimum: 0
          description: Most images to return. Absent or null means 24. The handler clamps any value to 1 through 50.
    ImageSearchResponse:
      type: object
      required:
      - query
      - provider
      - images
      properties:
        query:
          type: string
          description: The query as the caller sent it, untrimmed.
        provider:
          type: string
          description: Always searxng.
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageResult'
    ImageResult:
      type: object
      required:
      - img_src
      - thumbnail_src
      - source_url
      - title
      properties:
        img_src:
          type: string
          description: The full-resolution image URL. When SearXNG gave none, the thumbnail URL is used here.
        thumbnail_src:
          type: [string, 'null']
          description: The thumbnail URL, possibly a SearXNG-proxied path. Null when SearXNG gave none.
        source_url:
          type: string
          description: The page the image was found on. Empty when SearXNG gave none.
        title:
          type: [string, 'null']
          description: The image title or alt text. Null when SearXNG gave none.
    VideoSearchRequest:
      type: object
      required:
      - query
      properties:
        query:
          type: string
          minLength: 1
          description: The search text. It is trimmed before the search, and empty after trimming is refused with BAD_REQUEST.
        limit:
          type: [integer, 'null']
          minimum: 0
          description: Most videos to return. Absent or null means 24. The handler clamps any value to 1 through 50.
    VideoSearchResponse:
      type: object
      required:
      - query
      - provider
      - videos
      properties:
        query:
          type: string
          description: The query as the caller sent it, untrimmed.
        provider:
          type: string
          description: Always searxng.
        videos:
          type: array
          items:
            $ref: '#/components/schemas/VideoResult'
    VideoResult:
      type: object
      description: One video hit. Every field is present; a field the engine did not give is null.
      required:
      - url
      - title
      - thumbnail_src
      - iframe_src
      - author
      - length
      - published_date
      - content
      properties:
        url:
          type: string
          description: The watch page, for attribution and click-through.
        title:
          type: [string, 'null']
        thumbnail_src:
          type: [string, 'null']
          description: The poster or preview image, possibly a SearXNG-proxied path.
        iframe_src:
          type: [string, 'null']
          description: The embeddable player URL, when the engine exposes one.
        author:
          type: [string, 'null']
          description: The uploader or channel name.
        length:
          type: [string, 'null']
          description: The duration exactly as the upstream reported it. Not parsed, because engines disagree on the format.
        published_date:
          type: [string, 'null']
          description: The publication date exactly as the upstream reported it. Not parsed.
        content:
          type: [string, 'null']
          description: A description snippet.
    SimilarRequest:
      type: object
      properties:
        url:
          type: [string, 'null']
          description: A page whose markdown seeds the search. Checked against the web policy even when text is also sent, and fetched only when text is absent.
        text:
          type: [string, 'null']
          description: A passage that seeds the search. It wins over url when both are sent, and it is trimmed and cut to 2000 characters.
        limit:
          type: [integer, 'null']
          minimum: 0
          description: Most neighbours to return. Absent or null means 10. The handler clamps any value to 1 through 50.
    SuggestRequest:
      type: object
      required:
      - query
      properties:
        query:
          type: string
          description: The query as the user typed it. An empty query is answered with an empty result, not refused.
    SuggestResponse:
      type: object
      description: >-
        The suggestions for one query. related_queries is always present, and may be empty. corrected_query is
        present only when the query likely has a typo, and entity only when the query names one specific entity.
      required:
      - related_queries
      properties:
        corrected_query:
          type: string
          description: The corrected spelling. Present only when it differs from the query.
        related_queries:
          type: array
          maxItems: 5
          items:
            type: string
          description: Up to five distinct follow-up searches.
        entity:
          $ref: '#/components/schemas/SuggestEntityPanel'
    SuggestEntityPanel:
      type: object
      required:
      - name
      - facts
      properties:
        name:
          type: string
        kind:
          type: string
          description: A short type label. Absent when the model gave none.
        summary:
          type: string
          description: One or two factual sentences. Absent when the model gave none.
        facts:
          type: array
          maxItems: 5
          description: Up to five key facts. May be empty.
          items:
            $ref: '#/components/schemas/SuggestEntityFact'
    SuggestEntityFact:
      type: object
      required:
      - label
      - value
      properties:
        label:
          type: string
        value:
          type: string
    AudioSpeechRequest:
      type: object
      description: Text to speak. The fields are forwarded to the Model Plane as sent; the edge checks only their types.
      required:
      - input
      properties:
        input:
          type: string
          description: The text to speak. The edge does not check its length; the Model Plane does.
        voice:
          type: [string, 'null']
          description: The voice the Model Plane should use.
        format:
          type: [string, 'null']
          description: The audio format the caller asks for, in the Model Plane's values.
        speed:
          type: [number, 'null']
          format: float
          description: The speaking rate, as the Model Plane reads it.
        provider:
          type: [string, 'null']
          description: The speech provider the caller asks for, where the Model Plane offers a choice.
        zdr:
          type: [boolean, 'null']
          description: >-
            Zero data retention for this request, forwarded to the Model Plane. A token of a ZDR organisation raises
            it to true whatever this says.
    AudioTranscriptionRequest:
      type: object
      description: Audio to transcribe. The audio_url passes the web policy before anything leaves the edge, and the Model Plane fetches it.
      required:
      - audio_url
      properties:
        audio_url:
          type: string
          description: The URL of the recording.
        mime:
          type: [string, 'null']
          description: The recording's MIME type, when the caller knows it.
        language:
          type: [string, 'null']
          description: The language of the recording, when the caller knows it.
        provider:
          type: [string, 'null']
          description: The transcription provider the caller asks for, where the Model Plane offers a choice.
        zdr:
          type: [boolean, 'null']
          description: >-
            Zero data retention for this request, forwarded to the Model Plane. A token of a ZDR organisation raises
            it to true whatever this says. The web policy is checked with the same posture.
    AudioUsageError:
      allOf:
      - $ref: '#/components/schemas/ErrorBody'
      - type: object
        required:
        - received_url
        properties:
          received_url:
            type: [string, 'null']
            description: The body's url field when it had one, otherwise null.
    AudioPolicyRefusal:
      allOf:
      - $ref: '#/components/schemas/ErrorBody'
      - type: object
        required:
        - details
        properties:
          details:
            type: object
            description: >-
              The closed denial: a reason, the deciding layer where there is one, the capability for a domain denial
              (domains.deny or domains.allow), and the host only when zero data retention is off. The url is never included.
    MapRequest:
      type: object
      required:
      - url
      properties:
        url:
          type: string
        search:
          type: string
          nullable: true
        limit:
          type: integer
          format: int32
          nullable: true
        include_subdomains:
          type: boolean
          default: false
    MapLink:
      type: object
      required:
      - url
      properties:
        url:
          type: string
        title:
          type: string
          nullable: true
        score:
          type: number
          format: float
          nullable: true
    MapResponse:
      type: object
      required:
      - url
      - links
      - count
      - ranked
      properties:
        url:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/MapLink'
        count:
          type: integer
        ranked:
          type: boolean
    ExtractRequest:
      type: object
      required:
      - urls
      properties:
        urls:
          type: array
          items:
            type: string
        schema:
          type: object
          nullable: true
          description: JSON Schema for structured output
        prompt:
          type: string
          nullable: true
          maxLength: 10000
          description: >-
            Instructions for the model, 1 to 10000 characters after trimming (control
            characters other than line breaks and tabs are dropped). With `schema` they
            steer the schema-guided extraction and cannot relax the schema; alone they ask
            for one free-form JSON object. The page text is sent as data, outside the
            instructions. The prompt is never echoed in a response or written to a log.
            An empty or over-long prompt is a 400.
        max_urls:
          type: integer
          format: int32
          nullable: true
    ExtractItem:
      type: object
      required:
      - url
      - status
      properties:
        url:
          type: string
        status:
          type: string
          description: ok | fetched | error
        data:
          type: object
          nullable: true
        markdown:
          type: string
          nullable: true
        structured:
          $ref: '#/components/schemas/StructuredData'
        error:
          type: string
          nullable: true
        schema_valid:
          type: boolean
          description: >-
            Present when a `schema` was sent and the model answered: whether `data`
            conforms to it. `status` stays `ok` either way. Absent for a prompt-only
            request.
        schema_issues:
          type: array
          items:
            type: string
          description: Why `data` does not conform, one line per issue. Present only when `schema_valid` is false.
        truncated_input:
          type: boolean
          description: >-
            True when the page was longer than the 20000-byte input cap and `markdown`
            or the text the model read is only its start. Absent otherwise.
    StructuredData:
      type: object
      description: >-
        Machine-readable facts harvested from the page's own markup — hydration
        payloads, JSON-LD, microdata and tables — alongside the prose. Present
        only when the page carried any, and independent of `status`: a
        schema-guided extraction and a markdown one read the same page. Added
        because readability strips `<script>` by design, which on a
        hydration-rendered page (Enonic, Next.js, Nuxt) discards the very
        figures the page exists to publish.
      properties:
        figures:
          type: array
          description: Labelled scalars, each with its unit and period where the page gave one.
          items:
            $ref: '#/components/schemas/StructuredKeyFigure'
        tables:
          type: array
          items:
            type: object
        microdata:
          type: array
          items:
            type: object
        blobs:
          type: array
          description: Bounded raw JSON objects kept when no narrower shape fit.
          items:
            type: object
        truncated:
          type: boolean
          description: >-
            True when a size cap was hit, i.e. the page carried more than was
            kept. A caller may treat it as a hint to escalate to a full render
            rather than trusting a partial harvest.
    StructuredKeyFigure:
      type: object
      required:
      - label
      - value
      properties:
        label:
          type: string
        value:
          type: string
          description: Kept as a string; separators carry locale meaning (e.g. "729 437").
        unit:
          type: string
        period:
          type: string
          description: >-
            The period the figure describes. A figure without one is a correct
            answer this quarter and a wrong one next.
    ExtractResponse:
      type: object
      required:
      - results
      - count
      - requested
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ExtractItem'
        count:
          type: integer
        requested:
          type: integer
    AnswerRequest:
      type: object
      required:
      - query
      properties:
        query:
          type: string
        top_k:
          type: integer
          nullable: true
          description: Sources to read, 1 to 20 (default 5)
        country:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
        zdr:
          type: boolean
          nullable: true
          description: Raised, never lowered, by the token's zero data retention floor
    AnswerCitation:
      type: object
      required:
      - url
      - rank
      properties:
        url:
          type: string
        title:
          type: string
          nullable: true
        rank:
          type: integer
        provider:
          type: string
        outcome:
          type: object
          description: >-
            Where the cited text came from: `kind` is `fetched`, `snippet_fallback`
            (the page fetch failed and the search snippet stood in; `reason` says why),
            `failed` or `budget_exhausted`.
        structured:
          type: object
          description: The structured facts harvested from the page, when it had any
    AnswerResponse:
      type: object
      required:
      - query
      - answer
      - citations
      - model
      - latency_ms
      - sources_used
      - sources_skipped
      properties:
        query:
          type: string
        answer:
          type: string
        citations:
          type: array
          items:
            $ref: '#/components/schemas/AnswerCitation'
        model:
          type: string
        latency_ms:
          type: integer
        sources_used:
          type: integer
        sources_skipped:
          type: integer
        sources_snippet_fallback:
          type: integer
    AnswerErrorBody:
      allOf:
      - $ref: '#/components/schemas/ErrorBody'
      - type: object
        properties:
          reason:
            type: string
            description: >-
              A closed code, never provider text. `synthesis_disabled`: set
              `QUARRY_EDGE__ANSWER_SYNTHESIS=1`. `model_path_refused`: the switch is
              on but the boot gate refused it (the cross-plane manifest row
              `model-invoke` is not granted, or there is no service identity); read
              the edge boot log. `no_search_provider`: configure a
              search provider. `no_model_plane_url`: set
              `QUARRY_EDGE__MODEL_PLANE_URL`. `model_client_init_failed`: the URL is
              not a usable base URL, read the edge boot log. These five are 501
              `UNSUPPORTED`. `zdr_unavailable`: 403 `FORBIDDEN`, zero data retention
              (ADR-4), refused before any work. `model_plane_auth_refused`: 503 `UNAVAILABLE`, the
              Control Plane registry or the Model Plane gateway refuses quarry-edge
              (an owner decision, INNH-8b). `model_plane_rate_limited` and
              `model_plane_error`: the model call failed. `answer_search_failed`: the
              search or page-fetch step failed. Absent on a 400.
            enum:
            - synthesis_disabled
            - zdr_unavailable
            - model_path_refused
            - no_search_provider
            - no_model_plane_url
            - model_client_init_failed
            - model_plane_auth_refused
            - model_plane_rate_limited
            - model_plane_error
            - answer_search_failed
    ErrorBody:
      type: object
      required:
      - error
      - code
      properties:
        error:
          type: string
        code:
          type: string
        hint:
          type: string
          nullable: true
        next_actions:
          type: array
          description: Suggested client next steps; present on a 429 and on the 501 of `/v1/extract`.
          items:
            type: string
    RateLimitError:
      allOf:
      - $ref: '#/components/schemas/ErrorBody'
      - type: object
        properties:
          window:
            type: string
            nullable: true
          retry_after_seconds:
            type: integer
            nullable: true
          next_actions:
            type: array
            items:
              type: string
    RedirectProbeResult:
      type: object
      description: >-
        The answer of POST /v1/browser/redirect-hop. `target` is always present: the absolute URL of a
        validated redirect, or null for any other status.
      required:
      - target
      properties:
        target:
          type: [string, 'null']
    AuditPage:
      type: object
      description: >-
        The bounded_page_v1 evidence of one public page (POST /v1/audit/page). No raw HTML, no artifact,
        no ingest and no durable storage. `metadata.title` and `metadata.description` are the page's own
        title and standard description tag, not Open Graph fallbacks. Links are capped at 100 and headings
        at 200, and `partial` is true when the source exceeds either cap.
      required:
      - version
      - url
      - final_url
      - status
      - fetched_at
      - run_id
      - fingerprint
      - metadata
      - canonical
      - links
      - headings
      - seo
      - redirects
      - partial
      - limits
      properties:
        version:
          type: string
          enum:
          - bounded_page_v1
        url:
          type: string
          description: The URL as requested
        final_url:
          type: string
          description: The URL the page was read from, after its redirects
        status:
          type: integer
          minimum: 0
          maximum: 65535
          description: The page's HTTP status; a 404 or a 500 is evidence, not a failure
        fetched_at:
          type: string
          format: date-time
          description: When the page was fetched, as an RFC 3339 time
        run_id:
          type: string
          description: An id for this capture, run_ prefixed; not a Quarry agent run
        fingerprint:
          type: string
          pattern: '^blake3:[0-9a-f]{64}$'
          description: The blake3 hash of the response body
        metadata:
          $ref: '#/components/schemas/AuditPageMetadata'
        canonical:
          type: [string, 'null']
          description: The page's canonical URL when it is public and within the length bound, or null
        links:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AuditPageLink'
        headings:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/AuditPageHeading'
        seo:
          $ref: '#/components/schemas/AuditPageSeo'
        redirects:
          type: array
          description: One entry per followed redirect, in order
          items:
            $ref: '#/components/schemas/AuditPageRedirect'
        partial:
          type: boolean
          description: True when the source has more links or headings than the caps allow
        limits:
          $ref: '#/components/schemas/AuditPageLimits'
    AuditPageMetadata:
      type: object
      required:
      - title
      - description
      - content_type
      properties:
        title:
          type: [string, 'null']
          maxLength: 512
        description:
          type: [string, 'null']
          maxLength: 2048
        content_type:
          type: [string, 'null']
          description: The response's Content-Type, at most 256 bytes
    AuditPageLink:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          maxLength: 4096
        text:
          type: string
          maxLength: 512
          description: The link text, when the link has any; absent otherwise
    AuditPageHeading:
      type: object
      required:
      - level
      - text
      properties:
        level:
          type: integer
          minimum: 1
          maximum: 6
        text:
          type: string
          maxLength: 512
    AuditPageSeo:
      type: object
      description: The structural SEO evidence of the page (seo_page_v1). Interpreting it is the caller's job.
      required:
      - version
      - noindex
      - nofollow
      - robots_status
      - word_count
      - hreflang
      - invalid_alternates
      - alternates_partial
      - structured_data
      properties:
        version:
          type: string
          enum:
          - seo_page_v1
        noindex:
          type: boolean
        nofollow:
          type: boolean
        robots_status:
          type: integer
          minimum: 0
          maximum: 65535
          description: The HTTP status of the robots.txt that was read
        word_count:
          type: integer
          minimum: 0
        hreflang:
          type: array
          items:
            $ref: '#/components/schemas/AuditPageAlternate'
        invalid_alternates:
          type: integer
          minimum: 0
        alternates_partial:
          type: boolean
        structured_data:
          $ref: '#/components/schemas/AuditPageStructuredData'
    AuditPageAlternate:
      type: object
      required:
      - lang
      - url
      properties:
        lang:
          type: string
        url:
          type: string
    AuditPageStructuredData:
      type: object
      required:
      - documents
      - invalid
      - types
      - partial
      properties:
        documents:
          type: integer
          minimum: 0
        invalid:
          type: integer
          minimum: 0
        types:
          type: array
          items:
            type: string
        partial:
          type: boolean
    AuditPageRedirect:
      type: object
      required:
      - url
      - status
      - target
      properties:
        url:
          type: string
        status:
          type: integer
          minimum: 0
          maximum: 65535
        target:
          type: string
    AuditPageLimits:
      type: object
      required:
      - body_bytes
      - timeout_ms
      - max_links
      properties:
        body_bytes:
          type: integer
          minimum: 0
        timeout_ms:
          type: integer
          minimum: 0
        max_links:
          type: integer
          minimum: 0
    RobotsFetchDenial:
      type: object
      description: >-
        error.details.denial of the 403 SECURITY_BLOCKED a page fetch gets when
        robots.txt refuses it (WS14.S4). The path never carries the query.
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - robots_disallowed
          - robots_unreachable
        message:
          type: string
        remedy:
          type: string
          nullable: true
        user_agent:
          type: string
          description: The product token whose group disallows the path (robots_disallowed).
        path:
          type: string
          description: The disallowed path, without the query (robots_disallowed).
        host:
          type: string
          description: The host whose robots.txt could not be fetched (robots_unreachable).
    RequestAsk:
      type: object
      description: >-
        WS7.C web-policy ask on a scrape request. It can only tighten what the
        operator baseline and the organisation's policy allow; it cannot loosen
        anything. A domain it denies is a 403 with details.reason policy_denied
        (capability domains.deny, decision_source request). An unknown capability
        in disable is a 400 with details.reason unknown_capability. Under
        QUARRY_EDGE__WEB_POLICY_ENFORCEMENT=observe the ask is only counted, never
        enforced.
      additionalProperties: false
      properties:
        disable:
          type: array
          items:
            type: string
          description: Capability keys to disable for this request (the catalogue names, for example browser.act.upload).
        robots_max:
          type: string
          enum:
          - strict
          - respect
          - ignore
          description: Lower the robots.txt ceiling for this request.
        proxy_max:
          type: string
          enum:
          - none
          - pool
          description: Lower the proxy tier ceiling for this request.
        deny_domains:
          type: array
          items:
            type: string
          description: Hosts to refuse for this request (exact host or dot-suffix match).
        allow_domains:
          type: array
          nullable: true
          items:
            type: string
          description: Hosts to allow for this request. Applies to autonomous (service) callers only.
    ScrapeRequest:
      type: object
      additionalProperties: true
      x-quarry-lenient: >-
        Keys that are not listed are ignored with an unknown_field warning
        (and Deprecation and Sunset headers) until the edge runs strict, where
        they are a 400.
      x-quarry-lenient-until: >-
        Lenient until QUARRY_EDGE__SCRAPE_STRICT_AFTER is reached (an RFC 3339
        time or a YYYY-MM-DD date, read at start). From that instant unknown keys
        are a 400. A response that carries unknown-field warnings gets
        Deprecation: true, and Sunset with the date while the variable is set.
        QUARRY_EDGE__SCRAPE_REQUEST_VALIDATION=strict makes the edge strict at
        once. No date is set in this repository: the operator sets it when the
        quarry.scrape.unknown_field log line shows that no caller still sends an
        unlisted key.
      required:
      - url
      properties:
        privacy:
          type: object
          nullable: true
          description: Privacy policy for this request (purpose, classification, third-party processing). ZDR raises it.
        render:
          type: object
          nullable: true
          description: Render hints for the browser driver (waitForSelector, waitForTimeoutMs).
          properties:
            waitForSelector:
              type: string
            waitForTimeoutMs:
              type: integer
        prefer_http3:
          type: boolean
          default: false
          description: Prefer HTTP/3 when the edge was built and configured for it.
        policy:
          $ref: '#/components/schemas/RequestAsk'
        url:
          type: string
          format: uri
          description: URL to scrape
          example: https://example.com/article
        prev_fingerprint:
          type: string
          nullable: true
          description: Previous blake3 fingerprint for change detection
        cache:
          $ref: '#/components/schemas/CachePolicy'
        zdr:
          type: boolean
          default: false
          description: Zero Data Retention mode — skip all durable writes
        signals:
          $ref: '#/components/schemas/DriverSignals'
        ingest:
          type: boolean
          default: false
          description: Forward results to Data Plane for ingestion
        org_id:
          type: string
          nullable: true
          description: Organization ID for Data Plane ingest
        formats:
          type: array
          description: >-
            What to return inline besides the artifact references. `markdown`,
            `html` (the HTML the markdown was made from, after the cleaning options),
            `rawHtml` (the document as fetched), `links` and `metadata` (the
            last two are in every response already). Naming formats makes the
            request non-default: it neither reads nor writes the page cache. Under
            ZDR the default is `["markdown"]`. `json`, `summary`, `question` and
            `highlights` (INNH-1, see ScrapeAiFormat and CONTRACTS.md "Scrape AI
            formats") ask a model about the page: objects, and `summary` also as the
            string. Refused with 400 `feature_disabled` at `formats[i]` while
            QUARRY_EDGE__AI_FORMATS is not `on`, and at most one of each kind
            (`too_many`). The bare strings `json`, `question` and `highlights` are
            400 `missing_field` at `formats[i].schema`, `.question` and `.query`. The
            result is inline only (`json`, `summary`, `answer`, `highlights` on the
            response, a report in `ai`); it is never stored, cached or put in an
            event. Under Zero Data Retention every AI format is answered `skipped`
            with code `ZDR_UNAVAILABLE` and no model is called. A model failure never
            fails the scrape: it is an `error` or `skipped` entry in `ai` inside the 200.
            `screenshot` and `pdf` are captures (WS13.4b), given as a string or as an
            object `{"type": "screenshot"}` or `{"type": "pdf"}` with options (see
            CONTRACTS.md section 10). Refused with 400 `feature_disabled` at `formats`
            while QUARRY_EDGE__SCRAPE_CAPTURE is not `on`.
          items:
            oneOf:
            - type: string
              enum: [markdown, html, rawHtml, links, metadata, screenshot, pdf, summary]
            - type: object
              required:
              - type
              properties:
                type:
                  type: string
                  enum: [screenshot, pdf]
            - $ref: '#/components/schemas/ScrapeAiFormat'
        only_main_content:
          type: boolean
          default: true
          description: true runs the main-content heuristic (extractor readability); false keeps the whole body (clean_full). Must agree with extractor. camelCase alias onlyMainContent.
        include_tags:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 256
          description: CSS selectors; only the matching subtrees are kept, each once. Matching nothing gives empty markdown and the warning include_tags_matched_nothing. An invalid selector is a 400 invalid_selector. Alias includeTags.
        exclude_tags:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 256
          description: CSS selectors; every match and its subtree is removed before extraction. Alias excludeTags.
        remove_base64_images:
          type: boolean
          default: false
          description: Strip inline base64 images (clean_full always does). Alias removeBase64Images.
        extractor:
          type: string
          enum: [readability, clean_full, raw]
          default: readability
          description: readability (main content), clean_full (whole body without scripts and chrome) or raw (as is). Setting it against only_main_content is a 400 conflicts_with_only_main_content.
        timeout_ms:
          type: integer
          minimum: 1000
          maximum: 55000
          default: 55000
          description: Upper bound for the whole scrape; on expiry the response is a 504 TIMEOUT with details.op = scrape. Alias timeoutMs.
        max_inline_bytes:
          type: integer
          minimum: 1
          maximum: 8388608
          default: 1048576
          description: Cap for each inline field. Over it, a non-ZDR field is left out (listed in omitted), a ZDR field is cut (listed in truncated). Alias maxInlineBytes.
        actions:
          type: array
          nullable: true
          maxItems: 50
          description: >-
            Actions run in order on the page the scrape opened (WS13.5). Off by
            default: QUARRY_EDGE__SCRAPE_ACTIONS must admit the caller (`user` admits
            user tokens, dev only; `on` also admits a service principal with
            scrape:interact). Each item is an object whose `type` is one of wait
            (`milliseconds`, or `selector` with `timeoutMs`), click (`selector`), write
            (`selector` and `text`; the text is never echoed), press (`key`: a named key
            such as Enter, Tab or Escape, or one printable character), scroll (`to` top
            or bottom, or `selector`, or `direction` up or down with `pixels`), select
            (`selector` and `value`), screenshot and pdf (their options, as in formats).
            At most 50 actions; the total wait is at most 60 s and one wait at most 30 s.
            The types executeJavascript, evaluate, navigate, back, forward, clickPoint,
            mouseWheel, upload, download and dialog are refused by name (action_denied).
            A request labelled initiated_by "agent" is refused with 403
            scrape_interact_scope_required whatever the token. Not served on
            /v1/scrape/stream (400 unsupported_in_stream).
          items:
            type: object
            required:
            - type
            properties:
              type:
                type: string
                enum: [wait, click, write, press, scroll, select, screenshot, pdf]
        actions_on_error:
          type: string
          enum: [abort, continue]
          default: abort
          description: >-
            What to do when an action fails. abort stops the run and answers with the
            outcome of every action in error.details.actions; continue goes on to the
            next action. There is no retry: a replayed click or type can submit twice.
            Alias actionsOnError.
        max_age:
          type: integer
          minimum: 0
          maximum: 2592000000
          description: >-
            INNH-7. Serve a stored result no older than this many milliseconds
            (Firecrawl's maxAge) instead of fetching. Alias maxAge. Absent: the
            result cache is not read and the request behaves as before. 0: it is
            not read (the fresh result is still written). N: the result stored for
            the same organization, canonical URL (fragment and tracking parameters
            dropped) and options (formats, selectors, extractor), if it was fetched
            at most N ms ago; otherwise the page is fetched and the entry replaced.
            A hit makes no fetch, is not metered as scrape.page, has no scrape_id,
            keeps the ORIGINAL data.fetched_at, and says so in
            effective_options (cache_state hit, cached_at, cache_age_ms); markdown,
            html and rawHtml are rebuilt from the stored artifacts, and a result
            whose artifacts are gone is a miss. Entries live for cache.max_age_s
            (default 3600 s), so a max_age beyond that behaves as that TTL. Never
            served or written for ZDR (warning max_age_ignored_zdr), captures,
            actions, AI formats, the browser driver, a non-default web policy,
            ingest, or a private privacy class (warning max_age_ignored); with no
            cache backend it is ignored with the warning cache_unavailable. 400
            feature_disabled at max_age while QUARRY_EDGE__SCRAPE_MAX_AGE is not
            on; 400 out_of_range above 30 days, invalid_type for a non-integer.
            Not on crawl, batch or run_page. cache.max_age_s is a different
            thing: the TTL, in seconds, of the entry this request writes.
            A 2xx page the run flagged as a bot wall or a soft-404 is returned
            as usual but never written, so the next call fetches again.
        redact_pii:
          type: string
          enum: ['off', 'on']
          default: 'off'
          description: >-
            E3.6-5. on: the returned text goes through the PII scanner before it
            is cached, recorded or answered (inline markdown, html, rawHtml, the
            AI source, the page title, description, author and keywords, and the
            extraction title, excerpt and summary); the text fingerprint is
            cleared, and a field the redaction markers grow past
            max_inline_bytes is cut again and named in truncated. Absent and off
            are the same request. Alias redactPii. 400 requires_zdr (path
            redact_pii) outside zero data retention; 400
            not_supported_with_redact_pii with a screenshot or pdf format (path
            formats) or with actions (path actions); 400 unsupported_redact_pii
            for any other value. A redacted request never reads or writes the
            page or result cache. Refused on /v1/scrape/stream
            (unsupported_in_stream).
        no_egress:
          type: boolean
          default: false
          description: >-
            Q3-E3.8.8w. true: the page is served from the organization's stored capture in
            the Data Plane, read through its API only, and no connection is opened to the
            page's host. That means no robots.txt or sitemap discovery, no redirect follow,
            no proxy and no DNS lookup of the host. Absent and false are the same request.
            Alias noEgress. Off unless QUARRY_EDGE__NO_EGRESS is on (default off), the edge
            has a Data Plane URL and the cross-plane token provider. A page with no stored
            capture is 404 NOT_FOUND with details.reason no_egress_miss, and the URL is in
            neither the message nor the details. 400 feature_disabled (path no_egress)
            while the switch is off; 400 not_supported_with_no_egress with a screenshot or
            pdf format (path formats), with actions (path actions), with locale, timezone
            or location (path no_egress) or with ingest (path ingest); 400 invalid_type
            for a value that is not a boolean; 503 RUNTIME_NOT_READY (details.reason
            no_egress_unavailable) when the switch is on but the Data Plane reader could
            not be built. Under zero data retention it is 403 FORBIDDEN with
            details.reason no_egress_zdr_refused, before anything is read. A no_egress
            request never reads or writes the page or result cache, takes no per-host
            slot, and indexes, titles or ingests nothing. Its effective_options carry
            no_egress true. Refused on /v1/scrape/stream (unsupported_in_stream) and on
            crawl and batch scrape_options (unsupported_option).
        locale:
          type: string
          maxLength: 35
          description: >-
            E4.4-a. The language tag the page emulates, as Chromium takes it:
            navigator.language and Intl see it. nb-NO is stored as nb_NO. Absent: the
            host's locale, as before. Off unless QUARRY_EDGE__PER_PAGE_LOCALE is on; while
            off the key is an unknown field. 400 invalid_locale (path locale) for a value
            that is not a language tag such as en-US or nb-NO. A request with a locale is
            browser work: the page is emulated before its first navigation, and it never
            reads or writes the page or result cache. Refused on /v1/scrape/stream
            (unsupported_in_stream) while the switch is on. On an edge with no browser,
            400 unsupported_option, one field error per emulated field (locale,
            timezone or location).
        timezone:
          type: string
          maxLength: 64
          description: >-
            E4.4-a. The IANA timezone the page emulates, such as Europe/Oslo (Date and
            Intl use it). Absent: the host's timezone. The same switch, cache and stream
            rules as locale. 400 invalid_timezone (path timezone) for a name that is not
            IANA-shaped. A name the browser does not know is refused with 400
            page_emulation_failed (details.field timezone).
        location:
          type: object
          required: [latitude, longitude]
          additionalProperties: false
          properties:
            latitude:
              type: number
              minimum: -90
              maximum: 90
            longitude:
              type: number
              minimum: -180
              maximum: 180
            accuracy:
              type: number
              exclusiveMinimum: 0
              maximum: 100000
          description: >-
            E4.4-a. The geolocation the page reports to navigator.geolocation, in decimal
            degrees, with an accuracy in metres (default 100). The position is granted to
            the origin the scrape navigates to, which is the permission a site checks before
            it reads the position. The same switch, cache and stream rules as locale. 400
            out_of_range with path location.latitude, location.longitude or
            location.accuracy; missing_field or unknown_field inside the object; invalid_type
            for a value that is not a number or an object.
        profile_id:
          type: string
          maxLength: 64
          pattern: '^prof_[0-9A-HJKMNP-TV-Z]{26}$'
          description: >-
            E4.4-b. Pins one stored browser profile (prof_<ulid>) to this one scrape: the
            page is loaded in the browser with that profile restored read-only, so nothing
            the page sets is written back to the profile. Alias profileId. Off unless
            QUARRY_EDGE__SCRAPE_PROFILE_PIN is on (default off); while off the key is an
            unknown field (stripped, never read). Accepted for person tokens only: the
            profile must belong to the caller's verified identity, and a profile id that is
            unknown to the caller is 404 NOT_FOUND (a profile is never created by this
            option). A pinned scrape is personalised, logged-in content: it never reads or
            writes the page or result cache, it is refused with ingest and under zero data
            retention, and its effective_options carry profile_pinned true, never the id.
            400 feature_disabled (path profile_id) while the switch is off on a caller that
            builds the options itself; 400 invalid_profile_id (path profile_id) for a value
            that is not a profile id; 400 conflicting_option (path profile_id) with actions
            (an authenticated action run needs its own gate) or with no_egress; 400
            invalid_type for a value that is not a string.
      description: >-
        Fields not listed here are unknown: ignored with an unknown_field warning
        (and Deprecation and Sunset headers) unless the edge runs strict, where they
        are a 400. skipTlsVerification, skip_tls_verification, proxy, proxyUrl,
        headers, mobile and stealth are always a 400 reserved_field. A bad value is
        a 400 with details.fields[] {path, code, message}.
    CrawlRequest:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          description: Seed URL for the crawl
        max_pages:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Maximum pages to crawl. Absent or 0 takes the default (1000; operator
            override QUARRY_CRAWL_DEFAULT_MAX_PAGES), never unlimited. A value above
            the hard ceiling (5000; QUARRY_CRAWL_HARD_MAX_PAGES) is clamped to it. The
            response reports the effective value in `limits`.
        max_depth:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Maximum link depth from the seed. Absent or 0 takes the default (5);
            clamped to the hard ceiling (10). Reported in `limits`.
        allow_subdomains:
          type: boolean
          description: >-
            WS14.S3. Follow links to subdomains of the seed host. Absent means false.
            The effective scope is echoed in `effective`.
        allow_external_links:
          type: boolean
          description: >-
            WS14.S3. Follow links to hosts unrelated to the seed host. Absent means false.
            The effective scope is echoed in `effective`.
        include_paths:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 512
          description: >-
            WS14.S6. Patterns a link must match at least one of (glob by default; `re:`
            prefixes a regular expression). At most 100 patterns across include_paths and
            exclude_paths together, 512 characters each, 8192 in total. A bad pattern is a 400
            with `details.fields[]` (path, code `invalid_pattern`). Enforced only when the
            scope mode is enforce; under observe the response carries `patterns_reported_not_enforced`.
        exclude_paths:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 512
          description: >-
            WS14.S6. Patterns that deny a link; they beat include_paths. Same caps as include_paths.
        deny_extensions:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 16
          description: WS14.S6. Extensions to deny, without the dot. Absent takes the built-in list.
        crawl_entire_domain:
          type: boolean
          default: true
          description: >-
            WS14.S6. Absent or true follows links across the whole domain. false keeps the
            crawl under the seed URL's directory (reported as `same_directory_only`).
        sitemap:
          type: string
          enum: [skip, include, only]
          default: skip
          description: >-
            WS14.S6, INNH-6a. `skip` (absent) follows links only. `include` also seeds the crawl
            with the URLs of the site's sitemaps (the robots.txt `Sitemap:` lines, else /sitemap.xml;
            gzip and indexes are read, within bounds), one level below the seed. `only` crawls the
            seed and the sitemap's URLs and follows no page link. Every sitemap URL goes through the
            crawl scope (host, include/exclude paths, extensions), robots.txt and the page bound
            before it is queued, and again when its page runs. A sitemap on another host is never
            fetched. Dark: with QUARRY_EDGE__CRAWL_SITEMAP off, `include` and `only` are a 400
            `unsupported_option`. Needs the crawl scope switch on (QUARRY_EDGE__CRAWL_SCOPE_MODE
            observe or enforce). The counts (`discovered`, `seeded`, `skipped`) are in the
            `run_completed` event as `sitemap`; when the discovery fails, `only` ends with
            `run_failed` code `sitemap_unavailable` and `include` goes on with links only.
        ignore_query_parameters:
          type: boolean
          description: WS14.S6. Reserved; any value is a 400 `unsupported_option` (F-t2-041).
        scrape_options:
          type: object
          description: >-
            INNH-6b. The per-page extraction options, applied to every page the crawl fetches.
            Dark: with QUARRY_EDGE__CRAWL_SCRAPE_OPTIONS off the field is a 400 `unsupported_option`.
            The same validators as /v1/scrape; the same limits (32 selectors of 256 characters,
            `timeout_ms` 1000 to 55000) and the same camelCase aliases. Only the options that can
            apply per page are accepted: `actions`, `actions_on_error`, `max_inline_bytes`,
            `screenshot`, `pdf`, `json`, `summary`, `question`, `highlights`, `locale`, `timezone`,
            `location`, `profile_id` and `profileId` (a browser set-up or profile for one request,
            which a crawl page does not have) and capture or AI `formats` are a 400
            `unsupported_option` with the path (`scrape_options.actions`). The
            stored markdown and html artifacts of each page, and the text `ingest: true` sends to
            the Data Plane, are the cleaned content. Links are discovered from the whole page
            whatever `include_tags` and `exclude_tags` cut. A page cleaned differently from the
            default neither reads nor writes the page cache. `redact_pii: on` redacts each page's
            text before anything is stored, through the pipeline stage. It needs
            QUARRY_EDGE__PII_REDACTION on; off, it is a 400 `unsupported_option` (path
            `scrape_options.redact_pii`). A redacted page neither reads nor writes the page cache.
            `data.effective.scrape_options` echoes the resolved form.
          properties:
            formats:
              type: array
              items:
                type: string
                enum: [markdown, html, rawHtml, links, metadata]
              description: >-
                Accepted for parity with /v1/scrape. A crawl page stores its artifacts whatever the
                list says, so it changes nothing that is stored.
            only_main_content:
              type: boolean
              description: Default true (the main-content extractor). false keeps the whole body. Alias onlyMainContent.
            include_tags:
              type: array
              maxItems: 32
              items:
                type: string
                maxLength: 256
              description: CSS selectors; only the matching parts are kept. Alias includeTags.
            exclude_tags:
              type: array
              maxItems: 32
              items:
                type: string
                maxLength: 256
              description: CSS selectors removed before extraction. Alias excludeTags.
            remove_base64_images:
              type: boolean
              description: Alias removeBase64Images.
            extractor:
              type: string
              enum: [readability, clean_full, raw]
              description: >-
                `readability` goes with only_main_content true; `clean_full` and `raw` go with
                false. A disagreement is a 400 `conflicts_with_only_main_content`.
            timeout_ms:
              type: integer
              minimum: 1000
              maximum: 55000
              description: The bound on one page's run. Alias timeoutMs.
        ignore_robots_txt:
          type: boolean
          description: >-
            WS14.S6. `true` is a 403 `policy_denied` for every request until the entitlement
            (WS14.S7) is built. `false` is accepted. Service principals are refused in any case.
        webhook:
          $ref: '#/components/schemas/JobWebhook'
    BatchRequest:
      type: object
      required:
      - urls
      properties:
        urls:
          type: array
          items:
            type: string
            format: uri
          description: URLs to scrape in parallel
        redact_pii:
          type: string
          description: >-
            CW-1. A batch page has no per-page scrape options, so it cannot be redacted: `on`
            (or `redactPii: on`) is a 400 `unsupported_option`. `off` is the default.
        max_parallel:
          type: integer
          minimum: 1
          description: >-
            W3-E3.7.2w. How many of the batch's pages run at a time. Read only with
            QUARRY_EDGE__BATCH_PARALLEL on; off, the key is ignored. Absent takes 4, clamped to the edge
            ceiling (QUARRY_EDGE__BATCH_MAX_PARALLEL, default 4, at most 16). A larger value is clamped to
            the ceiling and reported in limits.max_parallel. Sending both max_parallel and maxParallel is
            a 400.
        maxParallel:
          type: integer
          minimum: 1
          description: Alias of max_parallel (W3-E3.7.2w).
        webhook:
          $ref: '#/components/schemas/JobWebhook'
    JobWebhook:
      type: object
      description: >-
        W3-E3.5-3. A per-job webhook: Quarry posts the run's events to `url`, signed like a webhook
        subscription. A bare URL string is also accepted, with the default events. Dark: with
        QUARRY_EDGE__JOB_WEBHOOK off, `webhook` is a 400 `reserved_field`. The edge checks an https URL
        with no credentials or fragment, no literal private, loopback or link-local address and no
        `localhost`, and a closed `events` list; a malformed value is a 400 with `details.fields[]`
        (path `webhook`, `webhook.url` or `webhook.events`). A zero-data-retention request may not carry
        one. Control vets the host again before it stores the hook.
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: The https URL the events are posted to.
        events:
          type: array
          items:
            type: string
            enum:
            - page_failed
            - page_fetched
            - run_cancelled
            - run_completed
            - run_failed
            - run_started
            - run_timed_out
          description: >-
            The events to deliver, from this closed list; duplicates are dropped. Absent takes
            run_cancelled, run_completed, run_failed and run_timed_out.
    CachePolicy:
      type: object
      properties:
        mode:
          type: string
          enum:
          - read_write
          - read_only
          - write_only
          - bypass
          default: read_write
        max_age_s:
          type: integer
          default: 0
          description: >-
            The TTL in seconds of a result this request writes to the cache (0 = use
            the default 3600 s). It is not the freshness a read requires: that is the
            request's max_age, in milliseconds. `mode` may be left out (INNH-7: it was
            required by the Rust type although documented as defaulting to read_write).
    DriverSignals:
      type: object
      properties:
        actions:
          type: array
          items:
            type: string
          default: []
          description: Actions that require a browser driver
        screenshot:
          type: boolean
          default: false
        pdf:
          type: boolean
          default: false
        prior_block_signals:
          type: integer
          default: 0
          deprecated: true
          description: >-
            Deprecated. Number of prior blocks. Under QUARRY_BLOCK_ESCALATION=legacy
            a value of 1 selects the TLS driver and 2 or more the browser; under
            honest (WS3.I) the field is accepted and ignored, because a block never
            changes the identity Quarry presents.
        profile_required:
          type: boolean
          default: false
        url_type:
          type: string
          enum:
          - json
          - plain_text
          - default
          default: default
    NormalizedOutput:
      type: object
      required:
      - run_id
      - url
      - status
      - fetched_at
      - fingerprint
      - formats
      - change
      - metadata
      - driver
      properties:
        run_id:
          type: string
          description: Typed ID with run_ prefix
        url:
          $ref: '#/components/schemas/UrlTriple'
        status:
          type: integer
          description: HTTP status code from upstream
        fetched_at:
          type: string
          format: date-time
        fingerprint:
          type: string
          description: blake3:<hex> content fingerprint
        formats:
          $ref: '#/components/schemas/OutputFormats'
        change:
          $ref: '#/components/schemas/ChangeInfo'
        metadata:
          $ref: '#/components/schemas/PageMetadata'
        driver:
          $ref: '#/components/schemas/DriverInfo'
    UrlTriple:
      type: object
      required:
      - requested
      - final_url
      properties:
        requested:
          type: string
        final_url:
          type: string
        canonical:
          type: string
          nullable: true
    OutputFormats:
      type: object
      properties:
        html:
          $ref: '#/components/schemas/FormatRef'
        markdown:
          $ref: '#/components/schemas/FormatRef'
        raw:
          $ref: '#/components/schemas/FormatRef'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        screenshot:
          $ref: '#/components/schemas/FormatRef'
        pdf:
          $ref: '#/components/schemas/FormatRef'
        extract:
          $ref: '#/components/schemas/ExtractRef'
    FormatRef:
      type: object
      required:
      - artifact_id
      - bytes
      properties:
        artifact_id:
          type: string
        bytes:
          type: integer
          format: int64
    ExtractRef:
      type: object
      required:
      - artifact_id
      properties:
        artifact_id:
          type: string
        schema_id:
          type: string
          nullable: true
    Link:
      type: object
      required:
      - href
      properties:
        href:
          type: string
        text:
          type: string
          nullable: true
        rel:
          type: string
          nullable: true
    ChangeInfo:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - new
          - changed
          - unchanged
        prev_fingerprint:
          type: string
          nullable: true
    PageMetadata:
      type: object
      properties:
        title:
          type: string
          nullable: true
        lang:
          type: string
          nullable: true
        content_type:
          type: string
          nullable: true
        content_kind:
          type: string
          description: >-
            What the body was detected to be, from its first bytes and then its
            Content-Type: html, xml, text, json, pdf, docx, xlsx, pptx, odf, epub,
            ole_compound, image, audio, video, archive, executable, rtf or binary.
            Absent when QUARRY_EDGE__DOC_ROUTING is off. A body Quarry cannot
            extract text from is refused with 415 UNSUPPORTED_MEDIA when the mode
            is skip or on (details.kind names it).
        content_kind_source:
          type: string
          enum:
          - header
          - magic
          - default
    DriverInfo:
      type: object
      required:
      - kind
      - duration_ms
      properties:
        kind:
          type: string
          enum:
          - static
          - browser
          - tls
        duration_ms:
          type: integer
          format: int64
        profile:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        session_id:
          type: string
          nullable: true
        live_view_url:
          type: string
          nullable: true
          format: uri
        recording_id:
          type: string
          nullable: true
    HandoffAck:
      type: object
      required:
      - job_id
      - accepted_at
      properties:
        job_id:
          type: string
        accepted_at:
          type: string
          format: date-time
        rejected:
          type: array
          description: >-
            WS14.S5. Set by /v1/batch only: the URLs the static check refused, in request order.
            No URL is fetched or resolved to make this decision. Absent when none was refused.
          items:
            type: object
            required:
            - url
            - code
            - message
            properties:
              url:
                type: string
              code:
                type: string
                enum: [not_crawlable, security_rejected, duplicate, max_pages_reached]
              message:
                type: string
        effective:
          type: object
          description: >-
            WS14.S3. Set by /v1/crawl only: the scope and bounds the crawl runs with.
            `scope_mode` is observe (count, drop nothing; the default) or enforce; `legacy`
            is true when the scope switch is off; `warnings` lists the widened switches.
            Never a URL.
          properties:
            scope:
              type: object
              description: The crawl scope (allow_subdomains, allow_external_links, crawl_entire_domain, include_paths, exclude_paths, deny_extensions, legacy).
            scope_mode:
              type: string
              enum: [observe, enforce]
            robots:
              type: string
              enum: [respect, ignore]
            max_pages:
              type: integer
            max_depth:
              type: integer
            legacy:
              type: boolean
            warnings:
              type: array
              items:
                type: string
            sitemap:
              type: string
              enum: [include, only]
              description: INNH-6a. Present only when the request asked for `include` or `only`.
            scrape_options:
              type: object
              description: INNH-6b. Present only when the request had scrape_options. The resolved, canonical form the pages run with.
            request_warnings:
              type: array
              items:
                type: object
                properties:
                  code:
                    type: string
                  field:
                    type: string
              description: Keys the request carried that nothing read (lenient mode); a key inside scrape_options is named `scrape_options.<key>`.
        limits:
          type: object
          description: >-
            Set by /v1/crawl and /v1/batch. A crawl carries the page and depth bounds it
            will run with and why they differ from the request (`clamped_by` is
            `default` when the request was absent or zero, `hard` when it was above the
            ceiling, `entitlement` when the organization's remaining allowance was
            smaller, and empty when it was used as asked). A batch carries `urls`: how
            many URLs were asked for, accepted (the first ones, in order) and dropped.
            Counts only; never a URL. `remaining` is present only for a configured
            allowance (WS6.D-s). With QUARRY_EDGE__BATCH_PARALLEL on (W3-E3.7.2w), a batch also carries
            `max_parallel`, the pages it runs at a time, in the same shape as a crawl bound: `requested`
            is what the request sent (null when silent), `effective` is what runs, and `clamped_by` is
            `default` when the request was silent and `hard` when it was above the edge ceiling.
          properties:
            max_pages:
              $ref: '#/components/schemas/CrawlBound'
            max_depth:
              $ref: '#/components/schemas/CrawlBound'
            urls:
              $ref: '#/components/schemas/BatchUrlsBound'
            max_parallel:
              $ref: '#/components/schemas/CrawlBound'
    CrawlBound:
      type: object
      required:
      - effective
      - clamped_by
      properties:
        requested:
          type: integer
          nullable: true
        effective:
          type: integer
          minimum: 1
        remaining:
          type: integer
          minimum: 1
          description: >-
            What the organization has left of its configured allowance for this bound
            (WS6.D-s). Absent when no allowance is configured; never 0 (a spent
            allowance is a 402).
        clamped_by:
          type: array
          items:
            type: string
            enum:
            - default
            - hard
            - entitlement
    BatchUrlsBound:
      type: object
      required:
      - requested
      - accepted
      - dropped
      - clamped_by
      properties:
        requested:
          type: integer
          minimum: 0
        accepted:
          type: integer
          minimum: 0
        dropped:
          type: integer
          minimum: 0
        remaining:
          type: integer
          minimum: 1
          description: Present only for a configured quarry.batch.url allowance (WS6.D-s).
        clamped_by:
          type: array
          items:
            type: string
            enum:
            - entitlement
    Envelope_NormalizedOutput:
      type: object
      required:
      - request_id
      - success
      - data
      properties:
        request_id:
          type: string
        success:
          type: boolean
          description: Always true for success envelopes
        data:
          $ref: '#/components/schemas/NormalizedOutput'
    ScrapeResponse:
      description: >-
        A NormalizedOutput plus what cannot be a stored artifact. Under Zero Data
        Retention no artifact is written, so the extracted text is returned inline
        in `markdown`; otherwise read it from formats.markdown. A PDF or DOCX
        (QUARRY_EDGE__DOC_ROUTING=on) stores its original bytes as formats.raw and
        has no formats.html.
      allOf:
      - $ref: '#/components/schemas/NormalizedOutput'
      - type: object
        properties:
          markdown:
            type: string
            description: Inline text. Present when the markdown format was asked for, and by default under ZDR (nothing is stored). Capped at max_inline_bytes.
          html:
            type: string
            description: The document as fetched, when the html format was asked for. Not available for a PDF or DOCX.
          raw_html:
            type: string
            description: The document as fetched, when the rawHtml format was asked for.
          truncated:
            type: array
            items:
              type: string
            description: Inline fields cut at max_inline_bytes (ZDR only).
          omitted:
            type: array
            items:
              type: string
            description: Inline fields left out for exceeding max_inline_bytes (not ZDR); read the matching formats.* artifact.
          effective_options:
            type: object
            description: The options the response was produced with, including ignored_fields, cache_state (hit, miss, bypass), doc_routing and strict. With max_age, `max_age` (echo, in ms) and, on a result served from the cache, `cached_at` (RFC 3339, the original fetch) and `cache_age_ms`. With actions, `actions` is a summary (count, types, total_wait_ms, capture_count, on_error), never a selector or a typed text. `redact_pii` (off or on, E3.6-5) is always reported. `page_emulation` (E4.4-a) carries the locale, timezone and location the page emulated, and is absent when the request asked for none; its `send_accept_language` (true, E4.4-a2) is present only when QUARRY_EDGE__PAGE_ACCEPT_LANGUAGE is on and a locale was set, and means the page also sent an Accept-Language header derived from that locale (the user agent is unchanged). `no_egress` (true, Q3-E3.8.8w) is present only on a page served from a stored capture.
          warnings:
            type: array
            items:
              type: object
              required:
              - code
              - message
              properties:
                code:
                  type: string
                  description: e.g. unknown_field, document_has_no_text_layer, document_text_truncated, format_unavailable_for_documents. A PDF scrape with no text layer, on a deployment with the OCR lane switched on (QUARRY_EDGE__OCR, off by default; never under zero data retention), carries `ocr_applied` (the message names a page count only) when the pages were read, `document_ocr_partial` when the PDF has more pages than one OCR call carries (20), and `document_ocr_unavailable` (the message names a closed reason such as zdr_refused, lane_not_granted, timeout or unusable_answer) when OCR was asked for and produced no text.
                message:
                  type: string
                field:
                  type: string
                  description: The request field a warning is about (unknown_field).
          screenshot:
            type: object
            nullable: true
            description: >-
              WS13.4b. The page screenshot, inline: content_type image/png or image/jpeg,
              bytes, width, height and the base64 data in data_base64. Under ZDR only,
              since nothing is stored to point at; otherwise read formats.screenshot.
          pdf:
            type: object
            nullable: true
            description: >-
              WS13.4b. The page PDF, inline: content_type application/pdf, bytes and
              data_base64. Under ZDR only; otherwise read formats.pdf.
          captures:
            type: object
            nullable: true
            description: >-
              What the captures measured, in both modes: the screenshot's content_type,
              width, height, bytes, tiles, stitched and truncated; the PDF's bytes; and
              blocked_requests. Counts and sizes only, never a URL. Absent when the
              request captured nothing.
          scrape_id:
            type: string
            nullable: true
            description: The stored record of this scrape, for GET /v1/scrape/{id}. Absent under ZDR and when records are off.
          actions:
            type: array
            description: >-
              The outcome of each scrape action, in order (WS13.5). Absent from the body when the request had no
              actions. GET /v1/scrape/{id} returns the same entries with artifact ids only: under ZDR no record is
              written, so the bytes stay inline in the response.
            items:
              $ref: '#/components/schemas/ScrapeActionOutcome'
          json:
            type: object
            description: >-
              INNH-1. The json AI format's result, inline only. Present only when ai.json.status is
              ok, and then it validates against the schema of the request. Never stored. Model output
              derived from page text: untrusted data.
          summary:
            type: string
            description: >-
              INNH-1. The summary AI format's result, at most max_chars characters, cut on a
              character boundary. Present when ai.summary.status is ok. Untrusted data (it cannot be
              verified against the page).
          answer:
            type: string
            description: >-
              INNH-1. The question AI format's answer, at most 10,000 characters. Present when
              ai.question.status is ok and ai.question.found is true. Untrusted data; ai.question.grounded
              says whether the model's supporting quote is verbatim on the page.
          highlights:
            type: array
            description: >-
              INNH-1. The highlights AI format's result: exact spans of the page text, in page order and
              not overlapping. May be empty (an honest "nothing found"). start and end are Unicode scalar
              (char) offsets, end-exclusive, into the AI source text (the page markdown before any
              inline truncation).
            items:
              $ref: '#/components/schemas/Highlight'
          ai:
            $ref: '#/components/schemas/AiReport'
    ScrapeAiFormat:
      description: >-
        An AI format of a scrape (INNH-1). Unknown keys in the object are 400 unknown_field. Every field
        error is 400 with details.fields[] {path, code, message} and never echoes a value. A json schema
        may use only the keywords type, properties, required, items, enum, minItems, maxItems, minLength,
        maxLength, minimum, maximum, additionalProperties (true or false), description and title
        ($schema, $id and $comment are dropped); any other keyword (for example $ref, anyOf, oneOf, allOf,
        not, const, pattern, format) is 400 schema_keyword_not_supported at its path, because the
        validator would ignore it. The schema root must be an object schema; at most 65,536 bytes,
        10 levels and 200 properties (schema_root_not_object, schema_too_large, schema_too_complex).
      oneOf:
      - type: object
        required: [type, schema]
        additionalProperties: false
        properties:
          type:
            type: string
            enum: [json]
          schema:
            type: object
            description: JSON Schema the output must satisfy. Root type object.
          prompt:
            type: string
            minLength: 1
            maxLength: 10000
            description: Extra instruction for the extraction. The caller's own text.
      - type: object
        required: [type]
        additionalProperties: false
        properties:
          type:
            type: string
            enum: [summary]
          max_chars:
            type: integer
            minimum: 200
            maximum: 10000
            default: 2000
          language:
            type: string
            pattern: '^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})?$'
            description: Language of the summary. Default the page's own language.
      - type: object
        required: [type, question]
        additionalProperties: false
        properties:
          type:
            type: string
            enum: [question]
          question:
            type: string
            minLength: 1
            maxLength: 10000
      - type: object
        required: [type, query]
        additionalProperties: false
        properties:
          type:
            type: string
            enum: [highlights]
          query:
            type: string
            minLength: 1
            maxLength: 1000
          max_highlights:
            type: integer
            minimum: 1
            maximum: 10
            default: 3
          max_chars_each:
            type: integer
            minimum: 40
            maximum: 1000
            default: 300
    Highlight:
      type: object
      required: [text, start, end]
      description: >-
        An exact span of the page text. start and end are Unicode scalar (char) offsets, end-exclusive,
        into the AI source text; text is the slice (8 to max_chars_each characters).
      properties:
        text:
          type: string
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
    AiFormatReport:
      type: object
      required: [status, untrusted_source]
      description: >-
        What one AI format did. A model failure is a status in a 200 body, never an HTTP error:
        ok (a result field is present), error (a model call was made and failed) or skipped
        (no model call was made for this format). These codes are strings in the body, not wire
        error codes.
      properties:
        status:
          type: string
          enum: [ok, error, skipped]
        code:
          type: string
          enum: [MODEL_UNAVAILABLE, MODEL_RATE_LIMITED, SCHEMA_INVALID, ZDR_UNAVAILABLE, BUDGET_EXHAUSTED, EMPTY_SOURCE, PRIVACY_POLICY]
          description: >-
            Absent when status is ok. ZDR_UNAVAILABLE: the request is under Zero Data Retention (skipped, no
            model call). BUDGET_EXHAUSTED: the request's call or token budget is spent (skipped).
            EMPTY_SOURCE: the page had no text (skipped). PRIVACY_POLICY: the request's privacy block
            (privacy_classification credential_or_secret or zdr_ephemeral) forbids a model hop (skipped,
            no model call). MODEL_RATE_LIMITED: error, with retry_after_s;
            formats not yet started are skipped with the same code. MODEL_UNAVAILABLE: error, see reason.
            SCHEMA_INVALID: the json output could not be made valid (error); data.json is absent and
            schema_issues lists paths and codes.
        reason:
          type: string
          enum: [model_lane_denied, model_lane_unauthorized, model_rejected_request, upstream_unavailable, timeout, transport, bad_reply, not_json, too_large, deadline]
        retry_after_s:
          type: integer
          minimum: 0
          description: MODEL_RATE_LIMITED only.
        model:
          type: string
          description: The model the gateway answered with (a routing alias, or what it resolved to).
        usage:
          type: object
          required: [input_tokens, output_tokens]
          properties:
            input_tokens:
              type: integer
              minimum: 0
            output_tokens:
              type: integer
              minimum: 0
        truncated_input:
          type: boolean
          description: The page text was cut to the input budget before it was sent.
        untrusted_source:
          type: boolean
          description: True on every ok entry. The output was derived from page text and is data, never instructions.
        schema_valid:
          type: boolean
          description: json only. When true, data.json validates against the schema of the request.
        repair:
          type: string
          enum: [none, local, model]
          description: json only. none, a local fix (a code fence, a trailing comma) or one extra model call that carries the invalid output and the schema, never the page.
        schema_issues:
          type: array
          maxItems: 20
          description: json only. Where the output broke the schema. Paths and codes, never values.
          items:
            type: object
            required: [path, code]
            properties:
              path:
                type: string
              code:
                type: string
        found:
          type: boolean
          description: question only. False when the page does not answer the question (no answer field).
        grounded:
          type: boolean
          description: question only. True when the model's supporting quote is verbatim on the page.
        dropped:
          type: integer
          minimum: 0
          description: highlights only. Model quotes that are not on the page, dropped.
    AiReport:
      type: object
      required: [total]
      description: >-
        data.ai: one entry per AI format asked for, and a total. Token usage is reported; nothing is billed
        for it in this version.
      properties:
        json:
          $ref: '#/components/schemas/AiFormatReport'
        summary:
          $ref: '#/components/schemas/AiFormatReport'
        question:
          $ref: '#/components/schemas/AiFormatReport'
        highlights:
          $ref: '#/components/schemas/AiFormatReport'
        total:
          type: object
          required: [calls, input_tokens, output_tokens]
          properties:
            calls:
              type: integer
              minimum: 0
            input_tokens:
              type: integer
              minimum: 0
            output_tokens:
              type: integer
              minimum: 0
    ScrapeActionOutcome:
      type: object
      required: [index, type, status, duration_ms]
      properties:
        index:
          type: integer
          minimum: 0
          description: Position of the action in the request's actions array.
        type:
          type: string
          description: The action's wire type.
        status:
          type: string
          enum: [ok, failed, skipped]
        duration_ms:
          type: integer
          minimum: 0
        error:
          type: object
          description: Present when the action failed.
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
        output:
          type: object
          description: >-
            A screenshot or pdf the action captured. Stored as an artifact (artifact_id) unless the run is under
            Zero Data Retention; under ZDR the bytes come inline (data_base64) within the shared inline cap. Neither
            field is set when the capture is over that cap.
          required: [kind, content_type, bytes]
          properties:
            kind:
              type: string
              enum: [screenshot, pdf]
            content_type:
              type: string
            bytes:
              type: integer
              minimum: 0
            width:
              type: integer
              minimum: 0
            height:
              type: integer
              minimum: 0
            artifact_id:
              type: string
              description: The stored artifact. Not set under ZDR.
            data_base64:
              type: string
              description: The inline bytes under ZDR, within the shared inline cap.
    Envelope_ScrapeResponse:
      type: object
      required:
      - request_id
      - success
      - data
      properties:
        request_id:
          type: string
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/ScrapeResponse'
    Envelope_HandoffAck:
      type: object
      required:
      - request_id
      - success
      - data
      properties:
        request_id:
          type: string
        success:
          type: boolean
          description: Always true for success envelopes
        data:
          $ref: '#/components/schemas/HandoffAck'
    Envelope_Error:
      type: object
      required:
      - request_id
      - success
      - error
      properties:
        request_id:
          type: string
        success:
          type: boolean
          description: Always false for error envelopes
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    CreateWebhookSubscription:
      type: object
      additionalProperties: false
      required:
      - url
      - events
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: An `https` URL that resolves to public addresses only.
        events:
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - change_detected
          description: Stored event types. `change_detected` is the only one in v1; run-finished events will be added without a contract change.
        description:
          type: string
          maxLength: 200
        notify_on_change:
          $ref: '#/components/schemas/NotifyOnChangeFilter'
    UpdateWebhookSubscription:
      type: object
      additionalProperties: false
      properties:
        active:
          type: boolean
        events:
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - change_detected
        description:
          type: string
          maxLength: 200
        notify_on_change:
          nullable: true
          description: The filter to set. `null` removes it, so the subscription takes every change again. An absent key leaves it as it is.
          allOf:
          - $ref: '#/components/schemas/NotifyOnChangeFilter'
    NotifyOnChangeFilter:
      type: object
      description: The change types a subscription takes, and the paragraph threshold for a changed page. A subscription without one takes every change. It filters `change_detected` events only.
      required:
      - types
      properties:
        types:
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - new
            - changed
            - removed
          description: '`new` is a first capture and `changed` a content change. `removed` names a page that is gone. No producer sends `new` or `removed` yet, so a filter that names only those matches nothing until one does.'
        min_paragraph_delta:
          type: integer
          minimum: 0
          maximum: 1000
          default: 0
          description: The fewest paragraphs (added plus removed) a `changed` page must have. 0 means no threshold. It applies to `changed` only, and a change whose delta is unknown is not dropped.
    WebhookLastDelivery:
      type: object
      required:
      - status
      - at
      - event_id
      properties:
        status:
          type: string
          enum:
          - pending
          - in_flight
          - success
          - failed
          - dlq
        at:
          type: string
          format: date-time
        event_id:
          type: string
    WebhookSubscription:
      type: object
      description: A webhook subscription. It has no secret field.
      required:
      - id
      - url
      - events
      - active
      - secret_hint
      - created_at
      properties:
        id:
          type: string
          pattern: '^whk_'
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        active:
          type: boolean
        description:
          type: string
        notify_on_change:
          $ref: '#/components/schemas/NotifyOnChangeFilter'
        secret_hint:
          type: string
          description: '`whsec_...` and the last four characters of the secret.'
        created_at:
          type: string
          format: date-time
        last_delivery:
          $ref: '#/components/schemas/WebhookLastDelivery'
    WebhookSubscriptionCreated:
      allOf:
      - $ref: '#/components/schemas/WebhookSubscription'
      - type: object
        required:
        - secret
        properties:
          secret:
            type: string
            description: The HMAC key, `whsec_` and 64 hex characters. Shown here and by rotate-secret only.
    WebhookSecretRotated:
      type: object
      required:
      - id
      - secret
      - secret_hint
      properties:
        id:
          type: string
        secret:
          type: string
        secret_hint:
          type: string
    WebhookSubscriptionList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WebhookSubscription'
        next_cursor:
          type: string
          description: Present when more rows remain. Pass it back as `cursor`.
    WebhookDeliveryView:
      type: object
      description: One delivery of an event to a subscription. No payload body.
      required:
      - id
      - event_id
      - event_type
      - status
      - attempt
      - created_at
      properties:
        id:
          type: string
          pattern: '^whkd_'
        event_id:
          type: string
        event_type:
          type: string
        status:
          type: string
          enum:
          - pending
          - in_flight
          - success
          - failed
          - dlq
        attempt:
          type: integer
          minimum: 0
        next_attempt_at:
          type: string
          format: date-time
          description: Present while the delivery is pending.
        last_error:
          type: string
          description: '`http_<status>`, `timeout`, `blocked_target`, `transport`, `inactive` or `error`.'
        created_at:
          type: string
          format: date-time
    WebhookDeliveryList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDeliveryView'
        next_cursor:
          type: string
