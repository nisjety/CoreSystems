                    $ref: '#/components/schemas/ResponseMeta'
                  error:
                    $ref: '#/components/schemas/ErrorDetail'
    post:
      operationId: create_schedule
      summary: Create a cron / one-shot / change-monitor schedule
      tags:
      - schedules
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleRequest'
      responses:
        '200':
          description: Created schedule
          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/ScheduleSummary'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
                  error:
                    $ref: '#/components/schemas/ErrorDetail'
        '400':
          description: Invalid schedule definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/schedules/{schedule_id}:
    delete:
      operationId: delete_schedule
      summary: Delete a schedule
      tags:
      - schedules
      security:
      - bearerAuth: []
      parameters:
      - name: schedule_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                properties:
                  data:
                    nullable: true
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
                  error:
                    $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: Unknown schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/schedules/{schedule_id}/pause:
    post:
      operationId: pause_schedule
      summary: Pause a schedule
      tags:
      - schedules
      security:
      - bearerAuth: []
      parameters:
      - name: schedule_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Paused
  /v1/schedules/{schedule_id}/unpause:
    post:
      operationId: unpause_schedule
      summary: Unpause a schedule
      tags:
      - schedules
      security:
      - bearerAuth: []
      parameters:
      - name: schedule_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Unpaused
  /v1/schedules/{schedule_id}/trigger:
    post:
      operationId: trigger_schedule
      summary: Trigger an immediate scheduled run
      description: 'Currently a stub — returns 202 with `status: trigger-accepted` and a note

        that the Temporal SDK is not yet wired.

        '
      tags:
      - schedules
      security:
      - bearerAuth: []
      parameters:
      - name: schedule_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Trigger accepted (stub while Temporal SDK pending)
          content:
            application/json:
              schema:
                type: object
                properties:
                  schedule_id:
                    type: string
                  status:
                    type: string
                  note:
                    type: string
        '404':
          description: Unknown schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/schedules/{schedule_id}/backfill:
    post:
      operationId: backfill_schedule
      summary: Backfill missed runs
      description: Currently a stub — returns 202 with a Temporal-pending note.
      tags:
      - schedules
      security:
      - bearerAuth: []
      parameters:
      - name: schedule_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Backfill accepted (stub while Temporal SDK pending)
        '404':
          description: Unknown schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/profiles:
    get:
      operationId: list_profiles
      summary: Profiles the caller may see (WS17.P0 principal and ZDR guard; WS17.P2 owner filter)
      description: A service principal is refused on every profile route. Under a ZDR posture the list stays open (wind-down).
      responses:
        '200':
          description: Profile summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileList'
        '403':
          description: A service principal.
    post:
      operationId: save_profile
      summary: Save a profile snapshot (the import write path). Needs the quarry:profiles:import scope (WS17.P0).
      description: The request body carries the snapshot (cookie values and storage). The body is never returned. Up to 4 MiB; past it the request answers 413.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [snapshot]
              properties:
                profile_id:
                  type: string
                snapshot:
                  type: object
                  description: SessionSnapshot wire shape. Input only.
      responses:
        '200':
          description: The saved profile id. An ignored save (stale or tombstoned) still answers 200.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile_id:
                    type: string
        '403':
          description: A service principal; a token without quarry:profiles:import; or a ZDR organization with QUARRY_EDGE__ZDR_REFUSE_DURABLE_RESOURCES on (error details zdr_refusal.action save).
        '413':
          description: The body is over 4 MiB.
  /v1/profiles/create:
    post:
      operationId: create_profile
      summary: Create a named, scoped profile owned by the caller (WS17.P0 guard)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                name:
                  type: string
                scope:
                  type: string
                  enum: [user_private, org_shared, run_scoped]
      responses:
        '200':
          description: The created profile summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSummary'
        '400':
          description: Bad request, or the ephemeral scope.
        '403':
          description: A service principal, or a ZDR organization with the flag on (action create).
  /v1/profiles/{profile_id}:
    get:
      operationId: get_profile
      summary: Redacted view of one profile (WS17.P0). No cookie value, no storage value, no IndexedDB value.
      parameters:
        - name: profile_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The redacted profile. Cookie values are null with value_len set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDetail'
        '403':
          description: A service principal, or a ZDR organization with the flag on (action read).
        '404':
          description: Not found, or not visible to the caller under enforce.
    patch:
      operationId: update_profile
      summary: Rename and/or rescope a profile. Owner only on an org-shared row (WS17.P2).
      parameters:
        - name: profile_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                scope:
                  type: string
                  enum: [user_private, org_shared, run_scoped]
      responses:
        '200':
          description: The updated profile summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSummary'
        '400':
          description: Bad request.
        '403':
          description: A service principal, or a ZDR organization with the flag on (action update).
        '404':
          description: Not found, or not the owner under enforce.
    delete:
      operationId: delete_profile
      summary: Erase a profile. Never refused on the ZDR side (wind-down).
      parameters:
        - name: profile_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Erased.
        '403':
          description: A service principal.
        '404':
          description: Not found, or not the owner under enforce.
  /v1/profiles/{profile_id}/restore_probe:
    post:
      operationId: restore_probe_profile
      summary: Whether a profile can be restored at this instant. No browser is started (WS17.P0).
      parameters:
        - name: profile_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
      responses:
        '200':
          description: The restore summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileRestoreProbe'
        '403':
          description: A service principal, or a ZDR organization with the flag on (action probe).
        '404':
          description: Not found, or not visible to the caller under enforce.
components:
  parameters:
    AgentRunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
      description: Tenant-owned Quarry run identifier
    AgentTabId:
      name: tab_id
      in: path
      required: true
      schema:
        type: string
      description: A tab id from the run's tab list
    TabInitiatedBy:
      name: initiatedBy
      in: query
      required: false
      schema:
        type: string
        enum:
        - human
        - agent
      description: >-
        Who is making the call. Can only tighten: `agent` on a person's token makes it an
        agent's, and a service principal is always an agent. `initiated_by` is accepted
        too (both in one request is an error).
    TabAiRunId:
      name: aiRunId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/AdvisoryIdentifier'
      description: ADVISORY. The AI run the caller says it acts for. Recorded, never trusted. `ai_run_id` is accepted too.
    TabAgentLabel:
      name: agentLabel
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/AdvisoryIdentifier'
      description: ADVISORY. A short label the caller gave its agent. Recorded, never trusted. `agent_label` is accepted too.
  schemas:
    ProfileSummary:
      type: object
      required: [profile_id, scope, owner_is_caller]
      properties:
        profile_id:
          type: string
        name:
          type: [string, 'null']
        scope:
          type: string
          enum: [ephemeral, user_private, org_shared, run_scoped]
        owner_is_caller:
          type: boolean
          description: True when the caller owns the profile (WS17.P2).
    ProfileList:
      type: object
      required: [profiles]
      properties:
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ProfileSummary'
    ProfileCookieView:
      type: object
      description: One cookie with every attribute except its value.
      required: [name, domain, path, secure, http_only, session, value_len, value]
      properties:
        name:
          type: string
        domain:
          type: string
        path:
          type: string
        secure:
          type: boolean
        http_only:
          type: boolean
        session:
          type: boolean
          description: True for a session cookie (no expiry).
        expires:
          type: [string, 'null']
          format: date-time
        same_site:
          type: [string, 'null']
          enum: [strict, lax, none, null]
          description: SameSite attribute. Null on a snapshot written before capture v2 (WS17.C1).
        value_len:
          type: integer
          minimum: 0
          description: Length of the stored value in bytes.
        value:
          type: [string, 'null']
          description: Always null. A cookie value is never returned.
    ProfileOriginView:
      type: object
      required: [origin, idb_databases, idb_rows]
      properties:
        origin:
          type: string
        idb_databases:
          type: array
          items:
            type: string
        idb_rows:
          type: integer
          minimum: 0
          description: Row count only. No key and no value.
        local_storage_count:
          type: integer
          minimum: 0
          description: Web storage entries of this origin (capture v2; 0 on a legacy snapshot).
        session_storage_count:
          type: integer
          minimum: 0
        truncated:
          type: boolean
          description: The capture cut this origin short (a size cap or the time budget).
    ProfileView:
      type: object
      description: The redacted snapshot (WS17.P0). Shapes and counts only, never a secret value.
      required: [cookies, local_storage_count, session_storage_count, origins, has_user_agent, has_viewport, truncated]
      properties:
        cookies:
          type: array
          items:
            $ref: '#/components/schemas/ProfileCookieView'
        local_storage_count:
          type: integer
          minimum: 0
        session_storage_count:
          type: integer
          minimum: 0
        origins:
          type: array
          description: One entry per origin with IndexedDB or (capture v2) web storage. A legacy snapshot lists IndexedDB origins only.
          items:
            $ref: '#/components/schemas/ProfileOriginView'
        locale:
          type: [string, 'null']
        timezone:
          type: [string, 'null']
        has_user_agent:
          type: boolean
        has_viewport:
          type: boolean
        truncated:
          type: boolean
          description: A capture cut at least one origin short (capture v2). False on a legacy snapshot.
    ProfileDetail:
      description: The data of GET /v1/profiles/{profile_id}. The ProfileView fields are flattened in beside these.
      allOf:
        - $ref: '#/components/schemas/ProfileView'
        - type: object
          required: [profile_id, scope, owner_is_caller]
          properties:
            profile_id:
              type: string
            name:
              type: [string, 'null']
            scope:
              type: string
            owner_is_caller:
              type: boolean
    ProfileRestoreProbe:
      type: object
      required: [profile_id, scope, url, restorable, cookies_count, cookies_expired, origins_count, owner_is_caller]
      properties:
        profile_id:
          type: string
        name:
          type: [string, 'null']
        scope:
          type: string
        url:
          type: string
        restorable:
          type: boolean
          description: True when a cookie has not expired (a session cookie counts) or any storage is present.
        cookies_count:
          type: integer
          minimum: 0
        local_storage_count:
          type: integer
          minimum: 0
        session_storage_count:
          type: integer
          minimum: 0
        indexed_db_count:
          type: integer
          minimum: 0
        earliest_expiry:
          type: [string, 'null']
          format: date-time
          description: The nearest expiry among cookies that have not expired yet.
        cookies_expired:
          type: integer
          minimum: 0
        origins_count:
          type: integer
          minimum: 0
        has_user_agent:
          type: boolean
        has_viewport:
          type: boolean
        locale:
          type: [string, 'null']
        timezone:
          type: [string, 'null']
        owner_is_caller:
          type: boolean
    ResponseMeta:
      type: object
      required:
      - request_id
      properties:
        request_id:
          type: string
        page:
          type: object
          nullable: true
          properties:
            cursor:
              type: string
              nullable: true
            next:
              type: string
              nullable: true
            limit:
              type: integer
    ErrorDetail:
      type: object
      nullable: true
      properties:
        code:
          type: string
        message:
          type: string
        hint:
          type: string
          nullable: true
    Source:
      type: object
      required:
      - source_id
      - org_id
      - name
      - url
      - kind
      - status
      - created_at
      - updated_at
      properties:
        source_id:
          type: string
          description: src_<ulid>
        org_id:
          type: string
        name:
          type: string
        url:
          type: string
          format: uri
        kind:
          type: string
          enum:
          - crawl
          - scrape
          - search
        status:
          type: string
          enum:
          - active
          - paused
          - deleted
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        config:
          description: Free-form per-source configuration
    Snapshot:
      type: object
      required:
      - snapshot_id
      - org_id
      - url
      - fingerprint
      - change_status
      - captured_at
      properties:
        snapshot_id:
          type: string
          description: snp_<ulid>
        org_id:
          type: string
        source_id:
          type: string
          nullable: true
          description: Present when produced by a source refresh; omitted otherwise
        url:
          type: string
          format: uri
        fingerprint:
          type: string
          description: blake3 of canonicalized content
        prev_fingerprint:
          type: string
          nullable: true
        change_status:
          type: string
          enum:
          - unchanged
          - modified
          - new
        captured_at:
          type: string
          format: date-time
        artifact_id:
          type: string
          nullable: true
    ArtifactSummary:
      type: object
      required:
      - artifact_id
      - org_id
      - kind
      - bytes
      - created_at
      properties:
        artifact_id:
          type: string
        org_id:
          type: string
        kind:
          type: string
          enum:
          - markdown
          - html
          - raw
          - pdf
          - screenshot
          - extract
        bytes:
          type: integer
          format: int64
        sha256:
          type: string
          nullable: true
          description: blake3:<hex> content hash
        created_at:
          type: string
          format: date-time
        source_url:
          type: string
          nullable: true
    JobSummary:
      type: object
      required:
      - job_id
      - kind
      - org_id
      - status
      - created_at
      properties:
        job_id:
          type: string
          description: job_<ulid> — addresses GET /v1/jobs/:id
          not the Temporal run id: null
        kind:
          type: string
          enum:
          - crawl
          - search
          - extract
          - research
          - agent
          - batch
          - scrape
        org_id:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        run_id:
          type: string
          nullable: true
          description: Populated once dispatched; required for GET /v1/runs/:id/events
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        stats:
          description: Kind-specific counters
    RequestQueueSummary:
      type: object
      required:
      - queue_id
      - org_id
      - name
      - kind
      - status
      - created_at
      - stats
      properties:
        queue_id:
          type: string
        org_id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
          - crawl
          - batch
          - scrape
          - search
        status:
          type: string
          enum:
          - active
          - draining
          - deleted
        created_at:
          type: string
          format: date-time
        stats:
          type: object
          required:
          - queued
          - in_flight
          - acked
          - failed
          properties:
            queued:
              type: integer
              format: int64
            in_flight:
              type: integer
              format: int64
            acked:
              type: integer
              format: int64
            failed:
              type: integer
              format: int64
    BenchmarkSummary:
      type: object
      required:
      - benchmark_id
      - org_id
      - name
      - suite
      - status
      properties:
        benchmark_id:
          type: string
        org_id:
          type: string
        name:
          type: string
        suite:
          type: string
        baseline:
          type: string
          nullable: true
        status:
          type: string
        last_run_at:
          type: string
          format: date-time
          nullable: true
        latest_score:
          type: number
          nullable: true
    CreateSourceRequest:
      type: object
      required:
      - name
      - url
      - kind
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
        kind:
          type: string
          enum:
          - crawl
          - scrape
          - search
        monitor:
          type: boolean
          default: false
          description: Also registers a recurring change_monitor schedule
        preset:
          type: string
          enum:
          - hourly
          - daily
          - weekly
          description: Required when monitor=true
        config:
          type: object
          additionalProperties: true
    TeamCreditUsage:
      type: object
      required:
      - org_id
      - period
      - credits_used
      - utilization_percent
      properties:
        org_id:
          type: string
        period:
          type: string
        credits_used:
          type: number
        credits_limit:
          type: number
          nullable: true
          description: null = uncapped (enterprise tier)
        utilization_percent:
          type: number
    TeamTokenUsage:
      type: object
      required:
      - org_id
      - period
      - input_tokens
      - output_tokens
      - total_tokens
      properties:
        org_id:
          type: string
        period:
          type: string
        input_tokens:
          type: integer
          format: int64
        output_tokens:
          type: integer
          format: int64
        total_tokens:
          type: integer
          format: int64
        cost_micro_usd:
          type: integer
          format: int64
          nullable: true
    HostConcurrency:
      type: object
      required:
      - host
      - current
      - ceiling
      properties:
        host:
          type: string
        current:
          type: integer
        ceiling:
          type: integer
        ewma_latency_ms:
          type: number
          nullable: true
    TeamConcurrency:
      type: object
      required:
      - org_id
      - current
      - ceiling
      properties:
        org_id:
          type: string
        current:
          type: integer
        ceiling:
          type: integer
        by_host:
          type: array
          items:
            $ref: '#/components/schemas/HostConcurrency'
    QueueStatusEntry:
      type: object
      required:
      - queue_id
      - name
      - queued
      - in_flight
      properties:
        queue_id:
          type: string
        name:
          type: string
        queued:
          type: integer
          format: int64
        in_flight:
          type: integer
          format: int64
    TeamQueueStatus:
      type: object
      required:
      - org_id
      - queued_total
      - in_flight_total
      properties:
        org_id:
          type: string
        queued_total:
          type: integer
          format: int64
        in_flight_total:
          type: integer
          format: int64
        by_queue:
          type: array
          items:
            $ref: '#/components/schemas/QueueStatusEntry'
    TeamActivityEntry:
      type: object
      required:
      - event_id
      - org_id
      - event_type
      - ts
      - summary
      properties:
        event_id:
          type: string
        org_id:
          type: string
        event_type:
          type: string
        run_id:
          type: string
          nullable: true
        ts:
          type: string
          format: date-time
        summary:
          type: string
    JobStage:
      type: string
      enum:
      - queued
      - running
      - finished
      description: Job stage token emitted by the orchestrator
    JobStatus:
      type: string
      description: Stage-specific status token
    JobHistoryEvent:
      type: object
      required:
      - run_id
      - org_id
      - kind
      - stage
      - status
      - seq
      - completed
      - discovered
      - queued
      - retries
      - blocks
      - timestamp
      properties:
        run_id:
          type: string
        org_id:
          type: string
        kind:
          type: string
          enum:
          - crawl
          - search
          - extract
          - research
          - agent
          - batch
          - scrape
        stage:
          $ref: '#/components/schemas/JobStage'
        status:
          $ref: '#/components/schemas/JobStatus'
        seq:
          type: integer
          format: int64
          description: Monotonically increasing per run_id; gap detection key
        completed:
          type: integer
        total:
          type: integer
          nullable: true
        discovered:
          type: integer
        queued:
          type: integer
        retries:
          type: integer
        blocks:
          type: integer
        eta:
          type: string
          format: date-time
          nullable: true
        timestamp:
          type: string
          format: date-time
    BaselineSnapshot:
      type: object
      required:
      - baseline_id
      - org_id
      - source_url
      - fingerprint
      - captured_at
      properties:
        baseline_id:
          type: string
          description: bln_<ulid>
        org_id:
          type: string
        source_url:
          type: string
          format: uri
        fingerprint:
          type: string
          description: blake3 of canonicalized content
        artifact_id:
          type: string
          nullable: true
        prev_baseline_id:
          type: string
          nullable: true
          description: Singly-linked chain pointer
        captured_at:
          type: string
          format: date-time
        run_id:
          type: string
          nullable: true
    ChangeRecord:
      type: object
      required:
      - source_url
      - org_id
      - status
      - checked_at
      properties:
        source_url:
          type: string
          format: uri
        org_id:
          type: string
        status:
          type: string
          enum:
          - new
          - unchanged
          - changed
          - unreachable
        new_baseline:
          $ref: '#/components/schemas/BaselineSnapshot'
        prev_baseline:
          $ref: '#/components/schemas/BaselineSnapshot'
        diff_id:
          type: string
          nullable: true
          description: Present only for status=changed
        checked_at:
          type: string
          format: date-time
    OverlapPolicy:
      type: string
      enum:
      - cancel
      - skip
      - allow
      default: skip
    ScheduleSummary:
      type: object
      required:
      - schedule_id
      - org_id
      - name
      - kind
      - overlap_policy
      - catchup_window_s
      - pause_on_failure
      - status
      - created_at
      properties:
        timezone:
          type: string
          default: UTC
          description: IANA zone the cron is read in (WS15.S1).
        jitter_s:
          type: integer
          minimum: 0
          description: Spread of each fire in seconds (WS15.S1).
        needs_activation:
          type: boolean
          description: True for a non-monitor schedule created disabled and never toggled (WS15.S1).
        schedule_id:
          type: string
        org_id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
          - crawl
          - search
          - extract
          - research
          - agent
          - batch
          - scrape
        cron:
          type: string
          nullable: true
          description: Standard 5-field cron; absent for one-shot schedules
        schedule_at:
          type: string
          format: date-time
          nullable: true
          description: One-shot trigger time; mutually exclusive with cron
        overlap_policy:
          $ref: '#/components/schemas/OverlapPolicy'
        catchup_window_s:
          type: integer
          format: int64
        pause_on_failure:
          type: boolean
        status:
          type: string
          enum:
          - active
          - paused
          - deleted
        created_at:
          type: string
          format: date-time
        last_run_at:
          type: string
          format: date-time
          nullable: true
        next_run_at:
          type: string
          format: date-time
          nullable: true
        config:
          description: Per-kind payload the schedule was created with
    CreateScheduleRequest:
      type: object
      properties:
        name:
          type: string
        activate:
          type: boolean
          default: false
          description: Start the schedule when created (WS15.S1). Honoured only for a user token; a service token value is ignored. Without it the schedule is created disabled and needs_activation is true.
        timezone:
          type: string
          default: UTC
          description: IANA zone the cron is read in (WS15.S1).
        catchup_window_s:
          type: integer
          minimum: 0
          maximum: 86400
          format: int64
          default: 0
          description: Catch-up window for missed fires (WS15.S1).
        pause_on_failure:
          type: boolean
          default: false
        kind:
          type: string
          enum:
          - crawl
          - search
          - extract
          - research
          - agent
          - batch
          - scrape
          description: Optional when preset-driven (W2 change-monitor create)
        cron:
          type: string
          nullable: true
        schedule_at:
          type: string
          format: date-time
          nullable: true
        overlap_policy:
          $ref: '#/components/schemas/OverlapPolicy'
        preset:
          type: string
          nullable: true
          description: When set, this is a W2 change-monitor create; target_ref becomes required. The preset becomes the cron (hourly, daily or weekly).
        target_ref:
          type: string
          nullable: true
          description: URL to watch for change-monitor schedules
        config:
          type: object
          additionalProperties: true
    StartAgentRunRequest:
      type: object
      properties:
        constraints:
          $ref: '#/components/schemas/AgentConstraints'
        profile_id:
          type: string
          nullable: true
        persist_profile:
          type: boolean
          default: false
        viewport:
          type: object
          nullable: true
          properties:
            width:
              type: integer
            height:
              type: integer
            device_scale_factor:
              type: number
            is_mobile:
              type: boolean
        zdr:
          type: boolean
          default: false
        grant_id:
          type: string
          nullable: true
        resume_run_id:
          type: string
          nullable: true
        initiated_by:
          type: string
          nullable: true
          description: >-
            Set to "agent" for a model-driven run. A run is budgeted (steps,
            attempts, active runtime, estimated cost) when it is an agent run:
            a service principal is one whatever it sends. The hint can only
            tighten: it never turns an agent run into an interactive one.
            `initiatedBy` is accepted too.
        execution_tier:
          type: string
          enum:
          - chromium
          - ephemeral_evidence
          default: chromium
          description: Experimental ephemeral_evidence forces a disposable no-profile, no-resume, no-durable-state run and remains gated by isolated egress/security proof. Its current explicit engine is
            Chromium fallback, not a claim of a production Lite renderer.
        policy:
          description: >-
            WS7.D web policy ask. Tighten-only: `disable` names capabilities
            (browser.act.input, browser.act.interact, browser.act.upload,
            browser.act.download, browser.profile.persistent, search.paid_provider,
            and the others of the catalogue), `deny_domains` and `allow_domains`
            narrow the hosts, `robots_max` and `proxy_max` lower ceilings. It can
            never loosen the operator baseline or the ZDR floor. Resolved once at
            start; a resumed run does not carry it. Unknown keys are 400.
          allOf:
          - $ref: '#/components/schemas/RequestAsk'
        driver_requirements:
          $ref: '#/components/schemas/BrowserDriverCapabilities'
    BrowserDriverCapabilities:
      type: object
      description: Requested or selected execution capabilities. Every true value is an affirmative provider claim; omitted values are not inferred. Agent runs always require isolated_egress and security_evidence
        regardless of optional requirements.
      properties:
        persistent_profile:
          type: boolean
          default: false
        devtools_trace:
          type: boolean
          default: false
        downloads_to_artifacts:
          type: boolean
          default: false
        uploads_from_artifacts:
          type: boolean
          default: false
        full_visual_fidelity:
          type: boolean
          default: false
        isolated_egress:
          type: boolean
          default: false
        security_evidence:
          type: boolean
          default: false
        atomic_target_actions:
          type: boolean
          default: false
        trusted_input:
          type: boolean
          default: false
          description: >-
            True when the driver runs with QUARRY_BROWSER_TRUSTED_INPUT=on. A click_ref, type_ref or
            select_ref on a top-level ref is then checked (visible, enabled, still, not covered) and a click
            and a type are real browser input (event.isTrusted is true). Reported only: a requirement for it in
            driver_requirements is ignored. An older peer omits it and it reads as false.
    AgentConstraints:
      type: object
      required:
      - max_steps
      properties:
        max_steps:
          type: integer
          minimum: 0
        allowed_domains:
          type: array
          items:
            type: string
        max_runtime_s:
          type: integer
          nullable: true
        max_cost_usd:
          type: number
          nullable: true
    Envelope_StartAgentRun:
      type: object
      required:
      - request_id
      - success
      - data
      properties:
        request_id:
          type: string
        success:
          type: boolean
        data:
          type: object
          required:
          - run_id
          - lease_id
          - profile_id
          - driver_capabilities
          - execution_tier
          - execution_engine
          properties:
            run_id:
              type: string
            lease_id:
              type: string
            profile_id:
              type: string
            driver_capabilities:
              $ref: '#/components/schemas/BrowserDriverCapabilities'
            execution_tier:
              type: string
              enum:
              - chromium
              - ephemeral_evidence
            execution_engine:
              type: string
              enum:
              - chromium
              - chromium_fallback
            constraints:
              type: object
              description: >-
                The bounds the run runs under after defaults and ceilings.
                Present when QUARRY_EDGE__BUDGET_ENFORCEMENT is not off.
                max_* are absent for an interactive (human) run, which is
                never capped. Cost is estimated from a flat action table.
              properties:
                class:
                  type: string
                  enum:
                  - interactive
                  - agent
                enforcement:
                  type: string
                  enum:
                  - shadow
                  - 'on'
                  description: shadow records what would be refused and refuses nothing.
                max_steps:
                  type: integer
                max_runtime_s:
                  type: integer
                max_cost_usd:
                  type: number
                estimated:
                  type: boolean
            clamped:
              type: array
              description: Requested values that were replaced.
              items:
                type: object
                properties:
                  field:
                    type: string
                    enum:
                    - max_steps
                    - max_runtime_s
                    - max_cost_usd
                  requested:
                    type: number
                    nullable: true
                  effective:
                    type: number
                  by:
                    type: string
                    description: >-
                      What replaced the requested value: the agent default, the
                      ceiling, or a tighter budget claim carried by the broker grant
                      (QUARRY_EDGE__GRANT_BUDGET_CLAIM=enforce).
                    enum:
                    - default
                    - ceiling
                    - grant
    AdvisoryIdentifier:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9._:-]+$'
      description: >-
        An identifier-shaped value the caller chose. A value of any other shape is
        dropped, not rejected, so it can never carry a URL or a page title into a
        stored record.
    AgentIdentity:
      type: object
      required:
      - basis
      description: >-
        Which agent was behind an operation an agent initiated. Ids and classes only.
        Only `principalId` of a `service_principal` basis is verified (it is the
        calling token's signed service id); `aiRunId` and `label` are what the caller
        said, advisory, and never used to decide anything.
      properties:
        basis:
          type: string
          enum:
          - service_principal
          - user_session
          description: >-
            `service_principal`: the call carried a service principal's own token.
            `user_session`: it carried a person's token with an `agent` hint, so the
            token proves the person, not which agent.
        principalId:
          type: string
          description: The signed service id of the caller. Present only for `service_principal`.
        aiRunId:
          $ref: '#/components/schemas/AdvisoryIdentifier'
        label:
          $ref: '#/components/schemas/AdvisoryIdentifier'
    TabOpener:
      type: object
      required:
      - initiatedBy
      description: Who opened a tab (`openedBy` on a tab of the owner projection).
      properties:
        initiatedBy:
          type: string
          enum:
          - human
          - agent
        agent:
          $ref: '#/components/schemas/AgentIdentity'
        unattributed:
          type: boolean
          description: >-
            Present (true) when the run already held the most full opener records it
            keeps (256), so only `initiatedBy` was kept for this tab and an agent's ids
            were dropped. The tab was opened through the tab routes; which agent did it
            is not recorded. Absent on a full record.
    AgentTab:
      type: object
      required:
      - tabId
      - active
      properties:
        tabId:
          type: string
        title:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        active:
          type: boolean
    OpenAgentTabRequest:
      type: object
      properties:
        url:
          type: string
          nullable: true
          description: Navigate the new tab here; it must be inside the run's allowed domains.
        initiatedBy:
          type: string
          enum:
          - human
          - agent
          description: >-
            Who is opening the tab. Can only tighten (see `TabInitiatedBy`).
            `initiated_by` is accepted too; both in one body, or any other value, is a 422.
        aiRunId:
          $ref: '#/components/schemas/AdvisoryIdentifier'
        agentLabel:
          $ref: '#/components/schemas/AdvisoryIdentifier'
    Envelope_AgentTabs:
      type: object
      required:
      - request_id
      - success
      - data
      properties:
        request_id:
          type: string
        success:
          type: boolean
        data:
          type: object
          required:
          - tabs
          properties:
            tabs:
              type: array
              items:
                $ref: '#/components/schemas/AgentTab'
    Envelope_AgentTab:
      type: object
      required:
      - request_id
      - success
      - data
      properties:
        request_id:
          type: string
        success:
          type: boolean
        data:
          type: object
          required:
          - tab
          - tabs
          properties:
            tab:
              $ref: '#/components/schemas/AgentTab'
            tabs:
              type: array
              items:
                $ref: '#/components/schemas/AgentTab'
    AgentStepRequest:
      type: object
      required:
      - action
      properties:
        action:
          $ref: '#/components/schemas/AgentAction'
        initiated_by:
          type: string
          nullable: true
          enum:
          - human
          - agent
          description: >-
            Who proposed the action. It can only tighten: `agent` on a person's
            token makes the call an agent's, and a service principal is always an
            agent. Receipts record the derived initiator and the control epoch, and
            for an agent which one (`agent` on the receipt). `initiatedBy` is
            accepted too; both in one body is a 422.
        aiRunId:
          $ref: '#/components/schemas/AdvisoryIdentifier'
        agentLabel:
          $ref: '#/components/schemas/AdvisoryIdentifier'
        instruction:
          type: string
          nullable: true
        extraction_profile:
          type: object
          nullable: true
          additionalProperties: true
    Envelope_BrowserObservation:
      type: object
      required:
      - request_id
      - success
      - data
      properties:
        request_id:
          type: string
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/BrowserObservation'
        meta:
          type: object
          description: Present on a step response of an agent-class run (WS6.B); absent for a person's session and when budgets are off.
          properties:
            budget:
              $ref: '#/components/schemas/BudgetMeta'
    BudgetMeta:
      type: object
      description: >-
        The budget ledger of an agent-class run after a step (WS6.B). Cost is estimated
        from the flat action table plus a browser-time term, never billed usage.
        Enforcement is QUARRY_EDGE__BUDGET_ENFORCEMENT (shadow by default: the bounds
        are reported and what would be refused is recorded, nothing is refused).
      required:
      - class
      - steps
      - attempts
      - elapsed_s
      - spent_usd
      - estimated
      - cost_source
      properties:
        class:
          type: string
          enum: [interactive, agent]
        steps:
          type: integer
          description: Completed steps.
        attempts:
          type: integer
          description: Attempts, completed or failed.
        max_steps:
          type: integer
          description: The step bound. Absent for an interactive run.
        max_attempts:
          type: integer
          description: The attempt bound. Absent for an interactive run.
        elapsed_s:
          type: number
          description: Active time in seconds; a human takeover does not count.
        max_runtime_s:
          type: integer
          description: The runtime bound. Absent for an interactive run.
        spent_usd:
          type: number
        max_cost_usd:
          type: number
          description: The cost bound. Absent for an interactive run.
        estimated:
          type: boolean
          enum: [true]
        cost_source:
          type: string
          enum: [flat_table, estimated, provider_billed]
          description: Where the cost of the step this response answers came from.
        exhausted:
          type: string
          enum: [steps, attempts, runtime, cost]
          description: The dimension reached, once one was.
    BrowserObservation:
      type: object
      required:
      - run_id
      - step
      - url
      - action_outcome
      - observed_at
      properties:
        run_id:
          type: string
        step:
          type: integer
        url:
          type: string
          format: uri
        title:
          type: string
          nullable: true
        snapshot:
          $ref: '#/components/schemas/BrowserSnapshot'
        dom_summary:
          type: object
          nullable: true
          additionalProperties: true
        screenshot_artifact_id:
          type: string
          nullable: true
        visual_observation_artifact_id:
          type: string
          nullable: true
        evidence_delta_artifact_id:
          type: string
          nullable: true
        console_summary:
          type: array
          items:
            type: object
            additionalProperties: true
        network_summary:
          type: array
          items:
            type: object
            additionalProperties: true
        egress_receipts:
          type: array
          description: Redacted request-policy decisions. URLs contain origin and path only; query strings, headers, bodies, credentials, and resolved IPs are omitted.
          items:
            $ref: '#/components/schemas/BrowserEgressReceipt'
        dialogs:
          type: array
          description: Open JavaScript dialogs. Quarry never resolves them implicitly; respond_dialog requires an explicit live browser grant.
          items:
            $ref: '#/components/schemas/BrowserDialog'
        policy_denials:
          type: array
          items:
            type: string
        action_outcome:
          $ref: '#/components/schemas/ActionOutcome'
        observation_delta:
          $ref: '#/components/schemas/ObservationDelta'
        challenge:
          allOf:
          - $ref: '#/components/schemas/ChallengeSignal'
          nullable: true
        extraction_profile:
          type: object
          nullable: true
          additionalProperties: true
        extraction_result:
          type: object
          nullable: true
          additionalProperties: true
        proof_bundle:
          type: object
          nullable: true
          description: Evidence manifest for this observation. redaction_rule_version names the secret-redaction rule set the observation was masked under.
          additionalProperties: true
        target_resolution:
          type: object
          nullable: true
          additionalProperties: true
        telemetry:
          $ref: '#/components/schemas/BrowserTelemetry'
        redaction:
          allOf:
          - $ref: '#/components/schemas/RedactionStamp'
          nullable: true
          description: What the secret-redaction pass did to this observation. Counts per rule id only; no content and no lengths.
        observed_at:
          type: string
          format: date-time
    BrowserTelemetry:
      type: object
      required:
      - startup_mode
      - usable_observation_latency_ms
      - estimated_snapshot_tokens
      - observed_action_count
      - challenge_observation_count
      - challenge_rate_per_mille
      description: Measured browser execution facts. renderer_* values are renderer-scoped CDP metrics, not host-wide process usage. Missing cost/resource values mean no provider-authoritative meter was
        available.
      properties:
        startup_mode:
          type: string
          enum:
          - cold
          - warm
          - unknown
        startup_latency_ms:
          type: integer
          minimum: 0
          nullable: true
        usable_observation_latency_ms:
          type: integer
          minimum: 0
        renderer_task_cpu_ms:
          type: integer
          minimum: 0
          nullable: true
        renderer_js_heap_used_bytes:
          type: integer
          minimum: 0
          nullable: true
        estimated_snapshot_tokens:
          type: integer
          minimum: 0
        observed_action_count:
          type: integer
          minimum: 0
        challenge_observation_count:
          type: integer
          minimum: 0
        challenge_rate_per_mille:
          type: integer
          minimum: 0
          maximum: 1000
        verified_action_cost_micro_usd:
          type: integer
          minimum: 0
          nullable: true
        profile_restore:
          allOf:
          - $ref: '#/components/schemas/ProfileRestoreSummary'
          nullable: true
          description: What restoring the session's saved profile did when its first tab opened. Counts only. Absent for a session without a saved profile.
    ProfileRestoreSummary:
      type: object
      description: What restoring a saved profile into a fresh browser context did. Counts and flags only; never a cookie name, an origin, a URL or a value. The user agent is never overridden; ua_changed only records that it differs from the one the profile was captured with.
      properties:
        cookies_total:
          type: integer
          minimum: 0
          description: Cookies the snapshot held.
        cookies_applied:
          type: integer
          minimum: 0
          description: Cookies Chromium accepted into the context.
        skipped_expired:
          type: integer
          minimum: 0
        skipped_session_stale:
          type: integer
          minimum: 0
          description: Session cookies older than QUARRY_BROWSER_PROFILE_SESSION_COOKIE_MAX_AGE_S (default 604800).
        cookies_rejected:
          type: integer
          minimum: 0
          description: Cookies Chromium (or the mapping) refused.
        origins_seeded:
          type: integer
          minimum: 0
          description: Origins whose web storage and IndexedDB the page seeds on first visit.
        idb_databases:
          type: integer
          minimum: 0
        ua_changed:
          type: boolean
        snapshot_age_s:
          type: integer
          minimum: 0
          nullable: true
          description: Seconds between the snapshot's capture and the restore; absent for a legacy snapshot.
        truncated:
          type: boolean
          description: The snapshot was cut by a cap or lost values at capture.
        failed:
          type: boolean
          description: The restore did not finish; the release does not overwrite the stored profile.
    RedactionStamp:
      type: object
      description: What the secret-redaction pass did to a record. It carries counts per static rule id and no content and no lengths. Every field has a default, so a stamp written by an older build still reads.
      properties:
        rule_version:
          type: string
          description: The rule set that ran, for example qr-redact/3.
        profile:
          type: string
          enum:
          - live
          - durable
        mode:
          type: string
          enum:
          - enforce
          - shadow
          - 'off'
          description: shadow counts and returns the input unchanged; off does nothing. Both are refused at boot in production.
        values_masked:
          type: integer
          minimum: 0
        by_rule:
          type: object
          description: Masked values per rule id (field.password, shape.jwt, ...).
          additionalProperties:
            type: integer
            minimum: 0
        probe:
          type: string
          enum:
          - ok
          - partial
          - failed
          - skipped
          description: How the field-facts probe ended. partial or failed means some editable values were masked without facts.
        probe_ms:
          type: integer
          minimum: 0
        screenshot:
          type: string
          enum:
          - none
          - masked
          - withheld
          description: What happened to the screenshot of this record. masked means sensitive field rectangles were painted over; withheld means the screenshot was not stored or returned because a sensitive field could not be masked (no screenshot_artifact_id). Cross-origin iframes are not scanned (see oopif_frames).
        mask_ms:
          type: integer
          minimum: 0
          description: Milliseconds the screenshot scan and mask took, outside the capture itself. 0 when none ran.
        oopif_frames:
          type: integer
          minimum: 0
          description: Cross-origin iframes the screenshot scan could not look into. A count only; their content is not masked unless QUARRY_BROWSER_SCREENSHOT_OOPIF=mask.
        rects:
          type: integer
          minimum: 0
          description: How many rectangles were painted over in the screenshot. Counts only, no geometry.
    BrowserEgressReceipt:
      type: object
      required:
      - sequence
      - method
      - url
      - decision
      - policy
      - timestamp_ms
      properties:
        sequence:
          type: integer
          minimum: 1
        tab_id:
          type: string
          nullable: true
        method:
          type: string
          example: GET
        url:
          type: string
          example: https://example.com/path
        decision:
          type: string
          enum:
          - allow
          - block
        policy:
          type: string
          enum:
          - url_dns_public
          - url_or_dns_blocked
          - domain_grant_blocked
          - dns_or_ssrf_blocked
          - pinned_connect_failed
          - dns_pinned_proxy
        timestamp_ms:
          type: integer
          minimum: 0
    Envelope_EgressReceipts:
      type: object
      required:
      - request_id
      - success
      - data
      properties:
        request_id:
          type: string
        success:
          type: boolean
        data:
          type: object
          required:
          - receipts
          - zdr
          properties:
            receipts:
              type: array
              items:
                $ref: '#/components/schemas/BrowserEgressReceipt'
            zdr:
              type: boolean
    BrowserDialog:
      type: object
      required:
      - dialog_id
      - kind
      - message
      - opened_at_ms
      properties:
        dialog_id:
          type: string
        frame_id:
          type: string
          nullable: true
        kind:
          type: string
          enum:
          - alert
          - confirm
          - prompt
          - beforeunload
        message:
          type: string
        default_prompt:
          type: string
          nullable: true
        origin:
          type: string
