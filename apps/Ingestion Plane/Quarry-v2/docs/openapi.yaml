      additionalProperties: true
      description: Tagged action. Existing CSS selector actions remain supported. Snapshot actions (`*_ref` and `*_semantic`) must include the exact snapshot_id and generation from BrowserObservation.snapshot;
        stale, missing, or ambiguous targets return TARGET_REPAIR_REQUIRED (409). With driver_capabilities.trusted_input
        true, a click_ref, type_ref or select_ref that cannot be performed as a person would also returns TARGET_REPAIR_REQUIRED (409),
        with details.reason one of target_not_attached, target_not_visible, target_disabled, target_covered
        (plus details.covered_by_tag, a tag name only), target_unstable, target_has_no_box or target_unreachable_after_scroll.
        The details never carry a selector, URL or page text.
    LegacyAgentAction:
      type: object
      oneOf:
      - $ref: '#/components/schemas/NavigateAction'
      - $ref: '#/components/schemas/ClickAction'
      - $ref: '#/components/schemas/ClickPointAction'
      - $ref: '#/components/schemas/TypeAction'
      - $ref: '#/components/schemas/PressAction'
      - $ref: '#/components/schemas/ScrollAction'
      - $ref: '#/components/schemas/MouseWheelAction'
      - $ref: '#/components/schemas/SelectAction'
      - $ref: '#/components/schemas/WaitAction'
      - $ref: '#/components/schemas/WaitForAction'
      - $ref: '#/components/schemas/ScreenshotAction'
      - $ref: '#/components/schemas/PdfAction'
      - $ref: '#/components/schemas/EvaluateAction'
      - $ref: '#/components/schemas/BackAction'
      - $ref: '#/components/schemas/ForwardAction'
      - $ref: '#/components/schemas/GetContentAction'
