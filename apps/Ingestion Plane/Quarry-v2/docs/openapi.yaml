    get:
      operationId: listAgentDevtoolsEvents
      summary: Read a filtered window of transient browser DevTools events
      description: >-
        Returns events newer than afterSequence from the driver's bounded buffer (512 events).
        Filters are optional and combine with AND. levels accepts debug, info, log, warn,
        warning, error and verbose (at most five; warn is warning, log is info, verbose is debug).
        filter is a case-insensitive substring over text, url and name only, never payload, at most
        200 characters without control characters. nextSequence is the last event examined; pass it
        back as afterSequence to continue even when no event matched.
      tags:
      - agent
      parameters:
      - $ref: '#/components/parameters/AgentRunId'
      - name: afterSequence
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 512
          default: 100
      - name: levels
        in: query
        schema:
          type: string
          example: warn,error
      - name: filter
        in: query
        schema:
          type: string
          maxLength: 200
      - name: category
        in: query
        schema:
          type: string
          enum:
          - console
          - network
          - lifecycle
      - name: tabId
        in: query
        schema:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
      responses:
        '200':
          description: Matching events in sequence order, with the resume cursor and ZDR flag
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - events
                    - nextSequence
                    - zdr
                    properties:
                      events:
                        type: array
                        items:
                          type: object
                      nextSequence:
                        type: integer
                        minimum: 0
                      zdr:
                        type: boolean
        '400':
          description: A filter value is outside the documented allowlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
        '404':
          description: Run not found or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'
