          in: path
          required: true
          schema:
            type: string
            pattern: '^job_'
        - name: after_seq
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: >-
            errors (final failed or retried pages), blocked (pages a rule blocked),
            robots_blocked (empty until robots enforcement), next_seq when the page was full.
          content:
            application/json:
              schema:
                type: object
        '403':
          description: The token's ZDR floor is set; error URLs are not returned.
