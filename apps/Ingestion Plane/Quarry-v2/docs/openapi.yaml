          - removed
          - current_count
          properties:
            added:
              type: array
              items:
                type: string
            removed:
              type: array
              items:
                type: string
            current_count:
              type: integer
        visual_observation_artifact_id:
          type: string
          nullable: true
    Envelope_AgentRunDownloads:
      type: object
