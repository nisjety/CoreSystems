  /v1/change/diff:
    get:
      operationId: change_diff
      summary: The two versions of a tracked page and the paragraph diff between them (INNH-4)
      description: |
        Returns the stored text of two baselines of a tracked URL and the paragraph diff between
        them. A baseline keeps its page text only for a change monitor, only when the edge runs
        with `QUARRY_EDGE__CHANGE_TEXT_DIFF` on, and never under Zero Data Retention.

        Pick the pair one way: `url` alone compares the latest two baselines; `url` with `from`
        and `to` compares two named baselines of that url (any two, in the order given);
        `diff_id` reads the diff a `quarry.change.detected` event announced (`url` may be added
        and must then be the diff's url). `include=markdown` adds the two pages' text, each cut
        at 1 MiB.

        The diff is paragraph-level and set-based: a paragraph is added when the newer text has
        it and the older does not, removed in the opposite case, moved when it kept its text but
        changed its place among the paragraphs both versions hold (an inserted paragraph does
        not make the rest move). Whitespace and line endings are ignored. `real_delta` is false
        when nothing was added or removed, which is the honest answer for a page whose raw
        bytes changed (an ad, a timestamp in the markup) and whose text did not. The diff holds
        at most 500 ops and 2 KB of text per op; the counts are complete and `truncated` says
        whether anything was cut.

        When the pair has no readable text the answer is 200 with `available: false` and a
        `reason`: `no_previous_version` (the url has one baseline), `no_previous_text` (the older
        baseline was recorded before text was kept), `no_text` (the newer one has none) or
        `artifact_gone` (a stored page was evicted or cannot be read). The two sides' metadata
        is returned either way.

        An id of another organization answers 404 exactly like an id that does not exist.
        501 when the edge runs without the flag; 403 for a Zero Data Retention caller.
      tags:
      - change-tracking
      security:
      - bearerAuth: []
      parameters:
      - name: url
        in: query
        description: The tracked URL. Required unless `diff_id` is given.
        schema:
          type: string
          format: uri
      - name: from
        in: query
        description: The older baseline id (`bln_...`). Needs `to` and `url`.
        schema:
          type: string
          maxLength: 128
      - name: to
        in: query
        description: The newer baseline id (`bln_...`). Needs `from` and `url`.
        schema:
          type: string
          maxLength: 128
      - name: diff_id
        in: query
        description: A stored diff id (`diff_...`), as `quarry.change.detected` and `ChangeRecord.diff_id` carry it. Cannot be combined with `from` or `to`.
        schema:
          type: string
          maxLength: 128
      - name: include
        in: query
        description: '`markdown` adds the stored text of both versions.'
        schema:
          type: string
          enum:
          - markdown
      responses:
        '200':
          description: The two versions and the diff, or why there is no diff
          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/ChangeDiffView'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
                  error:
                    $ref: '#/components/schemas/ErrorDetail'
        '400':
          description: Neither `url` nor `diff_id`; `from` without `to`; `diff_id` with `from` or `to`; baselines of different urls or the same baseline twice; an unknown `include`; an id over 128 characters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: The caller is under Zero Data Retention. Stored page text is not readable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: No baseline for this org and url, or an unknown baseline or diff id, or one that belongs to another organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Change text diffs are not enabled on this edge (QUARRY_EDGE__CHANGE_TEXT_DIFF), or the edge has no baseline store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
