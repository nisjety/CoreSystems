                      total_estimated:
                        type: integer
                        nullable: true
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
                  error:
                    $ref: '#/components/schemas/ErrorDetail'
    post:
      operationId: create_schedule
      summary: Create a cron / one-shot / change-monitor schedule
      description: >-
        An executable schedule (scrape, crawl or batch, with a 5-field cron) or a change monitor (preset). With
        source_id (E4.1-6) an executable crawl runs a source's saved job definition: target_ref becomes the source id,
        and the config is built from the definition as it is stored when the schedule is created, so a later change to
        the definition does not reach this schedule. Only a crawl is schedulable, and a scrape with no options. Dark:
        501 while QUARRY_EDGE__SAVED_JOBS is off. The 400 reasons are on the response.
      tags:
      - schedules
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleRequest'
      responses:
        '200':
          description: Created schedule
          content:
            application/json:
              schema:
                type: object
                required:
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/ScheduleSummary'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
                  error:
                    $ref: '#/components/schemas/ErrorDetail'
        '400':
          description: >-
            Invalid schedule definition. With source_id, details.reason is one of config_conflicts_with_source_id,
            invalid_source_id, source_id_not_for_monitor, source_has_no_definition, saved_job_kind_mismatch or
            saved_job_not_schedulable (a batch). source_definition_invalid carries details.fields[]. An option the fire
            path cannot honour is saved_job_not_schedulable with details.fields[] (code not_schedulable, path
            definition.options.<key>).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: The source URL is denied by the org web policy (details.reason policy_denied). The schedules ZDR refusal is also a 403 when it is on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: source_id names no source of this organization, or a deleted one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: source_id is sent while QUARRY_EDGE__SAVED_JOBS is off (UNSUPPORTED; the message names the switch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
