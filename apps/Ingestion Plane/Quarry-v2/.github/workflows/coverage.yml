name: coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-coverage:
    name: rust-coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Enforce Rust coverage floor (80%)
        run: make coverage-rust COVERAGE_MIN=80

  go-coverage:
    name: go-coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Enforce Go coverage floor (80%)
        run: make coverage-go COVERAGE_MIN=80
