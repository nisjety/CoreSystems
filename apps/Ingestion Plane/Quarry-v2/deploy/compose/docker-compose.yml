services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: quarry
      POSTGRES_PASSWORD: quarry
      POSTGRES_DB: quarry
    ports: ["5432:5432"]
    volumes:
      - quarry_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quarry -d quarry"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.37.0
    command:
      - "--cache_mode=true"
      - "--maxmemory=256mb"
      - "--proactor_threads=1"
      - "--dir=/data"
    # No host port binding — quarry-control reaches it via the compose
    # network as `dragonfly:6379`.
    # Keeps the stack from clashing with any cache you already run on the host.
    expose: ["6379"]
    healthcheck:
      # Dragonfly ships redis-cli; PING returns PONG once it is serving.
      test: ["CMD-SHELL", "redis-cli -p 6379 ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  temporal:
    image: temporalio/auto-setup:1.24
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=quarry
      - POSTGRES_PWD=quarry
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["7233:7233"]
    healthcheck:
      # tctl ships in the auto-setup image; cluster health gates dependents.
      test: ["CMD-SHELL", "tctl --address temporal:7233 cluster health 2>/dev/null | grep -q SERVING"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  quarry-edge:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.edge
    environment:
      QUARRY_EDGE__PORT: "8080"
      QUARRY_EDGE__CONTROL_BASE_URL: "http://quarry-control:8081"
      # SmartRouter web-search primary. Quarry-v2 owns its searxng (defined
      # below) so this dev stack does web search self-contained — no reliance
      # on a searxng started by another plane / the root mega-stack.
      QUARRY_EDGE__SEARXNG_URL: "http://searxng:8080"
      # Dev-mode: accept any non-empty Authorization: Bearer. Production
      # MUST leave this unset so JWTs are verified against the
      # auth-core JWKS. Required here so the orchestrator's
      # /v1/internal/run_page calls succeed without an auth-core
      # round-trip during onboarding-style flows.
      QUARRY_EDGE_AUTH_DEV_BYPASS: "1"
      # Dev compose runs Chromium inside Docker for JS-rendered scrape previews.
      QUARRY_BROWSER_NO_SANDBOX: "1"
      # Isolated OpenCV sidecar for deterministic visual evidence artifacts.
      QUARRY_EDGE__VISION_ENABLED: "1"
      QUARRY_EDGE__VISION_BACKEND: "sidecar"
      QUARRY_EDGE__VISION_SIDECAR_URL: "http://quarry-vision-sidecar:8091"
      QUARRY_EDGE__VISUAL_DIFF_ENABLED: "1"
      QUARRY_EDGE__SCREENSHOT_PREPROCESSING_ENABLED: "1"
      QUARRY_EDGE__PAGE_IMAGE_CLEANUP_ENABLED: "1"
      QUARRY_EDGE__VISUAL_TILES_ENABLED: "1"
      QUARRY_EDGE__OCR_PRECONDITIONING_ENABLED: "1"
      QUARRY_EDGE__RENDERED_BRANDING_VISUAL_ENABLED: "1"
      QUARRY_EDGE__VISUAL_MAX_REGIONS: "32"
    ports: ["8080:8080"]
    depends_on:
      quarry-control:
        condition: service_healthy
      quarry-vision-sidecar:
        condition: service_healthy
      searxng:
        condition: service_healthy

  quarry-vision-sidecar:
    build:
      context: ../..
      dockerfile: services/quarry-vision-sidecar/Dockerfile
    environment:
      QUARRY_VISION_MAX_IMAGE_BYTES: "26214400"
      QUARRY_VISION_MAX_LONG_EDGE: "2048"
      QUARRY_VISION_THUMBNAIL_EDGE: "512"
      QUARRY_VISION_TILE_SIZE: "512"
      QUARRY_VISION_CV_THREADS: "1"
    expose: ["8091"]
    ports: ["8091:8091"]
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 -O /dev/null http://localhost:8091/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  quarry-control:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.control
    environment:
      QUARRY_CONTROL_ADDR: ":8081"
      # Dev token shared with the orchestrator's CONTROL_AUTH_TOKEN so
      # POST /v1/runs/{id}/events (bearer-protected) accepts the events
      # the workflow emits.
      QUARRY_CONTROL_API_KEY: "devsecret"
    ports: ["8081:8081"]
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    healthcheck:
      # Control serves HTTP on :8081; the listing endpoint gates dependents.
      test: ["CMD-SHELL", "wget --quiet --tries=1 -O /dev/null http://localhost:8081/v1/runs || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  quarry-orchestrator:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.orchestrator
    environment:
      TEMPORAL_ADDR: "temporal:7233"
      RUNTIME_BASE_URL: "http://quarry-edge:8080"
      CONTROL_BASE_URL: "http://quarry-control:8081"
      # Must match QUARRY_CONTROL_API_KEY on quarry-control. The
      # orchestrator sends this as the Authorization: Bearer header
      # on every event/checkpoint POST to control.
      CONTROL_AUTH_TOKEN: "devsecret"
      # Sent as Bearer on /v1/internal/run_page calls to edge. Any
      # non-empty value is accepted when QUARRY_EDGE_AUTH_DEV_BYPASS is
      # on (dev compose default).
      RUNTIME_AUTH_TOKEN: "devsecret"
    depends_on:
      temporal:
        condition: service_healthy
      quarry-control:
        condition: service_healthy
    healthcheck:
      # Temporal worker — no HTTP listener. Liveness proven via the process,
      # matching the HEALTHCHECK baked into Dockerfile.orchestrator.
      test: ["CMD-SHELL", "pgrep -f orchestrator >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # SearXNG — Quarry-v2's web-search backend. quarry-runtime's SmartRouter
  # calls it (format=json) as the free primary provider. Bundled here so the
  # Quarry-v2 stack owns its search dependency end-to-end. Reachable on the
  # compose network as `searxng:8080`; published on 8888 for host debugging.
  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_BASE_URL: "http://searxng:8080/"
      # Dragonfly is RESP-compatible — SearXNG's Redis client talks to it
      # unmodified (db 7). The dev dragonfly has no password (see service
      # above), so no credentials in the URL.
      SEARXNG_REDIS_URL: "redis://dragonfly:6379/7"
      SEARXNG_SECRET: "${SEARXNG_SECRET:-change-me-searxng-secret-32chars!!}"
    volumes:
      # Bundled settings enable the JSON output format SmartRouter requires.
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    expose: ["8080"]
    ports: ["8888:8080"]
    depends_on: [dragonfly]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  quarry_pg:
