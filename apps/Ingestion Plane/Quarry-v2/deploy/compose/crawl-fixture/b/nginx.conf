# TEST-ONLY fixture server for the crawl e2e (WS14.S1), external host
# fixture-b. Mounted by apps/Ingestion Plane/docker-compose.crawl-fixture.yml.
# Never used by a production compose file.
worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    log_format fixture '$msec $remote_addr "$request" $status $body_bytes_sent "$http_user_agent"';
    access_log /dev/stdout fixture;

    include /etc/nginx/mime.types;
    default_type text/plain;
    sendfile on;
    server_tokens off;

    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;

        location = /nginx.conf {
            return 404;
        }

        location / {
            try_files $uri $uri.html $uri/ =404;
        }
    }
}
