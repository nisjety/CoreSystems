[package]
name = "quarry-edge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "quarry-edge-rs"
path = "src/main.rs"

[dependencies]
quarry-core = { path = "../quarry-core" }
quarry-security = { path = "../quarry-security" }
quarry-transform = { path = "../quarry-transform" }
quarry-browser = { path = "../quarry-browser" }
quarry-runtime = { path = "../quarry-runtime" }
quarry-tls = { path = "../quarry-tls" }

tokio = { workspace = true }
reqwest = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
hyper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
config = { workspace = true }
dotenvy = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
async-graphql = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
redis = { workspace = true }
blake3 = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
jsonwebtoken = { workspace = true }
futures-util = { workspace = true }
async-stream = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }

[features]
# P2 / cluster #grpc — propagates to quarry-runtime so the gRPC clients
# (GrpcDataPlaneClient + GrpcIngestAdapter + GrpcGrantValidator) compile
# into the binary. Off by default to keep the default image small;
# Dockerfile.edge enables it explicitly.
grpc = ["quarry-runtime/grpc"]

[dev-dependencies]
wiremock = "0.6"
serial_test = "3"

