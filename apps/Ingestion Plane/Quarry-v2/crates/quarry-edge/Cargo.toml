[package]
name = "quarry-edge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "quarry-edge-rs"
path = "src/main.rs"

[dependencies]
quarry-core = { path = "../quarry-core" }
quarry-security = { path = "../quarry-security" }
quarry-transform = { path = "../quarry-transform" }
quarry-browser = { path = "../quarry-browser" }
quarry-runtime = { path = "../quarry-runtime" }
quarry-tls = { path = "../quarry-tls" }

# OS-provided CSPRNG for internal-auth nonces. Tiny crate (just wraps
# the platform RNG syscall); pulled in directly so the nonce source
# isn't accidentally swapped for a userspace PRNG by a transitive
# upgrade.
getrandom = "0.2"

tokio = { workspace = true }
reqwest = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
hyper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
config = { workspace = true }
dotenvy = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
async-graphql = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
redis = { workspace = true }
blake3 = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
jsonwebtoken = { workspace = true }
futures-util = { workspace = true }
async-stream = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }
# Optional — only linked under the `postgres-queue` feature so default
# builds don't pull sqlx + libpq toolchain. Used by main.rs to build the
# PgPool passed to the durable profile/event/baseline stores.
sqlx = { workspace = true, optional = true }

[features]
# P2 / cluster #grpc — propagates to quarry-runtime so the gRPC clients
# (GrpcDataPlaneClient + GrpcIngestAdapter + GrpcGrantValidator) compile
# into the binary. Off by default to keep the default image small;
# Dockerfile.edge enables it explicitly.
grpc = ["quarry-runtime/grpc"]

# Durable Postgres queue + profile store + event history + baseline store.
# Forwards to quarry-runtime/postgres-queue so the `#[cfg(feature =
# "postgres-queue")]`-gated wiring in main.rs/state.rs/change_routes.rs/
# resource_routes.rs actually activates. Off by default (in-memory stores).
postgres-queue = ["dep:sqlx", "quarry-runtime/postgres-queue"]
# Wave 7 — pass-through to quarry-runtime/http3. Off by default. When
# enabled, the edge compiles in the real HTTP/3 driver (reqwest 0.13 +
# h3 + h3-quinn + quinn) and the `prefer_http3` per-request flag is
# honoured; otherwise it falls back silently. Dockerfile.edge enables
# both `grpc` and `http3` on the production image.
http3 = ["quarry-runtime/http3"]

[dev-dependencies]
wiremock = "0.6"
serial_test = "3"

