[package]
name = "quarry-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
thiserror = { workspace = true }
ulid = { workspace = true }
blake3 = { workspace = true }
url = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
# Property tests for the change-history serde round-trip contract.
proptest = "1"
# Property tests in `tests/properties.rs` exercise URL parsing
# (`quarry_security::heur::blocks_private_host` and
# `resolve_guard`) and content/text fingerprinting
# (`quarry_transform::fingerprint`). Both are dev-only — `quarry-core`
# itself never depends on either at runtime, so the property tests live
# in `tests/` and pull the two crates in just for the test target.
quarry-security = { path = "../quarry-security" }
quarry-transform = { path = "../quarry-transform" }
