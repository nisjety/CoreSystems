[package]
name = "quarry-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
quarry-core = { path = "../quarry-core" }
quarry-security = { path = "../quarry-security" }
quarry-transform = { path = "../quarry-transform" }
quarry-browser = { path = "../quarry-browser" }
quarry-tls = { path = "../quarry-tls" }

tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
# Wave 7 — real HTTP/3.
#
# The workspace Reqwest client is shared by the HTTP/1.1, HTTP/2, and
# optional HTTP/3 paths. The `http3` feature below enables its QUIC
# support only for builds that opt in.
#
# IMPORTANT — `--cfg reqwest_unstable`:
#   reqwest gates its http3 API behind `--cfg reqwest_unstable` at
#   compile time. The crate-level `.cargo/config.toml` sets this flag
#   for the `http3` feature so consumers don't have to thread RUSTFLAGS
#   through their build. The flag only affects this crate.
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
regex = "1"
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
blake3 = { workspace = true }
# WS17.E1: envelope encryption of profile blobs (AES-256-GCM via ring; DEK zeroizing; gzip above 4 KiB).
ring = "0.17"
zeroize = "1"
moka = { version = "0.12", features = ["sync"] }
flate2 = "1"
tempfile = "3"
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
dashmap = "6"
async-nats = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
tokio-stream = "0.1"
# setrlimit for the document-parser child process (content_route).
libc = "0.2"
ulid = { workspace = true }
tantivy = { workspace = true }
redis = { workspace = true }
tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
prost-types = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
# Cycle 20 / cluster #1 — Postgres durable queue. Gated so default
# builds don't pull sqlx + libpq toolchain.
sqlx = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

# The document-parser child as an executable, for the sandbox tests (the edge
# binary answers the same protocol with `--doc-parse`). Declared with an explicit
# path because a `bin/` directory is git-ignored in this tree.
[[bin]]
name = "quarry-doc-parse"
path = "src/doc_parse_main.rs"

[features]
default = ["test-site"]
grpc = ["dep:tonic", "dep:prost", "dep:prost-types"]
test-site = ["dep:axum"]
postgres-queue = ["dep:sqlx", "dep:uuid"]
chromiumoxide = ["quarry-browser/chromiumoxide"]
# Wave 7 — gate the real-QUIC driver. Off by default to keep the build
# fast; opt in with `--features http3`. See `Http3Driver` docs and
# `.cargo/config.toml` (`reqwest_unstable` cfg) for the build-time
# story.
http3 = ["reqwest/http3"]

[build-dependencies]
tonic-build = { workspace = true, optional = false }

[dev-dependencies]
# A deflate stream of a gigabyte of zeros, for the decompression-bomb test.
flate2 = "1"
# Builds real DOCX/XLSX fixtures for the content-routing tests.
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }
wiremock = "0.6"
bytes = "1"
# Property tests for the DOM-summary scanner (WS2 surfaces).
proptest = "1"
# sha256 of the cross-plane token-request manifest, compared with the pin that
# sits beside it (src/token_request_contract.rs, tests only).
sha2 = { workspace = true }
