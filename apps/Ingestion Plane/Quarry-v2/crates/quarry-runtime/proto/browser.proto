package model_plane.v1;

import "google/protobuf/timestamp.proto";

service BrowserBroker {
  rpc AcquireGrant(AcquireGrantRequest) returns (AcquireGrantResponse);
  rpc RevokeGrant(RevokeGrantRequest) returns (RevokeGrantResponse);
  rpc ValidateGrant(ValidateGrantRequest) returns (ValidateGrantResponse);
  rpc Health(BrowserHealthRequest) returns (BrowserHealthResponse);
}

message AcquireGrantRequest {
  string session_key = 1;
  string mode = 2;
  string org_id = 3;
  repeated string allowed_domains = 4;
  repeated string allowed_actions = 5;
  repeated string allowed_frame_ids = 6;
  repeated string allowed_dialog_ids = 7;
  repeated string allowed_artifact_ids = 8;
  string parent_grant_id = 9;
}

message AcquireGrantResponse {
  string grant_id = 1;
  string endpoint = 2;
  google.protobuf.Timestamp expires_at = 3;
  repeated string allowed_domains = 4;
  repeated string allowed_actions = 5;
  repeated string allowed_frame_ids = 6;
  repeated string allowed_dialog_ids = 7;
  repeated string allowed_artifact_ids = 8;
  string parent_grant_id = 9;
}

message RevokeGrantRequest {
  string grant_id = 1;
  string reason = 2;
}

message RevokeGrantResponse {
  bool revoked = 1;
}

message BrowserHealthRequest {}

message BrowserHealthResponse {
  string status = 1;
}

message ValidateGrantRequest {
  string grant_id = 1;
}

message ValidateGrantResponse {
  string grant_id = 1;
  bool active = 2;
  google.protobuf.Timestamp expires_at = 3;
  // Canonical broker-owned policy. Consumers reject missing or non-canonical
  // policy rather than falling back to a caller-supplied allow-list.
  repeated string allowed_domains = 4;
  repeated string allowed_actions = 5;
  repeated string allowed_frame_ids = 6;
  repeated string allowed_dialog_ids = 7;
  repeated string allowed_artifact_ids = 8;
  string parent_grant_id = 9;
}
