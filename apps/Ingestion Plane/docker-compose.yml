name: ingestion-plane

x-build-metadata: &build-metadata
  SOURCE_REVISION: ${SOURCE_REVISION:-unverified}
  BUILD_DATE: ${BUILD_DATE:-unknown}

services:
  # ==================== QUARRY v2 (Web Crawler) ====================
  quarry-edge:
    env_file:
      - ./Quarry-v2/.env
    build:
      context: ./Quarry-v2
      dockerfile: deploy/compose/Dockerfile.edge
      args: *build-metadata
    container_name: quarry-edge
    # Lets Chromium keep its own sandbox inside the container (unprivileged
    # user/PID namespaces, which Docker's default seccomp profile blocks).
    # Allow-by-default plus a deny-list of escape syscalls, this service only.
    security_opt:
      - seccomp=./Quarry-v2/deploy/compose/seccomp-chromium.json
    restart: unless-stopped
    init: true
    # A stop is a drain (docs/RUNBOOKS.md, "Stopping the edge"): up to
    # QUARRY_EDGE__DRAIN_DEADLINE_S for in-flight requests, then the live browser
    # sessions are released. The grace period must be longer than the deadline
    # plus the per-session release time, or the platform kills it first (exit 137).
    stop_grace_period: 45s
    environment:
      QUARRY_EDGE__DRAIN_DEADLINE_S: "${QUARRY_EDGE_DRAIN_DEADLINE_S:-30}"
      # Local rollout switch for owner-authorized browser-agent attachment.
      QUARRY_EDGE__ATTACH: "${QUARRY_EDGE_ATTACH:-off}"
      QUARRY_EDGE__HUMAN_BROWSE: "${QUARRY_EDGE_HUMAN_BROWSE:-off}"
      # F-t3-081 Teach mode: the procedure draft of a run's human steps. Only the literal true turns it on.
      QUARRY_TEACH_MODE_ENABLED: "${QUARRY_TEACH_MODE_ENABLED:-false}"
      # /v1/scrape request contract (docs/CONTRACTS.md 9.1): unknown keys are
      # ignored with a warning (lenient) until strict is chosen, either now or from
      # a date; the inline cap is per field; 0 disables the new option keys.
      QUARRY_EDGE__SCRAPE_REQUEST_VALIDATION: "${QUARRY_EDGE_SCRAPE_REQUEST_VALIDATION:-lenient}"
      QUARRY_EDGE__SCRAPE_STRICT_AFTER: "${QUARRY_EDGE_SCRAPE_STRICT_AFTER:-}"
      QUARRY_EDGE__SCRAPE_INLINE_MAX_BYTES: "${QUARRY_EDGE_SCRAPE_INLINE_MAX_BYTES:-1048576}"
      QUARRY_EDGE__SCRAPE_OPTIONS_ENABLED: "${QUARRY_EDGE_SCRAPE_OPTIONS_ENABLED:-1}"
      QUARRY_EDGE__SCRAPE_CAPTURE: "${QUARRY_EDGE_SCRAPE_CAPTURE:-off}"
      # ADR-6 (owner ruling 2026-10-28): scrape-time actions default off and stay off in
      # production. user admits user tokens on the dev/evidence stack only (fixture or
      # owned hosts); on also needs a verified Model caller (D2-012) and an approval gate.
      QUARRY_EDGE__SCRAPE_ACTIONS: "${QUARRY_EDGE_SCRAPE_ACTIONS:-off}"
      # WS14.S4 (X-10, owner decision 2026-10-28): robots.txt on crawl and batch pages. observe
      # is the default and the soak; enforce is the flip, made after the volume-based soak
      # (docs/RUNBOOKS.md, robots.txt gate). An unreachable robots.txt counts as disallow.
      QUARRY_EDGE__CRAWL_ROBOTS: "${QUARRY_EDGE_CRAWL_ROBOTS:-observe}"
      QUARRY_EDGE__ROBOTS_UNREACHABLE: "${QUARRY_EDGE_ROBOTS_UNREACHABLE:-disallow}"
      QUARRY_EDGE__SCRAPE_CAPTURE_INLINE_MAX_BYTES: "${QUARRY_EDGE_SCRAPE_CAPTURE_INLINE_MAX_BYTES:-6291456}"
      # Caps on live runs and the sweeper that releases idle ones (docs/RUNBOOKS.md,
      # "Run caps and the run sweeper"). The caps are live from the first deploy; the
      # sweeper starts in dry run, so it only logs would_expire. Review the log for a
      # person's sessions, then set QUARRY_EDGE_RUN_SWEEPER_DRY_RUN=0.
      QUARRY_EDGE__RUN_SWEEPER_DRY_RUN: "${QUARRY_EDGE_RUN_SWEEPER_DRY_RUN:-1}"
      QUARRY_EDGE__PORT: "8082"
      QUARRY_EDGE__USER_AGENT: "Quarry/2.0 (+https://triodelab.com/quarry)"
      # The browser driver is chosen at BUILD time, never by an env var, so
      # QUARRY_EDGE__BROWSER_PROVIDER / __BROWSERLESS_BASE_URL / __BROWSERLESS_TOKEN
      # are gone from here: EdgeConfig (crates/quarry-edge/src/config.rs) has no
      # field of any of those names and the config crate drops unknown keys in
      # silence, so `BROWSER_PROVIDER=static` never reached the binary while
      # telling every operator the edge had no browser. It has one — Dockerfile.edge
      # builds with `--features …,browser-agent` and installs a pinned Chromium, and
      # main.rs registers the in-process chromiumoxide driver under that feature
      # whenever Browserbase keys are absent ("browser driver registered (local
      # chromiumoxide)" at boot). DriverPlan::static_fetch chains Static → Tls →
      # Browser, so the JS-shell escalation in quarry-runtime/src/fallback_driver.rs
      # has a real driver behind it. Browserbase (QUARRY_EDGE__BROWSERBASE_API_KEY +
      # _PROJECT_ID) is the one env-selected alternative and stays unset on purpose:
      # it is third-party processing, ineligible for governed runs.
      # Hydration settle budget for that browser. `goto` resolves on the load event,
      # which on a page whose text lives in hydration payloads fires before any text
      # exists; the adapter re-snapshots until visible text stops growing or this
      # budget is spent. 3500 is DEFAULT_SETTLE_MS in
      # crates/quarry-runtime/src/browser_driver.rs — surfaced here so a
      # slow-hydrating source can be granted more time without a rebuild.
      QUARRY_BROWSER_SETTLE_MS: "${QUARRY_BROWSER_SETTLE_MS:-3500}"
      # WS13.1: each scrape fetch gets its own browser session key, so two orgs
      # (or two fetches of one host) never share cookies or storage. `0` restores
      # the legacy host-keyed session. The heavy lane (one permit by default)
      # is taken by the actions and capture requests that come later.
      QUARRY_SCRAPE_SESSION_ISOLATION: "${QUARRY_SCRAPE_SESSION_ISOLATION:-on}"
      QUARRY_SCRAPE_HEAVY_PERMITS: "${QUARRY_SCRAPE_HEAVY_PERMITS:-1}"
      QUARRY_EDGE__CONTROL_BASE_URL: http://quarry-control:8081
      QUARRY_EDGE__CONTROL_API_KEY: ${QUARRY_CONTROL_API_KEY:?QUARRY_CONTROL_API_KEY is required}
      # Phase 1 Track C / cluster #9 — durable change-monitoring store.
      # The edge image is built with `--features postgres-queue`; setting this
      # DSN activates PostgresBaselineStore + the `/v1/change/*` routes (which
      # 501 when unset). Dedicated `quarry_edge` database (NOT the shared
      # `quarry_v2` quarry-control uses) so the edge's `_sqlx_migrations` set
      # never collides with another service's. The config crate maps
      # QUARRY_EDGE__DATABASE_URL → EdgeConfig.database_url (prefix QUARRY_EDGE,
      # separator `__`); plain DATABASE_URL is NOT read.
      QUARRY_EDGE__DATABASE_URL: postgres://ingestion_user:${INGESTION_PG_PASSWORD:?INGESTION_PG_PASSWORD is required}@ingestion-postgres:5432/quarry_edge?sslmode=disable
      # Phase 6 compose-wiring fix — the edge is built with `postgres-queue`
      # and the `quarry_profiles`/`quarry_profile_metadata` migrations already
      # run automatically against QUARRY_EDGE__DATABASE_URL above (see
      # `quarry_runtime::migrations::run_migrations`, invoked unconditionally
      # once a DSN is set). Without this var main.rs defaults to
      # `InMemoryProfileStore`, so every named/persistent browser profile
      # (Phase 3's profile manager) silently evaporated on container
      # restart — "durable profile/cookie management" was not actually
      # durable. `postgres` here wires `PostgresProfileStore` (falls back to
      # in-memory with a warning if the DSN is unreachable, never a hard
      # failure). Redis (QUARRY_EDGE__REDIS_URL below) still layers a
      # read-through cache in front of either backend.
      QUARRY_EDGE__PROFILE_STORE_KIND: ${QUARRY_EDGE_PROFILE_STORE_KIND:-postgres}
      # WS17.E1: profile envelope encryption (default off; see RUNBOOKS WS17.E1). Master keys
      # come from the secrets ledger, never from this file.
      QUARRY_EDGE__PROFILE_ENCRYPTION: ${QUARRY_EDGE__PROFILE_ENCRYPTION:-off}
      QUARRY_EDGE__PROFILE_ENCRYPTION_REQUIRED: ${QUARRY_EDGE__PROFILE_ENCRYPTION_REQUIRED:-false}
      QUARRY_EDGE__PROFILE_KEY_PROVIDER: ${QUARRY_EDGE__PROFILE_KEY_PROVIDER:-env}
      QUARRY_PROFILE_MASTER_KEYS: ${QUARRY_PROFILE_MASTER_KEYS:-}
      QUARRY_PROFILE_MASTER_KEY_ACTIVE: ${QUARRY_PROFILE_MASTER_KEY_ACTIVE:-}
      # WS17.E2b: org-core key provider, used only with QUARRY_EDGE__PROFILE_KEY_PROVIDER=org_core
      # (which also needs ORG_CORE_KEYS_ENABLED=1 on org-core). The token is the quarry-edge
      # org-core credential minted in Control's secrets ledger as QUARRY_ORG_CORE_SERVICE_TOKEN
      # and MIRRORED into this stack's ledger; empty keeps the edge on the env provider, and
      # the boot check refuses org_core without it.
      QUARRY_EDGE__ORG_CORE_KEYS_URL: ${QUARRY_EDGE__ORG_CORE_KEYS_URL:-http://org-core:8080}
      QUARRY_EDGE__ORG_CORE_KEYS_TOKEN: ${QUARRY_ORG_CORE_SERVICE_TOKEN:-}
      # W2-CP-L2: billing-core quota/entitlement reads (empty = not wired). The token is the
      # quarry-edge billing-core credential (QUARRY_BILLING_CORE_SERVICE_TOKEN, mirrored).
      QUARRY_EDGE__BILLING_CORE_URL: ${QUARRY_EDGE__BILLING_CORE_URL:-}
      QUARRY_EDGE__BILLING_CORE_TOKEN: ${QUARRY_BILLING_CORE_SERVICE_TOKEN:-}
      # WS15.S4a: fire-time schedule preflight (ZDR posture + entitlement). off | observe | enforce;
      # observe (default) runs every check and logs it, allows the fire and pauses nothing. The
      # posture read is org-core GET /internal/orgs/:org/retention-posture with the quarry-edge
      # credential QUARRY_ORG_CORE_SERVICE_TOKEN (minted in Control's ledger, MIRRORED here).
      # Empty token = posture unknown (enforce then skips every fire as skipped_posture_unknown).
      QUARRY_EDGE__SCHEDULE_POSTURE: ${QUARRY_EDGE__SCHEDULE_POSTURE:-observe}
      QUARRY_EDGE__ORG_CORE_URL: ${QUARRY_EDGE__ORG_CORE_URL:-http://org-core:8080}
      QUARRY_EDGE__ORG_CORE_SERVICE_TOKEN: ${QUARRY_ORG_CORE_SERVICE_TOKEN:-}
      QUARRY_EDGE__RUNTIME_AUTH_TOKEN: ${QUARRY_RUNTIME_AUTH_TOKEN:?QUARRY_RUNTIME_AUTH_TOKEN is required}
      QUARRY_EDGE__INTERNAL_SECRET: ${QUARRY_INTERNAL_SECRET:?QUARRY_INTERNAL_SECRET must be set (no insecure default)}
      QUARRY_EDGE__NATS_URL: nats://nats:4222
      QUARRY_EDGE__NATS_TOKEN: ${INGESTION_NATS_TOKEN:?INGESTION_NATS_TOKEN is required}
      QUARRY_EDGE__NATS_SUBJECT_PREFIX: ${QUARRY_EDGE_NATS_SUBJECT_PREFIX:-quarry}
      # U37: the Control NATS billing-core subscribes (usage.>). Unset = usage stays on the
      # Quarry bus (today). The user and password come from the secrets ledger, never this file.
      # QUARRY_EDGE__USAGE_BROWSER_METRICS stays unset here (off) until Lago has the codes.
      QUARRY_EDGE__USAGE_BUS_URL: ${QUARRY_EDGE__USAGE_BUS_URL:-}
      QUARRY_EDGE__USAGE_BUS_USER: ${QUARRY_EDGE__USAGE_BUS_USER:-}
      QUARRY_EDGE__USAGE_BUS_PASSWORD: ${QUARRY_EDGE__USAGE_BUS_PASSWORD:-}
      # Web search providers (SmartRouter): SearXNG free primary + Brave paid fallback.
      # SearXNG is owned by this Ingestion Plane stack so Quarry-v2 is
      # self-contained and does not depend on a root mega-stack service.
      QUARRY_EDGE__SEARXNG_URL: http://searxng:8080
      QUARRY_EDGE__BRAVE_SEARCH_KEY: ${BRAVE_API_KEY:-${BRAVE_SEARCH_KEY:-}}
      # SmartRouter's first tier is a Tantivy index over Quarry's own scraped
      # corpus. Unset, main.rs builds the in-memory variant, so the corpus
      # restarted empty every time and tier 1 answered nothing.
      # The path must sit under a directory the edge image already creates and
      # chowns to its non-root `quarry` user (uid 65532, see
      # deploy/compose/Dockerfile.edge): Docker hands a named volume the
      # ownership of the image directory it is mounted over, but creates a
      # mount point absent from the image root-owned — and on a root-owned
      # path TantivyLocalIndex::open fails outright and main.rs drops the
      # index entirely (that branch has no in-memory fallback), leaving search
      # worse off than the ephemeral index this replaces. The XDG cache dir is
      # the pre-chowned directory the image ships empty, so the volume below
      # shadows no image content and leaves the browser profile root
      # (QUARRY_BROWSER_PROFILE_ROOT) as ephemeral as it is today.
      QUARRY_EDGE__LOCAL_INDEX_DIR: /var/lib/quarry/home/.cache/local-index
      # Real auth path (bypass OFF by default): public /v1/* routes verify the
      # gateway's short-lived `quarry` audience JWT against auth-core's JWKS and
      # derive org scope from the verified `claims.org_id`. The orchestrator's
      # internal /v1/internal/run_page authenticates with the shared runtime
      # service token instead (org travels in the body), so it does NOT depend
      # on this bypass. Set =1 only for an isolated edge with no reachable auth-core.
      QUARRY_EDGE_AUTH_DEV_BYPASS: "${QUARRY_EDGE_AUTH_DEV_BYPASS:-0}"
      # auth-core (Better Auth / convex-auth) signs the `quarry` audience token;
      # the edge fetches its JWKS to verify the signature and enforces aud=quarry.
      AUTH_CORE_JWKS_URL: ${AUTH_CORE_JWKS_URL:-http://auth-core:3011/api/convex-auth/jwks}
      AUTH_CORE_AUDIENCE: ${AUTH_CORE_AUDIENCE:-quarry}
      AUTH_CORE_ISSUER: ${AUTH_CORE_ISSUER:-http://localhost:3011/api/convex-auth}
      # Durable credential used only to mint short-lived, per-org Data and
      # Model tokens. Static cross-plane JWTs are intentionally not injected.
      QUARRY_EDGE__AUTH_CORE_URL: ${AUTH_CORE_URL:-http://auth-core:3011}
      QUARRY_EDGE__QUARRY_SERVICE_API_KEY: ${QUARRY_SERVICE_API_KEY:?QUARRY_SERVICE_API_KEY is required}
      QUARRY_EDGE__CROSS_PLANE_AUTH_DEV_BYPASS: "${QUARRY_CROSS_PLANE_AUTH_DEV_BYPASS:-0}"
      # The Model Plane BrowserBroker that validates a run's browser grant, over gRPC
      # on inter-plane-bus (e.g. http://browser-broker:9095). Empty means no
      # validator and is only accepted outside production: the production overlay
      # requires it, and the edge refuses to boot in production with only an HTTP
      # validator or without the service credential above (crates/quarry-edge/src/
      # grant_boot.rs). Every check is made with a broker token minted for the run's
      # organization from that credential.
      QUARRY_EDGE__BROWSER_GRANT_VALIDATOR_GRPC_URL: ${QUARRY_EDGE_BROWSER_GRANT_VALIDATOR_GRPC_URL:-}
      # Chromium keeps its sandbox: the seccomp profile above lets it build one
      # in a container. 1 is an explicit local opt-out (old kernels, WSL2 without
      # user namespaces); the edge refuses to launch with it in production.
      QUARRY_BROWSER_NO_SANDBOX: "${QUARRY_BROWSER_NO_SANDBOX:-0}"
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      QUARRY_EDGE__DRAGONFLY_URL: redis://:${INGESTION_DRAGONFLY_PASSWORD:?INGESTION_DRAGONFLY_PASSWORD is required}@dragonfly:6379/6
      # Compatibility for already-built Quarry Edge images and Redis-protocol clients.
      QUARRY_EDGE__REDIS_URL: redis://:${INGESTION_DRAGONFLY_PASSWORD:?INGESTION_DRAGONFLY_PASSWORD is required}@dragonfly:6379/6
      QUARRY_EDGE__ARTIFACT_BACKEND: ${QUARRY_EDGE_ARTIFACT_BACKEND:-memory}
      QUARRY_EDGE__ARTIFACT_ROOT: /app/data/artifacts
      # Model Plane gateway, opt-in. EdgeConfig field is model_plane_url (NOT
      # *_base_url); the config crate maps QUARRY_EDGE__MODEL_PLANE_URL to it. Empty,
      # the default, means no Model Plane: quarry-edge reads an empty value as unset
      # (config.rs, from_env). Set MODEL_PLANE_URL (for example http://model-gateway:8080)
      # to opt in. Set, the Model Plane features that have a switch may use it (answer
      # synthesis has one, below); the gateway chooses the model (no model id needed).
      QUARRY_EDGE__MODEL_PLANE_URL: ${MODEL_PLANE_URL:-}
      # Model Plane features (QB-T17, owner default D-C; decision 3.12 of 2026-10-27, accepted
      # 2026-10-28). Every one is OFF by default, and each one also needs MODEL_PLANE_URL above: the
      # cross-plane registry grants quarry-edge no model-gateway request yet (the manifest rows
      # model-invoke and model-audio are granted:false), so each would be refused by Auth Core on
      # every call. A switch set to 1 without a granted model path stays off, and boot logs an
      # ERROR that names it. Flip a switch only together with the registry grant. The semantic
      # rerank below is not a Model Plane feature: it calls the Data Plane.
      # (The Quarry token-request manifest holds three model-gateway rows, all granted:false.)
      # Structured extract (a schema or a prompt on /v1/extract; INNH-2, INNH-3) is gated by
      # QUARRY_EDGE__AI_FORMATS below, like the AI formats of POST /v1/scrape (INNH-1): off by
      # default, and it also needs a model credential, which no deployed stack can hold yet
      # (decision X-7, WS16.S1 to S3). See docs/RUNBOOKS.md (Quarry-v2), "Enable structured
      # extract and AI formats" and "Scrape AI formats". An owner turns it on, not this file.
      # max_age on POST /v1/scrape (INNH-7): "off" here. "on" accepts it and runs the
      # org-scoped URL result cache (needs Redis); never read or written under ZDR. An
      # owner turns it on, not this file. See docs/RUNBOOKS.md (Quarry-v2), "Scrape max_age".
      QUARRY_EDGE__SCRAPE_MAX_AGE: "${QUARRY_EDGE_SCRAPE_MAX_AGE:-off}"
      # Autoprompt: rewrite verbose Research/Comparative queries before fan-out.
      QUARRY_EDGE__AUTOPROMPT: "${QUARRY_EDGE_AUTOPROMPT:-0}"
      QUARRY_EDGE__AUTOPROMPT_MODEL: ${QUARRY_AUTOPROMPT_MODEL:-}
      # LLM intent classification for queries the rules do not settle.
      QUARRY_EDGE__LLM_CLASSIFY_INTENT: "${QUARRY_EDGE_LLM_CLASSIFY_INTENT:-0}"
      # Page titles and short summaries from the Model Plane for pages without a usable title.
      QUARRY_EDGE__PAGE_TITLE_ENRICH: "${QUARRY_EDGE_PAGE_TITLE_ENRICH:-0}"
      QUARRY_EDGE__ANSWER_SYNTHESIS: "${QUARRY_EDGE_ANSWER_SYNTHESIS:-0}"
      QUARRY_EDGE__AI_FORMATS: "${QUARRY_EDGE_AI_FORMATS:-0}"
      # Under ZDR the AI formats of POST /v1/scrape are refused (ADR-4); "refuse" is the only value
      # that takes effect in v1 (INNH-1).
      QUARRY_EDGE__AI_FORMATS_ZDR: ${QUARRY_EDGE_AI_FORMATS_ZDR:-refuse}
      QUARRY_EDGE__SEARCH_SUGGEST: "${QUARRY_EDGE_SEARCH_SUGGEST:-0}"
      QUARRY_EDGE__MODEL_AUDIO: "${QUARRY_EDGE_MODEL_AUDIO:-0}"
      # Semantic rerank (Quarry option B): the Data Plane's POST /v1/rerank (rerank-v1, profile web-v1)
      # reorders the top-N merged results by a paid cross-encoder score. No Model Plane call and no
      # general model prompt is made. TOP_N bounds the candidates sent per search (the Data Plane takes
      # at most 100). DEADLINE_MS is one call's budget: it is sent as the Data Plane's deadline_ms, clamped
      # to 100..8000; a call that misses it keeps the search in its input order.
      # Scores: a caller sees a score only when it asks for cross_encoder.v1 in score_kinds. model-gateway
      # sends no score_kinds until QB-T12 (its score_kind calibration in relevance.rs) ships: deploy QB-T12
      # before or with any change that makes it ask.
      # DEPLOY ORDER (owner ruling 2026-10-12): this default is 0, so a deploy is dark. Turn the rerank on
      # (QUARRY_EDGE_SEMANTIC_RERANK=1) only after the Data Plane gate is open (retrieval-engine
      # WEB_RERANK_ENABLED=1, WEB_RERANK_PROCESSOR_APPROVED=true only after counsel's Article 28 sign-off, and
      # the data:rerank grant for quarry-edge live in auth-service). Check with
      #   bash "apps/Data Plane v2/scripts/qb-preflight.sh" --live --ship-qb-t09
      # (exit 0). A rerank that is on before then sends every non-ZDR search to a route that may not be
      # deployed: each such search is skipped or degraded, is never cached and pays the search providers again.
      QUARRY_EDGE__SEMANTIC_RERANK: "${QUARRY_EDGE_SEMANTIC_RERANK:-0}"
      QUARRY_EDGE__SEMANTIC_RERANK_TOP_N: ${QUARRY_SEMANTIC_RERANK_TOP_N:-10}
      QUARRY_EDGE__RERANK_DEADLINE_MS: "${QUARRY_EDGE_RERANK_DEADLINE_MS:-2000}"
      # Shadow mode: the Data Plane is asked and its order measured, but the results keep their order and
      # carry no score. The first deploy is a shadow smoke run, so this default is 1 until the live proof
      # passes; the orchestrator then sets the default to 0 (the post-proof flip of this task). The binary's
      # own default is off. It has no effect unless SEMANTIC_RERANK is on.
      QUARRY_EDGE__RERANK_SHADOW: "${QUARRY_EDGE_RERANK_SHADOW:-1}"
      # Data residency: set to 1 to refuse external SERP SaaS (Brave/Serper) so
      # web-search queries never leave the cluster (in-infra providers only).
      QUARRY_EDGE__ZERO_SAAS_SEARCH: "${QUARRY_EDGE_ZERO_SAAS_SEARCH:-0}"
      # Data Plane retrieval (EdgeConfig field `data_plane_url`) → retrieval_v2 /v1/retrieve,
      # powering hybrid search (lexical ⊕ Qdrant semantic, RRF-fused). A separate
      # DATA_PLANE_URL = retrieval engine (reads + vector/find-similar). It has
      # no POST /v1/documents write route — durable ingest goes to the Go
      # documents-api (dpv2-documents-api:8010) via DATA_PLANE_INGEST_URL below.
      QUARRY_EDGE__DATA_PLANE_URL: ${DATA_PLANE_RETRIEVAL_URL:-http://dpv2-retrieval-engine:8004}
      QUARRY_EDGE__DATA_PLANE_INGEST_URL: ${DATA_PLANE_DOCUMENTS_URL:-http://dpv2-documents-api:8010}
      # Phase-2 visual RAG persistence — the scoped contract is now in place:
      # Data Plane's minio-init provisions a dedicated MinIO user restricted to
      # the `dataplane-cas` bucket (QUARRY_CAS_* below; never MINIO_ROOT_*),
      # and its cross-plane overlay exposes the broker/object store on the
      # inter-plane bus as `dataplane-nats`/`dataplane-minio`. All three
      # QUARRY_EDGE__* values non-empty + a reachable broker → main.rs starts
      # the PageRenderer producer; any missing piece logs a warn and disables
      # the visual arm without affecting text ingest.
      QUARRY_EDGE__CAS_BUCKET: ${QUARRY_CAS_BUCKET:-dataplane-cas}
      QUARRY_EDGE__DATAPLANE_NATS_URL: ${QUARRY_DATAPLANE_NATS_URL:-nats://dataplane-nats:4222}
      # The URL the embedding-engine consumer GETs rendered PNGs from —
      # quarry-edge's own /v1/internal/page-images serve route, reachable
      # because both containers sit on the inter-plane bus.
      QUARRY_EDGE__EDGE_INTERNAL_BASE_URL: ${QUARRY_EDGE_INTERNAL_BASE_URL:-http://quarry-edge:8082}
      # WS12.S2: secret-redaction mode. enforce (default) masks; shadow only counts and off does
      # nothing, both for development and staging: a production edge refuses to boot with either.
      QUARRY_EDGE__REDACTION_MODE: ${QUARRY_REDACTION_MODE:-enforce}
      # Data Plane broker token (PageRenderer::connect reads it from env,
      # mirroring nats-connection-rs — credentials stay out of the URL).
      DATAPLANE_NATS_TOKEN: ${DATAPLANE_NATS_TOKEN:-}
      # Bucket-scoped CAS credentials (aws-sdk env conventions; CasStore
      # forces path-style addressing for MinIO).
      AWS_ENDPOINT_URL: ${QUARRY_CAS_ENDPOINT:-http://dataplane-minio:9000}
      AWS_ACCESS_KEY_ID: ${QUARRY_CAS_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${QUARRY_CAS_SECRET_KEY:-}
      AWS_REGION: ${QUARRY_CAS_REGION:-us-east-1}
      QUARRY_EDGE__CANARY_PCT: ${QUARRY_CANARY_PCT:-100}
      QUARRY_EDGE__CANARY_SALT: ${QUARRY_CANARY_SALT:-quarry-edge-v2}
      QUARRY_EDGE__CACHE_TTL_SECS: ${QUARRY_CACHE_TTL_SECS:-300}
      QUARRY_EDGE__FETCH_TIMEOUT_S: ${QUARRY_FETCH_TIMEOUT_S:-30}
      # Internal Prometheus listener on :9092 (crates/quarry-edge/src/metrics.rs).
      # Off by default. When on, production refuses to start without a token of
      # at least 16 characters. The port is never published; scrape it over the
      # compose network (see docs/RUNBOOKS.md, "Metrics").
      # Agent-run budgets (crates/quarry-edge/src/budget.rs): off | shadow | on.
      # shadow (the default) records what would be refused, by class, and
      # refuses nothing; read quarry_agent_budget_exhausted_total{mode="shadow"}
      # for at least a day, and confirm no class="interactive" series, before on.
      QUARRY_EDGE__BUDGET_ENFORCEMENT: "${QUARRY_EDGE_BUDGET_ENFORCEMENT:-shadow}"
      # How many of the browser pool's leases one organization may hold at once
      # (0 = no cap). A tenant at its cap waits for its own releases, then gets
      # a retryable 429 with details.reason = org_render_cap. Off by default: on
      # a single-tenant deployment any value below the pool size (2) only slows
      # that tenant down. Set it when more than one organization shares the edge.
      QUARRY_EDGE__POOL_ORG_MAX_PERMITS: "${QUARRY_POOL_ORG_MAX_PERMITS:-0}"
      QUARRY_EDGE__METRICS_ENABLED: "${QUARRY_EDGE_METRICS_ENABLED:-0}"
      QUARRY_EDGE__METRICS_TOKEN: "${QUARRY_EDGE_METRICS_TOKEN:-}"
      QUARRY_EDGE__SECURITY_SNAPSHOT_PATH: ${QUARRY_SECURITY_SNAPSHOT_PATH:-/app/data/security-feeds/quarry-security.json}
      # W3-B3-01 (E3.8.6): reputation hot reload, dark by default. A positive
      # number of seconds makes quarry-edge re-read the snapshot when its mtime
      # changes (the feed sync rewrites it at most every 10 minutes). Subdomain
      # matching (a listed host also blocks its subdomains) is a second opt-in.
      QUARRY_EDGE__SECURITY_SNAPSHOT_WATCH_S: "${QUARRY_SECURITY_SNAPSHOT_WATCH_S:-0}"
      QUARRY_EDGE__SECURITY_SNAPSHOT_SUBDOMAINS: "${QUARRY_SECURITY_SNAPSHOT_SUBDOMAINS:-0}"
      # Wave 7 — wire the optional HTTP/3 driver. Default `1` because
      # the edge image is now built with `--features http3` so the
      # cost of having the driver available is paid at build time;
      # leaving the runtime knob off would only deny clients a
      # capability they already paid for. Per-request opt-in still
      # required via `ScrapeRequest.prefer_http3: true`.
      QUARRY_EDGE__HTTP3_ENABLED: "${QUARRY_EDGE_HTTP3_ENABLED:-1}"
      # Optional `;`-separated proxy URI list (socks5, http, https).
      # Empty by default → direct egress. See proxy_pool.rs for the
      # (org_id, host) sticky-affinity hashing.
      QUARRY_PROXY_POOL: "${QUARRY_PROXY_POOL:-}"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      quarry-control:
        condition: service_healthy
      # Track C: the change-monitoring store connects to ingestion-postgres
      # (database `quarry_edge`) at boot and applies its migrations there.
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      nats:
        condition: service_healthy
      searxng:
        condition: service_healthy
    ports:
      # CRIT-2/HIGH-3: the edge is an internal BFF-backed service (the gateway
      # reaches it over the docker network); it must NOT be reachable from the
      # external/LAN interface. Bind the host publish to loopback only so the
      # internal routes (/v1/internal/run_page etc.) cannot be hit off-host.
      - "${INGESTION_BIND_ADDRESS:-127.0.0.1}:8082:8082"
    # WS6.I: the internal Prometheus listener (QUARRY_EDGE__METRICS_ENABLED=1).
    # Exposed to the compose networks only, never published with `ports`.
    expose:
      - "9092"
    volumes:
      - ./config/security-feeds:/app/data/security-feeds:ro
      # Backs QUARRY_EDGE__LOCAL_INDEX_DIR above. Mounted on the image's XDG
      # cache dir (not a fresh /app/data path) so the volume inherits the
      # `quarry` uid the image already chowned there — see the env var's
      # comment for why a root-owned mount point would disable the index.
      - quarry-edge-index-data:/var/lib/quarry/home/.cache
    networks:
      - ingestion-net
      - inter-plane-bus
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 -O /dev/null http://127.0.0.1:8082/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  quarry-control:
    env_file:
      - ./Quarry-v2/.env
    build:
      context: ./Quarry-v2
      dockerfile: deploy/compose/Dockerfile.control
      args: *build-metadata
    container_name: quarry-control
    restart: unless-stopped
    init: true
    environment:
      QUARRY_CONTROL_ADDR: ":8081"
      QUARRY_CONTROL_DSN: postgres://ingestion_user:${INGESTION_PG_PASSWORD:?INGESTION_PG_PASSWORD is required}@ingestion-postgres:5432/quarry_v2?sslmode=disable
      QUARRY_CONTROL_API_KEY: ${QUARRY_CONTROL_API_KEY:?QUARRY_CONTROL_API_KEY is required}
      QUARRY_INTERNAL_SECRET: ${QUARRY_INTERNAL_SECRET:?QUARRY_INTERNAL_SECRET must be set (no insecure default)}
      QUARRY_INTERNAL_HMAC_REQUIRED: ${QUARRY_INTERNAL_HMAC_REQUIRED:-0}
      # D2-050: the routes only the orchestrator calls (/v1/internal/jobs/*,
      # /v1/internal/schedules/*) verify with their own secret, so the edge's
      # QUARRY_INTERNAL_SECRET no longer opens them. Unset falls back to the old
      # secret (no outage; control logs one warning that the two are equal). Set a
      # distinct value on control AND the orchestrator together, then remove the
      # fallback after the soak. Never put it on the edge.
      QUARRY_CONTROL_INTERNAL_SECRET: ${QUARRY_CONTROL_INTERNAL_SECRET:-${QUARRY_INTERNAL_SECRET}}
      # Off by default: when 1, a finalize with no org_id is refused (400). Turn on
      # once the orchestrator sends org_id on every finalize (it does since D2-050).
      QUARRY_CONTROL__FINALIZE_ORG_REQUIRED: ${QUARRY_CONTROL__FINALIZE_ORG_REQUIRED:-0}
      # Job admission (off by default): per-organization caps on running jobs, a
      # bounded backlog of waiting ones, and the claim endpoint the orchestrator
      # uses instead of reading the newest 50 jobs. See docs/RUNBOOKS.md, "Job
      # admission". Deploy control first (claim is inert), then the orchestrator
      # and edge, then turn it on.
      QUARRY_JOB_ADMISSION: ${QUARRY_JOB_ADMISSION:-off}
      # Executable scrape, crawl and batch schedules (WS15.S2). Off by default: with 0
      # these kinds stay unmapped and create nothing. Keep 0 until WS14 scope is
      # deployed and WS6.A is live. Turning it off pauses the Temporal schedules on the
      # next reconcile pass (30 s); it does not delete them.
      QUARRY_SCHEDULED_JOBS_ENABLED: ${QUARRY_SCHEDULED_JOBS_ENABLED:-0}
      # D2-042: GET /v1/schedules without org_id is always refused now (the all-orgs
      # branch is deleted). Control ignores this variable; it stays at 1 so an older
      # control image rolled back onto this stack is fenced too. The orchestrator
      # reads GET /v1/internal/schedules/desired.
      QUARRY_CONTROL_SCHEDULES_REQUIRE_ORG: ${QUARRY_CONTROL_SCHEDULES_REQUIRE_ORG:-1}
      QUARRY_JOB_CAP_DEFAULT: ${QUARRY_JOB_CAP_DEFAULT:-3}
      QUARRY_JOB_BACKLOG_DEFAULT: ${QUARRY_JOB_BACKLOG_DEFAULT:-200}
      QUARRY_JOB_BACKLOG_TTL: ${QUARRY_JOB_BACKLOG_TTL:-24h}
      QUARRY_JOB_CLAIM_LEASE: ${QUARRY_JOB_CLAIM_LEASE:-60s}
      # W2: deliver the one in-product change notification to notification-core
      # (Application Plane) over the shared inter-plane-bus network.
      NOTIFICATION_CORE_URL: ${NOTIFICATION_CORE_URL:-http://notification-core:3140}
      NOTIFICATION_QUARRY_CONTROL_SERVICE_TOKEN: ${NOTIFICATION_QUARRY_CONTROL_SERVICE_TOKEN:-}
      # G33: dispatch newly-created jobs onto the orchestrator's task queue.
      TEMPORAL_ADDR: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: quarry-orchestrator
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      # GDPR org-erasure purge consumer — narrowly-scoped identity on the
      # cross-plane control-shared-nats broker (NOT the legacy VEREVON_NATS_URL/
      # VEREVON_NATS_TOKEN verevon-nats broker used elsewhere in this plane).
      # Absent NATS_SHARED_URL the consumer simply stays disabled.
      NATS_SHARED_URL: nats://control-shared-nats:4222
      NATS_SHARED_USER: quarry-control-gdpr
      NATS_SHARED_PASSWORD: ${QUARRY_CONTROL_GDPR_NATS_PASSWORD:?QUARRY_CONTROL_GDPR_NATS_PASSWORD is required}
      # WS17.E3: the org-erasure hop to quarry-edge (profiles). Off while QUARRY_EDGE_URL is empty.
      # The token must equal the quarry-edge QUARRY_EDGE_INTERNAL_TOKEN. Set both when enabling.
      QUARRY_EDGE_URL: ${QUARRY_EDGE_URL:-}
      QUARRY_EDGE_INTERNAL_TOKEN: ${QUARRY_EDGE_INTERNAL_TOKEN:-}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until pg_isready -q -h ingestion-postgres -p 5432 -U ingestion_user -d quarry_v2; do
          sleep 1
        done
        exec /app/control
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${INGESTION_BIND_ADDRESS:-127.0.0.1}:28081:8081"
    networks:
      - ingestion-net
      - inter-plane-bus
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 -O /dev/null http://127.0.0.1:8081/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  quarry-orchestrator:
    env_file:
      - ./Quarry-v2/.env
    build:
      context: ./Quarry-v2
      dockerfile: deploy/compose/Dockerfile.orchestrator
    container_name: quarry-orchestrator
    restart: unless-stopped
    init: true
    # A stop cancels in-flight activities and waits up to
    # QUARRY_ORCH_WORKER_STOP_TIMEOUT_S (20 s per base worker, two workers, plus
    # 5 s slack: at most 55 s with the bound at its 25 s maximum). The grace
    # period must stay above that total, or the platform kills it first.
    stop_grace_period: 60s
    environment:
      TEMPORAL_ADDR: temporal:7233
      TEMPORAL_NAMESPACE: default
      QUARRY_ORCH_WORKER_STOP_TIMEOUT_S: "${QUARRY_ORCH_WORKER_STOP_TIMEOUT_S:-20}"
      RUNTIME_BASE_URL: http://quarry-edge:8082
      CONTROL_BASE_URL: http://quarry-control:8081
      # How many jobs one claim asks control for (used when control has job
      # admission on; otherwise the dispatcher lists as before).
      QUARRY_JOB_CLAIM_BATCH: ${QUARRY_JOB_CLAIM_BATCH:-50}
      RUNTIME_AUTH_TOKEN: ${QUARRY_RUNTIME_AUTH_TOKEN:?QUARRY_RUNTIME_AUTH_TOKEN is required}
      CONTROL_AUTH_TOKEN: ${QUARRY_CONTROL_API_KEY:?QUARRY_CONTROL_API_KEY is required}
      # Shared HMAC secret for the run_page org-binding (must equal the
      # edge's QUARRY_EDGE__INTERNAL_SECRET). Binds org_id+url on the
      # /v1/internal/run_page call so a leaked runtime bearer can't forge
      # another tenant's org.
      QUARRY_INTERNAL_SECRET: ${QUARRY_INTERNAL_SECRET:?QUARRY_INTERNAL_SECRET must be set (no insecure default)}
      # D2-050: signs the calls to control's orchestrator-only routes. Must equal
      # control's QUARRY_CONTROL_INTERNAL_SECRET; unset falls back to the old secret.
      QUARRY_CONTROL_INTERNAL_SECRET: ${QUARRY_CONTROL_INTERNAL_SECRET:-${QUARRY_INTERNAL_SECRET}}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      ENVIRONMENT: ${ENVIRONMENT:-dev}
    depends_on:
      temporal:
        condition: service_healthy
      quarry-edge:
        condition: service_healthy
      quarry-control:
        condition: service_healthy
    # Same shape as imports-api / integration-api / finspo-api. Without
    # this an orchestrator stuck in a tight workflow-replay loop (e.g.
    # a determinism violation that retries forever) can starve other
    # services on the same host.
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
        reservations:
          memory: 96M
    networks:
      - ingestion-net
      - inter-plane-bus
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== IMPORTS-CORE (File Import) ====================
  imports-api:
    build:
      context: ./imports-core
      dockerfile: Dockerfile
    container_name: imports-api
    restart: unless-stopped
    env_file:
      - ./imports-core/.env
    environment:
      # Bruk ingestion_user siden det er den som finnes i Postgres her
      DATABASE_URL: postgresql+asyncpg://ingestion_user:${INGESTION_PG_PASSWORD:?INGESTION_PG_PASSWORD is required}@ingestion-postgres:5432/imports

      NATS_URL: nats://nats:4222
      NATS_TOKEN: ${INGESTION_NATS_TOKEN:?INGESTION_NATS_TOKEN is required}
      DOCUMENT_SERVICE_URL: ${DATA_PLANE_DOCUMENTS_URL:-http://dpv2-documents-api:8010}
      DOCUMENT_SERVICE_IMPORT_PATH: /v1/documents/
      AUTH_CORE_URL: ${AUTH_CORE_URL:-http://auth-core:3011}
      AUTH_CORE_JWKS_URL: ${AUTH_CORE_JWKS_URL:-http://auth-core:3011/api/convex-auth/jwks}
      PLANE_TOKEN_ISSUER: ${PLANE_TOKEN_ISSUER:-http://auth-core:3011/api/convex-auth}
      INGESTION_AUTH_AUDIENCE: ingestion
      INGESTION_SERVICE_ID: imports-core
      INGESTION_SERVICE_API_KEY: ${IMPORTS_SERVICE_API_KEY:?IMPORTS_SERVICE_API_KEY is required}
      DOCUMENT_PROCESSOR_ORDER: ${DOCUMENT_PROCESSOR_ORDER:-local}
      IMPORTS_SPACE_UPLOAD: ${IMPORTS_SPACE_UPLOAD:-false}
      TIKA_ENABLED: ${TIKA_ENABLED:-false}
      TIKA_URL: ${TIKA_URL:-http://tika:9998}
      TIKA_TIMEOUT_S: ${TIKA_TIMEOUT_S:-20}
      CHAT_EXTRACT_OCR_ENABLED: ${CHAT_EXTRACT_OCR_ENABLED:-false}
      CHAT_EXTRACT_OCR_MAX_PAGES: ${CHAT_EXTRACT_OCR_MAX_PAGES:-15}
      GOTENBERG_URL: ${GOTENBERG_URL:-http://gotenberg:3000}
      STIRLING_PDF_URL: ${STIRLING_PDF_URL:-http://stirling-pdf:8080}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 64M
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "${INGESTION_BIND_ADDRESS:-127.0.0.1}:3025:3025"
    networks:
      - ingestion-net
      - inter-plane-bus
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3025/ready')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ==================== INTEGRATION-CORE (M365 OAuth + Discovery) ====================
  integration-api:
    build:
      context: ./integration-corev2
      dockerfile: Dockerfile
      target: api
      args:
        CODEX_VERSION: ${CODEX_VERSION:-0.153.4}
    container_name: integration-api
    restart: unless-stopped
    # PID 1 reaps the Codex process trees (Node shim, native codex, MCP/npm
    # children) that sign-in, sign-out and the optional app-server fallback
    # spawn, so killed processes never linger as zombies.
    init: true
    env_file:
      # Cutover compatibility: reuse the existing v1 credential source while
      # the runtime is integration-corev2. Service URLs and safety knobs below
      # intentionally override this file, but provider secrets should flow
      # through instead of being masked to empty values.
      - ./integration-corev2/.env
    environment:
      PORT: "3026"
      SERVICE_NAME: integration-corev2
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      DATABASE_URL: postgresql://ingestion_user:${INGESTION_PG_PASSWORD:?INGESTION_PG_PASSWORD is required}@ingestion-postgres:5432/integration
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set (no insecure default)}
      INTERNAL_API_KEY_HEADER: ${INTERNAL_API_KEY_HEADER:-X-Internal-API-Key}
      AUTH_CORE_URL: ${AUTH_CORE_URL:-http://auth-core:3011}
      AUTH_CORE_INTERNAL_API_KEY: ${AUTH_CORE_INTERNAL_API_KEY:-${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set (no insecure default)}}
      # JWT issuers are opaque identifiers, not Docker routes. Keep this exact
      # value aligned with the AUTH_CORE_ISSUER used by Auth Core when minting
      # plane tokens; a stale integration-corev2/.env value rejects otherwise
      # valid browser audience tokens.
      AUTH_CORE_JWKS_URL: ${AUTH_CORE_JWKS_URL:-http://auth-core:3011/api/convex-auth/jwks}
      PLANE_TOKEN_ISSUER: ${AUTH_CORE_ISSUER:-http://localhost:3011/api/convex-auth}
      INGESTION_AUTH_AUDIENCE: ingestion
      USER_CORE_URL: ${USER_CORE_URL:-http://user-core:3012}
      ORG_CORE_URL: ${ORG_CORE_URL:-http://org-core:8080}
      ORG_CORE_SERVICE_TOKEN: ${INTEGRATION_ORG_CORE_SERVICE_TOKEN:?INTEGRATION_ORG_CORE_SERVICE_TOKEN is required}
      SESSION_CORE_URL: ${SESSION_CORE_URL:-http://session-core:9091}
      BILLING_CORE_URL: ${BILLING_CORE_URL:-http://billing-core:3014}
      BILLING_CORE_SERVICE_TOKEN: ${INTEGRATION_BILLING_CORE_SERVICE_TOKEN:?INTEGRATION_BILLING_CORE_SERVICE_TOKEN is required}
      AUDIT_CORE_URL: ${AUDIT_CORE_URL:-http://audit-core:8187}
      AUDIT_CORE_SERVICE_TOKEN: ${INTEGRATION_AUDIT_CORE_SERVICE_TOKEN:?INTEGRATION_AUDIT_CORE_SERVICE_TOKEN is required}
      FINSPO_CORE_URL: ${FINSPO_CORE_URL:-http://finspo-api:3130}
      FINSPO_API_KEY: ${FINSPO_API_KEY:-${AUTH_CORE_INTERNAL_API_KEY:-${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set (no insecure default)}}}
      FINSPO_API_KEY_HEADER: ${FINSPO_API_KEY_HEADER:-X-API-Key}
      DATA_PLANE_DOCUMENTS_URL: ${DATA_PLANE_DOCUMENTS_URL:-${DATA_PLANE_URL:-http://dpv2-documents-api:8010}}
      INTEGRATION_SERVICE_ID: ${INTEGRATION_SERVICE_ID:-integration-corev2}
      INTEGRATION_SERVICE_API_KEY: ${INTEGRATION_SERVICE_API_KEY:?INTEGRATION_SERVICE_API_KEY is required}
      # Scoped principal on auth-core's /internal/oauth/* (registry entry
      # `integration-core-primary` in the Control Plane compose): lets a
      # Microsoft connection adopted from a Better Auth sign-in be re-minted
      # through Control Plane when this service's own refresh token is absent
      # or dead. An empty token disables the fallback.
      AUTH_CORE_OAUTH_CREDENTIAL_ID: ${AUTH_CORE_OAUTH_CREDENTIAL_ID:-integration-core-primary}
      AUTH_CORE_OAUTH_PRINCIPAL: ${AUTH_CORE_OAUTH_PRINCIPAL:-integration-core}
      AUTH_CORE_OAUTH_SERVICE_TOKEN: ${AUTH_CORE_OAUTH_SERVICE_TOKEN:-}
      DATA_PLANE_GRAPH_INDEX_URL: ${DATA_PLANE_GRAPH_INDEX_URL:-${GRAPH_INDEX_URL:-http://dpv2-graph-index:9203}}
      INTEGRATION_WEBHOOK_HOTPATH_URL: ${INTEGRATION_WEBHOOK_HOTPATH_URL:-http://integration-webhook-normalizer:3036}
      INTEGRATION_PUBLIC_BASE_URL: ${INTEGRATION_PUBLIC_BASE_URL:-http://localhost:3026}
      INTEGRATION_CORE_URL: ${INTEGRATION_CORE_URL:-http://integration-api:3026}
      # Inbound "forward an email to create a task" (plan task J3, dark). The
      # webhook route is enabled only when BOTH MAIL_TASK_PROVIDER ("postmark")
      # and MAIL_TASK_WEBHOOK_SECRET are set (internal/mailtask/handler.go), and
      # both are empty here, so the feature is off. Set them in the launcher's
      # environment or this plane's own .env, NOT in integration-corev2/.env: a
      # compose `environment` entry masks that env_file with its empty default.
      # Do not set them before the Postmark inbound path is proven (plan J1/J2).
      MAIL_TASK_PROVIDER: ${MAIL_TASK_PROVIDER:-}
      MAIL_TASK_WEBHOOK_SECRET: ${MAIL_TASK_WEBHOOK_SECRET:-}
      # Same host variable as user-core's MAIL_TASK_RECEIVING_DOMAIN, so the
      # domain the webhook accepts and the one Settings shows cannot drift.
      MAIL_TASK_RECEIVING_DOMAIN: ${MAIL_TASK_RECEIVING_DOMAIN:-}
      # Presented to user-core as principal `integration-mail-task-worker` (scope
      # mail-task:resolve alone). Control's launcher mints it once as
      # USER_CORE_MAIL_TASK_WORKER_TOKEN; user-core validates the same value in
      # its own USER_CORE_SERVICE_CREDENTIALS (not Auth Core's registry).
      MAIL_TASK_USER_CORE_SERVICE_TOKEN: ${USER_CORE_MAIL_TASK_WORKER_TOKEN:-}
      # HMAC key for this service's delegation to the gateway BFF
      # (/internal/mail-task/ingest). The BFF reads the SAME host variable as its
      # MAIL_TASK_INGEST_SERVICE_TOKEN, so the two ends are equal by construction.
      # Not minted by the launcher: empty (the BFF route refuses every caller)
      # until the owner switches mail-to-task on. 32 characters or more.
      MAIL_TASK_GATEWAY_SERVICE_TOKEN: ${MAIL_TASK_GATEWAY_SERVICE_TOKEN:-}
      # Bearer for imports-core attachment extraction; leave empty for text-only.
      MAIL_TASK_IMPORTS_CORE_TOKEN: ${MAIL_TASK_IMPORTS_CORE_TOKEN:-}
      # Optional ChatGPT subscription broker configuration is supplied by the
      # integration-corev2 env file so its dedicated model-plane credential is
      # not expanded from Compose's project-wide environment. The API image
      # installs the reviewed, pinned Codex CLI release selected by CODEX_VERSION.
      # The named volume keeps each connection's Codex sign-in out of the database.
      # ChatGPT subscription broker: non-secret knobs. Compose `environment`
      # overrides env_file, so these are owned here; the dedicated
      # CODEX_SUBSCRIPTION_MODEL_PLANE_API_KEY stays only in integration-corev2/.env.
      # The hardened Codex app-server is the default until OpenAI confirms the
      # direct transport for a hosted product; opt in without a rebuild by
      # setting CODEX_SUBSCRIPTION_TRANSPORT=direct and recreating the container.
      CODEX_SUBSCRIPTION_TRANSPORT: ${CODEX_SUBSCRIPTION_TRANSPORT:-app-server}
      # The API image links the vendored native Codex binary here (see its
      # Dockerfile), so each app-server call skips the npm Node launcher; the
      # broker adds the launcher's two variables itself. This overrides the
      # env_file value. Set CODEX_APP_SERVER_COMMAND=codex to use the launcher.
      CODEX_APP_SERVER_COMMAND: ${CODEX_APP_SERVER_COMMAND:-/usr/local/bin/codex-native}
      CODEX_SUBSCRIPTION_DIRECT_ORIGINATOR: ${CODEX_SUBSCRIPTION_DIRECT_ORIGINATOR:-verevon}
      CODEX_SUBSCRIPTION_DIRECT_REQUEST_SHAPE: ${CODEX_SUBSCRIPTION_DIRECT_REQUEST_SHAPE:-classic}
      CODEX_SUBSCRIPTION_DIRECT_PROMPT_MODE: ${CODEX_SUBSCRIPTION_DIRECT_PROMPT_MODE:-roles}
      CODEX_SUBSCRIPTION_DIRECT_MAX_RETRIES: ${CODEX_SUBSCRIPTION_DIRECT_MAX_RETRIES:-2}
      CODEX_SUBSCRIPTION_REFRESH_SKEW: ${CODEX_SUBSCRIPTION_REFRESH_SKEW:-10m}
      CODEX_SUBSCRIPTION_MAX_CONCURRENCY: ${CODEX_SUBSCRIPTION_MAX_CONCURRENCY:-16}
      CODEX_SUBSCRIPTION_MAX_CONCURRENCY_PER_CONNECTION: ${CODEX_SUBSCRIPTION_MAX_CONCURRENCY_PER_CONNECTION:-4}
      CODEX_SUBSCRIPTION_QUEUE_TIMEOUT: ${CODEX_SUBSCRIPTION_QUEUE_TIMEOUT:-30s}
      CODEX_APP_SERVER_HARDENED: ${CODEX_APP_SERVER_HARDENED:-true}
      # thread/start carries the turn's reasoning effort so Codex's startup
      # prewarm matches the turn; false restores the earlier thread/start.
      CODEX_APP_SERVER_THREAD_EFFORT: ${CODEX_APP_SERVER_THREAD_EFFORT:-true}
      META_JS_SDK_APP_ID: ${META_JS_SDK_APP_ID:-${META_APP_CLIENT_ID:-${FACEBOOK_CLIENT_ID:-${INSTAGRAM_CLIENT_ID:-}}}}
      META_JS_SDK_API_VERSION: ${META_JS_SDK_API_VERSION:-v23.0}
      META_JS_SDK_LOCALE: ${META_JS_SDK_LOCALE:-en_US}
      META_BUSINESS_LOGIN_CONFIG_ID: ${META_BUSINESS_LOGIN_CONFIG_ID:-}
      META_BUSINESS_LOGIN_CONVERSIONS_CONFIG_ID: ${META_BUSINESS_LOGIN_CONVERSIONS_CONFIG_ID:-}
      NATS_ENABLED: ${NATS_ENABLED:-false}
      # Cross-plane bridge (#3): publish integration events
      # (verevon.ingestion.integration.*) DIRECTLY into the Application Plane's
      # app-nats (alias application-nats on inter-plane-bus), where the
      # VEREVON_INGESTION JetStream stream captures them and conversation-core's
      # webhook-received consumer delivers them. Uses the dedicated per-user
      # publisher principal (app-nats is per-user auth, not single-token), so
      # NATS_TOKEN and its VEREVON_NATS_TOKEN fallback are both emptied to force
      # UserInfo auth (publisher.go picks token over UserInfo when a token is set).
      NATS_URL: nats://application-nats:4222
      NATS_USERNAME: ingestion-integration-publisher
      NATS_PASSWORD: ${APPLICATION_INGESTION_PUBLISHER_NATS_PASSWORD:?APPLICATION_INGESTION_PUBLISHER_NATS_PASSWORD is required}
      NATS_TOKEN: ""
      VEREVON_NATS_TOKEN: ""
      NATS_SUBJECT_PREFIX: ${NATS_SUBJECT_PREFIX:-}
      # The credential-vault key intentionally comes only from
      # integration-corev2/.env in development. Defining it again through
      # Compose interpolation lets an unrelated plane-level env file silently
      # replace the key and makes existing OAuth ciphertext unreadable.
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-common}
      MICROSOFT_GRAPH_BASE_URL: ${MICROSOFT_GRAPH_BASE_URL:-https://graph.microsoft.com}
      NANGO_API_KEY: ""
      CONNECTOR_RUNTIME_BASE_URL: ""
      CONNECTOR_RUNTIME_PUBLIC_BASE_URL: ""
      CONNECTOR_RUNTIME_SECRET: ""
      CONNECTOR_RUNTIME_TIMEOUT_MS: ""
      CONNECTOR_RUNTIME_WEBHOOK_SECRET: ""
      CONNECTOR_RUNTIME_WEBHOOK_URL: ""
      GOOGLE_INTEGRATION_KEY: ""
      GOOGLE_DRIVE_INTEGRATION_KEY: ""
      MICROSOFT_INTEGRATION_KEY: ""
      NOTION_INTEGRATION_KEY: ""
      SLACK_INTEGRATION_KEY: ""
      GITHUB_INTEGRATION_KEY: ""
      SHOPIFY_INTEGRATION_KEY: ""
      STRIPE_INTEGRATION_KEY: ""
      HUBSPOT_INTEGRATION_KEY: ""
    deploy:
      resources:
        limits:
          # The default app-server transport spawns one Codex process per
          # call, and review passes spawn several at once. At 2 CPUs / 2 GiB
          # the cgroup was CPU-throttled in 9.3% of periods, which stretched
          # every local Codex setup phase of parallel calls, and memory.peak
          # reached the 2 GiB cap (memory.events counted limit hits). The former
          # CRUD-only 256M/0.25 CPU cap throttled even short review calls into
          # their deadlines. Keep limits configurable.
          memory: ${INTEGRATION_API_MEMORY_LIMIT:-4G}
          cpus: "${INTEGRATION_API_CPU_LIMIT:-6.0}"
        reservations:
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy
      integration-webhook-normalizer:
        condition: service_healthy
    ports:
      - "${INGESTION_BIND_ADDRESS:-127.0.0.1}:3026:3026"
    networks:
      - ingestion-net
      - inter-plane-bus
    volumes:
      - integration-codex-subscription-home:/var/lib/integration-core/codex-subscriptions
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3026/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================================
  # SHIPPING-CORE — freight aggregator (quotes today; booking/tracking later).
  # Migrated from Suplayer-System: carrier-adapter fleet (mock carriers by
  # default; real Bring/UPS/FedEx activate individually when their credentials
  # are present — missing creds are logged and skipped, never fatal).
  # Joins inter-plane-bus so Model Plane tools and the Verevon gateway can
  # reach it; host port 3156 is what execution-core's host.docker.internal
  # pattern dials.
  # ============================================================
  shipping-core:
    env_file:
      - ./shipping-core/.env
    build:
      context: ./shipping-core
      dockerfile: Dockerfile
    container_name: shipping-core
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://ingestion_user:${INGESTION_PG_PASSWORD:?INGESTION_PG_PASSWORD is required}@ingestion-postgres:5432/shipping_core?sslmode=disable
      AUTH_CORE_URL: ${AUTH_CORE_URL:-http://auth-core:3011}
      AUTH_CORE_JWKS_URL: ${AUTH_CORE_JWKS_URL:-http://auth-core:3011/api/convex-auth/jwks}
      PLANE_TOKEN_ISSUER: ${PLANE_TOKEN_ISSUER:-http://auth-core:3011/api/convex-auth}
      INGESTION_AUTH_AUDIENCE: ingestion
      INGESTION_SERVICE_ID: shipping-core
      SHIPPING_SERVICE_API_KEY: ${SHIPPING_SERVICE_API_KEY:-}
      # Model Plane's capability-core, for the runtime health-attestation
      # heartbeat (internal/capabilityhealth) that reports cap.tool.shipping.*
      # availability from a real synthetic carrier-quote probe. Cross-plane,
      # so it goes through the host like every other Model Plane HTTP target.
      CAPABILITY_CORE_HTTP_URL: ${CAPABILITY_CORE_HTTP_URL:-http://host.docker.internal:8085}
      DATA_PLANE_DOCUMENTS_URL: ${DATA_PLANE_DOCUMENTS_URL:-http://dpv2-documents-api:8010}
      NATS_URL: nats://nats:4222
      NATS_TOKEN: ${INGESTION_NATS_TOKEN:?INGESTION_NATS_TOKEN is required}
      # Carrier credentials (vendor-supplied; Phase-0 tasks in the shipping
      # docs). Empty ⇒ that carrier stays on its mock adapter / is skipped.
      BRING_API_UID: ${BRING_API_UID:-}
      BRING_API_KEY: ${BRING_API_KEY:-}
      BRING_CUSTOMER_NUMBER: ${BRING_CUSTOMER_NUMBER:-}
      # X-Bring-Client-URL header value (developer.bring.com/api: identifies
      # the calling service, required on every Mybring API request alongside
      # the UID/key above). Defaults to verevon.no in code if left empty.
      BRING_CLIENT_URL: ${BRING_CLIENT_URL:-}
      # Set to "true" only once bookings are meant to place REAL freight
      # orders; otherwise every Booking API call carries testIndicator=true.
      BRING_LIVE_BOOKING: ${BRING_LIVE_BOOKING:-}
      # MyDHL API (developer.dhl.com): Basic Auth, API Key as username / API
      # Secret as password — no OAuth2 flow. DHL_API_BASE_URL defaults to
      # production; set it to https://express.api.dhl.com/mydhlapi/test for
      # a sandbox-scoped app (e.g. an approved "...-sandbox-..." app name).
      DHL_API_KEY: ${DHL_API_KEY:-}
      DHL_API_SECRET: ${DHL_API_SECRET:-}
      DHL_ACCOUNT_NUMBER: ${DHL_ACCOUNT_NUMBER:-}
      DHL_API_BASE_URL: ${DHL_API_BASE_URL:-}
      UPS_CLIENT_ID: ${UPS_CLIENT_ID:-}
      UPS_CLIENT_SECRET: ${UPS_CLIENT_SECRET:-}
      UPS_ACCOUNT_NUMBER: ${UPS_ACCOUNT_NUMBER:-}
      # Test/CIE base has NO /rest/ suffix — the adapter string-concatenates
      # BaseURL + path (e.g. "/api/rating/v2409/Shop"); a trailing /rest/
      # would produce a malformed double-slash URL.
      UPS_API_BASE_URL: ${UPS_API_BASE_URL:-}
      FEDEX_CLIENT_ID: ${FEDEX_CLIENT_ID:-}
      FEDEX_CLIENT_SECRET: ${FEDEX_CLIENT_SECRET:-}
      FEDEX_ACCOUNT_NUMBER: ${FEDEX_ACCOUNT_NUMBER:-}
      FEDEX_API_BASE_URL: ${FEDEX_API_BASE_URL:-https://apis-sandbox.fedex.com}
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 32M
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${INGESTION_BIND_ADDRESS:-127.0.0.1}:3156:8080"
    networks:
      - ingestion-net
      - inter-plane-bus
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s

  integration-finspo-worker:
    build:
      context: ./integration-corev2
      dockerfile: Dockerfile
      target: finspo-worker
    container_name: integration-finspo-worker
    restart: unless-stopped
    env_file:
      - ./integration-corev2/.env
    environment:
      SERVICE_NAME: integration-finspo-worker
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      DATABASE_URL: postgresql://ingestion_user:${INGESTION_PG_PASSWORD:?INGESTION_PG_PASSWORD is required}@ingestion-postgres:5432/integration
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set (no insecure default)}
      INTERNAL_API_KEY_HEADER: ${INTERNAL_API_KEY_HEADER:-X-Internal-API-Key}
      INTEGRATION_CORE_URL: ${INTEGRATION_CORE_URL:-http://integration-api:3026}
      INTEGRATION_PUBLIC_BASE_URL: ${INTEGRATION_PUBLIC_BASE_URL:-http://localhost:3026}
      FINSPO_CORE_URL: ${FINSPO_CORE_URL:-http://finspo-api:3130}
      FINSPO_API_KEY: ${FINSPO_API_KEY:-${AUTH_CORE_INTERNAL_API_KEY:-${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set (no insecure default)}}}
      FINSPO_API_KEY_HEADER: ${FINSPO_API_KEY_HEADER:-X-API-Key}
      AUTH_CORE_URL: ${AUTH_CORE_URL:-http://auth-core:3011}
      DATA_PLANE_DOCUMENTS_URL: ${DATA_PLANE_DOCUMENTS_URL:-${DATA_PLANE_URL:-http://dpv2-documents-api:8010}}
      INTEGRATION_SERVICE_ID: ${INTEGRATION_SERVICE_ID:-integration-corev2}
      INTEGRATION_SERVICE_API_KEY: ${INTEGRATION_SERVICE_API_KEY:?INTEGRATION_SERVICE_API_KEY is required}
      # config.Load still initializes the shared vault from the service env file
      # even though this worker never decrypts provider tokens.
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.20"
        reservations:
          memory: 32M
    depends_on:
      integration-api:
        condition: service_healthy
      finspo-api:
        condition: service_healthy
    networks:
      - ingestion-net
      - inter-plane-bus
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  integration-email-worker:
    build:
      context: ./integration-corev2
      dockerfile: Dockerfile
      target: email-worker
    container_name: integration-email-worker
    restart: unless-stopped
    env_file:
      - ./integration-corev2/.env
    environment:
      SERVICE_NAME: integration-email-worker
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      DATABASE_URL: postgresql://ingestion_user:${INGESTION_PG_PASSWORD:?INGESTION_PG_PASSWORD is required}@ingestion-postgres:5432/integration
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set (no insecure default)}
      # This worker decrypts real provider OAuth tokens. In development the
      # load-bearing vault key comes only from integration-corev2/.env, keeping
      # it identical to integration-api's key. Production supplies it through
      # the hardened overlay below.
      # conversation-ingest-rs lives on the Application Plane; both sides sit
      # on the shared inter-plane-bus network.
      CONVERSATION_INGEST_URL: ${CONVERSATION_INGEST_URL:-http://conversation-ingest-rs:3161}
      CONVERSATION_EMAIL_INGEST_SERVICE_TOKEN: ${CONVERSATION_EMAIL_INGEST_SERVICE_TOKEN:?CONVERSATION_EMAIL_INGEST_SERVICE_TOKEN must match Application Plane conversation-ingest}
      EMAIL_SYNC_INTERVAL: ${EMAIL_SYNC_INTERVAL:-60s}
      EMAIL_SYNC_BACKFILL_WINDOW: ${EMAIL_SYNC_BACKFILL_WINDOW:-24h}
      EMAIL_SYNC_GRAPH_FULL_BACKFILL: ${EMAIL_SYNC_GRAPH_FULL_BACKFILL:-true}
      EMAIL_SYNC_MAX_PER_CYCLE: ${EMAIL_SYNC_MAX_PER_CYCLE:-100}
      # Manual Support refreshes are claimed through integration-api so the
      # queue transition and operator audit event remain authoritative.
      INTEGRATION_CORE_URL: ${INTEGRATION_CORE_URL:-http://integration-api:3026}
      AUTH_CORE_URL: ${AUTH_CORE_URL:-http://auth-core:3011}
      # Same Control Plane re-mint principal as integration-api: the mail lane
      # refreshes provider tokens in this worker, and a connection adopted from
      # a Microsoft sign-in has no refresh token of its own.
      AUTH_CORE_OAUTH_CREDENTIAL_ID: ${AUTH_CORE_OAUTH_CREDENTIAL_ID:-integration-core-primary}
      AUTH_CORE_OAUTH_PRINCIPAL: ${AUTH_CORE_OAUTH_PRINCIPAL:-integration-core}
      AUTH_CORE_OAUTH_SERVICE_TOKEN: ${AUTH_CORE_OAUTH_SERVICE_TOKEN:-}
      # Discord inbound reads use the app bot credential, not the OAuth
      # user's access token. Keep this explicit so a local secret supplied via
      # the compose env files reaches the email worker.
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.20"
        reservations:
          memory: 32M
    depends_on:
      integration-api:
        condition: service_healthy
    networks:
      - ingestion-net
      - inter-plane-bus
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  integration-webhook-normalizer:
    env_file:
      - ./integration-corev2/.env
    build:
      context: ./integration-corev2/services/webhook-normalizer-rs
      dockerfile: Dockerfile
    container_name: integration-webhook-normalizer
    restart: unless-stopped
    environment:
      PORT: "3036"
      RUST_LOG: ${RUST_LOG:-info}
    deploy:
      resources:
        limits:
          memory: 96M
          cpus: "0.20"
        reservations:
          memory: 32M
    ports:
      - "${INGESTION_BIND_ADDRESS:-127.0.0.1}:13036:3036"
    networks:
      - ingestion-net
      - inter-plane-bus
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3036/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==================== FINSPO-CORE (SharePoint Manager) ====================
  finspo-api:
    env_file:
      - ./finspo-core/.env
    build:
      context: ./finspo-core
      dockerfile: Dockerfile
    container_name: finspo-api
    restart: unless-stopped
    environment:
      PORT: "3130"
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      SERVICE_NAME: finspo-core
      FINSPO_API_KEY: ${AUTH_CORE_INTERNAL_API_KEY:?AUTH_CORE_INTERNAL_API_KEY is required}
      FINSPO_API_KEY_HEADER: ${FINSPO_API_KEY_HEADER:-X-API-Key}
      INTEGRATION_CORE_URL: http://integration-api:3026
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set (no insecure default)}
      # Phase 1 — Postgres + NATS + Data Plane wiring.
      FINSPO_DSN: postgres://ingestion_user:${INGESTION_PG_PASSWORD:?INGESTION_PG_PASSWORD is required}@ingestion-postgres:5432/finspo?sslmode=disable
      NATS_URL: ${FINSPO_NATS_URL:-nats://${INGESTION_NATS_TOKEN:?INGESTION_NATS_TOKEN is required}@nats:4222}
      NATS_SUBJECT_PREFIX: ${FINSPO_NATS_SUBJECT_PREFIX:-finspo}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      DATA_PLANE_DOCUMENTS_BASE_URL: ${DATA_PLANE_URL:-http://dpv2-documents-api:8010}
      AUTH_CORE_URL: ${AUTH_CORE_URL:-http://auth-core:3011}
      FINSPO_SERVICE_ID: ${FINSPO_SERVICE_ID:-finspo-core}
      FINSPO_SERVICE_API_KEY: ${FINSPO_SERVICE_API_KEY:?FINSPO_SERVICE_API_KEY is required}
      # Phase 3 — background scheduler + ACL capture.
      FINSPO_SYNC_INTERVAL: ${FINSPO_SYNC_INTERVAL:-5m}
      FINSPO_CAPTURE_PERMISSIONS: ${FINSPO_CAPTURE_PERMISSIONS:-true}
      # Content capture: download each synced DriveItem via Graph /content,
      # extract text, and forward a real content-bearing document to Data
      # Plane v2 (internal/content/ingestor.go). Without this only file/folder
      # METADATA syncs, which is exactly the "SharePoint source shows 0 B"
      # symptom. Requires the finspo-core service principal registered in
      # auth-core with audience data-plane + documents:write + a persistent
      # retention posture.
      FINSPO_CAPTURE_CONTENT: ${FINSPO_CAPTURE_CONTENT:-true}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "${INGESTION_BIND_ADDRESS:-127.0.0.1}:3130:3130"
    networks:
      - ingestion-net
      - inter-plane-bus
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3130/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==================== ANBUD CORE (public tender ingestion) ====================
  # Doffin/TED notices -> eForms parse -> validated tender corpus. anbud-core owns
  # ../Engagement plane/anbud-core/.env; the Doffin key lives ONLY there (injected via env_file).
  # Do NOT re-list DOFFIN_API_KEY or the DOFFIN_* knobs under `environment:`: an
  # `${DOFFIN_API_KEY:-}` there resolves to empty whenever compose runs without
  # scripts/run-ingestion-plane.sh's --env-file arguments, and `environment:`
  # beats `env_file:`, so it would silently blank the key.
  # The one exception is DOFFIN_API_KEY_SECONDARY, which is blanked below on
  # purpose: env_file would otherwise hand the running service a key it never uses.
  anbud-api:
    # Opt-in only. anbud-core now runs in the Engagement plane against
    # engagement-postgres with dedicated anbud_migrator/anbud_app roles and its
    # own migration job; this copy connects as ingestion_user, which the current
    # anbud-core refuses ("use the dedicated anbud_app role").
    profiles: ["legacy-anbud"]
    env_file:
      - "../Engagement plane/anbud-core/.env"
    build:
      context: "../Engagement plane/anbud-core"
      dockerfile: Dockerfile
      # The Dockerfile copies the shared plane client from this named context,
      # as the Engagement plane's own compose provides it.
      additional_contexts:
        studio-plane-client: "../Engagement plane/pkg/planeclient"
      args: *build-metadata
    container_name: anbud-api
    restart: unless-stopped
    environment:
      PORT: "3138"
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      SERVICE_NAME: anbud-core
      ANBUD_API_KEY: ${AUTH_CORE_INTERNAL_API_KEY:?AUTH_CORE_INTERNAL_API_KEY is required}
      ANBUD_DSN: postgres://ingestion_user:${INGESTION_PG_PASSWORD:?INGESTION_PG_PASSWORD is required}@ingestion-postgres:5432/anbud_core?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      DOFFIN_API_KEY_SECONDARY: ""
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${INGESTION_BIND_ADDRESS:-127.0.0.1}:3138:3138"
    networks:
      - ingestion-net
      - inter-plane-bus
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3138/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==================== CONNECTOR RUNTIME ENGINE ====================
  connector-runtime-db:
    profiles: ["legacy-nango"]
    image: postgres:16.14-alpine3.24
    container_name: connector-runtime-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CONNECTOR_RUNTIME_DB_USER:-connector_runtime}
      POSTGRES_PASSWORD: ${CONNECTOR_RUNTIME_DB_PASSWORD:-}
      POSTGRES_DB: ${CONNECTOR_RUNTIME_DB_NAME:-connector_runtime}
    volumes:
      - connector-runtime-db-data:/var/lib/postgresql/data
    networks:
      - ingestion-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CONNECTOR_RUNTIME_DB_USER:-connector_runtime} -d ${CONNECTOR_RUNTIME_DB_NAME:-connector_runtime}"]
      interval: 10s
      timeout: 5s
      retries: 5

  connector-runtime-dragonfly:
    profiles: ["legacy-nango"]
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.37.0
    container_name: connector-runtime-dragonfly
    restart: unless-stopped
    command:
      - "--cache_mode=true"
      - "--maxmemory=256mb"
      - "--proactor_threads=1"
      - "--dir=/data"
    networks:
      - ingestion-net
    # No --requirepass on this instance, so the ping needs no -a auth flag
    # (unlike the main `dragonfly` service). Enables service_healthy gating
    # for connector-runtime-engine below.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  connector-runtime-engine:
    profiles: ["legacy-nango"]
    image: nangohq/nango-server:hosted-0.70.9
    container_name: connector-runtime-engine
    platform: linux/amd64
    restart: unless-stopped
    environment:
      # Development-only fallback. Override in real environments with `openssl rand -base64 32`.
      NANGO_ENCRYPTION_KEY: ${CONNECTOR_RUNTIME_ENCRYPTION_KEY:-}
      NANGO_DB_USER: ${CONNECTOR_RUNTIME_DB_USER:-connector_runtime}
      NANGO_DB_PASSWORD: ${CONNECTOR_RUNTIME_DB_PASSWORD:-}
      NANGO_DB_HOST: ${CONNECTOR_RUNTIME_DB_HOST:-connector-runtime-db}
      NANGO_DB_NAME: ${CONNECTOR_RUNTIME_DB_NAME:-connector_runtime}
      NANGO_DB_SSL: ${CONNECTOR_RUNTIME_DB_SSL:-false}
      RECORDS_DATABASE_URL: ${CONNECTOR_RUNTIME_RECORDS_DATABASE_URL:-postgresql://connector_runtime:connector_runtime@connector-runtime-db:5432/connector_runtime}
      SERVER_PORT: ${CONNECTOR_RUNTIME_PORT:-3003}
      # Browser-facing URL. Keep integration-core's internal runtime URL in
      # CONNECTOR_RUNTIME_BASE_URL; the Nango dashboard/Connect UI must emit a
      # host URL the browser can resolve.
      NANGO_SERVER_URL: ${CONNECTOR_RUNTIME_PUBLIC_SERVER_URL:-http://localhost:3003}
      NANGO_PUBLIC_SERVER_URL: ${CONNECTOR_RUNTIME_PUBLIC_SERVER_URL:-http://localhost:3003}
      NANGO_REDIS_URL: ${CONNECTOR_RUNTIME_REDIS_URL:-redis://connector-runtime-dragonfly:6379}
      # Self-hosted Nango validates backend API calls against environment-scoped
      # secret keys. integration-core uses CONNECTOR_RUNTIME_SECRET as its
      # Nango bearer token, so expose the same value as the DEV API key here.
      NANGO_SECRET_KEY_DEV: ${CONNECTOR_RUNTIME_SECRET:?CONNECTOR_RUNTIME_SECRET is required}
      NANGO_PUBLIC_CONNECT_URL: ${CONNECTOR_RUNTIME_PUBLIC_CONNECT_URL:-http://localhost:3009}
      NANGO_CONNECT_UI_PORT: ${CONNECTOR_RUNTIME_CONNECT_UI_PORT:-3009}
      # Nango's hosted webapp initializes Stripe even when billing is disabled.
      # A non-secret publishable placeholder avoids a local dashboard crash.
      PUBLIC_STRIPE_KEY: ${CONNECTOR_RUNTIME_PUBLIC_STRIPE_KEY:-pk_test_self_hosted_disabled}
      FLAG_SERVE_CONNECT_UI: "true"
      FLAG_AUTH_ENABLED: ${CONNECTOR_RUNTIME_AUTH_ENABLED:-false}
      LOG_LEVEL: ${CONNECTOR_RUNTIME_LOG_LEVEL:-info}
    depends_on:
      connector-runtime-db:
        condition: service_healthy
      connector-runtime-dragonfly:
        condition: service_healthy
    ports:
      - "${INGESTION_BIND_ADDRESS:-127.0.0.1}:3003:3003"
      - "${INGESTION_BIND_ADDRESS:-127.0.0.1}:3009:3009"
    networks:
      - ingestion-net
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3003/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==================== INFRA (kun ingestion-net) ====================
  postgres:
    image: postgres:16.14-alpine3.24
    container_name: ingestion-postgres
    restart: unless-stopped
    networks:
      - ingestion-net
      # Dedicated link to the Model Plane browser-broker, which keeps its grant
      # store in its own database (browser_broker) on this server. Only this
      # service and the broker are on that network; Model Plane declares it
      # external. scripts/bootstrap_broker_db.sh creates the role and database.
      - browser-broker-db
    environment:
      POSTGRES_USER: ingestion_user
      POSTGRES_PASSWORD: ${INGESTION_PG_PASSWORD:?INGESTION_PG_PASSWORD is required}
      POSTGRES_DB: ingestion_plane_db
    ports:
      # Bind loopback only. Compose-network peers (quarry-control,
      # imports-api, etc.) reach Postgres via DNS as `ingestion-postgres`
      # and don't need a host port. Loopback binding still lets local
      # tools (`psql -h localhost`, `pgcli`) connect from the host.
      - "${INGESTION_BIND_ADDRESS:-127.0.0.1}:15432:5432"
    volumes:
      - ingestion-postgres-data:/var/lib/postgresql/data
      # Viktig: må være en FIL, ikke mappe (ellers får du "Is a directory")
      - ./init-databases.sql:/docker-entrypoint-initdb.d/001-init-databases.sql:ro
    shm_size: "64mb"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=64MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "effective_cache_size=128MB"
      - "-c"
      - "maintenance_work_mem=32MB"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "log_min_messages=warning"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingestion_user -d ingestion_plane_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.37.0
    container_name: ingestion-dragonfly
    restart: unless-stopped
    networks:
      - ingestion-net
    # No host port mapping — Dragonfly is reached only via the compose
    # network as `dragonfly:6379`. Avoids clashing with any local cache
    # the operator may run, and removes a cache instance from the
    # public host-network attack surface.
    expose:
      - "6379"
    volumes:
      - ingestion-dragonfly-data:/data
    command: >
      --requirepass=${INGESTION_DRAGONFLY_PASSWORD:?INGESTION_DRAGONFLY_PASSWORD is required}
      --cache_mode=true
      --maxmemory=256mb
      --proactor_threads=1
      --dir=/data
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.25"
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${INGESTION_DRAGONFLY_PASSWORD:?INGESTION_DRAGONFLY_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # G50 (verevon-gap.md §8.33): dedicated Postgres for Temporal — split out
  # from the shared `ingestion-postgres` instance which was running with
  # only 64MB shared_buffers and hosting 6 databases (quarry, quarry_v2,
  # ingestion_plane_db, imports, integration, temporal, temporal_visibility).
  # The shared instance caused intermittent `GetTransferTasks` failures
  # with `context deadline exceeded` whenever Temporal's history-shard
  # scanner read multiple queue tables concurrently and blew the cache.
  # Dedicated instance gives Temporal 256MB shared_buffers + 768MB
  # effective_cache_size — enough headroom for the working set of
  # transfer_tasks, timer_tasks, executions, history_node across all
  # shards without thrashing.
  temporal-postgres:
    image: postgres:16.14-alpine3.24
    container_name: ingestion-temporal-postgres
    restart: unless-stopped
    networks:
      - ingestion-net
    environment:
      POSTGRES_USER: ingestion_user
      POSTGRES_PASSWORD: ${INGESTION_PG_PASSWORD:?INGESTION_PG_PASSWORD is required}
      POSTGRES_DB: temporal
    volumes:
      - ingestion-temporal-postgres-data:/var/lib/postgresql/data
    shm_size: "256mb"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "log_min_messages=warning"
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingestion_user -d temporal"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  temporal:
    image: temporalio/auto-setup:1.27.2
    container_name: ingestion-temporal
    restart: unless-stopped
    environment:
      DB: postgres12
      # G50: was `ingestion-postgres` (shared 256MB instance). Now points
      # at the dedicated `temporal-postgres` service above.
      POSTGRES_SEEDS: temporal-postgres
      POSTGRES_USER: ingestion_user
      POSTGRES_PWD: ${INGESTION_PG_PASSWORD:?INGESTION_PG_PASSWORD is required}
      DB_PORT: 5432
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      LOG_LEVEL: warn
    deploy:
      resources:
        limits:
          memory: 768M       # G50: was 384M
          cpus: "1.0"        # G50: was 0.5
        reservations:
          memory: 256M       # G50: was 128M
    depends_on:
      temporal-postgres:
        condition: service_healthy
    ports:
      # Temporal frontend exposes admin gRPC with no built-in auth.
      # Loopback only — orchestrator reaches it via compose DNS.
      - "${INGESTION_BIND_ADDRESS:-127.0.0.1}:17233:7233"
    networks:
      - ingestion-net
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  nats:
    image: nats:2.10.29-alpine3.22@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
    container_name: ingestion-nats
    restart: unless-stopped
    command:
      - --jetstream
      - --store_dir=/data
      - -m
      - "8222"
      - --auth
      - ${INGESTION_NATS_TOKEN:?INGESTION_NATS_TOKEN is required}
    volumes:
      - ingestion-nats-data:/data
    ports:
      # Host 4224 is owned by Control Plane's control-shared-nats; use 4225 to
      # avoid a bind conflict when both planes run on the same host. Services
      # reach this NATS via the Docker network (nats://nats:4222), not the host
      # port, so this only affects host-side debugging access.
      - "${INGESTION_BIND_ADDRESS:-127.0.0.1}:4225:4222"
    networks:
      - ingestion-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Sonic-backed, tenant-scoped typeahead. The HTTP service is internal-only;
  # Verevon reaches it through the gateway on inter-plane-bus.
  autocomplete-sonic:
    # Upstream publishes amd64 only; declare emulation explicitly on arm64
    # instead of relying on an implicit, host-dependent platform choice.
    image: valeriansaliou/sonic:v1.4.9@sha256:f6927a9a1136ad1958551861a1bbfdfac724da5ee3d540bfa1d85592a86dacb0
    platform: linux/amd64
    restart: unless-stopped
    command: ["sonic", "-c", "/etc/sonic.cfg"]
    configs:
      - source: autocomplete-sonic-config
        target: /etc/sonic.cfg
    volumes:
      - autocomplete-sonic-data:/var/lib/sonic/store
    networks:
      - ingestion-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  autocomplete-core:
    env_file:
      - ./autocomplete-core/.env
    build:
      context: ./autocomplete-core
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AUTOCOMPLETE_HTTP_ADDR: 0.0.0.0:3219
      AUTOCOMPLETE_METADATA_DB: /data/autocomplete-core.sqlite3
      AUTOCOMPLETE_INTERNAL_TOKEN: ${AUTOCOMPLETE_INTERNAL_TOKEN:?AUTOCOMPLETE_INTERNAL_TOKEN is required}
      SONIC_ENABLED: "true"
      SONIC_ADDR: autocomplete-sonic:1491
      SONIC_PASSWORD: ${SONIC_PASSWORD:?SONIC_PASSWORD is required}
      NATS_ENABLED: "true"
      NATS_URL: nats://nats:4222
      NATS_AUTH_TOKEN: ${INGESTION_NATS_TOKEN:?INGESTION_NATS_TOKEN is required}
      NATS_STREAM: QUARRY_EVENTS
      NATS_DURABLE: autocomplete-core
      NATS_SUBJECT_FILTER: quarry.events.*
      RUST_LOG: ${AUTOCOMPLETE_RUST_LOG:-autocomplete_core=info,tower_http=info}
    volumes:
      - autocomplete-core-data:/data
    networks:
      - ingestion-net
      - inter-plane-bus
    depends_on:
      nats:
        condition: service_healthy
      autocomplete-sonic:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 -O /dev/null http://127.0.0.1:3219/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: ingestion-qdrant
    restart: unless-stopped
    environment:
      QDRANT_API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY must be set (no change-me default)}
      QDRANT__STORAGE__OPTIMIZERS__DEFAULT_SEGMENT_NUMBER: 2
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: 2
    volumes:
      - ingestion-qdrant-data:/qdrant/storage
    ports:
      - "${INGESTION_BIND_ADDRESS:-127.0.0.1}:16333:6333"
      - "${INGESTION_BIND_ADDRESS:-127.0.0.1}:16334:6334"
    networks:
      - ingestion-net
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "bash", "-c", "echo '' > /dev/tcp/127.0.0.1/6333"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==================== SUPPORT-WORKER (AI Triage + SLA) ====================
  support-worker:
    build:
      context: ./services/support-worker
      dockerfile: Dockerfile
    container_name: support-worker
    # Dormant until Zammad produces verevon.support.*, Model Plane auth is
    # wired, and an authoritative Zammad-owner → Control user/org resolver exists.
    profiles: ["support-automation"]
    restart: unless-stopped
    init: true
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      VEREVON_NATS_URL: nats://verevon-nats:4222
      VEREVON_NATS_TOKEN: ${VEREVON_NATS_TOKEN:-}
      ZAMMAD_API_URL: ${ZAMMAD_API_URL:-}
      ZAMMAD_API_TOKEN: ${ZAMMAD_API_TOKEN:-}
      AI_CORE_URL: ${SUPPORT_MODEL_PLANE_URL:-}
      NOTIFICATION_CORE_URL: ${NOTIFICATION_CORE_URL:-}
      SUPPORT_NOTIFICATION_MODE: ${SUPPORT_NOTIFICATION_MODE:-disabled}
      NOTIFICATION_SUPPORT_WORKER_SERVICE_TOKEN: ${NOTIFICATION_SUPPORT_WORKER_SERVICE_TOKEN:-}
    networks:
      - ingestion-net
      - inter-plane-bus
    depends_on:
      temporal:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== Self-owned document processors ====================
  # Default-off profile. Enable with:
  #   docker compose --profile self-owned-docs up -d tika gotenberg stirling-pdf
  tika:
    image: apache/tika:3.3.1.0-full
    container_name: ingestion-tika
    profiles: ["self-owned-docs"]
    restart: unless-stopped
    init: true
    expose:
      - "9998"
    networks:
      - ingestion-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 -O /dev/null http://127.0.0.1:9998/tika || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  gotenberg:
    image: gotenberg/gotenberg:8.34.0
    container_name: ingestion-gotenberg
    profiles: ["self-owned-docs"]
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    networks:
      - ingestion-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  stirling-pdf:
    image: stirlingtools/stirling-pdf:2.14.2
    container_name: ingestion-stirling-pdf
    profiles: ["self-owned-docs"]
    restart: unless-stopped
    init: true
    environment:
      DOCKER_ENABLE_SECURITY: ${STIRLING_PDF_ENABLE_SECURITY:-false}
      INSTALL_BOOK_AND_ADVANCED_HTML_OPS: ${STIRLING_PDF_ADVANCED_HTML_OPS:-false}
    expose:
      - "8080"
    volumes:
      - stirling-pdf-data:/configs
    networks:
      - ingestion-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 -O /dev/null http://127.0.0.1:8080/api/v1/info/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  # ==================== SearXNG (Quarry-v2 web search) ====================
  # Quarry-v2 owns its web-search dependency. quarry-edge's SmartRouter calls
  # this as the free primary provider (format=json). Defining it here — rather
  # than relying on the root mega-stack — makes the Ingestion Plane
  # self-contained: bringing up only this stack gives quarry-edge a working
  # SearXNG over inter-plane-bus (reachable as `searxng:8080`).
  searxng:
    image: searxng/searxng:2026.7.12-c19d86faa
    container_name: ingestion-searxng
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: "http://searxng:8080/"
      # Dragonfly is RESP-compatible — SearXNG's Redis client talks to it
      # unmodified. db 7 keeps it clear of quarry-edge's db 6. Password matches
      # the dragonfly service's --requirepass.
      SEARXNG_REDIS_URL: redis://:${INGESTION_DRAGONFLY_PASSWORD:?INGESTION_DRAGONFLY_PASSWORD is required}@dragonfly:6379/7
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET must be set (no change-me default)}
    volumes:
      # Bundled settings enable the JSON output format SmartRouter requires.
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
    depends_on:
      dragonfly:
        condition: service_healthy
    expose:
      - "8080"
    ports:
      - "${INGESTION_BIND_ADDRESS:-127.0.0.1}:18888:8080"
    networks:
      - ingestion-net
      - inter-plane-bus
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

configs:
  # The upstream Sonic image is intentionally shell-less. Compose renders this
  # runtime config without persisting a populated secret file in the worktree.
  autocomplete-sonic-config:
    content: |
      [server]
      log_level = "error"

      [channel]
      inet = "0.0.0.0:1491"
      tcp_timeout = 300
      auth_password = "${SONIC_PASSWORD:?SONIC_PASSWORD is required}"

      [channel.search]
      query_limit_default = 10
      query_limit_maximum = 100
      query_alternates_try = 4
      suggest_limit_default = 5
      suggest_limit_maximum = 20

      [store]

      [store.kv]
      path = "/var/lib/sonic/store/kv/"
      retain_word_objects = 1000

      [store.kv.pool]
      inactive_after = 1800

      [store.kv.database]
      flush_after = 900
      compress = true
      parallelism = 2
      max_files = 100
      max_compactions = 1
      max_flushes = 1
      write_buffer = 16384
      write_ahead_log = true

      [store.fst]
      path = "/var/lib/sonic/store/fst/"

      [store.fst.pool]
      inactive_after = 300

      [store.fst.graph]
      consolidate_after = 180
      max_size = 2048
      max_words = 250000

volumes:
  # Isolated Codex-managed ChatGPT login state for enabled subscription broker
  # connections. Back this with encrypted persistent storage in production.
  integration-codex-subscription-home:
    driver: local
  ingestion-postgres-data:
    driver: local
  # G50 (verevon-gap.md §8.33): dedicated volume for the Temporal-only
  # Postgres instance. Separating data files from `ingestion-postgres-data`
  # makes backup / restore / blow-away operations on Temporal independent
  # of the rest of the Ingestion Plane state.
  ingestion-temporal-postgres-data:
    driver: local
  ingestion-dragonfly-data:
    driver: local
  ingestion-nats-data:
    driver: local
  ingestion-qdrant-data:
    driver: local
  autocomplete-sonic-data:
    driver: local
  autocomplete-core-data:
    driver: local
  connector-runtime-db-data:
    driver: local
  stirling-pdf-data:
    driver: local
  # quarry-edge's Tantivy corpus (SmartRouter tier 1). Rebuildable — it refills
  # from subsequent scrapes — so deleting it loses no source of truth, only the
  # zero-latency own-corpus tier until the corpus grows back.
  quarry-edge-index-data:
    driver: local

networks:
  # Privat nettverk for ingestion plane
  ingestion-net:
    name: ingestion-net
    driver: bridge

  # Postgres-only network shared with the Model Plane browser-broker (its grant
  # store is the dedicated browser_broker database on ingestion-postgres). Owned
  # here because this plane owns the server; Model Plane joins it as external, so
  # bring this stack (at least postgres) up before the broker.
  browser-broker-db:
    name: browser-broker-db
    driver: bridge

  # Felles nettverk for intern kommunikasjon på tvers av planes
  inter-plane-bus:
    driver: bridge
    name: inter-plane-bus
    external: true
    labels:
      com.docker.compose.network: "inter-plane-bus"
      com.docker.compose.project: "triodelab"
