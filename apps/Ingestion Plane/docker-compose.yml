    environment:
      SERVICE_NAME: integration-finspo-worker
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      DATABASE_URL: postgresql://ingestion_user:${INGESTION_PG_PASSWORD:-ingestion_secure_password_2026}@ingestion-postgres:5432/integration
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-super-secret-internal-api-key}
      INTERNAL_API_KEY_HEADER: ${INTERNAL_API_KEY_HEADER:-X-Internal-API-Key}
      INTEGRATION_CORE_URL: ${INTEGRATION_CORE_URL:-http://integration-api:3026}
      INTEGRATION_PUBLIC_BASE_URL: ${INTEGRATION_PUBLIC_BASE_URL:-http://localhost:3026}
      FINSPO_CORE_URL: ${FINSPO_CORE_URL:-http://finspo-api:3130}
      FINSPO_API_KEY: ${FINSPO_API_KEY:-${AUTH_CORE_INTERNAL_API_KEY:-${INTERNAL_API_KEY:-dev-super-secret-internal-api-key}}}
      FINSPO_API_KEY_HEADER: ${FINSPO_API_KEY_HEADER:-X-API-Key}
      # config.Load still initializes the shared vault even though this worker
      # never decrypts provider tokens.
      INTEGRATION_CREDENTIALS_ENCRYPTION_KEY: ${INTEGRATION_CREDENTIALS_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.20"
