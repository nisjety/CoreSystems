name: information-core

services:
  information-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: information-core
    restart: unless-stopped
    environment:
      PORT: "${PORT:-3190}"
      SERVICE_NAME: "${SERVICE_NAME:-information-core}"
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:-change-me}"
      INFORMATION_CORE_USER_AGENT: "${INFORMATION_CORE_USER_AGENT:-VelionInformationCore/1.0 (ops@velion.local)}"
    ports:
      - "${INFORMATION_CORE_HOST_PORT:-3190}:3190"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3190/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - inter-plane-bus

networks:
  inter-plane-bus:
    external: true
    name: inter-plane-bus
