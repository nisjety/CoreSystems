# CoreSystem Planner Runtime
#
# Run with:  docker-compose -f docker-compose.affine.yml up -d
#
# Published boundary:
#   affine-core    →  host:3180   container:3180
#
# The vendor AFFiNE runtime and its datastores remain internal in this compose.
# Use the first-party affine-core service as the external CoreSystem boundary.

services:
  application-postgres:
    image: postgres:16-alpine
    container_name: affine_core_application_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: affine
      POSTGRES_PASSWORD: affine_secret
      POSTGRES_DB: affine
    volumes:
      - application_postgres_data:/var/lib/postgresql/data
    networks:
      - affine_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U affine -d affine']
      interval: 5s
      timeout: 5s
      retries: 10

  affine-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: affine_core
    restart: unless-stopped
    environment:
      PORT: 3180
      SERVICE_NAME: affine-core
      DATABASE_URL: postgres://affine:affine_secret@application-postgres:5432/affine?sslmode=disable
      VELION_NATS_URL: ${VELION_NATS_URL}
      VELION_NATS_TOKEN: ${VELION_NATS_TOKEN}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      AFFINE_RUNTIME_URL: http://affine-runtime:3010
      AFFINE_ADMIN_EMAIL: ${AFFINE_ADMIN_EMAIL:-admin@yourapp.com}
      AFFINE_ADMIN_PASSWORD: ${AFFINE_ADMIN_PASSWORD:-changeme}
    depends_on:
      affine-runtime:
        condition: service_healthy
      application-postgres:
        condition: service_healthy
    ports:
      - '3180:3180'
    networks:
      - affine_net
      - velion-net

  # ── AFFiNE application runtime ────────────────────────────────────────────
  affine-runtime:
    image: ghcr.io/toeverything/affine:stable
    container_name: affine_runtime
    restart: unless-stopped
    depends_on:
      affine-runtime-postgres:
        condition: service_healthy
      affine-runtime-redis:
        condition: service_healthy
      affine_runtime_migration:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DEPLOYMENT_TYPE: selfhosted
      AFFINE_SERVER_HTTPS: 'false'

      # Database — postgres internal port is still 5432 inside the container
      DATABASE_URL: 'postgresql://affine:${POSTGRES_PASSWORD:-affine_secret}@affine-runtime-postgres:5432/affine'

      # Redis — internal port unchanged
      REDIS_SERVER_HOST: affine-runtime-redis
      AFFINE_INDEXER_ENABLED: 'false'

      # Mail (optional — needed for invite emails)
      # MAILER_HOST: smtp.yourprovider.com
      # MAILER_PORT: 587
      # MAILER_USER: noreply@yourapp.com
      # MAILER_PASSWORD: secret
      # MAILER_SENDER: '"Planner" <noreply@yourapp.com>'

    volumes:
      - affine_uploads:/root/.affine/storage
      - affine_config:/root/.affine/config
    networks:
      - affine_net
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3010/info').then((response) =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  affine_runtime_migration:
    image: ghcr.io/toeverything/affine:stable
    container_name: affine_runtime_migration_job
    command: ['sh', '-c', 'node ./scripts/self-host-predeploy.js']
    depends_on:
      affine-runtime-postgres:
        condition: service_healthy
      affine-runtime-redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DEPLOYMENT_TYPE: selfhosted
      AFFINE_SERVER_HTTPS: 'false'
      DATABASE_URL: 'postgresql://affine:${POSTGRES_PASSWORD:-affine_secret}@affine-runtime-postgres:5432/affine'
      REDIS_SERVER_HOST: affine-runtime-redis
      AFFINE_INDEXER_ENABLED: 'false'
    volumes:
      - affine_uploads:/root/.affine/storage
      - affine_config:/root/.affine/config
    networks:
      - affine_net

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  affine-runtime-postgres:
    image: pgvector/pgvector:pg16
    container_name: affine_runtime_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: affine
      POSTGRES_USER: affine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-affine_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - affine_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U affine -d affine']
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ───────────────────────────────────────────────────────────────────
  affine-runtime-redis:
    image: redis:7-alpine
    container_name: affine_runtime_redis
    restart: unless-stopped
    networks:
      - affine_net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  affine_uploads:
  affine_config:
  postgres_data:
  application_postgres_data:

networks:
  affine_net:
    driver: bridge
  velion-net:
    external: true
    name: velion-net
