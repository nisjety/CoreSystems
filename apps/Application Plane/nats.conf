# NATS Server Configuration — Application Plane
jetstream: true
http: "127.0.0.1:8222"
max_payload: 1MB
store_dir: /data/jetstream

# Distinct runtime, audit, and deployment-only principals. Audit can bind and
# acknowledge its fixed consumers but cannot create/update streams/consumers.
authorization {
  users: [
    {
      user: "application-conversation"
      password: $APPLICATION_CONVERSATION_NATS_PASSWORD
      permissions: {
        publish: [
          "velion.application.conversation.>",
          "$JS.API.CONSUMER.INFO.VELION_APPLICATION.conversation-core-ai-action-executor",
          "$JS.API.CONSUMER.INFO.VELION_MODEL.conversation-core-model-action-proposed",
          "$JS.API.CONSUMER.INFO.VELION_INGESTION.conversation-core-webhook-received",
          "$JS.ACK.VELION_APPLICATION.conversation-core-ai-action-executor.>",
          "$JS.ACK.VELION_MODEL.conversation-core-model-action-proposed.>",
          "$JS.ACK.VELION_INGESTION.conversation-core-webhook-received.>"
        ]
        subscribe: [
          "_INBOX.APPLICATION_CONVERSATION.>",
          "_VELION.APPLICATION.DELIVER.conversation.ai-action-reviewed conversation-core-ai-action-executor",
          "_VELION.APPLICATION.DELIVER.conversation.model-action-proposed conversation-core-model-action-proposed",
          "_VELION.APPLICATION.DELIVER.conversation.webhook-received conversation-core-webhook-received"
        ]
      }
    }
    {
      user: "application-social"
      password: $APPLICATION_SOCIAL_NATS_PASSWORD
      permissions: {
        publish: "velion.application.social.>"
        subscribe: "_INBOX.APPLICATION_SOCIAL.>"
      }
    }
    {
      user: "application-insight"
      password: $APPLICATION_INSIGHT_NATS_PASSWORD
      permissions: {
        publish: [
          "$JS.API.CONSUMER.INFO.VELION_APPLICATION.insight-core-metric-subscriber",
          "$JS.ACK.VELION_APPLICATION.insight-core-metric-subscriber.>"
        ]
        subscribe: [
          "_INBOX.APPLICATION_INSIGHT.>",
          "_VELION.APPLICATION.DELIVER.insight.metrics insight-core-metric-subscriber"
        ]
      }
    }
    {
      user: "application-leads"
      password: $APPLICATION_LEADS_NATS_PASSWORD
      permissions: {
        publish: "velion.audit.v2.application.leads-core.>"
        subscribe: "_INBOX.APPLICATION_LEADS.>"
      }
    }
    {
      user: "application-notification"
      password: $APPLICATION_NOTIFICATION_NATS_PASSWORD
      permissions: {
        publish: "velion.application.notification.>"
        subscribe: "_INBOX.APPLICATION_NOTIFICATION.>"
      }
    }
    {
      user: "audit-core-application"
      password: $AUDIT_APPLICATION_NATS_PASSWORD
      permissions: {
        publish: [
          "$JS.API.CONSUMER.INFO.VELION_CONTROL_OBSERVABILITY.audit-core-application-v3-audit",
          "$JS.API.CONSUMER.INFO.VELION_CONTROL_OBSERVABILITY.audit-core-application-v3-usage",
          "$JS.ACK.VELION_CONTROL_OBSERVABILITY.audit-core-application-v3-audit.>",
          "$JS.ACK.VELION_CONTROL_OBSERVABILITY.audit-core-application-v3-usage.>",
          "velion.dlq.audit-core.audit",
          "velion.dlq.audit-core.usage"
        ]
        subscribe: [
          "_INBOX.AUDIT_APPLICATION.>",
          "_VELION.AUDIT.DELIVER.application.audit-v2 audit-core-application-v3-audit",
          "_VELION.AUDIT.DELIVER.application.usage-v2 audit-core-application-v3-usage"
        ]
      }
    }
    {
      user: "observability-provisioner-application"
      password: $APPLICATION_NATS_PROVISIONER_PASSWORD
      permissions: {
        publish: ["$JS.API.STREAM.>", "$JS.API.CONSUMER.>"]
        subscribe: "_INBOX.PROVISIONER_APPLICATION.>"
      }
    }
  ]
}
logtime: true
