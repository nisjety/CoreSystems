# NATS Server Configuration — Application Plane
jetstream: true
http: "127.0.0.1:8222"
max_payload: 1MB
store_dir: /data/jetstream

# Distinct runtime, audit, and deployment-only principals. Audit can bind and
# acknowledge its fixed consumers but cannot create/update streams/consumers.
authorization {
  users: [
    {
      user: "application-conversation"
      password: $APPLICATION_CONVERSATION_NATS_PASSWORD
      permissions: {
        publish: [
          "verevon.application.conversation.>",
          "$JS.API.CONSUMER.INFO.VEREVON_APPLICATION.conversation-core-ai-action-executor",
          "$JS.API.CONSUMER.INFO.VEREVON_MODEL.conversation-core-model-action-proposed",
          "$JS.API.CONSUMER.INFO.VEREVON_INGESTION.conversation-core-webhook-received",
          "$JS.ACK.VEREVON_APPLICATION.conversation-core-ai-action-executor.>",
          "$JS.ACK.VEREVON_MODEL.conversation-core-model-action-proposed.>",
          "$JS.ACK.VEREVON_INGESTION.conversation-core-webhook-received.>"
        ]
        subscribe: [
          "_INBOX.APPLICATION_CONVERSATION.>",
          "_VEREVON.APPLICATION.DELIVER.conversation.ai-action-reviewed conversation-core-ai-action-executor",
          "_VEREVON.APPLICATION.DELIVER.conversation.model-action-proposed conversation-core-model-action-proposed",
          "_VEREVON.APPLICATION.DELIVER.conversation.webhook-received conversation-core-webhook-received"
        ]
      }
    }
    {
      user: "application-social"
      password: $APPLICATION_SOCIAL_NATS_PASSWORD
      permissions: {
        publish: "verevon.application.social.>"
        subscribe: "_INBOX.APPLICATION_SOCIAL.>"
      }
    }
    {
      user: "application-insight"
      password: $APPLICATION_INSIGHT_NATS_PASSWORD
      permissions: {
        publish: [
          "$JS.API.CONSUMER.INFO.VEREVON_APPLICATION.insight-core-metric-subscriber",
          "$JS.ACK.VEREVON_APPLICATION.insight-core-metric-subscriber.>"
        ]
        subscribe: [
          "_INBOX.APPLICATION_INSIGHT.>",
          "_VEREVON.APPLICATION.DELIVER.insight.metrics insight-core-metric-subscriber"
        ]
      }
    }
    {
      user: "application-leads"
      password: $APPLICATION_LEADS_NATS_PASSWORD
      permissions: {
        publish: "verevon.audit.v2.application.leads-core.>"
        subscribe: "_INBOX.APPLICATION_LEADS.>"
      }
    }
    {
      user: "application-notification"
      password: $APPLICATION_NOTIFICATION_NATS_PASSWORD
      permissions: {
        publish: [
          "verevon.application.notification.>",
          "$JS.API.CONSUMER.INFO.VEREVON_APPLICATION.notification-core-conversation-followed-message",
          "$JS.ACK.VEREVON_APPLICATION.notification-core-conversation-followed-message.>"
        ]
        subscribe: [
          "_INBOX.APPLICATION_NOTIFICATION.>",
          "_VEREVON.APPLICATION.DELIVER.notification.conversation-followed-message notification-core-conversation-followed-message"
        ]
      }
    }
    {
      user: "audit-core-application"
      password: $AUDIT_APPLICATION_NATS_PASSWORD
      permissions: {
        publish: [
          "$JS.API.CONSUMER.INFO.VEREVON_CONTROL_OBSERVABILITY.audit-core-application-v3-audit",
          "$JS.API.CONSUMER.INFO.VEREVON_CONTROL_OBSERVABILITY.audit-core-application-v3-usage",
          "$JS.ACK.VEREVON_CONTROL_OBSERVABILITY.audit-core-application-v3-audit.>",
          "$JS.ACK.VEREVON_CONTROL_OBSERVABILITY.audit-core-application-v3-usage.>",
          "verevon.dlq.audit-core.audit",
          "verevon.dlq.audit-core.usage"
        ]
        subscribe: [
          "_INBOX.AUDIT_APPLICATION.>",
          "_VEREVON.AUDIT.DELIVER.application.audit-v2 audit-core-application-v3-audit",
          "_VEREVON.AUDIT.DELIVER.application.usage-v2 audit-core-application-v3-usage"
        ]
      }
    }
    {
      user: "observability-provisioner-application"
      password: $APPLICATION_NATS_PROVISIONER_PASSWORD
      permissions: {
        publish: ["$JS.API.STREAM.>", "$JS.API.CONSUMER.>"]
        subscribe: "_INBOX.PROVISIONER_APPLICATION.>"
      }
    }
    {
      # Cross-plane Ingestion publisher: integration-corev2 (and other
      # verevon.ingestion.* producers) publish into the VEREVON_INGESTION stream on
      # this broker so Application-Plane consumers (conversation-core webhook, etc.)
      # receive them. Fire-and-forget core publish, so no reply inbox is required.
      user: "ingestion-integration-publisher"
      password: $APPLICATION_INGESTION_PUBLISHER_NATS_PASSWORD
      permissions: {
        publish: "verevon.ingestion.>"
        subscribe: "_INBOX.INGESTION_PUBLISHER.>"
      }
    }
  ]
}
logtime: true
