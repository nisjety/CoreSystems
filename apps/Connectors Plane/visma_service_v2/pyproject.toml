[project]
name = "vsv2-tooling"
version = "0.1.0"
description = "Python tooling for visma_service_v2 — Phase 0 discovery, normalizers, BigQuery loaders, Dataform glue."
requires-python = ">=3.11"
authors = [{ name = "Aquatiq Integrasjonen" }]
dependencies = [
    "httpx>=0.27",
    "graphql-core>=3.2",
    "google-cloud-bigquery>=3.25",
    "pydantic>=2.7",
    "rich>=13.7",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
]

[project.scripts]
vsv2-discover       = "vsv2_tooling.discovery.cli:app"
vsv2-normalize      = "vsv2_tooling.normalizers.cli:app"
vsv2-bq-stage       = "vsv2_tooling.bigquery.cli:stage_app"
vsv2-bq-merge       = "vsv2_tooling.bigquery.cli:merge_app"
vsv2-bq-shadow      = "vsv2_tooling.bigquery.cli:shadow_app"
vsv2-bq-quarantine  = "vsv2_tooling.bigquery.cli:quarantine_app"
vsv2-bq-reconcile   = "vsv2_tooling.bigquery.cli:reconcile_app"
vsv2-bq-open-keys   = "vsv2_tooling.bigquery.open_keys:app"
vsv2-shadow-diff    = "vsv2_tooling.bigquery.shadow_diff:cli"
vsv2-validate-config = "vsv2_tooling.config_validate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tooling/src/vsv2_tooling"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["tooling/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The Dataform tools carry SQL and generated-file text in strings; wrapping those hides the SQL.
"dataform/tools/*.py" = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
mypy_path = "tooling/src"

[tool.pytest.ini_options]
testpaths = ["tooling/tests", "tests/python", "scripts", "dataform/tools"]
pythonpath = ["tooling/src"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast in-process tests",
    "integration: hit real services (Postgres, Redis, BigQuery)",
    "live: hit real Visma APIs (gated behind VSV2_LIVE=1)",
]
