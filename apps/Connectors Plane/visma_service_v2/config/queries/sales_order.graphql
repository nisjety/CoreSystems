query SalesOrders(
  $lastId: String,
  $updatedInDataMart: DateTime,
  $pageSize: Int! = 5000,
  $includeDeleted: Boolean! = false
) {
  salesOrders(
    lastId: $lastId,
    updatedInDataMart: $updatedInDataMart,
    pageSize: $pageSize,
    includeDeleted: $includeDeleted
  ) {
    id
    companyId
    updatedInDataMartDateTime
    orderNbr
    orderType
    projectId
    printDescriptionOnInvoice
    printNoteOnExternalDocuments
    printNoteOnInternalDocuments
    customerId
    soBillingContactId
    templateStatus
    soBillingAddressOverrideAddress
    soBillingAddressId
    soBillingAddressLine1
    soBillingAddressLine2
    soBillingAddressLine3
    soBillingAddressPostalCode
    soBillingAddressCity
    soBillingAddressCountryId
    soBillingAddressCountyId
    branchId
    customerVatZoneId
    invoiceSeparately
    invoiceNbr
    invoiceDate
    creditTermsId
    dueDate
    cashDiscountDate
    postPeriod
    salesPersonId
    ownerId
    origOrderType
    origOrderNbr
    soShippingContactId
    soShippingContactName
    soShippingAddressOverrideAddress
    soShippingAddressId
    soShippingAddressLine1
    soShippingAddressLine2
    soShippingAddressLine3
    soShippingAddressPostalCode
    soShippingAddressCity
    soShippingAddressCountryId
    soShippingAddressCountyId
    scheduledShipmentDate
    shipSeparately
    shipComplete
    cancelBy
    canceled
    preferredWarehouseId
    shipViaCarrierId
    fobPointId
    fobPointDescription
    priority
    shippingTermsId
    shippingTermsDescription
    shippingZoneId
    shippingZoneDescription
    residentialDelivery
    saturdayDelivery
    insurance
    transactionTypeId
    transactionTypeDescription
    status
    hold
    date
    requestOn
    customerOrder
    customerRefNbr
    contactId
    locationId
    currency
    description
    orderTotal
    vatTaxableTotal
    vatExemptTotal
    taxTotal
    note
    lastModifiedDateTime
    exchangeRate
    orderTotalInBaseCurrency
    locationCountryId
    orderQty
    deletedDatabaseRecord
    createdInDataMartDateTime
  }
}
