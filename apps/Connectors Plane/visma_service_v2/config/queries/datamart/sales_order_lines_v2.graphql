    orderQty
    quantity
    shippedQty
    qtyOnShipments
    curyUnitPrice
    unitPriceInBaseCurrency
    unitPrice
    unitCost
    curyUnitCost
    taxCategoryId
    subaccountId
    alternateId
    tranDesc
    lineDescription
    manualDisc
    manualDiscount
    discPct
    discountPercent
    discAmt
    discountAmount
    taskId
    reasonCode
    salesPersonId
    commissionable
    invtMult
    shipComplete
    completeQtyMin
    undershipThreshold
    completeQtyMax
    overshipThreshold
    openQty
    curyLineAmt
    lineAmt
    completed
    curyUnbilledAmt
    shipDate
    shipOn
    requestDate
    requestOn
    discountId
    discountCode
    invoiceNbr
    isFree
    freeItem
    poCreate
    markForPO
