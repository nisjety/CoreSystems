query BudgetById(
  $id: String!
) {
  budgetById(
    id: $id
  ) {
    id
    companyId
    updatedInDataMartDateTime
    branchId
    groupId
    parentGroupId
    ledgerId
    financialYear
    released
    releasedAmount
    accountId
    subaccountId
    description
    amount
    distributedAmount
    lastModifiedDateTime
    deletedDatabaseRecord
    createdInDataMartDateTime
    periods {
      periodId
      amount
    }
  }
}
