query GeneralLedgerBalancesByPeriodV2(
  $finPeriodId: String!,
  $accountId: Int,
  $subaccountId: Int,
  $lastGroupKey: String,
  $updatedInDataMart: DateTime,
  $updatedInDataMartTo: DateTime,
  $pageSize: Int! = 1000,
  $toggleBalanceSign: Boolean! = false,
  $includeDeleted: Boolean! = false
) {
  generalLedgerBalancesByPeriodV2(
    finPeriodId: $finPeriodId,
    accountId: $accountId,
    subaccountId: $subaccountId,
    lastGroupKey: $lastGroupKey,
    updatedInDataMart: $updatedInDataMart,
    updatedInDataMartTo: $updatedInDataMartTo,
    pageSize: $pageSize,
    toggleBalanceSign: $toggleBalanceSign,
    includeDeleted: $includeDeleted
  ) {
    lastGroupKey
    hasMore
    items {
      id
      companyId
      updatedInDataMartDateTime
      deletedDatabaseRecord
      branchId
    }
  }
}
