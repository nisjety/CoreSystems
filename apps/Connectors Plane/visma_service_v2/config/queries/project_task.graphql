# Hand-kept copy of config/queries/datamart/project_tasks.graphql.
# includeDeleted defaults to true: the paginator never sends the variable, and the
# generated default (false) would hide deletions from bronze. Deleted rows arrive
# with deletedDatabaseRecord = true (same convention as general_ledger_balance.graphql).
query ProjectTasks(
  $lastId: String,
  $updatedInDataMart: DateTime,
  $updatedInDataMartTo: DateTime,
  $pageSize: Int! = 5000,
  $includeDeleted: Boolean! = true
) {
  projectTasks(
    lastId: $lastId,
    updatedInDataMart: $updatedInDataMart,
    updatedInDataMartTo: $updatedInDataMartTo,
    pageSize: $pageSize,
    includeDeleted: $includeDeleted
  ) {
    id
    companyId
    updatedInDataMartDateTime
    taskId
    taskCd
    description
    status
    plannedStartDate
    plannedEndDate
    startDate
    endDate
    projectId
    branchId
    rateTableId
    rateTableDescription
    lastModifiedDateTime
    deletedDatabaseRecord
    createdInDataMartDateTime
  }
}
