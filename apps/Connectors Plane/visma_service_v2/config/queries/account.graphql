query Accounts(
  $pageSize: Int!,
  $lastId: String,
  $updatedInDataMart: DateTime
) {
  accounts(
    pageSize: $pageSize
    lastId: $lastId
    updatedInDataMart: $updatedInDataMart
  ) {
    id
    companyId
    createdInDataMartDateTime
    accountCD: accountCd
    accountId
    accountClassId
    description
    type
    active
    curyId
    taxCategoryId
    useDefaultSubaccount
    isCashAccount
    controlAccountModule
    publicCode1
    groupCd
    externalCode1
    externalCode2
    analysisCode
    updatedInDataMartDateTime
  }
}
