# Verevon CoreSystem — gitleaks configuration
# Purpose (Phase 3 PR-0a): prevent NEW secrets from being committed/pushed.
# Scope decision: we do NOT scrub history or fail on the pre-existing tracked
# findings (those are rotated at push time, per the maintainer). The CI gate
# (.github/workflows/secret-scan.yml) scans only the commits in a push/PR, so
# this config governs what counts as a finding in NEW changes.
#
# IMPORTANT — schema note (found 2026-09-12): CI's secret-scan workflow pins
# gitleaks 8.24.3 via `gitleaks-action@v3`. That version's config schema
# supports only a SINGULAR top-level `[allowlist]` table (see its
# `config/config.go`: `ViperConfig.Allowlist` is a single struct, not a
# slice) — the newer `[[allowlists]]` array-of-tables syntax this file
# previously used is a schema Viper simply doesn't bind to anything on that
# version, so every entry was silently a no-op in CI (confirmed by
# reproducing CI's exact `gitleaks detect` invocation locally, pinned to
# v8.24.3, against the merged config below vs. the old array form — the old
# form left the "XSalsa20-Poly1305" generic-api-key false positive
# unsuppressed; this merged singular table suppresses it). A singular
# `[allowlist]` also has no per-rule `targetRules` scoping in this version
# (that field doesn't exist on the `Allowlist` struct either), so every
# regex below applies globally rather than only to the rule it was
# originally written for — each one is already narrow/specific enough
# (an exact Go module checksum shape, an exact cryptographic algorithm
# name list, etc.) that this is a negligible widening in practice.

title = "Verevon CoreSystem secret-scan"

[extend]
# Start from gitleaks' built-in rule set (AWS, Azure, GCP, generic-api-key,
# JWTs, private keys, curl auth headers, etc.), then layer the allowlist below.
useDefault = true

[allowlist]
description = "Build artifacts, lockfiles, vendored code, placeholders, and known false-positive shapes"

# Paths that never contain real secrets we control (regex, matched against path).
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)target/''',
  '''(^|/)dist/''',
  '''(^|/)build/''',
  '''(^|/)\.next/''',
  '''(^|/)\.turbo/''',
  '''(^|/)\.git/''',
  '''(^|/)vendor/''',
  '''(^|/)testdata/''',
  # The frozen snapshot of the retrieval-evaluation corpus (apps/Data Plane v2/scripts/eval-corpus/repo/): byte-for-byte
  # copies, cut from git history, of markdown documents that are ALREADY tracked here, pinned file by file by sha256
  # (scripts/eval-corpus-manifest.json) and re-verified by scripts/eval-ingest-corpus.py verify. Their placeholder
  # credentials (dev-test-key, dev-jwt-secret, ...) are the ones the originals carry; copying a document into a new
  # path must not turn an accepted finding into a new one. The synthetic documents next to it are NOT allowlisted.
  '''(^|/)scripts/eval-corpus/repo/''',
  # The generated interactive-demo bundle (stage 04). scripts/build-product-demo.mjs scans it
  # (forbidden names, hosts, e-mail addresses, secret shapes) and checks it against its manifest.
  '''(^|/)verevon-web/public/product-demo/''',
  '''Cargo\.lock$''',
  '''go\.sum$''',
  '''go\.work\.sum$''',
  '''pnpm-lock\.yaml$''',
  '''package-lock\.json$''',
  '''yarn\.lock$''',
  # Committed worktree scratch (2026-11-08 sweep): .plan-work verify/buf-lint/
  # build outputs and patch batches carry synthetic IDs that trip generic-api-key.
  '''(^|/)\.plan-work/''',
  # Byte-copy of the Ingestion Plane tree nested under Frontend Plane (sweep).
  '''Frontend Plane/Ingestion Plane/''',
  # Compiled audit helper binary committed in the same sweep.
  '''audit-verify\.exe$''',
]

# Matched against the detected secret string (gitleaks 8.24.3's default
# RegexTarget when unset). Kept deliberately narrow so a real key that
# merely *contains* one of these words is still caught only if it is
# dominated by it.
regexes = [
  # Public Web Push test values (WS16-S6), matched exactly: the auth secret of the RFC 8291 Appendix A
  # test vector (notification-core webpush/encryption_test.go), and a VAPID PUBLIC key the SPA's
  # push-subscription test hands to subscribe(). Neither is a credential; a different value still flags.
  '''^BTBZMqHH6r4Tts7J_aSIgg$''',
  '''^BP4z9KsN6nGRTbVYI_c7VJSPQTBtkgcy27mlmlMoZIIgDll6e3vCYLocInmYWAmS6TlzAC8wEqKK6PBru3jl7A8$''',
  # Fake service-token placeholders in gateway test fixtures
  # ("billing-test-secret-at-least-32-bytes" and siblings), not real credentials.
  '''.*-test-secret-at-least-32-bytes$''',
  '''(?i)\b(your[-_ ]?(api[-_ ]?)?(key|token|secret|password)|change[-_ ]?me|placeholder|replace[-_ ]?me|example[-_ ]?(key|token|secret)?|dummy|sample|redacted|todo|tbd|<[a-z0-9_ -]+>|\$\{[^}]+\}|xxxxx+|token[-_ ]?here|secret[-_ ]?here)\b''',
  # Test-only fixtures & env-var NAME references (not secret values), all in
  # *_test.go: NATS auth table tests reference the env-var identifier they read
  # (SCREAMING_SNAKE, never a real value); unit tests use placeholder creds.
  '''\b[A-Z][A-Z0-9]*(_[A-Z0-9]+)*_(PASSWORD|SECRET|TOKEN|KEY)\b''',
  '''\bscoped-(password|token|secret|key)\b''',
  '''\b(secret-value|legacy-token)\b''',
  '''secret\\r\\ninjected''',
  # Canonical Go module checksum shape (`go.sum`-style `h1:` line) that can
  # appear in staged patch input the pre-commit hook scans via stdin, where
  # no source path is attached for the lockfile path-allowlist above to
  # match against. Exact shape only; arbitrary base64 values still flag.
  '''^api v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.+-]+)?(?:/go\.mod)? h1:[A-Za-z0-9+/]{43}=$''',
  # Public cryptographic primitive/cipher names, not secrets.
  # generic-api-key's entropy heuristic fires when one of these sits near
  # the word "key" (e.g. "X25519 sealed-box key exchange, XSalsa20-Poly1305
  # secretbox") — confirmed in apps/Endpoint Plane's docs, describing the
  # same NaCl/libsodium primitives apps/Frontend Plane/verevonv3/packages/
  # remote-core already documents elsewhere without incident. A real key
  # merely resembling one of these names is unaffected — these are exact
  # algorithm names, not a pattern a real credential would coincidentally
  # equal.
  '''(XSalsa20-Poly1305|ChaCha20-Poly1305|XChaCha20-Poly1305|Curve25519|Ed25519|X25519)''',
  # Documented local-development placeholders in the Ingestion Plane docs and their Data Plane eval-corpus copies
  # (added 2026-10-30), and a minified expression in the verevon-web product-demo bundle. Exact strings only.
  '''^dev-test-key-12345$''',
  '''^dev-token$''',
  '''^t=r\.latencyMs$''',
  # The idempotency key of the authored run-trace envelope golden (WS10.S2) and its three vendored copies: a
  # synthetic ULID under the key name idempotency_key, which generic-api-key reads as a key. Matched exactly.
  '''^01JC7K3M9Q4R8T2V5W6X7Y8Z9A$''',
  # Synthetic test fixtures (added 2026-10-08). The pre-commit hook scans diff text on stdin, which carries no file path,
  # so the path allowlist above cannot apply to it. Each entry below is therefore a narrow content match that was
  # checked against the exact strings gitleaks extracted from the real fixtures; none can match a working credential.
  # A JWT-shaped string whose signature segment is 10-42 characters long is not a valid token: the shortest JWS
  # signature (HS256) is 43 characters. The golden wire-shape files (inference-service-tokens.golden.json and its
  # vendored copies in Data Plane) carry 21-byte stand-in signatures.
  '''^eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,42}$''',
  # Usage-envelope fixtures (usage-ledger-rs, data-orchestrator-go): envelopes signed with throwaway keys made when the
  # fixture is generated (the private halves are never written down); each token lives two minutes. The exact header
  # of each of the three producers' envelope signers.
  '''^(?:eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIsImtpZCI6ImVtYmVkZGluZy1ldmVudHMtdjEifQ|eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIsImtpZCI6ImdyYXBoLWV2ZW50cy12MSJ9|eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIsImtpZCI6InJldHJpZXZhbC1ldmVudHMtdjEifQ)\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_\\/-]+$''',
  # Exact synthetic hex test constants: a 16-digit test sequence repeated twice (0123456789abcdef, fedcba9876543210 or
  # abcdef0123456789).
  '''^(?:0123456789abcdef|fedcba9876543210|abcdef0123456789){2}$''',
  # The exact test constant of the embedding-engine unit tests and the exact document id of the eval golden set.
  '''^test-key-0123456789$''',
  '''^edf42420-3863-49fb-8629-8d0e541a3b31$''',
  # The wire vector of user-core's own-scheduled-thread-read decision (own_scheduled_thread_read_wire_test.go): a v2 token
  # signed with a seed that the test documents as public (never a deployment key). Its first segment is the key id
  # control-wire-vector-key, which no deployment trusts.
  '''^v2\.Y29udHJvbC13aXJlLXZlY3Rvci1rZXk\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$''',
  # The exact replacement-token constant of org-core's service_auth_test.go.
  '''^replace-with-generated-secret-at-least-32-bytes$''',
  # Identifiers from the Coresystem-verevon merge (added 2026-10-30), each checked against the exact string gitleaks
  # extracted: the Visma journal-transaction API name in vsv2-mcp's api_reference.json, the ledger=BUDGET query value in
  # vsv2-orchestrator's executor and validation tests, anbud-core's role test database name, and a minified expression in
  # the verevon-web product-demo bundle.
  '''^journaltx_v1$''',
  '''^ledger=BUDGET$''',
  '''^anbud_test_[a-z0-9]{8}$''',
  '''^t=r\.latencyMs$''',
]
