# Verevon CoreSystem — gitleaks configuration
# Purpose (Phase 3 PR-0a): prevent NEW secrets from being committed/pushed.
# Scope decision: we do NOT scrub history or fail on the pre-existing tracked
# findings (those are rotated at push time, per the maintainer). The CI gate
# (.github/workflows/secret-scan.yml) scans only the commits in a push/PR, so
# this config governs what counts as a finding in NEW changes.

title = "Verevon CoreSystem secret-scan"

[extend]
# Start from gitleaks' built-in rule set (AWS, Azure, GCP, generic-api-key,
# JWTs, private keys, curl auth headers, etc.), then layer the allowlist below.
useDefault = true

[[allowlists]]
description = "Build artifacts, lockfiles, vendored code, and obvious placeholders"

# Paths that never contain real secrets we control (regex, matched against path).
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)target/''',
  '''(^|/)dist/''',
  '''(^|/)build/''',
  '''(^|/)\.next/''',
  '''(^|/)\.turbo/''',
  '''(^|/)\.git/''',
  '''(^|/)vendor/''',
  '''(^|/)testdata/''',
  '''Cargo\.lock$''',
  '''go\.sum$''',
  '''pnpm-lock\.yaml$''',
  '''package-lock\.json$''',
  '''yarn\.lock$''',
]

# Placeholder / template / fixture values are not secrets. Matched against the
# detected secret string. Kept deliberately narrow so a real key that merely
# *contains* one of these words is still caught only if it is dominated by it.
regexes = [
  '''(?i)\b(your[-_ ]?(api[-_ ]?)?(key|token|secret|password)|change[-_ ]?me|placeholder|replace[-_ ]?me|example[-_ ]?(key|token|secret)?|dummy|sample|redacted|todo|tbd|<[a-z0-9_ -]+>|\$\{[^}]+\}|xxxxx+|token[-_ ]?here|secret[-_ ]?here)\b''',
  # Test-only fixtures & env-var NAME references (not secret values), all in
  # *_test.go: NATS auth table tests reference the env-var identifier they read
  # (SCREAMING_SNAKE, never a real value); unit tests use placeholder creds.
  '''\b[A-Z][A-Z0-9]*(_[A-Z0-9]+)*_(PASSWORD|SECRET|TOKEN|KEY)\b''',
  '''\bscoped-(password|token|secret|key)\b''',
  '''\b(secret-value|legacy-token)\b''',
  '''secret\\r\\ninjected''',
]

# `pre-commit` scans the staged patch through stdin so gitleaks cannot attach a
# source path and the go.sum path allowlist above cannot apply. Limit this
# exception to the generic-key rule and the exact canonical Go checksum line
# shape; arbitrary base64 values remain findings.
[[allowlists]]
description = "Canonical Go module checksums in staged patch input"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = [
  '''^api v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.+-]+)?(?:/go\.mod)? h1:[A-Za-z0-9+/]{43}=$''',
]

[[allowlists]]
# Public cryptographic primitive/cipher names, not secrets. generic-api-key's
# entropy heuristic occasionally fires when one of these sits near the word
# "key" (e.g. "X25519 sealed-box key exchange, XSalsa20-Poly1305 secretbox") —
# confirmed 2026-09-11 in apps/Endpoint Plane's docs, describing the same
# NaCl/libsodium primitives apps/Frontend Plane/verevonv3/packages/remote-core
# already documents elsewhere without incident. Matched on the exact secret
# string gitleaks reports, not the path, so a real key merely resembling one
# of these names is unaffected.
description = "Public cryptographic algorithm/cipher names"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = [
  '''^(XSalsa20-Poly1305|ChaCha20-Poly1305|XChaCha20-Poly1305|Curve25519|Ed25519|X25519)$''',
]
