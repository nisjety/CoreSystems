# =============================================================================
# triodelab-nats — Shared cross-plane NATS for the Aqencia project
#
# Lives in frontend/docker-compose.yml on triodelab-net.
# All planes connect here for cross-plane events ONLY.
# Internal (intra-plane) events stay on the plane's own NATS.
#
# Subject convention:
#   aqencia.<plane>.<entity>.<verb>
#
#   aqencia.auth.user.signed_in
#   aqencia.auth.org.created
#   aqencia.ingestion.document.crawled
#   aqencia.ingestion.m365.connected
#   aqencia.data.document.indexed
#   aqencia.data.collection.ready
#   aqencia.reasoning.insight.generated
# =============================================================================

# Listening port
port: 4222

# HTTP monitoring
http_port: 8222

# Max message payload (cross-plane events should be small — metadata only, not document content)
max_payload: 1MB

# Simple token-based auth shared by all planes
authorization {
  token: "aqencia-shared-nats-token-2026"
}

# JetStream — persistent streams for reliable cross-plane delivery
jetstream {
  store_dir: /data
  max_mem_store: 256MB
  max_file_store: 2GB
}
