version: v2
managed:
  enabled: true
plugins:
  # Go-only regeneration (protoc-gen-go + grpc). Used to refresh go/gen without
  # churning the Rust (tonic_build/OUT_DIR), Python, or TS outputs that the full
  # buf.gen.yaml would also rewrite.
  - remote: buf.build/protocolbuffers/go
    out: ../go/gen
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go
    out: ../go/gen
    opt:
      - paths=source_relative
