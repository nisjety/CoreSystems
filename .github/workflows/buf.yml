# Physical Service Split - CI/CD Configuration
name: Buf Proto CI
on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/Model Plane/proto/**'
      - '.github/workflows/buf.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/Model Plane/proto/**'
      - '.github/workflows/buf.yml'
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-setup-action@v1
      # The module has ~1.5k pre-existing lint findings (service/message
      # comments, naming), so lint reports but does not gate. `buf breaking`
      # is the gate: it compares against a real image (baseline.binpb, built
      # from main on 2026-10-16; before that the file was 0 bytes and the
      # unquoted path below made both steps fail on argument parsing).
      - name: buf lint (report only)
        continue-on-error: true
        run: buf lint "apps/Model Plane/proto"
      - name: buf breaking
        run: buf breaking "apps/Model Plane/proto" --against "apps/Model Plane/proto/baseline.binpb"
