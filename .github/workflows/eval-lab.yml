name: Eval Lab (Python) CI

# The eval harness at apps/Model Plane/python/eval-lab-py had no CI of any kind:
# there were no Python workflows in this repository at all. So the regression
# suite that exists to catch quality drift could itself drift, and nothing would
# say so.
#
# This job runs ONLY the credential-free half. `make selftest` (see the
# harness's Makefile) covers case-schema validation and the metric runners
# against fixtures; the 12 live tests self-skip unless `EVAL_LIVE=1` plus a
# reachable model-gateway and INTERNAL_API_KEY are present, so no provider
# credential, no compose fleet and no network egress are needed here. Total
# runtime is well under a second.
#
# The prompt and tool-schema stage (EP-14 S8) is credential-free as well: the manifest
# golden compares the prompt and tool source text of model-gateway and execution-core with a
# pinned fixture, and the scenario-touch gate requires an eval case or replay cassette in the
# same pull request when that manifest changes. The gate compares against the base branch,
# so it runs on pull requests only.
#
# Deliberately NOT run in CI: the live eval path (`make eval`). It drives real
# provider inference through the compose fleet and writes a dated report to
# docs/eval-reports/. That belongs on a schedule against a deployed
# environment, not on every push, because it costs money and its result depends
# on provider availability rather than on the diff.

on:
  push:
    branches: [main, develop, fix/ui-premium-restore]
    paths:
      - 'apps/Model Plane/python/eval-lab-py/**'
      - '.github/workflows/eval-lab.yml'
      - 'scripts/gates/scenario-touch.py'
      - 'scripts/gates/tests/**'
      - 'scripts/gates/baselines/scenario-touch-exceptions.json'
      - 'apps/Model Plane/rust/crates/mp-contracts/tests/prompt_tool_manifest.rs'
      - 'apps/Model Plane/rust/crates/mp-contracts/tests/fixtures/prompt-tool-manifest.json*'
      - 'apps/Model Plane/rust/services/model-gateway/src/prompt_context.rs'
      - 'apps/Model Plane/rust/services/model-gateway/src/format_guidance.rs'
      - 'apps/Model Plane/rust/services/model-gateway/src/author_guidance.rs'
      - 'apps/Model Plane/rust/services/model-gateway/src/tool_loop.rs'
      - 'apps/Model Plane/rust/services/model-gateway/src/retrieval_tools.rs'
      - 'apps/Model Plane/rust/services/model-gateway/src/recall_conversations.rs'
      - 'apps/Model Plane/rust/services/execution-core/src/runtime_loop/agent.rs'
      - 'apps/Model Plane/rust/crates/mp-inference-replay/**'
  pull_request:
    branches: [main, develop, fix/ui-premium-restore]
    paths:
      - 'apps/Model Plane/python/eval-lab-py/**'
      - '.github/workflows/eval-lab.yml'
      - 'scripts/gates/scenario-touch.py'
      - 'scripts/gates/tests/**'
      - 'scripts/gates/baselines/scenario-touch-exceptions.json'
      - 'apps/Model Plane/rust/crates/mp-contracts/tests/prompt_tool_manifest.rs'
      - 'apps/Model Plane/rust/crates/mp-contracts/tests/fixtures/prompt-tool-manifest.json*'
      - 'apps/Model Plane/rust/services/model-gateway/src/prompt_context.rs'
      - 'apps/Model Plane/rust/services/model-gateway/src/format_guidance.rs'
      - 'apps/Model Plane/rust/services/model-gateway/src/author_guidance.rs'
      - 'apps/Model Plane/rust/services/model-gateway/src/tool_loop.rs'
      - 'apps/Model Plane/rust/services/model-gateway/src/retrieval_tools.rs'
      - 'apps/Model Plane/rust/services/model-gateway/src/recall_conversations.rs'
      - 'apps/Model Plane/rust/services/execution-core/src/runtime_loop/agent.rs'
      - 'apps/Model Plane/rust/crates/mp-inference-replay/**'

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'apps/Model Plane/python/eval-lab-py'
    steps:
      # Full history: the scenario-touch gate diffs the pull request against its base branch.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Plain pip on purpose. The harness previously declared `mp-events` via a
      # `[tool.uv.sources]` path entry, which pip cannot resolve — so any
      # non-uv install failed outright. Installing with pip here is what keeps
      # that class of breakage from coming back silently.
      - name: Install the harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # No EVAL_LIVE, so the live cases skip themselves. Asserting the
      # credential-free count rather than just "exit 0" — a suite that silently
      # skipped EVERYTHING would otherwise be indistinguishable from a passing
      # one, which is the exact failure this job exists to prevent.
      - name: Selftest (offline, no credentials)
        run: |
          python -m pytest tests/ -q --junit-xml=eval-selftest.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse('eval-selftest.xml').getroot()
          case = suite if suite.tag == 'testsuite' else suite.find('testsuite')
          total = int(case.get('tests', 0))
          skipped = int(case.get('skipped', 0))
          ran = total - skipped
          print(f'ran {ran} offline case(s) of {total} collected ({skipped} live cases skipped)')
          assert ran >= 10, f'expected the offline suite to actually run; only {ran} case(s) did'
          PY

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/Model Plane/rust -> target"

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"

      # The manifest golden reads the prompt and tool source text of model-gateway and
      # execution-core and builds only mp-contracts. A stale fixture or pin fails here, and
      # the failure names each changed item and the regeneration command.
      - name: Prompt and tool manifest (offline)
        working-directory: 'apps/Model Plane/rust'
        run: |
          cargo test -q -p mp-contracts --test prompt_tool_manifest

      # The replay fake and its shipped cassettes: each cassette is synthetic and not ZDR, and no
      # service links the fake at runtime.
      - name: Replay fake and cassettes (offline)
        working-directory: 'apps/Model Plane/rust'
        run: |
          cargo test -q -p mp-inference-replay

      - name: Scenario-touch gate self-test (offline)
        working-directory: '.'
        run: |
          python -m pytest scripts/gates/tests -q

      # A direct push to the integration branch has no base to compare with and is not gated
      # here; the pull request that carried the change was.
      - name: Scenario-touch gate (pull requests)
        if: github.event_name == 'pull_request'
        working-directory: '.'
        run: |
          python scripts/gates/scenario-touch.py --base "origin/${{ github.base_ref }}"

      - name: Upload the selftest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-selftest-report
          path: 'apps/Model Plane/python/eval-lab-py/eval-selftest.xml'
          if-no-files-found: warn
