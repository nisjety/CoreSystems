name: Model Plane Rust CI

# CI gate for the Model Plane Rust workspace (apps/Model Plane/rust — 15
# members: 10 mp-* crates, 4 services, 1 client). Before this file, NOTHING
# built or tested this workspace: the only `apps/Model Plane/**` triggers in
# the repo were buf.yml (proto/**) and eval-lab.yml (python/eval-lab-py/**),
# and the three cargo workflows (dataplane-v2-ci, quarry-v2-ci, verevonv3-ci)
# are each path-filtered to a different plane. Verified empirically: commits
# a9fc70ca and e7a0ed6e touched only apps/Model Plane/rust/** and triggered
# secret-scan alone.
#
# That gap hid three real defects at once, all invisible to a non-test build:
#   * model-gateway: two `impl RunService` test doubles missing
#     resolve_thread_owner (lib test target) — fixed in a9fc70ca.
#   * execution-core: an AgentSkill initializer missing migration 0031's
#     three ownership fields, E0063 (lib test target) — fixed in a9fc70ca.
#   * execution-core: owner_action_descriptor_cannot_preserve_auto_permission,
#     a security-posture test that never once ran because the E0063 above kept
#     its target from building — fixed in e7a0ed6e.
# `cargo check --workspace` stayed green through all three, which is exactly
# why this gate checks test TARGETS and RUNS the lib tests, not just the
# production build.
#
# proto/** is in the path filter because crates/mp-contracts/build.rs
# generates from ../../../proto — a proto-only change can break this build.

on:
  pull_request:
    paths:
      - "apps/Model Plane/rust/**"
      - "apps/Model Plane/proto/**"
      - "apps/Model Plane/api/contracts/**"
      # Copies the drift check pins: a vendored golden edited in another tree.
      - "apps/Control Plane/auth-core/src/auth/fixtures/**"
      - "apps/Control Plane/org-core/internal/http/testdata/**"
      - "apps/Control Plane/audit-core/internal/testdata/**"
      - "apps/Data Plane v2/services/retrieval-engine-rs/tests/fixtures/**"
      - "apps/Ingestion Plane/Quarry-v2/crates/quarry-edge/tests/fixtures/**"
      # durable_loop_contract reads these across the plane boundary (no attestation field, the
      # continue vocabulary lists), so a change there must run it.
      - "apps/Model Plane/go/gen/**"
      # WS10.S5: the NATS provisioner contract tests read the broker config and the topology.
      - "apps/Model Plane/go/services/nats-provisioner/**"
      - "apps/Model Plane/deploy/nats.conf"
      - "apps/Frontend Plane/verevonv3/apps/gateway/src/domains/orchestration.rs"
      - "apps/Frontend Plane/verevonv3/apps/gateway/src/upstream.rs"
      - "apps/Frontend Plane/verevonv3/apps/gateway/tests/continue_error_vocabulary.rs"
      - "apps/Frontend Plane/verevonv3/src/shared/actions/chat-run-continue-contract*"
      - "apps/Frontend Plane/verevonv3/src/shared/api/orchestration-client*"
      - "scripts/tests/zdr-contract-sync.test.sh"
      # WS06-S10: the production-profile sandbox verification reads these.
      - "apps/Model Plane/scripts/verify-sandbox-isolation.sh"
      - "apps/Model Plane/scripts/verify-sandbox-production-profile.sh"
      - "apps/Model Plane/deploy/seccomp-bwrap.json"
      - "apps/Model Plane/deploy/docker-compose.yml"
      - "apps/Model Plane/deploy/docker-compose.production.yml"
      - "apps/Model Plane/rust/services/execution-core/Dockerfile"
      - ".github/workflows/model-plane-rust-ci.yml"
  push:
    branches: [main, fix/ui-premium-restore]
    paths:
      - "apps/Model Plane/rust/**"
      - "apps/Model Plane/proto/**"
      - "apps/Model Plane/api/contracts/**"
      - "apps/Control Plane/auth-core/src/auth/fixtures/**"
      - "apps/Control Plane/org-core/internal/http/testdata/**"
      - "apps/Control Plane/audit-core/internal/testdata/**"
      - "apps/Data Plane v2/services/retrieval-engine-rs/tests/fixtures/**"
      - "apps/Ingestion Plane/Quarry-v2/crates/quarry-edge/tests/fixtures/**"
      # durable_loop_contract reads these across the plane boundary (no attestation field, the
      # continue vocabulary lists), so a change there must run it.
      - "apps/Model Plane/go/gen/**"
      # WS10.S5: the NATS provisioner contract tests read the broker config and the topology.
      - "apps/Model Plane/go/services/nats-provisioner/**"
      - "apps/Model Plane/deploy/nats.conf"
      - "apps/Frontend Plane/verevonv3/apps/gateway/src/domains/orchestration.rs"
      - "apps/Frontend Plane/verevonv3/apps/gateway/src/upstream.rs"
      - "apps/Frontend Plane/verevonv3/apps/gateway/tests/continue_error_vocabulary.rs"
      - "apps/Frontend Plane/verevonv3/src/shared/actions/chat-run-continue-contract*"
      - "apps/Frontend Plane/verevonv3/src/shared/api/orchestration-client*"
      - "scripts/tests/zdr-contract-sync.test.sh"
      # WS06-S10: the production-profile sandbox verification reads these.
      - "apps/Model Plane/scripts/verify-sandbox-isolation.sh"
      - "apps/Model Plane/scripts/verify-sandbox-production-profile.sh"
      - "apps/Model Plane/deploy/seccomp-bwrap.json"
      - "apps/Model Plane/deploy/docker-compose.yml"
      - "apps/Model Plane/deploy/docker-compose.production.yml"
      - "apps/Model Plane/rust/services/execution-core/Dockerfile"
      - ".github/workflows/model-plane-rust-ci.yml"

defaults:
  run:
    working-directory: "apps/Model Plane/rust"

env:
  CARGO_TERM_COLOR: always

# A cold build of this workspace is ~10 minutes, so don't let superseded
# pushes pile up.
concurrency:
  group: model-plane-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Format + Check + Lib Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/Model Plane/rust -> target"

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"

      # WS24 S9 (DEC-24 D1): sandbox-manager's PromoteWorkspace has no production caller. Until the
      # owner accepts overlay-only durability, a run's overlay reaches its Space only through the
      # diff-and-upload path, so a new caller is a reviewed product change, not a drive-by. Only the
      # sandbox-manager client may name the RPC. Cheap, so it runs before the goldens and the build.
      - name: No new PromoteWorkspace caller
        run: |
          set -euo pipefail
          callers="$(grep -rln --include='*.rs' --exclude-dir=target -e 'promote_workspace(' -e 'PromoteWorkspace(' . | grep -v 'services/execution-core/src/sandbox_manager_client.rs' || true)"
          if [ -n "$callers" ]; then
            echo "::error::PromoteWorkspace is called outside sandbox_manager_client.rs (DEC-24 D1):"
            echo "$callers"
            exit 1
          fi

      # The shared wire goldens (apps/Model Plane/api/contracts) are generated by
      # the code that owns them and pinned by sha256; a change to one without the
      # other, or a vendored copy that drifted, fails here. Cheap, so it runs
      # before the build.
      - name: Contract goldens match their pins
        working-directory: .
        run: |
          bash scripts/tests/zdr-contract-sync.test.sh
          bash scripts/tests/zdr-contract-sync.test.sh --self-test

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Split from the --all-targets check below on purpose: this is the
      # signal that says "production code is fine, only test code broke" —
      # the precise distinction that let the three defects above hide.
      - name: Check workspace (non-test)
        run: cargo check --workspace

      # The build-side gate. --all-targets (not just --tests) also covers the
      # 7 integration-test targets under services/*/tests and crates/*/tests;
      # one of them, model-gateway's orchestration_http_test, carried a third
      # copy of the missing-resolve_thread_owner bug that --lib never reached.
      - name: Check every target compiles (tests, benches, examples)
        run: cargo check --workspace --all-targets

      # WS24 S9: the agent-action admission table and the Do-mode workspace edit engine each have a
      # contract target. The run below covers both too; naming them here means a renamed or deleted
      # target fails this job instead of shrinking the run without anyone noticing.
      - name: Run the admission and workspace edit contract targets
        run: cargo test -p execution-core --test agent_action_admission_contract --test workspace_edit_contract --no-fail-fast

      # The run-side gate. Compiling a test proves nothing about whether its
      # assertions hold — or even execute. Covers every unit AND integration
      # target; the one live-stack test (execution-core's browser_agent_e2e)
      # is correctly #[ignore]d and stays skipped here.
      - name: Run tests
        run: cargo test --workspace --no-fail-fast

  # Z-17: the retention receipt's Postgres contract tests (session-core,
  # retention_receipt::db_tests, named zdr_receipt_*) are #[ignore]d because they
  # need a database, so the job above never runs them. This job runs them against a
  # real, migrated Postgres. REQUIRE_CONTRACT makes an absent DATABASE_URL a failure
  # rather than a skip, and the count below fails the job if fewer tests ran than
  # exist, so a filter that matches nothing cannot turn the job green.
  session-core-receipts:
    name: Session Core retention receipt (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: session_core
          POSTGRES_PASSWORD: session_core
          POSTGRES_DB: session_core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U session_core"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: "apps/Model Plane/rust"
    env:
      CARGO_TERM_COLOR: always
      DATABASE_URL: postgres://session_core:session_core@localhost:5432/session_core_test
      REQUIRE_CONTRACT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/Model Plane/rust -> target"
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
      - name: Run the receipt contract tests against a migrated database
        run: |
          set -euo pipefail
          cargo test -p session-core --bin session-core zdr_receipt -- --ignored --test-threads=1 2>&1 | tee receipt-tests.log
          passed=$(grep -oE "test result: ok\. [0-9]+ passed" receipt-tests.log | grep -oE "[0-9]+" | head -1)
          if [ -z "$passed" ] || [ "$passed" -lt 8 ]; then
            echo "expected at least 8 receipt contract tests to run, got ${passed:-0}"
            exit 1
          fi
      # WS03 S4: the durable loop fold store's Postgres tests (purge on every
      # run-end path, the ended-run guard, claim semantics, the RunDetail
      # resumable projection). They share the `loop_checkpoint` filter, run one at a
      # time because some set the fold-store switch, and the count fails the job if
      # the filter stops matching them.
      - name: Run the loop checkpoint tests against a migrated database
        run: |
          set -euo pipefail
          cargo test -p session-core --bin session-core loop_checkpoint -- --ignored --test-threads=1 2>&1 | tee loop-checkpoint-tests.log
          passed=$(grep -oE "test result: ok\. [0-9]+ passed" loop-checkpoint-tests.log | grep -oE "[0-9]+" | head -1)
          if [ -z "$passed" ] || [ "$passed" -lt 18 ]; then
            echo "expected at least 18 loop checkpoint tests to run, got ${passed:-0}"
            exit 1
          fi
      # WS09 S1: the honest run phase and the per-thread run guard against a
      # migrated Postgres (two-member characterization, guard on and off, terminal,
      # stale, child-run and non-Space cases). The count fails the job if the
      # filter stops matching them.
      - name: Run the run phase and thread run guard tests against a migrated database
        run: |
          set -euo pipefail
          cargo test -p session-core --bin session-core run_phase -- --ignored --test-threads=1 2>&1 | tee run-phase-tests.log
          passed=$(grep -oE "test result: ok\. [0-9]+ passed" run-phase-tests.log | grep -oE "[0-9]+" | head -1)
          if [ -z "$passed" ] || [ "$passed" -lt 7 ]; then
            echo "expected at least 7 run phase tests to run, got ${passed:-0}"
            exit 1
          fi
      # WS02 S1: the Space event log's Postgres tests (contiguous seq under concurrent
      # writers, rollback leaves no hole, NOTIFY after commit, trigger failure swallowed
      # and counted, sweeper moves min_seq, suppress prevents rows during purge, no row
      # for a zdr run, redacted after erase). The count fails the job if the filter
      # stops matching them.
      - name: Run the Space event log tests against a migrated database
        run: |
          set -euo pipefail
          cargo test -p session-core --bin session-core space_event -- --ignored --test-threads=1 2>&1 | tee space-event-tests.log
          passed=$(grep -oE "test result: ok\. [0-9]+ passed" space-event-tests.log | grep -oE "[0-9]+" | head -1)
          if [ -z "$passed" ] || [ "$passed" -lt 8 ]; then
            echo "expected at least 8 space event log tests to run, got ${passed:-0}"
            exit 1
          fi
      # WS10.S6: the run trace's Postgres tests (persist, idempotency, the ZDR and org refusals,
      # the EventLog read path and its owner check, the GDPR purge and the retention sweeper).
      # `trace_` selects them by name; the count fails the job if the filter stops matching.
      - name: Run the run trace tests against a migrated database
        run: |
          set -euo pipefail
          cargo test -p session-core --bin session-core trace_ -- --ignored --test-threads=1 2>&1 | tee run-trace-tests.log
          passed=$(grep -oE "test result: ok\. [0-9]+ passed" run-trace-tests.log | grep -oE "[0-9]+" | head -1)
          if [ -z "$passed" ] || [ "$passed" -lt 11 ]; then
            echo "expected at least 11 run trace tests to run, got ${passed:-0}"
            exit 1
          fi
      # WS11.S7: the web-taint marker (runs.external_content_at) and Dreaming's skip of assistant
      # text written inside a tainted run. `external_content` selects them by name.
      - name: Run the external content tests against a migrated database
        run: |
          set -euo pipefail
          cargo test -p session-core --bin session-core external_content -- --ignored --test-threads=1 2>&1 | tee external-content-tests.log
          passed=$(grep -oE "test result: ok\. [0-9]+ passed" external-content-tests.log | grep -oE "[0-9]+" | head -1)
          if [ -z "$passed" ] || [ "$passed" -lt 8 ]; then
            echo "expected at least 8 external content tests to run, got ${passed:-0}"
            exit 1
          fi

  # WS06 S10 (F-t1-021): the production-profile sandbox verification. Builds the
  # execution-core image, runs it under the production container profile (cap_drop
  # ALL, read-only root, scoped seccomp, mem/cpu/pids limits read from the compose
  # files) and throws a fork bomb, memory bomb, CPU spin, file flood and output flood
  # at the per-spawn prlimit ceilings, with /healthz as the liveness canary. The CALIB
  # lines are the calibration numbers for the S7/S8 defaults and land in the job summary.
  # UNVERIFIED on a hosted runner: ubuntu AppArmor may forbid bwrap's mounts inside the
  # container, hence apparmor=unconfined below (it only drops the docker-default LSM
  # profile; seccomp, cap_drop and no-new-privileges stay as in production).
  sandbox-production-profile:
    name: Sandbox production-profile verification (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: "."
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build the execution-core image
        uses: docker/build-push-action@v6
        with:
          context: "apps/Model Plane"
          file: "apps/Model Plane/rust/services/execution-core/Dockerfile"
          load: true
          tags: model-plane-execution-core:ci
          cache-from: type=gha,scope=execution-core-image
          cache-to: type=gha,mode=max,scope=execution-core-image
      - name: Run the production-profile verification
        env:
          EXECUTION_CORE_IMAGE: model-plane-execution-core:ci
          SANDBOX_VERIFY_REPORT: ${{ runner.temp }}/sandbox-calibration.txt
          SANDBOX_VERIFY_EXTRA_DOCKER_ARGS: "--security-opt apparmor=unconfined"
        run: |
          set -euo pipefail
          "apps/Model Plane/scripts/verify-sandbox-isolation.sh" --production-profile 2>&1 | tee "$RUNNER_TEMP/sandbox-profile.log"
      - name: Publish the calibration numbers
        if: always()
        run: |
          {
            echo "### Sandbox production-profile calibration (WS06-S10)"
            echo '```'
            cat "$RUNNER_TEMP/sandbox-calibration.txt" 2>/dev/null || echo "no report written"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # WS10.S5: the NATS provisioner has no other CI. Its contract tests start an
  # in-process broker from the real deploy/nats.conf, provision the real manifest
  # and apply every principal's grants, so a stream without a publisher grant (or
  # the reverse) fails here and not in production.
  nats-provisioner:
    name: NATS provisioner contract tests (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "apps/Model Plane/go/services/nats-provisioner"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "apps/Model Plane/go/services/nats-provisioner/go.mod"
          cache-dependency-path: "apps/Model Plane/go/services/nats-provisioner/go.sum"
      - name: go vet
        run: GOWORK=off go vet ./...
      - name: go test
        run: GOWORK=off go test ./...

  # WS12 S11 (D11): an optional clippy warning-count ratchet. It never denies a
  # warning. It is off unless the repo variable MODEL_PLANE_CLIPPY_RATCHET is the
  # literal "true"; then it fails only when the count rises above the repo
  # variable MODEL_PLANE_CLIPPY_WARNING_CEILING, which is set from a measured run
  # and lowered as warnings are burned down.
  clippy-count:
    name: Clippy warning count (optional ratchet)
    if: vars.MODEL_PLANE_CLIPPY_RATCHET == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/Model Plane/rust -> target"

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"

      - name: Count clippy warnings against the ceiling
        env:
          CEILING: ${{ vars.MODEL_PLANE_CLIPPY_WARNING_CEILING }}
        run: |
          set -euo pipefail
          if ! [[ "$CEILING" =~ ^[0-9]+$ ]]; then
            echo "::error::set the repo variable MODEL_PLANE_CLIPPY_WARNING_CEILING to a whole number"
            exit 1
          fi
          # A compile error fails the step here; only warnings are counted.
          cargo clippy --workspace --all-targets --message-format=json > clippy.json
          count=$(jq -s '[.[] | select(.reason == "compiler-message" and .message.level == "warning" and ((.message.code.code // "") | startswith("clippy::")))] | length' clippy.json)
          echo "clippy warnings: $count (ceiling $CEILING)"
          if [ "$count" -gt "$CEILING" ]; then
            echo "::error::clippy warnings rose above the ceiling"
            exit 1
          fi

# Deliberately NOT in this workflow, so nobody mistakes its green for
# coverage it does not provide:
#
#   * clippy. The workspace sets `pedantic = warn` in [workspace.lints.clippy],
#     which yields 304 pre-existing warnings, so `-D warnings` would be red on
#     day one. `cargo clippy --workspace --all-targets` does exit 0 today (no
#     hard errors), but a non-denying clippy step costs a full build for
#     almost no signal over `cargo check`. Burning down the 304 is its own
#     task; add the denying step when it lands. The count-only `clippy-count`
#     job above is the optional WS12 S11 ratchet: off by default, never denying.
#
#   * RUSTFLAGS: "-D warnings" (which dataplane-v2-ci.yml sets). Same reason
#     at the rustc level: this workspace has live dead_code warnings
#     (execution-core's verification_result_for and ExecutionService::new /
#     new_with_scheduled_step_verifier, model-gateway's parse_mcp_tool_name).
#
# Non-lib test execution WAS excluded here when this workflow landed, because
# model-gateway's e2e_invoke_chain_test ::
# invoke_stream_agentic_reuses_the_prepared_session_run was red on main. That
# test asserted `agent_dispatch_rejected` for a setup that actually produces a
# transport-level `Unavailable`, so it has since been re-pointed at the
# contract that holds and the `rejected` half given its own test with a mock
# Execution Core. The full suite is green (2070 passed, 24 ignored), so the
# run step above is no longer restricted to --lib.
