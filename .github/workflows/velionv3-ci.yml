name: Velion v3 CI

# CI gate for the Velion v3 SPA + its Rust/axum BFF gateway
# (apps/Frontend Plane/velionv3). GitHub Actions only executes workflows from
# the repository-root .github/workflows, so this lives at the monorepo root but
# is path-scoped to the v3 frontend so it does not fire on unrelated plane
# changes. Mirrors apps/Data Plane v2/.github/workflows/ci.yml.
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/Frontend Plane/velionv3/**'
      - '.github/workflows/velionv3-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/Frontend Plane/velionv3/**'
      - '.github/workflows/velionv3-ci.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Phase 0 fabrication guard: zero-tolerance allowlist asserting that the
  # de-faked / security-fixed surfaces are not silently re-introduced.
  fabrication-guard:
    name: Fabrication guard (no fake "live" state)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert no fabricated state was re-introduced
        run: |
          set -uo pipefail
          gw="apps/Frontend Plane/velionv3/apps/gateway/src"
          spa="apps/Frontend Plane/velionv3/src"
          fail=0
          # PR-1: the cross-tenant IDOR helper must never return — org is derived
          # server-side via crate::upstream::authorized_org_id.
          if grep -rIl 'fn org_id_from_headers' "$gw" >/dev/null 2>&1; then
            echo "::error::org_id_from_headers reintroduced — derive org via authorized_org_id"
            grep -rIn 'fn org_id_from_headers' "$gw"; fail=1
          fi
          # PR-2: social demo data / in-memory store must stay gone.
          if grep -rIlE 'demo_accounts|demo_posts|SocialStore' "$gw" >/dev/null 2>&1; then
            echo "::error::social demo data / SocialStore reintroduced"
            grep -rInE 'demo_accounts|demo_posts|SocialStore' "$gw"; fail=1
          fi
          # The dev-auth-bypass token may appear only in the two SPA API clients.
          stray=$(grep -rIl 'Bearer dev-bypass' "$spa" 2>/dev/null | grep -vE '/shared/api/(http|sse)\.ts$' || true)
          if [ -n "$stray" ]; then
            echo "::error::'Bearer dev-bypass' found outside src/shared/api/http.ts and sse.ts:"
            echo "$stray"; fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "Fabrication guard passed."

  gateway-rust:
    name: Gateway — fmt + clippy + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'apps/Frontend Plane/velionv3/apps/gateway'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/Frontend Plane/velionv3/apps/gateway -> target'

      - name: Check formatting
        run: cargo fmt --check

      # Scoped to the gateway crate only (no --workspace) so unrelated
      # workspace members (e.g. inference-core) cannot fail this gate.
      - name: Clippy (deny warnings, all targets)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

  spa-verify:
    name: SPA — lint + typecheck + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'apps/Frontend Plane/velionv3'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'apps/Frontend Plane/velionv3/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (lint -> typecheck -> test -> build)
        run: pnpm verify
