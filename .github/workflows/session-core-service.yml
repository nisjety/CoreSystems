name: Session Core (Go) CI

# Control Plane's Go session-core (apps/Control Plane/session-core — distinct
# from Model Plane's Rust session-core, which is a separate service and out
# of scope here) had zero CI workflows of any kind before this file.
# internal/redis/client_test.go is explicitly designed to require no live
# Redis (nil-client / short-circuit safety tests — see its own doc comment),
# and internal/config, internal/clients, internal/http, internal/service
# tests all run against fakes/httptest. No t.Skip or DSN env-var-gated
# Postgres/Redis integration suite was found anywhere in the module — so no
# service containers are needed to run `go test ./...` here.

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/Control Plane/session-core/**'
      - '.github/workflows/session-core-service.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/Control Plane/session-core/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'apps/Control Plane/session-core'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: 'apps/Control Plane/session-core/go.sum'

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...

      - name: Build
        run: go build -v ./cmd/server
