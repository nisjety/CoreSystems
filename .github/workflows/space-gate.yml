name: Space Gate

# Merge gate for the Space hybrid room build (plan docs/plans/space-hybrid-build-plan-2026-10-14.md,
# slice M0-CI, section 4.5.5). Origin has only `dev` and `fix/ui-premium-restore`, and the Control,
# gateway and SPA workflows trigger only for pull requests based on main/develop, so a Space pull
# request (based on `space`, or a feature branch cut from it) was gated by nothing but secret-scan.
#
# This workflow is base-agnostic: `pull_request` has no `branches` filter. It runs ONE job per
# touched area (scripts/gates/space-changed-areas.sh decides which), so a Control-only change does
# not build the Model Plane workspace. The single required check is `space-gate`: it is green only
# when every job that was selected is green (a skipped job is an area the change did not touch).
#
# Pre-existing failures are compared as SETS against the stored baseline (scripts/tests/baseline-*,
# docs/plans/evidence/baseline-<date>/): a new failing test id fails, an old one does not. They are
# never fixed inside a Space pull request.
#
# Not here, by design: secret-scan.yml (always runs), buf.yml and contract-goldens.yml (their own
# path filters; the proto job below repeats their checks for a PR that they do not trigger on),
# and the Convex gate (convex-core.yml, which has its own path filter).

on:
  pull_request:
  push:
    branches: [space, "space/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: space-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Proves the gate's own scripts can go red (same pattern as buf.yml and sse-taxonomy.yml): a gate
  # that cannot fail reads as coverage. Cheap, so it runs on every change.
  gate-self-test:
    name: Gate scripts can fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Syntax of the gate scripts
        run: |
          set -euo pipefail
          bash -n scripts/gates/space-changed-areas.sh
          bash -n scripts/gates/space-baseline-compare.sh
      - name: Area selection picks the right areas
        run: bash scripts/gates/space-changed-areas.sh --self-test
      - name: A new failing test id goes red, an unchanged set stays green
        run: bash scripts/gates/space-baseline-compare.sh --self-test

  changes:
    name: Which areas changed
    runs-on: ubuntu-latest
    outputs:
      cp_go_services: ${{ steps.areas.outputs.cp_go_services }}
      mp_go_services: ${{ steps.areas.outputs.mp_go_services }}
      principals: ${{ steps.areas.outputs.principals }}
      auth_core: ${{ steps.areas.outputs.auth_core }}
      mp_rust: ${{ steps.areas.outputs.mp_rust }}
      proto: ${{ steps.areas.outputs.proto }}
      gateway: ${{ steps.areas.outputs.gateway }}
      spa: ${{ steps.areas.outputs.spa }}
      notification_core: ${{ steps.areas.outputs.notification_core }}
      full_run: ${{ steps.areas.outputs.full_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select the areas this change touches
        id: areas
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/gates/space-changed-areas.sh

  # user-core, audit-core, org-core: vet + test; the Postgres-gated suites self-provision their
  # schema against TEST_DATABASE_URL and skip silently without it, so the service container is what
  # makes them run. -p 1 because the stores share one database and clean up by org id.
  control-go:
    name: Control Go (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.cp_go_services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.cp_go_services) }}
    defaults:
      run:
        working-directory: "apps/Control Plane/${{ matrix.service }}"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: space_gate
          POSTGRES_PASSWORD: space_gate
          POSTGRES_DB: space_gate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U space_gate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "apps/Control Plane/${{ matrix.service }}/go.mod"
          cache-dependency-path: "apps/Control Plane/${{ matrix.service }}/go.sum"
      - name: Download modules
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://space_gate:space_gate@localhost:5432/space_gate_test?sslmode=disable
        run: go test -count=1 -p 1 ./...
      - name: Build every binary
        run: |
          set -euo pipefail
          for d in ./cmd/*/; do
            if [ -d "$d" ]; then go build -o /dev/null "$d"; fi
          done

  # A principal or token change must keep the three representations of the service principal
  # registry in agreement (plan 4.5.5, P-CFG).
  principal-parity:
    name: Service principal registry parity
    needs: changes
    if: needs.changes.outputs.principals == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parity test
        run: bash scripts/tests/principal-registry-parity.test.sh

  # The full suite has 15 pre-existing failures in 3 suites: the failing SET is compared with the
  # stored baseline instead of the exit code.
  auth-core:
    name: auth-core (failing set vs baseline)
    needs: changes
    if: needs.changes.outputs.auth_core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: "11.3.0"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: "apps/Control Plane/auth-core/pnpm-lock.yaml"
      - name: Install dependencies
        working-directory: "apps/Control Plane/auth-core"
        run: pnpm install --frozen-lockfile
      - name: Jest, failing set against the baseline
        env:
          REQUIRE_CONTRACT: "1"
        run: bash scripts/gates/space-baseline-compare.sh auth-core-jest

  mp-rust:
    name: Model Plane Rust (fmt, check, test)
    needs: changes
    if: needs.changes.outputs.mp_rust == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "apps/Model Plane/rust"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/Model Plane/rust -> target"
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check every target compiles
        run: cargo check --workspace --all-targets
      - name: Run tests
        run: cargo test --workspace --no-fail-fast

  # session-core's database tests are #[ignore]d (they need Postgres). The database name contains
  # "test" on purpose: the suites refuse to run against anything else.
  session-core-db:
    name: session-core database tests
    needs: changes
    if: needs.changes.outputs.mp_rust == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: session_core
          POSTGRES_PASSWORD: session_core
          POSTGRES_DB: session_core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U session_core"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: "apps/Model Plane/rust"
    env:
      DATABASE_URL: postgres://session_core:session_core@localhost:5432/session_core_test
      REQUIRE_CONTRACT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/Model Plane/rust -> target"
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
      - name: Ignored (database) tests
        run: cargo test -p session-core --no-fail-fast -- --ignored --test-threads=1

  # The Model Plane Go services have no CI of their own; one job per touched service.
  mp-go:
    name: Model Plane Go (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.mp_go_services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.mp_go_services) }}
    defaults:
      run:
        working-directory: "apps/Model Plane/go/services/${{ matrix.service }}"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "apps/Model Plane/go/services/${{ matrix.service }}/go.mod"
          cache-dependency-path: "apps/Model Plane/go/services/${{ matrix.service }}/go.sum"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...

  # Proto and contracts. Every path has a space, so every path is quoted (as in buf.yml).
  proto:
    name: Proto and contracts
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-setup-action@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: buf lint (ratchet against the committed baseline)
        run: |
          set -o pipefail
          buf lint "apps/Model Plane/proto" --error-format=json > /tmp/buf-lint.json || true
          python3 scripts/gates/buf-lint-ratchet.py --baseline "apps/Model Plane/proto/buf-lint-baseline.json" /tmp/buf-lint.json
      - name: buf breaking
        run: buf breaking "apps/Model Plane/proto" --against "apps/Model Plane/proto/baseline.binpb"
      - name: Contract goldens match their pins (REQUIRE_CONTRACT)
        env:
          REQUIRE_CONTRACT: "1"
        run: bash scripts/tests/zdr-contract-sync.test.sh
      - name: Prove the drift check can fail
        run: bash scripts/tests/zdr-contract-sync.test.sh --self-test

  gateway:
    name: Gateway (fmt, clippy, test, action surface)
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "apps/Frontend Plane/verevonv3"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/Frontend Plane/verevonv3/apps/gateway -> target"
      - name: Check formatting
        run: cargo fmt --manifest-path apps/gateway/Cargo.toml -- --check
      - name: Clippy (deny warnings, all targets)
        run: cargo clippy --manifest-path apps/gateway/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --manifest-path apps/gateway/Cargo.toml --all-targets
      - name: Action surface contract
        run: node --test apps/gateway/scripts/action-surface-contract.test.mjs

  # lint, typecheck and the unit tests have pre-existing failures: each is compared as a set against
  # the stored baseline. `pnpm build` is a plain pass/fail. Playwright is a milestone gate only
  # (second Vite server, E2E_REQUIRE_SPACE=1); it does not run here.
  spa:
    name: SPA (failing sets vs baseline, build)
    needs: changes
    if: needs.changes.outputs.spa == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "apps/Frontend Plane/verevonv3"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: "11.3.0"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: "apps/Frontend Plane/verevonv3/pnpm-lock.yaml"
      # Same prerequisites as verevonv3-ci.yml: @quarry/client is a generated SDK that package.json
      # depends on by file: path, and @verevon/remote-core must be built before tsc can see it.
      - name: Generate and build the Quarry TypeScript SDK
        working-directory: "apps/Ingestion Plane/Quarry-v2/sdks"
        run: |
          ./generate.sh
          cd typescript
          pnpm install --ignore-scripts
          pnpm run build
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build @verevon/remote-core workspace package
        run: pnpm --filter @verevon/remote-core run build
      - name: lint, typecheck and tests against the baseline
        working-directory: .
        run: bash scripts/gates/space-baseline-compare.sh spa-lint,spa-typecheck,spa-vitest,spa-node-tests
      - name: Build
        run: pnpm build

  notification-core:
    name: notification-core
    needs: changes
    if: needs.changes.outputs.notification_core == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "apps/Application Plane/notification-core"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "apps/Application Plane/notification-core/go.mod"
          cache-dependency-path: "apps/Application Plane/notification-core/go.sum"
      - run: go vet ./...
      - run: go test -count=1 ./...

  # The one required check. A skipped job is an area the change did not touch; a failed or
  # cancelled job, or a changes/self-test job that did not succeed, fails the gate.
  space-gate:
    name: space-gate
    if: always()
    needs:
      - gate-self-test
      - changes
      - control-go
      - principal-parity
      - auth-core
      - mp-rust
      - session-core-db
      - mp-go
      - proto
      - gateway
      - spa
      - notification-core
    runs-on: ubuntu-latest
    steps:
      - name: Every selected job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ("success", "skipped")}
          for k, v in sorted(needs.items()):
              print(k + ": " + v["result"])
          for must in ("gate-self-test", "changes"):
              if needs[must]["result"] != "success":
                  bad[must] = needs[must]["result"]
          if bad:
              print("::error::space-gate is red: " + ", ".join(k + "=" + v for k, v in sorted(bad.items())))
              sys.exit(1)
          print("space-gate is green")
          PY
