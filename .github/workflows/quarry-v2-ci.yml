name: Quarry-v2 CI

# CI gate for Quarry-v2 (apps/Ingestion Plane/Quarry-v2). GitHub Actions only
# executes workflows from the repository-root .github/workflows, so this
# lives at the monorepo root but is path-scoped to Quarry-v2 so it does not
# fire on unrelated plane changes. Mirrors the gating pattern used by
# apps/Frontend Plane/verevonv3's verevonv3-ci.yml.
#
# 2026-08-06: absorbed the checks previously defined in
# apps/Ingestion Plane/Quarry-v2/.github/workflows/coverage.yml and
# security.yml. Those lived in a nested .github/workflows/ directory (a
# leftover from when Quarry-v2 was a standalone repo), which GitHub Actions
# never executes — so cargo-audit, govulncheck, and both coverage floors
# were not actually running anywhere. coverage.yml's `make coverage-rust`/
# `coverage-go` targets didn't exist in the Makefile either; rust-coverage
# and go-coverage below use working commands instead of restoring that
# reference.
#
# cargo-audit ignores 4 pre-existing advisories: RUSTSEC-2023-0071 (rsa —
# Marvin Attack timing side-channel; dev-only via quarry-edge, no fixed
# upgrade available upstream), RUSTSEC-2025-0134 and RUSTSEC-2026-0192
# (rustls-pemfile / ttf-parser — "unmaintained" warnings, not exploits), and
# RUSTSEC-2026-0253 (lru 0.16.4 — unsound panic-safety hole in
# LruCache::pop(); pulled in transitively by both aws-sdk-s3 and tantivy,
# each of which hard-pins `lru = "^0.16.3"` in their own Cargo.toml, so
# `cargo update -p lru --precise <fixed>` fails with "candidate versions
# found which didn't match" — confirmed 2026-09-08, no fixed upgrade
# reachable without a semver-breaking bump of aws-sdk-s3/tantivy themselves).
# Revisit if upstream ships fixes.
#
# 2026-09-08/09: investigated the govulncheck/coverage/cargo-check debt this
# file's continue-on-error settings were papering over (prompted by PR #22,
# a pure actions/setup-go bump, surfacing all of it at once). Findings:
#
# - govulncheck: the module-level findings in both services (grpc-go
#   GO-2026-6061, golang.org/x/text GO-2026-5970, otel/sdk GO-2026-5426 +
#   GO-2026-4394, golang.org/x/net GO-2026-5026) are FIXED — bumped
#   google.golang.org/grpc to v1.82.1, golang.org/x/text to v0.39.0, the
#   go.opentelemetry.io/otel family (otel/sdk/trace/metric/exporters) to
#   v1.43.0, and golang.org/x/net to v0.55.0 in both go.mod files. Confirmed
#   two ways: locally (go build/vet/test/govulncheck all green) and live —
#   all three govulncheck matrix jobs passed on the first real CI run after
#   the bump. What's left in both services is exclusively Go standard-
#   library CVEs tied to the toolchain patch version (go1.26.5 vs the fixed
#   go1.26.6 — net/url, crypto/tls, encoding/asn1, net/http, encoding/xml,
#   html/template) — not fixable via go.mod, and this workflow's
#   `go-version: stable` already tracks the latest stable release, so these
#   self-resolve once Go ships 1.26.6.
#
# - rust-coverage never actually reached a coverage measurement: its build
#   panicked immediately in quarry-runtime's build.rs with "Could not find
#   `protoc`" — confirmed live 2026-09-08. cargo-check's own job happened to
#   pass regardless, but only because Swatinem/rust-cache was restoring
#   already-generated prost output from some earlier point when protoc
#   (or a cache seeded elsewhere) was available; build.rs only reruns when
#   its proto inputs change, so cargo-check was silently coasting on a warm
#   cache, not evidence protoc actually works there. Fixed both jobs with
#   `arduino/setup-protoc@v3`, matching the convention already used by
#   dataplane-v2-ci.yml and model-plane-rust-ci.yml — confirmed live: both
#   jobs get past their build.rs step now.
#
# - cargo-check + test (hard-blocking, NOT report-only): `Test workspace` was
#   dying on a linker crash — "collect2: fatal error: ld terminated with
#   signal 7 [Bus error], core dumped" linking quarry-runtime's
#   `dom_summary_proptest` binary, reproduced identically across 4 separate
#   runs (2026-09-03/04/07/08). That one binary statically links quarry-
#   runtime's full dependency graph — chromiumoxide, the AWS S3 SDK,
#   tantivy, lopdf, zip — several hundred rlibs in one `cc` invocation; a Bus
#   error mid-link on a GitHub-hosted runner is the standard signature of
#   the job's disk filling up during linking, not a source defect. Fixed by
#   adding a disk-cleanup step (ubuntu-latest ships far more preinstalled
#   toolchain bulk than this workspace needs) plus
#   `CARGO_PROFILE_TEST_DEBUG=0` scoped to just this job (debug info is most
#   of a debug binary's size) — confirmed live 2026-09-08: all 4 steps in
#   this job, including `Test workspace`, passed for the first time across 5
#   runs checked.
#
# - rust-coverage hit the identical linker crash after the protoc fix let it
#   get that far — same Bus-error signature, this time linking quarry-
#   runtime's `publisher_integration` test (a second binary in the same
#   crate that also links its full dependency graph). Unlike cargo-check,
#   this job can't also shrink debug info — cargo-llvm-cov's coverage
#   mapping depends on it — so it got only the disk-cleanup step, which
#   surfaced a real bug in that step: `Free disk space` was deleting
#   $AGENT_TOOLSDIRECTORY, which is exactly where the `arduino/setup-protoc`
#   step immediately above it had just installed protoc — so the very next
#   build.rs invocation hit "Could not find protoc" again despite the setup
#   step having (correctly) run. cargo-check has the identical ordering bug
#   but never showed it, purely because its build.rs output was warm-cached
#   from an earlier run and never needed to re-invoke protoc at all — so
#   cargo-check's protoc fix was never actually exercised by any run so far,
#   only masked as working. Fixed in both jobs by dropping
#   $AGENT_TOOLSDIRECTORY from the cleanup list; the other paths
#   (/usr/share/dotnet, /usr/local/lib/android, /opt/ghc) are untouched by
#   any setup-* action in this workflow and stay. Not yet re-verified.
#
# - go-coverage floors: still real, unresolved debt (quarry-control 41.6%,
#   quarry-orchestrator 37.2%, against the 80% floor, confirmed 2026-09-08).
#   quarry-orchestrator's gap is concentrated, not diffuse: internal/jobs,
#   internal/activities, and internal/controlauth sit at 0% (no test files
#   at all) while tested packages are already near the floor (fleet 84.9%,
#   schedules 81.4%) — closing this means writing initial tests for a
#   handful of packages, not broad rework. Left for dedicated follow-up:
#   this is a test-writing effort, not a config change.
#
# govulncheck, rust-coverage, and go-coverage run as report-only
# (continue-on-error) rather than hard-blocking so today's debt doesn't jam
# every future PR on this plane. Ratchet each to blocking once its debt is
# paid down. rust-coverage in particular is report-only because the actual
# percentage was never locally confirmed against a clean instrumented build
# (disk constraints in the verifying dev environment — the same constraint
# implicated in the cargo-check linker crash above), so it ships in
# observe-only mode until a real CI run establishes a baseline.
#
# cargo-check also gained a chromiumoxide feature check/test step:
# quarry-browser's chromiumoxide feature isn't a default feature, so plain
# `cargo check/test --workspace` silently skips it — the exact gap that once
# let an unresolved-import compile break in quarry-browser merge and sit
# undetected.
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/Ingestion Plane/Quarry-v2/**'
      - '.github/workflows/quarry-v2-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/Ingestion Plane/Quarry-v2/**'
      - '.github/workflows/quarry-v2-ci.yml'
  schedule:
    # Weekly Monday 06:00 UTC, matching the old security.yml cadence —
    # advisory-database scans can find new CVEs against unchanged code.
    # Only cargo-audit/govulncheck run on this trigger (see each job's
    # `if:`); the compile/test/coverage jobs stay push+PR only, as before.
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-check:
    name: Cargo check + test (workspace)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'apps/Ingestion Plane/Quarry-v2'
    env:
      # `Test workspace` links quarry-runtime's dom_summary_proptest binary,
      # which statically pulls in the crate's full dependency graph
      # (chromiumoxide, the AWS S3 SDK, tantivy, lopdf, and more) in one `cc`
      # invocation. Full debug info for a link that large routinely filled
      # the runner's disk mid-link and crashed the linker with a Bus error
      # (signal 7) — reproduced identically across 4 separate runs
      # (2026-09-03, -04, -07, -08). Debug info is most of a debug binary's
      # size, so this is the standard fix: shrink what the linker has to
      # write, not what it has to link. Scoped to this job only (env, not
      # the workspace Cargo.toml) so local `cargo test` still gets full
      # debug info for developers.
      CARGO_PROFILE_TEST_DEBUG: "0"
    # The page-cache and ZDR cache gates need a live Redis. The gate step below
    # runs them against this service with REQUIRE_CONTRACT=1, so an unreachable
    # Redis fails the job instead of skipping. The service is published on host
    # port 6380 rather than the default 6379: the default address that the
    # workspace tests fall back to stays unused, so `Test workspace` behaves as
    # before (the cache cases skip there and the gate step asserts them).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/Ingestion Plane/Quarry-v2 -> target'

      - uses: arduino/setup-protoc@v3
        with:
          version: '27.x'

      # The linker crash above is a disk-exhaustion signature, not a memory
      # one — ubuntu-latest ships ~14GB free but ~60-75GB of preinstalled
      # toolchains (Android SDK, .NET, GHC, CodeQL bundles) this workspace
      # never uses. Freeing that before the build gives the link step enough
      # headroom regardless of how large target/ grows. `|| true` on each: a
      # runner image that has already dropped one of these (image updates
      # change what's preinstalled) must not fail the job over it.
      #
      # Do NOT add $AGENT_TOOLSDIRECTORY (aka $RUNNER_TOOL_CACHE) to this
      # list: it's exactly where setup-protoc above just installed protoc,
      # and every other setup-* action installs into the same directory.
      # Deleting it here silently wiped out that install — confirmed live
      # 2026-09-08: this job's own warm build.rs cache masked the breakage
      # (no proto recompile needed, so the missing protoc never got hit),
      # but rust-coverage's separate, always-cold cache hit it immediately
      # and came back to "Could not find `protoc`" despite the setup step
      # having just run.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Check workspace
        run: cargo check --workspace

      - name: Test workspace
        run: cargo test --workspace

      - name: Page-cache and ZDR cache gates (Redis)
        # cache_policy.rs (9 cases) and the Redis case of zdr_claim_floor.rs skip
        # when no Redis answers, so the step above passes without asserting them.
        # This step runs both binaries against the service above. With
        # REQUIRE_CONTRACT=1 an unreachable Redis is a failure, not a skip.
        env:
          REDIS_URL: redis://127.0.0.1:6380
          REQUIRE_CONTRACT: "1"
        run: cargo test -p quarry-edge --test cache_policy --test zdr_claim_floor

      # The scrape options schema is a golden generated from the Rust type, and
      # the OpenAPI file is checked against it and against the routes the edge
      # registers (docs/openapi.yaml, scripts/openapi-route-allowlist.json).
      - name: Test scrape options schema golden
        run: cargo test -p quarry-core --features jsonschema --test scrape_schema

      - name: Test challenge signal schema golden
        run: cargo test -p quarry-core --features jsonschema --test challenge_schema

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: OpenAPI route coverage and scrape parity
        run: node --test scripts/tests/openapi-route-coverage.test.mjs scripts/tests/openapi-scrape-parity.test.mjs

      - name: OpenAPI challenge parity
        run: node --test scripts/tests/openapi-challenge-parity.test.mjs

      - name: Check quarry-browser (chromiumoxide feature)
        run: cargo check -p quarry-browser --features chromiumoxide

      - name: Test quarry-browser (chromiumoxide feature)
        run: cargo test -p quarry-browser --features chromiumoxide

  # The browser tests that need a real Chromium. Everywhere else they print
  # "skipping: set CHROMIUMOXIDE_TEST=1" and pass, so a regression in the live driver
  # (a viewport change relaunching the browser, a lost egress policy, a profile that
  # no longer restores) merged green. This lane runs them for real.
  #
  # REQUIRED: no continue-on-error. A red run here blocks the merge. Add the check
  # name "Live browser tests (Chromium)" to the branch protection rule for main
  # (repository settings; a workflow file cannot do that). What makes it safe to
  # require:
  #  - The browser is pinned and installed by an action that fails when it cannot
  #    install it. The earlier `apt-get install chromium` is not a dependable
  #    source on the Ubuntu 24.04 runner image (Ubuntu distributes Chromium as a
  #    snap, not a deb). Chrome for Testing 155.0.8059.84 is the
  #    version the local evidence matched (Chromium 155.0.8059.79); bump it on
  #    purpose, not by drift.
  #  - A missing browser cannot pass by skipping. With CHROMIUMOXIDE_TEST=1 every
  #    live test that starts a browser goes through quarry_browser::live_gate
  #    (the driver's own tests, tests/ssrf.rs and browser_egress_boundary), which
  #    FAILS when no Chromium is found or when CHROME names a file that does not
  #    exist (chromiumoxide itself would fall back silently to any chromium on the
  #    PATH). The fail-instead-of-skip mapping is pinned by unit tests of
  #    live_gate::enforce (#[should_panic]); this job cannot reach that branch
  #    itself, because the install step above must yield an executable.
  #  - It runs all three sets that are gated on the live feature or flag:
  #    quarry-browser (the live driver tests, and tests/ssrf.rs: the driver
  #    refuses loopback, metadata and RFC1918 URLs in Rust, with a real browser
  #    launched but never asked to navigate), quarry-runtime's
  #    browser_egress_boundary (compiled out entirely without
  #    `--features chromiumoxide`, so `cargo test --workspace` never ran it; it
  #    has a real Chromium whose PAGE requests a loopback listener and is refused
  #    by the CDP boundary (the pinned proxy holding no receipt for it, so the
  #    refusal is the CDP layer's), once by the domain grant and once by the SSRF guard,
  #    plus the real pinned proxy refusing loopback over a real connection, once
  #    per layer, each read back from the receipts) and quarry-edge's
  #    zdr_behavior (needs no Chromium, only the default browser-agent feature,
  #    and is listed here so a lane that proves ZDR for the agent routes runs it
  #    next to the browser tests).
  #  - One test at a time (--test-threads=1): each launches its own Chromium, and
  #    the parallel suite was the cause of the lock-timeout flake fixed in
  #    7420d3a6.
  # What is NOT run, on purpose: tests/ssrf.rs test_valid_public_url is #[ignore]d
  # because it needs DNS for a public host (and, with no pinned proxy in that
  # test, can only assert a negative). The last step lists every ignored test.
  quarry-browser-live:
    name: Live browser tests (Chromium)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: 'apps/Ingestion Plane/Quarry-v2'
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CHROMIUMOXIDE_TEST: "1"
      # Hosted runners restrict unprivileged user namespaces (AppArmor on
      # Ubuntu 24.04), so Chromium cannot build its own sandbox there. The edge
      # refuses this flag when ENVIRONMENT is prod or production; it is not set
      # here. CHROME is exported by the "Install Chromium" step below.
      QUARRY_BROWSER_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/Ingestion Plane/Quarry-v2 -> target'

      - uses: arduino/setup-protoc@v3
        with:
          version: '27.x'

      # The quarry-edge test binary links the whole dependency graph; see the
      # cargo-check job for why the disk is freed first. Never add
      # $AGENT_TOOLSDIRECTORY here: setup-protoc and setup-chrome install there.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: Install Chromium (Chrome for Testing, pinned)
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: '155.0.8059.84'
          install-dependencies: true

      - name: Chromium must exist and run
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          if [ -z "$CHROME_PATH" ] || [ ! -x "$CHROME_PATH" ]; then
            echo "::error::setup-chrome did not provide an executable Chromium (chrome-path='$CHROME_PATH')"
            exit 1
          fi
          "$CHROME_PATH" --version
          echo "CHROME=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Live tests - quarry-browser
        run: cargo test -p quarry-browser --features chromiumoxide -- --test-threads=1

      - name: Live tests - quarry-runtime browser_egress_boundary
        run: cargo test -p quarry-runtime --features chromiumoxide --test browser_egress_boundary -- --test-threads=1

      - name: Agent-route ZDR tests - quarry-edge zdr_behavior
        run: cargo test -p quarry-edge --test zdr_behavior -- --test-threads=1

      - name: Show what was skipped on purpose
        if: always()
        run: cargo test -p quarry-browser --features chromiumoxide -- --ignored --list

  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'apps/Ingestion Plane/Quarry-v2'
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/Ingestion Plane/Quarry-v2 -> target'

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: |
          cargo audit --deny warnings \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2025-0134 \
            --ignore RUSTSEC-2026-0192 \
            --ignore RUSTSEC-2026-0253

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        module:
          - services/quarry-control
          - services/quarry-orchestrator
          - pkg/quarrycontracts
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: 'apps/Ingestion Plane/Quarry-v2/${{ matrix.module }}/go.sum'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        working-directory: 'apps/Ingestion Plane/Quarry-v2/${{ matrix.module }}'
        run: govulncheck ./...

  rust-coverage:
    name: rust-coverage
    if: github.event_name != 'schedule'
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'apps/Ingestion Plane/Quarry-v2'
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/Ingestion Plane/Quarry-v2 -> target'

      - uses: arduino/setup-protoc@v3
        with:
          version: '27.x'

      - uses: taiki-e/install-action@cargo-llvm-cov

      # This job hits the same disk-exhaustion linker crash as cargo-check
      # (confirmed 2026-09-08: same "Bus error" signature, on
      # publisher_integration this time rather than dom_summary_proptest —
      # quarry-runtime has more than one test binary that statically links
      # its full dependency graph). Unlike cargo-check, this job cannot also
      # shrink debug info: cargo-llvm-cov's coverage mapping depends on it,
      # so freeing disk is the only lever available here.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Enforce Rust coverage floor (80%)
        run: cargo llvm-cov --workspace --all-features --fail-under-lines 80

  go-coverage:
    name: go-coverage
    if: github.event_name != 'schedule'
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - services/quarry-control
          - services/quarry-orchestrator
          - pkg/quarrycontracts
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: 'apps/Ingestion Plane/Quarry-v2/${{ matrix.module }}/go.sum'

      - name: Enforce Go coverage floor (80%)
        working-directory: 'apps/Ingestion Plane/Quarry-v2/${{ matrix.module }}'
        run: |
          go test -coverprofile=coverage.out ./...
          total=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t + 0 >= 80) ? 0 : 1 }'
