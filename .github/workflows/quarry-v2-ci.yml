name: Quarry-v2 CI

# CI gate for Quarry-v2 (apps/Ingestion Plane/Quarry-v2). GitHub Actions only
# executes workflows from the repository-root .github/workflows, so this
# lives at the monorepo root but is path-scoped to Quarry-v2 so it does not
# fire on unrelated plane changes. Mirrors the gating pattern used by
# apps/Frontend Plane/verevonv3's verevonv3-ci.yml. Existing Quarry-v2 checks
# (coverage.yml, security.yml under apps/Ingestion Plane/Quarry-v2/.github/
# workflows/) are left untouched; this adds the cargo check + cargo test
# gate (compile-check alone previously let non-compiling test suites merge).
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/Ingestion Plane/Quarry-v2/**'
      - '.github/workflows/quarry-v2-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/Ingestion Plane/Quarry-v2/**'
      - '.github/workflows/quarry-v2-ci.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-check:
    name: Cargo check + test (workspace)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'apps/Ingestion Plane/Quarry-v2'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/Ingestion Plane/Quarry-v2 -> target'

      - name: Check workspace
        run: cargo check --workspace

      - name: Test workspace
        run: cargo test --workspace
