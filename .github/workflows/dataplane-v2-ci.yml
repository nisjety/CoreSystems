name: Data Plane v2 CI

# CI gate for Data Plane v2 (apps/Data Plane v2). GitHub Actions only executes
# workflows from the repository-root .github/workflows — this file used to
# live at apps/Data Plane v2/.github/workflows/ci.yml, which GitHub silently
# never ran. Moved here (git history preserved via `git mv`) so it actually
# gates merges; paths were already root-relative so no path filters changed.
on:
  pull_request:
    paths:
      - "apps/Data Plane v2/**"
  push:
    branches: [main]
    paths:
      - "apps/Data Plane v2/**"

defaults:
  run:
    working-directory: "apps/Data Plane v2"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust-check:
    name: Rust Check + Clippy + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/Data Plane v2 -> target"

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (§16.4.5 — deny warnings, all targets including tests)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check workspace
        run: cargo check --workspace

      # Was `cargo check --workspace --tests`, which COMPILED every crate's
      # tests and then never ran them. Combined with the integration job below
      # being scoped to `-p retrieval-engine-rs`, that left 359 tests in the
      # other eight workspace crates typechecked but never executed (measured:
      # 848 run by `--workspace` vs 489 by the old pair of commands) —
      # embedding-engine-rs 103, graph-index-rs 86 (including the reconciler's
      # cost-leak guard), index-engine-rs 59, nats-connection-rs 15,
      # event-envelope-rs 9 (the envelope forgery/expiry suite),
      # pg-org-scope-rs 3 (org-scoping primitives), and 84 more across
      # quickwit-adapter-rs and meilisearch-adapter-rs. Running them subsumes
      # checking that they compile, so this replaces the step, not adds one.
      #
      # No service containers on purpose: verified locally that the whole
      # workspace passes with nothing reachable — DB/NATS-dependent tests
      # either self-gate on TEST_DATABASE_URL or are `#[ignore]`d. The
      # Postgres-backed job below keeps its own narrower scope.
      - name: Unit tests — whole workspace (§16.4.5)
        run: cargo test --workspace --tests

  rust-integration-tests:
    name: Rust Integration Tests
    runs-on: ubuntu-latest
    needs: rust-check
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dataplane
          POSTGRES_PASSWORD: dataplane
          POSTGRES_DB: dataplane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataplane"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/Data Plane v2 -> target"

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"

      - name: Run integration tests
        # Was previously scoped to `--test grpc_integration` only, which
        # silently excluded every other integration test file under
        # tests/ — most importantly cross_org_isolation.rs (the cross-tenant
        # IDOR/isolation suite for GetDocument/ListDocuments/KnowledgeUnits/
        # CheckPermissions). Broadened to `--tests` (lib unit tests + every
        # tests/*.rs binary) so nothing under this crate is silently skipped
        # going forward. Safe to broaden: every non-canary test in these
        # files self-gates on `TEST_DATABASE_URL` (`let Some(url) = ... else
        # { return }`, a no-op pass when unset) and each file's first/canary
        # test plus cache_dragonfly.rs (needs DPV2_CACHE_TEST_URL) and
        # pipeline_e2e.rs (needs the full docker-compose stack, exercised
        # separately by the docker-smoke job) are `#[ignore]`'d and stay
        # skipped without `--include-ignored`.
        env:
          TEST_DATABASE_URL: postgres://dataplane:dataplane@localhost:5432/dataplane_test
        run: cargo test -p retrieval-engine-rs --tests -- --nocapture

  go-build:
    name: Go Build + Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache-dependency-path: |
            apps/Data Plane v2/services/documents-api-go/go.sum
            apps/Data Plane v2/services/wiki-store-go/go.sum
            apps/Data Plane v2/services/data-orchestrator-go/go.sum
            apps/Data Plane v2/services/data-quality-go/go.sum

      - name: Build + vet + test Go services
        # `go test ./...` was absent here, so of 295 Go tests in the plane only
        # documents-api-go's integration-tagged internal/repo suite ran in CI
        # (the job below) — wiki-store-go (53), data-orchestrator-go (77) and
        # data-quality-go (49) never ran at all, and documents-api-go's ~100
        # non-repo tests were compiled by `go vet` and then discarded.
        #
        # Safe without any service containers: verified locally that all four
        # pass `go test ./...` with no env and no Postgres/NATS reachable. The
        # DB-dependent suites are behind `//go:build integration` (excluded
        # without `-tags`) or skip on an unset TEST_DATABASE_URL, so this stays
        # a pure unit gate and the integration job below keeps its own scope.
        run: |
          for svc in documents-api-go wiki-store-go data-orchestrator-go data-quality-go; do
            echo "=== $svc ==="
            (cd "services/$svc" && go build ./... && go vet ./... && go test ./...)
          done

  documents-api-postgres-tests:
    name: documents-api-go Ownership Integration Tests
    runs-on: ubuntu-latest
    needs: go-build
    # ownership_test.go / integration_test.go are built with `//go:build
    # integration` and gated on TEST_DATABASE_URL (t.Skip when unset) — with
    # no Postgres wired into CI these per-user ownership/sharing filter-at-
    # source tests never ran at all, silently.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dataplane
          POSTGRES_PASSWORD: dataplane
          POSTGRES_DB: documents_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataplane"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache-dependency-path: apps/Data Plane v2/services/documents-api-go/go.sum

      - name: Run ownership + integration tests (Postgres-gated)
        working-directory: "apps/Data Plane v2/services/documents-api-go"
        env:
          TEST_DATABASE_URL: postgres://dataplane:dataplane@localhost:5432/documents_test?sslmode=disable
        run: go test -tags=integration -v ./internal/repo/...

  # CR-N1. The Postgres-gated tests of the CR chain (and the crates it touches)
  # used to be compiled and never run: Rust ones are #[ignore]d, Go ones t.Skip
  # and `go test` reports `ok` (tests/contract/postgres exits 0 with 13 SKIP when
  # no database is reachable). These two jobs make that impossible.
  #
  # postgres-contract-wiring needs no database: it self-tests the runner's
  # parsers and fails if a Postgres-gated test exists that no suite owns, if a
  # migration file would be silently ignored by the migrator, or if the job below
  # is removed or made skippable (continue-on-error).
  postgres-contract-wiring:
    name: Postgres Contract Wiring Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Self-test the runner (parsers, assertions, lints)
        run: bash tests/scripts/run-postgres-contract-tests.sh --self-test

      - name: Lint (every Postgres gate registered or exempt, workflow wiring, migration names)
        run: bash tests/scripts/run-postgres-contract-tests.sh --lint

      # CR-T11: the keyword-index parity contract (index-parity-v1) is vendored byte for byte by its
      # producer (quickwit-adapter-rs, CR-T9a) and consumer (data-quality-go). No database needed.
      - name: Parity contract drift check (pins, and the adapter's vendored copy once it serves the route)
        run: bash scripts/check-parity-contract.sh

      - name: Prove the parity drift check can fail
        run: bash scripts/check-parity-contract.sh --self-test

  # postgres-contract-tests applies init.sql and EVERY migration through the real
  # tools/migrator on a disposable Postgres 16, then runs the gated suites of
  # tests/contract/postgres, embedding-engine-rs, graph-index-rs and
  # data-quality-go with REQUIRE_CONTRACT=1 and asserts that the gated tests
  # EXECUTED (names and counts), instead of trusting a green exit code. The
  # existing rust-integration-tests and documents-api-postgres-tests jobs are
  # unchanged. Add a suite in tests/scripts/run-postgres-contract-tests.sh.
  postgres-contract-tests:
    name: Postgres Contract Tests (real migrator, REQUIRE_CONTRACT=1)
    runs-on: ubuntu-latest
    needs: [rust-check, go-build, postgres-contract-wiring]
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dataplane
          POSTGRES_PASSWORD: dataplane
          POSTGRES_DB: dataplane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataplane"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/Data Plane v2/tools/migrator/go.mod
          cache-dependency-path: |
            apps/Data Plane v2/tools/migrator/go.sum
            apps/Data Plane v2/tests/contract/postgres/go.sum
            apps/Data Plane v2/services/data-quality-go/go.sum
            apps/Data Plane v2/shared/go/go.sum

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/Data Plane v2 -> target"

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"

      - name: PostgreSQL client (psql creates the per-suite databases)
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          psql --version

      - name: Run the Postgres-gated suites (real migrator, REQUIRE_CONTRACT=1)
        # TEST_DATABASE_URL is the ADMIN connection to the throwaway service
        # above (superuser, local host, database name ending in _test); the
        # runner derives a fresh bare and a fresh migrated database per suite
        # from it. Absence of the database, a skipped gated test or a gated test
        # that is not compiled all fail the job. The counts land in the job summary.
        env:
          REQUIRE_CONTRACT: "1"
          TEST_DATABASE_URL: postgres://dataplane:dataplane@127.0.0.1:5432/dataplane_test?sslmode=disable
        run: bash tests/scripts/run-postgres-contract-tests.sh

  subject-contract:
    name: NATS subject contract lint (§17.3.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint NATS subjects
        run: bash scripts/check-subjects.sh

  # CR-T12: graph-index reaches a model through inference-core and nowhere else. The direct-Azure
  # backend and its key are deleted; this keeps the deployment from growing them back.
  graph-index-no-azure-contract:
    name: graph-index reaches a model through inference-core only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compose contract (no Azure key or endpoint, the inference-core hop, its own signing key)
        run: bash tests/scripts/graph-index-no-azure-contract-test.sh

  # CR-T13: contextual retrieval is on by default and the global flag is an incident-only kill
  # switch. The compose defaults, the model default, every variable the code reads, their
  # documentation in .env.example and the explicit off of the isolated stacks are one contract; the
  # Rust side (the compose defaults equal the code defaults, the kill switch needs a reason) runs in
  # the workspace test step above.
  contextual-retrieval-config-contract:
    name: contextual retrieval is on by default and documented
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Config contract (compose defaults, .env.example, isolated stacks, stale statements)
        run: bash tests/scripts/contextual-retrieval-config-contract-test.sh
      - name: Prove the contract can fail
        run: bash tests/scripts/contextual-retrieval-config-contract-test.sh --self-test

  # CR-T9b: the background LLM budget is read by two services (embedding-engine and graph-index)
  # from the same four variables and measured as one figure. Both compose blocks, .env.example and
  # both configurations must agree, nothing may be built in (the owner supplies the figure and the
  # prices), and the one metric must be served, scraped and alerted on. The Rust side (the spend
  # statement and the variable names equal graph-index's) runs in the workspace test step above.
  background-budget-contract:
    name: the background LLM budget is the same setting in both services and builds nothing in
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Budget contract (compose, .env.example, configurations, metric, scrape, alert)
        run: bash tests/scripts/background-budget-contract-test.sh
      - name: Prove the contract can fail
        run: bash tests/scripts/background-budget-contract-test.sh --self-test

  # CR-T14: the retrieval-quality harness. The gate (regression, coverage, keyword-index parity, the ctx-v2 promotion),
  # the ingest of the frozen corpus, the golden builder and the service client are scripts a nightly job on a
  # self-hosted runner uses against paid services; this job proves their rules without touching any of that.
  eval-harness:
    name: retrieval-quality harness (gate, corpus ingest, golden builder, service client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The frozen corpus matches its manifest (a changed byte fails)
        run: python3 scripts/eval-ingest-corpus.py verify
      - name: Python tests (gate both ways, promotion, ingest idempotency, goldens, service client)
        run: python3 -m unittest discover -s scripts/tests -p "test_eval_*.py"
      - name: Contract goldens are the same bytes on both sides (eval-evidence-v1, harness-record-v1)
        run: bash scripts/check-eval-contract.sh
      - name: Prove the drift check can fail
        run: bash scripts/check-eval-contract.sh --self-test
      - name: Shell contract (study, variant cell, evidence, records, nightly switches) against a stand-in for docker
        run: bash tests/scripts/eval-harness-contract-test.sh

  docker-smoke:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    needs: [rust-check, go-build]
    steps:
      - uses: actions/checkout@v7

      - name: Start stack
        run: |
          cp .env.example .env 2>/dev/null || true
          docker compose up -d --build --wait
        timeout-minutes: 10

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8014/health >/dev/null 2>&1; then
              echo "Services ready after ${i}s"
              break
            fi
            sleep 2
          done

      - name: Run smoke tests (HTTP only)
        run: ./scripts/smoke-test.sh --http-only

      - name: Teardown
        if: always()
        run: docker compose down -v
