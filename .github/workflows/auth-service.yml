# Physical Service Split - CI/CD Configuration

name: Auth Service CI/CD

# NOTE: this file previously filtered on 'services/auth-service/**', a path
# that has never existed in this repo (the service lives at
# apps/Control Plane/auth-core) — the workflow could never trigger. Fixed to
# the real path, same bug as user-service.yml/org-service.yml. auth-core's
# own Postgres-gated Jest specs (*.postgres.spec.ts, CONTROL_LIFECYCLE_TEST_
# DATABASE_URL) are not additionally wired here — out of scope for this fix,
# tracked as a follow-up.
on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/Control Plane/auth-core/**'
      - '.github/workflows/auth-service.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/Control Plane/auth-core/**'

env:
  SERVICE_NAME: auth-service
  REGISTRY: ghcr.io
  IMAGE_NAME: triodelab/auth-service

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'apps/Control Plane/auth-core'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'apps/Control Plane/auth-core/pnpm-lock.yaml'
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Lint
        run: pnpm run lint
      
      - name: Type check
        run: pnpm run build
      
      - name: Run tests
        run: pnpm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      
      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: 'apps/Control Plane/auth-core'
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying ${{ env.SERVICE_NAME }} to staging"
          # Add deployment commands here

  deploy-production:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to production
        run: |
          echo "Deploying ${{ env.SERVICE_NAME }} to production"
          # Add deployment commands here
