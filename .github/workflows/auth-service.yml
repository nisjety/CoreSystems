# Physical Service Split - CI/CD Configuration

name: Auth Service CI/CD

# NOTE: this file previously filtered on 'services/auth-service/**', a path
# that has never existed in this repo (the service lives at
# apps/Control Plane/auth-core) — the workflow could never trigger. Fixed to
# the real path, same bug as user-service.yml/org-service.yml. auth-core's
# own Postgres-gated Jest specs (*.postgres.spec.ts, CONTROL_LIFECYCLE_TEST_
# DATABASE_URL) are not additionally wired here — out of scope for this fix,
# tracked as a follow-up.
on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/Control Plane/auth-core/**'
      # Read by auth-core's contract specs (the system under test, so they cannot be vendored).
      - 'apps/Control Plane/config/**'
      - 'apps/Control Plane/scripts/plane-principal-registry.jq'
      - 'apps/Control Plane/scripts/run-control-plane.sh'
      - 'scripts/bootstrap_runtime_environment.sh'
      - 'scripts/tests/principal-registry-parity.test.sh'
      - 'apps/Control Plane/docker-compose.yml'
      - 'apps/Control Plane/docker-compose.production.yml'
      - '.github/workflows/auth-service.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/Control Plane/auth-core/**'
      - 'apps/Control Plane/config/**'
      - 'apps/Control Plane/scripts/plane-principal-registry.jq'
      - 'apps/Control Plane/scripts/run-control-plane.sh'
      - 'scripts/bootstrap_runtime_environment.sh'
      - 'scripts/tests/principal-registry-parity.test.sh'
      - 'apps/Control Plane/docker-compose.yml'
      - 'apps/Control Plane/docker-compose.production.yml'

env:
  SERVICE_NAME: auth-service
  REGISTRY: ghcr.io
  IMAGE_NAME: triodelab/auth-service

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'apps/Control Plane/auth-core'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'apps/Control Plane/auth-core/pnpm-lock.yaml'
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Lint
        run: pnpm run lint
      
      - name: Type check
        run: pnpm run build
      
      # The contract specs read the principal policy, the compose file and the
      # vendored goldens from the full checkout. Without REQUIRE_CONTRACT a spec
      # whose file is missing skips; with it, the absence fails the suite.
      - name: Run tests
        env:
          REQUIRE_CONTRACT: '1'
        run: pnpm test

      # The committed principal policy, the launcher and the central bootstrap
      # must produce the same registry. Runs the real scripts in hermetic
      # sandboxes (a stub docker, throwaway env files); no live secret is read.
      - name: Principal registry parity (policy, launcher, bootstrap)
        working-directory: '.'
        run: bash scripts/tests/principal-registry-parity.test.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      
      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: 'apps/Control Plane/auth-core'
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying ${{ env.SERVICE_NAME }} to staging"
          # Add deployment commands here

  deploy-production:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to production
        run: |
          echo "Deploying ${{ env.SERVICE_NAME }} to production"
          # Add deployment commands here
