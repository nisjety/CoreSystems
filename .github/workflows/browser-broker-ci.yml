name: Browser Broker CI

# Gate for the Model Plane browser-broker (Go) and the browser-grant contract
# that spans four planes. Before this file nothing built or tested the broker:
# `apps/Model Plane/go/**` had no workflow of its own, so a grant-policy
# regression (cap, ZDR, host deny-list) could only be found by hand.
#
# Four jobs:
#   broker  - vet + tests for the broker module, run through the Model Plane
#             go.work so the generated `gen/go` and `pkg/authctx` modules are
#             the in-tree ones (the broker's go.sum is deliberately not used
#             on its own: it does not carry the transitive sums).
#   integration - the tagged Postgres grant-store suite (WS1.C): PgStore and
#             Routed against a real postgres:16-alpine started by
#             testcontainers-go (Docker is preinstalled on ubuntu-latest). It
#             runs with GOWORK=off, the way it was verified: the module's own
#             go.mod/go.sum carry the testcontainers sums.
#   bootstrap-db - scripts/tests/bootstrap-broker-db.test.sh: the idempotent
#             script that creates the broker's role and database on the
#             Ingestion Plane Postgres server, run twice against a throwaway
#             postgres container. It checks that the password reaches no
#             command line and that the broker role cannot open Quarry's
#             databases. It also pins the known limit: Quarry's superuser
#             role (ingestion_user) CAN still open the broker database, so
#             the shared server separates data by database and role only.
#   contract (L1) - scripts/tests/browser-grant-contract.test.mjs: proto field
#             numbers, the Quarry vendored proto being a subset of the
#             upstream one, the single grant-minting path, and the broker's
#             compose wiring. Pure file checks, no services.
#
# The live end-to-end leg (L2) is a manual pre-merge evidence run, not CI.

on:
  pull_request:
    paths:
      - "apps/Model Plane/go/services/browser-broker/**"
      - "apps/Model Plane/go/gen/**"
      - "apps/Model Plane/go/pkg/authctx/**"
      - "apps/Model Plane/go/go.work"
      - "apps/Model Plane/proto/model_plane/v1/browser.proto"
      - "apps/Ingestion Plane/docker-compose*.yml"
      - "apps/Model Plane/deploy/docker-compose*.yml"
      - "apps/Model Plane/deploy/.env.example"
      - "apps/Model Plane/scripts/release-artifact.sh"
      - "scripts/bootstrap_runtime_environment.sh"
      - "apps/Ingestion Plane/scripts/bootstrap_broker_db.sh"
      - "scripts/tests/bootstrap-broker-db.test.sh"
      - "apps/Model Plane/rust/services/model-gateway/src/**"
      - "apps/Frontend Plane/verevonv3/apps/gateway/src/**"
      - "apps/Ingestion Plane/Quarry-v2/crates/quarry-runtime/src/grpc/**"
      - "apps/Ingestion Plane/Quarry-v2/crates/quarry-runtime/proto/browser.proto"
      - "scripts/tests/browser-grant-contract.test.mjs"
      - ".github/workflows/browser-broker-ci.yml"
  push:
    branches: [main, develop]
    paths:
      - "apps/Model Plane/go/services/browser-broker/**"
      - "apps/Model Plane/go/gen/**"
      - "apps/Model Plane/go/pkg/authctx/**"
      - "apps/Model Plane/go/go.work"
      - "apps/Model Plane/proto/model_plane/v1/browser.proto"
      - "apps/Ingestion Plane/docker-compose*.yml"
      - "apps/Model Plane/deploy/docker-compose*.yml"
      - "apps/Model Plane/deploy/.env.example"
      - "apps/Model Plane/scripts/release-artifact.sh"
      - "scripts/bootstrap_runtime_environment.sh"
      - "apps/Ingestion Plane/scripts/bootstrap_broker_db.sh"
      - "scripts/tests/bootstrap-broker-db.test.sh"
      - "apps/Model Plane/rust/services/model-gateway/src/**"
      - "apps/Frontend Plane/verevonv3/apps/gateway/src/**"
      - "apps/Ingestion Plane/Quarry-v2/crates/quarry-runtime/src/grpc/**"
      - "apps/Ingestion Plane/Quarry-v2/crates/quarry-runtime/proto/browser.proto"
      - "scripts/tests/browser-grant-contract.test.mjs"
      - ".github/workflows/browser-broker-ci.yml"

concurrency:
  group: browser-broker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  broker:
    name: Broker vet + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "apps/Model Plane/go/services/browser-broker"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "apps/Model Plane/go/go.work"
          cache-dependency-path: "apps/Model Plane/go/services/browser-broker/go.sum"
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  integration:
    name: Postgres grant store (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: "apps/Model Plane/go/services/browser-broker"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "apps/Model Plane/go/go.work"
          cache-dependency-path: "apps/Model Plane/go/services/browser-broker/go.sum"
      - name: docker is available
        run: docker version --format '{{.Server.Version}}'
      - name: go test -tags integration
        env:
          GOWORK: "off"
        run: go test -count=1 -timeout 15m -tags integration ./internal/grant/...

  bootstrap-db:
    name: Broker database bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: bootstrap_broker_db.sh against a throwaway postgres
        run: bash scripts/tests/bootstrap-broker-db.test.sh

  contract:
    name: Grant contract (L1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: browser-grant contract
        run: node --test scripts/tests/browser-grant-contract.test.mjs
