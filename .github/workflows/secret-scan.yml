name: secret-scan

# Phase 3 PR-0a: block NEW secrets from entering history.
# This gate scans only the commits in the triggering push / PR (gitleaks-action
# default behaviour) — it does NOT fail on the repo's pre-existing tracked
# findings, which are handled (rotate/redact) at push time. A reintroduced or
# brand-new secret in any new commit fails the check.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks-action calls `GET .../pulls/{n}/commits` to resolve a PR's exact
  # commit range on a `pull_request` event; contents:read alone doesn't cover
  # that endpoint and the call 403's with "Resource not accessible by
  # integration" without this. A prior commit added this, then removed it
  # again based on an unverified assumption that it didn't help (see the job
  # comment below for what was actually confirmed vs. assumed) — restored
  # after checking that no `pull_request`-triggered run had ever actually
  # exercised this permission before it was removed.
  pull-requests: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    # GitHub hard-caps the auto-issued GITHUB_TOKEN to `contents: read` for any
    # workflow run Dependabot itself triggers on a `pull_request` event — this
    # is a documented platform policy that no `permissions:` block can widen,
    # regardless of what this file requests. That part is real and confirmed
    # (Dependabot's own PR runs 403 on the pulls/commits lookup no matter
    # what). What was NOT actually confirmed: whether `pull-requests: read`
    # fixes the *general* (non-Dependabot) case. It was added, then removed
    # two minutes later on the assumption it hadn't helped — but every
    # `pull_request` run in between was still on the contents:read-only
    # config; a `push`-to-main run "passing" afterward proves nothing, since
    # gitleaks-action only hits the pulls/commits endpoint on `pull_request`
    # events. Restored the permission for that reason. Keep the skip below
    # regardless — it addresses the separate, genuinely unfixable Dependabot
    # token cap.
    if: >-
      github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout (full history for accurate commit-range scan)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          # Required since a gitleaks-action breaking change: scanning a pull
          # request now calls the GitHub API to resolve the PR's commit range,
          # and every PR run failed outright with "GITHUB_TOKEN is now
          # required to scan pull requests" without it. The workflow-run
          # token (scoped by `permissions: contents: read` above) is enough —
          # this is not a new secret, just wiring up the one every run already
          # has. https://github.com/gitleaks/gitleaks-action#-announcement
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
          # GITLEAKS_LICENSE is only required for GitHub *organisation* repos.
          # For personal/public repos it is free and may be omitted. If this
          # repo is org-owned, add the secret and uncomment:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
