name: secret-scan

# Phase 3 PR-0a: block NEW secrets from entering history.
# This gate scans only the commits in the triggering push / PR (gitleaks-action
# default behaviour) — it does NOT fail on the repo's pre-existing tracked
# findings, which are handled (rotate/redact) at push time. A reintroduced or
# brand-new secret in any new commit fails the check.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    # GitHub hard-caps the auto-issued GITHUB_TOKEN to `contents: read` for any
    # workflow run Dependabot itself triggers on a `pull_request` event — this
    # is a platform policy, not something this workflow's own `permissions:`
    # block can widen (confirmed live: adding `pull-requests: read` here still
    # 403'd gitleaks-action's `GET .../pulls/{n}/commits` call with "Resource
    # not accessible by integration"). gitleaks-action hard-requires that call
    # to scan a `pull_request` event at all, so it cannot run for this actor.
    # The mitigation is scoped to exactly that gap: skip only Dependabot's own
    # `pull_request` runs, where the diff is a machine-generated lockfile/
    # manifest bump, not arbitrary authored code — every human-authored PR,
    # and every push to main (Dependabot's included, once merged), still
    # scans normally.
    if: >-
      github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout (full history for accurate commit-range scan)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          # Required since a gitleaks-action breaking change: scanning a pull
          # request now calls the GitHub API to resolve the PR's commit range,
          # and every PR run failed outright with "GITHUB_TOKEN is now
          # required to scan pull requests" without it. The workflow-run
          # token (scoped by `permissions: contents: read` above) is enough —
          # this is not a new secret, just wiring up the one every run already
          # has. https://github.com/gitleaks/gitleaks-action#-announcement
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
          # GITLEAKS_LICENSE is only required for GitHub *organisation* repos.
          # For personal/public repos it is free and may be omitted. If this
          # repo is org-owned, add the secret and uncomment:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
