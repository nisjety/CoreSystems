name: Verevon v3 Frontend Security

# Dependency vulnerability scan for the Verevon v3 SPA (apps/Frontend Plane/verevonv3).
# GitHub Actions only executes workflows from the repository-root .github/workflows,
# so this lives at the monorepo root but is path-scoped to the v3 frontend so it
# does not fire on unrelated plane changes.
on:
  push:
    branches: [main, develop, fix/ui-premium-restore]
    paths:
      - 'apps/Frontend Plane/verevonv3/**'
      - '.github/workflows/verevonv3-security.yml'
  pull_request:
    branches: [main, develop, fix/ui-premium-restore]
    paths:
      - 'apps/Frontend Plane/verevonv3/**'
      - '.github/workflows/verevonv3-security.yml'
  # Weekly catch for newly-disclosed advisories against an unchanged tree.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit (high+)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'apps/Frontend Plane/verevonv3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: '11.3.0'

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'apps/Frontend Plane/verevonv3/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (fail on high or critical)
        run: pnpm audit --audit-level=high
