name: Verevon v3 CI

# CI gate for the Verevon v3 SPA + its Rust/axum BFF gateway
# (apps/Frontend Plane/verevonv3). GitHub Actions only executes workflows from
# the repository-root .github/workflows, so this lives at the monorepo root but
# is path-scoped to the v3 frontend so it does not fire on unrelated plane
# changes. Mirrors .github/workflows/dataplane-v2-ci.yml (itself moved to the
# root for the same reason — it used to live nested under apps/Data Plane
# v2/.github/workflows/ci.yml, where GitHub never executed it).
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/Frontend Plane/verevonv3/**'
      # The SPA's @quarry/client is generated from this spec, so a spec change
      # alters the very client the SPA compiles against.
      - 'apps/Ingestion Plane/Quarry-v2/docs/openapi.yaml'
      - 'apps/Ingestion Plane/Quarry-v2/sdks/generate.sh'
      - '.github/workflows/verevonv3-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/Frontend Plane/verevonv3/**'
      # The SPA's @quarry/client is generated from this spec, so a spec change
      # alters the very client the SPA compiles against.
      - 'apps/Ingestion Plane/Quarry-v2/docs/openapi.yaml'
      - 'apps/Ingestion Plane/Quarry-v2/sdks/generate.sh'
      - '.github/workflows/verevonv3-ci.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Phase 0 fabrication guard: zero-tolerance allowlist asserting that the
  # de-faked / security-fixed surfaces are not silently re-introduced.
  fabrication-guard:
    name: Fabrication guard (no fake "live" state)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assert no fabricated state was re-introduced
        run: |
          set -uo pipefail
          gw="apps/Frontend Plane/verevonv3/apps/gateway/src"
          spa="apps/Frontend Plane/verevonv3/src"
          fail=0
          # PR-1: the cross-tenant IDOR helper must never return — org is derived
          # server-side via crate::upstream::authorized_org_id.
          if grep -rIl 'fn org_id_from_headers' "$gw" >/dev/null 2>&1; then
            echo "::error::org_id_from_headers reintroduced — derive org via authorized_org_id"
            grep -rIn 'fn org_id_from_headers' "$gw"; fail=1
          fi
          # PR-2: social demo data / in-memory store must stay gone.
          if grep -rIlE 'demo_accounts|demo_posts|SocialStore' "$gw" >/dev/null 2>&1; then
            echo "::error::social demo data / SocialStore reintroduced"
            grep -rInE 'demo_accounts|demo_posts|SocialStore' "$gw"; fail=1
          fi
          # The dev-auth-bypass token may appear only in the two SPA API clients.
          stray=$(grep -rIl 'Bearer dev-bypass' "$spa" 2>/dev/null | grep -vE '/shared/api/(http|sse)(\.test)?\.ts$' || true)
          if [ -n "$stray" ]; then
            echo "::error::'Bearer dev-bypass' found outside src/shared/api/http.ts and sse.ts:"
            echo "$stray"; fail=1
          fi
          # Phase 2 PR-0: no NEW gateway domain may read org from a client header.
          # Org is derived server-side via crate::upstream::authorized_org_id; the
          # client-supplied org headers are stripped at ingress (middleware.rs).
          # (a) Both org headers must remain STRIPPED_HEADERS list entries.
          for h in x-org-id x-verevon-org-id; do
            if ! grep -qE "^[[:space:]]*\"$h\"," "$gw/middleware.rs"; then
              echo "::error::\"$h\" missing from STRIPPED_HEADERS in middleware.rs — the client org header must stay stripped at ingress"
              fail=1
            fi
          done
          # (b) No domain may READ a client/forwarded org header in PRODUCTION
          # code — that is the cross-tenant IDOR vector. Header reads only
          # ever live in the ingress-strip regression tests (middleware.rs /
          # main.rs) or in a domain file's OWN trailing test module, which
          # this crate's clippy lints (items_after_test_module) guarantee
          # always starts at that file's `#[cfg(test)]` marker and runs to
          # EOF — e.g. a wiremock assertion that the gateway forwarded the
          # server-validated org outward, proving this exact guard's intent
          # rather than violating it. Only the portion of each file BEFORE
          # that marker is checked.
          domain_violations=""
          while IFS= read -r -d '' file; do
            hit=$(sed '/^#\[cfg(test)\]/,$d' "$file" | grep -nE 'get\("x-(verevon-)?org-id"' || true)
            if [ -n "$hit" ]; then
              domain_violations="${domain_violations}${file}:\n${hit}\n"
            fi
          done < <(find "$gw/domains" -name '*.rs' -print0)
          if [ -n "$domain_violations" ]; then
            echo "::error::a gateway domain reads a client org header — derive org via authorized_org_id, never x-org-id/x-verevon-org-id:"
            printf '%b' "$domain_violations"; fail=1
          fi
          # Phase 2 PR-6: the fabricated "US region default" residency/timezone option
          # must not return. Real IANA timezones (Europe/Oslo, America/New_York) are
          # fine; a synthetic "region default" conflating residency with a timezone is not.
          if grep -rInE 'region default' "$spa" >/dev/null 2>&1; then
            echo "::error::fabricated 'region default' residency option found in the SPA — use a real IANA timezone, never a labelled US/non-EU region:"
            grep -rInE 'region default' "$spa"; fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "Fabrication guard passed."

  gateway-rust:
    name: Gateway — fmt + clippy + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'apps/Frontend Plane/verevonv3/apps/gateway'
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/Frontend Plane/verevonv3/apps/gateway -> target'
          # One-time cache-buster (2026-09-08): a restored target/ directory's
          # artifact mtimes can land after the just-checked-out source's, so
          # cargo's freshness check treated an already-linted crate as still
          # up to date and clippy kept reporting a stale prior commit's
          # findings under `-D warnings`. Bump this key's suffix again only
          # if the same class of staleness recurs.
          prefix-key: 'v1-cachebust-2026-09-08'

      - name: Check formatting
        run: cargo fmt --check

      # Scoped to the gateway crate only (no --workspace) so unrelated
      # workspace members (e.g. inference-core) cannot fail this gate.
      - name: Clippy (deny warnings, all targets)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

  spa-verify:
    name: SPA — lint + typecheck + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'apps/Frontend Plane/verevonv3'
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.3.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'apps/Frontend Plane/verevonv3/pnpm-lock.yaml'

      # @quarry/client is a GENERATED SDK: sdks/generate.sh writes it from
      # Quarry's openapi.yaml, and Quarry's .gitignore keeps everything but the
      # markdown docs out of the repo. package.json depends on it by `file:`
      # path, so `pnpm install --frozen-lockfile` cannot resolve it until it
      # exists -- and its `types` field points at dist/, so it must also be
      # compiled before tsc can see a single one of its types. Without this
      # step a clean checkout fails at INSTALL, not at a legible type error.
      - name: Generate and build the Quarry TypeScript SDK
        working-directory: 'apps/Ingestion Plane/Quarry-v2/sdks'
        run: |
          ./generate.sh
          cd typescript
          pnpm install --ignore-scripts
          pnpm run build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (lint -> typecheck -> test -> build)
        run: pnpm verify

  docker-image:
    name: Docker — production SPA image
    runs-on: ubuntu-latest
    # Keep the image gate separate from the host SPA gate: Docker must prove
    # that the frontend context can consume the generated Ingestion Plane SDK,
    # not merely that a prior workspace install happened to create it.
    steps:
      - uses: actions/checkout@v7

      - name: Generate and build the Quarry TypeScript SDK
        working-directory: 'apps/Ingestion Plane/Quarry-v2/sdks'
        run: |
          ./generate.sh
          cd typescript
          corepack enable
          pnpm install --ignore-scripts
          pnpm run build

      - uses: docker/setup-buildx-action@v3

      - name: Build production image with the named SDK context
        working-directory: 'apps/Frontend Plane/verevonv3'
        run: >-
          docker buildx build
          --target production
          --build-context 'quarry-client=../../Ingestion Plane/Quarry-v2/sdks/typescript'
          --tag verevonv3-ci:${{ github.sha }}
          --load
          .
