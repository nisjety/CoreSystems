name: Verevon v3 CI

# CI gate for the Verevon v3 SPA + its Rust/axum BFF gateway
# (apps/Frontend Plane/verevonv3). GitHub Actions only executes workflows from
# the repository-root .github/workflows, so this lives at the monorepo root but
# is path-scoped to the v3 frontend so it does not fire on unrelated plane
# changes. Mirrors .github/workflows/dataplane-v2-ci.yml (itself moved to the
# root for the same reason — it used to live nested under apps/Data Plane
# v2/.github/workflows/ci.yml, where GitHub never executed it).
on:
  pull_request:
    branches: [main, develop, fix/ui-premium-restore]
    paths:
      - 'apps/Frontend Plane/verevonv3/**'
      # The SPA's @quarry/client is generated from this spec, so a spec change
      # alters the very client the SPA compiles against.
      - 'apps/Ingestion Plane/Quarry-v2/docs/openapi.yaml'
      - 'apps/Ingestion Plane/Quarry-v2/sdks/generate.sh'
      - 'apps/Ingestion Plane/Quarry-v2/sdks/typescript/docs/**'
      # The committed Python SDK smoke tests run in spa-verify (see the step
      # "Test the generated Quarry Python SDK"), so editing them must trigger it.
      - 'apps/Ingestion Plane/Quarry-v2/sdks/python/tests/**'
      - '.github/workflows/verevonv3-ci.yml'
  push:
    branches: [main, develop, fix/ui-premium-restore]
    paths:
      - 'apps/Frontend Plane/verevonv3/**'
      # The SPA's @quarry/client is generated from this spec, so a spec change
      # alters the very client the SPA compiles against.
      - 'apps/Ingestion Plane/Quarry-v2/docs/openapi.yaml'
      - 'apps/Ingestion Plane/Quarry-v2/sdks/generate.sh'
      - 'apps/Ingestion Plane/Quarry-v2/sdks/typescript/docs/**'
      # The committed Python SDK smoke tests run in spa-verify (see the step
      # "Test the generated Quarry Python SDK"), so editing them must trigger it.
      - 'apps/Ingestion Plane/Quarry-v2/sdks/python/tests/**'
      - '.github/workflows/verevonv3-ci.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Phase 0 fabrication guard: zero-tolerance allowlist asserting that the
  # de-faked / security-fixed surfaces are not silently re-introduced.
  fabrication-guard:
    name: Fabrication guard (no fake "live" state)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assert no fabricated state was re-introduced
        run: |
          set -uo pipefail
          gw="apps/Frontend Plane/verevonv3/apps/gateway/src"
          spa="apps/Frontend Plane/verevonv3/src"
          fail=0
          # PR-1: the cross-tenant IDOR helper must never return — org is derived
          # server-side via crate::upstream::authorized_org_id.
          if grep -rIl 'fn org_id_from_headers' "$gw" >/dev/null 2>&1; then
            echo "::error::org_id_from_headers reintroduced — derive org via authorized_org_id"
            grep -rIn 'fn org_id_from_headers' "$gw"; fail=1
          fi
          # PR-2: social demo data / in-memory store must stay gone.
          if grep -rIlE 'demo_accounts|demo_posts|SocialStore' "$gw" >/dev/null 2>&1; then
            echo "::error::social demo data / SocialStore reintroduced"
            grep -rInE 'demo_accounts|demo_posts|SocialStore' "$gw"; fail=1
          fi
          # The dev-auth-bypass token may appear only in the two SPA API clients.
          stray=$(grep -rIl 'Bearer dev-bypass' "$spa" 2>/dev/null | grep -vE '/shared/api/(http|sse)(\.test)?\.ts$' || true)
          if [ -n "$stray" ]; then
            echo "::error::'Bearer dev-bypass' found outside src/shared/api/http.ts and sse.ts:"
            echo "$stray"; fail=1
          fi
          # Phase 2 PR-0: no NEW gateway domain may read org from a client header.
          # Org is derived server-side via crate::upstream::authorized_org_id; the
          # client-supplied org headers are stripped at ingress (middleware.rs).
          # (a) Both org headers must remain STRIPPED_HEADERS list entries.
          for h in x-org-id x-verevon-org-id; do
            if ! grep -qE "^[[:space:]]*\"$h\"," "$gw/middleware.rs"; then
              echo "::error::\"$h\" missing from STRIPPED_HEADERS in middleware.rs — the client org header must stay stripped at ingress"
              fail=1
            fi
          done
          # (b) No domain may READ a client/forwarded org header in PRODUCTION
          # code — that is the cross-tenant IDOR vector. Header reads only
          # ever live in the ingress-strip regression tests (middleware.rs /
          # main.rs) or in a domain file's OWN trailing test module, which
          # this crate's clippy lints (items_after_test_module) guarantee
          # always starts at that file's `#[cfg(test)]` marker and runs to
          # EOF — e.g. a wiremock assertion that the gateway forwarded the
          # server-validated org outward, proving this exact guard's intent
          # rather than violating it. Only the portion of each file BEFORE
          # that marker is checked.
          domain_violations=""
          while IFS= read -r -d '' file; do
            hit=$(sed '/^#\[cfg(test)\]/,$d' "$file" | grep -nE 'get\("x-(verevon-)?org-id"' || true)
            if [ -n "$hit" ]; then
              domain_violations="${domain_violations}${file}:\n${hit}\n"
            fi
          done < <(find "$gw/domains" -name '*.rs' -print0)
          if [ -n "$domain_violations" ]; then
            echo "::error::a gateway domain reads a client org header — derive org via authorized_org_id, never x-org-id/x-verevon-org-id:"
            printf '%b' "$domain_violations"; fail=1
          fi
          # Phase 2 PR-6: the fabricated "US region default" residency/timezone option
          # must not return. Real IANA timezones (Europe/Oslo, America/New_York) are
          # fine; a synthetic "region default" conflating residency with a timezone is not.
          if grep -rInE 'region default' "$spa" >/dev/null 2>&1; then
            echo "::error::fabricated 'region default' residency option found in the SPA — use a real IANA timezone, never a labelled US/non-EU region:"
            grep -rInE 'region default' "$spa"; fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "Fabrication guard passed."

  gateway-rust:
    name: Gateway — fmt + clippy + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'apps/Frontend Plane/verevonv3/apps/gateway'
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/Frontend Plane/verevonv3/apps/gateway -> target'
          # One-time cache-buster (2026-09-08): a restored target/ directory's
          # artifact mtimes can land after the just-checked-out source's, so
          # cargo's freshness check treated an already-linted crate as still
          # up to date and clippy kept reporting a stale prior commit's
          # findings under `-D warnings`. Bump this key's suffix again only
          # if the same class of staleness recurs.
          prefix-key: 'v1-cachebust-2026-09-08'

      - name: Check formatting
        run: cargo fmt --check

      # Scoped to the gateway crate only (no --workspace) so unrelated
      # workspace members (e.g. inference-core) cannot fail this gate.
      - name: Clippy (deny warnings, all targets)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

  spa-verify:
    name: SPA — lint + typecheck + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'apps/Frontend Plane/verevonv3'
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.3.0'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'apps/Frontend Plane/verevonv3/pnpm-lock.yaml'

      # @quarry/client is a GENERATED SDK: sdks/generate.sh writes it from
      # Quarry's openapi.yaml, and Quarry's .gitignore keeps everything but the
      # markdown docs out of the repo. package.json depends on it by `file:`
      # path, so `pnpm install --frozen-lockfile` cannot resolve it until it
      # exists -- and its `types` field points at dist/, so it must also be
      # compiled before tsc can see a single one of its types. Without this
      # step a clean checkout fails at INSTALL, not at a legible type error.
      - name: Generate the Quarry SDKs
        working-directory: 'apps/Ingestion Plane/Quarry-v2/sdks'
        run: ./generate.sh

      # The markdown docs of the TypeScript SDK (sdks/typescript/docs) are the one
      # part of the generated SDK that is committed. generate.sh just rewrote them
      # from docs/openapi.yaml with the pinned generator image (7.22.0, byte-identical
      # across runs), so any difference from the committed copy means the spec
      # changed and the docs were not regenerated. `git status` (not `git diff`)
      # so that a page the spec added and nobody committed fails too. Costs no
      # extra generation: this reuses the step above and only compares files.
      # This job's default working-directory is apps/Frontend Plane/verevonv3, and a
      # plain pathspec is relative to the cwd: from there it names a directory that
      # does not exist, matches nothing and exits 0 (the gate could never fail). So
      # the step runs in the sdks directory and compares '.', which does not depend
      # on where the repository is checked out. The count line makes an empty
      # comparison visible in the log.
      - name: Check the committed SDK docs match the spec
        working-directory: 'apps/Ingestion Plane/Quarry-v2/sdks'
        run: |
          tracked="$(git ls-files -- typescript/docs | wc -l)"
          echo "Comparing $tracked committed SDK docs pages with the regeneration"
          if [ "$tracked" -lt 100 ]; then
            echo "::error::Fewer than 100 committed pages under sdks/typescript/docs: the comparison would prove nothing."
            exit 1
          fi
          drift="$(git status --porcelain -- .)"
          if [ -n "$drift" ]; then
            echo "::error::The committed Quarry SDK docs differ from a regeneration of docs/openapi.yaml."
            echo "Run apps/Ingestion Plane/Quarry-v2/sdks/generate.sh and commit the changed pages of sdks/typescript/docs:"
            echo "$drift"
            git diff --stat -- .
            exit 1
          fi

      # The Python SDK smoke tests (sdks/python/tests/test_smoke.py, committed) run
      # against the package generate.sh just wrote to sdks/python/quarry_client
      # (git-ignored). They catch a spec change that breaks the Python models, and a
      # test that constructs a oneOf wrapper wrongly. A throwaway venv keeps the
      # runner's Python untouched; the cost is one pip install of five small wheels
      # and a test run of under ten seconds (measured: 28 tests, 8.6 s).
      # Failure surface to know about: the step needs PyPI. pytest is pinned to
      # the 8.x line so a new major release cannot break spa-verify unannounced;
      # the generated package's own requirements are the ranges generate.sh wrote.
      # If PyPI is down, this step (and so spa-verify) fails for a reason that is
      # not the SPA: re-run it, or drop the step if PyPI flakiness ever outweighs
      # the value of the SDK tests.
      - name: Test the generated Quarry Python SDK
        working-directory: 'apps/Ingestion Plane/Quarry-v2/sdks/python'
        run: |
          python3 -m venv "$RUNNER_TEMP/quarry-py"
          "$RUNNER_TEMP/quarry-py/bin/pip" install --quiet -r requirements.txt 'pytest>=8,<9'
          PYTHONPATH=. "$RUNNER_TEMP/quarry-py/bin/python" -m pytest tests -q

      - name: Build the Quarry TypeScript SDK
        working-directory: 'apps/Ingestion Plane/Quarry-v2/sdks/typescript'
        run: |
          pnpm install --ignore-scripts
          pnpm run build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @verevon/remote-core (packages/remote-core) is a `workspace:*` dep that
      # RemoteSupportPage.tsx imports. `pnpm install` only links the workspace
      # package -- it does not run remote-core's own `build` script -- and its
      # package.json `main`/`types`/`exports` all point at dist/, which is
      # gitignored. Without this step a clean checkout fails typecheck with
      # "Cannot find module '@verevon/remote-core'" (plus cascading
      # implicit-any errors in the same file) rather than a legible build error.
      - name: Build @verevon/remote-core workspace package
        run: pnpm --filter @verevon/remote-core run build

      - name: Verify (lint -> typecheck -> test -> build)
        run: pnpm verify

      # This file uses node:test, which Vitest cannot run, so vite.config.ts keeps it
      # out of Vitest and this step is the one that runs it.
      - name: Bundle budget script test
        run: node --test scripts/check-bundle-budget.test.mjs

      # Shrink-only gzipped budget over the build that `pnpm verify` just wrote.
      # On a pull request the base commit is fetched shallowly, so a change cannot
      # raise a ceiling above the base branch's (--base-ref).
      - name: Bundle budget (gzipped entry chunk and total JS)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            node scripts/check-bundle-budget.mjs --base-ref FETCH_HEAD
          else
            node scripts/check-bundle-budget.mjs
          fi

  # UI copy and raw-colour gate for the chat and agents surfaces, plus every
  # product file this change adds under src/. It is its own job so a red
  # spa-verify (lint, typecheck, tests) cannot hide it. Existing findings are
  # baselined in eslint-suppressions.json: the ESLint CLI fails when the tree has
  # more findings than the baseline (a new leak) or fewer (a fixed leak that was
  # not pruned from the baseline in the same change).
  spa-ui-gates:
    name: SPA — UI copy and raw-colour gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'apps/Frontend Plane/verevonv3'
    steps:
      - uses: actions/checkout@v7
        with:
          # The new-file scan diffs against the base commit, so it needs history.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.3.0'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'apps/Frontend Plane/verevonv3/pnpm-lock.yaml'

      # Same as spa-verify: package.json depends on the generated Quarry SDK by
      # file: path, so the install cannot resolve without it.
      - name: Generate and build the Quarry TypeScript SDK
        working-directory: 'apps/Ingestion Plane/Quarry-v2/sdks'
        run: |
          ./generate.sh
          cd typescript
          pnpm install --ignore-scripts
          pnpm run build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Chat and agents against the baseline
        run: pnpm exec eslint -c eslint.ui-gates.config.js src

      - name: Product files this change adds
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base="${PR_BASE_SHA:-$PUSH_BEFORE_SHA}"
          # A push that creates the branch has no previous tip to diff against.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=HEAD~1
          fi
          node scripts/ui-gates-new-files.mjs "$base"

  # Stack-free browser fixtures: the chunk-recovery Playwright project runs against
  # a production build served by `vite preview`. It needs no gateway, Control Plane
  # or Docker stack, because its stale-chunk case is answered in the browser
  # (tests/e2e/chunk-recovery.spec.ts). Its own job, so a red here cannot hide
  # behind spa-verify.
  spa-browser-fixtures:
    name: SPA - stack-free browser fixtures
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'apps/Frontend Plane/verevonv3'
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.3.0'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'apps/Frontend Plane/verevonv3/pnpm-lock.yaml'

      # Same as spa-verify: the build resolves the generated Quarry SDK and
      # @verevon/remote-core through their dist/ output, so both must exist first.
      - name: Generate and build the Quarry TypeScript SDK
        working-directory: 'apps/Ingestion Plane/Quarry-v2/sdks'
        run: |
          ./generate.sh
          cd typescript
          pnpm install --ignore-scripts
          pnpm run build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @verevon/remote-core workspace package
        run: pnpm --filter @verevon/remote-core run build

      - name: Production build
        run: pnpm exec vite build

      - name: Install Chromium with its system dependencies
        run: pnpm exec playwright install --with-deps chromium

      # The preview server lives only for this step. Its log is printed when the
      # step fails, because the server is what failed to answer.
      - name: chunk-recovery project against the production preview
        run: |
          pnpm exec vite preview --port 5176 --strictPort > "$RUNNER_TEMP/vite-preview.log" 2>&1 &
          preview_pid=$!
          trap 'status=$?; kill "$preview_pid" 2>/dev/null || true; if [ "$status" -ne 0 ]; then cat "$RUNNER_TEMP/vite-preview.log"; fi' EXIT
          curl --silent --show-error --fail --retry 30 --retry-connrefused --retry-delay 1 --output /dev/null http://localhost:5176/
          pnpm exec playwright test --project=chunk-recovery

  docker-image:
    name: Docker — production SPA image
    runs-on: ubuntu-latest
    # Keep the image gate separate from the host SPA gate: Docker must prove
    # that the frontend context can consume the generated Ingestion Plane SDK,
    # not merely that a prior workspace install happened to create it.
    steps:
      - uses: actions/checkout@v7

      - name: Generate and build the Quarry TypeScript SDK
        working-directory: 'apps/Ingestion Plane/Quarry-v2/sdks'
        run: |
          ./generate.sh
          cd typescript
          corepack enable
          pnpm install --ignore-scripts
          pnpm run build

      - uses: docker/setup-buildx-action@v3

      - name: Build production image with the named SDK context
        working-directory: 'apps/Frontend Plane/verevonv3'
        run: >-
          docker buildx build
          --target production
          --build-context 'quarry-client=../../Ingestion Plane/Quarry-v2/sdks/typescript'
          --build-arg SOURCE_REVISION=${{ github.sha }}
          --build-arg BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          --tag verevonv3-ci:${{ github.sha }}
          --load
          .

      # WS07-S2: the nginx config (with the shared security-headers snippet) must
      # parse in the image that ships, and the cache/header rules must hold.
      - name: nginx config test in the built image
        run: docker run --rm --entrypoint nginx verevonv3-ci:${{ github.sha }} -t

      - name: Header smoke (version.json, index.html, assets)
        run: |
          cid=$(docker run -d -p 8080:8080 verevonv3-ci:${{ github.sha }})
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          curl --silent --fail --retry 20 --retry-connrefused --retry-delay 1 --output /dev/null http://localhost:8080/index.html
          vj=$(curl -sI http://localhost:8080/version.json)
          echo "$vj"
          echo "$vj" | grep -i '^cache-control: no-store'
          echo "$vj" | grep -i '^content-type: application/json'
          echo "$vj" | grep -i '^content-security-policy:'
          ix=$(curl -sI http://localhost:8080/index.html)
          echo "$ix" | grep -i '^cache-control: no-cache'
          echo "$ix" | grep -i '^x-content-type-options: nosniff'
          wd=$(curl -sI http://localhost:8080/boot-watchdog.js)
          echo "$wd" | grep -i '^cache-control: no-cache'
          asset=$(curl -s http://localhost:8080/index.html | grep -o '/assets/[^"]*\.js' | head -1)
          curl -sI "http://localhost:8080$asset" | grep -i 'immutable'

  # Interactive demo (stage 04). The committed bundle must equal a fresh build, and the built demo
  # must pass its privacy probe. Scripts and budgets: scripts/build-product-demo.mjs and
  # scripts/probe-product-demo.mjs in the SPA package.
  demo-product-build:
    name: SPA — interactive demo bundle (manifest, rebuild, privacy probe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'apps/Frontend Plane/verevonv3'
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.3.0'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'apps/Frontend Plane/verevonv3/pnpm-lock.yaml'

      # Same SDK step as the other SPA jobs: @quarry/client is a file: dependency.
      - name: Generate and build the Quarry TypeScript SDK
        working-directory: 'apps/Ingestion Plane/Quarry-v2/sdks'
        run: |
          ./generate.sh
          cd typescript
          pnpm install --ignore-scripts
          pnpm run build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Manifest is current with its sources (no build)
        run: node scripts/build-product-demo.mjs --verify

      - name: Rebuild the demo; the committed bundle must not change
        run: |
          node scripts/build-product-demo.mjs
          changed=$(git status --porcelain --untracked-files=all -- apps/verevon-web/public/product-demo)
          if [ -n "$changed" ]; then
            echo "::error::The committed demo bundle differs from a fresh build. Rebuild from a clean tree with node scripts/build-product-demo.mjs and commit the result."
            echo "$changed"
            exit 1
          fi

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Privacy and smoke probe of the demo
        run: node scripts/probe-product-demo.mjs
