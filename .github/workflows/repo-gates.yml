# Repo-root gates (build plan WS12 S9-S11): plane-boundary, log-content and file
# size ratchets live under scripts/gates/. This file is the shared trigger shell;
# each gate adds its own job in the PR that introduces it.
name: Repo gates
on:
  pull_request:
    paths:
      - 'scripts/gates/**'
      - 'scripts/tests/**'
      - 'apps/**'
      - '.github/workflows/repo-gates.yml'
  push:
    branches: [main, fix/ui-premium-restore]
    paths:
      - 'scripts/gates/**'
      - 'scripts/tests/**'
      - 'apps/**'
      - '.github/workflows/repo-gates.yml'
jobs:
  buf-lint-ratchet-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: buf lint ratchet unit tests
        run: python3 -m unittest scripts/tests/test_buf_lint_ratchet.py
  log-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: log-content gate unit tests
        run: python3 -m unittest scripts/tests/test_log_content.py
      # Advisory for the first three runs (rollout convention): record the failing
      # set, then drop continue-on-error so the gate blocks.
      - name: log-content gate
        continue-on-error: true
        run: python3 scripts/gates/log-content.py --check
  size-ratchet:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 keeps the base commits, so --base-ref can read the baseline
      # and the cap the change is compared against.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: size ratchet unit tests
        run: python3 -m unittest scripts/tests/test_size_ratchet.py
      # Advisory for the first three runs (rollout convention): record the failing
      # set, then drop continue-on-error so the gate blocks.
      - name: size ratchet
        continue-on-error: true
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # The script fails closed when the base does not resolve.
            python3 scripts/gates/size-ratchet.py --check --base-ref "origin/$BASE_REF"
          elif git rev-parse --verify --quiet "$BEFORE_SHA^{commit}" > /dev/null; then
            python3 scripts/gates/size-ratchet.py --check --base-ref "$BEFORE_SHA"
          else
            echo "::notice::no previous commit to compare with (new branch); checking growth only"
            python3 scripts/gates/size-ratchet.py --check
          fi
  plane-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: plane boundary gate unit tests
        run: python3 -m unittest scripts/tests/test_plane_boundary.py
      # Advisory for the first three runs (rollout convention): record the failing
      # set, then drop continue-on-error so the gate blocks.
      - name: plane boundary gate
        continue-on-error: true
        run: python3 scripts/gates/plane-boundary.py --check
