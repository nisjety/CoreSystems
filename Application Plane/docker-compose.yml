name: application-plane

services:
  # ============================================================================
  # 1) Convex Backend - runtime + sqlite storage
  # ============================================================================

  convex-backend:
    image: ghcr.io/get-convex/convex-backend:latest
    container_name: convex-backend
    restart: unless-stopped
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 20s
    ports:
      - "3210:3210"  # Backend API
      - "3211:3211"  # HTTP Actions
    volumes:
      - convex-data:/data
      - ./convex-core/convex:/app/convex:ro
    environment:
      # Instance configuration
      CONVEX_INSTANCE_NAME: ${CONVEX_INSTANCE_NAME:-coresystem-local}
      CONVEX_INSTANCE_SECRET: ${CONVEX_INSTANCE_SECRET:-926e27b2f16124ab7a47d9f62eb0a2244a9b1b61b9b5486c2bc9afddfc6579e9}
      INSTANCE_SECRET: ${CONVEX_INSTANCE_SECRET:-926e27b2f16124ab7a47d9f62eb0a2244a9b1b61b9b5486c2bc9afddfc6579e9}
      INSTANCE_NAME: ${CONVEX_INSTANCE_NAME:-coresystem-local}

      # Database configuration
      CONVEX_STORAGE_TYPE: sqlite
      CONVEX_SQLITE_PATH: /data/convex.db

      # Service URLs (cross-plane via triodelab-net)
      AI_CORE_URL: ${AI_CORE_URL:-http://ai-core:8000}
      ORG_CORE_URL: ${ORG_CORE_URL:-http://org-core-service:8080}
      AUTH_SERVER_URL: ${AUTH_SERVER_URL:-http://auth-service:3011}

      # Auth configuration
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-here}
      JWT_ISSUER: ${JWT_ISSUER:-auth.coresystem.local}

      # Logging
      RUST_LOG: ${RUST_LOG:-info}
      CONVEX_LOG_FORMAT: json
      CONVEX_DISABLE_BEACON: "true"
    networks:
      - app-net
      - triodelab-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3210/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ============================================================================
  # 2) Convex Dashboard - UI
  # ============================================================================

  convex-dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    container_name: convex-dashboard
    restart: unless-stopped
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 15s
    ports:
      - "6791:6791"
    environment:
      CONVEX_BACKEND_URL: http://convex-backend:3210
      NODE_ENV: ${NODE_ENV:-development}
    networks:
      - app-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      convex-backend:
        condition: service_healthy

  # ============================================================================
  # 3) Convex Gateway - dev gateway / schema push
  # ============================================================================

  convex-gateway:
    build:
      context: ./convex-core
      dockerfile: Dockerfile
    container_name: convex-gateway
    restart: unless-stopped
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 15s
    env_file:
      - ./convex-core/.env.local
    environment:
      CONVEX_BACKEND_URL: http://convex-backend:3210
    ports:
      - "3005:3000"
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'npx convex dev' || pgrep -f 'node' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      convex-backend:
        condition: service_healthy

  # ============================================================================
  # 4) Convex Subscriber - sync fra Control Plane NATS
  # ============================================================================

  convex-subscriber:
    build:
      context: ./convex-core
      dockerfile: Dockerfile
    container_name: convex-subscriber
    restart: unless-stopped
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 15s
    command: ["node", "nats-subscriber.js"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'nats-subscriber' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    env_file:
      - ./convex-core/.env.local
    environment:
      # controlplane-nats is now on triodelab-net — no more host.docker.internal hack
      NATS_URL: nats://controlplane-nats:4222
      NATS_SHARED_URL: nats://triodelab-nats:4222
      NATS_SHARED_TOKEN: "aqencia-shared-nats-token-2026"
      CONVEX_BACKEND_URL: http://convex-backend:3210
    networks:
      - app-net
      - triodelab-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      convex-backend:
        condition: service_healthy

  # ============================================================================
  # 5) Planner Yjs Sync - shared websocket transport
  # ============================================================================

  planner-yjs-sync:
    build:
      context: ./yjs-sync
      dockerfile: Dockerfile
    container_name: planner-yjs-sync
    restart: unless-stopped
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 15s
    ports:
      - "47813:1234"
    environment:
      HOST: 0.0.0.0
      PORT: 1234
    networks:
      - app-net
      - triodelab-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # 6) AFFiNE Backend - app + postgres + redis
  # ============================================================================

  affine:
    image: ghcr.io/toeverything/affine:stable
    container_name: affine-server
    profiles: ["affine"]
    restart: unless-stopped
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 20s
    depends_on:
      affine-postgres:
        condition: service_healthy
      affine-redis:
        condition: service_healthy
      affine-migration:
        condition: service_completed_successfully
    ports:
      - "47810:3010"
    environment:
      NODE_ENV: production
      DEPLOYMENT_TYPE: selfhosted
      AFFINE_SERVER_HTTPS: "false"
      DATABASE_URL: postgresql://affine:${AFFINE_POSTGRES_PASSWORD:-affine_secret}@affine-postgres:5432/affine
      REDIS_SERVER_HOST: affine-redis
      AFFINE_INDEXER_ENABLED: "false"
    volumes:
      - affine-uploads:/root/.affine/storage
      - affine-config:/root/.affine/config
    networks:
      - app-net
      - triodelab-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3010/info').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  affine-migration:
    image: ghcr.io/toeverything/affine:stable
    container_name: affine-migration-job
    profiles: ["affine"]
    depends_on:
      affine-postgres:
        condition: service_healthy
      affine-redis:
        condition: service_healthy
    command: ["sh", "-c", "node ./scripts/self-host-predeploy.js"]
    environment:
      NODE_ENV: production
      DEPLOYMENT_TYPE: selfhosted
      AFFINE_SERVER_HTTPS: "false"
      DATABASE_URL: postgresql://affine:${AFFINE_POSTGRES_PASSWORD:-affine_secret}@affine-postgres:5432/affine
      REDIS_SERVER_HOST: affine-redis
      AFFINE_INDEXER_ENABLED: "false"
    volumes:
      - affine-uploads:/root/.affine/storage
      - affine-config:/root/.affine/config
    networks:
      - app-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  affine-postgres:
    image: pgvector/pgvector:pg16
    container_name: affine-postgres
    profiles: ["affine"]
    restart: unless-stopped
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 15s
    environment:
      POSTGRES_DB: affine
      POSTGRES_USER: affine
      POSTGRES_PASSWORD: ${AFFINE_POSTGRES_PASSWORD:-affine_secret}
    ports:
      - "47811:5432"
    volumes:
      - affine-postgres-data:/var/lib/postgresql/data
    networks:
      - app-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affine -d affine"]
      interval: 5s
      timeout: 5s
      retries: 10

  affine-redis:
    image: redis:7-alpine
    container_name: affine-redis
    profiles: ["affine"]
    restart: unless-stopped
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 15s
    ports:
      - "47812:6379"
    networks:
      - app-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  convex-data:
    driver: local
  affine-uploads:
    external: true
    name: affine-core_affine_uploads
  affine-config:
    external: true
    name: affine-core_affine_config
  affine-postgres-data:
    external: true
    name: affine-core_postgres_data

networks:
  # Privat nettverk for Application plane
  app-net:
    name: app-net
    driver: bridge

  # Shared nettverk for cross-plane app-til-app kommunikasjon
  triodelab-net:
    external: true
    name: triodelab-net
    labels:
      com.docker.compose.network: "triodelab-net"
      com.docker.compose.project: "triodelab"